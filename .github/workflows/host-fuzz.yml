# Runs the Hypothesis property/fuzz tests in tests/fuzz/.
# - On a PR that changes a polyhost module those tests import, tests/fuzz/, the
#   requirements or this file: the whole package on the default profile (50 examples
#   per test, about 1 s), plus a check that the paths: list below still matches what
#   tests/fuzz imports (scripts/fuzz_paths.py --check).
# - Every Wednesday and Sunday at 02:17 UTC, on main: one job per module on the
#   "nightly" profile (200000 examples per test). Each job restores and saves its
#   Hypothesis example database (.hypothesis/), so an input that failed once is
#   tried first in the next run. A failed module opens an issue (report-failure).
# - Actions tab -> "Host fuzz" -> "Run workflow": the same long run, with a choice of
#   profile.
name: Host fuzz

permissions:
  contents: read

on:
  pull_request:
    # Generated by scripts/fuzz_paths.py; the PR job fails if it drifts.
    paths:
      - 'tests/fuzz/**'
      - 'requirements.txt'
      - 'requirements-test.txt'
      - 'scripts/fuzz_paths.py'
      - '.github/workflows/host-fuzz.yml'
      - 'polyhost/__init__.py'
      - 'polyhost/device/__init__.py'
      - 'polyhost/device/bit_packing.py'
      - 'polyhost/device/bulk_pipe.py'
      - 'polyhost/device/cmd_composer.py'
      - 'polyhost/device/command_ids.py'
      - 'polyhost/device/device_settings.py'
      - 'polyhost/device/hid_fontpack.py'
      - 'polyhost/device/hid_helper.py'
      - 'polyhost/device/im_converter.py'
      - 'polyhost/device/keys.py'
      - 'polyhost/device/overlay_cache.py'
      - 'polyhost/device/overlay_data.py'
      - 'polyhost/device/poly_kybd.py'
      - 'polyhost/device/prc_packing.py'
      - 'polyhost/device/split_link.py'
      - 'polyhost/device/synthetic_overlay.py'
      - 'polyhost/handler/__init__.py'
      - 'polyhost/handler/common.py'
      - 'polyhost/i18n.py'
      - 'polyhost/input/__init__.py'
      - 'polyhost/input/unicode_input.py'
      - 'polyhost/server/__init__.py'
      - 'polyhost/server/control_server.py'
      - 'polyhost/server/mpc_listener.py'
      - 'polyhost/server/protocol.py'
      - 'polyhost/server/window_report_server.py'
      - 'polyhost/services/__init__.py'
      - 'polyhost/services/agents/__init__.py'
      - 'polyhost/services/agents/cloud_hook.py'
      - 'polyhost/services/agents/cloud_relay.py'
      - 'polyhost/services/agents/hook_log.py'
      - 'polyhost/services/agents/hooks.py'
      - 'polyhost/services/agents/model.py'
      - 'polyhost/services/agents/remote.py'
      - 'polyhost/services/fontpack_reader.py'
      - 'polyhost/services/game_assets/__init__.py'
      - 'polyhost/services/game_assets/apex_keys.py'
      - 'polyhost/services/game_assets/build.py'
      - 'polyhost/services/game_assets/dither.py'
      - 'polyhost/services/game_assets/generals/__init__.py'
      - 'polyhost/services/game_assets/key_files.py'
      - 'polyhost/services/game_assets/keys/__init__.py'
      - 'polyhost/services/game_assets/openra.py'
      - 'polyhost/services/game_assets/openra_keys.py'
      - 'polyhost/services/game_assets/poe2_keys.py'
      - 'polyhost/services/game_assets/poe_keys.py'
      - 'polyhost/services/game_assets/readers.py'
      - 'polyhost/services/game_assets/sc2_keys.py'
      - 'polyhost/services/game_assets/starcraft/__init__.py'
      - 'polyhost/services/game_assets/starcraft/explode.py'
      - 'polyhost/services/game_assets/starcraft/grp.py'
      - 'polyhost/services/game_assets/starcraft/mpq.py'
      - 'polyhost/services/game_assets/starcraft/reader.py'
      - 'polyhost/services/game_assets/tf2_keys.py'
      - 'polyhost/services/game_assets/unreal2/__init__.py'
      - 'polyhost/services/game_assets/unreal2/bindings.py'
      - 'polyhost/services/game_assets/warcraft3/__init__.py'
      - 'polyhost/services/game_assets/westwood_d2/__init__.py'
      - 'polyhost/services/game_assets/westwood_d2/pak.py'
      - 'polyhost/services/game_assets/westwood_d2k/__init__.py'
      - 'polyhost/services/game_assets/westwood_d2k/r16.py'
      - 'polyhost/services/game_assets/westwood_ra/__init__.py'
      - 'polyhost/services/game_assets/westwood_ra/mix.py'
      - 'polyhost/services/game_assets/westwood_ra/reader.py'
      - 'polyhost/services/game_assets/westwood_td/__init__.py'
      - 'polyhost/services/game_assets/westwood_td/reader.py'
      - 'polyhost/services/game_assets/westwood_td/westwood.py'
      - 'polyhost/services/iso_lang_country.py'
      - 'polyhost/services/keycode_text.py'
      - 'polyhost/services/log_bundle.py'
      - 'polyhost/services/macro_body.py'
      - 'polyhost/services/macro_label.py'
      - 'polyhost/services/qmk_keycodes.py'
      - 'polyhost/services/shortcut_relay.py'
      - 'polyhost/services/shortcut_source/__init__.py'
      - 'polyhost/services/shortcut_source/model.py'
      - 'polyhost/services/tutorials/__init__.py'
      - 'polyhost/services/tutorials/loader.py'
      - 'polyhost/settings.py'
      - 'polyhost/util/__init__.py'
      - 'polyhost/util/crash_log.py'
      - 'polyhost/util/filelock.py'
      - 'polyhost/util/fw_checkout.py'
      - 'polyhost/util/log_util.py'
      - 'polyhost/util/math_util.py'
      - 'polyhost/util/prc_codec.py'
      - 'polyhost/util/rle_util.py'
  schedule:
    - cron: '17 2 * * 0,3'   # Sunday and Wednesday, 02:17 UTC
  workflow_dispatch:
    inputs:
      profile:
        description: 'Hypothesis profile'
        type: choice
        default: nightly
        options: [nightly, fuzz]

jobs:
  pr:
    name: fuzz tests (default profile)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        # The hid package loads the system hidapi library at import time.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libhidapi-hidraw0
          pip install -q -r requirements.txt "hypothesis>=6.100" pyyaml
      - name: paths list matches what tests/fuzz imports
        run: python scripts/fuzz_paths.py --check
      - name: Run tests/fuzz
        run: python -m unittest discover -s tests/fuzz -t . -p "*_fuzz_test.py" -v

  modules:
    name: list fuzz modules
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v6
      - id: list
        run: |
          list=$(ls tests/fuzz/*_fuzz_test.py | xargs -n1 basename | sed 's/\.py$//' \
            | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().split()))')
          echo "list=$list" >> "$GITHUB_OUTPUT"

  long:
    name: fuzz ${{ matrix.module }}
    needs: modules
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.list) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        # The hid package loads the system hidapi library at import time.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libhidapi-hidraw0
          pip install -q -r requirements.txt "hypothesis>=6.100"
      - name: Restore the example database of the previous run
        uses: actions/cache/restore@v4
        with:
          path: .hypothesis
          key: host-fuzz-db-${{ matrix.module }}-${{ github.run_id }}
          restore-keys: host-fuzz-db-${{ matrix.module }}-
      - name: Run the module
        env:
          POLYKYBD_HYPOTHESIS_PROFILE: ${{ inputs.profile || 'nightly' }}
          MODULE: tests.fuzz.${{ matrix.module }}
        # Hypothesis writes the database only when an example fails; the folder must
        # exist for the cache save below.
        run: |
          mkdir -p .hypothesis
          python -m unittest -v "$MODULE"
      - name: Save the example database for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .hypothesis
          key: host-fuzz-db-${{ matrix.module }}-${{ github.run_id }}

  # After a scheduled run, open one issue per module whose "Run the module" step
  # failed (label fuzz-crash), or comment on the open issue for that module. A job
  # that failed earlier (install, cache) opens no issue. A separate job, so the job
  # that runs code never gets issues: write; this one checks out nothing.
  report-failure:
    name: report fuzz failures
    needs: long
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open or update one issue per failed module
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create fuzz-crash --repo "$REPO" --color B60205 \
            --description "A scheduled fuzz run found a failure" 2>/dev/null || true
          failed=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select((.name | startswith("fuzz ")) and any(.steps[]?; .name == "Run the module" and .conclusion == "failure")) | .name | ltrimstr("fuzz ")')
          if [ -z "$failed" ]; then echo "No module step failed (the failure was elsewhere)."; exit 0; fi
          for module in $failed; do
            title="Fuzz failure: $module"
            body="The scheduled host fuzz run $RUN_URL failed in \`tests/fuzz/$module.py\`.

          The job log shows the falsifying example Hypothesis found. Reproduce it with
          \`POLYKYBD_HYPOTHESIS_PROFILE=fuzz python -m unittest tests.fuzz.$module\`; the
          saved example database makes the next scheduled run try it first."
            num=$(gh issue list --repo "$REPO" --state open --label fuzz-crash \
              --search "\"$title\" in:title" --json number,title \
              --jq "map(select(.title == \"$title\")) | .[0].number // empty")
            if [ -n "$num" ]; then
              gh issue comment "$num" --repo "$REPO" --body "Failed again: $RUN_URL"
            else
              gh issue create --repo "$REPO" --title "$title" --label fuzz-crash --body "$body"
            fi
          done
