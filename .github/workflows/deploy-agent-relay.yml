name: Deploy agent relay

# Deploys agent-relay/ (the Cloudflare Worker that carries the state of Claude
# Code cloud sessions to the host's agent keys). Same pattern as
# deploy-telemetry.yml, and the same two repository secrets:
#   CLOUDFLARE_API_TOKEN   - the "Edit Cloudflare Workers" token
#   CLOUDFLARE_ACCOUNT_ID  - the account the Worker lives in
#
# The Worker serves polyhost/services/agents/cloud_hook.py to the cloud
# environments, so a change to that file deploys the relay too.

on:
  push:
    branches: [main]
    paths:
      - 'agent-relay/**'
      - 'polyhost/services/agents/cloud_hook.py'
      - '.github/workflows/deploy-agent-relay.yml'
  pull_request:
    paths:
      - 'agent-relay/**'
      - 'polyhost/services/agents/cloud_hook.py'
      - '.github/workflows/deploy-agent-relay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-agent-relay
  cancel-in-progress: false

jobs:
  # On a PR: build without credentials, then run the end-to-end test against
  # `wrangler dev` (local Durable Objects, no Cloudflare account).
  check:
    name: Validate and test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0 (Node 24)
        with:
          persist-credentials: false
      - name: wrangler deploy --dry-run
        working-directory: agent-relay
        run: npx --yes wrangler@4.119.0 deploy --dry-run --outdir=/tmp/worker-build
      - name: End-to-end test against wrangler dev
        working-directory: agent-relay
        run: |
          set -uo pipefail
          npx --yes wrangler@4.119.0 dev --port 8799 --ip 127.0.0.1 > /tmp/wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8799/ 2>/dev/null | grep -q "agent relay" && break
            sleep 2
          done
          python3 test/e2e_test.py -v
          status=$?
          [ $status -eq 0 ] || tail -50 /tmp/wrangler-dev.log
          exit $status

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0 (Node 24)
        with:
          persist-credentials: false
      - name: wrangler deploy
        working-directory: agent-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Pinned to an exact version: this step hands the token to whatever npm
        # resolves (see deploy-telemetry.yml).
        run: npx --yes wrangler@4.119.0 deploy
      - name: Smoke-test the deployed Worker
        run: |
          set -uo pipefail
          base=https://polyhost-agent-relay.polykybd.workers.dev
          for attempt in 1 2 3 4 5; do
            body=$(curl -fsS --max-time 20 "$base/" || true)
            script=$(curl -fsS --max-time 20 "$base/v1/hook.py" | head -c 200 || true)
            case "$body|$script" in
              *"PolyHost agent relay"*"|"*"Agent keys for Claude Code cloud sessions"*)
                echo "OK (attempt $attempt)"
                exit 0 ;;
            esac
            echo "attempt $attempt: unexpected response: ${body:-<none>}"
            sleep 5
          done
          echo "::error::the deployed relay did not serve its banner and hook script"
          exit 1
