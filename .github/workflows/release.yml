name: Release

on:
  # A bare `v*` tag push is normally suppressed because release tags land on the
  # auto-bump "[skip ci]" commit — so in practice releases are created by
  # publishing in the GitHub UI, which fires `release: published`. Both are
  # handled below.
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      # ── refuse a tag whose tree declares a different version ────────────────
      # The host ships no built asset: `polyhost/services/updater.py` downloads
      # `archive/refs/tags/<tag>.tar.gz` and decides there is an update by
      # comparing the INSTALLED `__version__` against the version in the tag
      # (`_version_from_tag`). So a release published before its version bump has
      # merged hands the user a tarball whose `_version.py` still declares the
      # previous number: the install succeeds, `__version__` never reaches the
      # tag, and every subsequent check offers the same update again — an endless
      # update to itself, with nothing anywhere saying why.
      #
      # wincompose shipped this failure through its own mechanism (wincompose#21,
      # PK-0.9.19: assets named 0.9.18, About tab 0.9.18, `status.txt` unbumpable
      # for two weeks) and now asserts the built version against the tag. This is
      # the same gate for the host, and qmk_firmware has the matching one for
      # FW_VERSION.
      #
      # ⚠️ FAILING THE JOB RETRACTS NOTHING, so on a mismatch this step WITHDRAWS the
      # release itself. The firmware repo's copy of this gate prevents harm by not
      # uploading: refuse, and there is no download. This workflow uploads nothing, so
      # there is no asset to withhold — what the updater installs is GitHub's own
      # `archive/refs/tags/<tag>.tar.gz`, which exists because the TAG exists — and on
      # the `release: published` path the release is public before this runs, since
      # publishing is what started the run. A red job beside a live, installable,
      # mislabelled release is not a gate; it is a note nobody reads in time.
      #
      # So the mismatch branch marks the release a PRERELEASE over the API. That is
      # preventive rather than advisory, because `releases/latest` excludes prereleases
      # and it is the ONLY channel `updater.py` reads — both its API path and its
      # rate-limit web fallback resolve exactly that URL. The bad release leaves every
      # updater's view at once.
      #
      # Prerelease rather than delete, deliberately: reversible by unchecking one box,
      # keeps whatever notes somebody wrote, keeps the tag where it is, and leaves the
      # human decision (move the tag, or cut the next patch) exactly where it was. The
      # step still exits 1, and a PATCH that fails says so loudly rather than letting a
      # live release read as handled.
      #
      # The pre-publish defence remains `scripts/publish_release.py` (`commit_for_version`
      # plus its create-time and tag-position gates), which refuses before anything is
      # public. This step backstops the routes that bypass the script: a release
      # published by hand in the UI, or a hand-pushed tag.
      #
      # Raised as a P1 by Greptile on PolyKybdHost#349 (detect-only was the first fix);
      # the withdrawal is the maintainer's call, taken 2026-10-10.
      #
      # ⚠️ The check reads the TAG's tree — `actions/checkout` with no `ref:` gets
      # the tagged commit for both triggers here — so `main` drifting ahead of a
      # prepared tag is harmless, which it always is, since every merge auto-bumps.
      - name: Assert the version matches the tag
        if: github.event_name == 'release' || github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          want="${TAG_NAME#v}"
          # ⚠️ `|| true`: GitHub runs this under `bash -e`, so a failing command
          # substitution would kill the step before the clean error below prints.
          have=$(python3 -c "import runpy; print(runpy.run_path('polyhost/_version.py').get('__version__',''))" 2>/dev/null || true)
          if [ -z "$have" ]; then
            echo "::error::could not read __version__ from polyhost/_version.py"
            exit 1
          fi
          if [ "$want" != "$have" ]; then
            echo "::error::Tag $TAG_NAME wants $want, but this tree declares __version__ $have."
            # Withdraw it. Failing the job retracts nothing on its own: the release is
            # already public, and the tarball the updater installs is GitHub's own
            # archive/refs/tags/<tag>.tar.gz, which exists because the TAG exists.
            #
            # `prerelease` is the lever because `releases/latest` excludes prereleases,
            # and that is the ONLY channel updater.py reads -- both its API path
            # (api.github.com/repos/<repo>/releases/latest) and its rate-limit web
            # fallback (github.com/<repo>/releases/latest, a 3xx whose Location names
            # the tag). So this takes the bad release out of every updater's view.
            #
            # Deliberately NOT a delete: reversible by unchecking one box, keeps the
            # notes somebody wrote, keeps the tag where it is, and leaves the human
            # decision (move the tag, or cut the next patch) exactly where it was.
            if [ "$EVENT" = "release" ] && [ -n "$RELEASE_ID" ]; then
              if gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" -F prerelease=true >/dev/null; then
                echo "WITHDRAWN: $TAG_NAME is marked a prerelease, so it is no longer"
                echo "releases/latest and no updater will offer it. Nothing else changed --"
                echo "the tag, the notes and any assets are where they were."
              else
                echo "::error::COULD NOT WITHDRAW IT -- DO THIS BY HAND, NOW: mark $TAG_NAME a"
                echo "prerelease (or delete it). Until you do, anyone updating gets $have"
                echo "while being told it is $want, and will be offered the same update"
                echo "forever. The gh api PATCH above failed; check the token permissions."
              fi
            elif [ "$EVENT" = "release" ]; then
              # A release event with no id should not happen; if it does, the release
              # IS public and this is the one case that must not read as reassuring.
              echo "::error::A release is public but its id was not in the event payload,"
              echo "so it could not be withdrawn automatically. MARK $TAG_NAME A PRERELEASE"
              echo "(or delete it) BY HAND, NOW."
            else
              echo "Nothing is public yet (event=$EVENT): a tag push creates no release,"
              echo "so there is nothing to withdraw. Fix the tag before publishing."
            fi
            echo "polyhost/_version.py is what the installed app reports, and the updater"
            echo "compares it against the tag. The tag has to point at a commit declaring"
            echo "$want: scripts/publish_release.py pins it there (commit_for_version), so"
            echo "this means either the version bump has not merged yet, or the tag already"
            echo "existed somewhere else -- a release never moves a tag. Recovery for both"
            echo "is in docs/releases.md."
            exit 1
          fi
          echo "__version__ $have matches tag $TAG_NAME."

      # Crafted release notes (optional): one file per tag on the unprotected
      # `release-notes` branch — release-notes/<TAG>.md, first line "# <title>",
      # the rest the body. Files are keyed by tag, so they are never overwritten
      # or deleted — the branch is an accumulating changelog archive. A missing
      # file just falls back to --generate-notes. Prepared by the
      # `polykybd-github-release` skill.
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if gh api "repos/${{ github.repository }}/contents/${TAG_NAME}.md?ref=release-notes" \
               --jq '.content' 2>/dev/null | base64 -d > _notes.md && [ -s _notes.md ]; then
            TITLE=$(head -n1 _notes.md | sed 's/^#\s*//')
            tail -n +2 _notes.md | sed '/./,$!d' > _body.md
            HAVE_NOTES=1
          else
            HAVE_NOTES=0
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            # Exists — the normal path (published in the UI). Apply crafted notes
            # from the branch if present so an empty UI-published release gets
            # filled in; otherwise leave whatever the user entered.
            if [ "$HAVE_NOTES" = "1" ]; then
              echo "Release $TAG_NAME exists — applying crafted notes (title: $TITLE)."
              gh release edit "$TAG_NAME" --title "$TITLE" --notes-file _body.md
            else
              echo "Release $TAG_NAME exists — no crafted notes on the branch, leaving as-is."
            fi
          else
            # Tag push on a non-[skip ci] commit — create it.
            if [ "$HAVE_NOTES" = "1" ]; then
              echo "Creating release $TAG_NAME with crafted notes (title: $TITLE)."
              gh release create "$TAG_NAME" --title "$TITLE" --notes-file _body.md
            else
              echo "Creating release $TAG_NAME with auto-generated notes."
              gh release create "$TAG_NAME" --generate-notes --title "PolyKybdHost $TAG_NAME"
            fi
          fi
