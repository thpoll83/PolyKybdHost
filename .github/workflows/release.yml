name: Release

on:
  # A bare `v*` tag push is normally suppressed because release tags land on the
  # auto-bump "[skip ci]" commit — so in practice releases are created by
  # publishing in the GitHub UI, which fires `release: published`. Both are
  # handled below.
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      # ── refuse a tag whose tree declares a different version ────────────────
      # The host ships no built asset: `polyhost/services/updater.py` downloads
      # `archive/refs/tags/<tag>.tar.gz` and decides there is an update by
      # comparing the INSTALLED `__version__` against the version in the tag
      # (`_version_from_tag`). So a release published before its version bump has
      # merged hands the user a tarball whose `_version.py` still declares the
      # previous number: the install succeeds, `__version__` never reaches the
      # tag, and every subsequent check offers the same update again — an endless
      # update to itself, with nothing anywhere saying why.
      #
      # wincompose shipped this failure through its own mechanism (wincompose#21,
      # PK-0.9.19: assets named 0.9.18, About tab 0.9.18, `status.txt` unbumpable
      # for two weeks) and now asserts the built version against the tag. This is
      # the same gate for the host, and qmk_firmware has the matching one for
      # FW_VERSION.
      #
      # ⚠️ On this repo the check DETECTS, it cannot PREVENT — do not read it as a
      # gate in the sense the firmware repo's is. There, the assets are uploaded by the
      # workflow, so refusing withholds the download. Here the workflow uploads nothing:
      # what the updater installs is GitHub's own `archive/refs/tags/<tag>.tar.gz`, which
      # exists because the TAG exists. And on the `release: published` path the release
      # is already public before this runs — publishing is what started the run. So a
      # mismatch caught here leaves a live, installable, mislabelled release, and
      # failing the job is all this step does about it.
      #
      # That is still worth having, because the alternative is silence: the defect is
      # invisible from the release page and shows up only as users being offered the
      # same update forever. The real pre-publish defence is `scripts/publish_release.py`
      # (`commit_for_version` plus its create-time and tag-position gates), which refuses
      # before anything is public; this step backstops the routes that bypass the script
      # — a release published by hand in the UI, or a hand-pushed tag — and turns a
      # permanent quiet failure into a red run plus a manual withdrawal.
      #
      # Raised as a P1 by Greptile on PolyKybdHost#349, which is correct.
      #
      # ⚠️ The check reads the TAG's tree — `actions/checkout` with no `ref:` gets
      # the tagged commit for both triggers here — so `main` drifting ahead of a
      # prepared tag is harmless, which it always is, since every merge auto-bumps.
      - name: Assert the version matches the tag
        if: github.event_name == 'release' || github.ref_type == 'tag'
        env:
          TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          want="${TAG_NAME#v}"
          # ⚠️ `|| true`: GitHub runs this under `bash -e`, so a failing command
          # substitution would kill the step before the clean error below prints.
          have=$(python3 -c "import runpy; print(runpy.run_path('polyhost/_version.py').get('__version__',''))" 2>/dev/null || true)
          if [ -z "$have" ]; then
            echo "::error::could not read __version__ from polyhost/_version.py"
            exit 1
          fi
          if [ "$want" != "$have" ]; then
            echo "::error::Tag $TAG_NAME wants $want, but this tree declares __version__ $have."
            if [ "${{ github.event_name }}" = "release" ]; then
              echo "WITHDRAW THE RELEASE NOW: it is already public, and failing this job does"
              echo "not retract it. The tarball the updater installs is GitHub's own"
              echo "archive/refs/tags/$TAG_NAME.tar.gz, which exists because the tag does, so"
              echo "anyone updating right now gets $have while being told it is $want -- and"
              echo "will be offered the same update forever. Delete the release (or mark it a"
              echo "prerelease, which drops it out of releases/latest) before anything else."
            fi
            echo "polyhost/_version.py is what the installed app reports, and the updater"
            echo "compares it against the tag. The tag has to point at a commit declaring"
            echo "$want: scripts/publish_release.py pins it there (commit_for_version), so"
            echo "this means either the version bump has not merged yet, or the tag already"
            echo "existed somewhere else -- a release never moves a tag. Recovery for both"
            echo "is in docs/releases.md."
            exit 1
          fi
          echo "__version__ $have matches tag $TAG_NAME."

      # Crafted release notes (optional): one file per tag on the unprotected
      # `release-notes` branch — release-notes/<TAG>.md, first line "# <title>",
      # the rest the body. Files are keyed by tag, so they are never overwritten
      # or deleted — the branch is an accumulating changelog archive. A missing
      # file just falls back to --generate-notes. Prepared by the
      # `polykybd-github-release` skill.
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if gh api "repos/${{ github.repository }}/contents/${TAG_NAME}.md?ref=release-notes" \
               --jq '.content' 2>/dev/null | base64 -d > _notes.md && [ -s _notes.md ]; then
            TITLE=$(head -n1 _notes.md | sed 's/^#\s*//')
            tail -n +2 _notes.md | sed '/./,$!d' > _body.md
            HAVE_NOTES=1
          else
            HAVE_NOTES=0
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            # Exists — the normal path (published in the UI). Apply crafted notes
            # from the branch if present so an empty UI-published release gets
            # filled in; otherwise leave whatever the user entered.
            if [ "$HAVE_NOTES" = "1" ]; then
              echo "Release $TAG_NAME exists — applying crafted notes (title: $TITLE)."
              gh release edit "$TAG_NAME" --title "$TITLE" --notes-file _body.md
            else
              echo "Release $TAG_NAME exists — no crafted notes on the branch, leaving as-is."
            fi
          else
            # Tag push on a non-[skip ci] commit — create it.
            if [ "$HAVE_NOTES" = "1" ]; then
              echo "Creating release $TAG_NAME with crafted notes (title: $TITLE)."
              gh release create "$TAG_NAME" --title "$TITLE" --notes-file _body.md
            else
              echo "Creating release $TAG_NAME with auto-generated notes."
              gh release create "$TAG_NAME" --generate-notes --title "PolyKybdHost $TAG_NAME"
            fi
          fi
