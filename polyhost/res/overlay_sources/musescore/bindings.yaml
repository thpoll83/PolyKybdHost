# MuseScore Studio 4 shortcut overlays for PolyKybd (Windows, Linux and macOS).
#
# The defaults of MuseScore Studio 4.7.5, read from its shortcut files:
# src/app/configs/data/shortcuts.xml (Windows and Linux) and shortcuts_mac.xml.
# See SOURCES.md.
#   CMDCTRL          Qt's "Ctrl": Ctrl on Windows/Linux, Cmd on macOS.
#   CTRL             the Control key on every platform (Paste Half/Double
#                    Duration are Control+Shift on the Mac too).
#   ALT              Alt / Option.
#   only: / except:  the six keys the Mac file defines differently, and Redo,
#                    which Qt binds to Ctrl+Y on Windows and Ctrl+Shift+Z on
#                    Linux and macOS (so Linux gets its own set).
#
# ⚠️ Many MuseScore keys change meaning by context (score, text editing, TAB
# note input). The set draws the score-view meaning: letters A-G enter notes,
# digits 1-9 pick a duration. SOURCES.md lists the keys left out.
#
# Regenerate:
#   python polyhost/res/overlay_sources/musescore/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/musescore/bindings.yaml --preview /tmp/musescore_preview
app: musescore
match: [musescore4, musescore studio, musescore 4, mscore, musescore]
output: musescore_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

bindings:
  # --- file and edit ---
  - { key: N, mods: [CMDCTRL], label: "New" }
  - { key: O, mods: [CMDCTRL], label: "Open" }
  - { key: S, mods: [CMDCTRL], label: "Save" }
  - { key: S, mods: [CMDCTRL, SHIFT], label: "Save as" }
  - { key: W, mods: [CMDCTRL], icon: close.png, label: "Close score" }
  - { key: P, mods: [CMDCTRL], label: "Print" }
  - { key: Z, mods: [CMDCTRL], label: "Undo" }
  - { key: Y, mods: [CTRL], label: "Redo", only: [windows] }
  - { key: Z, mods: [CMDCTRL, SHIFT], label: "Redo", except: [windows] }
  - { key: X, mods: [CMDCTRL], label: "Cut" }
  - { key: C, mods: [CMDCTRL], label: "Copy" }
  - { key: V, mods: [CMDCTRL], label: "Paste" }
  - { key: DEL, mods: [], label: "Delete" }
  - { key: A, mods: [CMDCTRL], label: "Select all" }
  - { key: F, mods: [CMDCTRL], label: "Find" }
  - { key: X, mods: [CMDCTRL, SHIFT], icon: swap.png, label: "Swap with clipboard" }
  - { key: Q, mods: [CTRL, SHIFT], icon: pastehalf.png, label: "Paste half duration" }
  - { key: W, mods: [CTRL, SHIFT], icon: pastedouble.png, label: "Paste double duration" }

