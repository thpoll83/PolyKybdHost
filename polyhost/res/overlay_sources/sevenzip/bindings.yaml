# 7-Zip File Manager shortcut overlays for PolyKybd.
#
# Shortcuts come from 7-Zip's OWN manual (Menu Items and Shortcut Keys), so this
# is the documented set rather than a third-party summary. See SOURCES.md.
#
# ⚠️ 7-Zip is an F-KEY app in the Norton Commander tradition -- F2 rename,
# F5 copy, F6 move, F7 new folder, F9 second panel -- so most of this overlay
# lands in the NO-MODIFIER layer, which is unusual and is the point: those keys
# do nothing in most apps and everything here.
#
# Icons: Microsoft Fluent UI System Icons (MIT). Program mark (ESC, all layers):
# the shared license-clean letter tile reading "7z".
#
# Regenerate:
#   python polyhost/res/overlay_sources/sevenzip/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/sevenzip/bindings.yaml --preview /tmp/7z_preview
app: 7-zip
match: [7zfm, 7zg]
output: sevenzip_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

# ⚠️ NO `program_icon:` HERE, DELIBERATELY -- the ESC mark comes from the
# CURATED GENERIC in `polyhost/res/app_icons.yaml` (mdi:folder-zip) instead of a
# baked cell. Both exist and the baked one WINS: `send_overlays_mru` defers a
# synthetic source on any (modifier, keycode) a template already drew, so a
# `program_icon:` here would mean the generic is never uploaded.
#
# The generic reads better at 40x40 than the letter tile it replaced, and it is
# also 8 px wider -- the auto-fetch path fixes the mark at the right-hand 40x40
# square, while a baked one here was 42x34.
#
# ⚠️ The trade, stated because it is invisible from this file: a baked mark
# ALWAYS draws, a fetched one needs `shortcut_icon_auto_fetch` (default on) and
# one successful download. Offline with a cold cache, ESC stays blank.

bindings:
  # --- no modifier: the Commander F-keys (primary A channel) ------------
  - { key: F2, mods: [], icon: rename.png,    label: Rename,        source: "ms-fluent/Rename (MIT)" }
  - { key: F3, mods: [], icon: view.png,      label: "View file",   source: "ms-fluent/Eye (MIT)" }
  - { key: F4, mods: [], icon: edit.png,      label: "Edit file",   source: "ms-fluent/Text Edit Style (MIT)" }
  - { key: F5, mods: [], icon: copyto.png,    label: "Copy to…",    source: "ms-fluent/Copy (MIT)" }
  - { key: F6, mods: [], icon: moveto.png,    label: "Move to…",    source: "ms-fluent/Arrow Forward (MIT)" }
  - { key: F7, mods: [], icon: newfolder.png, label: "New folder",  source: "ms-fluent/Folder Add (MIT)" }
  - { key: F9, mods: [], icon: twopanel.png,  label: "Second panel", source: "ms-fluent/Split Vertical (MIT)" }
  - { key: TAB, mods: [], icon: switchpanel.png, label: "Switch panel", source: "ms-fluent/Arrow Swap (MIT)" }
  - { key: BACKSPACE, mods: [], icon: parent.png, label: "Up one folder", source: "ms-fluent/Folder Arrow Up (MIT)" }
  - { key: BACKSLASH, mods: [], icon: root.png,   label: "Root folder",   source: "ms-fluent/Home (MIT)" }

  # --- Shift (primary B channel) ----------------------------------------
  - { key: F4, mods: [SHIFT], icon: newfile.png, label: "New file", source: "ms-fluent/Document Add (MIT)" }

  # --- Ctrl (primary R channel) -----------------------------------------
  # ⚠️ 7-Zip-specific and NOT the obvious meanings: Ctrl+Z sets a file COMMENT
  # (not undo), and Ctrl+C copies the file NAME to the clipboard (not the file).
  - { key: Z, mods: [CTRL], icon: comment.png,  label: "Set comment",         source: "ms-fluent/Comment Note (MIT)" }
  - { key: C, mods: [CTRL], icon: copyname.png, label: "Copy file name",      source: "ms-fluent/Clipboard Letter (MIT)" }
  - { key: R, mods: [CTRL], icon: refresh.png,  label: Refresh,               source: "ms-fluent/Arrow Sync (MIT)" }
  # view modes
  - { key: "1", mods: [CTRL], icon: largeicons.png, label: "Large icons", source: "ms-fluent/Grid (MIT)" }
  - { key: "2", mods: [CTRL], icon: smallicons.png, label: "Small icons", source: "ms-fluent/Apps List (MIT)" }
  - { key: "3", mods: [CTRL], icon: listview.png,   label: List,          source: "ms-fluent/Text Bullet List Square (MIT)" }
  - { key: "4", mods: [CTRL], icon: details.png,    label: Details,       source: "ms-fluent/Document Table (MIT)" }
  # sorting  (Ctrl + F3..F7)
  - { key: F3, mods: [CTRL], icon: sortname.png, label: "Sort by name", source: "ms-fluent/Text Sort Ascending (MIT)" }
  - { key: F4, mods: [CTRL], icon: sorttype.png, label: "Sort by type", source: "ms-fluent/Filter (MIT)" }
  - { key: F5, mods: [CTRL], icon: sortdate.png, label: "Sort by date", source: "ms-fluent/Calendar (MIT)" }
  - { key: F6, mods: [CTRL], icon: sortsize.png, label: "Sort by size", source: "ms-fluent/Data Bar Vertical (MIT)" }
  - { key: F7, mods: [CTRL], icon: unsorted.png, label: Unsorted,       source: "ms-fluent/Arrow Sort (MIT)" }
  - { key: PGDN, mods: [CTRL], icon: openfolder.png, label: "Open as folder", source: "ms-fluent/Folder Zip (MIT)" }

  # --- Alt (primary G channel) ------------------------------------------
  - { key: ENTER, mods: [ALT], icon: props.png,      label: Properties,        source: "ms-fluent/Info (MIT)" }
  - { key: F1,    mods: [ALT], icon: addrleft.png,   label: "Left panel path",  source: "ms-fluent/Panel Left (MIT)" }
  - { key: F2,    mods: [ALT], icon: addrright.png,  label: "Right panel path", source: "ms-fluent/Panel Right (MIT)" }
  - { key: F12,   mods: [ALT], icon: history.png,    label: "Folder history",   source: "ms-fluent/History (MIT)" }
  - { key: UP,    mods: [ALT], icon: otherpanel.png, label: "Same folder, other panel", source: "ms-fluent/Arrow Export Up (MIT)" }
