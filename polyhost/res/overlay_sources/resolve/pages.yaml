# DaVinci Resolve: one overlay set per page, for the page reporter
# (resolve-plugin/). gen_pages.py writes bindings_<page>.yaml from this file;
# edit this file, never the generated ones, then run:
#
#   .venv/bin/python polyhost/res/overlay_sources/resolve/gen_pages.py
#   for p in media cut edit fusion color fairlight deliver; do
#     .venv/bin/python scripts/generate_app_overlays.py \
#         polyhost/res/overlay_sources/resolve/bindings_$p.yaml; done
#
# Shortcuts: Blackmagic's DaVinci Resolve 20 Reference Manual (the default
# "DaVinci Resolve" keyboard preset). The manual writes them in macOS form;
# Command is CMDCTRL here (Ctrl on Windows and Linux) and Option is ALT. The
# `ref:` of each binding is the manual chapter it was read from (SOURCES.md ->
# "Per-page sets"). The bindings.yaml set stays the fallback when no page is
# reported.

common:   # on every page
  - { key: S, mods: [CMDCTRL], icon: save.png, label: "Save project", ref: "Ch. 3" }
  - { key: Z, mods: [CMDCTRL], icon: undo.png, label: Undo, ref: "Ch. 2" }
  - { key: Z, mods: [CMDCTRL, SHIFT], icon: redo.png, label: Redo, ref: "Ch. 36" }
  - { key: "2", mods: [SHIFT], icon: pagemedia.png, label: "Media page", ref: "Workspace > Switch to Page" }
  - { key: "3", mods: [SHIFT], icon: pagecut.png, label: "Cut page", ref: "Workspace > Switch to Page" }
  - { key: "4", mods: [SHIFT], icon: pageedit.png, label: "Edit page", ref: "Workspace > Switch to Page" }
  - { key: "5", mods: [SHIFT], icon: pagefusion.png, label: "Fusion page", ref: "Workspace > Switch to Page" }
  - { key: "6", mods: [SHIFT], icon: pagecolor.png, label: "Color page", ref: "Workspace > Switch to Page" }
  - { key: "7", mods: [SHIFT], icon: pagefairlight.png, label: "Fairlight page", ref: "Workspace > Switch to Page" }
  - { key: "8", mods: [SHIFT], icon: pagedeliver.png, label: "Deliver page", ref: "Workspace > Switch to Page" }

transport: &transport   # pasted into the pages that have a timeline viewer
  - { key: SPACE, mods: [], icon: play.png, label: "Play / Stop", ref: "Ch. 35" }
  - { key: J, mods: [], icon: rev.png, label: "Play reverse", ref: "Ch. 35" }
  - { key: K, mods: [], icon: stop.png, label: Stop, ref: "Ch. 35" }
  - { key: L, mods: [], icon: fwd.png, label: "Play forward", ref: "Ch. 35" }
  - { key: I, mods: [], icon: markin.png, label: "Mark In", mode: alpha, ref: "Ch. 35" }
  - { key: O, mods: [], icon: markout.png, label: "Mark Out", mode: alpha, ref: "Ch. 35" }

