# GitHub Copilot CLI for PolyKybd (draft).
#
# Keys: the bundled JS of @github/copilot 0.0.399 (the last JavaScript release;
# later releases are native binaries), package/index.js. Key handling is Ink
# useInput handlers; the /help dialog (slash command "/help", `cmd:"ctrl+x \u2192 /"`
# list) and the footer hint component (`shortcut:"shift+tab",description:"cycle mode"`)
# list the user-visible keys. Copilot CLI has no key-binding configuration.
#
# Esc shows the program mark (Esc cancels; Esc twice within 500 ms opens rewind).
# No macOS set: Copilot runs in a terminal, where Cmd keys never reach it.
# Plain typing keys (/, !, @) and readline editing keys (Ctrl+A/K/W/H, arrows,
# Alt+Left/Right) are left out.
#
# Regenerate:
#   python polyhost/res/overlay_sources/aicli/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/aicli/copilot_cli.yaml --preview /tmp/copilot_cli_preview
app: "GitHub Copilot CLI"
match: [copilot]
output: copilot_cli_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: copilot.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- Global: /help "global" list (cmd:"ctrl+c", cmd:"ctrl+d", cmd:"ctrl+l") ---
  # Ctrl+C: aborts running tools / the agent turn first, then clears typed input,
  # then (idle, empty) shows "ctrl+c again to exit". Labelled for the most common use.
  - { key: C, mods: [CTRL], icon: stop.png, label: "Interrupt / exit" }
  # Ctrl+L: the input handler submits "/clear" (new conversation; help says "clear the screen").
  - { key: L, mods: [CTRL], icon: clear.png, label: "Clear" }
  # Ctrl+D is left out: the help text says "shutdown", but the only handler
  # found in the input component queues the typed message. Not checked on an
  # install, so neither label is drawn.

  # --- Timeline: /help "timeline" list, active when the input is empty ---
  - { key: O, mods: [CTRL], icon: transcript.png, label: "Expand recent" }
  - { key: E, mods: [CTRL], icon: expand.png, label: "Expand all" }
  # Empty input only: the "ctrl+u to show all" hint of the hidden-messages line.
  - { key: U, mods: [CTRL], icon: history.png, label: "Show earlier msgs" }

  # --- Main key handler (the useInput callback with ctrl+c / ctrl+o / ctrl+t / ctrl+y) ---
  # Ctrl+T: toggles show_reasoning; only when the model supports thinking.
  - { key: T, mods: [CTRL], icon: thinking.png, label: "Show reasoning" }
  # Ctrl+Y: opens the plan file (footer hint "ctrl+y view/edit plan", plan mode).
  - { key: Y, mods: [CTRL], icon: plan.png, label: "View / edit plan" }
  # Paste image: Alt+V, or Ctrl+V on macOS (`(platform!=="darwin"?key.meta:key.ctrl)&&"v"`).
  - { key: V, mods: [ALT], icon: pasteimage.png, label: "Paste image", except: [macos] }
  - { key: V, mods: [CTRL], icon: pasteimage.png, label: "Paste image", only: [macos] }

  # --- Input component ---
  # Footer hint `shortcut:"shift+tab",description:"cycle mode"`: interactive <-> plan.
  - { key: TAB, mods: [SHIFT], icon: permission.png, label: "Cycle mode" }
  - { key: TAB, icon: complete.png, region: [40, 32], label: "Complete" }
  # `(key.shift||key.meta)&&key.return` inserts a newline.
  - { key: ENTER, mods: [SHIFT], icon: newline.png, label: "New line" }
  - { key: ENTER, mods: [ALT], icon: newline.png, label: "New line" }
  # Queue the typed message; only with the Kitty keyboard protocol (`n&&ctrl&&return`).
  - { key: ENTER, mods: [CTRL], icon: queue.png, label: "Queue message" }
