# Aider for PolyKybd (draft).
#
# Keys: aider-chat 0.86.2. The app's own bindings are in aider/io.py,
# InputOutput.get_input(): `@kb.add(Keys.ControlZ ...)`, `@kb.add("c-up")`,
# `@kb.add("c-down")`, `@kb.add("c-x", "c-e")`, `@kb.add("escape", "enter" ...)`.
# The rest come from prompt_toolkit's emacs mode (the default; --vim changes it)
# and are listed by aider itself in aider/website/docs/usage/commands.md,
# "Keybindings" and "Interrupting with CONTROL-C". prompt_toolkit's source was
# not available offline, so those are cited from aider's docs and code only.
#
# Esc shows the program mark. No macOS set: Aider runs in a terminal, where Cmd
# keys never reach it. Enter submits (plain typing key, left out). Readline
# editing keys (Ctrl+A/B/E/F/K/Y, Ctrl+N/P line history, arrows) are left out.
#
# Regenerate:
#   python polyhost/res/overlay_sources/aicli/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/aicli/aider.yaml --preview /tmp/aider_preview
app: Aider
match: [aider]
output: aider_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: aider.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- aider/io.py, get_input() ---
  # Ctrl+Z: suspend_to_background, only where SIGTSTP exists (not Windows).
  - { key: Z, mods: [CTRL], icon: suspend.png, label: "Suspend", only: [linux, macos] }
  # Ctrl+Up / Ctrl+Down: current_buffer.history_backward / history_forward.
  - { key: UP, mods: [CTRL], icon: prev.png, label: "Previous message" }
  - { key: DOWN, mods: [CTRL], icon: next.png, label: "Next message" }
  # Alt+Enter ("escape", "enter"): inserts a newline; in /multiline-mode it
  # submits instead. Labelled for the default mode.
  - { key: ENTER, mods: [ALT], icon: newline.png, label: "New line" }

  # --- Ctrl+C: base_coder.py keyboard_interrupt() and the KeyboardInterrupt
  # handlers: stops a running reply (kept in the chat); at the prompt a second
  # Ctrl+C within 2 s exits ("^C again to exit"). Labelled for the most common use.
  - { key: C, mods: [CTRL], icon: stop.png, label: "Interrupt / exit" }

  # --- prompt_toolkit emacs mode, listed in docs/usage/commands.md ---
  - { key: R, mods: [CTRL], icon: search.png, label: "History search", concept: find }
  - { key: L, mods: [CTRL], icon: clear.png, label: "Clear screen" }
  # Ctrl+D: deletes the character under the cursor; on an empty line it raises
  # EOFError, which base_coder.py run() catches and returns (exit).
  # Labelled for the exit use.
  - { key: D, mods: [CTRL], icon: exit.png, label: "Exit (empty line)" }
