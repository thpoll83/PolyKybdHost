# Qwen Code for PolyKybd.
#
# Keys: Qwen Code's own default table, `defaultKeyBindings` (an object of
# command name to key list) in the shipped @qwen-code/qwen-code 0.26.7
# bundle (chunks/chunk-MSIOYFPM.js). It is not the same table as Gemini CLI's:
# Ctrl+X opens the editor (Gemini: Ctrl+G), Ctrl+G is IDE context, Ctrl+Q
# queues a message, Ctrl+Y retries the last prompt (Gemini: YOLO), Ctrl+F
# toggles shell input focus, Ctrl+O toggles thinking. The in-app shortcut
# list (`getShortcuts()` in chunks/startInteractiveUI-BXNSC3LR.js) confirms
# Ctrl+C/L/O/R/Y/Q/X, Ctrl+J, Ctrl+V and Shift+Tab. Each command's handler
# in that file was read for its meaning.
#
# Only the main prompt and app-level commands are used. Dialog-only keys,
# Enter and plain Tab are left out. Esc shows the program mark. No macOS set:
# Qwen Code runs in a terminal, where Cmd keys never reach it.
#
# Regenerate:
#   python polyhost/res/overlay_sources/aicli/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/aicli/qwen_code.yaml --preview /tmp/qwen_code_preview
app: "Qwen Code"
match: [qwen]
output: qwen_code_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

program_icon: qwen.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- quit / exit / clearInput ---
  # Ctrl+C is quit and clearInput: cancels the running request, clears the
  # input, and a second press exits. Labelled for the most common use.
  - { key: C, mods: [CTRL], icon: stop.png, label: "Cancel / quit" }
  # exit; ignored while the input has text.
  - { key: D, mods: [CTRL], icon: exit.png, label: "Exit (empty input)" }

  # --- input ---
  # newline: ctrl+return, return with paste, shift+return, ctrl+j
  - { key: J, mods: [CTRL], icon: newline.png, label: "Newline" }
  - { key: ENTER, mods: [SHIFT], icon: newline.png, label: "Newline" }
  - { key: ENTER, mods: [CTRL], icon: newline.png, label: "Newline" }
  # openExternalEditor
  - { key: X, mods: [CTRL], icon: editor.png, label: "External editor" }
  # pasteClipboardImage (non-Windows: ctrl+v; Windows: alt+v)
  - { key: V, mods: [CTRL], icon: pasteimage.png, label: "Paste image", only: [linux, macos] }
  - { key: V, mods: [ALT], icon: pasteimage.png, label: "Paste image", only: [windows] }
  # queueMessage: queue the text for the next turn
  - { key: Q, mods: [CTRL], icon: queue.png, label: "Queue message" }
  # retryLast
  - { key: Y, mods: [CTRL], icon: retry.png, label: "Retry last prompt" }
  # showMoreLines: with text in the input it stashes the prompt, with empty
  # input it shows the full tool output. Labelled for the empty-input use.
  - { key: S, mods: [CTRL], icon: expand.png, label: "Show more lines" }

  # --- history ---
  # reverseSearch
  - { key: R, mods: [CTRL], icon: search.png, label: "Search history" }
  # historyUp / historyDown
  - { key: P, mods: [CTRL], icon: prev.png, label: "Previous prompt" }
  - { key: N, mods: [CTRL], icon: next.png, label: "Next prompt" }

  # --- scroll ---
  - { key: UP, mods: [SHIFT], icon: scroll_up.png, label: "Scroll up" }
  - { key: DOWN, mods: [SHIFT], icon: scroll_down.png, label: "Scroll down" }
  - { key: PAGE_UP, icon: page_up.png, label: "Page up" }
  - { key: PAGE_DOWN, icon: page_down.png, label: "Page down" }
  - { key: HOME, mods: [CTRL], icon: file_start.png, label: "Scroll to top" }
  - { key: END, mods: [CTRL], icon: file_end.png, label: "Scroll to bottom" }

  # --- app ---
  # Approval mode cycle (useKeypress in the approval-mode hook: shift+tab)
  - { key: TAB, mods: [SHIFT], icon: permission.png, label: "Approval mode" }
  # clearScreen
  - { key: L, mods: [CTRL], icon: clear.png, label: "Clear screen" }
  # toggleThinkingExpanded: ctrl+o, alt+t
  - { key: O, mods: [CTRL], icon: thinking.png, label: "Expand thinking" }
  - { key: T, mods: [ALT], icon: thinking.png, label: "Expand thinking" }
  # toggleToolDescriptions
  - { key: T, mods: [CTRL], icon: tooldesc.png, label: "Tool descriptions" }
  # toggleIDEContextDetail (only in IDE mode)
  - { key: G, mods: [CTRL], icon: ide.png, label: "IDE context" }
  # promoteShellToBackground
  - { key: B, mods: [CTRL], icon: background.png, label: "Background shell" }
  # toggleShellInputFocus (only while a shell command runs)
  - { key: F, mods: [CTRL], icon: terminal.png, label: "Focus shell input" }
  # toggleRenderMode
  - { key: M, mods: [ALT], icon: markdown.png, label: "Raw markdown" }
