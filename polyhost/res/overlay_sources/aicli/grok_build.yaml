# Grok Build (xAI's `grok` CLI) for PolyKybd.
#
# Keys: the user guide shipped with the source, xai-org/grok-build at SOURCE_REV
# 559751fd (Apache-2.0), crates/codegen/xai-grok-pager/docs/user-guide/03-keyboard-shortcuts.md:
# the "Agent-Level", "Global", "Navigation (Scrollback Focused)", "View" and
# "During an active turn" tables. The binary checked is grok 1.0.77
# (@xai-official/grok-linux-x64 on npm). Bindings are built in ("cannot currently be
# remapped"). Drawn: the default simple input mode in a terminal that is not in
# the VS Code family (VS Code, Cursor, Windsurf and Zed terminals move Ctrl+L,
# Ctrl+D and Ctrl+Q).
#
# Esc shows the program mark (Esc never cancels a turn; Esc twice clears the
# prompt or opens rewind). No macOS or Linux set: no drawn key differs by OS.
# Left out: vim-mode single letters, keys that act only inside a card or
# dialog, Ctrl+D (half page down in the scrollback, quit on VS Code family),
# Alt+V (paste image, Windows only), and plain typing keys (/, !, ?).
#
# Regenerate:
#   python polyhost/res/overlay_sources/aicli/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/aicli/grok_build.yaml --preview /tmp/grok_build_preview
app: "Grok Build"
match: [grok]
output: grok_build_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

program_icon: grok.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- Global ---
  # Ctrl+Q and Ctrl+N ask for a second press within 1000 ms.
  - { key: Q, mods: [CTRL], icon: exit.png, label: "Quit (twice)" }
  - { key: N, mods: [CTRL], icon: newchat.png, label: "New session (twice)" }
  - { key: BACKSLASH, mods: [CTRL], icon: dashboard.png, label: "Agent dashboard" }

  # --- Agent-Level ---
  # Ctrl+C cancels the running turn; with a draft it clears the draft first.
  - { key: C, mods: [CTRL], icon: stop.png, label: "Cancel turn / clear" }
  - { key: P, mods: [CTRL], icon: commandpalette.png, label: "Command palette" }
  # Ctrl+M opens the model picker; with the prompt focused it toggles multiline input.
  - { key: M, mods: [CTRL], icon: model.png, label: "Model picker" }
  - { key: O, mods: [CTRL], icon: yolo.png, label: "Always-approve" }
  - { key: R, mods: [CTRL], icon: history.png, label: "Resume session" }
  # Normal -> Plan -> Auto-review (when enabled) -> Always-approve.
  - { key: TAB, mods: [SHIFT], icon: permission.png, label: "Cycle mode" }
  - { key: B, mods: [CTRL], icon: background.png, label: "Command to background" }
  - { key: T, mods: [CTRL], icon: checklist.png, label: "Todos pane" }
  - { key: G, mods: [CTRL], icon: tasks.png, label: "Tasks pane" }
  # Extensions modal; outside the VS Code family only.
  - { key: L, mods: [CTRL], icon: extensions.png, label: "Extensions" }
  - { key: S, mods: [CTRL], icon: stash.png, label: "Stash / pop draft" }
  # Ctrl+. is the primary key; it needs the Kitty keyboard protocol, so the
  # cheatsheet advertises Ctrl+X on most terminals. Ctrl+X always works.
  - { key: X, mods: [CTRL], icon: shortcuts.png, label: "Shortcuts help" }
  - { key: F2, icon: settings.png, label: "Settings" }

  # --- Prompt ---
  - { key: ENTER, mods: [SHIFT], icon: newline.png, label: "New line" }
  - { key: ENTER, mods: [ALT], icon: newline.png, label: "New line" }
  # During a turn: cancel it and send the message now (Ctrl+I is the alternate).
  - { key: ENTER, mods: [CTRL], icon: send.png, label: "Send now" }

  # --- Scrollback ---
  - { key: PAGE_UP, icon: page_up.png, label: "Scroll page" }
  - { key: PAGE_DOWN, icon: page_down.png, label: "Scroll page" }
  - { key: K, mods: [CTRL], icon: scroll_up.png, label: "Scroll line up" }
  - { key: J, mods: [CTRL], icon: scroll_down.png, label: "Scroll line down" }
  - { key: U, mods: [CTRL], icon: scroll_up.png, label: "Half page up" }
  - { key: LEFT, mods: [SHIFT], icon: prev.png, label: "Previous turn" }
  - { key: RIGHT, mods: [SHIFT], icon: next.png, label: "Next turn" }
  - { key: E, mods: [CTRL], icon: thinking.png, label: "Thinking blocks" }
