# Kimi Code CLI for PolyKybd.
#
# Keys: Kimi Code CLI 2.5.2 (npm @moonshot-ai/kimi-code; source
# github.com/MoonshotAI/kimi-code). The editor's key handler,
# `CustomEditor.handleInput()` in apps/kimi-code/src/tui/components/editor/
# custom-editor.ts, binds Ctrl+V (Alt+V on Windows), Ctrl+D, Ctrl+C, Ctrl+G,
# Ctrl+O, Ctrl+S, Ctrl+B, Ctrl+N, Shift+Tab, Ctrl+- and `!` on an empty prompt.
# What each one does is read from its handler in apps/kimi-code/src/tui/
# controllers/editor-keyboard.ts. The `/help` list (`DEFAULT_KEYBOARD_SHORTCUTS`
# in components/dialogs/help-panel.ts) confirms Shift+Tab, Ctrl+G/O/S/J/C/D,
# Shift+Enter, Esc and Up/Down.
#
# Only the main prompt is used. Dialog-only keys, Enter, plain Tab and the
# readline-style editing keys of the editor component are left out. Esc shows
# the program mark (one Esc interrupts a reply, two open the undo picker). No
# macOS set: Kimi Code runs in a terminal, where Cmd keys never reach it.
#
# Regenerate:
#   python polyhost/res/overlay_sources/aicli/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/aicli/kimi_cli.yaml --preview /tmp/kimi_cli_preview
app: "Kimi Code CLI"
match: [kimi]
output: kimi_cli_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

program_icon: kimi.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # onCtrlC: interrupts the reply or clears the input; a second press exits.
  - { key: C, mods: [CTRL], icon: stop.png, label: "Interrupt / clear" }
  # onCtrlD: exits, only on an empty input.
  - { key: D, mods: [CTRL], icon: exit.png, label: "Exit (empty input)" }

  # --- input ---
  # Shift+Enter / Ctrl+J insert a newline.
  - { key: J, mods: [CTRL], icon: newline.png, label: "Newline" }
  - { key: ENTER, mods: [SHIFT], icon: newline.png, label: "Newline" }
  # onOpenExternalEditor: $VISUAL / $EDITOR.
  - { key: G, mods: [CTRL], icon: editor.png, label: "External editor" }
  # Paste image: Ctrl+V; Windows terminals keep Ctrl+V, so Alt+V there.
  - { key: V, mods: [CTRL], icon: pasteimage.png, label: "Paste image", only: [linux, macos] }
  - { key: V, mods: [ALT], icon: pasteimage.png, label: "Paste image", only: [windows] }
  # onCtrlS: steer, sends the input into the running reply.
  - { key: S, mods: [CTRL], icon: send.png, label: "Steer running reply" }
  # onUndo
  - { key: MINUS, mods: [CTRL], icon: undo.png, label: "Undo" }
  # `!` on an empty prompt switches to shell mode.
  - { key: "1", mods: [SHIFT], icon: terminal.png, label: "Shell mode (empty prompt)" }

  # --- history ---
  - { key: UP, icon: prev.png, label: "Previous prompt" }
  - { key: DOWN, icon: next.png, label: "Next prompt" }

  # --- app ---
  # onShiftTab: plan mode on or off.
  - { key: TAB, mods: [SHIFT], icon: plan.png, label: "Plan mode" }
  # onToggleToolExpand: tool output and compaction summary.
  - { key: O, mods: [CTRL], icon: expand.png, label: "Expand tool output" }
  # onCtrlB: moves the running shell command or task to the background.
  - { key: B, mods: [CTRL], icon: background.png, label: "Background task" }
  # onPageNotify: focuses the updates panel when it is shown.
  - { key: N, mods: [CTRL], icon: notify.png, label: "Updates panel" }
