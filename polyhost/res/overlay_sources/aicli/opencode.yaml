#
# Keys: OpenCode 1.19.5 (npm opencode-ai, opencode-linux-x64 bun binary), the
# default keybind table in the bundled JS: `j3="ctrl+x"` (leader) and
# `Ke={leader:k(j3,"Leader key for keybind combinations"),app_exit:k("ctrl+c,ctrl+d,<leader>q",...),...}`,
# where k(default, description) gives each action's default. Entries with default
# "none" are not bound and are left out. Only single-stroke bindings are drawn.
# Terminal program: no Cmd (super+...) keys. Esc shows the program mark.
#
# Leader sequences (Ctrl+X, then one key) are left out except the leader itself:
#   q exit, e external editor, t themes, b sidebar, s status, x export session,
#   n new session, l session list, g timeline, c compact, m models, a agents,
#   y copy message, u undo message, r redo message, h toggle code concealment,
#   1..9 quick session slots, Down first child session.
#
# Regenerate:
#   python polyhost/res/overlay_sources/aicli/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/aicli/opencode.yaml --preview /tmp/opencode_preview
app: OpenCode
match: [opencode]
output: opencode_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

program_icon: opencode.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [38, 32]   # the 38 px wide logo, 1:1
program_icon_margin: 0

bindings:
  # --- Leader: leader = "ctrl+x".
  - { key: X, mods: [CTRL], icon: leader.png, label: "Leader" }

  # --- App and input. "app_exit": "ctrl+c,ctrl+d,<leader>q"; "input_clear": "ctrl+c".
  # Ctrl+C has two meanings (clear the input, then exit on a second press);
  # labelled for clearing the input. Ctrl+D is "app_exit" too.
  - { key: C, mods: [CTRL], icon: clearinput.png, label: "Clear input / exit" }
  - { key: D, mods: [CTRL], icon: exit.png, label: "Exit" }
  # "command_list": "ctrl+p"
  - { key: P, mods: [CTRL], icon: commandpalette.png, label: "Commands" }
  # "terminal_suspend": "ctrl+z"
  - { key: Z, mods: [CTRL], icon: suspend.png, label: "Suspend" }

  # --- Sessions. "session_rename": "ctrl+r"; "session_background": "ctrl+b".
  - { key: R, mods: [CTRL], icon: rename.png, label: "Rename session" }
  - { key: B, mods: [CTRL], icon: background.png, label: "Background subagents" }

  # --- Models and agents. "model_cycle_recent": "f2",
  # "model_cycle_recent_reverse": "shift+f2", "variant_cycle": "ctrl+t",
  # "agent_cycle": "tab", "agent_cycle_reverse": "shift+tab".
  - { key: F2, icon: model.png, label: "Next recent model" }
  - { key: F2, mods: [SHIFT], icon: model.png, label: "Previous model" }
  - { key: T, mods: [CTRL], icon: effort.png, label: "Model variant" }
  - { key: TAB, icon: assistant.png, label: "Next agent" }
  - { key: TAB, mods: [SHIFT], icon: assistant.png, label: "Previous agent" }

  # --- Input. "input_newline": "shift+return,ctrl+return,alt+return,ctrl+j";
  # "input_undo": "ctrl+-,super+z" (super left out); "input_redo": "ctrl+.,super+shift+z";
  # "input_delete_line": "ctrl+shift+d".
  - { key: ENTER, mods: [SHIFT], icon: newline.png, label: "New line" }
  - { key: ENTER, mods: [CTRL], icon: newline.png, label: "New line" }
  - { key: ENTER, mods: [ALT], icon: newline.png, label: "New line" }
  - { key: J, mods: [CTRL], icon: newline.png, label: "New line" }
  - { key: "-", mods: [CTRL], icon: undo.png, label: "Undo input" }
  - { key: ".", mods: [CTRL], icon: redo.png, label: "Redo input" }
  - { key: D, mods: [CTRL, SHIFT], icon: deleteline.png, label: "Delete line" }

  # --- Message scrolling. "messages_first": "ctrl+g,home"; "messages_last": "ctrl+alt+g,end";
  # "messages_page_up": "pageup,ctrl+alt+b"; "messages_page_down": "pagedown,ctrl+alt+f";
  # "messages_line_up": "ctrl+alt+y"; "messages_line_down": "ctrl+alt+e";
  # "messages_half_page_up": "ctrl+alt+u"; "messages_half_page_down": "ctrl+alt+d".
  - { key: G, mods: [CTRL], icon: file_start.png, label: "First message" }
  - { key: G, mods: [CTRL, ALT], icon: file_end.png, label: "Last message" }
  - { key: PAGE_UP, icon: page_up.png, label: "Page up" }
  - { key: PAGE_DOWN, icon: page_down.png, label: "Page down" }
  - { key: B, mods: [CTRL, ALT], icon: page_up.png, label: "Page up" }
  - { key: F, mods: [CTRL, ALT], icon: page_down.png, label: "Page down" }
  - { key: Y, mods: [CTRL, ALT], icon: scroll_up.png, label: "Line up" }
  - { key: E, mods: [CTRL, ALT], icon: scroll_down.png, label: "Line down" }
  - { key: U, mods: [CTRL, ALT], icon: page_up.png, label: "Half page up" }
  - { key: D, mods: [CTRL, ALT], icon: page_down.png, label: "Half page down" }

  # --- Which-key panel. "which_key_toggle": "ctrl+alt+k";
  # "which_key_layout_toggle": "ctrl+alt+shift+k".
  - { key: K, mods: [CTRL, ALT], icon: shortcuts.png, label: "Show key help" }
  - { key: K, mods: [CTRL, ALT, SHIFT], icon: viewmode.png, label: "Key help layout" }
