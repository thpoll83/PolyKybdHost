# Mistral Vibe for PolyKybd.
#
# Keys: the "Keyboard Shortcuts" list of Vibe's own /help screen, read from
# mistral-vibe 3.1.0 (PyPI) by running the TUI (`vibe/_bin/vibe-rs`, Rust)
# in a pty and rendering the screen. The same strings are in the binary.
# Ctrl+J and Shift+Enter insert a newline, Escape interrupts the agent,
# Ctrl+C quits (or clears the input when it has text), Ctrl+G edits the
# input in the external editor, Ctrl+O toggles the tool output, Ctrl+R
# searches the prompt history, Ctrl+T starts or stops voice recording (voice
# mode only), Shift+Tab cycles the agents (ask, accept-edits, ...).
#
# Only the main prompt keys are used. Enter, Escape (Esc shows the program
# mark) and the double Escape rewind are left out. No macOS set: Vibe runs in
# a terminal, where Cmd keys never reach it.
#
# Regenerate:
#   python polyhost/res/overlay_sources/aicli/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/aicli/mistral_vibe.yaml --preview /tmp/mistral_vibe_preview
app: "Mistral Vibe"
match: [vibe]
output: mistral_vibe_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

program_icon: mistral.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # Ctrl+C quits; with text in the input it clears the input instead.
  - { key: C, mods: [CTRL], icon: stop.png, label: "Quit / clear input" }
  # Newline in the prompt.
  - { key: J, mods: [CTRL], icon: newline.png, label: "Newline" }
  - { key: ENTER, mods: [SHIFT], icon: newline.png, label: "Newline" }
  # Edit the input in the external editor ($EDITOR).
  - { key: G, mods: [CTRL], icon: editor.png, label: "External editor" }
  # Toggle the tool output view (also folds and unfolds tool call groups).
  - { key: O, mods: [CTRL], icon: expand.png, label: "Tool output" }
  # Search the prompt history.
  - { key: R, mods: [CTRL], icon: search.png, label: "Search history" }
  # Start or stop voice recording (voice mode).
  - { key: T, mods: [CTRL], icon: dictation.png, label: "Voice recording" }
  # Cycle the agents: ask, accept-edits, ...
  - { key: TAB, mods: [SHIFT], icon: permission.png, label: "Cycle agents" }
