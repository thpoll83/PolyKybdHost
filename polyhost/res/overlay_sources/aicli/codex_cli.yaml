# OpenAI Codex CLI for PolyKybd.
#
# Keys: Codex's built-in default keymap, `RuntimeKeymap::built_in_defaults()`
# in codex-rs/tui/src/keymap.rs (github.com/openai/codex, main), plus the
# fixed (not remappable) keys listed in `MAIN_RESERVED_BINDINGS` in the same
# file. The action names were also found in the 0.166.0 binary. Only the main
# chat composer and app-level bindings are used; the pager, list, approval,
# agents and vim contexts are left out.
#
# Esc shows the program mark. No macOS set: Codex runs in a terminal, where
# Cmd keys never reach it. Plain typing keys (/, !, @, $) and the readline
# editing keys are left out.
#
# Regenerate:
#   python polyhost/res/overlay_sources/aicli/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/aicli/codex_cli.yaml --preview /tmp/codex_cli_preview
app: "Codex CLI"
match: [codex]
output: codex_cli_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: codex.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- Fixed keys: MAIN_RESERVED_BINDINGS (keymap.rs) ---
  # Ctrl+C: interrupt while a turn runs, quit when idle (fixed.interrupt_or_quit).
  # Labelled for the most common use, interrupt.
  - { key: C, mods: [CTRL], icon: stop.png, label: "Interrupt / quit" }
  - { key: D, mods: [CTRL], icon: exit.png, label: "Quit" }
  # fixed.paste_image
  - { key: V, mods: [CTRL], icon: pasteimage.png, label: "Paste image" }
  - { key: V, mods: [CTRL, ALT], icon: pasteimage.png, label: "Paste image" }
  # fixed.cycle_collaboration_mode
  - { key: TAB, mods: [SHIFT], icon: permission.png, label: "Collaboration mode" }
  # fixed.previous_agent / fixed.next_agent
  - { key: LEFT, mods: [ALT], icon: prev.png, label: "Previous agent" }
  - { key: RIGHT, mods: [ALT], icon: next.png, label: "Next agent" }
  # Ctrl+Z is reserved for suspend (validate_conflicts, keymap.rs).
  - { key: Z, mods: [CTRL], icon: suspend.png, label: "Suspend" }

  # --- app: AppKeymap defaults ---
  - { key: T, mods: [CTRL], icon: transcript.png, label: "Transcript" }
  - { key: O, mods: [CTRL], icon: copyresponse.png, label: "Copy last response" }
  - { key: G, mods: [CTRL], icon: editor.png, label: "External editor" }
  - { key: L, mods: [CTRL], icon: clear.png, label: "Clear terminal" }
  - { key: R, mods: [ALT], icon: rawoutput.png, label: "Raw output" }
  - { key: "/", mods: [CTRL], icon: sidechat.png, label: "Side conversation" }
  - { key: F2, icon: warnings.png, label: "Warnings" }
  - { key: F3, icon: find.png, label: "Find in transcript", concept: find }
  - { key: F4, icon: activity.png, label: "Activity" }

  # --- chat: ChatKeymap defaults ---
  - { key: F8, icon: dictation.png, label: "Voice input" }
  - { key: F9, icon: mute.png, label: "Mute voice" }
  # decrease_reasoning_effort / increase_reasoning_effort (Shift+Down / Shift+Up
  # are further defaults for the same actions and are not drawn).
  - { key: ",", mods: [ALT], icon: effortdown.png, label: "Less reasoning" }
  - { key: ".", mods: [ALT], icon: effort.png, label: "More reasoning" }
  # edit_queued_message (also Shift+Left), prompt_stack_back (also Shift+Right)
  - { key: UP, mods: [ALT], icon: editqueue.png, label: "Edit queued message" }
  - { key: DOWN, mods: [ALT], icon: stackback.png, label: "Prompt stack back" }
  - { key: "]", mods: [CTRL], icon: skip.png, label: "Skip question" }

  # --- composer: ComposerKeymap defaults ---
  - { key: R, mods: [CTRL], icon: search.png, label: "History search", concept: find }
  - { key: S, mods: [CTRL], icon: next.png, label: "Next history match" }
  - { key: TAB, icon: queue.png, label: "Queue message" }
  # toggle_shortcuts: "?" is Shift+/
  - { key: "/", mods: [SHIFT], icon: shortcuts.png, label: "Show shortcuts" }

  # --- editor: EditorKeymap.insert_newline (Ctrl+J, Shift+Enter, Alt+Enter) ---
  - { key: J, mods: [CTRL], icon: newline.png, label: "New line" }
  - { key: ENTER, mods: [SHIFT], icon: newline.png, label: "New line" }
  - { key: ENTER, mods: [ALT], icon: newline.png, label: "New line" }
