#
# Keys: Claude Code 2.1.318 (npm @anthropic-ai/claude-code-linux-x64), the default
# keybinding table `m2=[{context:"Global",...},{context:"Chat",...},...]` in the
# bundled JS (strings of the native binary, next to the `app:*` / `chat:*` action
# names). Only the Global and Chat contexts are used (they apply while typing at the
# main prompt). Cross-checked against code.claude.com/docs/en/interactive-mode.
# Terminal program: no Cmd keys. Esc shows the program mark. Option on macOS acts
# as Alt only when the terminal sends Option as Meta (docs: "Enable Option key
# shortcuts on macOS"). Chords (Ctrl+X Ctrl+E, Ctrl+X Ctrl+K, ...) are left out.
#
# Regenerate:
#   python polyhost/res/overlay_sources/aicli/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/aicli/claude_code_cli.yaml --preview /tmp/claude_code_cli_preview
app: "Claude Code (terminal)"
match: [claude]
output: claude_code_cli_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: claude.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- Global context: "ctrl+c":"app:interrupt", "ctrl+d":"app:exit",
  # "ctrl+t":"app:toggleTodos", "ctrl+o":"app:toggleTranscript",
  # "ctrl+r":"history:search".
  # Ctrl+C has two meanings: it interrupts a running turn, and with an idle
  # prompt it clears the input (a second press exits). Labelled for the
  # interrupt, the most common use.
  - { key: C, mods: [CTRL], icon: stop.png, label: "Interrupt" }
  - { key: D, mods: [CTRL], icon: exit.png, label: "Exit (press twice)" }
  - { key: T, mods: [CTRL], icon: checklist.png, label: "Task checklist" }
  - { key: O, mods: [CTRL], icon: transcript.png, label: "Transcript" }
  - { key: R, mods: [CTRL], icon: search.png, label: "History search", concept: find }

  # --- Chat context.
  # "ctrl+l":"chat:clearInput" (same handler as chat:clearScreen; the docs
  # describe it as "Redraw the screen").
  - { key: L, mods: [CTRL], icon: reload.png, label: "Redraw screen" }
  # [g]:"chat:cycleMode" with g = "shift+tab" (Windows without VT input uses
  # "meta+m" instead; not drawn).
  - { key: TAB, mods: [SHIFT], icon: permission.png, label: "Permission mode" }
  # "meta+p":"chat:modelPicker", "meta+o":"chat:fastMode",
  # "meta+t":"chat:thinkingToggle" (Alt on Windows/Linux, Option as Meta on macOS).
  - { key: P, mods: [ALT], icon: model.png, label: "Switch model" }
  - { key: O, mods: [ALT], icon: fastmode.png, label: "Fast mode" }
  - { key: T, mods: [ALT], icon: thinking.png, label: "Extended thinking" }
  # "shift+up":"chat:increaseEffort", "shift+down":"chat:decreaseEffort".
  - { key: UP, mods: [SHIFT], icon: effort.png, label: "Effort up" }
  - { key: DOWN, mods: [SHIFT], icon: effortdown.png, label: "Effort down" }
  # "ctrl+enter":"chat:sendNow" (queued messages), "ctrl+j":"chat:newline".
  - { key: ENTER, mods: [CTRL], icon: send.png, label: "Send queued now" }
  - { key: J, mods: [CTRL], icon: newline.png, label: "New line" }
  # "ctrl+_" / "ctrl+-" / "ctrl+shift+-" / "ctrl+shift+_":"chat:undo".
  # Drawn on Ctrl+minus, the plain form of the four.
  - { key: "-", mods: [CTRL], icon: undo.png, label: "Undo" }
  # "ctrl+g":"chat:externalEditor" ("ctrl+x ctrl+e" is the chord form).
  - { key: G, mods: [CTRL], icon: editor.png, label: "External editor" }
  # "ctrl+s":"chat:stash".
  - { key: S, mods: [CTRL], icon: stash.png, label: "Stash prompt" }
  # Task context, active while a command or agent runs:
  # "ctrl+b":"task:background".
  - { key: B, mods: [CTRL], icon: background.png, label: "Run in background" }
  # Paste image: [h]:"chat:imagePaste" with h = "alt+v" on Windows and WSL,
  # "ctrl+v" otherwise (WSL binds both).
  - { key: V, mods: [CTRL], icon: pasteimage.png, label: "Paste image", only: [linux, macos] }
  - { key: V, mods: [ALT], icon: pasteimage.png, label: "Paste image", only: [windows] }
  # Ctrl+Z is not in the binding table; the docs list it ("Unix only", suspends
  # the process to the shell) and the bundle calls SIGTSTP.
  - { key: Z, mods: [CTRL], icon: suspend.png, label: "Suspend", only: [linux, macos] }
