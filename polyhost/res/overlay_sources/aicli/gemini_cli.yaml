# Google Gemini CLI for PolyKybd.
#
# Keys: Gemini CLI's default key table, `defaultKeyBindingConfig` (a Map of
# command name to KeyBinding list) in packages/cli/src/ui/key/keyBindings.ts,
# found in the shipped bundle of @google/gemini-cli 0.67.0
# (bundle/chunk-5RNHNFYV.js, lines 33326-33460). The key matchers
# (`keyMatchers["app.toggleYolo"]` etc.) read that table. The in-app shortcut
# list (ShortcutsHelp.tsx, buildShortcutItems) confirms the Ctrl+Y, Shift+Tab,
# paste, Alt+M, Ctrl+R and Ctrl+G entries.
#
# Only the main prompt and app-level commands are used. Dialog-only keys
# (j/k, r, i, l), plain Space (voice), Enter and Tab are left out. Dev-only
# keys (F6, F7, F8) are left out. Esc shows the program mark. No macOS set:
# Gemini CLI runs in a terminal, where Cmd keys never reach it. Alt+Z undo
# and the Linux/Windows Ctrl+Z are listed (getPlatformUndoBindings).
#
# Regenerate:
#   python polyhost/res/overlay_sources/aicli/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/aicli/gemini_cli.yaml --preview /tmp/gemini_cli_preview
app: "Gemini CLI"
match: [gemini]
output: gemini_cli_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: gemini.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- basic.* / edit.clear ---
  # Ctrl+C is basic.quit and edit.clear: cancels a running request, clears the
  # input, and a double press exits. Labelled for the most common use.
  - { key: C, mods: [CTRL], icon: stop.png, label: "Cancel / quit" }
  # basic.exit; the handler ignores it while the input has text.
  - { key: D, mods: [CTRL], icon: exit.png, label: "Exit (empty input)" }

  # --- input.* ---
  # input.newline: ctrl+enter, cmd+enter, alt+enter, shift+enter, ctrl+j
  - { key: J, mods: [CTRL], icon: newline.png, label: "Newline" }
  - { key: ENTER, mods: [SHIFT], icon: newline.png, label: "Newline" }
  - { key: ENTER, mods: [ALT], icon: newline.png, label: "Newline" }
  - { key: ENTER, mods: [CTRL], icon: newline.png, label: "Newline" }
  # input.openExternalEditor: ctrl+g, ctrl+shift+g
  - { key: G, mods: [CTRL], icon: editor.png, label: "External editor" }
  - { key: G, mods: [CTRL, SHIFT], icon: editor.png, label: "External editor" }
  # input.paste: ctrl+v, cmd+v, alt+v (clipboard text or image)
  - { key: V, mods: [CTRL], icon: pasteimage.png, label: "Paste / image" }
  - { key: V, mods: [ALT], icon: pasteimage.png, label: "Paste / image" }

  # --- edit.undo / edit.redo ---
  # Linux table: alt+z, cmd+z, ctrl+z. Ctrl+Z also matches app.suspend, which
  # needs a second press to suspend, so it is labelled Suspend.
  - { key: Z, mods: [CTRL], icon: suspend.png, label: "Suspend (twice)" }
  - { key: Z, mods: [ALT], icon: undo.png, label: "Undo" }
  # edit.redo: ctrl+shift+z, alt+shift+z
  - { key: Z, mods: [CTRL, SHIFT], icon: redo.png, label: "Redo" }
  - { key: Z, mods: [ALT, SHIFT], icon: redo.png, label: "Redo" }

  # --- history.* ---
  - { key: R, mods: [CTRL], icon: search.png, label: "Search history", concept: find }
  - { key: P, mods: [CTRL], icon: prev.png, label: "Previous prompt" }
  - { key: N, mods: [CTRL], icon: next.png, label: "Next prompt" }

  # --- scroll.* ---
  - { key: UP, mods: [SHIFT], icon: scroll_up.png, region: [40, 32], label: "Scroll up" }
  - { key: DOWN, mods: [SHIFT], icon: scroll_down.png, region: [40, 32], label: "Scroll down" }
  - { key: PAGE_UP, icon: page_up.png, region: [40, 32], label: "Page up" }
  - { key: PAGE_DOWN, icon: page_down.png, region: [40, 32], label: "Page down" }
  - { key: HOME, mods: [CTRL], icon: file_start.png, region: [40, 32], label: "Scroll to top" }
  - { key: HOME, mods: [SHIFT], icon: file_start.png, region: [40, 32], label: "Scroll to top" }
  - { key: END, mods: [CTRL], icon: file_end.png, region: [40, 32], label: "Scroll to bottom" }
  - { key: END, mods: [SHIFT], icon: file_end.png, region: [40, 32], label: "Scroll to bottom" }

  # --- app.* ---
  # app.cycleApprovalMode
  - { key: TAB, mods: [SHIFT], icon: permission.png, label: "Approval mode" }
  # app.toggleYolo
  - { key: Y, mods: [CTRL], icon: yolo.png, label: "YOLO mode" }
  # app.showMoreLines and app.expandPaste (both bound to ctrl+o)
  - { key: O, mods: [CTRL], icon: expand.png, label: "Expand output" }
  # app.showFullTodos
  - { key: T, mods: [CTRL], icon: checklist.png, label: "Show full todos" }
  # app.toggleMouseMode
  - { key: S, mods: [CTRL], icon: mouse.png, label: "Toggle mouse mode" }
  # app.clearScreen
  - { key: L, mods: [CTRL], icon: clear.png, label: "Clear screen" }
  # background.toggle: move the running shell command to the background
  - { key: B, mods: [CTRL], icon: background.png, label: "Background shell" }
  # app.toggleMarkdown
  - { key: M, mods: [ALT], icon: markdown.png, label: "Raw markdown" }
  # app.showIdeContextDetail (only in IDE mode)
  - { key: F4, icon: ide.png, label: "IDE context" }
  # app.toggleCopyMode (alternate screen buffer only)
  - { key: F9, icon: copymode.png, label: "Copy mode" }
  # app.showErrorDetails
  - { key: F12, icon: errordetails.png, label: "Error details" }
