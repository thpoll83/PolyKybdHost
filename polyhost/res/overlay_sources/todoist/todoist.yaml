# Todoist (desktop) shortcut overlays for PolyKybd. See SOURCES.md.
# GENERATED by gen_specs.py from its table -- edit the table, not this file.
#
# Shortcuts: the Web, macOS and Windows tables of Todoist's help page
# https://www.todoist.com/help/articles/use-keyboard-shortcuts-in-todoist-Wyovn2
# The single-letter keys act when no text field has the focus.
#
# Regenerate:
#   python polyhost/res/overlay_sources/todoist/gen_specs.py
#   python polyhost/res/overlay_sources/todoist/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/todoist/todoist.yaml --preview /tmp/todoist_template_preview
app: todoist
match: [todoist]
output: todoist_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: todoist.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:

  - { key: Q, icon: quickadd.png, label: "Quick Add" }
  - { key: P, mods: [ALT], icon: newproject.png, label: "New project", except: [macos] }
  - { key: P, mods: [ALT], icon: newproject.png, label: "New project", only: [macos] }
  - { key: SLASH, icon: search.png, label: "Search", concept: find }
  - { key: F, icon: search.png, label: "Search", concept: find }
  - { key: Z, mods: [CMDCTRL], icon: undo.png, label: "Undo" }
  - { key: M, icon: sidebar.png, label: "Toggle sidebar" }
  - { key: SLASH, mods: [SHIFT], icon: shortcuts.png, label: "Keyboard shortcuts" }
  - { key: K, mods: [CMDCTRL], icon: quickfind.png, label: "Quick Find" }
  - { key: P, mods: [CMDCTRL], icon: print.png, label: "Print" }
  - { key: EQUAL, mods: [CTRL, SHIFT], icon: zoomin.png, label: "Zoom in", except: [macos] }
  - { key: EQUAL, mods: [GUI], icon: zoomin.png, label: "Zoom in", only: [macos] }
  - { key: MINUS, mods: [CMDCTRL], icon: zoomout.png, label: "Zoom out" }
  - { key: "0", mods: [CMDCTRL, ALT], icon: collapseall.png, label: "Collapse or expand all" }
  - { key: H, icon: home.png, label: "Home view" }
  - { key: G, mods: [SHIFT], icon: gotoproject.png, label: "Open task in its project" }
