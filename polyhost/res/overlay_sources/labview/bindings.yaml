# NI LabVIEW shortcut overlays for PolyKybd (Windows, Linux and macOS).
# GENERATED by gen_specs.py from its table -- edit the table, not this file.
#
# Shortcuts: NI, "LabVIEW Keyboard Shortcuts" (LabVIEW User Manual, updated
# 2026-09-28). Ctrl on Windows is Cmd on macOS and Alt on Linux. See SOURCES.md.
#
# Regenerate:
#   python polyhost/res/overlay_sources/labview/fetch_icons.py
#   python polyhost/res/overlay_sources/labview/gen_specs.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/labview/bindings.yaml --preview /tmp/labview_preview
app: labview
match: [labview]
output: labview_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: labview.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:

  # --- objects ---
  - { key: "K", mods: [CTRL], icon: forward.png, label: "Move forward", only: [windows] }
