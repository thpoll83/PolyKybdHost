# Elden Ring overlay for PolyKybd. See SOURCES.md.
#
# Keys: two guides that agree (Shacknews 2022-02-24, Fextralife "Controls",
# read 2026-11-27). No copy of the game's own key data was found, so every key
# is UNCONFIRMED. Fextralife also says a Shadow of the Erdtree update moved
# jump to Space and dodge to Shift; no patch note confirms it, and the older
# keys are drawn.
#
# The game keeps the player's key config in its binary save, so the overlay
# draws the defaults only.
#
# Left out: Alt (walk, a modifier key), the mouse (attack, guard, Shift+mouse
# strong attack and skill), the menu-only keys, and Esc (program mark).
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/action/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/action/eldenring.yaml --preview /tmp/eldenring_preview
app: elden ring
match: [eldenring, steam_app_1245620]
output: eldenring_template
icon_dir: icons
fit: contain
mode: auto
threshold: 150
anchor: right
region: [40, 40]
margin: 0

program_icon: eldenring.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0
program_icon_legend: false

bindings:

  # Movement
  - { key: W, icon: forward.png, label: "Move forward" }
  - { key: S, icon: back.png, label: "Move back" }
  - { key: A, icon: left.png, label: "Move left" }
  - { key: D, icon: right.png, label: "Move right" }
  - { key: SPACE, icon: dodge.png, label: "Dodge, backstep, dash" }
  - { key: F, icon: jump.png, label: "Jump" }
  - { key: X, icon: crouch.png, label: "Crouch" }

  # Actions
  - { key: E, icon: interact.png, label: "Event action (interact)" }
  - { key: R, icon: useitem.png, label: "Use item" }
  - { key: Q, icon: lockon.png, label: "Lock on, reset camera" }
  - { key: G, icon: map.png, label: "Map" }

  # Equipment slots
  - { key: UP, icon: switchspell.png, label: "Switch spell" }
  - { key: DOWN, icon: switchitem.png, label: "Switch item" }
  - { key: RIGHT, icon: switchright.png, label: "Switch right-hand armament" }
  - { key: LEFT, icon: switchleft.png, label: "Switch left-hand armament" }
