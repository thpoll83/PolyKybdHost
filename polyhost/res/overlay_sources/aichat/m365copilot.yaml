# Microsoft 365 Copilot app overlays for PolyKybd (Windows). See SOURCES.md.
#
# Microsoft documents no in-app shortcut for this app, and UI Automation finds
# none. The keys below were tested by hand in M365Copilot.exe
# 19.2610.35011.0 on 2026-10-22: Ctrl+Shift+H shows or hides the left sidebar,
# Ctrl+Shift+Q opens the settings, Ctrl+Shift+Y copies debug information to the
# clipboard, and Ctrl+Shift+I opens the Edge DevTools (the app is a WebView2
# window). Of the standard keys only Copy, Paste, Select all and the zoom keys
# (Ctrl+=, Ctrl+-, Ctrl+0) act; F12, Ctrl+F, Ctrl+R and F5 do nothing. The ESC
# mark comes from the app's executable.
#
# Regenerate:
#   python polyhost/res/overlay_sources/aichat/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/aichat/m365copilot.yaml --preview /tmp/m365copilot_preview
app: m365copilot
match: [m365copilot]
output: m365copilot_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

bindings:
  - { key: H, mods: [CTRL, SHIFT], icon: sidebar.png, label: "Sidebar", except: [macos] }
  - { key: Q, mods: [CTRL, SHIFT], icon: settings.png, label: "Settings", except: [macos] }
  - { key: Y, mods: [CTRL, SHIFT], icon: debuginfo.png, label: "Copy debug info", except: [macos] }
  - { key: I, mods: [CTRL, SHIFT], icon: devtools.png, label: "Developer tools", except: [macos] }
  - { key: C, mods: [CTRL], label: "Copy", except: [macos] }
  - { key: V, mods: [CTRL], label: "Paste", except: [macos] }
  - { key: A, mods: [CTRL], label: "Select all", except: [macos] }
  - { key: EQUAL, mods: [CTRL], label: "Zoom in", except: [macos] }
  - { key: MINUS, mods: [CTRL], label: "Zoom out", except: [macos] }
  - { key: "0", mods: [CTRL], icon: resetzoom.png, label: "Reset zoom", except: [macos] }
