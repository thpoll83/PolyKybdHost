# Claude Code on the web (claude.ai/code) overlays for PolyKybd. See SOURCES.md.
#
# The four chords were read off the web interface's own shortcut hints by the
# owner (2026-10-01) on Windows/Linux. The macOS forms are not confirmed, so
# every binding is `except: [macos]`: the macOS set carries the ESC mark only.
#
# Routed by URL ahead of the plain claude.ai entry, which it contains.
#
# Regenerate:
#   python polyhost/res/overlay_sources/aichat/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/aichat/claude_code_web.yaml --preview /tmp/ccw_preview
app: claude.ai/code
match: [claude.ai/code]
output: claude_code_web_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

program_icon: claude.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  - { key: M, mods: [CTRL, ALT],   except: [macos], icon: permission.png, label: "Permission mode" }
  - { key: B, mods: [CTRL],        except: [macos], icon: sidebar.png,    label: "Toggle sidebar" }
  - { key: D, mods: [CTRL, SHIFT], except: [macos], icon: diff.png,       label: "Changes (diff)" }
  - { key: F, mods: [CTRL, SHIFT], except: [macos], icon: files.png,      label: Files }
