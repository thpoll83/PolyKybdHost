# Microsoft Copilot desktop app overlays for PolyKybd. See SOURCES.md.
#
# The app (`mscopilot.exe` on Windows) shows copilot.microsoft.com in a
# Chromium window, so its keymap is the web page's: four Alt chords, read from
# the page's own script. UI Automation sees none of them, which is why the host
# harvested 0 shortcuts. The web page has its own spec, `copilot_web.yaml`,
# because only it needs a drawn ESC mark: for the desktop app the host draws the
# mark from the app's executable once any shortcut is drawn.
#
# The page checks `event.code` with Alt and no Ctrl or Meta, so on macOS the same
# chords are Option chords and one set serves every OS.
#
# Regenerate:
#   python polyhost/res/overlay_sources/aichat/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/aichat/copilot.yaml --preview /tmp/copilot_preview
app: mscopilot
match: [mscopilot, copilot]
output: copilot_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

bindings:
  - { key: O, mods: [ALT],        icon: newchat.png,    label: "New chat" }
  - { key: F, mods: [ALT, SHIFT], icon: composer.png,   label: "Focus message box" }
  - { key: A, mods: [ALT],        icon: createmenu.png, label: "Create and upload menu" }
  - { key: M, mods: [ALT],        icon: dictation.png,  label: "Voice chat" }
