# ChatGPT overlays for PolyKybd (desktop app and chatgpt.com). See SOURCES.md.
#
# One set serves both: the desktop app and the web page share ChatGPT's
# in-app keymap (Ctrl+/ shows it; Cmd on macOS -> CMDCTRL). Wired twice in
# overlay-mapping.poly.yaml, as a native `chatgpt` entry and a browser
# `urls-contains: chatgpt.com` entry.
#
# Shift+Esc (focus the message box) sits under the ESC program mark and is not
# drawn. Ctrl+Shift+I (custom instructions) is caught by Chrome's DevTools when
# ChatGPT runs in a tab; it works in the desktop app.
#
# Regenerate:
#   python polyhost/res/overlay_sources/aichat/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/aichat/chatgpt.yaml --preview /tmp/gpt_preview
app: chatgpt
match: [chatgpt]
output: chatgpt_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

program_icon: chatgpt.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  - { key: "/",       mods: [CMDCTRL],        icon: shortcuts.png,    label: "Keyboard shortcuts" }
  - { key: O,         mods: [CMDCTRL, SHIFT], icon: newchat.png,      label: "New chat" }
  - { key: K,         mods: [CMDCTRL],        icon: search.png,       label: "Search chats" }
  - { key: S,         mods: [CMDCTRL, SHIFT], icon: sidebar.png,      label: "Toggle sidebar" }
  - { key: C,         mods: [CMDCTRL, SHIFT], icon: copyresponse.png, label: "Copy last response" }
  - { key: ";",       mods: [CMDCTRL, SHIFT], icon: copycode.png,     label: "Copy last code block" }
  - { key: I,         mods: [CMDCTRL, SHIFT], icon: instructions.png, label: "Custom instructions" }
  - { key: BACKSPACE, mods: [CMDCTRL, SHIFT], icon: deletechat.png,   label: "Delete chat" }
