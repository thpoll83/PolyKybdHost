# Microsoft Copilot on the web (copilot.microsoft.com). See SOURCES.md.
#
# Same four Alt chords as the desktop app (`copilot.yaml`), plus a drawn ESC
# mark: in a browser the host would otherwise draw the BROWSER's mark there.
# Keep the bindings identical to copilot.yaml.
#
# Regenerate:
#   python polyhost/res/overlay_sources/aichat/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/aichat/copilot_web.yaml --preview /tmp/copilot_web_preview
app: copilot-web
match: [copilot.microsoft.com]
output: copilot_web_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

program_icon: copilot.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  - { key: O, mods: [ALT],        icon: newchat.png,    label: "New chat" }
  - { key: F, mods: [ALT, SHIFT], icon: composer.png,   label: "Focus message box" }
  - { key: A, mods: [ALT],        icon: createmenu.png, label: "Create and upload menu" }
  - { key: M, mods: [ALT],        icon: dictation.png,  label: "Voice chat" }
