# LM Studio overlays for PolyKybd. See SOURCES_localai.md.
#
# Source: LM Studio's own documentation, lmstudio.ai/docs/app (pages cited per
# binding below; the whole set is also in lmstudio.ai/llms.txt). Every chord
# is documented as Cmd on macOS and Ctrl on Windows/Linux -> CMDCTRL.
#
# Not drawn:
#   - Cmd/Ctrl+K "then T" (theme selector, docs/app/user-interface/themes):
#     a two-key sequence, and what Ctrl+K alone opens is not documented.
#   - Cmd/Ctrl+1 and other tab digits: only 2 (Discover) and 3 (My Models)
#     are documented.
#   - Standard editing chords (Cut/Copy/Paste/Undo/Select all): not documented
#     by LM Studio, unlike the Codex set, which cites Electron's Edit roles.
#
# Regenerate:
#   python polyhost/res/overlay_sources/aichat/fetch_icons.py
#   python polyhost/res/overlay_sources/aichat/fetch_icons_localai.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/aichat/lmstudio.yaml --preview /tmp/lms_preview
app: lm studio
match: [lm studio, lm-studio]
output: lmstudio_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

program_icon: lmstudio.png
program_icon_mode: alpha
program_icon_anchor: bottom-right
program_icon_region: [72, 40]   # a finished full-cell mask
program_icon_margin: 0

bindings:
  - { key: N,   mods: [CMDCTRL],        icon: newchat.png,   label: "New chat",
      source: "https://lmstudio.ai/docs/app/basics/chat (Create a new chat)" }
  - { key: N,   mods: [CMDCTRL, SHIFT], icon: newfolder.png, label: "New chat folder",
      source: "https://lmstudio.ai/docs/app/basics/chat (Create a folder)" }
  - { key: L,   mods: [CMDCTRL],        icon: model.png,     label: "Load model",
      source: "https://lmstudio.ai/docs/app/basics (model loader caption)" }
  - { key: "2", mods: [CMDCTRL],        icon: discover.png,  label: "Discover models",
      source: "https://lmstudio.ai/docs/app/basics/download-model (Pro tip)" }
  - { key: "3", mods: [CMDCTRL],        icon: mymodels.png,  label: "My models",
      source: "https://lmstudio.ai/docs/app/advanced/prompt-template (Pro tip)" }
  - { key: R,   mods: [CMDCTRL, SHIFT], icon: runtimes.png,  label: "LM Runtimes",
      source: "https://lmstudio.ai/docs/app (Run llama.cpp (GGUF) or MLX models)" }
  - { key: ",", mods: [CMDCTRL],        icon: settings.png,  label: Settings,
      source: "https://lmstudio.ai/docs/app/user-interface/languages; .../themes" }
