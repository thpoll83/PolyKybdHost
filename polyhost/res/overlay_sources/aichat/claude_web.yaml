# claude.ai (Claude in a browser) overlays for PolyKybd. See SOURCES.md.
#
# ⚠️ PROVISIONAL. Anthropic does not publish a shortcut list for claude.ai; the
# in-app list is behind Ctrl+/ (Cmd+/ on macOS). Each chord below was agreed on
# by several third-party lists and nothing contradicted it. Chords that the
# lists disagreed on (Ctrl+. and Ctrl+Shift+S for the sidebar, Ctrl+K as "new
# chat" vs "search") are left out. Check the in-app list before extending.
#
# Regenerate:
#   python polyhost/res/overlay_sources/aichat/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/aichat/claude_web.yaml --preview /tmp/cw_preview
app: claude.ai
match: [claude.ai]
output: claude_web_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

program_icon: claude.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  - { key: "/", mods: [CMDCTRL],        icon: shortcuts.png, label: "Keyboard shortcuts" }
  - { key: O,   mods: [CMDCTRL, SHIFT], icon: newchat.png,   label: "New chat" }
  - { key: K,   mods: [CMDCTRL],        icon: search.png,    label: "Search chats" }
