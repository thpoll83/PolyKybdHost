# Codex desktop app overlays for PolyKybd. See SOURCES.md.
#
# Source: the "Commands" page of the Codex app docs
# (developers.openai.com/codex/app/commands), read through search excerpts
# because the session's egress proxy blocks that host. CMDCTRL is Cmd on
# macOS and Ctrl on Windows. The terminal toggle is Ctrl+` on both.
#
# Toggle diff panel is drawn on macOS only: the doc gives Cmd+Option+B there,
# and no excerpt confirmed the Windows form.
#
# The Codex app's chords are user-rebindable (Settings > Keyboard Shortcuts);
# this set draws the defaults.
#
# Regenerate:
#   python polyhost/res/overlay_sources/aichat/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/aichat/codex.yaml --preview /tmp/cx_preview
app: codex
match: [codex]
output: codex_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

program_icon: codex.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  - { key: "/", mods: [CMDCTRL],        icon: shortcuts.png,      label: "Keyboard shortcuts" }
  - { key: N,   mods: [CMDCTRL],        icon: newchat.png,        label: "New thread" }
  - { key: O,   mods: [CMDCTRL, SHIFT], icon: newchat.png,        label: "New thread" }
  - { key: K,   mods: [CMDCTRL],        icon: commandpalette.png, label: "Command menu" }
  - { key: P,   mods: [CMDCTRL, SHIFT], icon: commandpalette.png, label: "Command menu" }
  - { key: P,   mods: [CMDCTRL],        icon: findfile.png,       label: "Search files" }
  - { key: B,   mods: [CMDCTRL],        icon: sidebar.png,        label: "Toggle sidebar" }
  - { key: B,   mods: [CMDCTRL, ALT], only: [macos], icon: diff.png, label: "Toggle diff panel" }
  - { key: "`", mods: [CTRL],           icon: terminal.png,       label: "Toggle terminal" }
  - { key: ",", mods: [CMDCTRL],        icon: settings.png,       label: Settings }
  - { key: O,   mods: [CMDCTRL],        icon: openfolder.png,     label: "Open folder" }
  - { key: F,   mods: [CMDCTRL],        icon: find.png,           label: "Find in thread" }
  - { key: A,   mods: [CMDCTRL, SHIFT], icon: archive.png,        label: "Archive thread" }
  - { key: "[", mods: [CMDCTRL, SHIFT], icon: prev.png,           label: "Previous thread" }
  - { key: "]", mods: [CMDCTRL, SHIFT], icon: next.png,           label: "Next thread" }
  - { key: "[", mods: [CMDCTRL],        icon: back.png,           label: Back }
