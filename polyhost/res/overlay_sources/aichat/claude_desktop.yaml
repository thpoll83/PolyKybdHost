# Claude desktop app overlays for PolyKybd. See SOURCES.md.
#
# Covers both tabs. Chat and Code share one window and one process, so one set
# serves both. The Code tab's chords are from the official list at
# code.claude.com/docs/en/desktop#keyboard-shortcuts. The Chat tab's chords
# were read off the Windows app's own shortcut list by the owner (2026-10-02);
# their macOS forms are not confirmed, so they are `except: [macos]`.
# Two Chat chords clash with the Code tab and are left out until the tabs can
# be told apart: Ctrl+Shift+E (Chat: toggle thinking, Code: effort menu) and
# Ctrl+Shift+I (Chat: incognito chat, Code: model menu).
#
# CMDCTRL is Cmd on macOS and Ctrl on Windows (the doc: "On Windows, use Ctrl in
# place of Cmd"). Session cycling and the terminal toggle use Ctrl on every
# platform, so those are literal CTRL. View-mode cycling (Ctrl+O) too.
# Esc (stop the response) sits under the ESC program mark and is not drawn.
#
# Regenerate:
#   python polyhost/res/overlay_sources/aichat/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/aichat/claude_desktop.yaml --preview /tmp/cd_preview
app: claude
match: [claude]
output: claude_desktop_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

program_icon: claude.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  - { key: "/",  mods: [CMDCTRL],        icon: shortcuts.png, label: "Keyboard shortcuts" }
  - { key: N,    mods: [CMDCTRL],        icon: newchat.png,   label: "New session" }
  - { key: W,    mods: [CMDCTRL],        icon: close.png,     label: "Close session" }
  - { key: TAB,  mods: [CTRL],           icon: next.png,      label: "Next session" }
  - { key: TAB,  mods: [CTRL, SHIFT],    icon: prev.png,      label: "Previous session" }
  - { key: "]",  mods: [CMDCTRL, SHIFT], icon: next.png,      label: "Next session" }
  - { key: "[",  mods: [CMDCTRL, SHIFT], icon: prev.png,      label: "Previous session" }
  - { key: D,    mods: [CMDCTRL, SHIFT], icon: diff.png,      label: "Toggle diff pane" }
  - { key: B,    mods: [CMDCTRL, SHIFT], icon: browser.png,   label: "Toggle browser pane" }
  - { key: S,    mods: [CMDCTRL, SHIFT], icon: pick.png,      label: "Select element in browser" }
  - { key: "`",  mods: [CTRL],           icon: terminal.png,  label: "Toggle terminal pane" }
  - { key: "\\", mods: [CMDCTRL],        icon: closepane.png, label: "Close focused pane" }
  - { key: ";",  mods: [CMDCTRL],        icon: sidechat.png,  label: "Open side chat" }
  - { key: O,    mods: [CTRL],           icon: viewmode.png,  label: "Cycle view modes" }
  - { key: M,    mods: [CMDCTRL, SHIFT], icon: permission.png, label: "Permission mode menu" }
  - { key: I,    mods: [CMDCTRL, SHIFT], icon: model.png,     label: "Model menu" }
  - { key: E,    mods: [CMDCTRL, SHIFT], icon: effort.png,    label: "Effort menu" }
  # --- Chat tab (Windows list; macOS unconfirmed) ---
  - { key: K,     mods: [CTRL],        except: [macos], icon: search.png,    label: "Quick chat or search" }
  - { key: K,     mods: [CTRL, SHIFT], except: [macos], icon: search.png,    label: "Search" }
  - { key: Q,     mods: [CTRL],        except: [macos], icon: recents.png,   label: "Switch between recents" }
  - { key: B,     mods: [CTRL],        except: [macos], icon: sidebar.png,   label: "Toggle sidebar" }
  - { key: ",",   mods: [CTRL],        except: [macos], icon: settings.png,  label: Settings }
  - { key: RIGHT, mods: [CTRL, ALT],   except: [macos], icon: next.png,      label: "Next sidebar tab" }
  - { key: LEFT,  mods: [CTRL, ALT],   except: [macos], icon: prev.png,      label: "Previous sidebar tab" }
  - { key: U,     mods: [CTRL],        except: [macos], icon: attach.png,    label: "Add files or photos" }
  - { key: D,     mods: [CTRL],        except: [macos], icon: dictation.png, label: "Toggle dictation" }
  - { key: ".",   mods: [CTRL, SHIFT], except: [macos], icon: model.png,     label: "Model menu" }
  - { key: "1",   mods: [CTRL],        except: [macos], icon: tab1.png,      mode: luma, label: "Jump to chat 1", source: "ms-fluent/Tab (MIT) + digit" }
  - { key: "2",   mods: [CTRL],        except: [macos], icon: tab2.png,      mode: luma, label: "Jump to chat 2", source: "ms-fluent/Tab (MIT) + digit" }
  - { key: "3",   mods: [CTRL],        except: [macos], icon: tab3.png,      mode: luma, label: "Jump to chat 3", source: "ms-fluent/Tab (MIT) + digit" }
  - { key: "4",   mods: [CTRL],        except: [macos], icon: tab4.png,      mode: luma, label: "Jump to chat 4", source: "ms-fluent/Tab (MIT) + digit" }
  - { key: "5",   mods: [CTRL],        except: [macos], icon: tab5.png,      mode: luma, label: "Jump to chat 5", source: "ms-fluent/Tab (MIT) + digit" }
  - { key: "6",   mods: [CTRL],        except: [macos], icon: tab6.png,      mode: luma, label: "Jump to chat 6", source: "ms-fluent/Tab (MIT) + digit" }
  - { key: "7",   mods: [CTRL],        except: [macos], icon: tab7.png,      mode: luma, label: "Jump to chat 7", source: "ms-fluent/Tab (MIT) + digit" }
  - { key: "8",   mods: [CTRL],        except: [macos], icon: tab8.png,      mode: luma, label: "Jump to chat 8", source: "ms-fluent/Tab (MIT) + digit" }
  - { key: "9",   mods: [CTRL],        except: [macos], icon: tab9.png,      mode: luma, label: "Jump to chat 9", source: "ms-fluent/Tab (MIT) + digit" }
