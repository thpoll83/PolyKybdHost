# Jan (jan.ai) desktop app overlays for PolyKybd. See SOURCES_localai.md.
#
# Source: the app's own code, janhq/jan@3d9529d (Apache-2.0):
#   web-app/src/lib/shortcuts/const.ts       -- the shortcut table
#   web-app/src/providers/KeyboardShortcuts.tsx -- which entries are live
#   web-app/src/hooks/useMessageZoom.ts      -- the zoom pair
# Every entry is `usePlatformMetaKey: true` (Cmd on macOS, Ctrl elsewhere,
# lib/shortcuts/platform.ts) -> CMDCTRL. The Projects doc
# (jan.ai/docs/desktop/projects) also gives Cmd+P for a new project.
#
# Not drawn:
#   - Cmd/Ctrl+M "new agent chat": defined in const.ts but its handler is
#     commented out ("disabled, kept as dead code").
#   - Zoom's `+` alias: the same physical key as `=` with Shift, which the zoom
#     hook does not compare; `=` is drawn.
#   - Enter / Shift+Enter (send / newline) in the composer: Enter alone, and
#     Shift+Enter is a text newline, not a command.
#
# Regenerate:
#   python polyhost/res/overlay_sources/aichat/fetch_icons.py
#   python polyhost/res/overlay_sources/aichat/fetch_icons_localai.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/aichat/jan.yaml --preview /tmp/jan_preview
app: jan
match: [jan, jan-desktop]
output: jan_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

# Jan's own icon (a waving hand). Swept alpha/luma/bright x 150..225 at 37x32
# and 40x38: luma t225 keeps the fingers apart and the motion lines lit.
program_icon: jan.png
program_icon_mode: luma
program_icon_threshold: 225
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  - { key: N,   mods: [CMDCTRL], icon: newchat.png,   label: "New chat",
      source: "const.ts NEW_CHAT; KeyboardShortcuts.tsx" }
  - { key: B,   mods: [CMDCTRL], icon: sidebar.png,   label: "Toggle sidebar",
      source: "const.ts TOGGLE_SIDEBAR" }
  - { key: P,   mods: [CMDCTRL], icon: newfolder.png, label: "New project",
      source: "const.ts NEW_PROJECT; jan.ai/docs/desktop/projects" }
  - { key: K,   mods: [CMDCTRL], icon: search.png,    label: "Search chats",
      source: "const.ts SEARCH" }
  - { key: J,   mods: [CMDCTRL], icon: assistant.png, label: "Switch assistant",
      source: "const.ts SWITCH_ASSISTANT" }
  - { key: ",", mods: [CMDCTRL], icon: settings.png,  label: Settings,
      source: "const.ts GO_TO_SETTINGS" }
  - { key: "=", mods: [CMDCTRL], label: "Zoom in",
      source: "const.ts ZOOM_IN; useMessageZoom.ts (chat text only)" }
  - { key: "-", mods: [CMDCTRL], label: "Zoom out",
      source: "const.ts ZOOM_OUT; useMessageZoom.ts (chat text only)" }
