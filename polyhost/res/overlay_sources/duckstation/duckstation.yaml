# DuckStation (PlayStation emulator) shortcut overlay for PolyKybd. See SOURCES.md.
#
# Keys are DuckStation's defaults, release v0.1-12442 (stenzek/duckstation): the
# hotkeys of Settings::SetDefaultHotkeyConfig in src/core/hotkeys.cpp and the
# keyboard map of controller 1 from InputManager::GetGenericBindingMapping in
# src/util/input_manager.cpp. Controller 1 is an analog controller by default.
# Esc opens the pause menu and carries the mark.
#
# DuckStation is licensed CC BY-NC-ND 4.0. Only the default keys, which are
# facts, were read from its source. None of its art or text is copied; the ESC
# mark is the name set in an open font.
#
# Regenerate:
#   PYTHONPATH=. .venv/bin/python polyhost/res/overlay_sources/duckstation/fetch_icons.py
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/duckstation/duckstation.yaml --preview /tmp/duckstation_preview
app: duckstation
match: [duckstation-qt, duckstation-qt-x64-releaseltcg, duckstation-qt-arm64-releaseltcg, duckstation, org.duckstation.duckstation]
output: duckstation_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: alpha
threshold: 128

# "Duck" over "Station" drawn over the whole cell, without the ESC legend
# (protocol v25).
program_icon: program.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0
program_icon_legend: false

bindings:
  # Hotkeys
  - { key: TAB, mods: [], icon: ffhold.png, label: "Fast-forward (hold)" }
  - { key: SPACE, mods: [], icon: pause.png, label: Pause }
  - { key: F10, mods: [], icon: screenshot.png, label: Screenshot }
  - { key: F11, mods: [], icon: fullscreen.png, label: "Full screen" }
  - { key: F1, mods: [], icon: loadstate.png, label: "Load state" }
  - { key: F2, mods: [], icon: savestate.png, label: "Save state" }
  - { key: F3, mods: [], icon: slotminus.png, label: "Previous state slot" }
  - { key: F4, mods: [], icon: slotplus.png, label: "Next state slot" }
  # Analog controller, port 1; drawn 1:1 at their own size
  - { key: I, mods: [], icon: triangle.png, label: "Triangle", region: [32, 32], margin: 2 }
  - { key: L, mods: [], icon: circle.png, label: "Circle", region: [32, 32], margin: 2 }
  - { key: K, mods: [], icon: cross.png, label: "Cross", region: [32, 32], margin: 2 }
  - { key: J, mods: [], icon: square.png, label: "Square", region: [32, 32], margin: 2 }
  - { key: Q, mods: [], icon: l1.png, label: "L1", region: [40, 24], margin: 2 }
  - { key: "1", mods: [], icon: l2.png, label: "L2", region: [40, 24], margin: 2 }
  - { key: "2", mods: [], icon: l3.png, label: "L3 (left stick click)", region: [40, 24], margin: 2 }
  - { key: E, mods: [], icon: r1.png, label: "R1", region: [40, 24], margin: 2 }
  - { key: "3", mods: [], icon: r2.png, label: "R2", region: [40, 24], margin: 2 }
  - { key: "4", mods: [], icon: r3.png, label: "R3 (right stick click)", region: [40, 24], margin: 2 }
  - { key: ENTER, mods: [], icon: start.png, label: "Start", region: [49, 15], margin: 2 }
  - { key: BACKSPACE, mods: [], icon: select.png, label: "Select", region: [57, 15], margin: 2 }
  - { key: UP, mods: [], icon: dpadup.png, label: "D-pad up", region: [32, 32], margin: 2 }
  - { key: DOWN, mods: [], icon: dpaddown.png, label: "D-pad down", region: [32, 32], margin: 2 }
  - { key: LEFT, mods: [], icon: dpadleft.png, label: "D-pad left", region: [32, 32], margin: 2 }
  - { key: RIGHT, mods: [], icon: dpadright.png, label: "D-pad right", region: [32, 32], margin: 2 }
  - { key: W, mods: [], icon: lstickup.png, label: "Left stick up", region: [32, 32], margin: 2 }
  - { key: S, mods: [], icon: lstickdown.png, label: "Left stick down", region: [32, 32], margin: 2 }
  - { key: A, mods: [], icon: lstickleft.png, label: "Left stick left", region: [32, 32], margin: 2 }
  - { key: D, mods: [], icon: lstickright.png, label: "Left stick right", region: [32, 32], margin: 2 }
  - { key: T, mods: [], icon: rstickup.png, label: "Right stick up", region: [32, 32], margin: 2 }
  - { key: G, mods: [], icon: rstickdown.png, label: "Right stick down", region: [32, 32], margin: 2 }
  - { key: F, mods: [], icon: rstickleft.png, label: "Right stick left", region: [32, 32], margin: 2 }
  - { key: H, mods: [], icon: rstickright.png, label: "Right stick right", region: [32, 32], margin: 2 }
