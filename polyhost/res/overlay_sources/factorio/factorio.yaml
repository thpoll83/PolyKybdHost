# Factorio 2.0 overlay for PolyKybd.
#
# Keys: the default controls listed on the Factorio Wiki "Controls" page
# (wiki.factorio.com/Keyboard_bindings redirects there). See SOURCES.md.
#
# Every labelled key does the same thing whatever is selected. Mouse bindings
# have no keycap cell. A user who rebinds a control in the game still sees the
# default here.
#
# macOS: the game loads Cut, Copy, Paste, Undo and Redo on Cmd instead of Ctrl
# (CMDCTRL below), which emits factorio_template_mac.*. Every other modifier is
# the same on every platform.
#
# Regenerate:
#   python polyhost/res/overlay_sources/factorio/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/factorio/factorio.yaml --preview /tmp/factorio_preview
app: factorio
match: [factorio, factorio.exe, steam_app_427520]
output: factorio_template
icon_dir: icons
fit: contain
mode: alpha
threshold: 150
# As for AoE2 and Warcraft III: the icon uses the full height on the right; the
# firmware clears 3 px around it, so a letter legend stays whole.
anchor: right
region: [40, 40]
margin: 0

# FACTORIO drawn over the whole cell, without the ESC legend (protocol v25).
program_icon: program.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0
program_icon_legend: false

bindings:

  # Movement
  - { key: W, icon: up.png, label: "Move up" }
  - { key: A, icon: left.png, label: "Move left" }
  - { key: S, icon: down.png, label: "Move down" }
  - { key: D, icon: right.png, label: "Move right" }

  # Basic interaction
  - { key: E, icon: inventory.png, label: "Character screen" }
  - { key: Q, icon: pipette.png, label: "Pipette / clear cursor" }
  - { key: R, icon: rotate.png, label: "Rotate" }
  - { key: R, mods: [SHIFT], icon: rotateback.png, label: "Reverse rotate" }
  - { key: H, icon: fliph.png, label: "Flip horizontal" }
  - { key: V, icon: flipv.png, label: "Flip vertical" }
  - { key: F, icon: pickup.png, label: "Pick up items" }
  - { key: Z, icon: drop.png, label: "Drop item" }
  - { key: G, icon: raillayer.png, label: "Toggle rail layer" }
  - { key: C, icon: weapon.png, label: "Next weapon" }
  - { key: SPACE, icon: shoot.png, label: "Shoot enemy" }
  - { key: SPACE, mods: [SHIFT], icon: shootselected.png, label: "Shoot selected" }
  - { key: ENTER, icon: vehicle.png, label: "Enter / leave vehicle" }
  - { key: GRAVE, icon: chat.png, label: "Chat and console" }

  # Quickbar: 1..0 use a slot, Shift+digit selects a quickbar, X rotates them
  - { key: "1", icon: slot1.png, label: "Quickbar slot 1" }
  - { key: "2", icon: slot2.png, label: "Quickbar slot 2" }
  - { key: "3", icon: slot3.png, label: "Quickbar slot 3" }
  - { key: "4", icon: slot4.png, label: "Quickbar slot 4" }
  - { key: "5", icon: slot5.png, label: "Quickbar slot 5" }
  - { key: "6", icon: slot6.png, label: "Quickbar slot 6" }
  - { key: "7", icon: slot7.png, label: "Quickbar slot 7" }
  - { key: "8", icon: slot8.png, label: "Quickbar slot 8" }
  - { key: "9", icon: slot9.png, label: "Quickbar slot 9" }
  - { key: "0", icon: slot0.png, label: "Quickbar slot 10" }
  - { key: "1", mods: [SHIFT], icon: bar1.png, label: "Select quickbar 1" }
  - { key: "2", mods: [SHIFT], icon: bar2.png, label: "Select quickbar 2" }
  - { key: "3", mods: [SHIFT], icon: bar3.png, label: "Select quickbar 3" }
  - { key: "4", mods: [SHIFT], icon: bar4.png, label: "Select quickbar 4" }
  - { key: "5", mods: [SHIFT], icon: bar5.png, label: "Select quickbar 5" }
  - { key: "6", mods: [SHIFT], icon: bar6.png, label: "Select quickbar 6" }
  - { key: "7", mods: [SHIFT], icon: bar7.png, label: "Select quickbar 7" }
  - { key: "8", mods: [SHIFT], icon: bar8.png, label: "Select quickbar 8" }
  - { key: "9", mods: [SHIFT], icon: bar9.png, label: "Select quickbar 9" }
  - { key: "0", mods: [SHIFT], icon: bar0.png, label: "Select quickbar 10" }
  - { key: X, icon: quickbars.png, label: "Rotate active quickbars" }

  # Panels
  - { key: TAB, icon: map.png, label: "World map" }
  - { key: M, icon: map.png, label: "World map" }
  - { key: T, icon: technology.png, label: "Technology screen" }
  - { key: P, icon: production.png, label: "Production statistics" }
  - { key: L, icon: networks.png, label: "Logistic networks" }
  - { key: B, icon: library.png, label: "Blueprint library" }
  - { key: O, icon: trains.png, label: "Train overview" }
  - { key: F1, icon: logistics.png, label: "Character logistics", region: [34, 40] }
  - { key: F2, icon: character.png, label: "Character info", region: [34, 40] }
  - { key: F3, icon: crafting.png, label: "Character crafting" }
  - { key: LEFT, mods: [ALT], icon: back.png, label: "Previous window" }
  - { key: RIGHT, mods: [ALT], icon: forward.png, label: "Next window" }

  # Trains
  - { key: J, icon: connect.png, label: "Connect train" }
  - { key: K, icon: disconnect.png, label: "Disconnect train" }

  # Tools (Ctrl is Cmd on macOS for these five, see the header)
  - { key: C, mods: [CMDCTRL], label: "Copy" }
  - { key: X, mods: [CMDCTRL], label: "Cut" }
  - { key: V, mods: [CMDCTRL], label: "Paste" }
  - { key: Z, mods: [CMDCTRL], label: "Undo" }
  - { key: Y, mods: [CMDCTRL], label: "Redo" }
  - { key: Z, mods: [CMDCTRL, SHIFT], label: "Redo" }
  - { key: F, mods: [CTRL], label: "Find" }
  - { key: T, mods: [ALT], icon: artillery.png, label: "Artillery targeting remote" }
  - { key: B, mods: [ALT], icon: newblueprint.png, label: "New blueprint" }
  - { key: D, mods: [ALT], icon: newdecon.png, label: "New deconstruction planner" }
  - { key: U, mods: [ALT], icon: newupgrade.png, label: "New upgrade planner" }
  - { key: C, mods: [ALT], icon: wirecopper.png, label: "Copper wire mode" }
  - { key: R, mods: [ALT], icon: wirered.png, label: "Red wire mode" }
  - { key: G, mods: [ALT], icon: wiregreen.png, label: "Green wire mode" }
  - { key: Y, mods: [ALT], icon: discharge.png, label: "Discharge defense remote" }
  - { key: A, mods: [ALT], icon: spidertron.png, label: "Spidertron remote" }
  - { key: E, mods: [ALT], icon: exoskeleton.png, label: "Toggle exoskeleton" }
  - { key: L, mods: [ALT], icon: logistics.png, label: "Toggle personal logistics requests" }
  - { key: F, mods: [ALT], icon: roboport.png, label: "Toggle personal roboport" }

  # Miscellaneous and debug
  - { key: PAUSE, icon: pause.png, label: "Pause game" }
  - { key: F4, icon: debugsettings.png, label: "Debug settings", region: [30, 40] }
  - { key: F5, icon: basicdebug.png, label: "Basic debug", region: [30, 40] }
  - { key: F9, icon: resetzoom.png, label: "Reset zoom level" }
  - { key: F9, mods: [SHIFT], icon: zoom2x.png, label: "Zoom level 2x" }
  - { key: F10, icon: replaynext.png, label: "Next player in replay" }
  - { key: F4, mods: [CTRL, SHIFT], icon: hidegui.png, label: "Toggle GUI visibility" }

# Art read at runtime from the user's own Factorio install, when it is on the
# machine (polyhost/services/game_assets, reader factorio). It replaces the
# shipped icon of the same name; nothing read from the game is committed. Each
# `file` is the path the game's own prototype definitions give for that control
# or item (wube/factorio-data, see SOURCES.md), relative to the data folder.
# `silhouette` draws the shape of a one-colour GUI symbol; `threshold` lights
# the light parts of coloured item art (it read better than `dither` at 40 px).
game_assets:
  reader: factorio
  icons:
    # The buttons at the top right of the game screen open the same panels.
    library: {file: core/graphics/side-menu-buttons.png, size: 64, row: 0, mode: silhouette}
    production: {file: core/graphics/side-menu-buttons.png, size: 64, row: 1, mode: silhouette}
    trains: {file: core/graphics/side-menu-buttons.png, size: 64, row: 4, mode: silhouette}
    map: {file: core/graphics/side-menu-buttons.png, size: 64, row: 7, mode: silhouette}
    networks: {file: core/graphics/side-menu-buttons.png, size: 64, row: 9, mode: silhouette}
    technology: {file: core/graphics/side-menu-buttons.png, size: 64, row: 11, mode: silhouette}
    # The shortcut bar buttons of the same controls (associated_control_input):
    # 56 px since Factorio 2.0.18, 32 px before; the first file found is read.
    newblueprint: {file: [base/graphics/icons/shortcut-toolbar/mip/new-blueprint-x56.png, base/graphics/icons/shortcut-toolbar/mip/new-blueprint-x32.png], mode: silhouette}
    newdecon: {file: [base/graphics/icons/shortcut-toolbar/mip/new-deconstruction-planner-x56.png, base/graphics/icons/shortcut-toolbar/mip/new-deconstruction-planner-x32.png], mode: silhouette}
    newupgrade: {file: [base/graphics/icons/shortcut-toolbar/mip/new-upgrade-planner-x56.png, base/graphics/icons/shortcut-toolbar/mip/new-upgrade-planner-x32.png], mode: silhouette}
    artillery: {file: [base/graphics/icons/shortcut-toolbar/mip/artillery-targeting-remote-x56.png, base/graphics/icons/shortcut-toolbar/mip/artillery-targeting-remote-x32.png], mode: silhouette}
    discharge: {file: [base/graphics/icons/shortcut-toolbar/mip/discharge-defense-remote-x56.png, base/graphics/icons/shortcut-toolbar/mip/discharge-defense-remote-x32.png], mode: silhouette}
    spidertron: {file: [base/graphics/icons/shortcut-toolbar/mip/new-rts-tool-x56.png, base/graphics/icons/shortcut-toolbar/mip/new-rts-tool-x32.png], mode: silhouette}
    exoskeleton: {file: [base/graphics/icons/shortcut-toolbar/mip/toggle-exoskeleton-x56.png, base/graphics/icons/shortcut-toolbar/mip/toggle-exoskeleton-x32.png], mode: silhouette}
    roboport: {file: [base/graphics/icons/shortcut-toolbar/mip/toggle-personal-roboport-x56.png, base/graphics/icons/shortcut-toolbar/mip/toggle-personal-roboport-x32.png], mode: silhouette}
    # Item and character art. F1 and Alt+L share the icon, in F1's 34 px area.
    weapon: {file: base/graphics/icons/pistol.png, mode: threshold}
    vehicle: {file: base/graphics/icons/car.png, mode: threshold}
    raillayer: {file: base/graphics/icons/rail.png, mode: threshold}
    logistics: {file: base/graphics/icons/logistic-robot.png, mode: threshold, region: [34, 40]}
    character: {file: core/graphics/icons/entity/character.png, mode: silhouette}
