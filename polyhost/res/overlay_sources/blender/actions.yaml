# What each Blender operator means on a keycap: a short label + an icon stem
# (icons/<stem>.png, fetched by fetch_icons.py). Read by gen_blender_bindings.py.
#
# Keys are the generator's ACTION KEYS: `idname(prop=value,...)` over the keymap
# item's scalar properties, sorted (run the generator with --list-unmapped to
# see them). Lookup order: the exact key; then the longest entry ending in `*`
# that the key starts with; then the bare idname.
#
#   label  - what the preview prints. A label that IS a shared concept ("Save",
#            "Undo", "Copy", "Select all", ...) is drawn by the host's shared
#            renderer instead of `icon` (see the generate-app-overlays skill), so
#            those entries carry no icon.
#   icon   - stem in icons/; omit only for a shared-concept label.
#   mode   - per-icon render override (borrowed drawn glyphs are alpha-shaped).
#   skip   - Blender binds the chord but there is nothing worth drawing (an
#            internal/modal operator). The cell stays EMPTY: a lower keymap's
#            action would never run there, so it must not show through.
#
# Labels are Blender's own operator / menu names, shortened to fit.

