  - { key: U, mods: [SHIFT], icon: rush_ne.png, label: "Rush north-east" }
  - { key: B, mods: [SHIFT], icon: rush_sw.png, label: "Rush south-west" }
  - { key: N, mods: [SHIFT], icon: rush_se.png, label: "Rush south-east" }
  - { key: A, mods: [SHIFT], icon: takeoffall.png, label: "Take off all armor" }
