# NetHack overlay for PolyKybd.
#
# Keys: the command table `extcmdlist[]` in src/cmd.c of NetHack/NetHack,
# release tag NetHack-5.0.0_Released, compared with NetHack-3.6.7_Released.
# Only the keys that mean the same in both releases are drawn. See SOURCES.md.
#
# The game gives a lower-case letter, an upper-case letter, Ctrl+letter and
# Meta+letter different commands, so the plain, Shift, Ctrl, Alt and Alt+Shift
# layers are drawn. The Shift layer's symbol keys follow the US layout.
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/nethack/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/nethack/nethack.yaml --preview /tmp/nethack_preview
app: nethack
match: [nethack, nethack.exe, nethackw, nethackw.exe]
output: nethack_template
icon_dir: icons
fit: contain
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150
# As for fheroes2: the icon uses the full height on the right; the firmware
# clears 3 px around it, so a letter legend stays whole.
anchor: right
region: [40, 40]
margin: 0

# "Net" over "Hack" drawn over the whole cell, without the ESC legend
# (protocol v25).
program_icon: program.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0
program_icon_legend: false

bindings:

  # --- Plain keys ---------------------------------------------------------
  # Movement (vi keys; the number_pad option is off by default)
  - { key: H, icon: move_w.png, label: "Move west" }
  - { key: J, icon: move_s.png, label: "Move south" }
  - { key: K, icon: move_n.png, label: "Move north" }
  - { key: L, icon: move_e.png, label: "Move east" }
  - { key: Y, icon: move_nw.png, label: "Move north-west" }
  - { key: U, icon: move_ne.png, label: "Move north-east" }
  - { key: B, icon: move_sw.png, label: "Move south-west" }
  - { key: N, icon: move_se.png, label: "Move south-east" }
  - { key: DOT, icon: wait.png, label: "Rest one move" }
  - { key: S, icon: search.png, label: "Search for traps and secret doors" }
  # Items and actions
  - { key: A, icon: apply.png, label: "Apply (use) a tool" }
  - { key: C, icon: closedoor.png, label: "Close a door" }
  - { key: D, icon: drop.png, label: "Drop an item" }
  - { key: E, icon: eat.png, label: "Eat something" }
  - { key: F, icon: fire.png, label: "Fire ammunition from the quiver" }
  - { key: I, icon: inventory.png, label: "Show the inventory" }
  - { key: O, icon: opendoor.png, label: "Open a door" }
  - { key: P, icon: pay.png, label: "Pay the shopping bill" }
  - { key: Q, icon: quaff.png, label: "Quaff (drink) something" }
  - { key: R, icon: read.png, label: "Read a scroll or spellbook" }
  - { key: T, icon: throw.png, label: "Throw something" }
  - { key: W, icon: wield.png, label: "Wield a weapon" }
  - { key: X, icon: swapweapons.png, label: "Swap the wielded and the secondary weapon" }
  - { key: Z, icon: zap.png, label: "Zap a wand" }
  - { key: COMMA, icon: pickup.png, label: "Pick up things here" }
  - { key: SLASH, icon: whatis.png, label: "Show what a symbol means" }
  - { key: SEMICOLON, icon: glance.png, label: "Show what a map symbol is" }
  - { key: BACKSLASH, icon: known.png, label: "Show the discovered object types" }
  - { key: GRAVE, icon: knownclass.png, label: "Show the discovered types of one class" }

