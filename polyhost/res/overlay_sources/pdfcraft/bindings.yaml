# PdfCraft shortcut overlays for PolyKybd (Windows, Linux and macOS).
#
# PdfCraft (github.com/storytold/pdfcraft) is an Acrobat-like PDF workbench in
# Rust/egui. The keymap is PdfCraft's OWN, read from its source at commit
# b5467d93 (SOURCES.md has file:line per group), not Acrobat's.
#
# ONE spec, TWO artwork sets: egui's Modifiers::COMMAND is Ctrl on
# Windows/Linux and Cmd on macOS -> CMDCTRL. The one chord that is not a clean
# swap (Read mode: COMMAND|CTRL, i.e. Ctrl+H vs Cmd+Ctrl+H) is written twice
# with disjoint `only:` lists.
#
# Icons: Microsoft Fluent UI System Icons (MIT); actions shared with the Word
# overlay reuse word/icons. ESC: PdfCraft's own lion icon (MIT OR Apache-2.0).
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/pdfcraft/fetch_icons.py
#   PYTHONPATH=. python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/pdfcraft/bindings.yaml --preview /tmp/pdfcraft_preview
app: pdfcraft
# pdfcraft.exe (Windows), "PdfCraft" (macOS bundle name / process), and the
# Linux WM_CLASS / Wayland app id ai.storyteller.pdfcraft (main.rs with_app_id,
# .desktop StartupWMClass).
match: [pdfcraft, ai.storyteller.pdfcraft]
output: pdfcraft_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

# PdfCraft's own icon (engraved lion on a green rounded tile), 64 px ICO frame.
# Swept frames 40..256 x bright/luma x t60..215 at keycap size: luma t140 keeps
# the tile lit with the lion's face cut out of it, the only variant where the
# face reads as a lion; bright lights the mane as a blob, luma <118 drops the
# field and leaves scattered strokes.
program_icon: progmark.png
program_icon_mode: luma
program_icon_threshold: 140
program_icon_anchor: bottom-right
program_icon_region: [46, 40]
program_icon_margin: 0

bindings:
  # --- file (command registry, crates/engine/src/commands.rs) ---
  - { key: O, mods: [CMDCTRL],        icon: open.png,       label: Open,         source: "word/icons (ms-fluent Folder Open, MIT)" }
  - { key: S, mods: [CMDCTRL],        icon: save.png,       label: Save,         source: "word/icons (ms-fluent Save, MIT)" }
  - { key: S, mods: [CMDCTRL, SHIFT], icon: saveas.png,     label: "Save as",    source: "word/icons (ms-fluent Save Edit, MIT)" }
  - { key: W, mods: [CMDCTRL],        icon: close.png,      label: "Close file", source: "word/icons (ms-fluent Document Dismiss, MIT)" }
  - { key: W, mods: [CMDCTRL, SHIFT], icon: closeall.png,   label: "Close all",  source: "ms-fluent/Dismiss Square Multiple (MIT)" }
  - { key: P, mods: [CMDCTRL],        icon: print.png,      label: Print,        source: "word/icons (ms-fluent Print, MIT)" }
  - { key: D, mods: [CMDCTRL],        icon: properties.png, label: "Document properties", source: "ms-fluent/Info (MIT)" }

  # --- edit ---
  - { key: Z, mods: [CMDCTRL],        icon: undo.png,       label: Undo,         source: "word/icons (ms-fluent Arrow Undo, MIT)" }
  - { key: Z, mods: [CMDCTRL, SHIFT], icon: redo.png,       label: Redo,         source: "word/icons (ms-fluent Arrow Redo, MIT)" }
  - { key: C, mods: [CMDCTRL],        icon: copy.png,       label: Copy,         source: "word/icons (ms-fluent Copy, MIT)" }
  - { key: A, mods: [CMDCTRL],        icon: selectall.png,  label: "Select all", source: "word/icons (ms-fluent Select All On, MIT)" }
  - { key: F, mods: [CMDCTRL],        icon: find.png,       label: Find,         source: "word/icons (ms-fluent Search, MIT)" }
  - { key: F, mods: [CMDCTRL, SHIFT], icon: advsearch.png,  label: "Advanced search", source: "ms-fluent/Document Search (MIT)" }
  - { key: G, mods: [CMDCTRL],        label: "Find next",     source: "concept (shared)" }
  - { key: G, mods: [CMDCTRL, SHIFT], icon: findprev.png, label: "Find previous", source: "composed: word find.png (ms-fluent Search) + ms-fluent/Arrow Up (MIT)" }
  - { key: ",", mods: [CMDCTRL],      icon: settings.png,   label: Preferences,  source: "ms-fluent/Settings (MIT)" }

  # --- view ---
  - { key: K, mods: [CMDCTRL],        icon: palette.png,    label: "Command palette", source: "ms-fluent/Apps List Detail (MIT)" }
  - { key: L, mods: [CMDCTRL],        icon: fullscreen.png, label: "Full screen", source: "ms-fluent/Full Screen Maximize (MIT)" }
  - { key: H, mods: [CTRL],           icon: readmode.png,   label: "Read mode",  source: "ms-fluent/Book Open (MIT)", only: [windows, linux] }
  # macOS: COMMAND|CTRL -> Cmd+Ctrl+H
  - { key: H, mods: [GUI, CTRL],      icon: readmode.png,   label: "Read mode",  source: "ms-fluent/Book Open (MIT)", only: [macos] }
  - { key: N, mods: [CMDCTRL, SHIFT], icon: gotopage.png,   label: "Go to page", source: "ms-fluent/Document Page Number (MIT)" }
  - { key: J, mods: [CMDCTRL],        icon: jsconsole.png,  label: "JavaScript console", source: "ms-fluent/Window Console (MIT)" }
  - { key: B, mods: [CMDCTRL],        icon: bookmarkadd.png, label: "New bookmark", source: "ms-fluent/Bookmark Add (MIT)" }

  # --- zoom / fit / rotate (canvas.rs::shortcuts, commands.rs consts) ---
  - { key: "0", mods: [CMDCTRL],        icon: fitpage.png,    label: "Fit page",    source: "ms-fluent/Page Fit (MIT)" }
  - { key: "1", mods: [CMDCTRL],        icon: actualsize.png, label: "Actual size", source: "ms-fluent/Ratio One To One (MIT)" }
  - { key: "2", mods: [CMDCTRL],        icon: fitwidth.png,   label: "Fit width",   source: "ms-fluent/Arrow Autofit Width (MIT)" }
  - { key: "3", mods: [CMDCTRL],        icon: fitvisible.png, label: "Fit visible", source: "ms-fluent/Arrow Fit (MIT)" }
  - { key: "=", mods: [CMDCTRL],        icon: zoomin.png,     label: "Zoom in",     source: "ms-fluent/Zoom In (MIT)" }
  - { key: "-", mods: [CMDCTRL],        icon: zoomout.png,    label: "Zoom out",    source: "ms-fluent/Zoom Out (MIT)" }
  - { key: "=", mods: [CMDCTRL, SHIFT], icon: rotatecw.png,   label: "Rotate view clockwise",        source: "ms-fluent/Arrow Rotate Clockwise (MIT)" }
  - { key: "-", mods: [CMDCTRL, SHIFT], icon: rotateccw.png,  label: "Rotate view counterclockwise", source: "ms-fluent/Arrow Rotate Counterclockwise (MIT)" }
  - { key: "[", mods: [CMDCTRL],        icon: prevview.png,   label: "Previous view", source: "ms-fluent/Arrow Hook Up Left (MIT)" }
  - { key: "]", mods: [CMDCTRL],        icon: nextview.png,   label: "Next view",     source: "ms-fluent/Arrow Hook Up Right (MIT)" }

  # --- page navigation (canvas.rs::shortcuts) ---
  - { key: LEFT,  mods: [CMDCTRL], icon: prevpage.png,  label: "Previous page", source: "ms-fluent/Chevron Left (MIT)" }
  - { key: RIGHT, mods: [CMDCTRL], icon: nextpage.png,  label: "Next page",     source: "ms-fluent/Chevron Right (MIT)" }
  - { key: LEFT,  mods: [],        icon: prevpage.png,  label: "Previous page", source: "ms-fluent/Chevron Left (MIT)" }
  - { key: RIGHT, mods: [],        icon: nextpage.png,  label: "Next page",     source: "ms-fluent/Chevron Right (MIT)" }
  - { key: PGUP,  mods: [CMDCTRL], icon: prevpage.png,  label: "Previous page", source: "ms-fluent/Chevron Left (MIT)" }
  - { key: PGDN,  mods: [CMDCTRL], icon: nextpage.png,  label: "Next page",     source: "ms-fluent/Chevron Right (MIT)" }
  - { key: HOME,  mods: [],        icon: firstpage.png, label: "First page",    source: "ms-fluent/Previous (MIT)" }
  - { key: END,   mods: [],        icon: lastpage.png,  label: "Last page",     source: "ms-fluent/Next (MIT)" }

  # --- quick tools, plain keys (lib.rs::tool_keys) ---
  - { key: V, mods: [], icon: select.png, label: "Select tool", source: "ms-fluent/Cursor (MIT)" }
  - { key: H, mods: [], icon: hand.png,   label: "Hand tool",   source: "ms-fluent/Hand Right (MIT)" }

  # --- selection (comments.rs, content_ui.rs, link_ui.rs, prepare.rs, panels.rs) ---
  - { key: DELETE, mods: [], icon: delete.png, label: Delete, source: "ms-fluent/Delete (MIT)" }
