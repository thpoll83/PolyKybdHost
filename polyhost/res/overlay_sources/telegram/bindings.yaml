# Telegram Desktop shortcut overlays for PolyKybd (Windows, Linux, macOS). See SOURCES.md.
#
# The keys are Telegram Desktop's own defaults, read from its source:
# `Manager::fillDefaults()` in Telegram/SourceFiles/core/shortcuts.cpp and the
# formatting sequences in lib_ui ui/widgets/fields/input_field.h. Users can
# change keys in shortcuts-custom.json; the set shows the defaults.
#
# Qt writes "ctrl" for the Cmd key on macOS, so every "ctrl+" default is
# CMDCTRL here. The folder keys are written as "meta+" on macOS, which is the
# Control key there: on macOS Cmd+1..8 opens a pinned chat and Ctrl+1..7 a
# folder. On Windows and Linux both lists use Ctrl+1..8; the folder handler is
# asked first, so Ctrl+1..7 opens a folder when the user has folders, and a
# pinned chat otherwise.
#
# Ctrl+R records a voice message while a chat is open (priority 1 in
# HistoryWidget); in the chat list the same key marks the chat read.
#
# Regenerate:
#   python polyhost/res/overlay_sources/telegram/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/telegram/bindings.yaml --preview /tmp/telegram_preview
app: telegram
match: [telegram]
output: telegram_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: telegram.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- window ---
  - { key: W, mods: [CMDCTRL], icon: closewindow.png, label: "Close window" }
  - { key: F4, mods: [CTRL], icon: closewindow.png, label: "Close window", except: [macos] }
  - { key: W, mods: [CMDCTRL, SHIFT], icon: closeothers.png, label: "Close other windows" }
  - { key: T, mods: [CMDCTRL, SHIFT], icon: reopenwindow.png, label: "Reopen closed window" }
  - { key: L, mods: [CMDCTRL], icon: lock.png, label: "Lock" }
  - { key: M, mods: [CMDCTRL], icon: minimize.png, label: "Minimize" }
  - { key: Q, mods: [CMDCTRL], icon: quit.png, label: "Quit" }

  # --- chat list ---
  - { key: F, mods: [CMDCTRL], icon: search.png, label: "Search" }
  - { key: PGDN, mods: [CMDCTRL], icon: nextchat.png, label: "Next chat" }
  - { key: PGUP, mods: [CMDCTRL], icon: prevchat.png, label: "Previous chat" }
  - { key: DOWN, mods: [ALT], icon: nextchat.png, label: "Next chat" }
  - { key: UP, mods: [ALT], icon: prevchat.png, label: "Previous chat" }
  - { key: HOME, mods: [CMDCTRL, ALT], icon: firstchat.png, label: "First chat" }
  - { key: END, mods: [CMDCTRL, ALT], icon: lastchat.png, label: "Last chat" }
  - { key: "0", mods: [CMDCTRL], icon: saved.png, label: "Saved Messages" }
  - { key: "9", mods: [CMDCTRL], icon: archive.png, label: "Archived chats" }
  - { key: J, mods: [CMDCTRL], icon: contacts.png, label: "Contacts" }
  - { key: "\\", mods: [CMDCTRL], icon: chatmenu.png, label: "Chat menu" }
  - { key: "]", mods: [CMDCTRL], icon: chatpreview.png, label: "Chat preview" }
  - { key: R, mods: [CMDCTRL], icon: voice.png, label: "Record voice message" }

  # --- folders and pinned chats: Windows and Linux (Ctrl+1..8) ---
  - { key: "1", mods: [CTRL], icon: folder1.png, label: "Folder 1", except: [macos] }
  - { key: "2", mods: [CTRL], icon: folder2.png, label: "Folder 2", except: [macos] }
  - { key: "3", mods: [CTRL], icon: folder3.png, label: "Folder 3", except: [macos] }
  - { key: "4", mods: [CTRL], icon: folder4.png, label: "Folder 4", except: [macos] }
  - { key: "5", mods: [CTRL], icon: folder5.png, label: "Folder 5", except: [macos] }
  - { key: "6", mods: [CTRL], icon: folder6.png, label: "Folder 6", except: [macos] }
  - { key: "7", mods: [CTRL], icon: lastfolder.png, label: "Last folder", except: [macos] }
  - { key: "8", mods: [CTRL], icon: chat8.png, label: "Pinned chat 8", except: [macos] }
  - { key: DOWN, mods: [CTRL, SHIFT], icon: nextfolder.png, label: "Next folder", except: [macos] }
  - { key: UP, mods: [CTRL, SHIFT], icon: prevfolder.png, label: "Previous folder", except: [macos] }

  # --- folders and pinned chats: macOS (Cmd+1..8 pinned, Ctrl+1..7 folders) ---
  - { key: "1", mods: [GUI], icon: chat1.png, label: "Pinned chat 1", only: [macos] }
  - { key: "2", mods: [GUI], icon: chat2.png, label: "Pinned chat 2", only: [macos] }
  - { key: "3", mods: [GUI], icon: chat3.png, label: "Pinned chat 3", only: [macos] }
  - { key: "4", mods: [GUI], icon: chat4.png, label: "Pinned chat 4", only: [macos] }
  - { key: "5", mods: [GUI], icon: chat5.png, label: "Pinned chat 5", only: [macos] }
  - { key: "6", mods: [GUI], icon: chat6.png, label: "Pinned chat 6", only: [macos] }
  - { key: "7", mods: [GUI], icon: chat7.png, label: "Pinned chat 7", only: [macos] }
  - { key: "8", mods: [GUI], icon: chat8.png, label: "Pinned chat 8", only: [macos] }
  - { key: "1", mods: [CTRL], icon: folder1.png, label: "Folder 1", only: [macos] }
  - { key: "2", mods: [CTRL], icon: folder2.png, label: "Folder 2", only: [macos] }
  - { key: "3", mods: [CTRL], icon: folder3.png, label: "Folder 3", only: [macos] }
  - { key: "4", mods: [CTRL], icon: folder4.png, label: "Folder 4", only: [macos] }
  - { key: "5", mods: [CTRL], icon: folder5.png, label: "Folder 5", only: [macos] }
  - { key: "6", mods: [CTRL], icon: folder6.png, label: "Folder 6", only: [macos] }
  - { key: "7", mods: [CTRL], icon: lastfolder.png, label: "Last folder", only: [macos] }
  - { key: DOWN, mods: [CTRL, SHIFT], icon: nextfolder.png, label: "Next folder", only: [macos] }
  - { key: UP, mods: [CTRL, SHIFT], icon: prevfolder.png, label: "Previous folder", only: [macos] }

  # --- message formatting (in the message field) ---
  - { key: B, mods: [CMDCTRL], icon: bold.png, label: "Bold" }
  - { key: I, mods: [CMDCTRL], icon: italic.png, label: "Italic" }
  - { key: U, mods: [CMDCTRL], icon: underline.png, label: "Underline" }
  - { key: X, mods: [CMDCTRL, SHIFT], icon: strike.png, label: "Strikethrough" }
  - { key: M, mods: [CMDCTRL, SHIFT], icon: mono.png, label: "Monospace" }
  - { key: ".", mods: [CMDCTRL, SHIFT], icon: quote.png, label: "Quote" }
  - { key: P, mods: [CMDCTRL, SHIFT], icon: spoiler.png, label: "Spoiler" }
  - { key: N, mods: [CMDCTRL, SHIFT], icon: clearformat.png, label: "Clear formatting" }
  - { key: K, mods: [CMDCTRL], icon: link.png, label: "Link" }
