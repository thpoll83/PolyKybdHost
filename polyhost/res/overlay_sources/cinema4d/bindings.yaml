# Maxon Cinema 4D shortcut overlays for PolyKybd (viewport and modeling).
# See SOURCES.md.
#
# The keys are Maxon's Keyboard Shortcuts page for Cinema 4D 2027, sections
# Editor, File, General, Render, Viewport and Modeling: the keys that act while
# the viewport has focus. The Timeline, Node Editor, Object Manager, Picture
# Viewer, Structure Manager, Motion Tracker, BodyPaint 3D and Sculpt sections
# give the same keys other meanings and are not drawn.
#
# Many Cinema 4D commands are two-key sequences ("M S" is Bevel). A sequence's
# first key is drawn with a label ending in "..." only when every sequence
# behind it is the same kind of action (M: modeling tools, K: knife cuts, N:
# viewport display modes). U mixes mesh commands and selection commands and is
# not drawn; the T sequences belong to the Timeline.
#
# Maxon: "Mac users please press the CMD key instead of the CTRL key." So every
# Ctrl chord is CMDCTRL and Alt stays ALT (Option).
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/cinema4d/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/cinema4d/bindings.yaml --preview /tmp/c4d_preview
app: cinema4d
match: [cinema 4d]
output: cinema4d_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: cinema4d.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- no modifier: tools ---
  - { key: E, mods: [], icon: move.png, label: "Move" }
  - { key: R, mods: [], icon: rotate.png, label: "Rotate" }
  - { key: T, mods: [], icon: scale.png, label: "Scale" }
  - { key: X, mods: [], icon: axis_x.png, label: "X axis / heading" }
  - { key: Y, mods: [], icon: axis_y.png, label: "Y axis / pitch" }
  - { key: Z, mods: [], icon: axis_z.png, label: "Z axis / bank" }
  - { key: W, mods: [], icon: orientation.png, label: "Coordinate system" }
  - { key: V, mods: [], icon: context_menu.png, label: "Quick command selection" }
  - { key: Q, mods: [], icon: parentgen.png, label: "Toggle parent generator" }
  - { key: SPACE, mods: [], icon: lasttool.png, label: "Toggle active tool" }
  - { key: ENTER, mods: [], icon: modelingmode.png, label: "Switch modeling mode" }
  - { key: BACKSPACE, mods: [], icon: delete.png, label: "Delete" }
  - { key: DELETE, mods: [], icon: delete.png, label: "Delete" }

  # --- no modifier: modeling ---
  - { key: C, mods: [], icon: makeeditable.png, label: "Convert primitive" }
  - { key: D, mods: [], icon: extrude.png, label: "Extrude" }
  - { key: I, mods: [], icon: inset.png, label: "Extrude inner" }
  - { key: B, mods: [], icon: stitch.png, label: "Bridge" }
  - { key: M, mods: [], icon: modeling.png, label: "Modeling tools..." }
  - { key: K, mods: [], icon: knife.png, label: "Knife tools..." }
  - { key: "4", mods: [], icon: obj_move.png, label: "Move object" }
  - { key: "5", mods: [], icon: obj_scale.png, label: "Scale object" }
  - { key: "6", mods: [], icon: obj_rotate.png, label: "Rotate object" }
  - { key: "7", mods: [], icon: parent.png, label: "Move parent" }
  - { key: "8", mods: [], icon: freehand.png, label: "Freehand selection" }
  - { key: "9", mods: [], icon: select_circle.png, label: "Live selection" }
  - { key: "0", mods: [], icon: select_box.png, label: "Rectangle selection" }

  # --- no modifier: viewport ---
  - { key: "1", mods: [], icon: cam_move.png, label: "Move camera" }
  - { key: "2", mods: [], icon: cam_scale.png, label: "Scale camera" }
  - { key: "3", mods: [], icon: cam_rotate.png, label: "Rotate camera" }
  - { key: S, mods: [], icon: zoomselected.png, label: "Zoom to selected elements" }
  - { key: O, mods: [], icon: zoomobject.png, label: "Zoom to selected object" }
  - { key: H, mods: [], icon: frame_all.png, label: "Zoom to geometry" }
  - { key: A, mods: [], icon: refresh.png, label: "Redraw" }
  - { key: N, mods: [], icon: shading.png, label: "Display mode..." }
  - { key: F1, mods: [], icon: view_persp.png, label: "Perspective view" }
  - { key: F2, mods: [], icon: view_top.png, label: "Top view" }
  - { key: F3, mods: [], icon: view_right.png, label: "Right view" }
  - { key: F4, mods: [], icon: view_front.png, label: "Front view" }
  - { key: F5, mods: [], icon: quadview.png, label: "All views" }
  - { key: PGUP, mods: [], icon: maximize.png, label: "Toggle active view" }

  # --- Shift ---
  - { key: F1, mods: [SHIFT], icon: objectmanager.png, label: "Object Manager" }
  - { key: F2, mods: [SHIFT], icon: materialmanager.png, label: "Material Manager" }
  - { key: F3, mods: [SHIFT], icon: timeline.png, label: "Timeline" }
  - { key: F4, mods: [SHIFT], icon: layermanager.png, label: "Layer Manager" }
  - { key: F5, mods: [SHIFT], icon: attributes.png, label: "Attribute Manager" }
  - { key: F6, mods: [SHIFT], icon: pictureviewer.png, label: "Picture Viewer" }
  - { key: F7, mods: [SHIFT], icon: coordinates.png, label: "Coordinate Manager" }
  - { key: F9, mods: [SHIFT], icon: structure.png, label: "Structure Manager" }
  - { key: F10, mods: [SHIFT], icon: scripts.png, label: "Script Manager" }
  - { key: F12, mods: [SHIFT], icon: commands.png, label: "Command Manager" }
  - { key: W, mods: [SHIFT], icon: closewindow.png, label: "Close window" }
  - { key: C, mods: [SHIFT], icon: commander.png, label: "Commander" }
  - { key: SPACE, mods: [SHIFT], icon: lasttwotools.png, label: "Switch last two tools" }
  - { key: V, mods: [SHIFT], icon: presets.png, label: "View presets" }
  - { key: R, mods: [SHIFT], icon: render_view.png, label: "Render to Picture Viewer" }
  - { key: Z, mods: [SHIFT], icon: adjust_last.png, label: "Undo action" }
  - { key: M, mods: [SHIFT], icon: modelingsettings.png, label: "Modeling settings" }
  - { key: S, mods: [SHIFT], icon: snap.png, label: "Snapping" }
  - { key: Q, mods: [SHIFT], icon: quantize.png, label: "Quantize" }
  - { key: X, mods: [SHIFT], icon: workplane.png, label: "Lock workplane" }

  # --- Alt (Option on macOS) ---
  - { key: S, mods: [ALT], icon: zoomselected.png, label: "Zoom to selected elements" }
  - { key: O, mods: [ALT], icon: zoomobject.png, label: "Zoom to selected object" }
  - { key: H, mods: [ALT], icon: frame_all.png, label: "Zoom to geometry" }
  - { key: D, mods: [ALT], icon: axes.png, label: "Show/hide axes" }
  - { key: V, mods: [ALT], icon: presets_all.png, label: "View presets (all)" }
  - { key: R, mods: [ALT], icon: renderregion.png, label: "Interactive render region" }
  - { key: B, mods: [ALT], icon: play_rendered.png, label: "Create preview" }
  - { key: A, mods: [ALT], icon: isoline.png, label: "Isoline editing" }
  - { key: W, mods: [ALT], icon: mirror.png, label: "Symmetry" }
  - { key: BACKSPACE, mods: [ALT], icon: melt.png, label: "Melt" }

  # --- Alt+Shift ---
  - { key: F2, mods: [ALT, SHIFT], icon: nodeeditor.png, label: "Node Editor" }
  - { key: V, mods: [ALT, SHIFT], icon: presets_similar.png, label: "Similar view presets" }

  # --- Ctrl (Cmd on macOS) ---
  - { key: N, mods: [CMDCTRL], icon: new.png, label: "New project" }
  - { key: O, mods: [CMDCTRL], icon: open.png, label: "Open project" }
  - { key: S, mods: [CMDCTRL], icon: save.png, label: "Save project" }
  - { key: Q, mods: [CMDCTRL], icon: quit.png, label: "Quit" }
  - { key: A, mods: [CMDCTRL], icon: selectall.png, label: "Select all" }
  - { key: R, mods: [CMDCTRL], icon: render.png, label: "Render view" }
  - { key: B, mods: [CMDCTRL], icon: rendersettings.png, label: "Render settings" }
  - { key: F1, mods: [CMDCTRL], icon: help.png, label: "Help" }
  - { key: BACKSPACE, mods: [CMDCTRL], icon: dissolve.png, label: "Dissolve" }
  # Edit menu: on the menu, not on the shortcut page (SOURCES.md).
  - { key: Z, mods: [CMDCTRL], icon: undo.png, label: Undo }
  - { key: Y, mods: [CMDCTRL], icon: redo.png, label: Redo }
  - { key: X, mods: [CMDCTRL], icon: cut.png, label: Cut }
  - { key: C, mods: [CMDCTRL], icon: copy.png, label: Copy }
  - { key: V, mods: [CMDCTRL], icon: paste.png, label: Paste }
  # Cmd+Tab is the macOS application switcher and never reaches the app.
  - { key: TAB, mods: [CTRL], icon: fullscreen.png, label: "Full-screen mode", only: [windows, linux] }

  # --- Ctrl+Shift ---
  - { key: O, mods: [CMDCTRL, SHIFT], icon: merge.png, label: "Merge project" }
  - { key: S, mods: [CMDCTRL, SHIFT], icon: saveas.png, label: "Save project as" }
  - { key: F4, mods: [CMDCTRL, SHIFT], icon: closeall.png, label: "Close all projects" }
  - { key: A, mods: [CMDCTRL, SHIFT], icon: deselect.png, label: "Deselect all" }
  - { key: Z, mods: [CMDCTRL, SHIFT], icon: viewundo.png, label: "Undo view" }
  - { key: Y, mods: [CMDCTRL, SHIFT], icon: viewredo.png, label: "Restore view" }
  - { key: R, mods: [CMDCTRL, SHIFT], icon: teamrender.png, label: "Team Render to Picture Viewer" }

  # --- Ctrl+Alt ---
  - { key: S, mods: [CMDCTRL, ALT], icon: save_incremental.png, label: "Save incremental" }
