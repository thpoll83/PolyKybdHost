# Command & Conquer Generals and Zero Hour overlay for PolyKybd.
#
# Keys: the default hotkeys in Data\English\CommandMap.ini (EnglishZH.big of
# the Steam release) and the command-card letters of generals.csf (&Attack
# Move, &Guard). Each binding names its CommandMap command (or the csf label
# of a command-card button), so the `generals` reader can move the icons to the
# keys of the installed game. See SOURCES.md.
#
# Letter keys alone build and use abilities, and their meaning changes with the
# selection, so they stay blank, except attack move, guard and stop, and the
# CommandMap keys that do the same thing whatever is selected.
#
# Regenerate:
#   python polyhost/res/overlay_sources/generals/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/generals/generals.yaml --preview /tmp/generals_preview
app: generals
match: [game]
output: generals_template
icon_dir: icons
fit: contain
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150
# As for C&C: the icon uses the full height on the right; the firmware clears
# 3 px around it, so a letter legend stays whole.
anchor: right
region: [40, 40]
margin: 0

# GENERALS over the whole cell, without the ESC legend (protocol v25). Esc
# opens the options menu in the game.
program_icon: program.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0
program_icon_legend: false

bindings:

  # Control groups: digit selects, Ctrl creates, Shift adds the selection,
  # Alt centres the view on the group
  - { key: "1", command: SELECT_TEAM1, icon: group1.png, label: "Select group 1", region: [48, 40], margin: 5 }
  - { key: "2", command: SELECT_TEAM2, icon: group2.png, label: "Select group 2", region: [48, 40], margin: 5 }
  - { key: "3", command: SELECT_TEAM3, icon: group3.png, label: "Select group 3", region: [48, 40], margin: 5 }
  - { key: "4", command: SELECT_TEAM4, icon: group4.png, label: "Select group 4", region: [48, 40], margin: 5 }
  - { key: "5", command: SELECT_TEAM5, icon: group5.png, label: "Select group 5", region: [48, 40], margin: 5 }
  - { key: "6", command: SELECT_TEAM6, icon: group6.png, label: "Select group 6", region: [48, 40], margin: 5 }
  - { key: "7", command: SELECT_TEAM7, icon: group7.png, label: "Select group 7", region: [48, 40], margin: 5 }
  - { key: "8", command: SELECT_TEAM8, icon: group8.png, label: "Select group 8", region: [48, 40], margin: 5 }
  - { key: "9", command: SELECT_TEAM9, icon: group9.png, label: "Select group 9", region: [48, 40], margin: 5 }
  - { key: "0", command: SELECT_TEAM0, icon: group0.png, label: "Select group 0", region: [48, 40], margin: 5 }
  - { key: "1", mods: [CTRL], command: CREATE_TEAM1, icon: groupnew1.png, label: "Create group 1", region: [48, 40], margin: 5 }
  - { key: "2", mods: [CTRL], command: CREATE_TEAM2, icon: groupnew2.png, label: "Create group 2", region: [48, 40], margin: 5 }
  - { key: "3", mods: [CTRL], command: CREATE_TEAM3, icon: groupnew3.png, label: "Create group 3", region: [48, 40], margin: 5 }
  - { key: "4", mods: [CTRL], command: CREATE_TEAM4, icon: groupnew4.png, label: "Create group 4", region: [48, 40], margin: 5 }
  - { key: "5", mods: [CTRL], command: CREATE_TEAM5, icon: groupnew5.png, label: "Create group 5", region: [48, 40], margin: 5 }
  - { key: "6", mods: [CTRL], command: CREATE_TEAM6, icon: groupnew6.png, label: "Create group 6", region: [48, 40], margin: 5 }
  - { key: "7", mods: [CTRL], command: CREATE_TEAM7, icon: groupnew7.png, label: "Create group 7", region: [48, 40], margin: 5 }
  - { key: "8", mods: [CTRL], command: CREATE_TEAM8, icon: groupnew8.png, label: "Create group 8", region: [48, 40], margin: 5 }
  - { key: "9", mods: [CTRL], command: CREATE_TEAM9, icon: groupnew9.png, label: "Create group 9", region: [48, 40], margin: 5 }
  - { key: "0", mods: [CTRL], command: CREATE_TEAM0, icon: groupnew0.png, label: "Create group 0", region: [48, 40], margin: 5 }
  - { key: "1", mods: [SHIFT], command: ADD_TEAM1, icon: groupadd1.png, label: "Add selection to group 1", region: [48, 40], margin: 5 }
  - { key: "2", mods: [SHIFT], command: ADD_TEAM2, icon: groupadd2.png, label: "Add selection to group 2", region: [48, 40], margin: 5 }
  - { key: "3", mods: [SHIFT], command: ADD_TEAM3, icon: groupadd3.png, label: "Add selection to group 3", region: [48, 40], margin: 5 }
  - { key: "4", mods: [SHIFT], command: ADD_TEAM4, icon: groupadd4.png, label: "Add selection to group 4", region: [48, 40], margin: 5 }
