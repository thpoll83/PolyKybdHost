  - { key: F6, mods: [CTRL], command: SAVE_VIEW6, icon: viewset6.png, label: "Save view 6", region: [30, 40] }
  - { key: F7, mods: [CTRL], command: SAVE_VIEW7, icon: viewset7.png, label: "Save view 7", region: [30, 40] }
  - { key: F8, mods: [CTRL], command: SAVE_VIEW8, icon: viewset8.png, label: "Save view 8", region: [30, 40] }

  # Unit orders: on the command card of every unit that moves and fights
  - { key: A, command: CONTROLBAR:AttackMove, icon: attackmove.png, label: "Attack move" }
  - { key: G, command: CONTROLBAR:Guard, icon: guard.png, label: "Guard" }
  - { key: S, command: STOP, icon: stop.png, label: "Stop" }

  # Selection and view
  - { key: E, command: SELECT_MATCHING_UNITS, icon: sametype.png, label: "Select matching units" }
  - { key: Q, command: SELECT_ALL, icon: selectall.png, label: "Select all units" }
  - { key: H, command: VIEW_COMMAND_CENTER, icon: commandcenter.png, label: "Go to command center" }
  - { key: H, mods: [CTRL], command: SELECT_HERO, icon: hero.png, label: "Select hero" }
  - { key: SPACE, command: VIEW_LAST_RADAR_EVENT, icon: lastevent.png, label: "Go to last radar event" }
  - { key: F, mods: [CTRL], command: CREATE_FORMATION, icon: formation.png, label: "Create formation" }
  - { key: F9, command: TOGGLE_CONTROL_BAR, icon: controlbar.png, label: "Show / hide the control bar" }

  # Communication and other
  - { key: ENTER, command: CHAT_EVERYONE, icon: chatall.png, label: "Chat to everyone" }
  - { key: BSPC, command: CHAT_ALLIES, icon: chatallies.png, label: "Chat to allies" }
  - { key: TAB, command: DIPLOMACY, icon: diplomacy.png, label: "Diplomacy" }
