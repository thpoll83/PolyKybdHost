  - { key: F12, command: TAKE_SCREENSHOT, icon: screenshot.png, label: "Screenshot" }

# No pictures: the reader moves the icons to the keys of the installed
# language and of the player's own CommandMap.ini (game_assets/generals).
game_assets:
  reader: generals
  icons: {}
