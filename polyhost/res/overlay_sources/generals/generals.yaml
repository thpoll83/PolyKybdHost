  - { key: "7", mods: [ALT], command: VIEW_TEAM7, icon: groupjump7.png, label: "Centre on group 7", region: [48, 40], margin: 5 }
  - { key: "8", mods: [ALT], command: VIEW_TEAM8, icon: groupjump8.png, label: "Centre on group 8", region: [48, 40], margin: 5 }
  - { key: "9", mods: [ALT], command: VIEW_TEAM9, icon: groupjump9.png, label: "Centre on group 9", region: [48, 40], margin: 5 }
  - { key: "0", mods: [ALT], command: VIEW_TEAM0, icon: groupjump0.png, label: "Centre on group 0", region: [48, 40], margin: 5 }

  # Camera views: F1 to F8 go to a saved view, Ctrl+F1 to F8 save it
  - { key: F1, command: VIEW_VIEW1, icon: view1.png, label: "Go to view 1", region: [30, 40] }
  - { key: F2, command: VIEW_VIEW2, icon: view2.png, label: "Go to view 2", region: [30, 40] }
  - { key: F3, command: VIEW_VIEW3, icon: view3.png, label: "Go to view 3", region: [30, 40] }
