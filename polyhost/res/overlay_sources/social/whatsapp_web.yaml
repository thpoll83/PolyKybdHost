# WhatsApp Web (web.whatsapp.com) shortcut overlays for PolyKybd. See SOURCES.md.
#
# Keys: WhatsApp's own Help Center article "About keyboard shortcuts"
# (faq.whatsapp.com/6204576529560565, web tab, read 2026-11-25). On macOS also
# WhatsApp Web's own Keyboard shortcuts dialog, read by the maintainer
# (2026-11-27), which adds keys the help page leaves out. WhatsApp Web
# adds Alt to its Windows and Linux chords so they do not collide with the
# browser's own Ctrl keys, and writes them as Cmd+Ctrl on macOS. That is not
# the CMDCTRL token (Cmd for Ctrl only), so each chord is written twice: once
# for Windows and Linux (`except: [macos]`), once for macOS (`only: [macos]`).
#
# Left out: Esc (close chat), because the ESC key carries the program mark.
#
# Regenerate (from the repo root, with the project venv):
#   PYTHONPATH=. .venv/bin/python polyhost/res/overlay_sources/social/fetch_icons.py
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/social/whatsapp_web.yaml --preview /tmp/whatsapp_web_preview
app: whatsapp-web
match: [whatsapp-web]
output: whatsapp_web_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: whatsapp.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- chat list (Windows, Linux: Ctrl+Alt+Shift; macOS: Cmd+Ctrl+Shift) ---
  - { key: U, mods: [CTRL, ALT, SHIFT], icon: unread.png,   label: "Mark as unread", except: [macos] }
  - { key: M, mods: [CTRL, ALT, SHIFT], icon: mutechat.png, label: "Mute chat",      except: [macos] }
  - { key: E, mods: [CTRL, ALT, SHIFT], icon: archive.png,  label: "Archive chat",   except: [macos] }
  - { key: P, mods: [CTRL, ALT, SHIFT], icon: pin.png,      label: "Pin chat",       except: [macos] }
  - { key: N, mods: [CTRL, ALT, SHIFT], icon: newgroup.png, label: "New group",      except: [macos] }
  - { key: F, mods: [CTRL, ALT, SHIFT], icon: searchchat.png, label: "Search in chat", except: [macos] }
  - { key: U, mods: [GUI, CTRL, SHIFT], icon: unread.png,   label: "Mark as unread", only: [macos] }
  - { key: M, mods: [GUI, CTRL, SHIFT], icon: mutechat.png, label: "Mute chat",      only: [macos] }
  - { key: E, mods: [GUI, CTRL, SHIFT], icon: archive.png,  label: "Archive chat",   only: [macos] }
  - { key: P, mods: [GUI, CTRL, SHIFT], icon: pin.png,      label: "Pin chat",       only: [macos] }
  - { key: N, mods: [GUI, CTRL, SHIFT], icon: newgroup.png, label: "New group",      only: [macos] }
  # macOS from here on: WhatsApp Web's own Keyboard shortcuts dialog
  # (Settings > Keyboard shortcuts) on a Mac, read by the maintainer
  # (2026-11-27). The help page calls Cmd+Ctrl+/ "Search Chat"; the dialog
  # shows it is the general Search, and Search chat is Cmd+Shift+F.
  - { key: "/", mods: [GUI, CTRL],      icon: search.png,     label: "Search",         only: [macos] }
  - { key: F, mods: [GUI, SHIFT],       icon: searchchat.png, label: "Search in chat", only: [macos] }
  - { key: TAB, mods: [GUI, CTRL],        icon: nextchat.png,  label: "Next chat",        only: [macos] }
  - { key: TAB, mods: [GUI, CTRL, SHIFT], icon: prevchat.png,  label: "Previous chat",    only: [macos] }
  - { key: L, mods: [GUI, CTRL, SHIFT],   icon: addtolist.png, label: "Add chat to list", only: [macos] }
  - { key: B, mods: [CTRL, SHIFT],        icon: block.png,     label: "Block chat",       only: [macos] }
  # --- app (Windows, Linux: Ctrl+Alt; macOS: Cmd+Ctrl) ---
  - { key: N, mods: [CTRL, ALT], icon: newchat.png, label: "New chat",         except: [macos] }
  - { key: P, mods: [CTRL, ALT], icon: profile.png, label: "Profile and about", except: [macos] }
  # The help page prints the Windows Settings chord as "Ctrl Alt" with no key;
  # "," is the key of its macOS column.
  - { key: ",", mods: [CTRL, ALT], label: "Settings",     except: [macos] }
  - { key: E, mods: [CTRL, ALT], icon: emoji.png,   label: "Emoji panel",   except: [macos] }
  - { key: G, mods: [CTRL, ALT], icon: gif.png,     label: "GIF panel",     except: [macos] }
  - { key: S, mods: [CTRL, ALT], icon: sticker.png, label: "Sticker panel", except: [macos] }
  - { key: L, mods: [CTRL, ALT], icon: lock.png,    label: "Lock screen",   except: [macos] }
  - { key: N, mods: [GUI, CTRL], icon: newchat.png, label: "New chat",          only: [macos] }
  - { key: P, mods: [GUI, CTRL], icon: profile.png, label: "Profile and about", only: [macos] }
  - { key: ",", mods: [GUI, CTRL], label: "Settings",     only: [macos] }
  - { key: E, mods: [GUI, CTRL], icon: emoji.png,   label: "Emoji panel",   only: [macos] }
  - { key: G, mods: [GUI, CTRL], icon: gif.png,     label: "GIF panel",     only: [macos] }
  - { key: S, mods: [GUI, CTRL], icon: sticker.png, label: "Sticker panel", only: [macos] }
  - { key: L, mods: [GUI, CTRL], icon: lock.png,    label: "Lock screen",   only: [macos] }
  # --- extended search: Alt+K, and Cmd+K on macOS ---
  - { key: K, mods: [ALT], icon: extsearch.png, label: "Extended search", except: [macos] }
  - { key: K, mods: [GUI], icon: extsearch.png, label: "Extended search", only: [macos] }
  # --- macOS only (WhatsApp Web's own dialog): voice messages and editing ---
  - { key: ".", mods: [SHIFT],     icon: speedup.png,   label: "Faster playback",    only: [macos] }
  - { key: ",", mods: [SHIFT],     icon: speeddown.png, label: "Slower playback",    only: [macos] }
  - { key: ENTER, mods: [CTRL],    icon: send.png,      label: "Send voice message", only: [macos] }
  - { key: UP, mods: [GUI],        icon: editlast.png,  label: "Edit last message",  only: [macos] }
  # --- macOS calls. Screen share (Cmd+Ctrl+S) is the sticker panel's chord and
  # is left out; the overlay cannot tell a call from a chat ---
  - { key: V, mods: [GUI, CTRL],   icon: camera.png,    label: "Camera on or off",     only: [macos] }
  - { key: M, mods: [GUI, CTRL],   icon: micmute.png,   label: "Microphone on or off", only: [macos] }
  - { key: R, mods: [GUI, CTRL],   icon: reactions.png, label: "Reactions",            only: [macos] }
  - { key: H, mods: [GUI, CTRL],   icon: raisehand.png, label: "Raise hand",           only: [macos] }
  - { key: W, mods: [GUI, CTRL],   icon: endcall.png,   label: "End call",             only: [macos] }
