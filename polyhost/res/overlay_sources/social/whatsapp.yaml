# WhatsApp desktop shortcut overlays for PolyKybd (the Windows and macOS apps).
# See SOURCES.md.
#
# WhatsApp publishes no shortcut list for its desktop apps (the Help Center
# article covers WhatsApp Web only).
# * Windows: the app's own list (Settings > Keyboard shortcuts), read by the
#   maintainer on 2026-11-26.
# * macOS (NOT CHECKED against the app): XDA Developers (2023-02) and
#   androidayuda (2024), which agree on every key drawn here.
#
# Left out: Esc (close chat, the ESC key carries the program mark), next and
# previous chat on macOS (the two sources disagree), and the composer's plain
# Enter.
#
# Regenerate (from the repo root, with the project venv):
#   PYTHONPATH=. .venv/bin/python polyhost/res/overlay_sources/social/fetch_icons.py
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/social/whatsapp.yaml --preview /tmp/whatsapp_preview
app: whatsapp
match: [whatsapp]
output: whatsapp_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: whatsapp.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # ===== Windows =====
  # The app's own list (Settings > Keyboard shortcuts), German build, read by
  # the maintainer on 2026-11-26. Every key the list names is drawn, except Esc
  # (close chat) and the two call keys that reuse a chat chord (below).
  # --- chats ---
  - { key: U, mods: [CTRL, ALT, SHIFT], icon: unread.png,    label: "Mark as unread",   only: [windows] }
  - { key: M, mods: [CTRL, ALT, SHIFT], icon: mutechat.png,  label: "Mute chat",        only: [windows] }
  - { key: E, mods: [CTRL, ALT, SHIFT], icon: archive.png,   label: "Archive chat",     only: [windows] }
  - { key: P, mods: [CTRL, ALT, SHIFT], icon: pin.png,       label: "Pin chat",         only: [windows] }
  - { key: L, mods: [CTRL, ALT, SHIFT], icon: addtolist.png, label: "Add chat to list", only: [windows] }
  - { key: N, mods: [CTRL, ALT, SHIFT], icon: newgroup.png,  label: "New group",        only: [windows] }
  - { key: "]", mods: [CTRL, ALT, SHIFT], icon: nextchat.png, label: "Next chat",       only: [windows] }
  - { key: "[", mods: [CTRL, ALT, SHIFT], icon: prevchat.png, label: "Previous chat",   only: [windows] }
  - { key: B, mods: [CTRL, SHIFT],      icon: block.png,     label: "Block chat",       only: [windows] }
  - { key: "/", mods: [CTRL, ALT],      icon: search.png,     label: "Search",          only: [windows] }
  - { key: F, mods: [CTRL, SHIFT],      icon: searchchat.png, label: "Search in chat",  only: [windows] }
  - { key: K, mods: [ALT],              icon: extsearch.png,  label: "Extended search", only: [windows] }
  - { key: N, mods: [CTRL, ALT],        icon: newchat.png,   label: "New chat",         only: [windows] }
  - { key: I, mods: [ALT],              icon: chatinfo.png,  label: "Chat info",        only: [windows] }
  # --- messages ---
  - { key: R, mods: [ALT],              icon: reply.png,        label: "Reply",           only: [windows] }
  - { key: R, mods: [CTRL, ALT],        icon: replyprivate.png, label: "Reply privately", only: [windows] }
  - { key: D, mods: [CTRL, ALT],        icon: forward.png,      label: "Forward",         only: [windows] }
  - { key: UP, mods: [CTRL],            icon: editlast.png,     label: "Edit last message", only: [windows] }
  - { key: "8", mods: [ALT],            icon: star.png,         label: "Star message",    only: [windows] }
  - { key: A, mods: [ALT],              icon: attach.png,       label: "Attach",          only: [windows] }
  - { key: R, mods: [CTRL, ALT, SHIFT], icon: recordvoice.png,  label: "Record voice message", only: [windows] }
  - { key: P, mods: [ALT],              icon: pausevoice.png,   label: "Pause recording", only: [windows] }
  - { key: ENTER, mods: [CTRL],         icon: send.png,         label: "Send voice message", only: [windows] }
  - { key: ".", mods: [SHIFT],          icon: speedup.png,      label: "Faster playback", only: [windows] }
  - { key: ",", mods: [SHIFT],          icon: speeddown.png,    label: "Slower playback", only: [windows] }
  - { key: E, mods: [CTRL, ALT],        icon: emoji.png,   label: "Emoji panel",   only: [windows] }
  - { key: G, mods: [CTRL, ALT],        icon: gif.png,     label: "GIF panel",     only: [windows] }
  - { key: S, mods: [CTRL, ALT],        icon: sticker.png, label: "Sticker panel", only: [windows] }
  # --- app ---
  - { key: P, mods: [CTRL, ALT],        icon: profile.png, label: "Profile and about", only: [windows] }
  - { key: ",", mods: [CTRL, ALT],      label: "Settings",   only: [windows] }
  - { key: L, mods: [CTRL, ALT],        icon: lock.png,    label: "Lock app",    only: [windows] }
  # --- calls: Reactions (Ctrl+Alt+R) and Share screen (Ctrl+Alt+S) are left
  # out, because the chat window uses those chords for Reply privately and the
  # sticker panel, and the overlay cannot tell a call window from a chat ---
  - { key: V, mods: [CTRL, ALT],        icon: camera.png,    label: "Camera on or off",     only: [windows] }
  - { key: M, mods: [CTRL, ALT],        icon: micmute.png,   label: "Microphone on or off", only: [windows] }
  - { key: H, mods: [CTRL, ALT],        icon: raisehand.png, label: "Raise hand",           only: [windows] }
  - { key: W, mods: [CTRL, ALT],        icon: endcall.png,   label: "End call",             only: [windows] }

  # ===== macOS =====
  - { key: U, mods: [GUI, SHIFT], icon: unread.png,     label: "Mark as unread", only: [macos] }
  - { key: M, mods: [GUI, SHIFT], icon: mutechat.png,   label: "Mute chat",      only: [macos] }
  - { key: E, mods: [GUI, SHIFT], icon: archive.png,    label: "Archive chat",   only: [macos] }
  - { key: D, mods: [GUI, SHIFT], icon: deletechat.png, label: "Delete chat",    only: [macos] }
  - { key: P, mods: [GUI, SHIFT], icon: pin.png,        label: "Pin chat",       only: [macos] }
  - { key: F, mods: [GUI],        icon: search.png, label: "Search",          only: [macos] }
  - { key: F, mods: [GUI, SHIFT], icon: searchchat.png, label: "Search in chat",  only: [macos] }
  - { key: K, mods: [GUI],        icon: extsearch.png,  label: "Extended search", only: [macos] }
  - { key: N, mods: [GUI],        icon: newchat.png,  label: "New chat",  only: [macos] }
  - { key: N, mods: [GUI, SHIFT], icon: newgroup.png, label: "New group", only: [macos] }
  - { key: P, mods: [GUI],        icon: profile.png,  label: "Profile and about", only: [macos] }
  - { key: ",", mods: [GUI],      label: "Settings",  only: [macos] }
  - { key: E, mods: [GUI],        icon: emoji.png,   label: "Emoji panel",   only: [macos] }
  - { key: G, mods: [GUI],        icon: gif.png,     label: "GIF panel",     only: [macos] }
  - { key: S, mods: [GUI],        icon: sticker.png, label: "Sticker panel", only: [macos] }
