# Amiberry shortcut overlay for PolyKybd. See SOURCES.md.
#
# Keys are Amiberry's defaults (BlitterStudio/amiberry, master, read
# 2026-11-06): F12 opens the GUI and Pause is the Action Replay key when the
# open_gui and action_replay options are empty (src/osdep/amiberry.cpp), and
# Page Up is the freeze button in the key table of src/osdep/keyboard.cpp.
# Quit, full screen, minimize and screenshot have no default key. Not drawn:
# the End+key shortcuts, because End is not a modifier the keyboard can show.
#
# Regenerate:
#   PYTHONPATH=. .venv/bin/python polyhost/res/overlay_sources/amiberry/fetch_icons.py
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/amiberry/amiberry.yaml --preview /tmp/amiberry_preview
app: amiberry
match: [amiberry, amiberry-lite]
output: amiberry_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: alpha
threshold: 128

program_icon: amiberry.png
program_icon_mode: alpha
program_icon_region: [37, 32]
program_icon_anchor: right
program_icon_margin: 0

bindings:
  - { key: F12, mods: [], icon: gui.png, label: "Settings" }
  - { key: PAUSE, mods: [], icon: freeze.png, label: "Action Replay" }
  - { key: PGUP, mods: [], icon: freeze.png, label: "Cartridge freeze" }
