# Audacity 4.0.1 shortcut overlay for PolyKybd (Windows, Audacity4.exe).
#
# GENERATED by gen_specs.py from one table; edit the table, not this file.
# Only keys whose action 4.0.1 registers and handles.
#
# Regenerate:
#   python polyhost/res/overlay_sources/audacity/gen_specs.py
#   python polyhost/res/overlay_sources/audacity/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/audacity/audacity4.yaml --preview /tmp/audacity4_preview
app: audacity4
match: [audacity4]
output: audacity4_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

bindings:
  - { key: N, mods: [CTRL], label: "New" }
  - { key: O, mods: [CTRL], label: "Open" }
  - { key: S, mods: [CTRL], label: "Save" }
  - { key: W, mods: [CTRL], icon: close.png, label: "Close project" }
  - { key: E, mods: [CTRL, SHIFT], icon: export.png, label: "Export audio" }
  - { key: I, mods: [CTRL, SHIFT], icon: import.png, label: "Import audio" }
  - { key: Z, mods: [CTRL], label: "Undo" }
  - { key: Z, mods: [CTRL, SHIFT], label: "Redo" }
  - { key: X, mods: [CTRL], label: "Cut" }
  - { key: C, mods: [CTRL], label: "Copy" }
  - { key: V, mods: [CTRL], label: "Paste" }
  - { key: DEL, mods: [], label: "Delete" }
  - { key: BSPC, mods: [], label: "Delete" }
  - { key: D, mods: [CTRL], icon: duplicate.png, label: "Duplicate" }
  - { key: L, mods: [CTRL], icon: silence.png, label: "Silence audio" }
  - { key: I, mods: [CTRL], icon: split.png, label: "Split" }
  - { key: J, mods: [CTRL], icon: join.png, label: "Join clips" }
  - { key: P, mods: [CTRL, SHIFT], icon: pitchspeed.png, label: "Pitch and speed" }
  - { key: B, mods: [CTRL], icon: label.png, label: "Add label" }
  - { key: V, mods: [CTRL, ALT], icon: pasteoverlap.png, label: "Paste overlapping" }
  - { key: V, mods: [SHIFT], icon: pasteinsert.png, label: "Paste and insert" }
  - { key: V, mods: [CTRL, ALT, SHIFT], icon: pasteall.png, label: "Paste insert, all tracks" }
  - { key: X, mods: [CTRL, SHIFT], icon: cutclose.png, label: "Cut and close gap" }
  - { key: DEL, mods: [SHIFT], icon: deleteclose.png, label: "Delete and close gap" }
  - { key: DEL, mods: [CTRL], icon: deleteall.png, label: "Delete, close gap all tracks" }
  - { key: J, mods: [CTRL, ALT], icon: splitsilence.png, label: "Split at silences" }
  - { key: G, mods: [CTRL], icon: groupclips.png, label: "Group clips" }
  - { key: G, mods: [CTRL, SHIFT], icon: ungroupclips.png, label: "Ungroup clips" }
  - { key: F2, mods: [], icon: rename.png, label: "Rename clip/label" }
  - { key: S, mods: [], icon: splittool.png, label: "Split tool" }
  - { key: A, mods: [CTRL], label: "Select all" }
  - { key: K, mods: [CTRL, SHIFT], icon: selalltracks.png, label: "Select in all tracks" }
  - { key: LBRACKET, mods: [], icon: selleft.png, label: "Selection start at playhead" }
  - { key: RBRACKET, mods: [], icon: selright.png, label: "Selection end at playhead" }
  - { key: J, mods: [SHIFT], icon: seltostart.png, label: "Select track start to cursor" }
  - { key: K, mods: [SHIFT], icon: seltoend.png, label: "Select cursor to track end" }
  - { key: Z, mods: [], icon: zerocross.png, label: "Zero crossings" }
  - { key: LEFT, mods: [SHIFT], icon: extendleft.png, label: "Extend selection left" }
  - { key: RIGHT, mods: [SHIFT], icon: extendright.png, label: "Extend selection right" }
  - { key: RIGHT, mods: [CTRL, SHIFT], icon: shrinkleft.png, label: "Shrink selection from left" }
  - { key: LEFT, mods: [CTRL, SHIFT], icon: shrinkright.png, label: "Shrink selection from right" }
  - { key: Z, mods: [SHIFT], icon: zoomtoggle.png, label: "Zoom toggle" }
  - { key: F, mods: [CTRL], icon: fitwidth.png, label: "Fit to width" }
  - { key: EQUAL, mods: [CTRL], icon: zoomin.png, label: "Zoom in" }
  - { key: MINUS, mods: [CTRL], icon: zoomout.png, label: "Zoom out" }
  - { key: SPACE, mods: [], icon: playstop.png, label: "Play/stop" }
  - { key: P, mods: [], icon: pause.png, label: "Pause" }
  - { key: R, mods: [], icon: record.png, label: "Record" }
  - { key: D, mods: [SHIFT], icon: punch.png, label: "Punch and roll record" }
  - { key: HOME, mods: [], icon: projstart.png, label: "Go to start" }
  - { key: END, mods: [], icon: projend.png, label: "Go to end" }
  - { key: L, mods: [], icon: loop.png, label: "Looping on/off" }
  - { key: L, mods: [ALT, SHIFT], icon: clearloop.png, label: "Clear loop" }
