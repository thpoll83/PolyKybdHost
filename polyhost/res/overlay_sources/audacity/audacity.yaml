# Audacity shortcut overlays for PolyKybd (macOS and Linux).
#
# GENERATED by gen_specs.py from one table; edit the table, not this file.
# Both 3.7.9 and 4.0.1 run as "Audacity" there, so only the keys that do the same in both.
#
# Regenerate:
#   python polyhost/res/overlay_sources/audacity/gen_specs.py
#   python polyhost/res/overlay_sources/audacity/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/audacity/audacity.yaml --preview /tmp/audacity_preview
app: audacity
match: [audacity]
output: audacity_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

bindings:
  - { key: N, mods: [CMDCTRL], label: "New" }
  - { key: O, mods: [CMDCTRL], label: "Open" }
  - { key: S, mods: [CMDCTRL], label: "Save" }
  - { key: W, mods: [CMDCTRL], icon: close.png, label: "Close project" }
  - { key: E, mods: [CMDCTRL, SHIFT], icon: export.png, label: "Export audio" }
  - { key: I, mods: [CMDCTRL, SHIFT], icon: import.png, label: "Import audio" }
  - { key: Z, mods: [CMDCTRL], label: "Undo" }
  - { key: X, mods: [CMDCTRL], label: "Cut" }
  - { key: C, mods: [CMDCTRL], label: "Copy" }
  - { key: V, mods: [CMDCTRL], label: "Paste" }
  - { key: DEL, mods: [], label: "Delete" }
  - { key: BSPC, mods: [], label: "Delete" }
  - { key: D, mods: [CMDCTRL], icon: duplicate.png, label: "Duplicate" }
  - { key: L, mods: [CMDCTRL], icon: silence.png, label: "Silence audio" }
  - { key: I, mods: [CMDCTRL], icon: split.png, label: "Split" }
  - { key: J, mods: [CMDCTRL], icon: join.png, label: "Join clips" }
  - { key: P, mods: [CMDCTRL, SHIFT], icon: pitchspeed.png, label: "Pitch and speed" }
  - { key: B, mods: [CMDCTRL], icon: label.png, label: "Add label" }
  - { key: A, mods: [CMDCTRL], label: "Select all" }
  - { key: K, mods: [CMDCTRL, SHIFT], icon: selalltracks.png, label: "Select in all tracks" }
  - { key: LBRACKET, mods: [], icon: selleft.png, label: "Selection start at playhead" }
  - { key: RBRACKET, mods: [], icon: selright.png, label: "Selection end at playhead" }
  - { key: J, mods: [SHIFT], icon: seltostart.png, label: "Select track start to cursor" }
  - { key: K, mods: [SHIFT], icon: seltoend.png, label: "Select cursor to track end" }
  - { key: Z, mods: [], icon: zerocross.png, label: "Zero crossings" }
  - { key: LEFT, mods: [SHIFT], icon: extendleft.png, label: "Extend selection left" }
  - { key: RIGHT, mods: [SHIFT], icon: extendright.png, label: "Extend selection right" }
  - { key: RIGHT, mods: [CMDCTRL, SHIFT], icon: shrinkleft.png, label: "Shrink selection from left" }
  - { key: LEFT, mods: [CMDCTRL, SHIFT], icon: shrinkright.png, label: "Shrink selection from right" }
  - { key: Z, mods: [SHIFT], icon: zoomtoggle.png, label: "Zoom toggle" }
  - { key: F, mods: [CMDCTRL], icon: fitwidth.png, label: "Fit to width" }
  - { key: SPACE, mods: [], icon: playstop.png, label: "Play/stop" }
  - { key: P, mods: [], icon: pause.png, label: "Pause" }
  - { key: R, mods: [], icon: record.png, label: "Record" }
  - { key: D, mods: [SHIFT], icon: punch.png, label: "Punch and roll record" }
  - { key: HOME, mods: [], icon: projstart.png, label: "Go to start" }
  - { key: END, mods: [], icon: projend.png, label: "Go to end" }
  - { key: L, mods: [], icon: loop.png, label: "Looping on/off" }
  - { key: L, mods: [ALT, SHIFT], icon: clearloop.png, label: "Clear loop" }
  - { key: L, mods: [SHIFT], icon: loopsel.png, label: "Loop to selection" }
  - { key: E, mods: [], icon: effects.png, label: "Add realtime effects" }
  - { key: R, mods: [CMDCTRL], icon: repeateffect.png, label: "Repeat last effect" }
  - { key: Z, mods: [CMDCTRL, SHIFT], label: "Redo" }
