# Audacity 3.7.9 shortcut overlay for PolyKybd (Windows, Audacity.exe).
#
# GENERATED by gen_specs.py from one table; edit the table, not this file.
# The 3.7.9 Standard key set, the set a new install has.
#
# Regenerate:
#   python polyhost/res/overlay_sources/audacity/gen_specs.py
#   python polyhost/res/overlay_sources/audacity/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/audacity/audacity3.yaml --preview /tmp/audacity3_preview
app: audacity3
match: [audacity]
output: audacity3_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

