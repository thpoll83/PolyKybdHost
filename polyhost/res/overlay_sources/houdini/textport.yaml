# SideFX Houdini shortcut overlays for PolyKybd: the Textport.
# See SOURCES.md.
#
# Loaded while the Houdini reporter (houdini-package/) says the pointer is over
# a Textport pane (`houdini://textport`), where HScript commands are typed.
# Letters, digits and the pane keys type text there, so this set draws only
# the keys SideFX names for the Textport; every other key stays blank.
#
# Keys: SideFX, "Textport window", Houdini 22.0,
# https://www.sidefx.com/docs/houdini/ref/windows/textport.html.
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/houdini/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/houdini/textport.yaml --preview /tmp/houdini_textport_preview
app: houdini
match: [houdini, houdinifx, houdinicore, happrentice, hindie, hescape, houdini-bin, houdini fx, houdini core, houdini apprentice, houdini indie]
output: houdini_textport_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: houdini.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  - { key: ENTER, mods: [], icon: run.png, label: "Run the command" }
  - { key: UP, mods: [], icon: histprev.png, label: "Previous command" }
  - { key: DOWN, mods: [], icon: histnext.png, label: "Next command" }
  - { key: PGUP, mods: [], icon: page_up.png, region: [40, 32], label: "Scroll up" }
  - { key: PGDN, mods: [], icon: page_down.png, region: [40, 32], label: "Scroll down" }
  - { key: HOME, mods: [], icon: file_start.png, region: [40, 32], label: "Scroll to the top" }
  - { key: END, mods: [], icon: file_end.png, region: [40, 32], label: "Scroll to the end" }
