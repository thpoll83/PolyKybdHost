# SideFX Houdini shortcut overlays for PolyKybd: the Python Shell.
# See SOURCES.md.
#
# Loaded while the Houdini reporter (houdini-package/) says the pointer is over
# a Python Shell pane (`houdini://python`). Letters, digits and the pane keys
# type text there, so this set draws only the line-editing keys SideFX names
# for the shell; every other key stays blank.
#
# Keys: SideFX, "Python scripting", Houdini 22.0,
# https://www.sidefx.com/docs/houdini/hom/intro.html (Getting Started).
# The page gives the Ctrl chords as Ctrl. Whether macOS reads them as Ctrl or
# Cmd is not checked, so they are drawn as Ctrl on every platform.
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/houdini/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/houdini/python.yaml --preview /tmp/houdini_python_preview
app: houdini
match: [houdini, houdinifx, houdinicore, happrentice, hindie, hescape, houdini-bin, houdini fx, houdini core, houdini apprentice, houdini indie]
output: houdini_python_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: houdini.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- no modifier
  - { key: ENTER, mods: [], icon: run.png, label: "Run the line" }
  - { key: HOME, mods: [], icon: line_start.png, region: [40, 32], label: "Start of the line" }
  - { key: END, mods: [], icon: line_end.png, region: [40, 32], label: "End of the line" }
  - { key: UP, mods: [], icon: histprev.png, label: "Previous command" }
  - { key: DOWN, mods: [], icon: histnext.png, label: "Next command" }

  # --- Ctrl (literal Ctrl on every platform, see above)
  - { key: A, mods: [CTRL], icon: line_start.png, region: [40, 32], label: "Start of the line" }
  - { key: E, mods: [CTRL], icon: line_end.png, region: [40, 32], label: "End of the line" }
  - { key: C, mods: [CTRL], icon: stop.png, label: "KeyboardInterrupt" }
  - { key: D, mods: [CTRL], icon: exit.png, label: "Close the floating shell" }
