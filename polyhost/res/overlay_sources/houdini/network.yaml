# SideFX Houdini shortcut overlays for PolyKybd: the Network Editor.
# See SOURCES.md.
#
# Loaded while the Houdini reporter (houdini-package/) says the pointer is over
# a Network Editor (`houdini://network/<context>`), in every network type: the
# page below lists one set of keys for all of them. Without the reporter, the
# Scene View set (bindings.yaml) stays on the keys.
#
# Keys: SideFX, "Network editor hotkeys", Houdini 22.0,
# https://www.sidefx.com/docs/houdini/network/shortcuts.html, plus the keys of
# bindings.yaml that work in every pane (timeline, pane tabs, pane types,
# File and Edit menu). W, E, R and T set node flags whose meaning depends on the
# network type, and the page does not name them: they are not drawn.
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/houdini/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/houdini/network.yaml --preview /tmp/houdini_network_preview
app: houdini
match: [houdini, houdinifx, houdinicore, happrentice, hindie, hescape, houdini-bin, houdini fx, houdini core, houdini apprentice, houdini indie]
output: houdini_network_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: houdini.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- no modifier: adding nodes and view
  - { key: TAB, mods: [], icon: nodesearch.png, label: "Tab menu (add node)" }
  - { key: "=", mods: [], icon: file_node.png, label: "Add a File node" }
  - { key: H, mods: [], icon: frame_all.png, label: "Show all nodes" }
  - { key: G, mods: [], icon: fit_view.png, label: "Show the selected nodes" }
  - { key: "`", mods: [], icon: prev_view.png, label: "Previous view" }

  # --- no modifier: tools and palettes
  - { key: P, mods: [], icon: attributes.png, label: "Floating parameter editor" }
  - { key: O, mods: [], icon: net_overview.png, label: "Network overview" }
  - { key: C, mods: [], icon: color_palette.png, label: "Color palette" }
  - { key: Z, mods: [], icon: shape_palette.png, label: "Shape palette" }
  - { key: Y, mods: [], icon: cut_wires.png, label: "Cut wires (hold)" }
  - { key: A, mods: [], icon: layout_nodes.png, label: "Lay out nodes (hold, drag)" }
  - { key: Q, mods: [], icon: mute.png, label: "Bypass flag" }
  - { key: B, mods: [], icon: mute.png, label: "Bypass flag" }
  - { key: "/", mods: [], icon: search.png, label: "Find" }

  # --- no modifier: navigation
  - { key: ENTER, mods: [], icon: group_enter.png, label: "Go inside the node" }
  - { key: U, mods: [], icon: group_exit.png, label: "Go up a level" }
  - { key: PGUP, mods: [], icon: upstream.png, label: "Select the upstream node" }
  - { key: PGDN, mods: [], icon: downstream.png, label: "Select the downstream node" }

  # --- no modifier: timeline (every pane)
  - { key: UP, mods: [], icon: play.png, label: "Play forward" }
  - { key: DOWN, mods: [], icon: play_reverse.png, label: "Play backward" }
  - { key: LEFT, mods: [], icon: frame_prev.png, label: "Previous frame" }
  - { key: RIGHT, mods: [], icon: frame_next.png, label: "Next frame" }

  # --- Shift
  - { key: O, mods: [SHIFT], icon: network_box.png, label: "Network box" }
  - { key: P, mods: [SHIFT], icon: stickynote.png, label: "Sticky note" }
  - { key: W, mods: [SHIFT], icon: objectmanager.png, label: "Network tree view" }
  - { key: J, mods: [SHIFT], icon: notes_min.png, label: "Minimize notes and boxes" }
  - { key: K, mods: [SHIFT], icon: notes_restore.png, label: "Restore notes and boxes" }
  - { key: M, mods: [SHIFT], icon: box_fit.png, label: "Fit network box" }
  - { key: A, mods: [SHIFT], icon: align_nodes.png, label: "Align nodes (hold, drag)" }
  - { key: PGUP, mods: [SHIFT], icon: sibling_prev.png, label: "Previous sibling node" }
  - { key: PGDN, mods: [SHIFT], icon: sibling_next.png, label: "Next sibling node" }
  - { key: "1", mods: [SHIFT], icon: jumpbookmark.png, label: "Go to quick mark 1" }
  - { key: "2", mods: [SHIFT], icon: jumpbookmark.png, label: "Go to quick mark 2" }
  - { key: "3", mods: [SHIFT], icon: jumpbookmark.png, label: "Go to quick mark 3" }
  - { key: "4", mods: [SHIFT], icon: jumpbookmark.png, label: "Go to quick mark 4" }
  - { key: "5", mods: [SHIFT], icon: jumpbookmark.png, label: "Go to quick mark 5" }
  # ">" and "<" (Shift+. and Shift+,) step through the find matches.
  - { key: ".", mods: [SHIFT], icon: match_next.png, label: "Next match" }
  - { key: ",", mods: [SHIFT], icon: match_prev.png, label: "Previous match" }

  # --- Ctrl (Cmd on macOS)
  - { key: "1", mods: [CMDCTRL], icon: mark_set.png, label: "Set quick mark 1" }
  - { key: "2", mods: [CMDCTRL], icon: mark_set.png, label: "Set quick mark 2" }
  - { key: "3", mods: [CMDCTRL], icon: mark_set.png, label: "Set quick mark 3" }
  - { key: "4", mods: [CMDCTRL], icon: mark_set.png, label: "Set quick mark 4" }
  - { key: "5", mods: [CMDCTRL], icon: mark_set.png, label: "Set quick mark 5" }
  - { key: F, mods: [CMDCTRL], icon: search.png, label: "Find" }
  - { key: G, mods: [CMDCTRL], icon: match_next.png, label: "Next match" }
  - { key: UP, mods: [CMDCTRL], icon: jump_start.png, label: "First frame" }
  - { key: LEFT, mods: [CMDCTRL], icon: key_prev.png, label: "Previous scoped keyframe" }
  - { key: RIGHT, mods: [CMDCTRL], icon: key_next.png, label: "Next scoped keyframe" }
  - { key: T, mods: [CMDCTRL], icon: tab_new.png, label: "New pane tab" }
  - { key: W, mods: [CMDCTRL], icon: tab_close.png, label: "Close pane tab" }
  - { key: PGUP, mods: [CMDCTRL], icon: tab_prev.png, label: "Previous tab" }
  - { key: PGDN, mods: [CMDCTRL], icon: tab_next.png, label: "Next tab" }
  # File and Edit menu: not on a SideFX page (SOURCES.md).
  - { key: N, mods: [CMDCTRL], icon: new.png, label: "New scene" }
  - { key: O, mods: [CMDCTRL], icon: open.png, label: "Open scene" }
  - { key: S, mods: [CMDCTRL], icon: save.png, label: Save }
  - { key: Z, mods: [CMDCTRL], icon: undo.png, label: Undo }

  # --- Ctrl+Shift (Cmd+Shift on macOS)
  - { key: G, mods: [CMDCTRL, SHIFT], icon: match_prev.png, label: "Previous match" }

  # --- Alt (Option on macOS)
  - { key: A, mods: [ALT], icon: distribute_nodes.png, label: "Distribute nodes (hold, drag)" }
  - { key: K, mods: [ALT], icon: autokey.png, label: "Auto-key" }
  - { key: "1", mods: [ALT], icon: view_persp.png, label: "Scene View" }
  - { key: "2", mods: [ALT], icon: nodeeditor.png, label: "Network Editor" }
  - { key: "3", mods: [ALT], icon: attributes.png, label: "Parameters" }
  - { key: "4", mods: [ALT], icon: objectmanager.png, label: "Tree View" }
  - { key: "5", mods: [ALT], icon: ed_console.png, label: "Textport" }
  - { key: "6", mods: [ALT], icon: ed_graph.png, label: "Animation Editor" }
  - { key: "7", mods: [ALT], icon: material_palette.png, label: "Material Palette" }
  - { key: "8", mods: [ALT], icon: details_view.png, label: "Details View" }
  - { key: "9", mods: [ALT], icon: view_persp.png, label: "Scene View" }
  - { key: "/", mods: [ALT], icon: closeall.png, label: "Close all tabs" }

  # --- Alt+Shift
  - { key: C, mods: [ALT, SHIFT], icon: tab_tearoff.png, label: "Tear off tab" }
