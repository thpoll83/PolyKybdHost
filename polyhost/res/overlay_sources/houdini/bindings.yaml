# SideFX Houdini shortcut overlays for PolyKybd (Scene View and global keys).
# See SOURCES.md.
#
# The keys are SideFX's Hotkey quick reference for Houdini 22.0, plus the
# Scene View keys named on the Basics pages (viewing, selecting, handles,
# radial menus). Houdini gives a key a different meaning in each pane, and the
# window title does not say which pane has the focus. This set draws the Scene
# View (3D viewport) meanings and the keys that work in every pane (timeline,
# pane tabs, pane types). The Network Editor meanings of the same letters are
# listed in SOURCES.md and are not drawn.
#
# Keys held together with Space (Space+G, Space+1, ...) are not drawn: the
# keyboard has no Space modifier layer. They are listed in SOURCES.md.
#
# SideFX: "Most hotkeys that use Ctrl on Windows instead use Cmd on macOS."
# So every Ctrl chord is CMDCTRL and Alt stays ALT (Option).
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/houdini/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/houdini/bindings.yaml --preview /tmp/houdini_preview
app: houdini
match: [houdini, houdinifx, houdinicore, happrentice, hindie, hescape, houdini-bin, houdini fx, houdini core, houdini apprentice, houdini indie]
output: houdini_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: houdini.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- no modifier: general and tools ---
  - { key: TAB, mods: [], icon: nodesearch.png, label: "Tab menu (add node)" }
  - { key: S, mods: [], icon: select_tool.png, label: "Select tool" }
  - { key: T, mods: [], icon: move.png, label: "Move tool" }
  - { key: R, mods: [], icon: rotate.png, label: "Rotate tool" }
  - { key: E, mods: [], icon: scale.png, label: "Scale tool" }
  - { key: ENTER, mods: [], icon: gizmo.png, label: "Handles tool" }
  - { key: INSERT, mods: [], icon: pivot.png, label: "Pivot handle" }
  - { key: P, mods: [], icon: tool_parms.png, label: "Tool parameters" }

  # --- no modifier: view ---
  - { key: W, mods: [], icon: shading.png, label: "Shaded / wireframe" }
  - { key: D, mods: [], icon: display_options.png, label: "Display options" }
  - { key: M, mods: [], icon: walk.png, label: "First-person navigation" }
  - { key: X, mods: [], icon: snap.png, label: "Snapping menu" }
  - { key: C, mods: [], icon: radial_current.png, label: "Current radial menu" }
  - { key: V, mods: [], icon: view_pie.png, label: "View radial menu" }

  # --- no modifier: selection ---
  - { key: F8, mods: [], icon: obj_comp_toggle.png, label: "Object / component selection" }
  - { key: "1", mods: [], icon: sel_object.png, label: "Select objects" }
  - { key: "2", mods: [], icon: sel_vert.png, label: "Select points" }
  - { key: "3", mods: [], icon: sel_edge.png, label: "Select edges" }
  - { key: "4", mods: [], icon: sel_face.png, label: "Select primitives" }
  - { key: "5", mods: [], icon: sel_vertex.png, label: "Select vertices" }
  - { key: "6", mods: [], icon: sel_particles.png, label: "Select particles" }
  - { key: "7", mods: [], icon: sel_dynamics.png, label: "Select dynamics" }
  - { key: N, mods: [], icon: selectall.png, label: "Select all" }

  # --- no modifier: animation and timeline ---
  - { key: K, mods: [], icon: key_insert.png, label: "Set keyframe" }
  - { key: UP, mods: [], icon: play.png, label: "Play forward" }
  - { key: DOWN, mods: [], icon: play_reverse.png, label: "Play backward" }
  - { key: LEFT, mods: [], icon: frame_prev.png, label: "Previous frame" }
  - { key: RIGHT, mods: [], icon: frame_next.png, label: "Next frame" }

  # --- Shift ---
  - { key: N, mods: [SHIFT], icon: deselect.png, label: "Select nothing" }
  - { key: B, mods: [SHIFT], icon: sel_boundary.png, label: "Select boundary" }
  - { key: P, mods: [SHIFT], icon: sel_pattern.png, label: "Pattern selection" }
  - { key: "`", mods: [SHIFT], icon: secure_select.png, label: "Secure selection" }
  - { key: A, mods: [SHIFT], icon: frame_all.png, label: "Home all" }
  - { key: "\\", mods: [SHIFT], icon: pin_camera.png, label: "Pin current camera" }
  - { key: T, mods: [SHIFT], icon: key_move.png, label: "Key translations" }
  - { key: R, mods: [SHIFT], icon: key_rotate.png, label: "Key rotations" }
  - { key: E, mods: [SHIFT], icon: key_scale.png, label: "Key scale" }

  # --- Ctrl (Cmd on macOS) ---
  - { key: K, mods: [CMDCTRL], icon: key_handle.png, label: "Key handle" }
  - { key: UP, mods: [CMDCTRL], icon: jump_start.png, label: "First frame" }
  - { key: LEFT, mods: [CMDCTRL], icon: key_prev.png, label: "Previous scoped keyframe" }
  - { key: RIGHT, mods: [CMDCTRL], icon: key_next.png, label: "Next scoped keyframe" }
  - { key: T, mods: [CMDCTRL], icon: tab_new.png, label: "New pane tab" }
  - { key: W, mods: [CMDCTRL], icon: tab_close.png, label: "Close pane tab" }
  - { key: PGUP, mods: [CMDCTRL], icon: tab_prev.png, label: "Previous tab" }
  - { key: PGDN, mods: [CMDCTRL], icon: tab_next.png, label: "Next tab" }
  # File and Edit menu: not on a SideFX page (SOURCES.md).
  - { key: N, mods: [CMDCTRL], icon: new.png, label: "New scene" }
  - { key: O, mods: [CMDCTRL], icon: open.png, label: "Open scene" }
  - { key: S, mods: [CMDCTRL], icon: save.png, label: Save }
  - { key: Z, mods: [CMDCTRL], icon: undo.png, label: Undo }

  # --- Alt (Option on macOS) ---
  - { key: K, mods: [ALT], icon: autokey.png, label: "Auto-key" }
  - { key: "1", mods: [ALT], icon: view_persp.png, label: "Scene View" }
  - { key: "2", mods: [ALT], icon: nodeeditor.png, label: "Network Editor" }
  - { key: "3", mods: [ALT], icon: attributes.png, label: "Parameters" }
  - { key: "4", mods: [ALT], icon: objectmanager.png, label: "Tree View" }
  - { key: "5", mods: [ALT], icon: ed_console.png, label: "Textport" }
  - { key: "6", mods: [ALT], icon: ed_graph.png, label: "Animation Editor" }
  - { key: "7", mods: [ALT], icon: material_palette.png, label: "Material Palette" }
  - { key: "8", mods: [ALT], icon: details_view.png, label: "Details View" }
  - { key: "9", mods: [ALT], icon: view_persp.png, label: "Scene View" }
  - { key: "/", mods: [ALT], icon: closeall.png, label: "Close all tabs" }

  # --- Alt+Shift ---
  - { key: C, mods: [ALT, SHIFT], icon: tab_tearoff.png, label: "Tear off tab" }
