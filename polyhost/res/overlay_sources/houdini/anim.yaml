# SideFX Houdini shortcut overlays for PolyKybd: the Animation Editor.
# See SOURCES.md.
#
# Loaded while the Houdini reporter (houdini-package/) says the pointer is over
# an Animation Editor (`houdini://anim`). The report does not say which of its
# three views (graph, dopesheet, table) is shown, so this set draws the graph
# view keys, plus the keys that switch the view and the keys of
# bindings.yaml that work in every pane.
#
# Keys: SideFX, Houdini 22.0:
#   https://www.sidefx.com/docs/houdini/ref/panes/changraph.html (graph view)
#   https://www.sidefx.com/docs/houdini/ref/panes/animeditor.html (1, 2, 3 and
#     the Ctrl+Left / Ctrl+Right bookmark keys)
#   https://www.sidefx.com/docs/houdini/start/hotkeys.html (every pane)
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/houdini/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/houdini/anim.yaml --preview /tmp/houdini_anim_preview
app: houdini
match: [houdini, houdinifx, houdinicore, happrentice, hindie, hescape, houdini-bin, houdini fx, houdini core, houdini apprentice, houdini indie]
output: houdini_anim_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: houdini.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- no modifier: keys and slopes (graph view)
  - { key: K, mods: [], icon: key_insert.png, label: "Set keyframe" }
  - { key: DEL, mods: [], icon: key_delete.png, label: "Delete the selected keys" }
  - { key: "0", mods: [], icon: slope_flat.png, label: "Selected slopes to zero" }
  - { key: "9", mods: [], icon: slope_auto.png, label: "Selected slopes to automatic" }
  - { key: ",", mods: [], icon: key_prev.png, label: "Previous keyframe" }
  - { key: ".", mods: [], icon: key_next.png, label: "Next keyframe" }
  - { key: I, mods: [], icon: isolate.png, label: "Isolate channels" }
  - { key: S, mods: [], icon: sel_channel.png, label: "Select on one channel (hold, drag)" }

  # --- no modifier: views of the Animation Editor
  - { key: "1", mods: [], icon: ed_graph.png, label: "Graph view" }
  - { key: "2", mods: [], icon: ed_dopesheet.png, label: "Dopesheet view" }
  - { key: "3", mods: [], icon: ed_table.png, label: "Table view" }

  # --- no modifier: timeline (every pane)
  - { key: UP, mods: [], icon: play.png, label: "Play forward" }
  - { key: DOWN, mods: [], icon: play_reverse.png, label: "Play backward" }
  - { key: LEFT, mods: [], icon: frame_prev.png, label: "Previous frame" }
  - { key: RIGHT, mods: [], icon: frame_next.png, label: "Next frame" }

  # --- Shift
  - { key: LEFT, mods: [SHIFT], icon: key_prev.png, label: "Previous keyframe" }
  - { key: RIGHT, mods: [SHIFT], icon: key_next.png, label: "Next keyframe" }
  - { key: I, mods: [SHIFT], icon: isolate_revert.png, label: "Revert isolate channels" }

  # --- Ctrl (Cmd on macOS)
  - { key: C, mods: [CMDCTRL], icon: copy.png, label: "Copy key values" }
  - { key: V, mods: [CMDCTRL], icon: paste.png, label: "Paste key values" }
  - { key: LEFT, mods: [CMDCTRL], icon: bm_prev.png, label: "Previous bookmark" }
  - { key: RIGHT, mods: [CMDCTRL], icon: bm_next.png, label: "Next bookmark" }
  - { key: UP, mods: [CMDCTRL], icon: jump_start.png, label: "First frame" }
  - { key: T, mods: [CMDCTRL], icon: tab_new.png, label: "New pane tab" }
  - { key: W, mods: [CMDCTRL], icon: tab_close.png, label: "Close pane tab" }
  - { key: PGUP, mods: [CMDCTRL], icon: tab_prev.png, label: "Previous tab" }
  - { key: PGDN, mods: [CMDCTRL], icon: tab_next.png, label: "Next tab" }
  # File and Edit menu: not on a SideFX page (SOURCES.md).
  - { key: N, mods: [CMDCTRL], icon: new.png, label: "New scene" }
  - { key: O, mods: [CMDCTRL], icon: open.png, label: "Open scene" }
  - { key: S, mods: [CMDCTRL], icon: save.png, label: Save }
  - { key: Z, mods: [CMDCTRL], icon: undo.png, label: Undo }

  # --- Alt (Option on macOS)
  - { key: C, mods: [ALT], icon: copy.png, label: "Copy key values" }
  - { key: V, mods: [ALT], icon: paste.png, label: "Paste key values" }
  - { key: K, mods: [ALT], icon: autokey.png, label: "Auto-key" }
  - { key: "1", mods: [ALT], icon: view_persp.png, label: "Scene View" }
  - { key: "2", mods: [ALT], icon: nodeeditor.png, label: "Network Editor" }
  - { key: "3", mods: [ALT], icon: attributes.png, label: "Parameters" }
  - { key: "4", mods: [ALT], icon: objectmanager.png, label: "Tree View" }
  - { key: "5", mods: [ALT], icon: ed_console.png, label: "Textport" }
  - { key: "6", mods: [ALT], icon: ed_graph.png, label: "Animation Editor" }
  - { key: "7", mods: [ALT], icon: material_palette.png, label: "Material Palette" }
  - { key: "8", mods: [ALT], icon: details_view.png, label: "Details View" }
  - { key: "9", mods: [ALT], icon: view_persp.png, label: "Scene View" }
  - { key: "/", mods: [ALT], icon: closeall.png, label: "Close all tabs" }

  # --- Alt+Shift
  - { key: C, mods: [ALT, SHIFT], icon: tab_tearoff.png, label: "Tear off tab" }
