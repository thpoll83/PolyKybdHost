# Windows File Explorer shortcut overlays for PolyKybd.
#
# Icons: Microsoft Fluent UI System Icons (MIT) — native style for a MS app.
# Program icon (ESC, all layers): a folder (swap for the real Explorer logo by
# committing icons/explorer.png). See SOURCES.md. Shortcuts: Windows 10/11 defaults.
#
# Regenerate:
#   python polyhost/res/overlay_sources/explorer/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/explorer/bindings.yaml --preview /tmp/exp_preview
app: explorer
match: [explorer]              # confirm vs the active-window name (explorer / explorer.exe)
output: explorer_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: explorer.png      # 32x32 white-on-black line art — placed 1:1
program_icon_mode: bright        # source is white-on-black: light the white pixels
program_icon_anchor: bottom-right
program_icon_region: [32, 32]    # native size -> no scaling (1:1), bigger than shortcuts
program_icon_margin: 1
program_icon_threshold: 128

bindings:
  # --- edit (Ctrl -> R channel of primary) ---
  - { key: C, mods: [CTRL], icon: copy.png,      label: Copy,        source: "ms-fluent/Copy (MIT)" }
  - { key: X, mods: [CTRL], icon: cut.png,       label: Cut,         source: "ms-fluent/Cut (MIT)" }
  - { key: V, mods: [CTRL], icon: paste.png,     label: Paste,       source: "ms-fluent/Clipboard Paste (MIT)" }
  - { key: Z, mods: [CTRL], icon: undo.png,      label: Undo,        source: "ms-fluent/Arrow Undo (MIT)" }
  - { key: Y, mods: [CTRL], icon: redo.png,      label: Redo,        source: "ms-fluent/Arrow Redo (MIT)" }
  - { key: A, mods: [CTRL], icon: selectall.png, label: "Select all", source: "ms-fluent/Select All On (MIT)" }

  # --- file / window (Ctrl) ---
  - { key: F, mods: [CTRL], icon: find.png,      label: Search,      source: "ms-fluent/Search (MIT)" }
  - { key: N, mods: [CTRL], icon: newwindow.png, label: "New window", source: "ms-fluent/Window New (MIT)" }
  - { key: W, mods: [CTRL], icon: close.png,     label: Close,       source: "ms-fluent/Dismiss (MIT)" }
  - { key: L, mods: [CTRL], icon: address.png,   label: "Address bar", source: "ms-fluent/Location (MIT)" }

  # --- plain keys (no-mod -> A channel) ---
  - { key: F2, mods: [], icon: rename.png,     label: Rename,    source: "ms-fluent/Rename (MIT)" }
  - { key: DELETE, mods: [], icon: delete.png, label: Delete,    source: "ms-fluent/Delete (MIT)" }
  - { key: F5, mods: [], icon: refresh.png,    label: Refresh,   source: "ms-fluent/Arrow Sync (MIT)" }
  - { key: BACKSPACE, mods: [], icon: back.png, label: Back,     source: "ms-fluent/Arrow Left (MIT)" }
  - { key: F11, mods: [], icon: fullscreen.png, label: "Full screen", source: "ms-fluent/Full Screen Maximize (MIT)" }

  # --- Shift -> B channel of primary ---
  - { key: DELETE, mods: [SHIFT], icon: deleteperm.png, label: "Delete (perm)", source: "ms-fluent/Delete Dismiss (MIT)" }

  # --- Alt -> G channel of primary (navigation) ---
  - { key: ENTER, mods: [ALT], icon: properties.png, label: Properties, source: "ms-fluent/Settings (MIT)" }
  - { key: UP,    mods: [ALT], icon: uplevel.png,    label: "Up level", source: "ms-fluent/Arrow Up (MIT)" }
  - { key: LEFT,  mods: [ALT], icon: back.png,       label: Back,       source: "ms-fluent/Arrow Left (MIT)" }
  - { key: RIGHT, mods: [ALT], icon: forward.png,    label: Forward,    source: "ms-fluent/Arrow Right (MIT)" }

  # --- Ctrl+Shift -> R channel of combo ---
  - { key: N, mods: [CTRL, SHIFT], icon: newfolder.png, label: "New folder", source: "ms-fluent/Folder Add (MIT)" }

  # ---------------------------------------------------------------------------
  # Win-key (GUI) combos — protocol 12.  These are Windows *shell* shortcuts
  # rather than Explorer commands, but they are the ones actually reached for
  # while a file window has focus, and they are what fills the GUI tiers:
  #   GUI              -> A channel of *.combo.mods.png
  #   GUI+Shift        -> G channel of *.extra.mods.png
  #   GUI+Alt          -> B channel of *.extra.mods.png
  #   GUI+Ctrl         -> A channel of *.extra.mods.png
  #   GUI+Ctrl+Shift   -> R channel of *.gui.mods.png
  # Ctrl+Alt+Shift (R of extra) and the remaining three gui-tier channels are
  # left empty on purpose: Windows defines no standard shortcut for them, and
  # inventing one would put a lie on a keycap.
  # ---------------------------------------------------------------------------

  # --- GUI (bare Win) -> A channel of combo ---
  - { key: E,   mods: [GUI], icon: winexplorer.png, label: "File Explorer",  source: "ms-fluent/Folder Open (MIT)" }
  - { key: D,   mods: [GUI], icon: showdesktop.png, label: "Show desktop",   source: "ms-fluent/Desktop (MIT)" }
  - { key: L,   mods: [GUI], icon: lock.png,        label: Lock,             source: "ms-fluent/Lock Closed (MIT)" }
  - { key: R,   mods: [GUI], icon: run.png,         label: Run,              source: "ms-fluent/Window Dev Tools (MIT)" }
  - { key: I,   mods: [GUI], icon: settings.png,    label: Settings,         source: "ms-fluent/Settings (MIT)" }
  - { key: V,   mods: [GUI], icon: clipboard.png,   label: "Clipboard history", source: "ms-fluent/Clipboard (MIT)" }
  - { key: X,   mods: [GUI], icon: quicklink.png,   label: "Quick Link menu", source: "ms-fluent/Apps List (MIT)" }
  - { key: S,   mods: [GUI], icon: find.png,        label: Search,           source: "ms-fluent/Search (MIT)" }
  - { key: P,   mods: [GUI], icon: project.png,     label: Project,          source: "ms-fluent/Projection Screen (MIT)" }
  - { key: TAB, mods: [GUI], icon: taskview.png,    label: "Task view",      source: "ms-fluent/Window Multiple (MIT)" }

  # --- GUI+Shift -> G channel of extra ---
  - { key: S,     mods: [GUI, SHIFT], icon: snip.png,       label: "Snip screen",     source: "ms-fluent/Screenshot (MIT)" }
  - { key: M,     mods: [GUI, SHIFT], icon: restorewin.png, label: "Restore windows", source: "ms-fluent/Arrow Maximize (MIT)" }
  - { key: LEFT,  mods: [GUI, SHIFT], icon: moveleft.png,   label: "Window -> left display",  source: "ms-fluent/Panel Left (MIT)" }
  - { key: RIGHT, mods: [GUI, SHIFT], icon: moveright.png,  label: "Window -> right display", source: "ms-fluent/Panel Right (MIT)" }

  # --- GUI+Alt -> B channel of extra (Xbox Game Bar; needs it installed) ---
  - { key: R,             mods: [GUI, ALT], icon: record.png,      label: Record,       source: "ms-fluent/Record (MIT)" }
  - { key: PRINT_SCREEN,  mods: [GUI, ALT], icon: gamecapture.png, label: "Screenshot", source: "ms-fluent/Camera (MIT)" }

  # --- GUI+Ctrl -> A channel of extra (virtual desktops) ---
  - { key: D,     mods: [GUI, CTRL], icon: desktopnew.png,  label: "New desktop",      source: "ms-fluent/Tab Add (MIT)" }
  - { key: F4,    mods: [GUI, CTRL], icon: close.png,       label: "Close desktop",    source: "ms-fluent/Dismiss (MIT)" }
  - { key: LEFT,  mods: [GUI, CTRL], icon: desktopprev.png, label: "Previous desktop", source: "ms-fluent/Chevron Left (MIT)" }
  - { key: RIGHT, mods: [GUI, CTRL], icon: desktopnext.png, label: "Next desktop",     source: "ms-fluent/Chevron Right (MIT)" }

  # --- GUI+Ctrl+Shift -> R channel of gui ---
  - { key: B, mods: [GUI, CTRL, SHIFT], icon: gfxreset.png, label: "Reset graphics driver", source: "ms-fluent/Desktop Sync (MIT)" }
