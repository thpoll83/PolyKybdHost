# Steam client (desktop mode) shortcut overlay for PolyKybd. See SOURCES.md.
#
# The desktop client has few keyboard shortcuts. The keys below are the ones
# its own UI code handles (steamui/sp.js): Find in a store or community page,
# and the chat tab keys of the Friends & Chat window. Steam checks the Ctrl key
# itself on every platform, so the macOS set is the same (Ctrl, not Cmd).
#
# Big Picture mode is a separate set: steam_bigpicture.yaml.
#
# Regenerate:
#   python polyhost/res/overlay_sources/steam/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/steam/steam.yaml --preview /tmp/steam_preview
app: steam
match: [steam, steamwebhelper]
output: steam_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 128

program_icon: steam.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  - { key: F, mods: [CTRL], icon: find.png, label: "Find in page" }
  # Friends & Chat window: the tab keys of a chat window with several chats.
  - { key: TAB, mods: [CTRL], icon: nextchat.png, label: "Next chat" }
  - { key: PGDN, mods: [CTRL], icon: nextchat.png, label: "Next chat" }
  - { key: TAB, mods: [CTRL, SHIFT], icon: prevchat.png, label: "Previous chat" }
  - { key: PGUP, mods: [CTRL], icon: prevchat.png, label: "Previous chat" }
  - { key: W, mods: [CTRL], icon: closechat.png, label: "Close chat" }
