# Steam Big Picture mode overlay for PolyKybd. See SOURCES.md.
#
# In Big Picture mode the keyboard stands in for a controller. The table is
# the client's own keyboard-to-controller map (steamui/sp.js, the list that
# maps "F1" to STEAM_GUIDE and "Digit1" + Ctrl to the same button). Each key is
# drawn as the controller button it presses. Esc is Back (B), but the ESC cell
# shows the program mark, so it is not drawn. The arrow keys are the D-pad and
# are left out. Steam checks Ctrl itself on every platform, so the macOS set
# is the same.
#
# Regenerate:
#   python polyhost/res/overlay_sources/steam/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/steam/steam_bigpicture.yaml --preview /tmp/steam_bp_preview
app: steam big picture
match: [steam, steamwebhelper]
output: steam_bigpicture_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 128

program_icon: steam.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  - { key: ENTER, mods: [], icon: btn_a.png, label: "A: select" }
  - { key: F1, mods: [], icon: steam.png, label: "Steam menu" }
  - { key: "1", mods: [CTRL], icon: steam.png, label: "Steam menu" }
  - { key: F2, mods: [], icon: quickaccess.png, label: "Quick Access menu" }
  - { key: "2", mods: [CTRL], icon: quickaccess.png, label: "Quick Access menu" }
  - { key: F3, mods: [], icon: btn_x.png, label: "X button" }
  - { key: BACKSPACE, mods: [], icon: btn_x.png, label: "X button" }
  - { key: F4, mods: [], icon: btn_y.png, label: "Y button" }
  - { key: "8", mods: [CTRL], icon: btn_y.png, label: "Y button" }
  - { key: F6, mods: [], icon: btn_lb.png, label: "LB: previous tab" }
  - { key: "4", mods: [CTRL], icon: btn_lb.png, label: "LB: previous tab" }
  - { key: F7, mods: [], icon: btn_rb.png, label: "RB: next tab" }
  - { key: "5", mods: [CTRL], icon: btn_rb.png, label: "RB: next tab" }
  - { key: F6, mods: [SHIFT], icon: btn_lt.png, label: "LT button" }
  - { key: "4", mods: [CTRL, SHIFT], icon: btn_lt.png, label: "LT button" }
  - { key: F7, mods: [SHIFT], icon: btn_rt.png, label: "RT button" }
  - { key: "5", mods: [CTRL, SHIFT], icon: btn_rt.png, label: "RT button" }
  - { key: F6, mods: [CTRL], icon: btn_l3.png, label: "L3: left stick click" }
  - { key: "6", mods: [CTRL], icon: btn_l3.png, label: "L3: left stick click" }
  - { key: F7, mods: [CTRL], icon: btn_r3.png, label: "R3: right stick click" }
  - { key: "7", mods: [CTRL], icon: btn_r3.png, label: "R3: right stick click" }
  - { key: F8, mods: [], icon: viewbutton.png, label: "View button" }
  - { key: "3", mods: [CTRL], icon: viewbutton.png, label: "View button" }
  - { key: F9, mods: [], icon: menubutton.png, label: "Menu button" }
  - { key: "0", mods: [CTRL], icon: menubutton.png, label: "Menu button" }
