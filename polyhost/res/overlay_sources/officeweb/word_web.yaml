# Word for the web overlays for PolyKybd. See SOURCES.md.
#
# Windows and Linux only: Microsoft documents the web shortcuts with Ctrl, and
# gives no Mac column. On macOS the browser's keycaps stay.
#
# Regenerate:
#   python polyhost/res/overlay_sources/officeweb/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/officeweb/word_web.yaml --preview /tmp/word_web_preview
app: word-web
match: [word-web]
output: word_web_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: word.png
program_icon_mode: alpha
program_icon_anchor: bottom-right
program_icon_region: [46, 40]
program_icon_margin: 0

bindings:
  - { key: F, mods: [CTRL], label: Find }
  - { key: G, mods: [CTRL], label: Find, source: "Find in the Editing view" }
  - { key: H, mods: [CTRL], icon: replace.png,  label: Replace }
  - { key: P, mods: [CTRL], label: Print }
  - { key: A, mods: [CTRL], label: "Select all" }
  - { key: X, mods: [CTRL], label: Cut }
  - { key: C, mods: [CTRL], label: Copy }
  - { key: V, mods: [CTRL], label: Paste }
  - { key: Z, mods: [CTRL], label: Undo }
  - { key: Y, mods: [CTRL], label: Redo }
  - { key: B, mods: [CTRL], label: Bold }
  - { key: I, mods: [CTRL], label: Italic }
  - { key: U, mods: [CTRL], label: Underline }
  - { key: "[", mods: [CTRL], icon: fontdec.png, label: "Font -" }
  - { key: "]", mods: [CTRL], icon: fontinc.png, label: "Font +" }
  - { key: L, mods: [CTRL], icon: left.png,    label: "Align left" }
  - { key: E, mods: [CTRL], icon: center.png,  label: "Align center" }
  - { key: R, mods: [CTRL], icon: right.png,   label: "Align right" }
  - { key: J, mods: [CTRL], icon: justify.png, label: Justify }
  - { key: DOT, mods: [CTRL], icon: bullets.png,   label: "Bullet list" }
  - { key: "/", mods: [CTRL], icon: numbering.png, label: "Numbered list" }
  - { key: F3, mods: [CTRL], icon: ribbon.png,     label: "Collapse ribbon" }
  - { key: M, mods: [CTRL, ALT], icon: comment.png, label: "New comment" }
  - { key: Q, mods: [ALT], icon: tellme.png, label: "Tell Me" }
  - { key: F3, mods: [], label: Find }
