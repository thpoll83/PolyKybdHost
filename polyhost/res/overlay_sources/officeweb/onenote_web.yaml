# OneNote for the web overlays for PolyKybd. See SOURCES.md.
#
# Windows and Linux only: Microsoft's web tab gives Ctrl chords and no Mac
# column. On macOS the browser's keycaps stay. Ctrl+PgUp/PgDn (page through the
# notebook) is left out: Chrome and Edge keep it for their own tabs.
#
# Regenerate:
#   python polyhost/res/overlay_sources/officeweb/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/officeweb/onenote_web.yaml --preview /tmp/onenote_web_preview
app: onenote-web
match: [onenote-web]
output: onenote_web_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: onenote.png
program_icon_mode: alpha
program_icon_anchor: bottom-right
program_icon_region: [46, 40]
program_icon_margin: 0

bindings:
  - { key: X, mods: [CTRL], label: Cut }
  - { key: C, mods: [CTRL], label: Copy }
  - { key: V, mods: [CTRL], label: Paste }
  - { key: Z, mods: [CTRL], label: Undo }
  - { key: Y, mods: [CTRL], label: Redo }
  - { key: B, mods: [CTRL], label: Bold }
  - { key: I, mods: [CTRL], label: Italic }
  - { key: U, mods: [CTRL], label: Underline }
  - { key: K, mods: [CTRL], icon: hyperlink.png, label: Hyperlink }
  - { key: L, mods: [CTRL], icon: left.png,      label: "Align left" }
  - { key: R, mods: [CTRL], icon: right.png,     label: "Align right" }
  - { key: DOT, mods: [CTRL], icon: bullets.png,   label: "Bullet list" }
  - { key: "/", mods: [CTRL], icon: numbering.png, label: "Numbered list" }
  - { key: ENTER, mods: [CTRL], icon: rowbelow.png, label: "Row below" }
  - { key: "1", mods: [CTRL], icon: tagtodo.png,       label: "To Do tag" }
  - { key: "2", mods: [CTRL], icon: tagimportant.png,  label: "Important tag" }
  - { key: "3", mods: [CTRL], icon: tagquestion.png,   label: "Question tag" }
  - { key: "4", mods: [CTRL], icon: tagremember.png,   label: "Remember tag" }
  - { key: "5", mods: [CTRL], icon: tagdefinition.png, label: "Definition tag" }
  - { key: "6", mods: [CTRL], icon: taghighlight.png,  label: "Highlight tag" }
  - { key: "7", mods: [CTRL], icon: tagcontact.png,    label: "Contact tag" }
  - { key: "8", mods: [CTRL], icon: tagaddress.png,    label: "Address tag" }
  - { key: "9", mods: [CTRL], icon: tagphone.png,      label: "Phone tag" }
  - { key: F, mods: [CTRL, SHIFT], icon: newoutline.png, label: "New outline" }
  - { key: F7, mods: [ALT], icon: spelling.png, label: "Next misspelling" }
  - { key: PGUP, mods: [ALT], icon: firstpage.png, label: "First page" }
  - { key: PGDN, mods: [ALT], icon: lastpage.png,  label: "Last page" }
  - { key: UP,    mods: [ALT, SHIFT], icon: moveup.png,   label: "Move page up" }
  - { key: DOWN,  mods: [ALT, SHIFT], icon: movedown.png, label: "Move page down" }
  - { key: RIGHT, mods: [ALT, SHIFT], icon: indent.png,   label: Indent }
  - { key: LEFT,  mods: [ALT, SHIFT], icon: outdent.png,  label: Outdent }
