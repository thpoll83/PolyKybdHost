# PowerPoint for the web overlays for PolyKybd (Windows/Linux and macOS). See
# SOURCES.md.
#
# Microsoft's web table has a Mac column, so this spec writes both sets, the
# way the desktop specs do: CMDCTRL where the Mac chord is the Cmd version of
# the Windows one, and `only:` / `except:` where the Mac chord differs.
#
# Regenerate:
#   python polyhost/res/overlay_sources/officeweb/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/officeweb/powerpoint_web.yaml --preview /tmp/powerpoint_web_preview
app: powerpoint-web
match: [powerpoint-web]
output: powerpoint_web_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: powerpoint.png
program_icon_mode: alpha
program_icon_anchor: bottom-right
program_icon_region: [46, 40]
program_icon_margin: 0

bindings:
  # --- same chord on both, Ctrl / Cmd ---
  - { key: X, mods: [CMDCTRL], label: Cut }
  - { key: C, mods: [CMDCTRL], label: Copy }
  - { key: V, mods: [CMDCTRL], label: Paste }
  - { key: Z, mods: [CMDCTRL], label: Undo }
  - { key: Y, mods: [CMDCTRL], label: Redo }
  - { key: F, mods: [CMDCTRL], label: Find }
  - { key: P, mods: [CMDCTRL], label: Print }
  - { key: A, mods: [CMDCTRL], label: "Select all" }
  - { key: B, mods: [CMDCTRL], label: Bold }
  - { key: I, mods: [CMDCTRL], label: Italic }
  - { key: U, mods: [CMDCTRL], label: Underline }
  - { key: K, mods: [CMDCTRL], icon: hyperlink.png, label: Hyperlink }
  - { key: D, mods: [CMDCTRL], icon: duplicate.png, label: Duplicate }
  - { key: E, mods: [CMDCTRL], icon: center.png,    label: "Align center" }
  - { key: J, mods: [CMDCTRL], icon: justify.png,   label: Justify }
  - { key: V,     mods: [CMDCTRL, SHIFT], icon: pastetext.png, label: "Paste text" }
  - { key: DOT,   mods: [CMDCTRL, SHIFT], icon: fontinc.png,   label: "Font +" }
  - { key: COMMA, mods: [CMDCTRL, SHIFT], icon: fontdec.png,   label: "Font -" }
  - { key: UP,    mods: [CMDCTRL], icon: slideup.png,   label: "Move slide up" }
  - { key: DOWN,  mods: [CMDCTRL], icon: slidedown.png, label: "Move slide down" }
  - { key: UP,    mods: [CMDCTRL, SHIFT], icon: slidefirst.png, label: "Slide to start" }
  - { key: DOWN,  mods: [CMDCTRL, SHIFT], icon: slidelast.png,  label: "Slide to end" }
  - { key: SPACE, mods: [CTRL], icon: clearfmt.png, label: "Clear format" }
  - { key: RIGHT, mods: [ALT],  icon: rotright.png, label: "Rotate right" }
  - { key: LEFT,  mods: [ALT],  icon: rotleft.png,  label: "Rotate left" }
  # --- Windows / Linux ---
  - { key: M, mods: [CTRL], icon: newslide.png, label: "New slide",    except: [macos] }
  - { key: L, mods: [CTRL], icon: left.png,     label: "Align left",   except: [macos] }
  - { key: R, mods: [CTRL], icon: right.png,    label: "Align right",  except: [macos] }
  - { key: "[", mods: [CTRL], icon: backward.png, label: "Send backward",  except: [macos] }
  - { key: "]", mods: [CTRL], icon: forward.png,  label: "Bring forward",  except: [macos] }
  - { key: "[", mods: [CTRL, SHIFT], icon: back.png,  label: "Send to back",   except: [macos] }
  - { key: "]", mods: [CTRL, SHIFT], icon: front.png, label: "Bring to front", except: [macos] }
  - { key: M, mods: [CTRL, ALT], icon: comment.png, label: "New comment", except: [macos] }
  - { key: PGDN, mods: [], icon: nextpage.png, label: "Next slide",     except: [macos] }
  - { key: PGUP, mods: [], icon: prevpage.png, label: "Previous slide", except: [macos] }
  # --- macOS ---
  - { key: L, mods: [GUI, SHIFT], icon: left.png,    label: "Align left",  only: [macos] }
  - { key: R, mods: [GUI, SHIFT], icon: right.png,   label: "Align right", only: [macos] }
  - { key: B, mods: [GUI, SHIFT, ALT], icon: backward.png, label: "Send backward", only: [macos] }
  - { key: F, mods: [GUI, SHIFT, ALT], icon: forward.png,  label: "Bring forward", only: [macos] }
  - { key: "[", mods: [GUI, SHIFT, ALT], icon: back.png,   label: "Send to back",  only: [macos] }
  - { key: F, mods: [GUI, SHIFT], icon: front.png,   label: "Bring to front", only: [macos] }
  - { key: M, mods: [GUI, SHIFT], icon: comment.png, label: "New comment",    only: [macos] }
