# Excel for the web overlays for PolyKybd. See SOURCES.md.
#
# Windows and Linux only: Microsoft documents the web shortcuts with Ctrl, and
# gives no Mac column. On macOS the browser's keycaps stay. Sheet switching is
# drawn on Ctrl+Alt+PgUp/PgDn, the chord the page gives for Chrome; Chrome keeps
# Ctrl+PgUp/PgDn for its own tabs.
#
# Regenerate:
#   python polyhost/res/overlay_sources/officeweb/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/officeweb/excel_web.yaml --preview /tmp/excel_web_preview
app: excel-web
match: [excel-web]
output: excel_web_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: excel.png
program_icon_mode: alpha
program_icon_anchor: bottom-right
program_icon_region: [46, 40]
program_icon_margin: 0

bindings:
  # --- Ctrl ---
  - { key: P, mods: [CTRL], label: Print }
  - { key: F, mods: [CTRL], label: Find }
  - { key: G, mods: [CTRL], icon: goto.png, label: "Go to" }
  - { key: X, mods: [CTRL], label: Cut }
  - { key: C, mods: [CTRL], label: Copy }
  - { key: V, mods: [CTRL], label: Paste }
  - { key: Z, mods: [CTRL], label: Undo }
  - { key: Y, mods: [CTRL], label: Redo }
  - { key: B, mods: [CTRL], label: Bold }
  - { key: I, mods: [CTRL], label: Italic }
  - { key: U, mods: [CTRL], label: Underline }
  - { key: K, mods: [CTRL], icon: hyperlink.png,   label: Hyperlink }
  - { key: L, mods: [CTRL], icon: table.png,       label: "Insert table" }
  - { key: E, mods: [CTRL], icon: flashfill.png,   label: "Flash Fill" }
  - { key: "1", mods: [CTRL], icon: formatcells.png, label: "Number format" }
  - { key: "9", mods: [CTRL], icon: hiderows.png,  label: "Hide rows" }
  - { key: "0", mods: [CTRL], icon: hidecols.png,  label: "Hide columns" }
  - { key: MINUS, mods: [CTRL], icon: delcells.png, label: "Delete cells" }
  - { key: ";", mods: [CTRL], icon: date.png,      label: "Insert date" }
  - { key: "'", mods: [CTRL], icon: filldown.png,  label: "Formula from above" }
  # --- Ctrl+Shift ---
  - { key: L, mods: [CTRL, SHIFT], icon: filter.png,      label: AutoFilter }
  - { key: V, mods: [CTRL, SHIFT], icon: pasteformat.png, label: "Paste format" }
  - { key: ";", mods: [CTRL, SHIFT], icon: time.png,      label: "Insert time" }
  - { key: "'", mods: [CTRL, SHIFT], icon: valueabove.png, label: "Value from above" }
  - { key: DOT,   mods: [CTRL, SHIFT], icon: fontinc.png, label: "Font +" }
  - { key: COMMA, mods: [CTRL, SHIFT], icon: fontdec.png, label: "Font -" }
  - { key: "1", mods: [CTRL, SHIFT], icon: numberfmt.png,  label: "Number" }
  - { key: "2", mods: [CTRL, SHIFT], icon: time.png,       label: "Time format" }
  - { key: "3", mods: [CTRL, SHIFT], icon: date.png,       label: "Date format" }
  - { key: "4", mods: [CTRL, SHIFT], icon: currency.png,   label: Currency }
  - { key: "5", mods: [CTRL, SHIFT], icon: percent.png,    label: Percent }
  - { key: "6", mods: [CTRL, SHIFT], icon: scientific.png, label: Scientific }
  - { key: "7", mods: [CTRL, SHIFT], icon: border.png,     label: "Outside border" }
  - { key: "9", mods: [CTRL, SHIFT], icon: unhiderows.png, label: "Unhide rows" }
  - { key: "0", mods: [CTRL, SHIFT], icon: unhide.png,     label: "Unhide columns" }
  - { key: F2, mods: [CTRL, SHIFT], icon: threadreply.png, label: "Threaded comment" }
  # --- Ctrl+Alt ---
  - { key: PGDN, mods: [CTRL, ALT], icon: nextsheet.png,     label: "Next sheet" }
  - { key: PGUP, mods: [CTRL, ALT], icon: prevsheet.png,     label: "Previous sheet" }
  - { key: L,    mods: [CTRL, ALT], icon: reapplyfilter.png, label: "Reapply filter" }
  - { key: F5,   mods: [CTRL, ALT], icon: refreshall.png,    label: "Refresh all data" }
  - { key: F9,   mods: [CTRL, ALT, SHIFT], icon: fullcalc.png, label: "Full calculation" }
  # --- Alt ---
  - { key: EQUAL, mods: [ALT], icon: autosum.png, label: AutoSum }
  - { key: F1, mods: [ALT], icon: chart.png,   label: "Insert chart" }
  - { key: F2, mods: [ALT], icon: saveas.png,  label: "Save as" }
  - { key: F5, mods: [ALT], icon: refresh.png, label: "Refresh data" }
  - { key: Q,  mods: [ALT], icon: tellme.png,  label: Search }
  # --- plain and Shift ---
  - { key: F2,  mods: [],      icon: edit.png,     label: "Edit cell" }
  - { key: F9,  mods: [],      icon: calc.png,     label: Calculate }
  - { key: F2,  mods: [SHIFT], icon: note.png,     label: "Edit note" }
  - { key: F3,  mods: [SHIFT], icon: function.png, label: "Insert function" }
  - { key: F4,  mods: [SHIFT], label: "Find next" }
  - { key: F11, mods: [SHIFT], icon: newsheet.png, label: "New sheet" }
