# Clip Studio Paint (Celsys) shortcut overlays for PolyKybd. See SOURCES.md.
#
# Keys: the default shortcuts in Celsys's Clip Studio Paint user guide, chapter
# "Shortcut list" (help.clip-studio.com/en-us/manual_en/780_shortcuts/): Tool
# Shortcuts, Menu Shortcuts and Optional Shortcuts, read on 2026-11-05. Tool
# letters are bare keys. The guide states the Windows chords and says to read
# Ctrl as Command and Alt as Option on macOS, so every Ctrl chord is CMDCTRL.
# Next / Previous canvas is the exception: the guide gives control+Tab on macOS,
# so those two use CTRL on both platforms.
#
# Left out: Rotate right (^) and Reset display (Ctrl+@) are on keys of the
# Japanese layout that a US/ISO keyboard has only as a Shift chord; Ctrl+Num+ and
# Ctrl+Num- are keypad keys, which have no keycap cell (Ctrl+; and Ctrl+- are
# drawn). Modifier+drag and modifier+click operations are not key presses.
#
# Icons: the Photoshop set (../photoshop/icons, icon_dir) where the tool or the
# command is the same; the others are in ../clipstudio/icons (fetch_icons.py).
# ESC: a drawn substitute (pen nib in a rounded tile), not the Celsys logo.
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/clipstudio/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/clipstudio/bindings.yaml --preview /tmp/clipstudio_preview
app: clipstudio
match: [clipstudiopaint, clip studio paint]
output: clipstudio_template
icon_dir: ../photoshop/icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: ../../clipstudio/icons/clipstudio.png
program_icon_mode: alpha
program_icon_anchor: bottom-right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- tools (bare letters, Tool Shortcuts) ---
  - { key: "/", mods: [], icon: zoom.png, label: "Zoom" }
  - { key: H, mods: [], icon: hand.png, label: "Hand" }
  - { key: R, mods: [], icon: ../../clipstudio/icons/rotateview.png, label: "Rotate view" }
  - { key: O, mods: [], icon: pathselect.png, mode: alpha, label: "Object" }
  - { key: D, mods: [], icon: ../../clipstudio/icons/selectlayer.png, label: "Select layer" }
  - { key: L, mods: [], icon: ../../clipstudio/icons/lighttable.png, label: "Light table / Edit timeline" }
  - { key: K, mods: [], icon: move.png, label: "Move layer" }
  - { key: M, mods: [], icon: marquee.png, mode: alpha, label: "Selection area" }
  - { key: W, mods: [], icon: magicwand.png, mode: alpha, label: "Auto select" }
  - { key: I, mods: [], icon: eyedropper.png, label: "Eyedropper" }
  - { key: P, mods: [], icon: pen.png, label: "Pen / Pencil" }
  - { key: B, mods: [], icon: brush.png, label: "Brush / Airbrush / Decoration" }
  - { key: E, mods: [], icon: eraser.png, label: "Eraser" }
  - { key: J, mods: [], icon: ../../clipstudio/icons/blend.png, label: "Blend / Distort" }
  - { key: G, mods: [], icon: gradient.png, mode: alpha, label: "Fill / Gradient" }
  - { key: U, mods: [], icon: shape.png, label: "Figure / Frame border / Ruler" }
  - { key: T, mods: [], icon: type.png, label: "Text / Balloon" }
  - { key: Y, mods: [], icon: ../../clipstudio/icons/correctline.png, label: "Correct line" }

  # --- palettes and drawing colour (Optional Shortcuts) ---
  - { key: "[", mods: [], icon: brushdec.png, mode: alpha, label: "Smaller brush size" }
  - { key: "]", mods: [], icon: brushinc.png, mode: alpha, label: "Larger brush size" }
  - { key: COMMA, mods: [], icon: ../../clipstudio/icons/prevtool.png, label: "Previous tool" }
  - { key: DOT, mods: [], icon: ../../clipstudio/icons/nexttool.png, label: "Next tool" }
  - { key: X, mods: [], icon: swapcolors.png, mode: alpha, region: [72, 40], anchor: center, label: "Swap main/sub colour" }
  - { key: C, mods: [], icon: ../../clipstudio/icons/transparentcolor.png, mode: alpha, label: "Drawing / transparent colour" }
  - { key: "0", mods: [], icon: ../../clipstudio/icons/refermultiple.png, label: "Refer multiple" }
  - { key: "[", mods: [CMDCTRL], icon: ../../clipstudio/icons/opacitydec.png, mode: alpha, label: "Reduce opacity" }
  - { key: "]", mods: [CMDCTRL], icon: ../../clipstudio/icons/opacityinc.png, mode: alpha, label: "Increase opacity" }
  - { key: O, mods: [CMDCTRL, SHIFT], icon: ../../clipstudio/icons/densitydec.png, mode: alpha, label: "Reduce brush density" }
  - { key: P, mods: [CMDCTRL, SHIFT], icon: ../../clipstudio/icons/densityinc.png, mode: alpha, label: "Increase brush density" }
  - { key: K, mods: [CMDCTRL, SHIFT], icon: ../../clipstudio/icons/particledec.png, mode: alpha, label: "Reduce particle density" }
  - { key: L, mods: [CMDCTRL, SHIFT], icon: ../../clipstudio/icons/particleinc.png, mode: alpha, label: "Increase particle density" }
  - { key: B, mods: [CMDCTRL], icon: ../../clipstudio/icons/layercolor.png, label: "Use layer colour" }

  # --- Clip Studio Paint menu / File ---
  - { key: N, mods: [CMDCTRL], icon: new.png, label: "New" }
  - { key: O, mods: [CMDCTRL], icon: open.png, label: "Open" }
  - { key: W, mods: [CMDCTRL], icon: close.png, label: "Close" }
  - { key: S, mods: [CMDCTRL], icon: save.png, label: "Save" }
  - { key: S, mods: [CMDCTRL, SHIFT], icon: saveas.png, label: "Save as" }
  - { key: S, mods: [CMDCTRL, ALT], icon: saveas.png, label: "Save as" }
  - { key: S, mods: [ALT, SHIFT], icon: saveas.png, label: "Save as" }
  - { key: P, mods: [CMDCTRL], icon: print.png, label: "Print" }
  - { key: K, mods: [CMDCTRL], icon: ../../clipstudio/icons/settings.png, label: "Preferences" }
  - { key: K, mods: [CMDCTRL, ALT, SHIFT], icon: ../../clipstudio/icons/shortcutset.png, label: "Shortcut settings" }
  - { key: Y, mods: [CMDCTRL, ALT, SHIFT], icon: ../../clipstudio/icons/modkeyset.png, label: "Modifier key settings" }
  - { key: Q, mods: [CMDCTRL], icon: ../../clipstudio/icons/quit.png, label: "Quit" }

  # --- Edit ---
  - { key: Z, mods: [CMDCTRL], icon: undo.png, label: "Undo" }
  - { key: Y, mods: [CMDCTRL], icon: redo.png, label: "Redo" }
  - { key: Z, mods: [CMDCTRL, SHIFT], icon: redo.png, label: "Redo" }
  - { key: X, mods: [CMDCTRL], icon: cut.png, label: "Cut" }
  - { key: F2, mods: [], icon: cut.png, label: "Cut" }
  - { key: C, mods: [CMDCTRL], icon: copy.png, label: "Copy" }
  - { key: F3, mods: [], icon: copy.png, label: "Copy" }
  - { key: V, mods: [CMDCTRL], icon: paste.png, label: "Paste" }
  - { key: F4, mods: [], icon: paste.png, label: "Paste" }
  - { key: V, mods: [CMDCTRL, SHIFT], icon: ../../clipstudio/icons/pasteinplace.png, label: "Paste to shown position" }
  - { key: DELETE, mods: [], icon: ../../clipstudio/icons/erase.png, label: "Erase" }
  - { key: BACKSPACE, mods: [], icon: ../../clipstudio/icons/erase.png, label: "Erase" }
  - { key: DELETE, mods: [CMDCTRL], icon: ../../clipstudio/icons/erase.png, label: "Erase" }
  - { key: BACKSPACE, mods: [CMDCTRL], icon: ../../clipstudio/icons/erase.png, label: "Erase" }
  - { key: DELETE, mods: [SHIFT], icon: ../../clipstudio/icons/outsidesel.png, mode: alpha, label: "Delete outside selection" }
  - { key: BACKSPACE, mods: [SHIFT], icon: ../../clipstudio/icons/outsidesel.png, mode: alpha, label: "Delete outside selection" }
  - { key: DELETE, mods: [ALT], icon: fill.png, label: "Fill" }
  - { key: BACKSPACE, mods: [ALT], icon: fill.png, label: "Fill" }
  - { key: U, mods: [CMDCTRL], icon: huesat.png, label: "Hue / Saturation / Luminosity" }
  - { key: I, mods: [CMDCTRL], icon: invert.png, label: "Reverse gradient" }
  - { key: T, mods: [CMDCTRL], icon: freetransform.png, label: "Scale / Rotate" }
  - { key: T, mods: [CMDCTRL, SHIFT], icon: ../../clipstudio/icons/csptransform.png, label: "Free transform" }

  # --- Layer ---
  - { key: N, mods: [CMDCTRL, SHIFT], icon: newlayer.png, label: "New raster layer" }
  - { key: G, mods: [CMDCTRL], icon: ../../clipstudio/icons/newfolder.png, label: "Folder and insert layer" }
  - { key: G, mods: [CMDCTRL, SHIFT], icon: ../../clipstudio/icons/ungroup.png, label: "Ungroup layer folder" }
  - { key: G, mods: [CMDCTRL, ALT], icon: ../../clipstudio/icons/pp_clipmask.png, label: "Clip to layer below" }
  - { key: E, mods: [CMDCTRL], icon: mergedown.png, label: "Merge with layer below" }
  - { key: E, mods: [ALT, SHIFT], icon: ../../clipstudio/icons/mergesel.png, label: "Merge selected layers" }
  - { key: E, mods: [CMDCTRL, SHIFT], icon: ../../clipstudio/icons/mergevis.png, label: "Merge visible layers" }
  - { key: "]", mods: [ALT], icon: ../../clipstudio/icons/layerabove.png, label: "Select layer above" }
  - { key: "[", mods: [ALT], icon: ../../clipstudio/icons/layerbelow.png, label: "Select layer below" }

  # --- Select ---
  - { key: A, mods: [CMDCTRL], icon: selectall.png, label: "Select all" }
  - { key: D, mods: [CMDCTRL], icon: deselect.png, label: "Deselect" }
  - { key: D, mods: [CMDCTRL, SHIFT], icon: ../../clipstudio/icons/reselect.png, mode: alpha, label: "Reselect" }
  - { key: I, mods: [CMDCTRL, SHIFT], icon: invertsel.png, label: "Invert selected area" }
  - { key: F7, mods: [SHIFT], icon: invertsel.png, label: "Invert selected area" }

  # --- View ---
  - { key: MINUS, mods: [], icon: ../../clipstudio/icons/rotateleft.png, label: "Rotate left" }
  - { key: SEMICOLON, mods: [CMDCTRL], icon: zoomin.png, label: "Zoom in" }
  - { key: MINUS, mods: [CMDCTRL], icon: zoomout.png, label: "Zoom out" }
  - { key: "0", mods: [CMDCTRL, ALT], icon: zoom1to1.png, label: "100%" }
  - { key: "0", mods: [CMDCTRL], icon: fitscreen.png, label: "Fit to screen" }
  - { key: R, mods: [CMDCTRL], icon: rulers.png, label: "Ruler" }
  - { key: "1", mods: [CMDCTRL], icon: ../../clipstudio/icons/snapruler.png, label: "Snap to ruler" }
  - { key: "2", mods: [CMDCTRL], icon: ../../clipstudio/icons/snapspecial.png, label: "Snap to special ruler" }
  - { key: "3", mods: [CMDCTRL], icon: ../../clipstudio/icons/snapgrid.png, label: "Snap to grid" }
  - { key: "4", mods: [CMDCTRL], icon: ../../clipstudio/icons/togglespecial.png, label: "Toggle special ruler snapping" }

  # --- Window / Help ---
  - { key: TAB, mods: [CTRL], icon: ../../clipstudio/icons/nextdoc.png, label: "Next canvas" }
  - { key: TAB, mods: [CTRL, SHIFT], icon: ../../clipstudio/icons/prevdoc.png, label: "Previous canvas" }
  - { key: TAB, mods: [], icon: ../../clipstudio/icons/palettes.png, label: "Show / hide all palettes" }
  - { key: TAB, mods: [SHIFT], icon: screenmode.png, label: "Hide title bar / menu bar" }
  - { key: F1, mods: [], icon: ../../clipstudio/icons/tutorials.png, label: "Training and tutorials" }
