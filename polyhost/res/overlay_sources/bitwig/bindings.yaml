# Bitwig Studio shortcut overlays for PolyKybd (Windows, macOS, Linux). See
# SOURCES.md.
#
# Shortcuts: the Bitwig Studio User Guide (version 5.2), which gives each key in
# the text where the function is described. Bitwig publishes no key list of its
# own; the in-app list is Dashboard > Settings > Shortcuts. The guide writes a
# key once when it is the same on every system, and otherwise the Windows/Linux
# key first and the Mac key second:
#   [CTRL] ([CMD] on Mac)  -> CMDCTRL
#   [ALT]                  -> ALT (Option on a Mac)
#   [CTRL]+[T] (no Mac key given) -> literal CTRL on every system
# A few file keys the guide does not name come from two third-party lists
# (SOURCES.md says which).
#
# ⚠️ Caps Lock turns the computer keyboard into a note keyboard, and most keys
# then do nothing. Panel keys act on the panel that has focus.
#
# Regenerate:
#   python polyhost/res/overlay_sources/bitwig/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/bitwig/bindings.yaml --preview /tmp/bitwig_preview
app: bitwig
match: [bitwig studio, bitwigstudio, bitwig-studio, com.bitwig.bitwigstudio]
output: bitwig_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

# No program_icon: ESC is left to the host's program mark (OS icon, then the
# icon catalogs), as for the other proprietary DAWs.

bindings:
  # --- File (third-party lists, see SOURCES.md) ---
  - { key: N, mods: [CMDCTRL], label: New }
  - { key: O, mods: [CMDCTRL], label: Open }
  - { key: S, mods: [CMDCTRL], label: Save }
  - { key: S, mods: [CMDCTRL, SHIFT], label: "Save as" }
  - { key: COMMA, mods: [CMDCTRL], icon: settings.png, label: Settings }

  # --- Edit ---
  - { key: Z, mods: [CMDCTRL], label: Undo }
  - { key: X, mods: [CMDCTRL], label: Cut }
  - { key: C, mods: [CMDCTRL], label: Copy }
  - { key: V, mods: [CMDCTRL], label: Paste }
  - { key: D, mods: [CMDCTRL], icon: duplicate.png, label: Duplicate }
  - { key: A, mods: [CMDCTRL], label: "Select all" }
  - { key: DEL, mods: [], label: Delete }
  - { key: BACKSPACE, mods: [], label: Delete }
  - { key: G, mods: [CMDCTRL], icon: group.png, label: "Group tracks" }
  - { key: G, mods: [CMDCTRL, SHIFT], icon: ungroup.png, label: "Remove group" }
  - { key: E, mods: [CMDCTRL], icon: split.png, label: Split }
  - { key: J, mods: [CMDCTRL], icon: consolidate.png, label: Consolidate }
  - { key: L, mods: [CMDCTRL], icon: loop.png, label: "Loop selection" }
  - { key: B, mods: [CMDCTRL], icon: bounceinplace.png, label: "Bounce in place" }
  - { key: T, mods: [CTRL], icon: seltoggle.png, label: "Object/time selection" }
  - { key: Q, mods: [], icon: quantize.png, label: Quantize }
  - { key: "7", mods: [SHIFT], icon: fadein.png, label: "Fade in to here" }
  - { key: "0", mods: [SHIFT], icon: fadeout.png, label: "Fade out to here" }
  - { key: "8", mods: [SHIFT], icon: trimstart.png, label: "Set object start" }
  - { key: "9", mods: [SHIFT], icon: trimend.png, label: "Set object end" }

  # --- Transport ---
  - { key: SPACE, mods: [], icon: playstop.png, label: "Play/stop" }
  - { key: P, mods: [], icon: playstop.png, label: "Play/stop" }
  - { key: SPACE, mods: [SHIFT], icon: continue.png, label: "Play from playhead" }
  - { key: P, mods: [SHIFT], icon: continue.png, label: "Play from playhead" }
  - { key: SPACE, mods: [ALT], icon: tostart.png, label: "Play from start" }
  - { key: P, mods: [ALT], icon: tostart.png, label: "Play from start" }

  # --- Tools ---
  - { key: "1", mods: [], icon: select.png, label: "Pointer tool" }
  - { key: "2", mods: [], icon: rangetool.png, label: "Time selection tool" }
  - { key: "3", mods: [], icon: draw.png, label: "Pen tool" }
  - { key: "4", mods: [], icon: deltool.png, label: "Eraser tool" }
  - { key: "5", mods: [], icon: slice.png, label: "Knife tool" }

  # --- Beat grid ---
  - { key: COMMA, mods: [], icon: narrowgrid.png, label: "Smaller beat grid" }
  - { key: DOT, mods: [], icon: widegrid.png, label: "Larger beat grid" }
  - { key: COMMA, mods: [ALT], icon: subdivless.png, label: "Previous grid subdivision" }
  - { key: DOT, mods: [ALT], icon: subdivmore.png, label: "Next grid subdivision" }
  - { key: SLASH, mods: [], icon: fixedgrid.png, label: "Adaptive beat grid" }
  - { key: S, mods: [], icon: snap.png, label: "Snap on/off" }

  # --- Panels ---
  - { key: I, mods: [], icon: itemprops.png, label: "Inspector panel" }
  - { key: I, mods: [ALT], icon: itemprops.png, label: "Inspector panel" }
  - { key: E, mods: [], icon: pianoroll.png, label: "Detail editor panel" }
  - { key: E, mods: [ALT], icon: pianoroll.png, label: "Detail editor panel" }
  - { key: A, mods: [], icon: automation.png, label: "Automation editor panel" }
  - { key: D, mods: [], icon: deviceview.png, label: "Device panel" }
  - { key: D, mods: [ALT], icon: deviceview.png, label: "Device panel" }
  - { key: M, mods: [], icon: mixer.png, label: "Mixer panel" }
  - { key: M, mods: [ALT], icon: mixer.png, label: "Mixer panel" }
  - { key: B, mods: [], icon: browser.png, label: Browser }
  - { key: B, mods: [ALT], icon: browser.png, label: Browser }

  # --- Arranger navigation ---
  - { key: LEFT, mods: [], icon: prevclip.png, label: "Previous clip" }
  - { key: RIGHT, mods: [], icon: nextclip.png, label: "Next clip" }
  - { key: UP, mods: [], icon: prevtrack.png, label: "Previous track" }
  - { key: DOWN, mods: [], icon: nexttrack.png, label: "Next track" }
  - { key: UP, mods: [CMDCTRL], icon: extendup.png, label: "First track" }
  - { key: DOWN, mods: [CMDCTRL], icon: extenddown.png, label: "Last track" }
  - { key: LEFT, mods: [ALT], icon: nudgeleft.png, label: "Move by grid, left" }
  - { key: RIGHT, mods: [ALT], icon: nudgeright.png, label: "Move by grid, right" }
  - { key: MINUS, mods: [], label: "Zoom out" }
  - { key: MINUS, mods: [CMDCTRL], label: "Zoom out" }
