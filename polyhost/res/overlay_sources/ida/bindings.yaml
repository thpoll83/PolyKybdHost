# IDA Pro shortcut overlays for PolyKybd. See SOURCES.md.
#
# Keys: the default ("legacy") shortcut profile of IDA 9, from the Hex-Rays
# shortcut reference and cheat sheet, cross-checked against cfg/idagui.cfg of
# IDA 9.0. Each cell draws what the key does in the disassembly view (IDA
# View). Keys that act only in the pseudocode window (/, \, =, Shift+5) are
# drawn as well, because the disassembly view has no action on them; where the
# pseudocode window gives a key another meaning, SOURCES.md lists it.
#
# IDA is a Qt application: a "Ctrl" shortcut is Cmd on macOS, so those
# bindings use `CMDCTRL`, and Alt is Option. idagui.cfg binds a few keys
# differently on macOS (Meta = the Control key): `only:` / `except:` carry
# those. `except: [macos]` also leaves out a chord that macOS takes before IDA
# sees it (Spotlight, the app switcher, Quit).
#
# Keys like ":", "?", "#", "*", "_", "~" and "%" are drawn on the US-layout key
# that types them with Shift.
#
# Regenerate:
#   python polyhost/res/overlay_sources/ida/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/ida/bindings.yaml --preview /tmp/ida_preview
app: ida
match: []
output: ida_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: alpha
threshold: 150

program_icon: ida.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

# A 40x40 composite (glyph + word) is placed 1:1.
_word: &word { region: [40, 40], mode: alpha }

bindings:
  # ---------------- single keys: create, undefine, name ----------------
  - { key: C, icon: disassemble.png, label: "Make code" }
  - { key: D, icon: cycle_int.png, label: "Make data (cycle db/dw/dd)", <<: *word }
  - { key: A, icon: make_str.png, label: "Make string literal", <<: *word }
  - { key: "8", mods: [SHIFT], icon: array.png, label: "Make array (*)" }
  - { key: U, icon: clear.png, label: "Undefine" }
  - { key: N, icon: label.png, label: "Rename" }
  - { key: P, icon: function.png, label: "Create function" }
  - { key: E, icon: func_end.png, label: "Set function end", <<: *word }
  - { key: Y, icon: type_retype.png, label: "Set type", <<: *word }
  - { key: V, icon: rename_reg.png, label: "Rename register", <<: *word }
  - { key: L, icon: align.png, label: "Make alignment", <<: *word }
  - { key: F, icon: flags.png, label: "Show internal flags" }

  # ---------------- single keys: operand representation ----------------
  - { key: Q, icon: op_hex.png, label: "Hexadecimal", <<: *word }
  - { key: H, icon: op_dec.png, label: "Decimal", <<: *word }
  - { key: B, icon: op_bin.png, label: "Binary", <<: *word }
  - { key: R, icon: op_char.png, label: "Character", <<: *word }
  - { key: "3", mods: [SHIFT], icon: op_num.png, label: "Number, default (#)", <<: *word }
  - { key: O, icon: op_offset.png, label: "Offset (data segment)", <<: *word }
  - { key: T, icon: op_structofs.png, label: "Structure offset", <<: *word }
  - { key: K, icon: op_stackvar.png, label: "Stack variable", <<: *word }
  - { key: M, icon: op_enum.png, label: "Enum member", <<: *word }
  - { key: S, icon: op_segment.png, label: "Segment", <<: *word }
  - { key: "-", mods: [SHIFT], icon: op_sign.png, label: "Change sign (_)", <<: *word }
  - { key: "`", mods: [SHIFT], icon: op_not.png, label: "Bitwise negate (~)", <<: *word }
  - { key: "0", icon: op_zeroes.png, label: "Toggle leading zeroes", <<: *word }

  # ---------------- single keys: navigation, comments, views ----------------
  - { key: G, icon: goto.png, label: "Jump to address" }
  - { key: X, icon: references.png, label: "Cross references to operand" }
  - { key: ";", icon: comment_rpt.png, label: "Repeatable comment", <<: *word }
  - { key: ";", mods: [SHIFT], icon: comment.png, label: "Comment (:)" }
  - { key: SPACE, icon: functiongraph.png, label: "Toggle graph / text view" }
  - { key: TAB, icon: pseudo_toggle.png, label: "Jump to pseudocode", <<: *word }
  - { key: INSERT, icon: lines_before.png, label: "Anterior lines", <<: *word, except: [macos] }
  - { key: INSERT, mods: [SHIFT], icon: lines_after.png, label: "Posterior lines", <<: *word, except: [macos] }
  - { key: I, icon: lines_before.png, label: "Anterior lines", <<: *word, only: [macos] }
  - { key: I, mods: [SHIFT], icon: lines_after.png, label: "Posterior lines", <<: *word, only: [macos] }
  - { key: "/", mods: [SHIFT], icon: calculator.png, label: "Calculator (?)" }
  - { key: ".", icon: cli.png, label: "Focus command line" }
  - { key: W, icon: fitwindow.png, label: "Fit window (graph)" }
  - { key: "1", icon: zoom100.png, label: "Zoom 100% (graph)", <<: *word }
  # pseudocode window only
  - { key: "/", icon: comment_pseudo.png, label: "Comment (pseudocode)", <<: *word }
  - { key: "\\", icon: casts.png, label: "Hide casts (pseudocode)", <<: *word }
  - { key: "=", icon: map_var.png, label: "Map variable (pseudocode)", <<: *word }
  - { key: "5", mods: [SHIFT], icon: paren_pair.png, label: "Jump to paired paren (%)", <<: *word }

  # ---------------- function keys ----------------
  - { key: F1, label: "Help" }
  - { key: F2, icon: breakpoint.png, label: "Toggle breakpoint" }
  - { key: F4, icon: run_to_cursor.png, label: "Run to cursor", <<: *word }
  - { key: F5, icon: decompiler.png, label: "Decompile (pseudocode)" }
  - { key: F6, icon: next_window.png, label: "Next window", <<: *word }
  - { key: F6, mods: [SHIFT], icon: prev_window.png, label: "Previous window", <<: *word }
  - { key: F7, icon: stepinto.png, label: "Step into" }
  - { key: F8, icon: stepover.png, label: "Step over" }
