  - { key: F12, mods: [CMDCTRL], icon: lumina_push.png, label: "Lumina: push all metadata", <<: *word }
  - { key: F12, mods: [ALT], icon: lumina_view.png, label: "Lumina: view all metadata", <<: *word }
  # Shift+F-keys: subviews
