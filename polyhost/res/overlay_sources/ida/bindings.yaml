  - { key: F2, mods: [SHIFT], icon: idc_line.png, label: "Script command", <<: *word }
  - { key: F3, mods: [SHIFT], icon: view_funcs.png, label: "Functions", <<: *word }
  - { key: F4, mods: [SHIFT], icon: view_names.png, label: "Names", <<: *word }
  - { key: F5, mods: [SHIFT], icon: view_sigs.png, label: "Signatures", <<: *word }
  - { key: F7, mods: [SHIFT], icon: view_segs.png, label: "Segments", <<: *word }
  - { key: F8, mods: [SHIFT], icon: view_sregs.png, label: "Segment registers", <<: *word }
  - { key: F11, mods: [SHIFT], icon: view_tils.png, label: "Type libraries", <<: *word }
  - { key: F12, mods: [SHIFT], icon: view_strings.png, label: "Strings", <<: *word }
  # Ctrl+F-keys
  - { key: F2, mods: [CMDCTRL], icon: terminate.png, label: "Terminate process" }
  - { key: F2, mods: [CMDCTRL, SHIFT], icon: bp_find.png, label: "Find breakpoint", <<: *word }
