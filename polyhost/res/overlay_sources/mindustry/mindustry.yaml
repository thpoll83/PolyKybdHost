# Mindustry overlay for PolyKybd.
#
# Keys: the default bindings in core/src/mindustry/input/Binding.java of
# Anuken/Mindustry, tag v160.7. See SOURCES.md.
#
# Left Shift held is command mode (the default setting "hold for command
# mode"): there the digits select a control group, and with Left Ctrl held as
# well they create one. So the Shift and Ctrl+Shift layers show the groups, and
# the plain layer shows block selection.
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/mindustry/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/mindustry/mindustry.yaml --preview /tmp/mindustry_preview
app: mindustry
match: [mindustry, com.github.anuken.mindustry]
output: mindustry_template
icon_dir: icons
fit: contain
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150
# As for the other game sets: the icon uses the full height on the right; the
# firmware clears 3 px around it, so a letter legend stays whole.
anchor: right
region: [40, 40]
margin: 0

# The game's window icon at 40 x 40, at the right edge beside the ESC legend.
program_icon: program.png
program_icon_mode: alpha
program_icon_region: [40, 40]
program_icon_anchor: right
program_icon_margin: 0

bindings:

  # Movement (move_x, move_y), also while Left Shift is held
  - { key: W, icon: forward.png, label: "Move up" }
  - { key: A, icon: left.png, label: "Move left" }
  - { key: S, icon: back.png, label: "Move down" }
  - { key: D, icon: right.png, label: "Move right" }
  - { key: W, mods: [SHIFT], icon: forward.png, label: "Move up" }
  - { key: A, mods: [SHIFT], icon: left.png, label: "Move left" }
  - { key: S, mods: [SHIFT], icon: back.png, label: "Move down" }
  - { key: D, mods: [SHIFT], icon: right.png, label: "Move right" }

  # The player's unit
  - { key: KC_LEFT_SHIFT, icon: command.png, label: "Command mode (hold)", region: [34, 40] }
  - { key: KC_LEFT_SHIFT, mods: [SHIFT], icon: command.png, label: "Command mode (hold)", region: [34, 40] }
  - { key: KC_LEFT_CTRL, icon: control.png, label: "Control a unit (with a click)", region: [34, 40] }
  - { key: V, icon: respawn.png, label: "Respawn" }
  - { key: LBRACKET, icon: pickup.png, label: "Pick up cargo" }
  - { key: RBRACKET, icon: dropcargo.png, label: "Drop cargo" }

  # Building
  - { key: Q, icon: clearbuilding.png, label: "Clear building plans" }
  - { key: E, icon: pausebuilding.png, label: "Pause / resume building" }
  - { key: R, icon: rotate.png, label: "Rotate block (hold, with the wheel)" }
  - { key: B, icon: rebuild.png, label: "Rebuild region" }
  - { key: F, icon: schematic.png, label: "Select region as schematic" }
  - { key: Z, icon: flipx.png, label: "Flip schematic X" }
  - { key: X, icon: flipy.png, label: "Flip schematic Y" }
  - { key: T, icon: schematics.png, label: "Schematics menu" }
  - { key: COMMA, icon: categoryprev.png, label: "Previous block category" }
  - { key: DOT, icon: categorynext.png, label: "Next block category" }
  - { key: F1, icon: blockinfo.png, label: "Block info", region: [34, 40] }

  # Block selection 1 to 10 (block_select_01 .. block_select_10)
  - { key: "1", icon: block1.png, label: "Select block 1" }
  - { key: "2", icon: block2.png, label: "Select block 2" }
  - { key: "3", icon: block3.png, label: "Select block 3" }
  - { key: "4", icon: block4.png, label: "Select block 4" }
  - { key: "5", icon: block5.png, label: "Select block 5" }
  - { key: "6", icon: block6.png, label: "Select block 6" }
  - { key: "7", icon: block7.png, label: "Select block 7" }
  - { key: "8", icon: block8.png, label: "Select block 8" }
  - { key: "9", icon: block9.png, label: "Select block 9" }
  - { key: "0", icon: block10.png, label: "Select block 10" }

  # Command mode (Left Shift held): control groups; with Left Ctrl, create one
  - { key: "1", mods: [SHIFT], icon: group1.png, label: "Control group 1" }
  - { key: "2", mods: [SHIFT], icon: group2.png, label: "Control group 2" }
  - { key: "3", mods: [SHIFT], icon: group3.png, label: "Control group 3" }
  - { key: "4", mods: [SHIFT], icon: group4.png, label: "Control group 4" }
  - { key: "5", mods: [SHIFT], icon: group5.png, label: "Control group 5" }
  - { key: "6", mods: [SHIFT], icon: group6.png, label: "Control group 6" }
  - { key: "7", mods: [SHIFT], icon: group7.png, label: "Control group 7" }
  - { key: "8", mods: [SHIFT], icon: group8.png, label: "Control group 8" }
  - { key: "9", mods: [SHIFT], icon: group9.png, label: "Control group 9" }
  - { key: "0", mods: [SHIFT], icon: group10.png, label: "Control group 10" }
  - { key: "1", mods: [CTRL, SHIFT], icon: newgroup1.png, label: "Create control group 1" }
  - { key: "2", mods: [CTRL, SHIFT], icon: newgroup2.png, label: "Create control group 2" }
  - { key: "3", mods: [CTRL, SHIFT], icon: newgroup3.png, label: "Create control group 3" }
  - { key: "4", mods: [CTRL, SHIFT], icon: newgroup4.png, label: "Create control group 4" }
  - { key: "5", mods: [CTRL, SHIFT], icon: newgroup5.png, label: "Create control group 5" }
  - { key: "6", mods: [CTRL, SHIFT], icon: newgroup6.png, label: "Create control group 6" }
  - { key: "7", mods: [CTRL, SHIFT], icon: newgroup7.png, label: "Create control group 7" }
  - { key: "8", mods: [CTRL, SHIFT], icon: newgroup8.png, label: "Create control group 8" }
  - { key: "9", mods: [CTRL, SHIFT], icon: newgroup9.png, label: "Create control group 9" }
  - { key: "0", mods: [CTRL, SHIFT], icon: newgroup10.png, label: "Create control group 10" }

  # Units: G and H act in command mode
  - { key: G, icon: allunits.png, label: "Select all units" }
  - { key: H, icon: factories.png, label: "Select all unit factories" }
  - { key: G, mods: [SHIFT], icon: allunits.png, label: "Select all units" }
  - { key: H, mods: [SHIFT], icon: factories.png, label: "Select all unit factories" }
  - { key: P, icon: ping.png, label: "Ping the map" }

  # View and game
  - { key: SPACE, icon: pause.png, label: "Pause" }
  - { key: M, icon: minimap.png, label: "Minimap" }
  - { key: J, icon: research.png, label: "Research (campaign)" }
  - { key: N, icon: planetmap.png, label: "Planet map (campaign)" }
  - { key: C, icon: togglemenus.png, label: "Menus on / off" }
  - { key: F5, icon: powerlines.png, label: "Power lines on / off", region: [34, 40] }
  - { key: F6, icon: blockstatus.png, label: "Block status on / off", region: [34, 40] }
  - { key: F11, icon: fullscreen.png, label: "Toggle fullscreen" }
  - { key: F12, icon: screenshot.png, label: "Take screenshot" }

  # Multiplayer
  - { key: TAB, icon: playerlist.png, label: "Player list" }
  - { key: ENTER, icon: chat.png, label: "Open chat" }
  - { key: F8, icon: console.png, label: "Console", region: [34, 40] }
