# GENERATED by gen_variants.py from freeciv.yaml -- edit those files, not this one.
# Freeciv 3.2 SDL2 and SDL3 clients (freeciv-sdl2, freeciv-sdl3): the GTK
# unit orders and reports, without the keys the SDL clients bind otherwise.
# Keys and sources: SOURCES.md.
app: freeciv_sdl
match: [freeciv-sdl2, freeciv-sdl3, freeciv-sdl2.exe, freeciv-sdl3.exe, org.freeciv.sdl2, org.freeciv.sdl3]
output: freeciv_sdl_template
icon_dir: icons
fit: contain
mode: alpha
threshold: 150
anchor: right
region: [40, 40]
margin: 0
program_icon: program_freeciv.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0
program_icon_legend: false

