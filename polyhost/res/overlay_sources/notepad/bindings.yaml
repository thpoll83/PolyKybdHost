# Windows Notepad shortcut overlays for PolyKybd.
#
# ⚠️ Notepad is CLOSED SOURCE, so unlike Windows Terminal there is no
# `defaults.json` to read. Every binding here is one that TWO independent
# references agree on; anything a single reference claims is recorded in
# SOURCES.md as unverified rather than guessed at -- a wrong icon is worse than
# no icon, because the user believes it.
#
# Icons: Microsoft Fluent UI System Icons (MIT), reusing the SAME glyph as the
# notepadpp overlay wherever the action is the same, so the two editors read
# alike. Program mark (ESC, all layers): a drawn lined page -- the real product
# icon is Microsoft trademark art.
#
# Regenerate:
#   python polyhost/res/overlay_sources/notepad/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/notepad/bindings.yaml --preview /tmp/notepad_preview
app: notepad
match: [notepad]
output: notepad_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

# ⚠️ NO `program_icon:` HERE, DELIBERATELY -- the ESC mark comes from the
# CURATED GENERIC in `polyhost/res/app_icons.yaml` (mdi:note-text) instead of a
# baked cell. Both exist and the baked one WINS: `send_overlays_mru` defers a
# synthetic source on any (modifier, keycode) a template already drew, so a
# `program_icon:` here would mean the generic is never uploaded.
#
# The generic reads better at 40x40 than the letter tile it replaced, and it is
# also 8 px wider -- the auto-fetch path fixes the mark at the right-hand 40x40
# square, while a baked one here was 42x34.
#
# ⚠️ The trade, stated because it is invisible from this file: a baked mark
# ALWAYS draws, a fetched one needs `shortcut_icon_auto_fetch` (default on) and
# one successful download. Offline with a cold cache, ESC stays blank.

bindings:
  # --- Ctrl: file (primary R channel) -----------------------------------
  - { key: N, mods: [CTRL], icon: new.png,      label: New,        source: "ms-fluent/Document Add (MIT)" }
  - { key: O, mods: [CTRL], icon: open.png,     label: Open,       source: "ms-fluent/Folder Open (MIT)" }
  - { key: S, mods: [CTRL], icon: save.png,     label: Save,       source: "ms-fluent/Save (MIT)" }
  - { key: P, mods: [CTRL], icon: print.png,    label: Print,      source: "ms-fluent/Print (MIT)" }
  - { key: W, mods: [CTRL], icon: closetab.png, label: "Close tab", source: "ms-fluent/Document Dismiss (MIT)" }

  # --- Ctrl: edit -------------------------------------------------------
  - { key: Z, mods: [CTRL], icon: undo.png,      label: Undo,       source: "ms-fluent/Arrow Undo (MIT)" }
  - { key: Y, mods: [CTRL], icon: redo.png,      label: Redo,       source: "ms-fluent/Arrow Redo (MIT)" }
  - { key: X, mods: [CTRL], icon: cut.png,       label: Cut,        source: "ms-fluent/Cut (MIT)" }
  - { key: C, mods: [CTRL], icon: copy.png,      label: Copy,       source: "ms-fluent/Copy (MIT)" }
  - { key: V, mods: [CTRL], icon: paste.png,     label: Paste,      source: "ms-fluent/Clipboard Paste (MIT)" }
  - { key: A, mods: [CTRL], icon: selectall.png, label: "Select all", source: "ms-fluent/Select All On (MIT)" }

  # --- Ctrl: search -----------------------------------------------------
  - { key: F, mods: [CTRL], icon: find.png,    label: Find,         source: "ms-fluent/Search (MIT)" }
  - { key: H, mods: [CTRL], icon: replace.png, label: Replace,      source: "ms-fluent/Arrow Swap (MIT)" }
  - { key: G, mods: [CTRL], icon: goto.png,    label: "Go to line", source: "ms-fluent/Text Position Line (MIT)" }

  # --- Ctrl: view & navigation ------------------------------------------
  - { key: EQUAL, mods: [CTRL], icon: zoomin.png,    label: "Zoom in",    source: "ms-fluent/Zoom In (MIT)" }
  - { key: MINUS, mods: [CTRL], icon: zoomout.png,   label: "Zoom out",   source: "ms-fluent/Zoom Out (MIT)" }
  - { key: "0",   mods: [CTRL], icon: zoomreset.png, label: "Reset zoom", source: "ms-fluent/Zoom Fit (MIT)" }
  - { key: HOME,  mods: [CTRL], icon: doctop.png,    label: "Top of document",    source: "ms-fluent/Arrow Upload (MIT)" }
  - { key: END,   mods: [CTRL], icon: docend.png,    label: "End of document",    source: "ms-fluent/Arrow Download (MIT)" }
  - { key: LEFT,  mods: [CTRL], icon: wordleft.png,  label: "Word left",  source: "ms-fluent/Arrow Previous (MIT)" }
  - { key: RIGHT, mods: [CTRL], icon: wordright.png, label: "Word right", source: "ms-fluent/Arrow Next (MIT)" }
  - { key: TAB,   mods: [CTRL], icon: nexttab.png,   label: "Next tab",   source: "ms-fluent/Arrow Right (MIT)" }

  # --- no modifier (primary A channel) ----------------------------------
  - { key: F3, mods: [], icon: findnext.png, label: "Find next",           source: "ms-fluent/Chevron Right (MIT)" }
  - { key: F5, mods: [], icon: datetime.png, label: "Insert date & time",  source: "ms-fluent/Calendar Clock (MIT)" }

  # --- Shift (primary B channel) ----------------------------------------
  - { key: F3, mods: [SHIFT], icon: findprev.png, label: "Find previous", source: "ms-fluent/Chevron Left (MIT)" }

  # --- Ctrl+Shift (combo R channel) -------------------------------------
  - { key: S, mods: [CTRL, SHIFT], icon: saveas.png,    label: "Save as",           source: "ms-fluent/Save Edit (MIT)" }
  - { key: N, mods: [CTRL, SHIFT], icon: newwindow.png, label: "New window",        source: "ms-fluent/Window New (MIT)" }
  - { key: T, mods: [CTRL, SHIFT], icon: reopentab.png, label: "Reopen closed tab", source: "ms-fluent/Arrow Hook Up Left (MIT)" }
  - { key: TAB, mods: [CTRL, SHIFT], icon: prevtab.png, label: "Previous tab",      source: "ms-fluent/Arrow Left (MIT)" }
