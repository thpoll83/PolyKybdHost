  - { key: "8", mods: [CTRL, SHIFT], only: [linux_kde], icon: viewbreakpoints.png, <<: *reclaimed, label: "View breakpoints", source: reclaimed }
  - { key: L,   mods: [ALT, SHIFT],  only: [linux_kde], icon: reformat.png,        <<: *reclaimed, label: "Reformat code",    source: reclaimed }
  - { key: "0", mods: [CTRL],        only: [linux_kde], icon: win_structure.png,     label: "File structure" }
  - { key: V,   mods: [ALT, SHIFT],  only: [linux_kde], icon: introducevariable.png, label: "Introduce variable" }
  - { key: "8", mods: [CTRL],        only: [linux_kde], icon: breakpoint.png, <<: *reclaimed, label: "Toggle breakpoint", source: "reclaimed (VS Code breakpoint, shared)" }
  - { key: "9", mods: [CTRL],        only: [linux_kde], icon: build.png,             label: "Build project" }
  - { key: "5", mods: [CTRL],        only: [linux_kde], icon: rerun.png,             label: "Rerun" }
  - { key: "4", mods: [CTRL],        only: [linux_kde], icon: closetab.png,          label: "Close tab" }
