# JetBrains IDEs, Project tool window focused (the plugin reports
# `jetbrains://project`). In the Project view the keys act on the selected
# files and folders: F5 copies a file, F6 moves it, Ctrl+D compares two files.
#
# Every chord resolved from the keymap XML in JetBrains/intellij-community
# (platform/platform-resources/src/keymaps/), parent chain applied. Only Show in
# Explorer/Finder differs between Windows and the Linux keymaps (Ctrl+Alt+F12 in
# $default, Ctrl+Alt+Shift+2 in XWin, GNOME and KDE), and Close tab is not drawn,
# so GNOME and KDE render exactly as the plain Linux set. See SOURCES.md.
#
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/jetbrains/bindings_project.yaml --preview /tmp/jb_project
app: jetbrains
match: [idea64, pycharm64]
output: jetbrains_project_template
output_macos: jetbrains_project_mac_template
output_linux: jetbrains_project_linux_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: auto
threshold: 150

_reclaimed: &reclaimed { region: [72, 40], anchor: center }

bindings:
  # -- file operations (NewElement, RenameElement, CopyElement, Move, $Delete, SafeDelete) --
  - { key: INSERT, mods: [ALT], only: [windows, linux], icon: generate.png, label: "New file or folder" }
  - { key: N,      mods: [GUI], only: [macos],          icon: generate.png, label: "New file or folder" }
  - { key: F6,     mods: [SHIFT], icon: rename.png, <<: *reclaimed, label: Rename, source: reclaimed }
  - { key: F5,     mods: [],      icon: copyfile.png, label: "Copy file" }
  - { key: F6,     mods: [],      icon: movefile.png, label: "Move file" }
  - { key: DELETE, mods: [],      icon: deletefile.png, label: Delete }
  - { key: DELETE, mods: [ALT], only: [windows, linux], icon: safedelete.png, label: "Safe delete" }
  - { key: DELETE, mods: [GUI], only: [macos],          icon: safedelete.png, label: "Safe delete" }
  # -- open / compare (EditSource, OpenInRightSplit, CompareTwoFiles) --
  - { key: F4,    mods: [],        icon: editsource.png, label: "Jump to source" }
  - { key: ENTER, mods: [SHIFT],   icon: opensplit.png,  label: "Open in right split" }
  - { key: D,     mods: [CMDCTRL], icon: compare.png,    label: "Compare files" }
  # -- tree (CollapseAll, ExpandAll) --
  - { key: "-", mods: [CMDCTRL], icon: collapseall.png, label: "Collapse all" }
  - { key: "=", mods: [CMDCTRL], icon: expandall.png,   label: "Expand all" }
  # -- paths (CopyPaths, CopyReference, ShowFilePath) --
  - { key: C, mods: [CMDCTRL, SHIFT],      icon: copypath.png, label: "Copy path" }
  - { key: C, mods: [CMDCTRL, ALT, SHIFT], icon: copyreference.png, <<: *reclaimed, label: "Copy reference", source: reclaimed }
  - { key: F12, mods: [CTRL, ALT],        only: [windows], icon: revealin.png, label: "Show in Explorer" }
  - { key: F12, mods: [GUI, ALT],         only: [macos],   icon: revealin.png, label: "Show in Finder" }
  - { key: "2", mods: [CTRL, ALT, SHIFT], only: [linux],   icon: revealin.png, label: "Show in file manager" }
  # -- search in the selected folder (FindInPath, ReplaceInPath) --
  - { key: F, mods: [CMDCTRL, SHIFT], icon: findinpath.png, <<: *reclaimed, label: "Find in files", source: reclaimed }
  - { key: R, mods: [CMDCTRL, SHIFT], icon: replaceinpath.png, label: "Replace in files" }
  # -- the window itself (HideActiveWindow, ActivateProjectToolWindow, JumpToLastWindow) --
  - { key: ESCAPE, mods: [SHIFT], icon: hidewindow.png, label: "Hide window" }
  - { key: "1", mods: [ALT], only: [windows, linux], icon: win_project.png, label: "Project window" }
  - { key: "1", mods: [GUI], only: [macos],          icon: win_project.png, label: "Project window" }
  - { key: F12, mods: [ALT], icon: terminal.png, label: "Terminal window" }
  # -- navigation that still applies --
  - { key: N, mods: [CTRL, SHIFT], only: [windows, linux], icon: gotofile.png, <<: *reclaimed, label: "Go to file", source: reclaimed }
  - { key: O, mods: [GUI, SHIFT],  only: [macos],          icon: gotofile.png, <<: *reclaimed, label: "Go to file", source: reclaimed }
  - { key: E, mods: [CMDCTRL],        icon: recentfiles.png, label: "Recent files" }
  - { key: A, mods: [CMDCTRL, SHIFT], icon: findaction.png,  label: "Find action" }
  - { key: Y, mods: [CMDCTRL, ALT],   icon: synchronize.png, <<: *reclaimed, label: Synchronize, source: reclaimed }
  # -- clipboard on files: drawn by the shared concept renderer --
  - { key: C, mods: [CMDCTRL], label: Copy }
  - { key: X, mods: [CMDCTRL], label: Cut }
  - { key: V, mods: [CMDCTRL], label: Paste }
  - { key: Z, mods: [CMDCTRL], label: Undo }
