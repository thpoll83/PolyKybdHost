# Binary Ninja shortcut overlays for PolyKybd. See SOURCES.md.
#
# Keys: the default key bindings ("Binary Ninja Defaults" preset) from the user
# guide in the binaryninja-api repository (docs/guide/index.md, "Default
# Hotkeys", "Cross-Reference Hotkeys", "Tags/Bookmarks", "Command Palette",
# docs/guide/types/type.md) and the debugger's registered actions in the
# Vector35/debugger source (ui/ui.cpp). Each cell draws what the key does in
# the disassembly, IL and pseudo C views.
#
# Binary Ninja is a Qt application: a "Ctrl" binding is Cmd on macOS, so those
# bindings use `CMDCTRL`, and Alt is Option. The guide gives one key that
# differs by OS (the wchar32_t string); `only:` / `except:` carry it.
#
# Keys like "+", "*" and "~" are drawn on the US-layout key that types them
# with Shift.
#
# Regenerate:
#   python polyhost/res/overlay_sources/binaryninja/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/binaryninja/bindings.yaml --preview /tmp/binja_preview
app: binaryninja
match: []
output: binaryninja_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: alpha
threshold: 150

program_icon: binaryninja.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

# A 40x40 composite (glyph + word) is placed 1:1.
_word: &word { region: [40, 40], mode: alpha }

bindings:
  # ---------------- single keys: views and navigation ----------------
  - { key: G, icon: goto.png, label: "Go to address" }
  - { key: X, icon: references.png, label: "Cross references" }
  - { key: H, icon: hexview.png, label: "Hex view", <<: *word }
  - { key: T, icon: view_types.png, label: "Type view", <<: *word }
  - { key: I, icon: il_cycle.png, label: "Cycle disassembly / LLIL / MLIL / HLIL", <<: *word }
  - { key: SPACE, icon: functiongraph.png, label: "Toggle linear / graph view" }
  - { key: TAB, icon: pseudo_toggle.png, label: "Toggle pseudo C / disassembly", <<: *word }
  - { key: F5, icon: pseudo_toggle.png, label: "Toggle pseudo C / disassembly", <<: *word }

  # ---------------- single keys: functions, names, comments ----------------
  - { key: P, icon: function.png, label: "Create function" }
  - { key: C, icon: disassemble.png, label: "Make code" }
  - { key: U, icon: clear.png, label: "Undefine" }
  - { key: N, icon: label.png, label: "Name a symbol" }
  - { key: ";", icon: comment.png, label: "Comment" }
  - { key: E, icon: patch_ins.png, label: "Edit instruction", <<: *word }

  # ---------------- single keys: types and data ----------------
  - { key: Y, icon: type_retype.png, label: "Change type", <<: *word }
  - { key: Q, icon: propagate.png, label: "Forward propagate type", <<: *word }
  - { key: A, icon: make_str.png, label: "ASCII string", <<: *word }
  - { key: A, mods: [SHIFT], icon: make_wstr.png, label: "wchar_t string", <<: *word }
  - { key: A, mods: [CMDCTRL, SHIFT], icon: make_w32.png, label: "wchar32_t string", except: [macos], <<: *word }
  - { key: A, mods: [ALT, SHIFT], icon: make_w32.png, label: "wchar32_t string", only: [macos], <<: *word }
  - { key: "1", icon: int8.png, label: "8-bit integer", <<: *word }
  - { key: "2", icon: int16.png, label: "16-bit integer", <<: *word }
  - { key: "4", icon: int32.png, label: "32-bit integer", <<: *word }
  - { key: "8", icon: int64.png, label: "64-bit integer", <<: *word }
  - { key: D, icon: cycle_int.png, label: "Cycle integer width", <<: *word }
  - { key: F, icon: float_cycle.png, label: "Cycle float precision", <<: *word }
  - { key: R, icon: op_char.png, label: "Character", <<: *word }
  - { key: O, icon: pointer.png, label: "Pointer", <<: *word }
  - { key: "8", mods: [SHIFT], icon: array.png, label: "Create array (*)" }
  - { key: S, icon: structure.png, label: "Create structure" }
  - { key: M, icon: op_enum.png, label: "Enum", <<: *word }
  - { key: "-", icon: op_sign.png, label: "Toggle signed / unsigned", <<: *word }
  - { key: "0", icon: toggle_hexdec.png, label: "Toggle hex / decimal", <<: *word }
  - { key: "`", mods: [SHIFT], icon: op_not.png, label: "Toggle bitwise complement (~)", <<: *word }
  - { key: "=", mods: [SHIFT], icon: merge_here.png, label: "Merge variables here (+)", <<: *word }
  - { key: "=", icon: merge_dialog.png, label: "Merge / split variables", <<: *word }

  # ---------------- navigation with modifiers ----------------
  - { key: "[", mods: [CMDCTRL], icon: back.png, label: "Navigate backward" }
  - { key: "]", mods: [CMDCTRL], icon: forward.png, label: "Navigate forward" }
  - { key: X, mods: [ALT], icon: xref_next.png, label: "Next cross reference", <<: *word }
  - { key: X, mods: [ALT, SHIFT], icon: xref_prev.png, label: "Previous cross reference", <<: *word }
  - { key: "=", mods: [CMDCTRL, SHIFT], icon: zoomin.png, label: "Zoom in (graph)" }
  - { key: "-", mods: [CMDCTRL, SHIFT], icon: zoomout.png, label: "Zoom out (graph)" }

  # ---------------- Ctrl (Cmd on macOS) ----------------
  - { key: O, mods: [CMDCTRL], label: "Open" }
  - { key: O, mods: [CMDCTRL, SHIFT], icon: open_options.png, label: "Open with options", <<: *word }
  - { key: L, mods: [CMDCTRL], icon: openurl.png, label: "Open URL" }
  - { key: S, mods: [CMDCTRL], label: "Save" }
  - { key: Z, mods: [CMDCTRL], label: "Undo" }
  - { key: Z, mods: [CMDCTRL, SHIFT], label: "Redo" }
  - { key: F, mods: [CMDCTRL], label: "Find" }
  - { key: A, mods: [CMDCTRL], label: "Select all" }
  - { key: P, mods: [CMDCTRL], icon: actionchooser.png, label: "Command palette" }
  - { key: P, mods: [CMDCTRL, SHIFT], icon: palette_all.png, label: "Command palette, all", <<: *word }
  - { key: B, mods: [CMDCTRL, SHIFT], icon: keybinding.png, label: "Keybindings" }
  - { key: M, mods: [CMDCTRL, SHIFT], icon: plugins.png, label: "Extension manager" }
  - { key: ",", mods: [CMDCTRL], icon: settings.png, label: "Settings" }
  - { key: ".", mods: [CMDCTRL], icon: settings_file.png, label: "Settings for this file", <<: *word }
  # bookmarks: Ctrl+1..0 go to, Ctrl+Alt+1..0 set (0 is bookmark 10)
  - { key: "1", mods: [CMDCTRL], icon: bookmark_go_1.png, label: "Go to bookmark 1", <<: *word }
  - { key: "2", mods: [CMDCTRL], icon: bookmark_go_2.png, label: "Go to bookmark 2", <<: *word }
  - { key: "3", mods: [CMDCTRL], icon: bookmark_go_3.png, label: "Go to bookmark 3", <<: *word }
  - { key: "4", mods: [CMDCTRL], icon: bookmark_go_4.png, label: "Go to bookmark 4", <<: *word }
  - { key: "5", mods: [CMDCTRL], icon: bookmark_go_5.png, label: "Go to bookmark 5", <<: *word }
  - { key: "6", mods: [CMDCTRL], icon: bookmark_go_6.png, label: "Go to bookmark 6", <<: *word }
  - { key: "7", mods: [CMDCTRL], icon: bookmark_go_7.png, label: "Go to bookmark 7", <<: *word }
  - { key: "8", mods: [CMDCTRL], icon: bookmark_go_8.png, label: "Go to bookmark 8", <<: *word }
  - { key: "9", mods: [CMDCTRL], icon: bookmark_go_9.png, label: "Go to bookmark 9", <<: *word }
  - { key: "0", mods: [CMDCTRL], icon: bookmark_go_10.png, label: "Go to bookmark 10", <<: *word }
  - { key: "1", mods: [CMDCTRL, ALT], icon: bookmark_set_1.png, label: "Set bookmark 1", <<: *word }
  - { key: "2", mods: [CMDCTRL, ALT], icon: bookmark_set_2.png, label: "Set bookmark 2", <<: *word }
  - { key: "3", mods: [CMDCTRL, ALT], icon: bookmark_set_3.png, label: "Set bookmark 3", <<: *word }
  - { key: "4", mods: [CMDCTRL, ALT], icon: bookmark_set_4.png, label: "Set bookmark 4", <<: *word }
  - { key: "5", mods: [CMDCTRL, ALT], icon: bookmark_set_5.png, label: "Set bookmark 5", <<: *word }
  - { key: "6", mods: [CMDCTRL, ALT], icon: bookmark_set_6.png, label: "Set bookmark 6", <<: *word }
  - { key: "7", mods: [CMDCTRL, ALT], icon: bookmark_set_7.png, label: "Set bookmark 7", <<: *word }
  - { key: "8", mods: [CMDCTRL, ALT], icon: bookmark_set_8.png, label: "Set bookmark 8", <<: *word }
  - { key: "9", mods: [CMDCTRL, ALT], icon: bookmark_set_9.png, label: "Set bookmark 9", <<: *word }
  - { key: "0", mods: [CMDCTRL, ALT], icon: bookmark_set_10.png, label: "Set bookmark 10", <<: *word }

  # ---------------- debugger (Vector35/debugger, ui/ui.cpp) ----------------
  - { key: F2, icon: breakpoint.png, label: "Toggle breakpoint" }
  - { key: F3, icon: hw_breakpoint.png, label: "Add hardware breakpoint", <<: *word }
  - { key: F4, icon: run_to_cursor.png, label: "Run to here", <<: *word }
  - { key: F6, icon: run.png, label: "Launch" }
  - { key: F7, icon: stepinto.png, label: "Step into" }
  - { key: F8, icon: stepover.png, label: "Step over" }
  - { key: F9, icon: resume.png, label: "Resume", <<: *word }
  - { key: F9, mods: [CMDCTRL], icon: stepout.png, label: "Step return" }
  - { key: F12, icon: pause.png, label: "Pause" }
  # time-travel debugging (TTD) only
  - { key: F4, mods: [SHIFT], icon: run_back_here.png, label: "Run back to here (TTD)", <<: *word }
  - { key: F7, mods: [SHIFT], icon: stepinto_back.png, label: "Step into backwards (TTD)", <<: *word }
  - { key: F8, mods: [SHIFT], icon: stepover_back.png, label: "Step over backwards (TTD)", <<: *word }
  - { key: F9, mods: [SHIFT], icon: rewind.png, label: "Go backwards (TTD)" }
  - { key: F9, mods: [CMDCTRL, SHIFT], icon: stepout_back.png, label: "Step return backwards (TTD)", <<: *word }
  - { key: G, mods: [SHIFT], icon: ttd_time.png, label: "Go to TTD timestamp", <<: *word }
