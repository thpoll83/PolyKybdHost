# Postman shortcut overlays for PolyKybd (Windows, Linux and macOS). See SOURCES.md.
#
# The keys are Postman's own default shortcut table and menu accelerators, read
# from the 12.33.3 Linux build (Postman's docs page no longer lists them).
# `CMDCTRL` is Ctrl on Windows/Linux and Cmd on macOS, as in the app's
# `mod+` and `CmdOrCtrl+` keys; a key macOS moves is written twice under
# `except: [macos]` and `only: [macos]`. Users can change keys in Settings ->
# Shortcuts; the set shows the defaults.
#
# Regenerate:
#   python polyhost/res/overlay_sources/postman/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/postman/bindings.yaml --preview /tmp/postman_preview
app: postman
match: [postman]
output: postman_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: postman.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  - { key: T, mods: [CMDCTRL], icon: newtab.png, label: "New tab" }
  - { key: W, mods: [CMDCTRL], icon: closetab.png, label: "Close tab" }
  - { key: W, mods: [CMDCTRL, ALT], icon: forceclosetab.png, label: "Force close tab" }
  - { key: TAB, mods: [CTRL], icon: nexttab.png, label: "Next tab", except: [macos] }
  - { key: RBRACKET, mods: [GUI, SHIFT], icon: nexttab.png, label: "Next tab", only: [macos] }
  - { key: TAB, mods: [CTRL, SHIFT], icon: prevtab.png, label: "Previous tab", except: [macos] }
  - { key: LBRACKET, mods: [GUI, SHIFT], icon: prevtab.png, label: "Previous tab", only: [macos] }
  - { key: "9", mods: [CMDCTRL], icon: lasttab.png, label: "Last tab" }
  - { key: T, mods: [CMDCTRL, SHIFT], icon: reopentab.png, label: "Reopen closed tab" }
  - { key: L, mods: [CMDCTRL], icon: url.png, label: "Request URL" }
  - { key: S, mods: [CMDCTRL], label: "Save" }
  - { key: S, mods: [CMDCTRL, SHIFT], icon: saveas.png, label: "Save as" }
  - { key: ENTER, mods: [CMDCTRL], icon: send.png, label: "Send request" }
  - { key: ENTER, mods: [CMDCTRL, ALT], icon: senddownload.png, label: "Send and download" }
  - { key: UP, mods: [CMDCTRL, ALT], icon: torequest.png, label: "Scroll to request" }
  - { key: DOWN, mods: [CMDCTRL, ALT], icon: toresponse.png, label: "Scroll to response" }
  - { key: F, mods: [CMDCTRL], label: "Find" }
  - { key: F, mods: [CMDCTRL, SHIFT], icon: findreplace.png, label: "Find and replace" }
  - { key: K, mods: [CMDCTRL], icon: universalsearch.png, label: "Search Postman" }
  - { key: BACKSLASH, mods: [CMDCTRL], icon: sidebar.png, label: "Sidebar" }
  - { key: BACKSLASH, mods: [CMDCTRL, ALT], icon: rightsidebar.png, label: "Right sidebar" }
  - { key: S, mods: [CMDCTRL, ALT], icon: swapsidebars.png, label: "Swap sidebars" }
  - { key: V, mods: [CMDCTRL, ALT], icon: twopane.png, label: "Two-pane view" }
  - { key: M, mods: [CMDCTRL, ALT], icon: workbench.png, label: "Workbench" }
  - { key: R, mods: [CMDCTRL, ALT], icon: resetlayout.png, label: "Reset layout" }
  - { key: C, mods: [CMDCTRL, ALT], icon: console.png, label: "Console" }
  - { key: K, mods: [CMDCTRL, SHIFT], icon: clearconsole.png, label: "Clear console" }
  - { key: TAB, mods: [CTRL, ALT], icon: switchpane.png, label: "Switch pane", except: [macos] }
  - { key: TAB, mods: [GUI, ALT], icon: switchpane.png, label: "Switch pane", only: [macos] }
  - { key: E, mods: [CMDCTRL], icon: rename.png, label: "Rename item" }
  - { key: G, mods: [CMDCTRL], icon: group.png, label: "Group items" }
  - { key: UP, mods: [CMDCTRL, SHIFT], icon: moveup.png, label: "Move item up" }
  - { key: DOWN, mods: [CMDCTRL, SHIFT], icon: movedown.png, label: "Move item down" }
  - { key: D, mods: [CMDCTRL], icon: duplicate.png, label: "Duplicate" }
  - { key: N, mods: [CMDCTRL], label: "New" }
  - { key: N, mods: [CMDCTRL, SHIFT], icon: newwindow.png, label: "New window" }
  - { key: R, mods: [CMDCTRL, SHIFT], icon: runner.png, label: "New runner tab" }
  - { key: W, mods: [CMDCTRL, SHIFT], icon: closewindow.png, label: "Close window" }
  - { key: O, mods: [CMDCTRL], icon: import.png, label: "Import" }
  - { key: COMMA, mods: [CMDCTRL], label: "Settings" }
  - { key: SLASH, mods: [CMDCTRL], icon: shortcuts.png, label: "Keyboard shortcuts" }
  - { key: EQUAL, mods: [CMDCTRL], label: "Zoom in" }
  - { key: MINUS, mods: [CMDCTRL], label: "Zoom out" }
  - { key: "0", mods: [CMDCTRL], icon: resetzoom.png, label: "Reset zoom" }
  - { key: LEFT, mods: [ALT], icon: back.png, label: "Back", except: [macos] }
  - { key: LBRACKET, mods: [GUI], icon: back.png, label: "Back", only: [macos] }
  - { key: RIGHT, mods: [ALT], icon: forward.png, label: "Forward", except: [macos] }
  - { key: RBRACKET, mods: [GUI], icon: forward.png, label: "Forward", only: [macos] }
  - { key: I, mods: [CTRL, SHIFT], icon: devtools.png, label: "Developer tools", except: [macos] }
  - { key: I, mods: [ALT, GUI], icon: devtools.png, label: "Developer tools", only: [macos] }
  - { key: "1", mods: [CMDCTRL], icon: tab1.png, label: "Tab 1" }
  - { key: "2", mods: [CMDCTRL], icon: tab2.png, label: "Tab 2" }
  - { key: "3", mods: [CMDCTRL], icon: tab3.png, label: "Tab 3" }
  - { key: "4", mods: [CMDCTRL], icon: tab4.png, label: "Tab 4" }
  - { key: "5", mods: [CMDCTRL], icon: tab5.png, label: "Tab 5" }
  - { key: "6", mods: [CMDCTRL], icon: tab6.png, label: "Tab 6" }
  - { key: "7", mods: [CMDCTRL], icon: tab7.png, label: "Tab 7" }
  - { key: "8", mods: [CMDCTRL], icon: tab8.png, label: "Tab 8" }
