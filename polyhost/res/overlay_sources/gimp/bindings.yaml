# GIMP shortcut overlays for PolyKybd (Windows, Linux, macOS).
#
# ONE spec, TWO artwork sets:
#   gimp_template.*      Windows / Linux  (GTK <primary> = Ctrl)
#   gimp_mac_template.*  macOS            (GTK <primary> = Cmd)
#
# GIMP writes every menu accelerator as `<primary>`, GTK's name for "Ctrl, or
# Cmd on macOS", so those chords are CMDCTRL here. Tool keys, Shift+tool keys,
# Alt, Home/End and the F-keys are the same literal keys on every platform and
# stay unscoped.
#
# Every chord was read from the GIMP source (GNOME/gimp on GitHub), on BOTH the
# `gimp-2-10` and `gimp-3-0` branches: menu accelerators from
# app/actions/*-actions.c, tool keys from each tool's registration in
# app/tools/gimp*tool.c. Only chords identical in 2.10 and 3.0 are drawn.
# See SOURCES.md.
#
# The old hand-drawn cells are RECLAIMED pixel-for-pixel and render 1:1, with
# two deliberate corrections (see SOURCES.md): the old set carried GIMP 2.8's
# transform keys (Scale on Shift+T, Shear on Shift+S), and an Alt+H "undo
# history" cell that GIMP does not bind (Alt+H opens the Help menu).
#
# Regenerate (from the repo root, with the project venv):
#   PYTHONPATH=. .venv/bin/python polyhost/res/overlay_sources/gimp/fetch_icons.py
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/gimp/bindings.yaml --preview /tmp/gimp_preview
app: gimp
match: [gimp-2.0, gimp-2.8, gimp-2, gimp-2.10, gimp-3.0, gimp, gimp-3, org.gimp.GIMP]
output: gimp_template
output_macos: gimp_mac_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

# The mark shipped with the old hand-drawn set, lifted pixel-for-pixel.
program_icon: gimp.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_anchor: center
program_icon_margin: 0

# Reclaimed artwork renders 1:1: the old cell IS the icon.
_r: &r { region: [72, 40], anchor: center, source: reclaimed }

bindings:
  # ============================ RECLAIMED: tools ==============================
  - { key: A, mods: [], icon: airbrush.png,      <<: *r, label: Airbrush }
  - { key: B, mods: [], icon: paths.png,         <<: *r, label: Paths }
  - { key: C, mods: [], icon: clone.png,         <<: *r, label: Clone }
  - { key: D, mods: [], icon: defaultcolors.png, <<: *r, label: "Default colors" }
  - { key: E, mods: [], icon: ellipseselect.png, <<: *r, label: "Ellipse select" }
  - { key: F, mods: [], icon: freeselect.png,    <<: *r, label: "Free select" }
  - { key: G, mods: [], icon: gradient.png,      <<: *r, label: Gradient }
  - { key: H, mods: [], icon: heal.png,          <<: *r, label: Heal }
  - { key: I, mods: [], icon: iscissors.png,     <<: *r, label: "Scissors select" }
  - { key: K, mods: [], icon: ink.png,           <<: *r, label: Ink }
  - { key: M, mods: [], icon: move.png,          <<: *r, label: "Move tool" }
  - { key: N, mods: [], icon: pencil.png,        <<: *r, label: Pencil }
  - { key: O, mods: [], icon: colorpicker.png,   <<: *r, label: "Color picker" }
  - { key: P, mods: [], icon: paintbrush.png,    <<: *r, label: Paintbrush }
  - { key: Q, mods: [], icon: align.png,         <<: *r, label: Align }
  - { key: R, mods: [], icon: rectselect.png,    <<: *r, label: "Rectangle select" }
  - { key: S, mods: [], icon: smudge.png,        <<: *r, label: Smudge }
  - { key: T, mods: [], icon: text.png,          <<: *r, label: "Text tool" }
  - { key: U, mods: [], icon: fuzzyselect.png,   <<: *r, label: "Fuzzy select" }
  - { key: W, mods: [], icon: warp.png,          <<: *r, label: "Warp transform" }
  - { key: X, mods: [], icon: swapcolors.png,    <<: *r, label: "Swap colors" }
  - { key: Y, mods: [], icon: mypaint.png,       <<: *r, label: "MyPaint brush" }
  - { key: Z, mods: [], icon: zoomtool.png,      <<: *r, label: "Zoom tool" }
  - { key: B, mods: [SHIFT], icon: bucketfill.png,    <<: *r, label: "Bucket fill" }
  - { key: C, mods: [SHIFT], icon: crop.png,          <<: *r, label: Crop }
  - { key: F, mods: [SHIFT], icon: flip.png,          <<: *r, label: Flip }
  - { key: O, mods: [SHIFT], icon: bycolorselect.png, <<: *r, label: "Select by color" }
  - { key: P, mods: [SHIFT], icon: perspective.png,   <<: *r, label: Perspective }
  - { key: R, mods: [SHIFT], icon: rotate.png,        <<: *r, label: Rotate }
  # CORRECTED: the old set had these two drawings on 2.8's keys (Scale on
  # Shift+T, Shear on Shift+S). 2.10 and 3.0 bind Scale to Shift+S, Shear to
  # Shift+H and Unified Transform to Shift+T.
  - { key: S, mods: [SHIFT], icon: scale.png,         <<: *r, label: Scale }
  - { key: H, mods: [SHIFT], icon: shear.png,         <<: *r, label: Shear }

  # ============================ RECLAIMED: view / help ========================
  - { key: "1", mods: [], icon: zoom1_1.png,  <<: *r, label: "Zoom 1:1" }
  - { key: "2", mods: [], icon: zoom2_1.png,  <<: *r, label: "Zoom 2:1" }
  - { key: "3", mods: [], icon: zoom4_1.png,  <<: *r, label: "Zoom 4:1" }
  - { key: "4", mods: [], icon: zoom8_1.png,  <<: *r, label: "Zoom 8:1" }
  - { key: "5", mods: [], icon: zoom16_1.png, <<: *r, label: "Zoom 16:1" }
  - { key: "-", mods: [], icon: zoomout.png,  <<: *r, label: "Zoom out (view)" }
  - { key: "/", mods: [], icon: searchactions.png, <<: *r, label: "Search actions" }
  - { key: F1,  mods: [], icon: help.png,     <<: *r, label: "Help (GIMP)" }

  # ============================ tools added ===================================
  - { key: T, mods: [SHIFT], icon: unifiedtransform.png, label: "Unified transform", source: "material-symbols/transform (Apache-2.0)" }
  - { key: E, mods: [SHIFT], icon: eraser.png,           label: "Eraser tool",       source: "ms-fluent/Eraser (MIT)" }
  - { key: D, mods: [SHIFT], icon: dodgeburn.png,        label: "Dodge / Burn",      source: "photoshop/icons/dodgeburn.png (custom, GPL-3.0-or-later)" }
  - { key: U, mods: [SHIFT], icon: blursharpen.png,      label: "Blur / Sharpen",    source: "ms-fluent/Blur (MIT)" }
  - { key: M, mods: [SHIFT], icon: measure.png,          label: "Measure",           source: "material-symbols/straighten (Apache-2.0)" }
  - { key: G, mods: [SHIFT], icon: cage.png,             label: "Cage transform",    source: "material-symbols/polyline (Apache-2.0)" }
  - { key: L, mods: [SHIFT], icon: handletransform.png,  label: "Handle transform",  source: "material-symbols/control_camera (Apache-2.0)" }

  # ============================ view / select (no Ctrl) =======================
  # "plus" is Shift+= on a US layout; GTK matches the produced keysym.
  - { key: "=", mods: [SHIFT], icon: zoomin.png, <<: *r, label: "Zoom in (view)", source: "derived from reclaimed zoomout.png" }
  - { key: J,   mods: [SHIFT], icon: centerimage.png,       label: "Center image in window", source: "material-symbols/filter_center_focus (Apache-2.0)" }
  - { key: Q,   mods: [SHIFT], icon: quickmask.png,         label: "Toggle quick mask",      source: "ms-fluent/Square Hint (MIT)" }
  - { key: V,   mods: [SHIFT], icon: selectionfrompath.png, label: "Selection from path",    source: "material-symbols/conversion_path (Apache-2.0)" }
  - { key: HOME, mods: [],     icon: toplayer.png,          label: "Select top layer",       source: "material-symbols/vertical_align_top (Apache-2.0)" }
  - { key: END,  mods: [],     icon: bottomlayer.png,       label: "Select bottom layer",    source: "material-symbols/vertical_align_bottom (Apache-2.0)" }
  - { key: ENTER, mods: [ALT], icon: imageproperties.png,   label: "Image properties",       source: "ms-fluent/Info (MIT)" }
  - { key: F1,  mods: [SHIFT], icon: contexthelp.png,       label: "Context help",           source: "ms-fluent/Question Circle (MIT)" }
  - { key: F11, mods: [],      label: Fullscreen }

  # ============================ <primary> = CMDCTRL ===========================
  # -- file --
  - { key: N, mods: [CMDCTRL],        label: New }
  - { key: O, mods: [CMDCTRL],        label: Open }
  - { key: O, mods: [CMDCTRL, ALT],   icon: openaslayers.png, label: "Open as layers", source: "ms-fluent/Layer Diagonal Add (MIT)" }
  - { key: S, mods: [CMDCTRL],        label: Save }
  - { key: S, mods: [CMDCTRL, SHIFT], label: "Save as" }
  - { key: E, mods: [CMDCTRL],        icon: export.png,   label: "Export",    source: "material-symbols/file_export (Apache-2.0)" }
  - { key: E, mods: [CMDCTRL, SHIFT], icon: exportas.png, label: "Export as", source: "ms-fluent/Document Arrow Right (MIT)" }
  - { key: W, mods: [CMDCTRL],        label: Close }
  - { key: W, mods: [CMDCTRL, SHIFT], icon: closeall.png, label: "Close all", source: "ms-fluent/Dismiss Square Multiple (MIT)" }
  - { key: Q, mods: [CMDCTRL],        label: Quit }
  # -- edit --
  - { key: Z, mods: [CMDCTRL],        label: Undo }
  - { key: Y, mods: [CMDCTRL],        label: Redo }
  - { key: X, mods: [CMDCTRL],        label: Cut }
  - { key: C, mods: [CMDCTRL],        label: Copy }
  - { key: C, mods: [CMDCTRL, SHIFT], icon: copyvisible.png,     label: "Copy visible",       source: "ms-fluent/Copy Select (MIT)" }
  - { key: V, mods: [CMDCTRL],        label: Paste }
  - { key: V, mods: [CMDCTRL, ALT],   icon: pasteinplace.png,    label: "Paste in place",     source: "material-symbols/content_paste_go (Apache-2.0)" }
  - { key: V, mods: [CMDCTRL, SHIFT], icon: pasteasnewimage.png, label: "Paste as new image", source: "ms-fluent/Image Add (MIT)" }
  # -- select --
  - { key: A, mods: [CMDCTRL],        label: "Select all" }
  - { key: A, mods: [CMDCTRL, SHIFT], icon: selectnone.png,      label: "Select none",      source: "ms-fluent/Select All Off (MIT)" }
  - { key: I, mods: [CMDCTRL],        icon: invertselection.png, label: "Invert selection", source: "ms-fluent/Arrow Swap (MIT)" }
  # -- image / layer --
  - { key: D, mods: [CMDCTRL],        icon: duplicateimage.png,  label: "Duplicate image",      source: "ms-fluent/Image Multiple (MIT)" }
  - { key: M, mods: [CMDCTRL],        icon: mergevisible.png,    label: "Merge visible layers", source: "ms-fluent/Layer Diagonal (MIT)" }
  - { key: N, mods: [CMDCTRL, SHIFT], icon: newlayer.png,        label: "New layer",            source: "ms-fluent/Add Square (MIT)" }
  - { key: D, mods: [CMDCTRL, SHIFT], icon: duplicatelayer.png,  label: "Duplicate layer",      source: "ms-fluent/Layer (MIT)" }
  - { key: H, mods: [CMDCTRL],        icon: anchorlayer.png,     label: "Anchor layer",         source: "material-symbols/anchor (Apache-2.0)" }
  # -- view --
  - { key: J, mods: [CMDCTRL, SHIFT], icon: fitinwindow.png,     label: "Fit image in window",  source: "material-symbols/fit_screen (Apache-2.0)" }
  - { key: J, mods: [CMDCTRL],        icon: shrinkwrap.png,      label: "Shrink wrap",          source: "ms-fluent/Arrow Minimize (MIT)" }
  - { key: R, mods: [CMDCTRL, SHIFT], icon: rulers.png,          label: "Show rulers",          source: "ms-fluent/Ruler (MIT)" }
  # -- dialogs --
  - { key: B, mods: [CMDCTRL],        icon: toolbox.png,         label: "Toolbox",              source: "ms-fluent/Toolbox (MIT)" }
  - { key: B, mods: [CMDCTRL, SHIFT], icon: brushes.png,         label: "Brushes dialog",       source: "material-symbols/brush (Apache-2.0)" }
  - { key: P, mods: [CMDCTRL, SHIFT], icon: patterns.png,        label: "Patterns dialog",      source: "material-symbols/texture (Apache-2.0)" }
  - { key: G, mods: [CMDCTRL],        icon: gradients.png,       label: "Gradients dialog",     source: "material-symbols/gradient (Apache-2.0)" }
  # -- filters --
  - { key: F, mods: [CMDCTRL],        icon: repeatfilter.png,    label: "Repeat last filter",   source: "ms-fluent/Arrow Repeat All (MIT)" }
  - { key: F, mods: [CMDCTRL, SHIFT], icon: reshowfilter.png,    label: "Re-show last filter",  source: "ms-fluent/Options (MIT)" }
