# lazygit (terminal UI for git) shortcut overlays for PolyKybd. See SOURCES.md.
#
# Keys: lazygit's default keybindings, `GetDefaultConfig()` in
# pkg/config/user_config.go of github.com/jesseduffield/lazygit, tag v0.66.2
# (commit 63ab89ff), checked against docs/keybindings/Keybindings_en.md at the
# same tag. Drawn: the global keys, the list navigation keys and the keys of
# the Files panel, which has focus when lazygit starts. Most letters do other
# things in the Branches, Commits and Stash panels, and the overlay cannot know
# which panel has focus (SOURCES.md lists the differences).
#
# lazygit writes an upper-case letter or a shifted symbol for a key that needs
# Shift; it is drawn on its key's Shift variant for a US layout (`?` is
# Shift+/, `:` is Shift+;), as in the nano and Emacs sets. Ctrl is Control on
# every platform (lazygit runs in a terminal), so there is no macOS set.
#
# Routed by the terminal's WINDOW TITLE (overlay-mapping.poly.yaml,
# `&editor_titles`): lazygit sets no title itself.
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/lazygit/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/lazygit/bindings.yaml --preview /tmp/lazygit_preview
app: lazygit
match: [lazygit]
output: lazygit_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: lazygit.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- Files panel, no modifier ---
  - { key: KC_SPACE, mods: [], icon: stage.png, label: "Stage" }               # toggles staged
  - { key: A, mods: [], icon: stageall.png, label: "Stage all" }               # toggles all
  - { key: C, mods: [], icon: commit.png, label: "Commit" }
  - { key: W, mods: [], icon: commitnohook.png, label: "Commit without hook" }
  - { key: E, mods: [], icon: edit.png, label: "Edit file", shared: false }
  - { key: O, mods: [], icon: openwith.png, label: "Open file" }
  - { key: I, mods: [], icon: ignore.png, label: "Ignore file" }
  - { key: R, mods: [], icon: refreshfiles.png, label: "Refresh files" }
  - { key: S, mods: [], icon: stashall.png, label: "Stash all changes" }
  - { key: D, mods: [], icon: discardfile.png, label: "Discard", shared: false }
  - { key: G, mods: [], icon: upstreamreset.png, label: "Upstream reset options" }
  - { key: F, mods: [], icon: fetch.png, label: "Fetch" }
  - { key: Y, mods: [], label: "Copy" }                                        # opens a copy menu
  - { key: KC_GRAVE, mods: [], icon: treeview.png, label: "Toggle file tree" }
  - { key: "-", mods: [], icon: collapseall.png, label: "Collapse all" }
  - { key: "=", mods: [], icon: expandall.png, label: "Expand all" }
  - { key: KC_ENTER, mods: [], icon: mainview.png, label: "Focus file diff" }
  - { key: "0", mods: [], icon: mainview.png, label: "Focus main view" }
  - { key: "/", mods: [], icon: filter.png, label: "Filter view" }
  # --- Files panel, Shift ---
  - { key: A, mods: [SHIFT], icon: amend.png, label: "Amend last commit" }
  - { key: C, mods: [SHIFT], icon: commiteditor.png, label: "Commit in git editor" }
  - { key: S, mods: [SHIFT], icon: stashoptions.png, label: "Stash options" }
  - { key: D, mods: [SHIFT], icon: resetoptions.png, label: "Reset options" }
  - { key: M, mods: [SHIFT], icon: merge.png, label: "Merge conflict options" }
  # --- Files panel, Ctrl ---
  - { key: O, mods: [CTRL], icon: copypath.png, label: "Copy path" }
  - { key: B, mods: [CTRL], icon: statusfilter.png, label: "Filter by status" }
  - { key: F, mods: [CTRL], icon: fixupbase.png, label: "Find base commit for fixup" }
  - { key: T, mods: [CTRL], icon: difftool.png, label: "External diff tool" }

  # --- side panels: 1..5 jump to Status, Files, Branches, Commits, Stash ---
  - { key: "1", mods: [], icon: status.png, label: "Status panel" }
  - { key: "2", mods: [], icon: files.png, label: "Files panel" }
  - { key: "3", mods: [], icon: branches.png, label: "Branches panel" }
  - { key: "4", mods: [], icon: history.png, label: "Commits panel" }
  - { key: "5", mods: [], icon: stash.png, label: "Stash panel" }

  # --- global, no modifier ---
  - { key: Q, mods: [], label: "Quit" }
  - { key: Z, mods: [], label: "Undo" }
  - { key: P, mods: [], icon: pull.png, label: "Pull" }
  - { key: M, mods: [], icon: rebase.png, label: "Merge/rebase options" }
  # --- global, Shift ---
  - { key: P, mods: [SHIFT], icon: push.png, label: "Push" }
  - { key: R, mods: [SHIFT], icon: refresh.png, label: "Refresh" }
  - { key: Z, mods: [SHIFT], label: "Redo" }
  - { key: Q, mods: [SHIFT], icon: quitkeepdir.png, label: "Quit, keep directory" }
  - { key: W, mods: [SHIFT], icon: compare.png, label: "Diffing options" }
  - { key: "/", mods: [SHIFT], icon: shortcuts.png, label: "Keybindings menu" }    # ?
  - { key: ";", mods: [SHIFT], icon: shell.png, label: "Shell command" }          # :
  - { key: "=", mods: [SHIFT], icon: fullscreen.png, label: "Next screen mode" }  # +
  - { key: "-", mods: [SHIFT], icon: screenprev.png, label: "Previous screen mode" }  # _
  - { key: "]", mods: [SHIFT], icon: contextmore.png, label: "More diff context" }    # }
  - { key: "[", mods: [SHIFT], icon: contextless.png, label: "Less diff context" }    # {
  - { key: "2", mods: [SHIFT], icon: commandlog.png, label: "Command log options" }   # @
  # --- global, Ctrl ---
  - { key: C, mods: [CTRL], label: "Quit" }
  - { key: Z, mods: [CTRL], icon: suspend.png, label: "Suspend" }
  - { key: R, mods: [CTRL], icon: repolist.png, label: "Recent repositories" }
  - { key: P, mods: [CTRL], icon: patch.png, label: "Custom patch options" }
  - { key: G, mods: [CTRL], icon: jumptofile.png, label: "Jump to file in diff" }
  - { key: S, mods: [CTRL], icon: filteroptions.png, label: "Filter options" }
  - { key: E, mods: [CTRL], icon: compare.png, label: "Diffing options" }
  - { key: W, mods: [CTRL], icon: whitespace.png, label: "Toggle whitespace" }
  - { key: U, mods: [CTRL], icon: scrollup.png, label: "Scroll main view up" }
  - { key: D, mods: [CTRL], icon: scrolldown.png, label: "Scroll main view down" }
  # --- global, Alt+Shift ---
  - { key: C, mods: [ALT, SHIFT], icon: editconfig.png, label: "Edit config file" }

  # --- navigation ---
  - { key: K, mods: [], icon: itemprev.png, label: "Previous item" }
  - { key: J, mods: [], icon: itemnext.png, label: "Next item" }
  - { key: H, mods: [], icon: panelprev.png, label: "Previous panel" }
  - { key: L, mods: [], icon: panelnext.png, label: "Next panel" }
  - { key: KC_TAB, mods: [], icon: panelnext.png, label: "Next panel" }
  - { key: KC_TAB, mods: [SHIFT], icon: panelprev.png, label: "Previous panel" }
  - { key: ",", mods: [], icon: pageprev.png, label: "Previous page" }
  - { key: ".", mods: [], icon: pagenext.png, label: "Next page" }
  - { key: ",", mods: [SHIFT], icon: scrolltop.png, label: "Scroll to top" }      # <
  - { key: ".", mods: [SHIFT], icon: scrollbottom.png, label: "Scroll to bottom" }    # >
  - { key: KC_HOME, mods: [], icon: scrolltop.png, label: "Scroll to top" }
  - { key: KC_END, mods: [], icon: scrollbottom.png, label: "Scroll to bottom" }
  - { key: "[", mods: [], icon: prevtab.png, label: "Previous tab" }
  - { key: "]", mods: [], icon: nexttab.png, label: "Next tab" }
  - { key: V, mods: [], icon: rangeselect.png, label: "Range select" }
  - { key: K, mods: [SHIFT], icon: scrollup.png, label: "Scroll main view up" }
  - { key: J, mods: [SHIFT], icon: scrolldown.png, label: "Scroll main view down" }
  - { key: KC_PAGE_UP, mods: [], icon: scrollup.png, label: "Scroll main view up" }
  - { key: KC_PAGE_DOWN, mods: [], icon: scrolldown.png, label: "Scroll main view down" }
  - { key: H, mods: [SHIFT], icon: scrollleft.png, label: "Scroll left" }
  - { key: L, mods: [SHIFT], icon: scrollright.png, label: "Scroll right" }
