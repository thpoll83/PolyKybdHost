# KiCad 3D Viewer shortcut overlay for PolyKybd (Windows, Linux and macOS).
#
# The default hotkeys of KiCad 10.0.7 for the actions the 3D Viewer handles
# (`3d-viewer/3d_viewer/tools/eda_3d_actions.cpp`, `EDA_3D_CONTROLLER`), plus the
# zoom keys from the common actions. The same window opens from the PCB Editor,
# the Footprint Editor and the footprint browser.
#   CMDCTRL          KiCad's MD_CTRL: Ctrl on Windows/Linux, Cmd on macOS.
#   only: / except:  the hotkeys KiCad defines differently on macOS.
#
# The mapping routes a window titled "3D Viewer..." here.
#
# Regenerate:
#   python polyhost/res/overlay_sources/kicad/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/kicad/viewer3d.yaml --preview /tmp/kicad_3d_preview
app: kicad
match: [kicad, pcbnew]
output: kicad_3d_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

bindings:
  # --- views ---
  - { key: Z, mods: [], icon: viewtop.png, label: "View top" }
  - { key: Z, mods: [SHIFT], icon: viewbottom.png, label: "View bottom" }
  - { key: Y, mods: [], icon: viewfront.png, label: "View front" }
  - { key: Y, mods: [SHIFT], icon: viewback.png, label: "View back" }
  - { key: X, mods: [], icon: viewright.png, label: "View right" }
  - { key: X, mods: [SHIFT], icon: viewleft.png, label: "View left" }
  - { key: F, mods: [], icon: flip.png, label: "Flip board" }
  - { key: HOME, mods: [], icon: homeview.png, label: "Home view" }
  - { key: R, mods: [], icon: rotccw.png, label: "Rotate counterclockwise" }
  - { key: R, mods: [SHIFT], icon: rotcw.png, label: "Rotate clockwise" }
  - { key: SPACE, mods: [], icon: pivot.png, label: "Set pivot" }
  - { key: UP, mods: [], icon: navup.png, label: "Move board up" }
  - { key: DOWN, mods: [], icon: prevlayer.png, label: "Move board down" }
  - { key: LEFT, mods: [], icon: navback.png, label: "Move board left" }
  - { key: RIGHT, mods: [], icon: navforward.png, label: "Move board right" }

  # --- which 3D models are shown ---
  - { key: T, mods: [], icon: showtht.png, label: "Through-hole models" }
  - { key: S, mods: [], icon: showsmd.png, label: "SMD models" }
  - { key: V, mods: [], icon: showvirtual.png, label: "Unspecified models" }
  - { key: P, mods: [], icon: shownotpos.png, label: "Models not in POS file" }
  - { key: D, mods: [], icon: showdnp.png, label: "DNP models" }

  # --- zoom and window ---
  - { key: F1, mods: [], label: "Zoom in", except: [macos] }
  - { key: F2, mods: [], label: "Zoom out", except: [macos] }
  - { key: MINUS, mods: [CMDCTRL], label: "Zoom out", only: [macos] }
  - { key: "0", mods: [CMDCTRL], icon: zoomfit.png, label: "Zoom to fit", only: [macos] }
  - { key: F5, mods: [], icon: refresh.png, label: Refresh, except: [macos] }
  - { key: R, mods: [CMDCTRL], icon: refresh.png, label: Refresh, only: [macos] }
  - { key: COMMA, mods: [CMDCTRL], icon: prefs.png, label: Preferences }
  - { key: F1, mods: [CMDCTRL], icon: hotkeys.png, label: "List hotkeys" }
