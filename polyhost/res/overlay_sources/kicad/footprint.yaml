# KiCad Footprint Editor shortcut overlays for PolyKybd (Windows, Linux and
# macOS).
#
# The default hotkeys of KiCad 10.0.7 for the tools the Footprint Editor loads
# (`FOOTPRINT_EDIT_FRAME::setupTools`). It has no router, zone filler, net
# highlighting, find or lock, so those PCB Editor keys are not drawn here; see
# SOURCES.md. Same tokens as pcb.yaml:
#   CMDCTRL          KiCad's MD_CTRL: Ctrl on Windows/Linux, Cmd on macOS.
#   only: / except:  the hotkeys KiCad defines differently on macOS.
#
# The mapping routes a window titled "... Footprint Editor" here.
#
# Regenerate:
#   python polyhost/res/overlay_sources/kicad/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/kicad/footprint.yaml --preview /tmp/kicad_fp_preview
app: kicad
match: [kicad, pcbnew]
output: kicad_fp_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

bindings:
  # --- file and edit ---
  - { key: N, mods: [CMDCTRL], label: New }
  - { key: S, mods: [CMDCTRL], label: Save }
  - { key: S, mods: [CMDCTRL, SHIFT], label: "Save as" }
  - { key: Z, mods: [CMDCTRL], label: Undo }
  - { key: Y, mods: [CTRL],    label: Redo, except: [macos] }
  - { key: Z, mods: [CMDCTRL, SHIFT], label: Redo, only: [macos] }
  - { key: X, mods: [CMDCTRL], label: Cut }
  - { key: C, mods: [CMDCTRL], label: Copy }
  - { key: V, mods: [CMDCTRL], label: Paste }
  - { key: V, mods: [CMDCTRL, SHIFT], icon: pastespecial.png, label: "Paste special" }
  - { key: D, mods: [CMDCTRL], icon: duplicate.png, label: Duplicate }
  - { key: A, mods: [CMDCTRL], label: "Select all" }
  - { key: DEL, mods: [], label: Delete, except: [macos] }
  - { key: BSPC, mods: [], label: Delete, only: [macos] }

  # --- view ---
  - { key: F1, mods: [], label: "Zoom in", except: [macos] }
  - { key: F2, mods: [], label: "Zoom out", except: [macos] }
  - { key: MINUS, mods: [CMDCTRL], label: "Zoom out", only: [macos] }
  - { key: HOME, mods: [], icon: zoomfit.png, label: "Zoom to fit", except: [macos] }
  - { key: "0", mods: [CMDCTRL], icon: zoomfit.png, label: "Zoom to fit", only: [macos] }
  - { key: HOME, mods: [CMDCTRL], icon: zoomobjects.png, label: "Zoom to objects" }
  - { key: F5, mods: [CMDCTRL], icon: zoomarea.png, label: "Zoom to area" }
  - { key: F4, mods: [], icon: center.png, label: "Center on cursor" }
  - { key: F5, mods: [], icon: refresh.png, label: Refresh, except: [macos] }
  - { key: R, mods: [CMDCTRL], icon: refresh.png, label: Refresh, only: [macos] }
  - { key: "3", mods: [ALT], icon: viewer3d.png, label: "3D viewer" }
  - { key: H, mods: [], icon: contrast.png, label: "Inactive layers" }

  # --- grid, units, origin ---
  - { key: N, mods: [], icon: gridnext.png, label: "Next grid" }
  - { key: N, mods: [SHIFT], icon: gridprev.png, label: "Previous grid" }
  - { key: "1", mods: [ALT], icon: fastgrid1.png, label: "Fast grid 1" }
  - { key: "2", mods: [ALT], icon: fastgrid2.png, label: "Fast grid 2" }
  - { key: "4", mods: [ALT], icon: gridcycle.png, label: "Cycle fast grid" }
  - { key: G, mods: [CMDCTRL, SHIFT], icon: gridoverride.png, label: "Grid overrides" }
  - { key: U, mods: [CMDCTRL], icon: units.png, label: "Switch units" }
  - { key: SPACE, mods: [], icon: localorigin.png, label: "Local origin" }
  - { key: SPACE, mods: [SHIFT], icon: linemode.png, label: "Line modes" }
  - { key: M, mods: [CMDCTRL, SHIFT], icon: measure.png, label: Measure }
  - { key: COMMA, mods: [CMDCTRL], icon: prefs.png, label: Preferences }
  - { key: F1, mods: [CMDCTRL], icon: hotkeys.png, label: "List hotkeys" }

  # --- draw ---
  - { key: L, mods: [CMDCTRL, SHIFT], icon: lines.png, label: "Draw lines" }
  - { key: P, mods: [CMDCTRL, SHIFT], icon: polygon.png, label: "Draw polygons" }
  - { key: B, mods: [CMDCTRL, SHIFT], icon: bezier.png, label: "Draw bezier" }
  - { key: T, mods: [CMDCTRL, SHIFT], icon: text.png, label: "Draw text" }
  - { key: H, mods: [CMDCTRL, SHIFT], icon: dimension.png, label: "Draw dimensions" }
  - { key: K, mods: [CMDCTRL, SHIFT], icon: rulearea.png, label: "Draw rule areas" }
  - { key: Z, mods: [CTRL, SHIFT], icon: zone.png, label: "Draw zones", except: [macos] }
  - { key: Z, mods: [ALT], icon: zone.png, label: "Draw zones", only: [macos] }
  - { key: DOT, mods: [CMDCTRL, SHIFT], icon: similarzone.png, label: "Add similar zone" }
  - { key: C, mods: [SHIFT], icon: zonecutout.png, label: "Add zone cutout" }
  - { key: N, mods: [CMDCTRL, SHIFT], icon: anchor.png, label: "Place footprint anchor" }
  - { key: F, mods: [CMDCTRL, SHIFT], icon: importgfx.png, label: "Import graphics" }
  - { key: INSERT, mods: [], icon: corner.png, label: "Create corner", except: [macos] }
  - { key: F1, mods: [], icon: corner.png, label: "Create corner", only: [macos] }

  # --- edit and move ---
  - { key: M, mods: [], icon: move.png, label: Move }
  - { key: M, mods: [CTRL], icon: moveindiv.png, label: "Move individually", except: [macos] }
  - { key: M, mods: [SHIFT], icon: moveexact.png, label: "Move exactly" }
  - { key: P, mods: [SHIFT], icon: posrelative.png, label: "Position relative to" }
  - { key: R, mods: [], icon: rotccw.png, label: "Rotate counterclockwise" }
  - { key: R, mods: [SHIFT], icon: rotcw.png, label: "Rotate clockwise" }
  - { key: F, mods: [], icon: flip.png, label: "Flip side" }
  - { key: S, mods: [ALT], icon: swap.png, label: Swap }
  - { key: E, mods: [], icon: properties.png, label: Properties }
  - { key: T, mods: [CMDCTRL], icon: array.png, label: "Create array" }
  - { key: D, mods: [CMDCTRL, SHIFT], icon: dupincrement.png, label: "Duplicate and increment" }

  # --- layers ---
  - { key: PGUP, mods: [], icon: frontlayer.png, label: "F.Cu layer" }
  - { key: PGDN, mods: [], icon: backlayer.png, label: "B.Cu layer" }
  - { key: EQUAL, mods: [SHIFT], icon: nextlayer.png, label: "Next layer" }
  - { key: MINUS, mods: [], icon: prevlayer.png, label: "Previous layer" }
  - { key: V, mods: [], icon: togglelayer.png, label: "Toggle layer" }
  - { key: V, mods: [SHIFT], icon: layerpair.png, label: "Cycle layer pairs" }
  - { key: RBRACKET, mods: [SHIFT], icon: opacityinc.png, label: "Increase layer opacity" }
  - { key: LBRACKET, mods: [SHIFT], icon: opacitydec.png, label: "Decrease layer opacity" }
  - { key: S, mods: [SHIFT], icon: snaplayers.png, label: "Snap to all layers" }
