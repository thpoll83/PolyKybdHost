# KiCad Schematic Editor shortcut overlays for PolyKybd (Windows, Linux and
# macOS).
#
# The default hotkeys of KiCad 10.0.7, read from the source (SOURCES.md). One
# spec writes two sets: Windows/Linux (`output`) and macOS (`<output>_mac`).
#   CMDCTRL          KiCad's MD_CTRL: Ctrl on Windows/Linux, Cmd on macOS.
#   only: / except:  the hotkeys KiCad defines differently on macOS
#                    (`#ifdef __WXMAC__` in the source).
# Keys that act only inside a running tool (wire drawing) are left out;
# SOURCES.md lists them.
#
# The mapping routes a window titled "... Schematic Editor" here. KiCad runs
# every editor in the `kicad` process when started from the project manager,
# and as `eeschema` when started on its own.
#
# Regenerate:
#   python polyhost/res/overlay_sources/kicad/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/kicad/schematic.yaml --preview /tmp/kicad_sch_preview
app: kicad
match: [kicad, eeschema]
output: kicad_sch_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

bindings:
  # --- file and edit (common actions) ---
  - { key: N, mods: [CMDCTRL], label: New }
  - { key: O, mods: [CMDCTRL], label: Open }
  - { key: S, mods: [CMDCTRL], label: Save }
  - { key: S, mods: [CMDCTRL, SHIFT], label: "Save as" }
  - { key: P, mods: [CMDCTRL], label: Print }
  - { key: Z, mods: [CMDCTRL], label: Undo }
  - { key: Y, mods: [CTRL],    label: Redo, except: [macos] }
  - { key: Z, mods: [CMDCTRL, SHIFT], label: Redo, only: [macos] }
  - { key: X, mods: [CMDCTRL], label: Cut }
  - { key: C, mods: [CMDCTRL], label: Copy }
  - { key: V, mods: [CMDCTRL], label: Paste }
  - { key: V, mods: [CMDCTRL, SHIFT], icon: pastespecial.png, label: "Paste special" }
  - { key: D, mods: [CMDCTRL], icon: duplicate.png, label: Duplicate }
  - { key: A, mods: [CMDCTRL], label: "Select all" }
  - { key: A, mods: [CMDCTRL, SHIFT], icon: unselectall.png, label: "Unselect all" }
  - { key: C, mods: [CMDCTRL, SHIFT], icon: copytext.png, label: "Copy as text" }
  - { key: DEL, mods: [], label: Delete, except: [macos] }
  - { key: BSPC, mods: [], label: Delete, only: [macos] }
  - { key: F, mods: [CMDCTRL], label: Find }
  - { key: F, mods: [CMDCTRL, ALT], icon: findreplace.png, label: "Find and replace" }
  - { key: G, mods: [CMDCTRL], icon: search.png, label: Search }
  - { key: F3, mods: [], label: "Find next" }
  - { key: F3, mods: [SHIFT], icon: findprev.png, label: "Find previous" }
  - { key: F3, mods: [CMDCTRL, SHIFT], icon: nextmarker.png, label: "Next marker" }

  # --- view (common actions) ---
  - { key: F1, mods: [], label: "Zoom in", except: [macos] }
  - { key: F2, mods: [], label: "Zoom out", except: [macos] }
  - { key: MINUS, mods: [CMDCTRL], label: "Zoom out", only: [macos] }
  - { key: HOME, mods: [], icon: zoomfit.png, label: "Zoom to fit", except: [macos] }
  - { key: "0", mods: [CMDCTRL], icon: zoomfit.png, label: "Zoom to fit", only: [macos] }
  - { key: HOME, mods: [CMDCTRL], icon: zoomobjects.png, label: "Zoom to objects" }
  - { key: F5, mods: [CMDCTRL], icon: zoomarea.png, label: "Zoom to area" }
  - { key: F4, mods: [], icon: center.png, label: "Center on cursor" }
  - { key: F5, mods: [], icon: refresh.png, label: Refresh, except: [macos] }
  - { key: R, mods: [CMDCTRL], icon: refresh.png, label: Refresh, only: [macos] }

  # --- grid, units, origin (common actions) ---
  - { key: N, mods: [], icon: gridnext.png, label: "Next grid" }
  - { key: N, mods: [SHIFT], icon: gridprev.png, label: "Previous grid" }
  - { key: "1", mods: [ALT], icon: fastgrid1.png, label: "Fast grid 1" }
  - { key: "2", mods: [ALT], icon: fastgrid2.png, label: "Fast grid 2" }
  - { key: "4", mods: [ALT], icon: gridcycle.png, label: "Cycle fast grid" }
  - { key: G, mods: [CMDCTRL, SHIFT], icon: gridoverride.png, label: "Grid overrides" }
  - { key: U, mods: [CMDCTRL], icon: units.png, label: "Switch units" }
  - { key: SPACE, mods: [], icon: localorigin.png, label: "Local origin" }
  - { key: SPACE, mods: [SHIFT], icon: linemode.png, label: "Line modes" }
  - { key: F8, mods: [], icon: updatepcb.png, label: "Update PCB from schematic" }
  - { key: COMMA, mods: [CMDCTRL], icon: prefs.png, label: Preferences }
  - { key: F1, mods: [CMDCTRL], icon: hotkeys.png, label: "List hotkeys" }

  # --- place and draw ---
  - { key: A, mods: [], icon: symbol.png, label: "Place symbols" }
  - { key: P, mods: [], icon: power.png, label: "Place power symbols" }
  - { key: W, mods: [], icon: wire.png, label: "Draw wires" }
  - { key: B, mods: [], icon: bus.png, label: "Draw buses" }
  - { key: Z, mods: [], icon: busentry.png, label: "Wire to bus entries" }
  - { key: I, mods: [], icon: lines.png, label: "Draw lines" }
  - { key: Q, mods: [], icon: noconnect.png, label: "No connect flags" }
  - { key: J, mods: [], icon: junction.png, label: "Place junctions" }
  - { key: L, mods: [], icon: netlabel.png, label: "Net labels" }
  - { key: H, mods: [], icon: hierlabel.png, label: "Hierarchical labels" }
  - { key: L, mods: [CMDCTRL], icon: globallabel.png, label: "Global labels" }
  - { key: S, mods: [], icon: sheet.png, label: "Hierarchical sheets" }
  - { key: T, mods: [], icon: text.png, label: "Draw text" }
  - { key: INSERT, mods: [], icon: repeat.png, label: "Repeat last item", except: [macos] }
  - { key: F1, mods: [], icon: repeat.png, label: "Repeat last item", only: [macos] }
  - { key: B, mods: [SHIFT], icon: designblock.png, label: "Place design block" }
  - { key: F, mods: [CMDCTRL, SHIFT], icon: importgfx.png, label: "Import graphics" }

  # --- edit and move ---
  - { key: M, mods: [], icon: move.png, label: Move }
  - { key: G, mods: [], icon: drag.png, label: Drag }
  - { key: R, mods: [], icon: rotccw.png, label: "Rotate counterclockwise" }
  - { key: R, mods: [SHIFT], icon: rotcw.png, label: "Rotate clockwise" }
  - { key: X, mods: [], icon: mirrorh.png, label: "Mirror horizontally" }
  - { key: Y, mods: [], icon: mirrorv.png, label: "Mirror vertically" }
  - { key: S, mods: [ALT], icon: swap.png, label: Swap }
  - { key: E, mods: [], icon: properties.png, label: Properties }
  - { key: U, mods: [], icon: reference.png, label: "Edit reference" }
  - { key: V, mods: [], icon: value.png, label: "Edit value" }
  - { key: F, mods: [], icon: footprint.png, label: "Edit footprint" }
  - { key: O, mods: [], icon: autoplace.png, label: "Autoplace fields" }
  - { key: D, mods: [], icon: datasheet.png, label: "Show datasheet" }
  - { key: E, mods: [CMDCTRL], icon: openeditor.png, label: "Edit with Symbol Editor" }
  - { key: E, mods: [CMDCTRL, SHIFT], icon: library.png, label: "Edit library symbol" }

  # --- select, highlight, navigate ---
  - { key: "4", mods: [CMDCTRL], icon: expandconn.png, label: "Select connection" }
  - { key: "3", mods: [ALT], icon: selectnode.png, label: "Select node" }
  - { key: GRAVE, mods: [], icon: highlight.png, label: "Highlight net" }
  - { key: GRAVE, mods: [SHIFT], icon: clearhighlight.png, label: "Clear net highlighting" }
  - { key: TAB, mods: [], icon: nextnet.png, label: "Next net item" }
  - { key: TAB, mods: [SHIFT], icon: prevnet.png, label: "Previous net item" }
  - { key: PGUP, mods: [], icon: prevsheet.png, label: "Previous sheet" }
  - { key: PGDN, mods: [], icon: nextsheet.png, label: "Next sheet" }
  - { key: BSPC, mods: [ALT], icon: leavesheet.png, label: "Leave sheet" }
  - { key: UP, mods: [ALT], icon: navup.png, label: "Navigate up" }
  - { key: LEFT, mods: [ALT], icon: navback.png, label: "Navigate back" }
  - { key: RIGHT, mods: [ALT], icon: navforward.png, label: "Navigate forward" }
  - { key: H, mods: [CTRL], icon: hierarchy.png, label: "Hierarchy navigator", except: [macos] }
