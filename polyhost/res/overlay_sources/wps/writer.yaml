# WPS Writer shortcut overlays for PolyKybd (Windows and Linux).
#
# Keys: the WPS Writer list that defkey.com copied from WPS Help (see
# SOURCES.md). Only keys on that list are drawn. Word shortcuts that the list
# does not name (Ctrl+M indent, Ctrl+T hanging indent, Ctrl+Q clear formatting,
# Ctrl+1/2/5 line spacing, Shift+F3 change case, Ctrl+Shift+C copy format) are
# left out. F6 is Translation in WPS, not "next pane" as in Word.
#
# There is no macOS set: WPS Office for Mac is one app for all three editors,
# and its window titles are not documented, so a title route cannot be written.
#
# Regenerate:
#   python polyhost/res/overlay_sources/wps/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/wps/writer.yaml --preview /tmp/wps_writer_preview
app: wps-writer
match: [wps]
output: wps_writer_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: wps_writer.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- file ---
  - { key: N, mods: [CTRL], icon: new.png,   label: New,   source: "ms-fluent/Document Add (MIT), from word/" }
  - { key: O, mods: [CTRL], icon: open.png,  label: Open,  source: "ms-fluent/Folder Open (MIT), from word/" }
  - { key: S, mods: [CTRL], icon: save.png,  label: Save,  source: "ms-fluent/Save (MIT), from word/" }
  - { key: P, mods: [CTRL], icon: print.png, label: Print, source: "ms-fluent/Print (MIT), from word/" }
  - { key: F12, mods: [],   icon: saveas.png, label: "Save as", source: "ms-fluent/Save Edit (MIT), from word/" }

  # --- edit ---
  - { key: A, mods: [CTRL], icon: selectall.png, label: "Select all", source: "ms-fluent/Select All On (MIT), from word/" }
  - { key: X, mods: [CTRL], icon: cut.png,   label: Cut,   source: "ms-fluent/Cut (MIT), from word/" }
  - { key: C, mods: [CTRL], icon: copy.png,  label: Copy,  source: "ms-fluent/Copy (MIT), from word/" }
  - { key: V, mods: [CTRL], icon: paste.png, label: Paste, source: "ms-fluent/Clipboard Paste (MIT), from word/" }
  - { key: Z, mods: [CTRL], icon: undo.png,  label: Undo,  source: "ms-fluent/Arrow Undo (MIT), from word/" }
  - { key: Y, mods: [CTRL], icon: redo.png,  label: Redo,  source: "ms-fluent/Arrow Redo (MIT), from word/" }
  - { key: F, mods: [CTRL], icon: find.png,    label: Find,    source: "ms-fluent/Search (MIT), from word/" }
  - { key: H, mods: [CTRL], icon: replace.png, label: Replace, source: "ms-fluent/Arrow Swap (MIT), from word/" }
  - { key: G, mods: [CTRL], icon: goto.png,    label: "Go to", source: "ms-fluent/Arrow Down (MIT), from word/" }

  # --- format ---
  - { key: D, mods: [CTRL], icon: font.png,      label: "Font dialog", source: "ms-fluent/Text Font (MIT), from word/" }
  - { key: B, mods: [CTRL], icon: bold.png,      label: Bold,      source: "ms-fluent/Text Bold (MIT), from word/" }
  - { key: I, mods: [CTRL], icon: italic.png,    label: Italic,    source: "ms-fluent/Text Italic (MIT), from word/" }
  - { key: U, mods: [CTRL], icon: underline.png, label: Underline, source: "ms-fluent/Text Underline (MIT), from word/" }
  - { key: EQUAL, mods: [CTRL],        icon: subscript.png,   label: Subscript,   source: "ms-fluent/Text Subscript (MIT), from word/" }
  - { key: EQUAL, mods: [CTRL, SHIFT], icon: superscript.png, label: Superscript, source: "ms-fluent/Text Superscript (MIT)" }
  - { key: "[", mods: [CTRL], icon: fontdec.png, label: "Font -", source: "ms-fluent/Font Decrease (MIT), from word/" }
  - { key: "]", mods: [CTRL], icon: fontinc.png, label: "Font +", source: "ms-fluent/Font Increase (MIT), from word/" }
  - { key: L, mods: [CTRL], icon: left.png,    label: "Align left",   source: "ms-fluent/Text Align Left (MIT), from word/" }
  - { key: E, mods: [CTRL], icon: center.png,  label: "Align center", source: "ms-fluent/Text Align Center (MIT), from word/" }
  - { key: R, mods: [CTRL], icon: right.png,   label: "Align right",  source: "ms-fluent/Text Align Right (MIT), from word/" }
  - { key: J, mods: [CTRL], icon: justify.png, label: Justify,        source: "ms-fluent/Text Align Justify (MIT), from word/" }
  - { key: J, mods: [CTRL, SHIFT], icon: distributed.png, label: "Distributed", source: "ms-fluent/Text Align Distributed (MIT)" }

  # --- insert ---
  - { key: ENTER, mods: [CTRL], icon: pagebreak.png, label: "Page break", source: "ms-fluent/Document Page Break (MIT)" }
  - { key: K, mods: [CTRL], icon: hyperlink.png, label: Hyperlink, source: "ms-fluent/Link (MIT), from word/" }

  # --- review and tools ---
  - { key: E, mods: [CTRL, SHIFT], icon: trackchanges.png, label: "Track changes", source: "ms-fluent/Document Edit (MIT)" }
  - { key: G, mods: [CTRL, SHIFT], icon: wordcount.png,    label: "Word count",    source: "ms-fluent/Text Word Count (MIT)" }
  - { key: F6, mods: [], icon: translate.png,   label: Translation,    source: "ms-fluent/Translate (MIT)" }
  - { key: F7, mods: [], icon: spelling.png,    label: Spelling,       source: "ms-fluent/Text Grammar Checkmark (MIT), from word/" }
  - { key: F9, mods: [], icon: updatefield.png, label: "Update field", source: "ms-fluent/Arrow Sync (MIT)" }
  - { key: F1, mods: [CTRL], icon: taskpane.png, label: "Task pane",   source: "ms-fluent/Panel Right (MIT)" }
  - { key: F8, mods: [ALT],  icon: macro.png,    label: "Run macro",   source: "ms-fluent/Script (MIT)" }
  - { key: F11, mods: [ALT], icon: vbaeditor.png, label: "VBA editor", source: "ms-fluent/Code (MIT)" }
