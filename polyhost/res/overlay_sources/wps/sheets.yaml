# WPS Spreadsheets shortcut overlays for PolyKybd (Windows and Linux).
#
# Keys: the WPS Spreadsheets list that defkey.com copied from the WPS Help
# Center, plus three keys from WPS Academy pages (Ctrl+E smart fill, Alt+=
# AutoSum, Ctrl+Shift+L filter). See SOURCES.md. Only keys on those lists are
# drawn. Excel shortcuts that they do not name (Ctrl+T table, Ctrl+- delete
# cells, Ctrl+[ and Ctrl+] precedents and dependents, Ctrl+5 strikethrough,
# Ctrl+Shift+4/5 number formats) are left out. WPS lists F4 as "repeat the last
# action", so F4 is drawn as Repeat, not as Excel's absolute reference.
#
# There is no macOS set: see writer.yaml.
#
# Regenerate:
#   python polyhost/res/overlay_sources/wps/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/wps/sheets.yaml --preview /tmp/wps_sheets_preview
app: wps-sheets
match: [et]
output: wps_sheets_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: wps_sheets.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- file ---
  - { key: N, mods: [CTRL], icon: new.png,   label: New,   source: "ms-fluent/Document Add (MIT), from word/" }
  - { key: O, mods: [CTRL], icon: open.png,  label: Open,  source: "ms-fluent/Folder Open (MIT), from word/" }
  - { key: S, mods: [CTRL], icon: save.png,  label: Save,  source: "ms-fluent/Save (MIT), from word/" }
  - { key: P, mods: [CTRL], icon: print.png, label: Print, source: "ms-fluent/Print (MIT), from word/" }
  - { key: W, mods: [CTRL], icon: close.png, label: Close, source: "ms-fluent/Document Dismiss (MIT), from excel/" }
  - { key: F12, mods: [],   icon: saveas.png, label: "Save as", source: "ms-fluent/Save Edit (MIT), from word/" }

  # --- edit ---
  - { key: A, mods: [CTRL], icon: selectall.png, label: "Select all", source: "ms-fluent/Select All On (MIT), from word/" }
  - { key: X, mods: [CTRL], icon: cut.png,   label: Cut,   source: "ms-fluent/Cut (MIT), from word/" }
  - { key: C, mods: [CTRL], icon: copy.png,  label: Copy,  source: "ms-fluent/Copy (MIT), from word/" }
  - { key: V, mods: [CTRL], icon: paste.png, label: Paste, source: "ms-fluent/Clipboard Paste (MIT), from word/" }
  - { key: Z, mods: [CTRL], icon: undo.png,  label: Undo,  source: "ms-fluent/Arrow Undo (MIT), from word/" }
  - { key: Y, mods: [CTRL], icon: redo.png,  label: Redo,  source: "ms-fluent/Arrow Redo (MIT), from word/" }
  - { key: F, mods: [CTRL], icon: find.png,    label: Find,    source: "ms-fluent/Search (MIT), from word/" }
  - { key: H, mods: [CTRL], icon: replace.png, label: Replace, source: "ms-fluent/Arrow Swap (MIT), from word/" }
  - { key: G, mods: [CTRL], icon: goto.png,    label: "Go to", source: "ms-fluent/Arrow Down (MIT), from word/" }

  # --- format ---
  - { key: B, mods: [CTRL], icon: bold.png,      label: Bold,      source: "ms-fluent/Text Bold (MIT), from word/" }
  - { key: I, mods: [CTRL], icon: italic.png,    label: Italic,    source: "ms-fluent/Text Italic (MIT), from word/" }
  - { key: U, mods: [CTRL], icon: underline.png, label: Underline, source: "ms-fluent/Text Underline (MIT), from word/" }
  - { key: K, mods: [CTRL], icon: hyperlink.png, label: Hyperlink, source: "ms-fluent/Link (MIT), from word/" }
  - { key: "1", mods: [CTRL], icon: formatcells.png, label: "Format cells", source: "ms-fluent/Table Settings (MIT), from excel/" }

  # --- cells and data ---
  - { key: D, mods: [CTRL], icon: filldown.png,  label: "Fill down",  source: "ms-fluent/Arrow Down (MIT), from excel/" }
  - { key: R, mods: [CTRL], icon: fillright.png, label: "Fill right", source: "ms-fluent/Arrow Right (MIT), from excel/" }
  - { key: E, mods: [CTRL], icon: flashfill.png, label: "Smart fill", source: "ms-fluent/Flash (MIT), from excel/" }
  - { key: ";", mods: [CTRL],        icon: date.png, label: "Insert date", source: "ms-fluent/Calendar Today (MIT)" }
  - { key: ";", mods: [CTRL, SHIFT], icon: time.png, label: "Insert time", source: "ms-fluent/Clock (MIT)" }
  - { key: EQUAL, mods: [CTRL, SHIFT], icon: insertcells.png, label: "Insert cells", source: "ms-fluent/Table Add (MIT)" }
  - { key: EQUAL, mods: [ALT], icon: autosum.png, label: AutoSum, source: "ms-fluent/Math Formula (MIT), from excel/" }
  - { key: L, mods: [CTRL, SHIFT], icon: filter.png, label: Filter, source: "ms-fluent/Filter (MIT), from excel/" }

  # --- function keys ---
  - { key: F2,  mods: [], icon: edit.png,     label: "Edit cell",    source: "ms-fluent/Edit (MIT), from excel/" }
  - { key: F4,  mods: [], icon: repeat.png,   label: "Repeat",       source: "ms-fluent/Arrow Repeat All (MIT)" }
  - { key: F7,  mods: [], icon: spelling.png, label: Spelling,       source: "ms-fluent/Text Grammar Checkmark (MIT), from word/" }
  - { key: F9,  mods: [], icon: calc.png,     label: Calculate,      source: "ms-fluent/Calculator (MIT), from excel/" }
  - { key: F11, mods: [], icon: chart.png,    label: "Insert chart", source: "ms-fluent/Data Bar Vertical Add (MIT)" }
  - { key: F1, mods: [CTRL], icon: taskpane.png, label: "Task pane",  source: "ms-fluent/Panel Right (MIT)" }
  - { key: F8, mods: [ALT],  icon: macro.png,    label: "Macros",     source: "ms-fluent/Script (MIT)" }
  - { key: F11, mods: [ALT], icon: vbaeditor.png, label: "VBA editor", source: "ms-fluent/Code (MIT)" }
