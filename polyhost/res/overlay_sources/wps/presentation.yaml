# WPS Presentation shortcut overlays for PolyKybd (Windows and Linux).
#
# Keys: two WPS Academy pages ("Must-have shortcut tricks in making slides" and
# "... in showing slides") and WPS's "Welcome to WPS Office - Presentation"
# quick start guide (Ctrl+M). See SOURCES.md. WPS publishes no full list for
# Presentation, so this set is smaller than PowerPoint's: PowerPoint shortcuts
# that no WPS page names (Ctrl+D duplicate, text alignment, font size, Ctrl+K,
# Ctrl+T, F7, F12) are left out. Ctrl+Enter and Ctrl+Delete insert and delete
# a slide; PowerPoint has neither.
#
# There is no macOS set: see writer.yaml.
#
# Regenerate:
#   python polyhost/res/overlay_sources/wps/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/wps/presentation.yaml --preview /tmp/wps_presentation_preview
app: wps-presentation
match: [wpp]
output: wps_presentation_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: wps_presentation.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- file ---
  - { key: N, mods: [CTRL], icon: new.png,   label: New,   source: "ms-fluent/Document Add (MIT), from word/" }
  - { key: O, mods: [CTRL], icon: open.png,  label: Open,  source: "ms-fluent/Folder Open (MIT), from word/" }
  - { key: S, mods: [CTRL], icon: save.png,  label: Save,  source: "ms-fluent/Save (MIT), from word/" }
  - { key: P, mods: [CTRL], icon: print.png, label: Print, source: "ms-fluent/Print (MIT), from word/" }

  # --- slides ---
  - { key: M, mods: [CTRL],     icon: newslide.png, label: "New slide", source: "ms-fluent/Slide Add (MIT), from powerpoint/" }
  - { key: ENTER, mods: [CTRL], icon: newslide.png, label: "New slide", source: "ms-fluent/Slide Add (MIT), from powerpoint/" }
  - { key: DELETE, mods: [CTRL], icon: deleteslide.png, label: "Delete slide", source: "ms-fluent/Delete (MIT)" }
  - { key: F5, mods: [],      icon: slideshow.png,   label: "Slideshow",    source: "ms-fluent/Play (MIT), from powerpoint/" }
  - { key: F5, mods: [SHIFT], icon: fromcurrent.png, label: "From current", source: "ms-fluent/Play Circle (MIT), from powerpoint/" }

  # --- edit ---
  - { key: A, mods: [CTRL], icon: selectall.png, label: "Select all", source: "ms-fluent/Select All On (MIT), from word/" }
  - { key: X, mods: [CTRL], icon: cut.png,   label: Cut,   source: "ms-fluent/Cut (MIT), from word/" }
  - { key: C, mods: [CTRL], icon: copy.png,  label: Copy,  source: "ms-fluent/Copy (MIT), from word/" }
  - { key: V, mods: [CTRL], icon: paste.png, label: Paste, source: "ms-fluent/Clipboard Paste (MIT), from word/" }
  - { key: Z, mods: [CTRL], icon: undo.png,  label: Undo,  source: "ms-fluent/Arrow Undo (MIT), from word/" }
  - { key: Y, mods: [CTRL], icon: redo.png,  label: Redo,  source: "ms-fluent/Arrow Redo (MIT), from word/" }
  - { key: F, mods: [CTRL], icon: find.png,    label: Find,    source: "ms-fluent/Search (MIT), from word/" }
  - { key: H, mods: [CTRL], icon: replace.png, label: Replace, source: "ms-fluent/Arrow Swap (MIT), from word/" }

  # --- objects and text ---
  - { key: G, mods: [CTRL],        icon: group.png,   label: Group,   region: [40, 36], margin: 0, source: "ms-fluent/Group (MIT), from powerpoint/" }
  - { key: G, mods: [CTRL, SHIFT], icon: ungroup.png, label: Ungroup, region: [40, 36], margin: 0, source: "ms-fluent/Group Dismiss (MIT), from powerpoint/" }
  - { key: B, mods: [CTRL], icon: bold.png,      label: Bold,      source: "ms-fluent/Text Bold (MIT), from word/" }
  - { key: I, mods: [CTRL], icon: italic.png,    label: Italic,    source: "ms-fluent/Text Italic (MIT), from word/" }
  - { key: U, mods: [CTRL], icon: underline.png, label: Underline, source: "ms-fluent/Text Underline (MIT), from word/" }
