# PowerToys Run keycap overlays for PolyKybd (Windows only).
#
# PowerToys Run is the older PowerToys launcher window (default Alt+Space). It
# has focus while it is open, so these keys show only while it is in front.
#
# Shortcuts: "General keyboard shortcuts" on the PowerToys Run page,
# https://learn.microsoft.com/windows/powertoys/run (source:
# MicrosoftDocs/windows-dev-docs, hub/powertoys/run.md). The result keys work
# only on a result that offers that command (an app, a file). They always mean
# the same thing, so they are drawn.
#
# Icons: Microsoft Fluent UI System Icons (MIT), the same files as cmdpal.yaml.
# Program mark (ESC, all layers): the PowerToys logo, src/runner/svgs/icon.ico in
# microsoft/PowerToys (MIT). Run's own RunAsset.ico loses its magnifier at 1 bit.
#
# Not drawn: Tab (moves through results and their buttons), Esc (closes the
# window; the program mark is on ESC).
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/powertoys/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/powertoys/run.yaml --preview /tmp/ptrun_preview
app: powertoys_run
match: [powertoys]        # Windows cuts the .exe name at its first dot; overlay-mapping.poly.yaml gates on the title
output: powertoys_run_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

# The PowerToys logo redrawn as a 32x32 1-bit mark (`_powertoys_mark` in
# fetch_icons.py). A 32 px region copies it 1:1.
program_icon: powertoys_progmark.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  - { key: C,     mods: [CTRL],        icon: copypath.png,  label: "Copy path",                 source: "ms-fluent/Document Copy (MIT)" }
  - { key: ENTER, mods: [CTRL, SHIFT], icon: admin.png,     label: "Run as administrator",      source: "ms-fluent/Shield (MIT)" }
  - { key: U,     mods: [CTRL, SHIFT], icon: otheruser.png, label: "Run as other user",         source: "ms-fluent/Person Swap (MIT)" }
  - { key: E,     mods: [CTRL, SHIFT], icon: folder.png,    label: "Open containing folder",    source: "ms-fluent/Folder Open (MIT)" }
