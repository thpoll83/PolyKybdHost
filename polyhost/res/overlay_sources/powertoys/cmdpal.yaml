# PowerToys Command Palette keycap overlays for PolyKybd (Windows only).
#
# Command Palette is the PowerToys launcher window (default Win+Alt+Space). It
# has focus while it is open, so these keys show only while it is in front.
# The keys that open it, and the other PowerToys features, are global
# shortcuts: they act in every window and belong to the firmware's OS hints,
# not to a per-app set. See SOURCES.md.
#
# Shortcuts: the PowerToys source (MIT), not a docs page. Command Palette has
# no keyboard table on Microsoft Learn.
#   * window keys: src/modules/cmdpal/Microsoft.CmdPal.UI/Pages/ShellPage.xaml.cs
#   * result keys: src/modules/cmdpal/Microsoft.CmdPal.Common/Helpers/WellKnownKeyChords.cs
# The result keys work only on a result that offers that command (an app, a
# file). They always mean the same thing, so they are drawn.
#
# Icons: Microsoft Fluent UI System Icons (MIT). Program mark (ESC, all layers):
# Command Palette's OWN icon, Assets/Stable/icon.ico in microsoft/PowerToys (MIT).
#
# Not drawn:
#   Up/Down/PageUp/PageDown  list navigation, no icon needed
#   Alt+1..9                 numbered results; whether a press selects or runs
#                            the result is a setting, and the Dock shelf takes
#                            the same keys while it is shown
#   Backspace (empty search) goes back only when a setting is on
#   Alt+Down, Tab            expand the compact palette (layout, not an action)
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/powertoys/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/powertoys/cmdpal.yaml --preview /tmp/cmdpal_preview
app: powertoys_cmdpal
match: [microsoft]        # Windows cuts the .exe name at its first dot; overlay-mapping.poly.yaml gates on the title
output: powertoys_cmdpal_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

# Frame 64 of icon.ico (the 48 and 256 frames render the same bolt). luma t150
# keeps the bolt's two halves apart; alpha and luma t180 fill it into one blob.
program_icon: cmdpal_progmark.png
program_icon_mode: luma
program_icon_threshold: 150
program_icon_anchor: right
program_icon_region: [42, 34]

bindings:
  # --- no modifier ---------------------------------------------------------
  - { key: ENTER, mods: [],     icon: run.png,       label: "Run result",        source: "ms-fluent/Play (MIT)" }

  # --- Ctrl (primary R) ----------------------------------------------------
  - { key: ENTER, mods: [CTRL], icon: secondary.png, label: "Secondary action",  source: "ms-fluent/Arrow Enter (MIT)" }
  - { key: K,     mods: [CTRL], icon: more.png,      label: "More commands",     source: "ms-fluent/More Horizontal (MIT)" }
  - { key: COMMA, mods: [CTRL], icon: settings.png,  label: "Settings",          source: "ms-fluent/Settings (MIT)" }
  - { key: P,     mods: [CTRL], icon: pin.png,       label: "Pin / unpin",       source: "ms-fluent/Pin (MIT)" }

  # --- Alt (primary G) -----------------------------------------------------
  - { key: LEFT,  mods: [ALT],  icon: back.png,      label: "Back",              source: "ms-fluent/Arrow Left (MIT)" }
  - { key: HOME,  mods: [ALT],  icon: home.png,      label: "Home page",         source: "ms-fluent/Home (MIT)" }
  - { key: F,     mods: [ALT],  icon: filter.png,    label: "Filter",            source: "ms-fluent/Filter (MIT)" }

  # --- Ctrl+Shift (combo R) ------------------------------------------------
  - { key: ENTER, mods: [CTRL, SHIFT], icon: admin.png,     label: "Run as administrator", source: "ms-fluent/Shield (MIT)" }
  - { key: U,     mods: [CTRL, SHIFT], icon: otheruser.png, label: "Run as other user",    source: "ms-fluent/Person Swap (MIT)" }
  - { key: E,     mods: [CTRL, SHIFT], icon: folder.png,    label: "Open file location",   source: "ms-fluent/Folder Open (MIT)" }
  - { key: C,     mods: [CTRL, SHIFT], icon: copypath.png,  label: "Copy file path",       source: "ms-fluent/Document Copy (MIT)" }
  - { key: R,     mods: [CTRL, SHIFT], icon: console.png,   label: "Open in console",      source: "ms-fluent/Window Console (MIT)" }
