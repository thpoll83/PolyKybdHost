# GitHub Desktop shortcut overlays for PolyKybd (Windows and macOS). See SOURCES.md.
#
# The keys are the accelerators of the app's own menu
# (app/src/main-process/menu/build-default-menu.ts), checked against GitHub's
# "Keyboard shortcuts" page. `CMDCTRL` is Ctrl on Windows and Cmd on macOS,
# like Electron's CmdOrCtrl. A literal Ctrl in the menu (Ctrl+H, Ctrl+`) is
# Control on macOS too, so those lines use CTRL.
#
# Regenerate:
#   python polyhost/res/overlay_sources/githubdesktop/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/githubdesktop/bindings.yaml --preview /tmp/ghd_preview
app: githubdesktop
match: [githubdesktop, github desktop]
output: githubdesktop_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: github.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- application ---
  - { key: COMMA, mods: [CMDCTRL], label: "Settings" }
  - { key: F11, mods: [], icon: fullscreen.png, label: "Full screen", except: [macos] }
  - { key: EQUAL, mods: [CMDCTRL], label: "Zoom in" }
  - { key: MINUS, mods: [CMDCTRL], label: "Zoom out" }
  - { key: "0", mods: [CMDCTRL], icon: resetzoom.png, label: "Reset zoom" }
  - { key: "8", mods: [CMDCTRL], icon: narrower.png, label: "Narrower pane" }
  - { key: "9", mods: [CMDCTRL], icon: wider.png, label: "Wider pane" }
  - { key: I, mods: [CTRL, SHIFT], icon: devtools.png, label: "Developer tools", except: [macos] }
  - { key: I, mods: [ALT, GUI], icon: devtools.png, label: "Developer tools", only: [macos] }
  # --- repositories ---
  - { key: N, mods: [CMDCTRL], icon: newrepo.png, label: "New repository" }
  - { key: O, mods: [CMDCTRL], icon: addlocal.png, label: "Add local repository" }
  - { key: O, mods: [CMDCTRL, SHIFT], icon: clone.png, label: "Clone repository" }
  - { key: T, mods: [CMDCTRL], icon: repolist.png, label: "Repository list" }
  - { key: P, mods: [CMDCTRL], icon: push.png, label: "Push" }
  - { key: P, mods: [CMDCTRL, SHIFT], icon: pull.png, label: "Pull" }
  - { key: T, mods: [CMDCTRL, SHIFT], icon: fetch.png, label: "Fetch" }
  - { key: BSPC, mods: [CMDCTRL], icon: removerepo.png, label: "Remove repository" }
  - { key: G, mods: [CMDCTRL, SHIFT], icon: viewongithub.png, label: "View on GitHub" }
  - { key: GRAVE, mods: [CTRL], icon: shell.png, label: "Open in shell" }
  - { key: F, mods: [CMDCTRL, SHIFT], icon: showfolder.png, label: "Show in file manager" }
  - { key: A, mods: [CMDCTRL, SHIFT], icon: editor.png, label: "Open in editor" }
  - { key: A, mods: [CMDCTRL, SHIFT, ALT], icon: openwith.png, label: "Open with" }
  - { key: I, mods: [CMDCTRL], icon: issue.png, label: "Create issue" }
  - { key: W, mods: [CMDCTRL, SHIFT], icon: newworktree.png, label: "New worktree" }
  # --- view ---
  - { key: "1", mods: [CMDCTRL], icon: changes.png, label: "Changes" }
  - { key: "2", mods: [CMDCTRL], icon: history.png, label: "History" }
  - { key: B, mods: [CMDCTRL], icon: branches.png, label: "Branch list" }
  - { key: W, mods: [CMDCTRL, ALT], icon: worktrees.png, label: "Worktree list" }
  - { key: G, mods: [CMDCTRL], icon: summary.png, label: "Commit summary" }
  - { key: ENTER, mods: [CMDCTRL], icon: commit.png, label: "Commit" }
  - { key: H, mods: [CTRL], icon: stash.png, label: "Stashed changes" }
  - { key: L, mods: [CMDCTRL], icon: filter.png, label: "Changes filter" }
  - { key: F, mods: [CMDCTRL], label: "Find" }
  # --- branch ---
  - { key: N, mods: [CMDCTRL, SHIFT], icon: newbranch.png, label: "New branch" }
  - { key: R, mods: [CMDCTRL, SHIFT], icon: rename.png, label: "Rename branch" }
  - { key: D, mods: [CMDCTRL, SHIFT], icon: deletebranch.png, label: "Delete branch" }
  - { key: BSPC, mods: [CMDCTRL, SHIFT], icon: discard.png, label: "Discard all changes" }
  - { key: S, mods: [CMDCTRL, SHIFT], icon: stashall.png, label: "Stash all changes" }
  - { key: U, mods: [CMDCTRL, SHIFT], icon: update.png, label: "Update from default branch" }
  - { key: B, mods: [CMDCTRL, SHIFT], icon: compare.png, label: "Compare to branch" }
  - { key: M, mods: [CMDCTRL, SHIFT], icon: merge.png, label: "Merge into current branch" }
  - { key: H, mods: [CMDCTRL, SHIFT], icon: squash.png, label: "Squash and merge" }
  - { key: E, mods: [CMDCTRL, SHIFT], icon: rebase.png, label: "Rebase current branch" }
  - { key: C, mods: [CMDCTRL, SHIFT], icon: compareongithub.png, label: "Compare on GitHub" }
  - { key: B, mods: [CMDCTRL, ALT], icon: branchongithub.png, label: "View branch on GitHub" }
  - { key: P, mods: [CMDCTRL, ALT], icon: previewpr.png, label: "Preview pull request" }
  - { key: R, mods: [CMDCTRL], icon: pullrequest.png, label: "Pull request" }
