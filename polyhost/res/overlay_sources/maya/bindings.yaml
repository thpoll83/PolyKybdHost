  - { key: H, mods: [SHIFT], icon: show.png, label: "Show selection" }
  - { key: H, mods: [CTRL, SHIFT], icon: show_last.png, label: "Show last hidden" }
  - { key: H, mods: [ALT], icon: hide_others.png, label: "Hide unselected objects" }
  - { key: "1", mods: [CTRL], icon: localview.png, label: "Isolate select" }
  - { key: A, mods: [ALT], icon: rig_cycle.png, label: "Cycle rig display mode" }
  - { key: "1", mods: [ALT], icon: vis_curves.png, label: "NURBS curves visibility" }
