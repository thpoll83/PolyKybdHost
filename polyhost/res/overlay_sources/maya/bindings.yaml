  # --- view and panels ---
  - { key: A, mods: [], icon: frame_all.png, label: "Frame all" }
  - { key: A, mods: [SHIFT], icon: frame_all_views.png, label: "Frame all in all views" }
  - { key: F, mods: [], icon: zoomextsel.png, label: "Frame selected" }
