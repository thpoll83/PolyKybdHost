# Autodesk Maya shortcut overlays for PolyKybd (scene and viewport). See SOURCES.md.
#
# The keys are the Maya Default hotkey set as Autodesk's Maya 2026 help lists
# it (Keyboard Shortcuts: All Maya Hotkeys, Interface, Tool and action,
# Modeling and Animation hotkeys). Only the keys that act while a viewport or
# the scene has focus are drawn. The Graph Editor, Time Editor, Outliner,
# Render View and the Artisan paint tools give the same keys other meanings
# and are not drawn.
#
# A key held for a marking menu (Q / W / E / R / A held with the left mouse
# button) also works as a tap, and the tap action is drawn. Space is the
# exception: it shows the hotbox it opens when held.
# Keys that act only together with a mouse drag are left out (SOURCES.md).
#
# macOS: Autodesk's note says Alt = Option and Ctrl = Control on macOS, and the
# File and Edit rows read "Ctrl (or Cmd)". So every Ctrl chord stays CTRL on
# all three platforms, and the macOS set adds a Cmd copy of those ten File and
# Edit keys (`only: [macos]`).
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/maya/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/maya/bindings.yaml --preview /tmp/maya_preview
app: maya
match: [maya, maya.bin]
output: maya_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: maya.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- no modifier: tools ---
  - { key: Q, mods: [], icon: smartselect.png, label: "Select Tool" }
  - { key: W, mods: [], icon: move.png, label: "Move Tool" }
  - { key: E, mods: [], icon: rotate.png, label: "Rotate Tool" }
  - { key: R, mods: [], icon: scale.png, label: "Scale Tool" }
  - { key: T, mods: [], icon: manipulator.png, label: "Show manipulator" }
  - { key: Y, mods: [], icon: lasttool.png, label: "Last used tool" }
  - { key: ENTER, mods: [], icon: complete.png, label: "Complete current tool" }
  - { key: INSERT, mods: [], icon: pivot.png, label: "Tool edit mode / move pivot" }
  - { key: "=", mods: [], icon: gizmo_up.png, label: "Increase manipulator size" }
  - { key: "=", mods: [SHIFT], icon: gizmo_up.png, label: "Increase manipulator size" }
  - { key: "-", mods: [], icon: gizmo_down.png, label: "Decrease manipulator size" }
  - { key: TAB, mods: [], icon: tab_next.png, label: "Next In-View Editor value" }
  - { key: TAB, mods: [SHIFT], icon: tab_prev.png, label: "Previous In-View Editor value" }
  - { key: G, mods: [], icon: repeat.png, label: "Repeat last action" }
  - { key: G, mods: [SHIFT], icon: repeat_cursor.png, label: "Repeat at mouse position" }

  # --- snapping (held while moving) ---
  - { key: X, mods: [], icon: snap_grid.png, label: "Snap to grids (hold)" }
  - { key: C, mods: [], icon: snap_curve.png, label: "Snap to curves (hold)" }
  - { key: V, mods: [], icon: snap_point.png, label: "Snap to points (hold)" }
  - { key: J, mods: [], icon: quantize.png, label: "Tool step snapping (hold)" }
  - { key: J, mods: [SHIFT], icon: snap_relative.png, label: "Relative step snapping (hold)" }

  # --- selection ---
