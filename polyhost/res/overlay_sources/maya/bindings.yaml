  - { key: M, mods: [SHIFT], icon: panelmenu.png, label: "Panel menu bar" }
  - { key: M, mods: [CTRL, SHIFT], icon: paneltoolbar.png, label: "Panel toolbar" }
  - { key: M, mods: [ALT], icon: hotboxstyle.png, label: "Default hotbox style" }
  - { key: F2, mods: [], icon: set_modeling.png, label: "Modeling menu set" }
