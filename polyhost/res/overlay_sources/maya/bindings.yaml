  - { key: F9, mods: [], icon: sel_vert.png, label: "Select vertex" }
  - { key: F10, mods: [], icon: sel_edge.png, label: "Select edge" }
  - { key: F11, mods: [], icon: sel_face.png, label: "Select face" }
  - { key: F12, mods: [], icon: sel_uv.png, label: "Select UV" }
  - { key: F9, mods: [ALT], icon: sel_vertface.png, label: "Select vertex face" }
  - { key: F9, mods: [CTRL], icon: conv_vert.png, label: "Convert selection to vertices" }
  - { key: F10, mods: [CTRL], icon: conv_edge.png, label: "Convert selection to edges" }
  - { key: F11, mods: [CTRL], icon: conv_face.png, label: "Convert selection to faces" }
  - { key: F12, mods: [CTRL], icon: conv_uv.png, label: "Convert selection to UVs" }
  - { key: ",", mods: [SHIFT], icon: shrink.png, label: "Shrink selection" }
  - { key: ".", mods: [SHIFT], icon: grow.png, label: "Grow selection" }
  - { key: I, mods: [CTRL], icon: intermediate.png, label: "Next intermediate object" }
  - { key: UP, mods: [], icon: hier_parent.png, label: "Pick walk up" }
  - { key: DOWN, mods: [], icon: hier_child.png, label: "Pick walk down" }
  - { key: LEFT, mods: [], icon: select_left.png, label: "Pick walk left" }
  - { key: RIGHT, mods: [], icon: select_right.png, label: "Pick walk right" }
  - { key: UP, mods: [ALT], icon: nudge_up.png, label: "Move up one pixel" }
  - { key: DOWN, mods: [ALT], icon: nudge_down.png, label: "Move down one pixel" }
  - { key: LEFT, mods: [ALT], icon: nudge_left.png, label: "Move left one pixel" }
  - { key: RIGHT, mods: [ALT], icon: nudge_right.png, label: "Move right one pixel" }

  # --- edit ---
  - { key: P, mods: [], icon: parent.png, label: "Parent" }
  - { key: P, mods: [SHIFT], icon: parent_clear.png, label: "Unparent" }
  - { key: D, mods: [CTRL], icon: duplicate.png, label: "Duplicate" }
  - { key: D, mods: [SHIFT], icon: dup_transform.png, label: "Duplicate with transform" }
  - { key: D, mods: [CTRL, SHIFT], icon: dup_special.png, label: "Duplicate special" }
  - { key: G, mods: [CTRL], icon: group.png, label: "Group" }
  - { key: T, mods: [CTRL], icon: gizmo.png, label: "Universal manipulator" }
  - { key: Z, mods: [CTRL], icon: undo.png, label: Undo }
  - { key: Y, mods: [CTRL], icon: redo.png, label: Redo }
