# PhotoCraft shortcut overlays for PolyKybd.
#
# PhotoCraft (github.com/storytold/photocraft, MIT OR Apache-2.0) is the ArtCraft
# "Crafting Apps" Photoshop work-alike. It keeps Photoshop's default keymap, but
# the AUTHORITY here is PhotoCraft's own source, not Adobe's list: every binding
# below is a default the code actually dispatches (see SOURCES.md for file:line).
#
# Its shortcut strings are written "Cmd+..." and parsed to egui
# `Modifiers::COMMAND` (Cmd on macOS, Ctrl elsewhere), so every Cmd chord is
# CMDCTRL and the generator emits photocraft_template.* and _mac.*. No action is
# remapped on macOS (native_menu.rs moves the SYSTEM Hide/Minimize to Ctrl+Cmd+H
# and Ctrl+Cmd+M and drops Settings' Cmd+, instead) -> SOURCES.md "macOS".
#
# Icons: Fluent (MIT) house style; Material Symbols (Apache-2.0) for gaps; the
# Photoshop overlay's drawn tool glyphs are reused byte-identically for the same
# actions. Program icon (ESC): PhotoCraft's OWN kitsune icon (MIT OR Apache-2.0).
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/photocraft/fetch_icons.py
#   PYTHONPATH=. python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/photocraft/bindings.yaml --preview /tmp/photocraft_preview
app: photocraft
# Windows exe photocraft.exe, Linux binary `photocraft`, macOS bundle "PhotoCraft";
# Wayland app id / X11 WM_CLASS ai.storyteller.photocraft (main.rs APP_ID, .desktop).
match: [photocraft, ai.storyteller.photocraft]
output: photocraft_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

# The app's own .ico, 64 px frame. Sweep (frames 40/48/64/128/256 x bright
# 120..210 / luma 60..160): `bright` lights the paper-coloured figure, which at
# 40 px is a scatter of engraving strokes; `luma` < 110 lights only the ink.
# `luma` 140 lights the blue field and the ink, leaving the fox as a dark
# silhouette in a lit tile with both ears and the fanned tails readable; 125
# fills in the face, 160 starts breaking the tails. 64/128/256 render alike, so
# 64 is the smallest converged frame.
program_icon: photocraft.png
program_icon_mode: luma
program_icon_threshold: 140
program_icon_anchor: right
program_icon_region: [40, 40]
program_icon_margin: 0

