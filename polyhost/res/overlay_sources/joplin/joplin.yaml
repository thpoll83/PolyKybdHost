# Joplin desktop shortcut overlays for PolyKybd. See SOURCES.md.
# GENERATED by gen_specs.py from its table -- edit the table, not this file.
#
# Keys: Joplin's default keymap (packages/lib/services/KeymapService.ts,
# defaultKeymapItems) and the zoom items of packages/app-desktop/gui/MenuBar.tsx,
# tag v3.7.22. Windows and Linux share the `default` list; macOS has its own.
#
# Regenerate (from the repo root, with the project venv):
#   PYTHONPATH=. .venv/bin/python polyhost/res/overlay_sources/joplin/gen_specs.py
#   PYTHONPATH=. .venv/bin/python polyhost/res/overlay_sources/joplin/fetch_icons.py
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/joplin/joplin.yaml --preview /tmp/joplin_preview
app: joplin
match: [joplin]
output: joplin_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: joplin.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:

  - { key: N, mods: [CMDCTRL], icon: newnote.png, label: "New note" }
  - { key: T, mods: [CMDCTRL], icon: newtodo.png, label: "New to-do" }
  - { key: S, mods: [CMDCTRL], icon: sync.png, label: "Synchronise", concept: reload }
  - { key: N, mods: [CMDCTRL, ALT], icon: newwindow.png, label: "Open note in new window" }
  - { key: BSPC, mods: [GUI, ALT], icon: deletenote.png, label: "Permanently delete note", only: [macos] }
  - { key: T, mods: [CMDCTRL, ALT], icon: settags.png, label: "Set tags" }
  - { key: L, mods: [SHIFT, ALT], icon: linktonote.png, label: "Link to note" }
  - { key: E, mods: [CMDCTRL], icon: externaledit.png, label: "Edit in external editor" }
  - { key: W, mods: [CMDCTRL], icon: closewindow.png, label: "Close window" }
  - { key: Q, mods: [CTRL], icon: quit.png, label: "Quit", except: [macos] }
  - { key: COMMA, mods: [CMDCTRL], icon: settings.png, label: "Options" }
  - { key: F1, icon: help.png, label: "Help" }
  - { key: P, mods: [CMDCTRL], icon: gotoanything.png, label: "Goto Anything" }
  - { key: P, mods: [CMDCTRL, SHIFT], icon: commandpalette.png, label: "Command palette" }
  - { key: F6, icon: searchall.png, label: "Search all notes", concept: find, except: [macos] }
  - { key: F, mods: [GUI, SHIFT], icon: searchall.png, label: "Search all notes", concept: find, only: [macos] }
  - { key: F, mods: [CMDCTRL], icon: searchnote.png, label: "Search in note" }
  - { key: S, mods: [CMDCTRL, SHIFT], icon: focussidebar.png, label: "Focus sidebar" }
