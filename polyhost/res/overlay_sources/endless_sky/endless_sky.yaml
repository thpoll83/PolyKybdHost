# Endless Sky overlay for PolyKybd.
#
# Keys: the default key file keys.txt of endless-sky/endless-sky, release
# v0.11.4, and the keys source/MainPanel.cpp, source/Engine.cpp and
# source/AI.cpp read directly (zoom, fleet groups, the Shift variants).
# See SOURCES.md.
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/endless_sky/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/endless_sky/endless_sky.yaml --preview /tmp/endless_sky_preview
app: endless-sky
match: [endless-sky, endless sky, endless sky.exe, io.github.endless_sky.endless_sky]
output: endless_sky_template
icon_dir: icons
fit: contain
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150
# As for AoE2 and fheroes2: the icon uses the full height on the right; the
# firmware clears 3 px around it, so a letter legend stays whole.
anchor: right
region: [40, 40]
margin: 0

# "Endless" over "Sky" drawn over the whole cell, without the ESC legend
# (protocol v25).
program_icon: program.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0
program_icon_legend: false

bindings:

  # Flying
  - { key: UP, icon: forward.png, label: "Forward thrust" }
  - { key: LEFT, icon: turnleft.png, label: "Turn left" }
  - { key: RIGHT, icon: turnright.png, label: "Turn right" }
  - { key: DOWN, icon: reverse.png, label: "Reverse" }
  - { key: DOWN, mods: [SHIFT], icon: stop.png, label: "Stop the ship", shared: false }
  - { key: E, icon: autosteer.png, label: "Auto steer" }
  - { key: A, icon: afterburner.png, label: "Fire afterburner" }
  - { key: C, icon: cloak.png, label: "Toggle cloaking device" }
  - { key: KC_LEFT_ALT, icon: mouseturn.png, label: "Mouse turning (hold)" }

  # Weapons
  - { key: TAB, icon: primary.png, label: "Fire primary weapon" }
  - { key: Q, icon: secondary.png, label: "Fire secondary weapon" }
  - { key: W, icon: selectsecondary.png, label: "Select secondary weapon" }

  # Targets and other ships
  - { key: N, icon: nextship.png, label: "Select next ship" }
  - { key: N, mods: [SHIFT], icon: nextescort.png, label: "Select next escort" }
  - { key: R, icon: nearesthostile.png, label: "Select nearest hostile ship" }
  - { key: R, mods: [SHIFT], icon: nearestany.png, label: "Select nearest ship, friendly ones too" }
  - { key: V, icon: nearestasteroid.png, label: "Select nearest asteroid" }
  - { key: B, icon: board.png, label: "Board selected ship" }
  - { key: B, mods: [SHIFT], icon: repair.png, label: "Board an escort to repair it" }
  - { key: T, icon: hail.png, label: "Talk to selected ship" }
  - { key: S, icon: scan.png, label: "Scan selected ship" }

  # Travel
  - { key: L, icon: land.png, label: "Land on planet or station" }
  - { key: J, icon: jump.png, label: "Hyperspace jump" }
  - { key: J, mods: [SHIFT], icon: fleetjump.png, label: "Fleet jump" }

  # Fleet orders
  - { key: D, icon: deploy.png, label: "Deploy or recall fighters" }
  - { key: D, mods: [SHIFT], icon: forcedeploy.png, label: "Deploy fighters, damaged ones too" }
  - { key: F, icon: fight.png, label: "Fleet: fight my target" }
  - { key: Y, icon: holdfire.png, label: "Fleet: toggle hold fire" }
  - { key: G, icon: gather.png, label: "Fleet: gather around me" }
  - { key: G, mods: [SHIFT], icon: formation.png, label: "Fleet: next formation" }
  - { key: H, icon: holdposition.png, label: "Fleet: hold position" }
  - { key: U, icon: ammo.png, label: "Fleet: toggle ammo usage" }
  - { key: Z, icon: harvest.png, label: "Fleet: harvest flotsam" }

  # Fleet groups
  - { key: "1", icon: group1.png, label: "Select fleet group 1" }
  - { key: "2", icon: group2.png, label: "Select fleet group 2" }
  - { key: "3", icon: group3.png, label: "Select fleet group 3" }
  - { key: "4", icon: group4.png, label: "Select fleet group 4" }
  - { key: "5", icon: group5.png, label: "Select fleet group 5" }
  - { key: "6", icon: group6.png, label: "Select fleet group 6" }
  - { key: "7", icon: group7.png, label: "Select fleet group 7" }
  - { key: "8", icon: group8.png, label: "Select fleet group 8" }
  - { key: "9", icon: group9.png, label: "Select fleet group 9" }
  - { key: "0", icon: group0.png, label: "Select fleet group 0" }
  - { key: "1", mods: [SHIFT], icon: groupadd1.png, label: "Add fleet group 1 to the selection" }
  - { key: "2", mods: [SHIFT], icon: groupadd2.png, label: "Add fleet group 2 to the selection" }
  - { key: "3", mods: [SHIFT], icon: groupadd3.png, label: "Add fleet group 3 to the selection" }
  - { key: "4", mods: [SHIFT], icon: groupadd4.png, label: "Add fleet group 4 to the selection" }
  - { key: "5", mods: [SHIFT], icon: groupadd5.png, label: "Add fleet group 5 to the selection" }
  - { key: "6", mods: [SHIFT], icon: groupadd6.png, label: "Add fleet group 6 to the selection" }
  - { key: "7", mods: [SHIFT], icon: groupadd7.png, label: "Add fleet group 7 to the selection" }
  - { key: "8", mods: [SHIFT], icon: groupadd8.png, label: "Add fleet group 8 to the selection" }
  - { key: "9", mods: [SHIFT], icon: groupadd9.png, label: "Add fleet group 9 to the selection" }
  - { key: "0", mods: [SHIFT], icon: groupadd0.png, label: "Add fleet group 0 to the selection" }
  - { key: "1", mods: [CTRL], icon: groupset1.png, label: "Store fleet group 1" }
  - { key: "2", mods: [CTRL], icon: groupset2.png, label: "Store fleet group 2" }
  - { key: "3", mods: [CTRL], icon: groupset3.png, label: "Store fleet group 3" }
  - { key: "4", mods: [CTRL], icon: groupset4.png, label: "Store fleet group 4" }
  - { key: "5", mods: [CTRL], icon: groupset5.png, label: "Store fleet group 5" }
  - { key: "6", mods: [CTRL], icon: groupset6.png, label: "Store fleet group 6" }
  - { key: "7", mods: [CTRL], icon: groupset7.png, label: "Store fleet group 7" }
  - { key: "8", mods: [CTRL], icon: groupset8.png, label: "Store fleet group 8" }
  - { key: "9", mods: [CTRL], icon: groupset9.png, label: "Store fleet group 9" }
  - { key: "0", mods: [CTRL], icon: groupset0.png, label: "Store fleet group 0" }

  # Panels and the view
  - { key: M, icon: map.png, label: "View star map" }
  - { key: I, icon: info.png, label: "View player info" }
  - { key: "/", icon: messagelog.png, label: "View message log" }
  - { key: F1, icon: help.png, label: "Show help", region: [34, 40] }
  - { key: P, icon: pause.png, label: "Pause the game" }
  - { key: CAPS_LOCK, icon: fastforward.png, label: "Toggle fast-forward" }
  - { key: F3, icon: performance.png, label: "Toggle performance info", region: [34, 40] }
  - { key: F11, icon: fullscreen.png, label: "Toggle fullscreen", region: [21, 40] }
  - { key: "=", icon: zoomin.png, label: "Zoom the view in" }
  - { key: "-", icon: zoomout.png, label: "Zoom the view out" }
