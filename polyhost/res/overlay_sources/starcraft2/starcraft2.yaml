# Art read at runtime from the user's own StarCraft 1.16.1 files, when they are
# on the machine (polyhost/services/game_assets, reader starcraft). It replaces
# the shipped icon of the same name; nothing read from the game is committed.
# An entry keyed terran/protoss/zerg follows the "StarCraft Race" setting.
# A number is a unit id, the frame of unit\wirefram\wirefram.grp (BWAPI's
# UnitType list; see SOURCES.md). Groups 1 to 0:
#   terran: Marine, Firebat, Medic, Ghost, Vulture, Siege Tank, Goliath, Wraith, Battlecruiser, SCV
#   protoss: Zealot, Dragoon, High Templar, Dark Templar, Archon, Reaver, Corsair, Scout, Carrier, Probe
#   zerg: Zergling, Hydralisk, Lurker, Ultralisk, Mutalisk, Guardian, Queen, Defiler, Overlord, Drone
# F1 shows the race's worker, Backspace its town hall.
# Not checked against real StarCraft files.
game_assets:
  reader: starcraft
  icons:
    group1: {terran: {wireframe: 0}, protoss: {wireframe: 65}, zerg: {wireframe: 37}}
    group2: {terran: {wireframe: 32}, protoss: {wireframe: 66}, zerg: {wireframe: 38}}
    group3: {terran: {wireframe: 34}, protoss: {wireframe: 67}, zerg: {wireframe: 103}}
    group4: {terran: {wireframe: 1}, protoss: {wireframe: 61}, zerg: {wireframe: 39}}
    group5: {terran: {wireframe: 2}, protoss: {wireframe: 68}, zerg: {wireframe: 43}}
    group6: {terran: {wireframe: 5}, protoss: {wireframe: 83}, zerg: {wireframe: 44}}
    group7: {terran: {wireframe: 3}, protoss: {wireframe: 60}, zerg: {wireframe: 45}}
    group8: {terran: {wireframe: 8}, protoss: {wireframe: 70}, zerg: {wireframe: 46}}
    group9: {terran: {wireframe: 12}, protoss: {wireframe: 72}, zerg: {wireframe: 42}}
    group0: {terran: {wireframe: 7}, protoss: {wireframe: 64}, zerg: {wireframe: 41}}
    groupnew1: {plus: group1}
    groupnew2: {plus: group2}
    groupnew3: {plus: group3}
    groupnew4: {plus: group4}
    groupnew5: {plus: group5}
    groupnew6: {plus: group6}
    groupnew7: {plus: group7}
    groupnew8: {plus: group8}
    groupnew9: {plus: group9}
    groupnew0: {plus: group0}
    groupadd1: {mark: ring, of: group1}
    groupadd2: {mark: ring, of: group2}
    groupadd3: {mark: ring, of: group3}
    groupadd4: {mark: ring, of: group4}
    groupadd5: {mark: ring, of: group5}
    groupadd6: {mark: ring, of: group6}
    groupadd7: {mark: ring, of: group7}
    groupadd8: {mark: ring, of: group8}
    groupadd9: {mark: ring, of: group9}
    groupadd0: {mark: ring, of: group0}
    groupsteal1: {mark: box, of: group1}
    groupsteal2: {mark: box, of: group2}
    groupsteal3: {mark: box, of: group3}
    groupsteal4: {mark: box, of: group4}
    groupsteal5: {mark: box, of: group5}
    groupsteal6: {mark: box, of: group6}
    groupsteal7: {mark: box, of: group7}
    groupsteal8: {mark: box, of: group8}
    groupsteal9: {mark: box, of: group9}
    groupsteal0: {mark: box, of: group0}
    groupaddsteal1: {mark: disc, of: group1}
    groupaddsteal2: {mark: disc, of: group2}
    groupaddsteal3: {mark: disc, of: group3}
    groupaddsteal4: {mark: disc, of: group4}
    groupaddsteal5: {mark: disc, of: group5}
    groupaddsteal6: {mark: disc, of: group6}
    groupaddsteal7: {mark: disc, of: group7}
    groupaddsteal8: {mark: disc, of: group8}
    groupaddsteal9: {mark: disc, of: group9}
    groupaddsteal0: {mark: disc, of: group0}
    idleworker: {terran: {wireframe: 7}, protoss: {wireframe: 64}, zerg: {wireframe: 41}}
    bases: {terran: {wireframe: 106}, protoss: {wireframe: 154}, zerg: {wireframe: 131}}
