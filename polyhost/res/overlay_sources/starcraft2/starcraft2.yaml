# StarCraft II overlay for PolyKybd.
#
# Keys: the "Standard" hotkey profile (the game's default), as listed by the
# StarCraft wiki on Fandom and by Liquipedia. See SOURCES.md.
#
# Only keys that do the same thing whatever is selected are labelled. The
# letter keys alone train, build and cast, and their meaning changes with the
# selection, so they stay blank.
#
# Regenerate:
#   python polyhost/res/overlay_sources/starcraft2/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/starcraft2/starcraft2.yaml --preview /tmp/sc2_preview
app: starcraft2
match: [sc2_x64, sc2, sc2_x64.exe, sc2.exe, starcraft ii]
output: starcraft2_template
icon_dir: icons
fit: contain
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150
# As for AoE2, C&C and Warcraft III: the icon uses the full height on the
# right; the firmware clears 3 px around it, so a letter legend stays whole.
anchor: right
region: [40, 40]
margin: 0

# STARCRAFT II drawn over the whole cell, without the ESC legend (protocol v25).
program_icon: program.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0
program_icon_legend: false

bindings:

  # Control groups: digit selects, Ctrl+digit creates, Shift+digit adds the
  # selection, Alt+digit creates and takes the units out of their other groups,
  # Shift+Alt+digit adds and takes them out.
  - { key: "1", command: ControlGroupRecall1, icon: group1.png, label: "Select group 1", region: [48, 40], margin: 5 }
  - { key: "2", command: ControlGroupRecall2, icon: group2.png, label: "Select group 2", region: [48, 40], margin: 5 }
