  - { key: "1", mods: [CTRL], command: ControlGroupAssign1, icon: groupnew1.png, label: "Create group 1", region: [48, 40], margin: 5 }
  - { key: "2", mods: [CTRL], command: ControlGroupAssign2, icon: groupnew2.png, label: "Create group 2", region: [48, 40], margin: 5 }
