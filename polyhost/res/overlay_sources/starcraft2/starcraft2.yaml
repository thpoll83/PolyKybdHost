  - { key: "6", mods: [CTRL], command: ControlGroupAssign6, icon: groupnew6.png, label: "Create group 6", region: [48, 40], margin: 5 }
  - { key: "7", mods: [CTRL], command: ControlGroupAssign7, icon: groupnew7.png, label: "Create group 7", region: [48, 40], margin: 5 }
