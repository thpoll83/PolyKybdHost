  - { key: "4", mods: [ALT, SHIFT], icon: groupaddsteal4.png, label: "Add to group 4 and steal", region: [48, 40], margin: 5 }
  - { key: "5", mods: [ALT, SHIFT], icon: groupaddsteal5.png, label: "Add to group 5 and steal", region: [48, 40], margin: 5 }
  - { key: "6", mods: [ALT, SHIFT], icon: groupaddsteal6.png, label: "Add to group 6 and steal", region: [48, 40], margin: 5 }
  - { key: "7", mods: [ALT, SHIFT], icon: groupaddsteal7.png, label: "Add to group 7 and steal", region: [48, 40], margin: 5 }
  - { key: "8", mods: [ALT, SHIFT], icon: groupaddsteal8.png, label: "Add to group 8 and steal", region: [48, 40], margin: 5 }
