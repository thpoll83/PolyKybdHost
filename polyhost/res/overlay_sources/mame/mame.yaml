# MAME shortcut overlay for PolyKybd. See SOURCES.md.
#
# Keys are MAME's default UI and player 1 inputs, from src/emu/inpttype.ipp
# (mamedev/mame): the UI hotkeys (Tab menu, F5 pause, F6/F7 save and load state,
# F3 reset, F10 throttle, F11 FPS, F12 snapshot, Insert fast-forward), the coin,
# start, service and tilt inputs, and the player 1 buttons 1-6 (left Ctrl, left
# Alt, Space, left Shift, Z, X). Esc quits MAME and carries the mark. Every input
# can be changed in the Input settings of MAME's menu (Tab).
#
# Not drawn: the debugger, the record/zoom/paste UI keys used only inside menus,
# Scroll Lock (UI controls), which has no keycap cell, and the player 2-4 inputs.
#
# Regenerate:
#   PYTHONPATH=. .venv/bin/python polyhost/res/overlay_sources/mame/fetch_icons.py
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/mame/mame.yaml --preview /tmp/mame_preview
app: mame
match: [mame]
output: mame_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: alpha
threshold: 128

program_icon: mame.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # UI
  - { key: TAB, mods: [], icon: menu.png, label: Menu }
  - { key: F2, mods: [], icon: service.png, label: Service }
  - { key: F3, mods: [], icon: softreset.png, label: "Soft reset" }
  - { key: F3, mods: [SHIFT], icon: hardreset.png, label: "Hard reset" }
  - { key: F4, mods: [], icon: gfx.png, label: "Show graphics" }
  - { key: F4, mods: [SHIFT], icon: rewindstep.png, label: "Rewind one step" }
  - { key: F5, mods: [], icon: pause.png, label: Pause }
  - { key: F5, mods: [SHIFT], icon: step.png, label: "Pause and step" }
  - { key: F6, mods: [], icon: savestate.png, label: "Save state" }
  - { key: F6, mods: [SHIFT], icon: quicksave.png, label: "Quick save" }
  - { key: F7, mods: [], icon: loadstate.png, label: "Load state" }
  - { key: F7, mods: [SHIFT], icon: quickload.png, label: "Quick load" }
  - { key: F8, mods: [], icon: skipminus.png, label: "Frameskip down" }
  - { key: F8, mods: [SHIFT], icon: cheat.png, label: "Cheats on/off" }
  - { key: F9, mods: [], icon: skipplus.png, label: "Frameskip up" }
  - { key: F10, mods: [], icon: throttle.png, label: Throttle }
  - { key: F11, mods: [], icon: fps.png, label: "Show FPS", region: [46, 14], margin: 2 }
  - { key: F12, mods: [], icon: snapshot.png, label: Snapshot }
  - { key: F12, mods: [SHIFT], icon: recordmng.png, label: "Record MNG" }
  - { key: F12, mods: [CTRL, SHIFT], icon: recordavi.png, label: "Record AVI" }
  - { key: INSERT, mods: [], icon: fastfwd.png, label: "Fast-forward" }
  - { key: GRAVE, mods: [], icon: osd.png, label: "On-screen display" }
  - { key: T, mods: [], icon: tilt.png, label: Tilt }
  # Coin and start; drawn 1:1 at their own size
  - { key: "1", mods: [], icon: start1.png, label: "1 player start", region: [32, 15], margin: 2 }
  - { key: "2", mods: [], icon: start2.png, label: "2 players start", region: [33, 15], margin: 2 }
  - { key: "5", mods: [], icon: coin1.png, label: "Coin 1", region: [41, 15], margin: 2 }
  - { key: "6", mods: [], icon: coin2.png, label: "Coin 2", region: [49, 15], margin: 2 }
  # Player 1 buttons 1-6
  - { key: KC_LEFT_CTRL, mods: [], icon: button1.png, label: "P1 button 1", region: [32, 32], margin: 2 }
  - { key: KC_LEFT_ALT, mods: [], icon: button2.png, label: "P1 button 2", region: [32, 32], margin: 2 }
  - { key: SPACE, mods: [], icon: button3.png, label: "P1 button 3", region: [32, 32], margin: 2 }
  - { key: KC_LEFT_SHIFT, mods: [], icon: button4.png, label: "P1 button 4", region: [32, 32], margin: 2 }
  - { key: Z, mods: [], icon: button5.png, label: "P1 button 5", region: [32, 32], margin: 2 }
  - { key: X, mods: [], icon: button6.png, label: "P1 button 6", region: [32, 32], margin: 2 }
