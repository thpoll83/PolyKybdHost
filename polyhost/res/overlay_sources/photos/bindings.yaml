# Windows Photos shortcut overlays for PolyKybd.
#
# ⚠️ Photos is CLOSED SOURCE and Microsoft no longer publishes a shortcut table
# for it -- the old "Keyboard shortcuts in apps" support page that carried the
# Photos/Maps/Voice Recorder tables has been folded into the general Windows
# shortcuts page and the per-app tables are gone (checked 2026-09-14). So the
# same rule as the `notepad` overlay applies: **every binding below is one that
# TWO independent references agree on**, and anything only one claims is recorded
# in SOURCES.md as unverified rather than guessed at. A wrong icon is worse than
# no icon, because the user believes it.
#
# ✅ One binding has a THIRD, first-party witness: `F5` = start slideshow was
# harvested from the live app by our own UIA probe and is in the field
# daemon_log.txt (2026-09-14) as `F5 'Start slideshow'`. That is the app itself
# agreeing with both references.
#
# Regenerate:
#   python polyhost/res/overlay_sources/photos/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/photos/bindings.yaml --preview /tmp/photos
app: photos
match: [photos]
output: photos_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha

# No `program_icon:` -- `photos: mdi:image-multiple` in app_icons.yaml already
# resolves (the process really is Photos.exe), and a baked mark would WIN over it
# and never let the generic upload.

bindings:
  # --- no modifier --------------------------------------------------------
  - { key: F5, mods: [], icon: slides.png, label: "Start slideshow" }

  # --- Ctrl ---------------------------------------------------------------
  - { key: R, mods: [CTRL], icon: rotate.png,  label: "Rotate the photo" }
  - { key: S, mods: [CTRL], icon: save.png,    label: "Save" }
  - { key: P, mods: [CTRL], icon: print.png,   label: "Print" }
  - { key: C, mods: [CTRL], icon: copy.png,    label: "Copy" }
  - { key: Z, mods: [CTRL], icon: undo.png,    label: "Undo" }
  - { key: Y, mods: [CTRL], icon: redo.png,    label: "Redo" }
  - { key: L, mods: [CTRL], icon: lock.png,    label: "Set as lock screen" }
  - { key: "/", mods: [CTRL], icon: original.png, label: "View the original" }
  # ⚠️ US-LAYOUT ASSUMPTION, the same one calc's `@ # !` entries carry: zoom is
  # bound to the CHARACTER + and -, so it lands wherever the layout puts them.
  - { key: EQUAL, mods: [CTRL], icon: zoomin.png,  label: "Zoom in" }
  - { key: MINUS, mods: [CTRL], icon: zoomout.png, label: "Zoom out" }
  - { key: "0",   mods: [CTRL], icon: zoomrst.png, label: "Reset the zoom" }

  # --- Ctrl+arrows: move the crop / selective-focus area -------------------
  - { key: LEFT,  mods: [CTRL], icon: cropmove.png, label: "Move the crop area" }
  - { key: RIGHT, mods: [CTRL], icon: cropmove.png, label: "Move the crop area" }
  - { key: UP,    mods: [CTRL], icon: cropmove.png, label: "Move the crop area" }
  - { key: DOWN,  mods: [CTRL], icon: cropmove.png, label: "Move the crop area" }

  # --- Shift+arrows: resize the crop / selective-focus area ----------------
  - { key: LEFT,  mods: [SHIFT], icon: cropsize.png, label: "Resize the crop area" }
  - { key: RIGHT, mods: [SHIFT], icon: cropsize.png, label: "Resize the crop area" }
  - { key: UP,    mods: [SHIFT], icon: cropsize.png, label: "Resize the crop area" }
  - { key: DOWN,  mods: [SHIFT], icon: cropsize.png, label: "Resize the crop area" }

  # --- Alt -----------------------------------------------------------------
  - { key: ENTER, mods: [ALT], icon: info.png, label: "View file info" }

  # ⚠️ DELIBERATELY NOT DRAWN, each for a stated reason:
  #   * Enhance -- the two references DISAGREE (`Ctrl+E` vs a bare `E`), so
  #     there is no binding both support. Flagged, not guessed.
  #   * `Ctrl+N` new album / `Ctrl+R` remove album -- one reference only, and
  #     the second directly CONTRADICTS the twice-corroborated `Ctrl+R` = rotate.
  #   * `Win+H` (share) -- the overlay format drops GUI-key layers entirely.
  #   * `Esc` (back / stop slideshow) -- the program mark owns ESC on every
  #     overlay here.
  #   * bare Spacebar / Enter / arrow keys -- no modifier, and the keycap already
  #     shows the key.
