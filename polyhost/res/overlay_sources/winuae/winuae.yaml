# WinUAE shortcut overlay for PolyKybd. See SOURCES.md.
#
# Keys are WinUAE's default keys that need no End qualifier, from the first
# key table in od-win32/keyboard_win32.cpp (tonioni/WinUAE, master, read
# 2026-11-06). F12 is the GUI key while the default "GUI key" setting is in
# use. Not drawn: every End+key shortcut (disk images, state dialogs, warp,
# volume), because End is not a modifier the keyboard can show, and the
# keypad keys, which have no keycap cell. Windows only: WinUAE has no other
# build.
#
# Regenerate:
#   PYTHONPATH=. .venv/bin/python polyhost/res/overlay_sources/winuae/fetch_icons.py
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/winuae/winuae.yaml --preview /tmp/winuae_preview
app: winuae
match: [winuae, winuae64]
output: winuae_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: alpha
threshold: 128

program_icon: winuae.png
program_icon_mode: alpha
program_icon_region: [37, 32]
program_icon_anchor: right
program_icon_margin: 0

bindings:
  - { key: F12, mods: [], icon: gui.png, label: "Settings" }
  - { key: F12, mods: [SHIFT], icon: debugger.png, label: "Debugger" }
  - { key: F12, mods: [CTRL], icon: fullscreen.png, label: "Full screen / window" }
  - { key: PGUP, mods: [], icon: freeze.png, label: "Cartridge freeze" }
  - { key: PSCR, mods: [], icon: screenshot.png, label: "Screenshot to clipboard" }
  - { key: PAUSE, mods: [], icon: pause.png, label: "Pause" }
