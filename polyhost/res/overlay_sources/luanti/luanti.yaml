# Luanti (formerly Minetest) overlay for PolyKybd.
#
# Keys: the `keymap_*` defaults in src/defaultsettings.cpp of luanti-org/luanti,
# release 5.18.0. See SOURCES.md.
#
# Every key here does the same thing whatever the player holds. Sneak is Left
# Shift and is held while the player moves, so movement, jump and the hotbar
# slots are drawn on the Shift layer as well. The icons that Luanti shares with
# Minecraft are the pictures of ../minecraft/, in the same 2 px block style.
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/luanti/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/luanti/luanti.yaml --preview /tmp/luanti_preview
app: luanti
match: [luanti, minetest, org.luanti.luanti, net.minetest.minetest]
output: luanti_template
icon_dir: icons
fit: contain
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150
# As for the other game sets: the icon uses the full height on the right; the
# firmware clears 3 px around it, so a letter legend stays whole.
anchor: right
region: [40, 40]
margin: 0

# LUANTI drawn over the whole cell, without the ESC legend (protocol v25).
program_icon: program.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0
program_icon_legend: false

bindings:

  # Movement (keymap_forward, _left, _backward, _right, _jump), also on the
  # Shift (sneak) layer
  - { key: W, icon: forward.png, label: "Walk forward" }
  - { key: A, icon: left.png, label: "Strafe left" }
  - { key: S, icon: back.png, label: "Walk backward" }
  - { key: D, icon: right.png, label: "Strafe right" }
  - { key: SPACE, icon: jump.png, label: "Jump" }
  - { key: W, mods: [SHIFT], icon: forward.png, label: "Walk forward" }
  - { key: A, mods: [SHIFT], icon: left.png, label: "Strafe left" }
  - { key: S, mods: [SHIFT], icon: back.png, label: "Walk backward" }
  - { key: D, mods: [SHIFT], icon: right.png, label: "Strafe right" }
  - { key: SPACE, mods: [SHIFT], icon: jump.png, label: "Jump" }

  # Sneak (keymap_sneak, Left Shift): on the key itself, without and with it held
  - { key: KC_LEFT_SHIFT, icon: sneak.png, label: "Sneak", region: [34, 40] }
  - { key: KC_LEFT_SHIFT, mods: [SHIFT], icon: sneak.png, label: "Sneak", region: [34, 40] }

  # Aux1 (keymap_aux1) and the movement modes
  - { key: E, icon: aux1.png, label: "Aux1" }
  - { key: K, icon: fly.png, label: "Fly mode on / off" }
  - { key: J, icon: sprint.png, label: "Fast mode on / off" }
  - { key: H, icon: noclip.png, label: "Noclip mode on / off" }

  # Hotbar slots 1 to 10 (keymap_slot1 .. keymap_slot10), next and previous
  - { key: "1", icon: slot1.png, label: "Hotbar slot 1" }
  - { key: "2", icon: slot2.png, label: "Hotbar slot 2" }
  - { key: "3", icon: slot3.png, label: "Hotbar slot 3" }
  - { key: "4", icon: slot4.png, label: "Hotbar slot 4" }
  - { key: "5", icon: slot5.png, label: "Hotbar slot 5" }
  - { key: "6", icon: slot6.png, label: "Hotbar slot 6" }
  - { key: "7", icon: slot7.png, label: "Hotbar slot 7" }
  - { key: "8", icon: slot8.png, label: "Hotbar slot 8" }
  - { key: "9", icon: slot9.png, label: "Hotbar slot 9" }
  - { key: "0", icon: slot10.png, label: "Hotbar slot 10" }
  - { key: "1", mods: [SHIFT], icon: slot1.png, label: "Hotbar slot 1" }
  - { key: "2", mods: [SHIFT], icon: slot2.png, label: "Hotbar slot 2" }
  - { key: "3", mods: [SHIFT], icon: slot3.png, label: "Hotbar slot 3" }
  - { key: "4", mods: [SHIFT], icon: slot4.png, label: "Hotbar slot 4" }
  - { key: "5", mods: [SHIFT], icon: slot5.png, label: "Hotbar slot 5" }
  - { key: "6", mods: [SHIFT], icon: slot6.png, label: "Hotbar slot 6" }
  - { key: "7", mods: [SHIFT], icon: slot7.png, label: "Hotbar slot 7" }
  - { key: "8", mods: [SHIFT], icon: slot8.png, label: "Hotbar slot 8" }
  - { key: "9", mods: [SHIFT], icon: slot9.png, label: "Hotbar slot 9" }
  - { key: "0", mods: [SHIFT], icon: slot10.png, label: "Hotbar slot 10" }
  - { key: N, icon: hotbarnext.png, label: "Next hotbar item" }
  - { key: B, icon: hotbarprev.png, label: "Previous hotbar item" }

  # Inventory
  - { key: I, icon: inventory.png, label: "Open / close inventory" }
  - { key: Q, icon: drop.png, label: "Drop item" }

  # Chat
  - { key: T, icon: chat.png, label: "Open chat" }
  - { key: "/", icon: command.png, label: "Open command" }
  - { key: DOT, icon: localcommand.png, label: "Local command" }
  - { key: F10, icon: console.png, label: "Large chat console" }
  - { key: F2, icon: togglechat.png, label: "Chat on / off", region: [34, 40] }

  # View
  - { key: Z, icon: zoom.png, label: "Zoom" }
  - { key: V, icon: minimap.png, label: "Minimap mode" }
  - { key: C, icon: perspective.png, label: "Camera mode" }
  - { key: EQUAL, icon: rangeup.png, label: "View range up" }
  - { key: MINUS, icon: rangedown.png, label: "View range down" }
  - { key: F1, icon: hidehud.png, label: "HUD on / off", region: [34, 40] }
  - { key: F3, icon: fog.png, label: "Fog on / off" }

  # Sound, tools and window
  - { key: M, icon: mute.png, label: "Mute" }
  - { key: F5, icon: debug.png, label: "Debug info", region: [34, 40] }
  - { key: F6, icon: profiler.png, label: "Profiler", region: [34, 40] }
  - { key: F11, icon: fullscreen.png, label: "Toggle fullscreen" }
  - { key: F12, icon: screenshot.png, label: "Take screenshot" }
