# SQL Server Management Studio (Windows, `Ssms.exe`) shortcut overlays for PolyKybd.
#
# ONE artwork set, Windows only: SSMS exists only for Windows. Every chord is
# the literal Windows chord of the default keyboard scheme.
#
# Every chord was checked against Microsoft Learn, "SQL Server Management
# Studio Keyboard Shortcuts"
# (https://learn.microsoft.com/ssms/sql-server-management-studio-keyboard-shortcuts,
# ms.date 2025-10-30), read on 2026-11-05. Two-stroke chords (Ctrl+K, Ctrl+C;
# Ctrl+K, Ctrl+U; Ctrl+M, Ctrl+M; ...) cannot be drawn on one keycap and are
# left out, as in ../visualstudio. Ctrl+E is not on the page and is left out.
# See SOURCES.md.
#
# Regenerate (from the repo root, with the project venv):
#   PYTHONPATH=. .venv/bin/python polyhost/res/overlay_sources/ssms/fetch_icons.py
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/ssms/bindings.yaml --preview /tmp/ssms_preview
app: ssms
match: [ssms]
output: ssms_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

# Drawn substitute mark (database cylinder), see fetch_icons.draw_mark().
program_icon: ssms.png
program_icon_mode: alpha
program_icon_region: [40, 36]
program_icon_anchor: bottom-right
program_icon_margin: 0

bindings:
  # ============================ query ==========================================
  - { key: F5,  mods: [],                   icon: execute.png,         label: "Execute",                    source: "ms-fluent/Play (MIT)" }
  - { key: F5,  mods: [CTRL],               icon: parse.png,           label: "Parse",                      source: "ms-fluent/Checkmark Square (MIT)" }
  - { key: L,   mods: [CTRL],               icon: estimatedplan.png,   label: "Estimated execution plan",   source: "ms-fluent/Flowchart (MIT)" }
  - { key: M,   mods: [CTRL],               icon: actualplan.png,      label: "Include actual plan",        source: "ms-fluent/Flowchart Circle (MIT)" }
  - { key: D,   mods: [CTRL],               icon: resultsgrid.png,     label: "Results to grid",            source: "ms-fluent/Table (MIT)" }
  - { key: T,   mods: [CTRL],               icon: resultstext.png,     label: "Results to text",            source: "ms-fluent/Text Align Left (MIT)" }
  - { key: F,   mods: [CTRL, SHIFT],        icon: resultsfile.png,     label: "Results to file",            source: "ms-fluent/Document Arrow Down (MIT)" }
  - { key: R,   mods: [CTRL],               icon: resultspane.png,     label: "Show/hide results pane",     source: "ms-fluent/Panel Bottom (MIT)" }
  - { key: F6,  mods: [],                   icon: togglepane.png,      label: "Query / results pane",       source: "material-symbols/swap_vert (Apache-2.0)" }
  - { key: M,   mods: [CTRL, SHIFT],        icon: templateparams.png,  label: "Template parameters",        source: "ms-fluent/Braces Variable (MIT)" }
  - { key: C,   mods: [CTRL, SHIFT],        icon: copywithheaders.png, label: "Copy with headers",          source: "ms-fluent/Table Copy (MIT)" }
  - { key: Q,   mods: [CTRL, SHIFT],        icon: querydesigner.png,   label: "Query Designer",             source: "ms-fluent/Table Edit (MIT)" }
  - { key: R,   mods: [CTRL, SHIFT],        icon: refreshcache.png,    label: "Refresh IntelliSense cache", concept: reload, source: "ms-fluent/Arrow Sync (MIT)" }
  - { key: N,   mods: [CTRL],               icon: newquery.png,        label: "New query",                  source: "ms-fluent/Window New (MIT)" }
  - { key: F12, mods: [CTRL, SHIFT],        icon: nexterror.png,       label: "Next error",                 source: "ms-fluent/Error Circle (MIT)" }
  # Default Query Shortcuts (Tools > Options > Environment > Keyboard > Query Shortcuts).
  - { key: F1,  mods: [ALT],                icon: sphelp.png,          label: "sp_help",                    source: "ms-fluent/Info (MIT)" }
  - { key: "1", mods: [CTRL],               icon: spwho.png,           label: "sp_who",                     source: "ms-fluent/People (MIT)" }
  - { key: "2", mods: [CTRL],               icon: splock.png,          label: "sp_lock",                    source: "ms-fluent/Lock Closed (MIT)" }

  # ============================ tool windows ===================================
  - { key: F8,  mods: [],                   icon: objectexplorer.png,    label: "Object Explorer",          source: "ms-fluent/Server (MIT)" }
  - { key: F7,  mods: [],                   icon: objectdetails.png,     label: "Object Explorer Details",  source: "ms-fluent/Apps List Detail (MIT)" }
  - { key: G,   mods: [CTRL, ALT],          icon: registeredservers.png, label: "Registered Servers",       source: "ms-fluent/Server Multiple (MIT)" }
  - { key: T,   mods: [CTRL, ALT],          icon: templateexplorer.png,  label: "Template Explorer",        source: "material-symbols/library_books (Apache-2.0)" }
  - { key: L,   mods: [CTRL, ALT],          icon: solutionexplorer.png,  label: "Solution Explorer",        source: "material-symbols/account_tree (Apache-2.0)" }
  - { key: C,   mods: [CTRL, ALT],          icon: copilot.png,           label: "Copilot",                  source: "ms-fluent/Sparkle (MIT)" }
  - { key: F4,  mods: [],                   icon: properties.png,        label: "Properties window",        source: "ms-fluent/Wrench (MIT)" }
  - { key: O,   mods: [CTRL, ALT],          icon: output.png,            label: "Output window",            source: "ms-fluent/Window Text (MIT)" }
  - { key: X,   mods: [CTRL, ALT],          icon: toolbox.png,           label: "Toolbox",                  source: "ms-fluent/Toolbox (MIT)" }
  - { key: R,   mods: [CTRL, ALT],          icon: browser.png,           label: "Browser window",           source: "ms-fluent/Globe (MIT)" }
  - { key: A,   mods: [CTRL, ALT],          icon: activitymonitor.png,   label: "Activity Monitor",         source: "ms-fluent/Pulse (MIT)" }
  - { key: P,   mods: [CTRL, ALT],          icon: profiler.png,          label: "SQL Server Profiler",      source: "material-symbols/monitoring (Apache-2.0)" }
  - { key: TAB, mods: [CTRL],               icon: nextdocument.png,      label: "Next document window",     source: "ms-fluent/Tabs (MIT)" }
  - { key: ENTER, mods: [ALT, SHIFT],       label: Fullscreen }
  - { key: F4,  mods: [CTRL],               label: Close }

  # ============================ files / projects ===============================
  - { key: N,   mods: [CTRL, ALT],          label: New }
  - { key: N,   mods: [CTRL, SHIFT],        icon: newproject.png,        label: "New project",              source: "ms-fluent/Folder Add (MIT)" }
  - { key: O,   mods: [CTRL],               label: Open }
  - { key: O,   mods: [CTRL, SHIFT],        icon: openproject.png,       label: "Open project",             source: "ms-fluent/Folder Arrow Right (MIT)" }
  - { key: A,   mods: [CTRL, SHIFT],        icon: addnewitem.png,        label: "Add new item",             source: "material-symbols/library_add (Apache-2.0)" }
  - { key: S,   mods: [CTRL],               label: Save }
  - { key: S,   mods: [CTRL, SHIFT],        icon: saveall.png,           label: "Save all",                 source: "ms-fluent/Save Multiple (MIT)" }
  - { key: P,   mods: [CTRL],               label: Print }
  # F2 renames the selected object in Solution Explorer (the page's
  # "Solution Explorer keyboard shortcuts" table).
  - { key: F2,  mods: [],                   icon: rename.png,            label: Rename,                     source: "ms-fluent/Rename (MIT)" }

  # ============================ editing ========================================
  - { key: Z,   mods: [CTRL],               label: Undo }
  - { key: Y,   mods: [CTRL],               label: Redo }
  - { key: Z,   mods: [CTRL, SHIFT],        label: Redo }
  - { key: X,   mods: [CTRL],               label: Cut }
  - { key: C,   mods: [CTRL],               label: Copy }
  - { key: V,   mods: [CTRL],               label: Paste }
  - { key: A,   mods: [CTRL],               label: "Select all" }
  - { key: V,   mods: [CTRL, SHIFT],        icon: clipboardring.png,     label: "Cycle clipboard ring",     source: "ms-fluent/Clipboard Multiple (MIT)" }
  - { key: W,   mods: [CTRL],               icon: selectword.png,        label: "Select word",              source: "material-symbols/match_word (Apache-2.0)" }
  - { key: G,   mods: [CTRL],               label: "Go to" }
  - { key: U,   mods: [CTRL, SHIFT],        icon: uppercase.png,         label: "Uppercase",                source: "material-symbols/uppercase (Apache-2.0)" }
  - { key: L,   mods: [CTRL, SHIFT],        icon: lowercase.png,         label: "Lowercase",                source: "material-symbols/lowercase (Apache-2.0)" }
  - { key: ENTER, mods: [CTRL],             icon: lineopenabove.png,     label: "Open line above",          source: "material-symbols/add_row_above (Apache-2.0)" }
  - { key: ENTER, mods: [CTRL, SHIFT],      icon: lineopenbelow.png,     label: "Open line below",          source: "material-symbols/add_row_below (Apache-2.0)" }
  - { key: T,   mods: [ALT, SHIFT],         icon: movelinedown.png,      label: "Move line down",           source: "material-symbols/move_down (Apache-2.0)" }
  - { key: DELETE, mods: [CTRL, SHIFT],     icon: clearall.png,          label: "Delete all text",          source: "ms-fluent/Eraser (MIT)" }
  - { key: "-", mods: [CTRL],               icon: navback.png,           label: "Navigate backward",        source: "ms-fluent/Arrow Left (MIT)" }
  - { key: "-", mods: [CTRL, SHIFT],        icon: navforward.png,        label: "Navigate forward",         source: "ms-fluent/Arrow Right (MIT)" }

  # ============================ search =========================================
  - { key: F,   mods: [CTRL],               label: Find }
  - { key: H,   mods: [CTRL],               label: Replace }
  - { key: H,   mods: [CTRL, SHIFT],        icon: replaceinfiles.png,    label: "Replace in files",         source: "ms-fluent/Folder Swap (MIT)" }
  - { key: F3,  mods: [],                   label: "Find next" }

  # ============================ help ===========================================
  - { key: F1,  mods: [],                   label: Help }
  - { key: F1,  mods: [CTRL],               icon: documentation.png,     label: "SQL Server documentation", source: "ms-fluent/Book Open (MIT)" }
