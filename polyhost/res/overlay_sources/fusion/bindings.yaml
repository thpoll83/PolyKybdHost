# Autodesk Fusion (formerly Fusion 360) shortcut overlays for PolyKybd (Windows
# and macOS; Fusion has no Linux version).
#
# Shortcuts: Fusion help, "Fusion keyboard shortcuts reference", which gives the
# Windows and the Mac key side by side for the global keys.
#   CMDCTRL          Ctrl on Windows, Cmd on macOS.
#   ALT              Alt on Windows, Option on macOS (the same key).
#   only: / except:  Redo is Ctrl+Y on Windows and Cmd+Shift+Z on macOS; the
#                    keys the reference gives for Windows only are `except:
#                    [macos]`.
#
# ⚠️ Every workspace runs in one window of one process, so the host cannot tell
# them apart. This set has the global keys and the Design workspace keys,
# including the sketch keys, which share no letter with the Design keys. Most
# letters mean something else in the other workspaces (E is Settings in
# Simulation). See SOURCES.md.
#
# Regenerate:
#   python polyhost/res/overlay_sources/fusion/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/fusion/bindings.yaml --preview /tmp/fusion_preview
app: fusion
match: [fusion360, autodesk fusion, autodesk fusion 360]
output: fusion_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

bindings:
  # --- file and edit ---
  - { key: N, mods: [CMDCTRL], label: New }
  - { key: O, mods: [CMDCTRL], label: Open }
  - { key: S, mods: [CMDCTRL], label: Save }
  - { key: S, mods: [CMDCTRL, SHIFT], icon: recoverysave.png, label: "Recovery save" }
  - { key: Z, mods: [CMDCTRL], label: Undo }
  - { key: Y, mods: [CTRL], label: Redo, except: [macos] }
  - { key: Z, mods: [CMDCTRL, SHIFT], label: Redo, only: [macos] }
  - { key: X, mods: [CMDCTRL], label: Cut }
  - { key: C, mods: [CMDCTRL], label: Copy }
  - { key: V, mods: [CMDCTRL], label: Paste }
  - { key: DEL, mods: [], label: Delete }

  # --- panels and layout ---
  - { key: V, mods: [CMDCTRL, ALT], icon: viewcube.png, label: "Show/hide ViewCube" }
  - { key: B, mods: [CMDCTRL, ALT], icon: browser.png, label: "Show/hide browser" }
  - { key: A, mods: [CMDCTRL, ALT], icon: comments.png, label: "Show/hide comments" }
  - { key: C, mods: [CMDCTRL, ALT], icon: textcmds.png, label: "Show/hide text commands" }
  - { key: N, mods: [CMDCTRL, ALT], icon: navbar.png, label: "Show/hide navigation bar" }
  - { key: P, mods: [CMDCTRL, ALT], icon: datapanel.png, label: "Show/hide data panel" }
  - { key: R, mods: [CMDCTRL, ALT], icon: resetlayout.png, label: "Reset layout" }
  - { key: TAB, mods: [CTRL], icon: nexttab.png, label: "Next document tab", except: [macos] }
  - { key: LBRACKET, mods: [CTRL], icon: prevws.png, label: "Previous workspace", except: [macos] }
  - { key: RBRACKET, mods: [CTRL], icon: nextws.png, label: "Next workspace", except: [macos] }
  - { key: H, mods: [SHIFT], icon: assistant.png, label: "Autodesk Assistant", except: [macos] }

  # --- Design workspace ---
  - { key: E, mods: [], icon: extrude.png, label: Extrude }
  - { key: H, mods: [], icon: hole.png, label: Hole }
  - { key: Q, mods: [], icon: presspull.png, label: "Press pull" }
  - { key: F, mods: [], icon: fillet.png, label: Fillet }
  - { key: M, mods: [], icon: move.png, label: Move }
  - { key: V, mods: [], icon: visibility.png, label: "Toggle visibility" }
  - { key: N, mods: [SHIFT], icon: compcolors.png, label: "Component colors" }
  - { key: S, mods: [], icon: toolbox.png, label: Toolbox }
  - { key: A, mods: [], icon: appearance.png, label: Appearance }
  - { key: J, mods: [], icon: joint.png, label: Joint }
  - { key: J, mods: [SHIFT], icon: asbuilt.png, label: "As-built joint" }
  - { key: I, mods: [], icon: measure.png, label: Measure }
  - { key: S, mods: [SHIFT], icon: scripts.png, label: "Scripts and add-ins" }
  - { key: "1", mods: [], icon: selwindow.png, label: "Window selection" }
  - { key: "2", mods: [], icon: selfree.png, label: "Freeform selection" }
  - { key: "3", mods: [], icon: selpaint.png, label: "Paint selection" }
  - { key: B, mods: [CMDCTRL], icon: computeall.png, label: "Compute all" }

  # --- sketch ---
  - { key: L, mods: [], icon: line.png, label: Line }
  - { key: R, mods: [], icon: rectangle.png, label: Rectangle }
  - { key: C, mods: [], icon: circle.png, label: Circle }
  - { key: T, mods: [], icon: trim.png, label: Trim }
  - { key: O, mods: [], icon: offset.png, label: Offset }
  - { key: P, mods: [], icon: project.png, label: Project }
  - { key: X, mods: [], icon: construction.png, label: "Construction line" }
  - { key: D, mods: [], icon: dimension.png, label: "Sketch dimension" }
