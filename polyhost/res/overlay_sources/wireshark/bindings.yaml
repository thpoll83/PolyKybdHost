# Wireshark (Qt GUI) shortcut overlays for PolyKybd. See SOURCES.md.
#
# Keys: every shortcut property in ui/qt/wireshark_main_window.ui and the
# QKeySequence assignments in wireshark_main_window*.cpp at tag v4.6.9 (the
# shortcut set is the same from v4.4.0 to master). Qt shows Ctrl as Cmd on
# macOS, so those rows use `CMDCTRL`. Qt's "Meta" is the physical Control key
# on macOS, and Wireshark binds next/previous packet in conversation and reset
# colorization to Meta there, which is plain `CTRL` on every platform.
#
# Regenerate:
#   python polyhost/res/overlay_sources/wireshark/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/wireshark/bindings.yaml --preview /tmp/wireshark_preview
app: wireshark
match: [wireshark]
output: wireshark_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: wireshark.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [40, 34]
program_icon_margin: 0

bindings:
  # --- File ---
  - { key: O, mods: [CMDCTRL], label: "Open" }
  - { key: W, mods: [CMDCTRL], icon: fileclose.png, label: "Close file" }
  - { key: S, mods: [CMDCTRL], label: "Save" }
  - { key: S, mods: [CMDCTRL, SHIFT], label: "Save as" }
  - { key: X, mods: [CMDCTRL, SHIFT], icon: export.png, label: "Export packet bytes" }
  - { key: P, mods: [CMDCTRL], label: "Print" }
  - { key: Q, mods: [CMDCTRL], label: "Quit" }

  # --- Edit ---
  - { key: C, mods: [CMDCTRL], label: "Copy" }
  - { key: C, mods: [CMDCTRL, SHIFT], icon: copyfilter.png, label: "Copy as filter", mode: alpha, region: [40, 40] }
  - { key: D, mods: [CMDCTRL, ALT, SHIFT], icon: copydesc.png, label: "Copy description", mode: alpha, region: [40, 40] }
  - { key: F, mods: [CMDCTRL, ALT, SHIFT], icon: copyname.png, label: "Copy field name", mode: alpha, region: [40, 40] }
  - { key: V, mods: [CMDCTRL, ALT, SHIFT], icon: copyvalue.png, label: "Copy value", mode: alpha, region: [40, 40] }
  - { key: A, mods: [CMDCTRL, ALT, SHIFT], icon: copyall.png, label: "Copy all visible items", mode: alpha, region: [40, 40] }
  - { key: F, mods: [CMDCTRL], label: "Find" }
  - { key: N, mods: [CMDCTRL], icon: findnext.png, label: "Find next", mode: alpha, region: [40, 40] }
  - { key: B, mods: [CMDCTRL], icon: findprev.png, label: "Find previous", mode: alpha, region: [40, 40] }
  - { key: M, mods: [CMDCTRL], icon: mark.png, label: "Mark packet" }
  - { key: M, mods: [CMDCTRL, SHIFT], icon: markall.png, label: "Mark all displayed", mode: alpha, region: [40, 40] }
  - { key: M, mods: [CMDCTRL, ALT], icon: unmarkall.png, label: "Unmark all displayed", mode: alpha, region: [40, 40] }
  - { key: N, mods: [CMDCTRL, SHIFT], icon: marknext.png, label: "Next mark", mode: alpha, region: [40, 40] }
  - { key: B, mods: [CMDCTRL, SHIFT], icon: markprev.png, label: "Previous mark", mode: alpha, region: [40, 40] }
  - { key: D, mods: [CMDCTRL], icon: ignore.png, label: "Ignore packet" }
  - { key: D, mods: [CMDCTRL, SHIFT], icon: ignoreall.png, label: "Ignore all displayed", mode: alpha, region: [40, 40] }
  - { key: D, mods: [CMDCTRL, ALT], icon: unignoreall.png, label: "Unignore all displayed", mode: alpha, region: [40, 40] }
  - { key: T, mods: [CMDCTRL], icon: timeref.png, label: "Time reference" }
  - { key: T, mods: [CMDCTRL, ALT], icon: untimeall.png, label: "Unset all time references", mode: alpha, region: [40, 40] }
  - { key: N, mods: [CMDCTRL, ALT], icon: timenext.png, label: "Next time reference", mode: alpha, region: [40, 40] }
  - { key: B, mods: [CMDCTRL, ALT], icon: timeprev.png, label: "Previous time reference", mode: alpha, region: [40, 40] }
  - { key: T, mods: [CMDCTRL, SHIFT], icon: timeshift.png, label: "Time shift" }
  - { key: C, mods: [CMDCTRL, ALT], icon: comment.png, label: "Packet comment" }
  - { key: A, mods: [CMDCTRL, SHIFT], icon: profiles.png, label: "Configuration profiles" }
  - { key: P, mods: [CTRL, SHIFT], except: [macos], icon: prefs.png, label: "Preferences" }
  - { key: COMMA, mods: [GUI], only: [macos], icon: prefs.png, label: "Preferences" }

  # --- View ---
  - { key: EQUAL, mods: [CMDCTRL], label: "Zoom in" }
  - { key: MINUS, mods: [CMDCTRL], label: "Zoom out" }
  - { key: "0", mods: [CMDCTRL], icon: zoomreset.png, label: "Normal size" }
  - { key: F11, except: [macos], icon: fullscreen.png, label: "Full screen" }
  - { key: F, mods: [CTRL, GUI], only: [macos], icon: fullscreen.png, label: "Full screen" }
  - { key: W, mods: [CMDCTRL, SHIFT], icon: resetlayout.png, label: "Reset layout" }
  - { key: R, mods: [CMDCTRL, SHIFT], icon: resizecols.png, label: "Resize columns" }
  - { key: "1", mods: [CMDCTRL, ALT], icon: fmt1.png, label: "Time: date and time of day", mode: alpha, region: [40, 40] }
  - { key: "2", mods: [CMDCTRL, ALT], icon: fmt2.png, label: "Time: time of day", mode: alpha, region: [40, 40] }
  - { key: "3", mods: [CMDCTRL, ALT], icon: fmt3.png, label: "Time: seconds since 1970", mode: alpha, region: [40, 40] }
  - { key: "4", mods: [CMDCTRL, ALT], icon: fmt4.png, label: "Time: since first packet", mode: alpha, region: [40, 40] }
  - { key: "5", mods: [CMDCTRL, ALT], icon: fmt5.png, label: "Time: since previous captured", mode: alpha, region: [40, 40] }
  - { key: "6", mods: [CMDCTRL, ALT], icon: fmt6.png, label: "Time: since previous displayed", mode: alpha, region: [40, 40] }
  - { key: "7", mods: [CMDCTRL, ALT], icon: fmt7.png, label: "Time: UTC date and time", mode: alpha, region: [40, 40] }
  - { key: "8", mods: [CMDCTRL, ALT], icon: fmt8.png, label: "Time: UTC time of day", mode: alpha, region: [40, 40] }
  - { key: RIGHT, mods: [SHIFT], icon: subexpand.png, label: "Expand subtrees" }
  - { key: LEFT, mods: [SHIFT], icon: subcollapse.png, label: "Collapse subtrees" }
  - { key: RIGHT, mods: [CMDCTRL], icon: expandall.png, label: "Expand all" }
  - { key: LEFT, mods: [CMDCTRL], icon: collapseall.png, label: "Collapse all" }
  - { key: "1", mods: [CMDCTRL], icon: colorize.png, label: "Colorize conversation 1" }
  - { key: "2", mods: [CMDCTRL], icon: colorize.png, label: "Colorize conversation 2" }
  - { key: "3", mods: [CMDCTRL], icon: colorize.png, label: "Colorize conversation 3" }
  - { key: "4", mods: [CMDCTRL], icon: colorize.png, label: "Colorize conversation 4" }
  - { key: "5", mods: [CMDCTRL], icon: colorize.png, label: "Colorize conversation 5" }
  - { key: "6", mods: [CMDCTRL], icon: colorize.png, label: "Colorize conversation 6" }
  - { key: "7", mods: [CMDCTRL], icon: colorize.png, label: "Colorize conversation 7" }
  - { key: "8", mods: [CMDCTRL], icon: colorize.png, label: "Colorize conversation 8" }
  - { key: "9", mods: [CMDCTRL], icon: colorize.png, label: "Colorize conversation 9" }
  - { key: SPACE, mods: [CTRL], icon: resetcolor.png, label: "Reset colorization" }
  - { key: R, mods: [CMDCTRL], icon: reload.png, label: "Reload or restart capture" }
  - { key: F, mods: [CMDCTRL, SHIFT], icon: reloadfmt.png, label: "Reload as file format", mode: alpha, region: [40, 40] }

  # --- Go ---
  - { key: G, mods: [CMDCTRL], icon: goto.png, label: "Go to packet" }
  - { key: DOWN, mods: [CMDCTRL], icon: nextpacket.png, label: "Next packet" }
  - { key: UP, mods: [CMDCTRL], icon: prevpacket.png, label: "Previous packet" }
  - { key: F8, icon: nextpacket.png, label: "Next packet" }
  - { key: F7, icon: prevpacket.png, label: "Previous packet" }
  - { key: DOT, mods: [CTRL], icon: convnext.png, label: "Next packet in conversation", mode: alpha, region: [40, 40] }
  - { key: COMMA, mods: [CTRL], icon: convprev.png, label: "Previous packet in conversation", mode: alpha, region: [40, 40] }
  - { key: RIGHT, mods: [ALT], icon: histfwd.png, label: "Next in history" }
  - { key: LEFT, mods: [ALT], icon: histback.png, label: "Previous in history" }
  - { key: HOME, mods: [CMDCTRL], icon: first.png, label: "First packet" }
  - { key: END, mods: [CMDCTRL], icon: last.png, label: "Last packet" }
  - { key: SLASH, mods: [CMDCTRL], icon: filter.png, label: "Display filter" }

  # --- Capture ---
  - { key: K, mods: [CMDCTRL], icon: capoptions.png, label: "Capture options" }
  - { key: E, mods: [CMDCTRL], icon: capstart.png, label: "Start or stop capture" }
  - { key: F5, icon: refreshif.png, label: "Refresh interfaces" }

  # --- Analyze, Statistics, Help ---
  - { key: I, mods: [CMDCTRL, SHIFT], icon: applycol.png, label: "Apply as column" }
  - { key: E, mods: [CMDCTRL, SHIFT], icon: protocols.png, label: "Enabled protocols" }
  - { key: U, mods: [CMDCTRL, SHIFT], icon: decodeas.png, label: "Decode as" }
  - { key: L, mods: [CMDCTRL, SHIFT], icon: reloadlua.png, label: "Reload Lua plugins", mode: alpha, region: [40, 40] }
  - { key: T, mods: [CMDCTRL, ALT, SHIFT], icon: followtcp.png, label: "Follow TCP stream", mode: alpha, region: [40, 40] }
  - { key: U, mods: [CMDCTRL, ALT, SHIFT], icon: followudp.png, label: "Follow UDP stream", mode: alpha, region: [40, 40] }
  - { key: E, mods: [CMDCTRL, ALT, SHIFT], icon: followdccp.png, label: "Follow DCCP stream", mode: alpha, region: [40, 40] }
  - { key: S, mods: [CMDCTRL, ALT, SHIFT], icon: followtls.png, label: "Follow TLS stream", mode: alpha, region: [40, 40] }
  - { key: H, mods: [CMDCTRL, ALT, SHIFT], icon: followhttp.png, label: "Follow HTTP stream", mode: alpha, region: [40, 40] }
  - { key: O, mods: [CMDCTRL, SHIFT], icon: bytes.png, label: "Show packet bytes" }
  - { key: C, mods: [CMDCTRL, ALT, SHIFT], icon: fileprops.png, label: "Capture file properties" }
  - { key: F1, label: "Help" }
