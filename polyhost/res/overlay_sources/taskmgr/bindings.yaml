# Task Manager shortcut overlays for PolyKybd.
#
# ⚠️ The THINNEST overlay in this set, and that is the APP rather than a gap in
# the research: Windows 11 Task Manager has five documented in-app shortcuts.
# `Ctrl+Shift+Esc` -- the one everybody knows -- OPENS Task Manager and does
# nothing once you are in it, so it is deliberately not drawn: an icon for it
# would be an instruction the focused window cannot obey.
#
# Icons: Microsoft Fluent UI System Icons (MIT). Program mark (ESC, all layers):
# the shared license-clean letter tile -- the real icon is Microsoft trademark art.
#
# Regenerate:
#   python polyhost/res/overlay_sources/taskmgr/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/taskmgr/bindings.yaml --preview /tmp/taskmgr_preview
app: taskmgr
match: [taskmgr]
output: taskmgr_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: taskmgr.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [42, 34]
program_icon_margin: 0

bindings:
  # --- Alt (primary G channel) ------------------------------------------
  - { key: E, mods: [ALT], icon: endtask.png,    label: "End task",        source: "ms-fluent/Dismiss Square (MIT)" }
  - { key: N, mods: [ALT], icon: newtask.png,    label: "Run new task",    source: "ms-fluent/Add Square (MIT)" }
  - { key: V, mods: [ALT], icon: efficiency.png, label: "Efficiency mode", source: "ms-fluent/Leaf One (MIT)" }

  # --- Ctrl / Ctrl+Shift ------------------------------------------------
  - { key: TAB, mods: [CTRL],        icon: nextpage.png, label: "Next page",     source: "ms-fluent/Arrow Right (MIT)" }
  - { key: TAB, mods: [CTRL, SHIFT], icon: prevpage.png, label: "Previous page", source: "ms-fluent/Arrow Left (MIT)" }
