# Thunderbird compose window shortcut overlays for PolyKybd (Windows, Linux and
# macOS). The main window has its own spec, main.yaml.
#
# The compose window runs in the same process as the main window and is told
# apart by its title, "Write: <subject> - Thunderbird" in English. gen_titles.py
# writes that prefix in every language Thunderbird ships into the mapping.
#
# Shortcuts: the Thunderbird 153 ESR source (messengercompose.xhtml and its
# DTD/FTL files). See SOURCES.md.
#   CMDCTRL          Ctrl on Windows/Linux, Cmd on macOS ("accel").
#   only: / except:  Redo (Ctrl+Y on Windows, Ctrl+Shift+Z elsewhere), Delete
#                    (Backspace on macOS), F7 spelling (Windows only), and the
#                    keys macOS lacks or takes for itself (Ctrl+H, F2, Cmd+Space).
#
# Regenerate:
#   python polyhost/res/overlay_sources/thunderbird/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/thunderbird/compose.yaml --preview /tmp/tbc_preview
app: thunderbird-compose
match: [thunderbird]
output: thunderbird_compose_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

bindings:
  # --- message ---
  - { key: ENTER, mods: [CMDCTRL], icon: send.png, label: Send }
  - { key: ENTER, mods: [CMDCTRL, SHIFT], icon: sendlater.png, label: "Send later" }
  - { key: S, mods: [CMDCTRL], icon: savedraft.png, label: "Save draft" }
  - { key: N, mods: [CMDCTRL], icon: newmsg.png, label: "New message" }
  - { key: W, mods: [CMDCTRL], label: Close }
  - { key: P, mods: [CMDCTRL], label: Print }
  - { key: "1", mods: [CMDCTRL], icon: mainwin.png, label: "Main window" }
  - { key: F1, mods: [], icon: help.png, label: Help, except: [macos] }
  - { key: SLASH, mods: [GUI, SHIFT], icon: help.png, label: Help, only: [macos] }

  # --- edit ---
  - { key: Z, mods: [CMDCTRL], label: Undo }
  - { key: Y, mods: [CTRL], label: Redo, only: [windows] }
  - { key: Z, mods: [CMDCTRL, SHIFT], label: Redo, except: [windows] }
  - { key: X, mods: [CMDCTRL], label: Cut }
  - { key: C, mods: [CMDCTRL], label: Copy }
  - { key: V, mods: [CMDCTRL], label: Paste }
  - { key: A, mods: [CMDCTRL], label: "Select all" }
  - { key: O, mods: [CMDCTRL, SHIFT], icon: pastequote.png, label: "Paste as quotation" }
  - { key: V, mods: [CMDCTRL, SHIFT], icon: pasteplain.png, label: "Paste without formatting" }
  - { key: R, mods: [CMDCTRL], icon: rewrap.png, label: Rewrap }
  - { key: DEL, mods: [], label: Delete, except: [macos] }
  - { key: BSPC, mods: [], label: Delete, only: [macos] }
  - { key: F, mods: [CMDCTRL], label: Find }
  - { key: H, mods: [CTRL], label: Replace, except: [macos] }
  - { key: G, mods: [CMDCTRL], label: "Find next" }
  - { key: F3, mods: [], label: "Find next" }
  - { key: G, mods: [CMDCTRL, SHIFT], icon: findprev.png, label: "Find previous" }
  - { key: F3, mods: [SHIFT], icon: findprev.png, label: "Find previous" }
  - { key: P, mods: [CMDCTRL, SHIFT], icon: spell.png, label: "Check spelling" }
  - { key: F7, mods: [], icon: spell.png, label: "Check spelling", only: [windows] }

  # --- addressing and attachments ---
  - { key: T, mods: [CMDCTRL, SHIFT], icon: to.png, label: "To field" }
  - { key: C, mods: [CMDCTRL, SHIFT], icon: cc.png, label: "Cc field" }
  - { key: B, mods: [CMDCTRL, SHIFT], icon: bcc.png, label: "Bcc field" }
  - { key: F9, mods: [], icon: contacts.png, label: "Contacts sidebar" }
  - { key: A, mods: [CMDCTRL, SHIFT], icon: attach.png, label: "Attach file" }
  - { key: M, mods: [CMDCTRL, SHIFT], icon: attachpane.png, label: "Attachment pane" }
  - { key: X, mods: [CMDCTRL, SHIFT], icon: reorder.png, label: "Reorder attachments" }
  - { key: Y, mods: [ALT], icon: sortattach.png, label: "Sort attachments" }
  - { key: F2, mods: [], icon: rename.png, label: "Rename attachment", except: [macos] }

  # --- formatting ---
  - { key: B, mods: [CMDCTRL], label: Bold }
  - { key: I, mods: [CMDCTRL], label: Italic }
  - { key: U, mods: [CMDCTRL], label: Underline }
  - { key: T, mods: [CMDCTRL], icon: fixedwidth.png, label: "Fixed width" }
  - { key: RBRACKET, mods: [CMDCTRL], icon: indent.png, label: Indent }
  - { key: LBRACKET, mods: [CMDCTRL], icon: outdent.png, label: Outdent }
  - { key: Y, mods: [CMDCTRL, SHIFT], icon: clearstyle.png, label: "Remove text styles" }
  - { key: SPACE, mods: [CTRL], icon: clearstyle.png, label: "Remove text styles", except: [macos] }
  - { key: K, mods: [CMDCTRL], icon: link.png, label: "Insert link" }
  - { key: K, mods: [CMDCTRL, SHIFT], icon: unlink.png, label: "Remove links" }
  - { key: R, mods: [CMDCTRL, SHIFT], icon: anchors.png, label: "Remove anchors" }
  - { key: COMMA, mods: [CMDCTRL], icon: fontdown.png, label: "Smaller font" }
  - { key: COMMA, mods: [CMDCTRL, SHIFT], icon: fontdown.png, label: "Smaller font" }
  - { key: DOT, mods: [CMDCTRL], icon: fontup.png, label: "Larger font" }
  - { key: DOT, mods: [CMDCTRL, SHIFT], icon: fontup.png, label: "Larger font" }
  - { key: EQUAL, mods: [CMDCTRL], label: "Zoom in" }
  - { key: MINUS, mods: [CMDCTRL], label: "Zoom out" }
  - { key: "0", mods: [CMDCTRL], icon: zoomreset.png, label: "Reset zoom" }
