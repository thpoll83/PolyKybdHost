  - { key: LBRACKET, mods: [], icon: back.png, label: Back }
  - { key: "0", mods: [], icon: notags.png, label: "Remove all tags" }
  - { key: "1", mods: [], icon: tag1.png, label: "Tag 1" }
  - { key: "2", mods: [], icon: tag2.png, label: "Tag 2" }
  - { key: "3", mods: [], icon: tag3.png, label: "Tag 3" }
  - { key: "4", mods: [], icon: tag4.png, label: "Tag 4" }
  - { key: "5", mods: [], icon: tag5.png, label: "Tag 5" }
  - { key: "6", mods: [], icon: tag6.png, label: "Tag 6" }
  - { key: "7", mods: [], icon: tag7.png, label: "Tag 7" }
  - { key: "8", mods: [], icon: tag8.png, label: "Tag 8" }
  - { key: "9", mods: [], icon: tag9.png, label: "Tag 9" }
