# Thunderbird main window shortcut overlays for PolyKybd (Windows, Linux and
# macOS). The compose window has its own spec, compose.yaml.
#
# Shortcuts: the Thunderbird 153 ESR source (mainKeySet.inc.xhtml and the key
# letters in its DTD/FTL files). See SOURCES.md.
#   CMDCTRL          Ctrl on Windows/Linux, Cmd on macOS ("accel").
#   CTRL             literal Control everywhere (Control+Tab on macOS too).
#   only: / except:  the three platforms differ: Redo, the tab and Spaces digit
#                    keys (tabs Ctrl/Cmd+1..9, Alt+1..9 on Linux; Spaces Alt+1..5
#                    on Windows, Control+1..5 elsewhere), New message, Get
#                    messages, Move again, Delete and Help.
#
# The single keys (A archive, J junk, digits for tags, ...) work only while the
# message list or message pane has focus; a text field takes them first.
#
# Regenerate:
#   python polyhost/res/overlay_sources/thunderbird/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/thunderbird/main.yaml --preview /tmp/tb_preview
app: thunderbird
match: [thunderbird]
output: thunderbird_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

bindings:
  # --- messages ---
  - { key: N, mods: [CMDCTRL], icon: newmsg.png, label: "New message" }
  - { key: M, mods: [CMDCTRL], icon: newmsg.png, label: "New message", except: [macos] }
  - { key: M, mods: [CMDCTRL, SHIFT], icon: newmsg.png, label: "New message", only: [macos] }
  - { key: F5, mods: [], icon: getmsg.png, label: "Get messages" }
  - { key: F9, mods: [], icon: getmsg.png, label: "Get messages", only: [linux] }
  - { key: Y, mods: [GUI], icon: getmsg.png, label: "Get messages", only: [macos] }
  - { key: F5, mods: [SHIFT], icon: getall.png, label: "Get all messages" }
  - { key: F9, mods: [SHIFT], icon: getall.png, label: "Get all messages", only: [linux] }
  - { key: Y, mods: [GUI, SHIFT], icon: getall.png, label: "Get all messages", only: [macos] }
  - { key: R, mods: [CMDCTRL], icon: reply.png, label: Reply }
  - { key: R, mods: [CMDCTRL, SHIFT], icon: replyall.png, label: "Reply all" }
  - { key: L, mods: [CMDCTRL, SHIFT], icon: replylist.png, label: "Reply to list" }
  - { key: L, mods: [CMDCTRL], icon: forward.png, label: Forward }
  - { key: E, mods: [CMDCTRL], icon: editnew.png, label: "Edit as new" }
  - { key: O, mods: [CMDCTRL], icon: openmsg.png, label: "Open message" }
  - { key: O, mods: [CMDCTRL, SHIFT], icon: conversation.png, label: "Open in conversation" }
  - { key: M, mods: [CMDCTRL, SHIFT], icon: moveagain.png, label: "Move again", except: [macos] }
  - { key: M, mods: [CMDCTRL, ALT], icon: moveagain.png, label: "Move again", only: [macos] }
  - { key: S, mods: [CMDCTRL], icon: savefile.png, label: "Save as file" }
  - { key: P, mods: [CMDCTRL], label: Print }
  - { key: U, mods: [CMDCTRL], icon: source.png, label: "View source" }
  - { key: A, mods: [CMDCTRL, SHIFT], icon: selthread.png, label: "Select thread" }
  - { key: DEL, mods: [], label: Delete, except: [macos] }
  - { key: BSPC, mods: [], label: Delete, only: [macos] }
  - { key: DEL, mods: [SHIFT], icon: deleteperm.png, label: "Delete permanently", except: [macos] }
  - { key: BSPC, mods: [SHIFT], icon: deleteperm.png, label: "Delete permanently", only: [macos] }

  # --- edit ---
  - { key: Z, mods: [CMDCTRL], label: Undo }
  - { key: Y, mods: [CTRL], label: Redo, only: [windows] }
  - { key: Z, mods: [CMDCTRL, SHIFT], label: Redo, except: [windows] }
  - { key: X, mods: [CMDCTRL], label: Cut }
  - { key: C, mods: [CMDCTRL], label: Copy }
  - { key: V, mods: [CMDCTRL], label: Paste }
  - { key: A, mods: [CMDCTRL], label: "Select all" }

  # --- search ---
  - { key: F, mods: [CMDCTRL], label: Find }
  - { key: G, mods: [CMDCTRL], label: "Find next" }
  - { key: F3, mods: [], label: "Find next" }
  - { key: G, mods: [CMDCTRL, SHIFT], label: "Find previous", icon: findprev.png }
  - { key: F3, mods: [SHIFT], label: "Find previous", icon: findprev.png }
  - { key: K, mods: [CMDCTRL], icon: search.png, label: Search }
  - { key: K, mods: [CMDCTRL, SHIFT], icon: quickfilter.png, label: "Quick filter" }
  - { key: F, mods: [CMDCTRL, SHIFT], icon: searchmsgs.png, label: "Search messages" }

  # --- view and tools ---
  - { key: EQUAL, mods: [CMDCTRL], label: "Zoom in" }
  - { key: MINUS, mods: [CMDCTRL], label: "Zoom out" }
  - { key: "0", mods: [CMDCTRL], label: "Reset zoom", icon: zoomreset.png }
  - { key: F8, mods: [], icon: msgpane.png, label: "Message pane" }
  - { key: F11, mods: [], icon: todaypane.png, label: "Today pane" }
  - { key: F2, mods: [], icon: rename.png, label: "Rename folder", except: [macos] }
  - { key: F1, mods: [], icon: help.png, label: Help, except: [macos] }
  - { key: SLASH, mods: [GUI, SHIFT], icon: help.png, label: Help, only: [macos] }
  - { key: B, mods: [CMDCTRL, SHIFT], icon: addressbook.png, label: "Address book" }
  - { key: J, mods: [CMDCTRL], icon: savedfiles.png, label: "Saved files" }
  - { key: DEL, mods: [CMDCTRL, SHIFT], icon: history.png, label: "Clear recent history" }
  - { key: I, mods: [CMDCTRL], icon: newevent.png, label: "New event" }
  - { key: D, mods: [CMDCTRL], icon: newtask.png, label: "New task" }

  # --- tabs and windows ---
  - { key: W, mods: [CMDCTRL], label: Close }
  - { key: F4, mods: [CTRL], label: Close, except: [macos] }
  - { key: T, mods: [CMDCTRL, SHIFT], icon: reopentab.png, label: "Reopen closed tab" }
  - { key: TAB, mods: [CTRL], icon: nexttab.png, label: "Next tab" }
  - { key: TAB, mods: [CTRL, SHIFT], icon: prevtab.png, label: "Previous tab" }
  - { key: PGDN, mods: [CTRL], icon: nexttab.png, label: "Next tab" }
  - { key: PGUP, mods: [CTRL], icon: prevtab.png, label: "Previous tab" }
  - { key: LEFT, mods: [ALT], icon: back.png, label: Back, except: [macos] }
  - { key: RIGHT, mods: [ALT], icon: fwd.png, label: Forward, except: [macos] }
  - { key: LEFT, mods: [GUI], icon: back.png, label: Back, only: [macos] }
  - { key: RIGHT, mods: [GUI], icon: fwd.png, label: Forward, only: [macos] }
  - { key: "1", mods: [CMDCTRL], icon: tab1.png, label: "Tab 1", except: [linux] }
  - { key: "1", mods: [ALT], icon: tab1.png, label: "Tab 1", only: [linux] }
  - { key: "2", mods: [CMDCTRL], icon: tab2.png, label: "Tab 2", except: [linux] }
  - { key: "2", mods: [ALT], icon: tab2.png, label: "Tab 2", only: [linux] }
  - { key: "3", mods: [CMDCTRL], icon: tab3.png, label: "Tab 3", except: [linux] }
  - { key: "3", mods: [ALT], icon: tab3.png, label: "Tab 3", only: [linux] }
  - { key: "4", mods: [CMDCTRL], icon: tab4.png, label: "Tab 4", except: [linux] }
  - { key: "4", mods: [ALT], icon: tab4.png, label: "Tab 4", only: [linux] }
  - { key: "5", mods: [CMDCTRL], icon: tab5.png, label: "Tab 5", except: [linux] }
  - { key: "5", mods: [ALT], icon: tab5.png, label: "Tab 5", only: [linux] }
  - { key: "6", mods: [CMDCTRL], icon: tab6.png, label: "Tab 6", except: [linux] }
  - { key: "6", mods: [ALT], icon: tab6.png, label: "Tab 6", only: [linux] }
  - { key: "7", mods: [CMDCTRL], icon: tab7.png, label: "Tab 7", except: [linux] }
  - { key: "7", mods: [ALT], icon: tab7.png, label: "Tab 7", only: [linux] }
  - { key: "8", mods: [CMDCTRL], icon: tab8.png, label: "Tab 8", except: [linux] }
  - { key: "8", mods: [ALT], icon: tab8.png, label: "Tab 8", only: [linux] }
  - { key: "9", mods: [CMDCTRL], icon: tab9.png, label: "Last tab", except: [linux] }
  - { key: "9", mods: [ALT], icon: tab9.png, label: "Last tab", only: [linux] }

  # --- Spaces ---
  - { key: "1", mods: [ALT], icon: spacemail.png, label: "Mail", only: [windows] }
  - { key: "1", mods: [CTRL], icon: spacemail.png, label: "Mail", except: [windows] }
  - { key: "2", mods: [ALT], icon: spacecontacts.png, label: "Address book space", only: [windows] }
  - { key: "2", mods: [CTRL], icon: spacecontacts.png, label: "Address book space", except: [windows] }
  - { key: "3", mods: [ALT], icon: spacecalendar.png, label: "Calendar", only: [windows] }
  - { key: "3", mods: [CTRL], icon: spacecalendar.png, label: "Calendar", except: [windows] }
  - { key: "4", mods: [ALT], icon: spacetasks.png, label: "Tasks", only: [windows] }
  - { key: "4", mods: [CTRL], icon: spacetasks.png, label: "Tasks", except: [windows] }
  - { key: "5", mods: [ALT], icon: spacechat.png, label: "Chat", only: [windows] }
  - { key: "5", mods: [CTRL], icon: spacechat.png, label: "Chat", except: [windows] }

  # --- message list and message pane ---
  - { key: M, mods: [], icon: readunread.png, label: "Read/unread" }
  - { key: S, mods: [], icon: star.png, label: Star }
  - { key: J, mods: [], icon: junk.png, label: Junk }
  - { key: J, mods: [SHIFT], icon: notjunk.png, label: "Not junk" }
  - { key: C, mods: [SHIFT], icon: allread.png, label: "Mark all read" }
  - { key: R, mods: [], icon: threadread.png, label: "Mark thread read" }
  - { key: C, mods: [], icon: readbydate.png, label: "Mark read by date" }
  - { key: F, mods: [], icon: nextmsg.png, label: "Next message" }
  - { key: N, mods: [], icon: nextunread.png, label: "Next unread" }
  - { key: T, mods: [], icon: nextthread.png, label: "Next unread thread" }
  - { key: B, mods: [], icon: prevmsg.png, label: "Previous message" }
  - { key: P, mods: [], icon: prevunread.png, label: "Previous unread" }
  - { key: A, mods: [], icon: archive.png, label: Archive }
  - { key: W, mods: [], icon: watch.png, label: "Watch thread" }
  - { key: K, mods: [], icon: ignore.png, label: "Ignore thread" }
  - { key: K, mods: [SHIFT], icon: ignoresub.png, label: "Ignore subthread" }
