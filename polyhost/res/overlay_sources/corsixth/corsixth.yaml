# CorsixTH overlay for PolyKybd.
#
# Keys: the default hotkeys in new_hotkeys_defaults()
# (CorsixTH/Lua/config_finder.lua, CorsixTH v0.70.2). See SOURCES.md.
#
# Every default hotkey on a key with a cell is labelled. C, R and T open the
# same windows as F5, F6 and F4, and get the same icons.
#
# Regenerate:
#   python polyhost/res/overlay_sources/corsixth/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/corsixth/corsixth.yaml --preview /tmp/corsixth_preview
app: corsixth
match: [corsix-th, corsixth, corsixth.exe, com.corsixth.corsixth]
output: corsixth_template
icon_dir: icons
fit: contain
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150
# As for OpenTTD and OpenRCT2: the icon uses the full height on the right; the
# firmware clears 3 px around it, so a letter legend stays whole.
anchor: right
region: [40, 40]
margin: 0

# The logo's figure and the name drawn over the whole cell, without the ESC
# legend (protocol v25).
program_icon: program.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0
program_icon_legend: false

bindings:

  # Fullscreen windows
  - { key: F1, icon: bankmanager.png, label: "Bank manager", region: [34, 40] }
  - { key: F2, icon: bankstats.png, label: "Bank statement", region: [34, 40] }
  - { key: F3, icon: staff.png, label: "Staff management", region: [34, 40] }
  - { key: F4, icon: townmap_f4.png, label: "Town map", region: [30, 40] }
  - { key: F5, icon: casebook_f5.png, label: "Casebook", region: [30, 40] }
  - { key: F6, icon: research_f6.png, label: "Research", region: [30, 40] }
  - { key: F7, icon: status.png, label: "Status", region: [30, 40] }
  - { key: F8, icon: charts.png, label: "Charts", region: [34, 40] }
  - { key: F9, icon: policy.png, label: "Policy" }
  - { key: F10, icon: machines.png, label: "Machine menu" }
  - { key: T, icon: townmap.png, label: "Town map" }
  - { key: R, icon: research.png, label: "Research" }
  - { key: C, icon: casebook.png, label: "Casebook" }
  - { key: C, mods: [SHIFT], icon: casebook.png, label: "Casebook" }
  - { key: H, mods: [CTRL], icon: adviserhistory.png, label: "Adviser history" }

  # Bottom panel
  - { key: F, icon: buildroom.png, label: "Build room" }
  - { key: G, icon: furnish.png, label: "Furnish corridor" }
  - { key: V, icon: editroom.png, label: "Edit room" }
  - { key: B, icon: hire.png, label: "Hire staff" }
  - { key: M, icon: firstmessage.png, label: "Open the first message" }
  - { key: I, icon: info.png, label: "Toggle the information line" }
  - { key: J, icon: jukebox.png, label: "Jukebox" }

  # Hospital
  - { key: SPACE, icon: rotateobject.png, label: "Rotate object" }
  - { key: DEL, icon: sell.png, label: "Sell the picked-up item" }
  - { key: H, icon: gohome.png, label: "Send the patient home" }
  - { key: X, icon: transparent.png, label: "Transparent walls while held" }
  - { key: X, mods: [SHIFT], icon: toggletransparent.png, label: "Toggle transparent walls" }
  - { key: A, mods: [SHIFT], icon: adviser.png, label: "Toggle the adviser" }

  # Game speed
  - { key: P, icon: pause.png, label: "Pause" }
  - { key: "1", icon: speed1.png, label: "Game speed: slowest" }
  - { key: "2", icon: speed2.png, label: "Game speed: slower" }
  - { key: "3", icon: speed3.png, label: "Game speed: normal" }
  - { key: "4", icon: speed4.png, label: "Game speed: maximum" }
  - { key: "5", icon: speed5.png, label: "Game speed: and then some more" }
  - { key: Z, icon: speedup.png, label: "Speed up while held" }

  # View
  - { key: "=", icon: zoomin.png, label: "Zoom in", shared: false }
  - { key: "=", mods: [SHIFT], icon: zoominmore.png, label: "Zoom in more" }
  - { key: "-", icon: zoomout.png, label: "Zoom out", shared: false }
  - { key: "-", mods: [SHIFT], icon: zoomoutmore.png, label: "Zoom out more" }
  - { key: "0", icon: resetzoom.png, label: "Reset zoom" }

  # Sound
  - { key: A, mods: [ALT], icon: announcements.png, label: "Toggle announcements" }
  - { key: S, mods: [ALT], icon: sounds.png, label: "Toggle sounds" }
  - { key: M, mods: [ALT], icon: music.png, label: "Toggle music" }

  # Saving and the level
  - { key: S, mods: [SHIFT], icon: save.png, label: "Save menu", shared: false }
  - { key: L, mods: [SHIFT], icon: load.png, label: "Load menu", shared: false }
  - { key: S, mods: [ALT, SHIFT], icon: quicksave.png, label: "Quick save" }
  - { key: L, mods: [ALT, SHIFT], icon: quickload.png, label: "Quick load" }
  - { key: R, mods: [SHIFT], icon: restartlevel.png, label: "Restart the level" }
  - { key: Q, mods: [SHIFT], icon: quitlevel.png, label: "Quit the level" }

  # Dialogs and the program
  - { key: ENTER, icon: confirm.png, label: "Confirm" }
  - { key: E, icon: confirm.png, label: "Confirm" }
  - { key: Q, icon: closewindow.png, label: "Close the window" }
  - { key: ENTER, mods: [ALT], icon: fullscreen.png, label: "Toggle fullscreen" }
  - { key: F4, mods: [ALT], icon: exit.png, label: "Exit", region: [30, 40], shared: false }
  - { key: F10, mods: [SHIFT], icon: restart.png, label: "Restart the program" }
  - { key: F10, mods: [CTRL], icon: releasemouse.png, label: "Release the mouse" }
  - { key: S, mods: [CTRL], icon: screenshot.png, label: "Screenshot", shared: false }

  # Debug and cheats
  - { key: F11, icon: cheats.png, label: "Cheat window" }
  - { key: F12, icon: console.png, label: "Lua console" }
  - { key: D, mods: [SHIFT], icon: debugscript.png, label: "Run the debug script" }
  - { key: D, mods: [CTRL], icon: dumplog.png, label: "Dump the game log" }
  - { key: T, mods: [CTRL], icon: dumpstrings.png, label: "Dump the strings" }

  # Map positions
  - { key: "1", mods: [CTRL], icon: recall1.png, label: "Recall map position 1" }
  - { key: "2", mods: [CTRL], icon: recall2.png, label: "Recall map position 2" }
  - { key: "3", mods: [CTRL], icon: recall3.png, label: "Recall map position 3" }
  - { key: "4", mods: [CTRL], icon: recall4.png, label: "Recall map position 4" }
  - { key: "5", mods: [CTRL], icon: recall5.png, label: "Recall map position 5" }
  - { key: "6", mods: [CTRL], icon: recall6.png, label: "Recall map position 6" }
  - { key: "7", mods: [CTRL], icon: recall7.png, label: "Recall map position 7" }
  - { key: "8", mods: [CTRL], icon: recall8.png, label: "Recall map position 8" }
  - { key: "9", mods: [CTRL], icon: recall9.png, label: "Recall map position 9" }
  - { key: "0", mods: [CTRL], icon: recall0.png, label: "Recall map position 0" }
  - { key: "1", mods: [ALT], icon: store1.png, label: "Store map position 1" }
  - { key: "2", mods: [ALT], icon: store2.png, label: "Store map position 2" }
  - { key: "3", mods: [ALT], icon: store3.png, label: "Store map position 3" }
  - { key: "4", mods: [ALT], icon: store4.png, label: "Store map position 4" }
  - { key: "5", mods: [ALT], icon: store5.png, label: "Store map position 5" }
  - { key: "6", mods: [ALT], icon: store6.png, label: "Store map position 6" }
  - { key: "7", mods: [ALT], icon: store7.png, label: "Store map position 7" }
  - { key: "8", mods: [ALT], icon: store8.png, label: "Store map position 8" }
  - { key: "9", mods: [ALT], icon: store9.png, label: "Store map position 9" }
  - { key: "0", mods: [ALT], icon: store0.png, label: "Store map position 0" }
