# GridCraft shortcut overlays for PolyKybd (Windows/Linux and macOS).
#
# GridCraft (storytold/gridcraft, MIT OR Apache-2.0) is an egui spreadsheet that
# imitates Excel. The AUTHORITY is its own keymap, not Excel's:
#   crates/ui-egui/src/ribbon.rs  `shortcut()`   plain Cmd/Ctrl letters (needs m.command)
#   crates/ui-egui/src/keymap.rs  `lookup()`     everything else, checked FIRST
#   crates/ui-egui/src/grid.rs    `keyboard()`   F2/F9/Alt+F8/Delete/Home/Ctrl+Home/End/PgUp/PgDn
#   crates/ui-egui/src/formula_bar.rs           F4 (cycle reference while editing)
#   crates/ui-egui/src/keytips.rs               F10 (key tips)
# Source commit and file:line per group: SOURCES.md.
#
# egui modifiers:  `m.command` = Ctrl on Windows/Linux, Cmd on macOS  -> CMDCTRL.
#                  `m.ctrl`    = Control on every OS                  -> CTRL.
# keymap.rs's `ctrl` predicate (m.ctrl) is literal Control, so its Ctrl+Shift
# number formats stay CTRL on macOS too. Mac-only / Win-only rows of keymap.rs
# (`mac` / `!mac` guards) are scoped with only:/except:.
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/gridcraft/fetch_icons.py
#   PYTHONPATH=. python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/gridcraft/bindings.yaml --preview /tmp/gridcraft_preview
app: gridcraft
match: [gridcraft, ai.storyteller.gridcraft]   # gridcraft.exe / macOS "GridCraft" / Linux app id
output: gridcraft_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

# GridCraft's own app icon (64px .ico frame): green tile with the ledger page
# knocked out at luma t150 -- reads as the real tile (see SOURCES.md sweep).
program_icon: gridcraft.png
program_icon_mode: luma
program_icon_threshold: 150
program_icon_anchor: bottom-right
program_icon_region: [46, 40]
program_icon_margin: 0

bindings:
  # ---------------- ribbon.rs shortcut(): Cmd/Ctrl letters ----------------
  - { key: N, mods: [CMDCTRL], icon: new.png,   label: New }
  - { key: O, mods: [CMDCTRL], icon: open.png,  label: Open }
  - { key: S, mods: [CMDCTRL], icon: save.png,  label: Save }
  - { key: S, mods: [CMDCTRL, SHIFT], icon: saveas.png, label: "Save as" }
  - { key: W, mods: [CMDCTRL], icon: close.png, label: Close }
  - { key: P, mods: [CMDCTRL], icon: print.png, label: Print }
  - { key: C, mods: [CMDCTRL], icon: copy.png,  label: Copy }        # egui Event::Copy (grid.rs)
  - { key: X, mods: [CMDCTRL], icon: cut.png,   label: Cut }         # egui Event::Cut
  - { key: V, mods: [CMDCTRL], icon: paste.png, label: Paste }       # egui Event::Paste
  - { key: Z, mods: [CMDCTRL], icon: undo.png,  label: Undo }
  - { key: Z, mods: [CMDCTRL, SHIFT], icon: redo.png, label: Redo }
  - { key: Y, mods: [CMDCTRL], icon: redo.png,  label: Redo }
  - { key: A, mods: [CMDCTRL], icon: selectall.png, label: "Select all" }
  - { key: B, mods: [CMDCTRL], icon: bold.png,      label: Bold }
  - { key: I, mods: [CMDCTRL], icon: italic.png,    label: Italic }
  - { key: U, mods: [CMDCTRL], icon: underline.png, label: Underline }
  - { key: K, mods: [CMDCTRL], icon: hyperlink.png, label: Hyperlink }
  - { key: F, mods: [CMDCTRL], icon: find.png,      label: Find }
  # Cmd+H is macOS "Hide"; GridCraft's Mac replace is Cmd+Shift+H (keymap.rs).
  - { key: H, mods: [CMDCTRL], icon: replace.png,   label: Replace, except: [macos] }
  - { key: H, mods: [GUI, SHIFT], icon: replace.png, label: Replace, only: [macos] }
  - { key: G, mods: [CMDCTRL], icon: goto.png,      label: "Go to" }
  - { key: D, mods: [CMDCTRL], icon: filldown.png,  label: "Fill down" }
  - { key: R, mods: [CMDCTRL], icon: fillright.png, label: "Fill right" }
  - { key: T, mods: [CMDCTRL], icon: tableadd.png,  label: "New table" }
  - { key: T, mods: [CMDCTRL, SHIFT], icon: autosum.png, label: AutoSum }
  - { key: "1", mods: [CMDCTRL], icon: formatcells.png, label: "Format cells" }
  - { key: "9", mods: [CMDCTRL], icon: hiderows.png,   label: "Hide rows" }
  - { key: "9", mods: [CMDCTRL, SHIFT], icon: unhiderows.png, label: "Unhide rows" }
  - { key: "0", mods: [CMDCTRL], icon: hidecols.png,   label: "Hide columns" }
  - { key: "0", mods: [CMDCTRL, SHIFT], icon: unhidecols.png, label: "Unhide columns" }
  - { key: MINUS, mods: [CMDCTRL], icon: delcells.png, label: "Delete cells" }
  - { key: EQUAL, mods: [CMDCTRL, SHIFT], icon: insertcells.png, label: "Insert cells" }
  - { key: GRAVE, mods: [CMDCTRL], icon: showformulas.png, label: "Show formulas" }

  # ------- letters that differ by OS (keymap.rs, checked before ribbon) -------
  # Flash fill: Windows Ctrl+E via ribbon (Ctrl is m.command), Mac Control+E in keymap.
  - { key: E, mods: [CTRL], icon: flashfill.png, label: "Flash fill" }
  - { key: E, mods: [GUI], icon: aligncenter.png, label: "Align center", only: [macos] }
  # Ctrl+L: Windows insert table; Mac Cmd+L align left, Control+L define name.
  - { key: L, mods: [CTRL], icon: tableadd.png,  label: "New table", only: [windows, linux] }
  - { key: L, mods: [GUI],  icon: alignleft.png, label: "Align left", only: [macos] }
  - { key: L, mods: [CTRL], icon: definename.png, label: "Define name", only: [macos] }
  - { key: L, mods: [CMDCTRL, SHIFT], icon: filter.png, label: Filter }
  - { key: L, mods: [CTRL, SHIFT], icon: filter.png, label: Filter, only: [macos] }
  - { key: U, mods: [CTRL], icon: editcell.png, label: "Edit cell", only: [macos] }
  - { key: F, mods: [CTRL, SHIFT], icon: font.png, label: "Format font", only: [windows, linux] }
  - { key: F, mods: [GUI, SHIFT], icon: filter.png, label: Filter, only: [macos] }
  - { key: G, mods: [CTRL, SHIFT], icon: statistics.png, label: Statistics, only: [windows, linux] }
  - { key: R, mods: [GUI, SHIFT], icon: sort.png,    label: Sort,    only: [macos] }
  - { key: K, mods: [GUI, SHIFT], icon: group.png,   label: "Group rows/cols",   only: [macos] }
  - { key: J, mods: [GUI, SHIFT], icon: ungroup.png, label: "Ungroup rows/cols", only: [macos] }
  - { key: DOT,   mods: [CMDCTRL, SHIFT], icon: fontinc.png, label: "Font bigger" }
  - { key: COMMA, mods: [CMDCTRL, SHIFT], icon: fontdec.png, label: "Font smaller" }

  # ---------- Ctrl+2..5 (Windows/Linux only, keymap.rs `!mac`) ----------
  - { key: "2", mods: [CTRL], icon: bold.png,      label: Bold,          only: [windows, linux] }
  - { key: "3", mods: [CTRL], icon: italic.png,    label: Italic,        only: [windows, linux] }
  - { key: "4", mods: [CTRL], icon: underline.png, label: Underline,     only: [windows, linux] }
  - { key: "5", mods: [CTRL], icon: strike.png,    label: Strikethrough, only: [windows, linux] }

  # ---------- Ctrl+Shift number formats / borders (literal Control) ----------
  - { key: GRAVE, mods: [CTRL, SHIFT], icon: fmtgeneral.png,  label: "General format" }
  - { key: "1",   mods: [CTRL, SHIFT], icon: fmtnumber.png,   label: "Number format" }
  - { key: "2",   mods: [CTRL, SHIFT], icon: fmttime.png,     label: "Time format" }
  - { key: "3",   mods: [CTRL, SHIFT], icon: fmtdate.png,     label: "Date format" }
  - { key: "4",   mods: [CTRL, SHIFT], icon: fmtcurrency.png, label: Currency }
  - { key: "5",   mods: [CTRL, SHIFT], label: "%" }                 # percent: text symbol (as Excel)
  - { key: "6",   mods: [CTRL, SHIFT], icon: fmtsci.png,      label: "Scientific format" }
  - { key: "7",   mods: [CTRL, SHIFT], icon: borderoutside.png, label: "Outside border" }
  - { key: MINUS, mods: [CTRL, SHIFT], icon: bordernone.png,  label: "No border" }
  - { key: "8",   mods: [CTRL, SHIFT], icon: region.png,      label: "Current region" }

  # ---------- date / time / cell above ----------
  # Ctrl+; date: Windows via ribbon (m.command), Mac Control+; in keymap -> CTRL everywhere.
  - { key: SEMICOLON, mods: [CTRL], icon: insertdate.png, label: "Insert date" }
  - { key: SEMICOLON, mods: [CTRL, SHIFT], icon: inserttime.png, label: "Insert time" }
  - { key: SEMICOLON, mods: [GUI], icon: inserttime.png, label: "Insert time", only: [macos] }
  - { key: QUOTE, mods: [CTRL], icon: formulaabove.png, label: "Formula from above" }
  - { key: QUOTE, mods: [CTRL, SHIFT], icon: valueabove.png, label: "Value from above" }

  # ---------- Ctrl+Alt / Cmd+Option ----------
  - { key: V,     mods: [CMDCTRL, ALT], icon: pastespecial.png, label: "Paste special" }
  - { key: EQUAL, mods: [CMDCTRL, ALT], label: "Zoom in" }      # shared concept
  - { key: MINUS, mods: [CTRL, ALT], label: "Zoom out", only: [windows, linux] }
  - { key: F9,    mods: [CMDCTRL, ALT], icon: calc.png, label: "Calculate now" }
  - { key: R,     mods: [GUI, ALT], icon: ribbon.png, label: "Collapse ribbon", only: [macos] }
  - { key: "0",   mods: [GUI, ALT], icon: borderoutside.png, label: "Outside border", only: [macos] }
  - { key: MINUS, mods: [GUI, ALT], icon: bordernone.png, label: "No border", only: [macos] }
  - { key: LEFT,  mods: [GUI, ALT], icon: borderleft.png,   label: "Left border",   only: [macos] }
  - { key: RIGHT, mods: [GUI, ALT], icon: borderright.png,  label: "Right border",  only: [macos] }
  - { key: UP,    mods: [GUI, ALT], icon: bordertop.png,    label: "Top border",    only: [macos] }
  - { key: DOWN,  mods: [GUI, ALT], icon: borderbottom.png, label: "Bottom border", only: [macos] }

  # ---------- Alt / Option alone ----------
  - { key: EQUAL, mods: [ALT], icon: autosum.png, label: AutoSum, only: [windows, linux] }
  - { key: DOWN,  mods: [ALT], icon: dropdown.png, label: "Drop-down list" }
  - { key: PGDN,  mods: [ALT], icon: screenright.png, label: "Screen right" }
  - { key: PGUP,  mods: [ALT], icon: screenleft.png,  label: "Screen left" }
  - { key: RIGHT, mods: [ALT, SHIFT], icon: group.png,   label: "Group rows/cols",   only: [windows, linux] }
  - { key: LEFT,  mods: [ALT, SHIFT], icon: ungroup.png, label: "Ungroup rows/cols", only: [windows, linux] }
  - { key: RIGHT, mods: [ALT], icon: nextsheet.png, label: "Next sheet",     only: [macos] }
  - { key: LEFT,  mods: [ALT], icon: prevsheet.png, label: "Previous sheet", only: [macos] }
  - { key: F1,  mods: [ALT], icon: insertchart.png, label: "Insert chart" }
  - { key: F1,  mods: [ALT, SHIFT], icon: insertsheet.png, label: "Insert sheet" }
  - { key: F8,  mods: [ALT], icon: macros.png, label: Macros }               # grid.rs
  - { key: F10, mods: [ALT, SHIFT], icon: errorcheck.png, label: "Error checking" }

  # ---------- function keys ----------
  - { key: F1,  mods: [CMDCTRL], icon: ribbon.png, label: "Collapse ribbon" }
  - { key: F2,  mods: [], icon: editcell.png, label: "Edit cell" }            # grid.rs
  - { key: F2,  mods: [SHIFT], icon: note.png, label: "Insert note" }
  - { key: F2,  mods: [CMDCTRL, SHIFT], icon: comment.png, label: "New comment" }
  - { key: F3,  mods: [SHIFT], icon: insertfunction.png, label: "Insert function" }
  - { key: F3,  mods: [CTRL], icon: namemanager.png, label: "Name manager", only: [windows, linux] }
  - { key: F3,  mods: [GUI],  icon: definename.png,  label: "Define name",  only: [macos] }
  - { key: F3,  mods: [CMDCTRL, SHIFT], icon: createnames.png, label: "Names from selection" }
  - { key: F4,  mods: [], icon: absref.png, label: "Abs ref" }                # formula_bar.rs, while editing
  - { key: F4,  mods: [CMDCTRL], icon: close.png, label: Close }
  - { key: F5,  mods: [], icon: goto.png, label: "Go to" }
  - { key: F5,  mods: [SHIFT], icon: find.png, label: Find }
  - { key: F7,  mods: [], icon: spelling.png, label: Spelling }
  - { key: F9,  mods: [], icon: calc.png, label: "Calculate now" }           # grid.rs
  - { key: F9,  mods: [SHIFT], icon: calcsheet.png, label: "Calculate sheet" }
  - { key: F10, mods: [], icon: keytips.png, label: "Key tips" }             # keytips.rs
  - { key: F10, mods: [SHIFT], icon: contextmenu.png, label: "Context menu" }
  - { key: F11, mods: [SHIFT], icon: insertsheet.png, label: "Insert sheet" }
  - { key: F12, mods: [], icon: saveas.png, label: "Save as" }

  # ---------- navigation cluster (grid.rs + keymap.rs) ----------
  - { key: DELETE, mods: [], icon: clear.png, label: "Clear contents" }
  - { key: HOME, mods: [], icon: rowstart.png, label: "Row start" }
  - { key: HOME, mods: [SHIFT], icon: extendrow.png, label: "Select to row start" }
  - { key: HOME, mods: [CMDCTRL], icon: gostart.png, label: "Go to A1" }
  - { key: END,  mods: [CMDCTRL], icon: goend.png,   label: "Go to last cell" }
  - { key: HOME, mods: [CMDCTRL, SHIFT], icon: extendstart.png, label: "Select to A1" }
  - { key: END,  mods: [CMDCTRL, SHIFT], icon: extendend.png,   label: "Select to last cell" }
  - { key: PGDN, mods: [CMDCTRL], icon: nextsheet.png, label: "Next sheet" }
  - { key: PGUP, mods: [CMDCTRL], icon: prevsheet.png, label: "Previous sheet" }

  # ---------- Enter / Backspace / Space (grid.rs, formula_bar.rs, keymap.rs) ----------
  # In the grid, Alt+Enter and Ctrl+Enter start editing (grid.rs:2654-2659).
  - { key: ENTER, mods: [ALT],  icon: editcell.png, label: "Edit cell" }
  - { key: ENTER, mods: [CTRL], icon: editcell.png, label: "Edit cell" }
  # Editor-only chords (formula_bar.rs:169-200); in the grid these only start an edit.
  - { key: ENTER, mods: [CTRL, SHIFT], icon: arrayformula.png, label: "Array formula" }
  - { key: ENTER, mods: [GUI], icon: fillselection.png, label: "Fill selection", only: [macos] }
  - { key: BACKSPACE, mods: [], icon: clearedit.png, label: "Clear and edit" }   # grid.rs:2666
  - { key: SPACE, mods: [SHIFT], icon: selectrow.png, label: "Select row" }       # keymap.rs:115
  - { key: SPACE, mods: [CTRL],  icon: selectcol.png, label: "Select column" }    # keymap.rs:116-117
  - { key: SPACE, mods: [CMDCTRL, SHIFT], icon: selectall.png, label: "Select all" }  # keymap.rs:112
