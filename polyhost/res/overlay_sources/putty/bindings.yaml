# PuTTY session overlays for PolyKybd.
#
# ⚠️ THIS IS NOT A LIST OF PuTTY'S OWN SHORTCUTS, and that is deliberate.
# PuTTY is a terminal: essentially every key you press is SENT TO THE REMOTE
# HOST, and PuTTY's own set is two entries (Alt+Enter full screen, Ctrl+right
# -click menu). What a person sitting in a PuTTY window is actually pressing is
# the REMOTE SHELL's line editing -- GNU readline in emacs mode, plus the tty
# driver's control characters -- so that is what these keycaps show.
#
# That distinction matters because the meanings are not the familiar ones:
# Ctrl+A is beginning-of-line, not select-all; Ctrl+W kills a word, not a
# window; Ctrl+R searches history, not reload. Third-party "PuTTY shortcuts"
# pages list exactly these keys WITHOUT saying they belong to the shell, which
# is how they end up mislabelled.
#
# Source: `bind -p` from bash's own readline (the binding table itself, not a
# summary of it) plus POSIX tty special characters. See SOURCES.md.
#
# Icons: Microsoft Fluent UI System Icons (MIT); the three kill-* glyphs and the
# program mark are drawn here (see fetch_icons.py for why).
#
# Regenerate:
#   python polyhost/res/overlay_sources/putty/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/putty/bindings.yaml --preview /tmp/putty_preview
app: putty
match: [putty]
output: putty_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

# ⚠️ NO `program_icon:` HERE, DELIBERATELY -- the ESC mark comes from the
# CURATED GENERIC in `polyhost/res/app_icons.yaml` (mdi:console-network) instead of a
# baked cell. Both exist and the baked one WINS: `send_overlays_mru` defers a
# synthetic source on any (modifier, keycode) a template already drew, so a
# `program_icon:` here would mean the generic is never uploaded.
#
# The generic reads better at 40x40 than the letter tile it replaced, and it is
# also 8 px wider -- the auto-fetch path fixes the mark at the right-hand 40x40
# square, while a baked one here was 42x34.
#
# ⚠️ The trade, stated because it is invisible from this file: a baked mark
# ALWAYS draws, a fetched one needs `shortcut_icon_auto_fetch` (default on) and
# one successful download. Offline with a cold cache, ESC stays blank.

bindings:
  # --- Ctrl: readline movement (primary R channel) ----------------------
  - { key: A, mods: [CTRL], icon: linestart.png, label: "Start of line", source: "readline beginning-of-line" }
  - { key: E, mods: [CTRL], icon: lineend.png,   label: "End of line",   source: "readline end-of-line" }
  - { key: B, mods: [CTRL], icon: charback.png,  label: "Back one char", source: "readline backward-char" }
  - { key: F, mods: [CTRL], icon: charfwd.png,   label: "Forward one char", source: "readline forward-char" }

  # --- Ctrl: readline history -------------------------------------------
  - { key: P, mods: [CTRL], icon: prevcmd.png,    label: "Previous command", source: "readline previous-history" }
  - { key: N, mods: [CTRL], icon: nextcmd.png,    label: "Next command",     source: "readline next-history" }
  - { key: R, mods: [CTRL], icon: searchback.png, label: "Search history back", source: "readline reverse-search-history" }
  - { key: S, mods: [CTRL], icon: searchfwd.png,  label: "Search history forward", source: "readline forward-search-history" }

  # --- Ctrl: readline editing -------------------------------------------
  - { key: K, mods: [CTRL], icon: killtoend.png,   label: "Kill to end of line",   source: "readline kill-line (drawn glyph)", mode: alpha }
  - { key: U, mods: [CTRL], icon: killtostart.png, label: "Kill to start of line", source: "readline unix-line-discard (drawn glyph)", mode: alpha }
  - { key: W, mods: [CTRL], icon: killword.png,    label: "Kill word before cursor", source: "readline unix-word-rubout (drawn glyph)", mode: alpha }
  - { key: Y, mods: [CTRL], icon: yank.png,        label: "Yank (paste killed text)", source: "readline yank" }
  - { key: T, mods: [CTRL], icon: transpose.png,   label: "Transpose characters",  source: "readline transpose-chars" }
  - { key: H, mods: [CTRL], icon: delchar.png,     label: "Delete char left",      source: "readline backward-delete-char" }
  - { key: I, mods: [CTRL], icon: complete.png,    label: "Complete (Tab)",        source: "readline complete" }

  # --- Ctrl: screen & signals (tty driver, not readline) ----------------
  - { key: L, mods: [CTRL], icon: clear.png,     label: "Clear screen",     source: "readline clear-screen" }
  - { key: C, mods: [CTRL], icon: interrupt.png, label: "Interrupt (SIGINT)", source: "tty intr" }
  - { key: Z, mods: [CTRL], icon: suspend.png,   label: "Suspend (SIGTSTP)",  source: "tty susp" }
  - { key: D, mods: [CTRL], icon: eof.png,       label: "End of input (EOF)", source: "tty eof / readline delete-char" }

  # --- Alt: readline word operations (primary G channel) ---------------
  - { key: B, mods: [ALT], icon: wordback.png,   label: "Back one word",    source: "readline backward-word" }
  - { key: F, mods: [ALT], icon: wordfwd.png,    label: "Forward one word", source: "readline forward-word" }
  - { key: D, mods: [ALT], icon: killwordfwd.png, label: "Kill word forward", source: "readline kill-word (drawn glyph, the mirror of Ctrl+W)", mode: alpha }
  - { key: U, mods: [ALT], icon: upcase.png,     label: "Upper-case word",  source: "readline upcase-word" }
  - { key: L, mods: [ALT], icon: downcase.png,   label: "Lower-case word",  source: "readline downcase-word" }
  - { key: C, mods: [ALT], icon: capitalize.png, label: "Capitalise word",  source: "readline capitalize-word" }
  - { key: T, mods: [ALT], icon: transpose.png,  label: "Transpose words",  source: "readline transpose-words" }
  - { key: R, mods: [ALT], icon: revertline.png, label: "Revert line",      source: "readline revert-line" }
  - { key: DOT, mods: [ALT], icon: lastarg.png,  label: "Yank last argument", source: "readline yank-last-arg" }
  # PuTTY's OWN shortcut -- the one thing in this file the terminal handles itself
  - { key: ENTER, mods: [ALT], icon: fullscreen.png, label: "Full screen (PuTTY)", source: "PuTTY config-fullscreen" }
