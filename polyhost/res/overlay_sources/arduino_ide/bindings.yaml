# Arduino IDE 2.x shortcut overlays for PolyKybd. See SOURCES.md.
#
# Keys: the arduino-ide source (main at 615de51, Theia 1.57.0, Monaco
# 1.83.101), read 2026-10-30. Three layers of bindings, in priority order:
#   1. Arduino's own `registerKeybindings` (arduino-ide-extension/src/browser).
#      On the same chord they take priority over Theia and Monaco: Theia
#      inserts a later registration ahead of an earlier one.
#   2. Theia's keys that Arduino keeps (tabs, panels, editor history, debug).
#   3. Monaco's editor keys, dumped per OS from @theia/monaco-editor-core.
#
# Arduino registers its keys as `CtrlCmd`, so `CMDCTRL` serves Windows and
# Linux (Ctrl) and macOS (Cmd). Monaco differs per OS on some keys; those use
# `only:` / `except:`, which also makes the generator write a Linux set.
#
# Regenerate:
#   python polyhost/res/overlay_sources/arduino_ide/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/arduino_ide/bindings.yaml --preview /tmp/arduino_ide_preview
app: arduino ide
match: [arduino ide, arduino-ide, cc.arduino.ide2]
output: arduino_ide_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

program_icon: arduino.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [46, 30]
program_icon_margin: 0

# Glyph + arrow composites, drawn 1-bit at 40x40 and placed 1:1.
_arrowed: &arrowed { region: [40, 40], mode: alpha }

bindings:
  # ============================================ Arduino's own commands ======
  # --- File ---
  - { key: N, mods: [CMDCTRL], icon: newsketch.png, label: "New sketch" }
  - { key: N, mods: [CMDCTRL, ALT], icon: newcloud.png, label: "New cloud sketch" }
  - { key: O, mods: [CMDCTRL], label: "Open" }
  - { key: S, mods: [CMDCTRL], label: "Save" }
  - { key: S, mods: [CMDCTRL, SHIFT], icon: saveas.png, label: "Save sketch as" }
  - { key: W, mods: [CMDCTRL], icon: closesketch.png, label: "Close sketch" }
  # Registered only off macOS (quit-app.ts).
  - { key: Q, mods: [CMDCTRL], except: [macos], label: "Quit" }
  - { key: ",", mods: [CMDCTRL], label: "Settings" }
  # --- Sketch ---
  - { key: R, mods: [CMDCTRL], icon: verify.png, label: "Verify / compile" }
  - { key: R, mods: [CMDCTRL, SHIFT], icon: verifyclean.png, label: "Verify (clean build)" }
  - { key: S, mods: [CMDCTRL, ALT], icon: exportbin.png, label: "Export compiled binary" }
  - { key: U, mods: [CMDCTRL], icon: upload.png, label: "Upload" }
  - { key: U, mods: [CMDCTRL, SHIFT], icon: uploadprog.png, label: "Upload using programmer" }
  - { key: K, mods: [CMDCTRL, ALT], icon: sketchfolder.png, label: "Show sketch folder" }
  # --- Tabs ---
  - { key: N, mods: [CMDCTRL, SHIFT], icon: newtab.png, label: "New tab" }
  - { key: LEFT, mods: [CMDCTRL, ALT], icon: prevtab.png, label: "Previous tab" }
  - { key: RIGHT, mods: [CMDCTRL, ALT], icon: nexttab.png, label: "Next tab" }
  # Physical Ctrl on every OS: Arduino re-registers these as ctrl+ on macOS.
  - { key: TAB, mods: [CTRL], icon: nexttab.png, label: "Next tab" }
  - { key: TAB, mods: [CTRL, SHIFT], icon: prevtab.png, label: "Previous tab" }
  - { key: D, mods: [CTRL, ALT], icon: nexttab.png, label: "Next tab" }
  - { key: A, mods: [CTRL, ALT], icon: prevtab.png, label: "Previous tab" }
  # --- Edit ---
  - { key: C, mods: [CMDCTRL, SHIFT], icon: forum.png, label: "Copy for forum" }
  - { key: L, mods: [CMDCTRL], icon: gotoline.png, label: "Go to line" }
  - { key: "/", mods: [CMDCTRL], icon: comment.png, label: "Toggle comment" }
  - { key: F, mods: [CMDCTRL], label: "Find" }
  - { key: G, mods: [CMDCTRL], label: "Find next" }
  - { key: G, mods: [CMDCTRL, SHIFT], icon: findprev.png, <<: *arrowed, label: "Find previous" }
  - { key: E, mods: [CMDCTRL], icon: usesel.png, label: "Use selection for find" }
  - { key: T, mods: [CMDCTRL], icon: autoformat.png, label: "Auto format" }
  - { key: "=", mods: [CMDCTRL], icon: fontup.png, label: "Increase font size" }
  - { key: "-", mods: [CMDCTRL], icon: fontdown.png, label: "Decrease font size" }
  # --- Help / Tools / views ---
  - { key: F, mods: [CMDCTRL, SHIFT], icon: reference.png, label: "Find in reference" }
  - { key: I, mods: [CMDCTRL, SHIFT], icon: library.png, label: "Library manager" }
  # Boards Manager and the Sketchbook both register CtrlCmd+Shift+B. The
  # Sketchbook is bound later in arduino-ide-frontend-module.ts, so its key is
  # inserted first and it is the one that runs. See SOURCES.md.
  - { key: B, mods: [CMDCTRL, SHIFT], icon: sketchbook.png, label: "Toggle sketchbook" }
  - { key: M, mods: [CMDCTRL, SHIFT], icon: serialmonitor.png, label: "Serial monitor" }
  - { key: M, mods: [CMDCTRL, ALT, SHIFT], icon: problems.png, label: "Problems" }

  # ================================ Theia keys that Arduino keeps ===========
  - { key: Z, mods: [CMDCTRL], label: "Undo" }
  - { key: Y, mods: [CTRL], only: [windows, linux], label: "Redo" }
  - { key: Z, mods: [CMDCTRL, SHIFT], label: "Redo" }
  - { key: X, mods: [CMDCTRL], label: "Cut" }
  - { key: C, mods: [CMDCTRL], label: "Copy" }
  - { key: V, mods: [CMDCTRL], label: "Paste" }
  - { key: A, mods: [CMDCTRL], label: "Select all" }
  - { key: F1, icon: commandpalette.png, label: "Command palette" }
  - { key: P, mods: [CMDCTRL, SHIFT], icon: commandpalette.png, label: "Command palette" }
  # Theia's Replace is CtrlCmd+Alt+F on every OS; Monaco adds Ctrl+H off macOS.
  - { key: F, mods: [CMDCTRL, ALT], label: "Replace" }
  - { key: H, mods: [CTRL], only: [windows, linux], label: "Replace" }
  - { key: J, mods: [CMDCTRL], icon: bottompanel.png, label: "Toggle bottom panel" }
  - { key: F11, except: [macos], icon: fullscreen.png, label: "Full screen" }
  - { key: F, mods: [CTRL, GUI], only: [macos], icon: fullscreen.png, label: "Full screen" }
  - { key: Z, mods: [ALT], icon: wordwrap.png, label: "Toggle word wrap" }
  - { key: Q, mods: [CTRL, ALT], icon: lastedit.png, label: "Last edit location" }
  - { key: T, mods: [CMDCTRL, SHIFT], icon: reopentab.png, label: "Reopen closed editor" }
  - { key: T, mods: [CMDCTRL, ALT], icon: closeothers.png, label: "Close other tabs" }
  - { key: F4, mods: [CTRL], only: [windows], icon: closetab.png, label: "Close tab" }
  - { key: ",", mods: [CTRL, ALT], icon: keyboardshortcuts.png, label: "Keyboard shortcuts" }
  - { key: I, mods: [CMDCTRL, ALT], icon: devtools.png, label: "Developer tools" }
  # Go back / forward: Alt+Left/Right on Windows, Ctrl+Alt+- / Ctrl+Shift+- on
  # Linux, Ctrl+- / Ctrl+Shift+- on macOS.
  - { key: LEFT, mods: [ALT], only: [windows], icon: navback.png, label: "Go back" }
  - { key: RIGHT, mods: [ALT], only: [windows], icon: navforward.png, label: "Go forward" }
  - { key: "-", mods: [CTRL, ALT], only: [linux], icon: navback.png, label: "Go back" }
  - { key: "-", mods: [CTRL], only: [macos], icon: navback.png, label: "Go back" }
  - { key: "-", mods: [CTRL, SHIFT], except: [windows], icon: navforward.png, label: "Go forward" }
  # --- debugger: act once a debug session runs ---
  - { key: D, mods: [CMDCTRL, SHIFT], icon: debugview.png, label: "Debug view" }
  - { key: F9, icon: breakpoint.png, label: "Toggle breakpoint" }
  - { key: F10, icon: stepover.png, label: "Step over" }
  - { key: F11, mods: [SHIFT], icon: stepout.png, label: "Step out" }
  - { key: F6, icon: pause.png, label: "Pause" }
  - { key: F5, mods: [SHIFT], icon: stopdebug.png, label: "Stop debugging" }
  - { key: F5, mods: [CMDCTRL, SHIFT], icon: restart.png, label: "Restart debugging" }

  # ======================================= Monaco editor keys ===============
  # --- suggestions, navigation ---
  - { key: SPACE, mods: [CTRL], icon: suggest.png, label: "Trigger suggest" }
  - { key: I, mods: [CMDCTRL], icon: suggest.png, label: "Trigger suggest" }
  - { key: SPACE, mods: [CMDCTRL, SHIFT], icon: paraminfo.png, label: "Parameter hints" }
  - { key: ".", mods: [CMDCTRL], icon: quickfix.png, label: "Quick fix" }
  - { key: F12, icon: definition.png, label: "Go to definition" }
  - { key: F12, mods: [SHIFT], icon: references.png, label: "Go to references" }
  - { key: F12, mods: [ALT], except: [linux], icon: peekdefinition.png, label: "Peek definition" }
  - { key: F10, mods: [CTRL, SHIFT], only: [linux], icon: peekdefinition.png, label: "Peek definition" }
  - { key: F12, mods: [CMDCTRL, SHIFT], icon: peekimpl.png, label: "Peek implementation" }
  - { key: F2, icon: rename.png, label: "Rename symbol" }
  - { key: F2, mods: [CMDCTRL], icon: selectall.png, label: "Change all occurrences" }
  - { key: O, mods: [CMDCTRL, SHIFT], icon: gotosymbol.png, label: "Go to symbol" }
  # Ctrl+G is Arduino's Find next; on macOS that is Cmd+G and Ctrl+G stays
  # Monaco's Go to line.
  - { key: G, mods: [CTRL], only: [macos], icon: gotoline.png, label: "Go to line" }
  - { key: F8, icon: nextproblem.png, <<: *arrowed, label: "Next problem" }
  - { key: F8, mods: [SHIFT], icon: prevproblem.png, <<: *arrowed, label: "Previous problem" }
  - { key: F10, mods: [SHIFT], icon: contextmenu.png, label: "Context menu" }
  # --- find ---
  - { key: F3, label: "Find next" }
  - { key: F3, mods: [SHIFT], icon: findprev.png, <<: *arrowed, label: "Find previous" }
  - { key: C, mods: [ALT], except: [macos], icon: matchcase.png, label: "Match case" }
  - { key: W, mods: [ALT], except: [macos], icon: wholeword.png, label: "Match whole word" }
  - { key: R, mods: [ALT], except: [macos], icon: regex.png, label: "Use regular expression" }
  - { key: L, mods: [ALT], except: [macos], icon: findinselection.png, label: "Find in selection" }
  - { key: C, mods: [GUI, ALT], only: [macos], icon: matchcase.png, label: "Match case" }
  - { key: W, mods: [GUI, ALT], only: [macos], icon: wholeword.png, label: "Match whole word" }
  - { key: R, mods: [GUI, ALT], only: [macos], icon: regex.png, label: "Use regular expression" }
  - { key: L, mods: [GUI, ALT], only: [macos], icon: findinselection.png, label: "Find in selection" }
  # --- selection and cursors ---
  - { key: D, mods: [CMDCTRL], icon: multicursor.png, label: "Add selection to next match" }
  - { key: L, mods: [CMDCTRL, SHIFT], icon: selectall.png, label: "Select all matches" }
  - { key: UP, mods: [CMDCTRL, ALT], except: [linux], icon: cursorabove.png, label: "Add cursor above" }
  - { key: DOWN, mods: [CMDCTRL, ALT], except: [linux], icon: cursorbelow.png, label: "Add cursor below" }
  - { key: UP, mods: [CTRL, SHIFT], only: [linux], icon: cursorabove.png, label: "Add cursor above" }
  - { key: DOWN, mods: [CTRL, SHIFT], only: [linux], icon: cursorbelow.png, label: "Add cursor below" }
  - { key: UP, mods: [ALT, SHIFT], only: [linux], icon: cursorabove.png, label: "Add cursor above" }
  - { key: DOWN, mods: [ALT, SHIFT], only: [linux], icon: cursorbelow.png, label: "Add cursor below" }
  - { key: I, mods: [ALT, SHIFT], icon: lineends.png, label: "Add cursors to line ends" }
  - { key: RIGHT, mods: [ALT, SHIFT], except: [macos], icon: expandsel.png, label: "Expand selection" }
  - { key: LEFT, mods: [ALT, SHIFT], except: [macos], icon: shrinksel.png, label: "Shrink selection" }
  - { key: RIGHT, mods: [CTRL, SHIFT], only: [macos], icon: expandsel.png, label: "Expand selection" }
  - { key: LEFT, mods: [CTRL, SHIFT], only: [macos], icon: shrinksel.png, label: "Shrink selection" }
  # --- lines ---
  - { key: UP, mods: [ALT], icon: movelineup.png, label: "Move line up" }
  - { key: DOWN, mods: [ALT], icon: movelinedown.png, label: "Move line down" }
  - { key: UP, mods: [ALT, SHIFT], except: [linux], icon: copylineup.png, <<: *arrowed, label: "Copy line up" }
  - { key: DOWN, mods: [ALT, SHIFT], except: [linux], icon: copylinedown.png, <<: *arrowed, label: "Copy line down" }
  - { key: UP, mods: [CTRL, ALT, SHIFT], only: [linux], icon: copylineup.png, <<: *arrowed, label: "Copy line up" }
  - { key: DOWN, mods: [CTRL, ALT, SHIFT], only: [linux], icon: copylinedown.png, <<: *arrowed, label: "Copy line down" }
  - { key: K, mods: [CMDCTRL, SHIFT], icon: deleteline.png, label: "Delete line" }
  - { key: ENTER, mods: [CMDCTRL], icon: linebelow.png, label: "Insert line below" }
  - { key: ENTER, mods: [CMDCTRL, SHIFT], icon: lineabove.png, label: "Insert line above" }
  - { key: "]", mods: [CMDCTRL], icon: indent.png, label: "Indent line" }
  - { key: "[", mods: [CMDCTRL], icon: outdent.png, label: "Outdent line" }
  - { key: "\\", mods: [CMDCTRL, SHIFT], icon: matchbracket.png, label: "Go to matching bracket" }
  - { key: A, mods: [ALT, SHIFT], except: [linux], icon: blockcomment.png, label: "Toggle block comment" }
  - { key: A, mods: [CTRL, SHIFT], only: [linux], icon: blockcomment.png, label: "Toggle block comment" }
  # Linux's Ctrl+Shift+I is Arduino's Library manager, which takes priority.
  - { key: F, mods: [ALT, SHIFT], except: [linux], icon: autoformat.png, label: "Format document" }
  # --- folding ---
  - { key: "[", mods: [CTRL, SHIFT], except: [macos], icon: fold.png, label: "Fold" }
  - { key: "]", mods: [CTRL, SHIFT], except: [macos], icon: unfold.png, label: "Unfold" }
  - { key: "[", mods: [GUI, ALT], only: [macos], icon: fold.png, label: "Fold" }
  - { key: "]", mods: [GUI, ALT], only: [macos], icon: unfold.png, label: "Unfold" }
