# Windows Terminal shortcut overlays for PolyKybd.
#
# Shortcuts: the app's OWN default keymap -- `defaults.json` in microsoft/terminal
# (auto-generated from the source), so this is the whole default set rather than a
# docs-page sample. Icons: Microsoft Fluent UI System Icons (MIT). Program mark
# (ESC, all layers): a drawn `>_` prompt -- the real product icon is Microsoft
# trademark art. See SOURCES.md.
#
# ⚠️ Windows Terminal is a Ctrl+Shift app: most of its bindings land in the COMBO
# file's R channel, and the primary Ctrl channel is nearly empty. That is the app,
# not a mistake -- do not "balance" it by inventing plain-Ctrl meanings.
#
# Dropped as unrepresentable (the overlay format has no channel for them):
#   win+sc(41) quake mode  -- GUI is dropped by the loader
#   alt+f4 close window, ctrl+insert/shift+insert copy/paste (numpad/insert dupes
#   of ctrl+shift+c/v), menu context menu, plain `enter` copy-on-selection
#   (conditional: it only copies while a selection exists, so a permanent icon
#   on Enter would be wrong most of the time), ctrl+numpad_* (no keypad cells).
#
# Regenerate:
#   python polyhost/res/overlay_sources/windowsterminal/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/windowsterminal/bindings.yaml --preview /tmp/wt_preview
app: windowsterminal
match: [windowsterminal, wt]
output: windowsterminal_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

# ⚠️ NO `program_icon:` HERE, DELIBERATELY -- the ESC mark comes from the
# CURATED GENERIC in `polyhost/res/app_icons.yaml` (mdi:console) instead of a
# baked cell. Both exist and the baked one WINS: `send_overlays_mru` defers a
# synthetic source on any (modifier, keycode) a template already drew, so a
# `program_icon:` here would mean the generic is never uploaded.
#
# The generic reads better at 40x40 than the letter tile it replaced, and it is
# also 8 px wider -- the auto-fetch path fixes the mark at the right-hand 40x40
# square, while a baked one here was 42x34.
#
# ⚠️ The trade, stated because it is invisible from this file: a baked mark
# ALWAYS draws, a fetched one needs `shortcut_icon_auto_fetch` (default on) and
# one successful download. Offline with a cold cache, ESC stays blank.

bindings:
  # --- Ctrl (primary R channel) -----------------------------------------
  - { key: COMMA, mods: [CTRL], icon: settings.png,  label: "Settings UI",      source: "ms-fluent/Settings (MIT)" }
  - { key: EQUAL, mods: [CTRL], icon: fontbig.png,   label: "Font bigger",      source: "ms-fluent/Font Increase (MIT)" }
  - { key: MINUS, mods: [CTRL], icon: fontsmall.png, label: "Font smaller",     source: "ms-fluent/Font Decrease (MIT)" }
  - { key: "0",   mods: [CTRL], icon: fontreset.png, label: "Reset font size",  source: "ms-fluent/Text Font Size (MIT)" }
  - { key: TAB,   mods: [CTRL], icon: nexttab.png,   label: "Next tab",         source: "ms-fluent/Arrow Right (MIT)" }

  # --- Alt (primary G channel) ------------------------------------------
  - { key: ENTER, mods: [ALT], icon: fullscreen.png, label: "Full screen",      source: "ms-fluent/Full Screen Maximize (MIT)" }
  - { key: SPACE, mods: [ALT], icon: sysmenu.png,    label: "System menu",      source: "ms-fluent/Navigation (MIT)" }
  - { key: UP,    mods: [ALT], icon: focusup.png,    label: "Focus pane up",    source: "ms-fluent/Arrow Up (MIT)" }
  - { key: DOWN,  mods: [ALT], icon: focusdown.png,  label: "Focus pane down",  source: "ms-fluent/Arrow Down (MIT)" }
  - { key: LEFT,  mods: [ALT], icon: focusleft.png,  label: "Focus pane left",  source: "ms-fluent/Arrow Left (MIT)" }
  - { key: RIGHT, mods: [ALT], icon: focusright.png, label: "Focus pane right", source: "ms-fluent/Arrow Right (MIT)" }

  # --- no modifier (primary A channel) ----------------------------------
  - { key: F11, mods: [], icon: fullscreen.png, label: "Full screen", source: "ms-fluent/Full Screen Maximize (MIT)" }

  # --- Ctrl+Shift (combo R channel) -- the bulk of the app --------------
  - { key: T, mods: [CTRL, SHIFT], icon: newtab.png,    label: "New tab",         source: "ms-fluent/Tab Add (MIT)" }
  - { key: N, mods: [CTRL, SHIFT], icon: newwindow.png, label: "New window",      source: "ms-fluent/Window New (MIT)" }
  - { key: D, mods: [CTRL, SHIFT], icon: duptab.png,    label: "Duplicate tab",   source: "ms-fluent/Square Multiple (MIT)" }
  - { key: W, mods: [CTRL, SHIFT], icon: closepane.png, label: "Close pane",      source: "ms-fluent/Dismiss Square (MIT)" }
  - { key: F, mods: [CTRL, SHIFT], icon: find.png,      label: "Find",            source: "ms-fluent/Search (MIT)" }
  - { key: P, mods: [CTRL, SHIFT], icon: palette.png,   label: "Command palette", source: "ms-fluent/Apps List (MIT)" }
  - { key: C, mods: [CTRL, SHIFT], icon: copy.png,      label: "Copy",            source: "ms-fluent/Copy (MIT)" }
  - { key: V, mods: [CTRL, SHIFT], icon: paste.png,     label: "Paste",           source: "ms-fluent/Clipboard Paste (MIT)" }
  - { key: A, mods: [CTRL, SHIFT], icon: selectall.png, label: "Select all",      source: "ms-fluent/Select All On (MIT)" }
  - { key: M, mods: [CTRL, SHIFT], icon: markmode.png,  label: "Mark mode",       source: "ms-fluent/Highlight (MIT)" }
  - { key: K, mods: [CTRL, SHIFT], icon: clear.png,     label: "Clear buffer",    source: "ms-fluent/Broom (MIT)" }
  - { key: COMMA,  mods: [CTRL, SHIFT], icon: settingsfile.png, label: "Settings file",   source: "ms-fluent/Code (MIT)" }
  - { key: PERIOD, mods: [CTRL, SHIFT], icon: suggestions.png,  label: "Suggestions",     source: "ms-fluent/Lightbulb (MIT)" }
  - { key: SPACE,  mods: [CTRL, SHIFT], icon: tabdropdown.png,  label: "New tab menu",    source: "ms-fluent/Chevron Down (MIT)" }
  - { key: TAB,    mods: [CTRL, SHIFT], icon: prevtab.png,      label: "Previous tab",    source: "ms-fluent/Arrow Left (MIT)" }
  # scrolling
  - { key: UP,    mods: [CTRL, SHIFT], icon: scrollup.png,   label: "Scroll up",        source: "ms-fluent/Arrow Sort Up (MIT)" }
  - { key: DOWN,  mods: [CTRL, SHIFT], icon: scrolldown.png, label: "Scroll down",      source: "ms-fluent/Arrow Sort Down (MIT)" }
  - { key: PGUP,  mods: [CTRL, SHIFT], icon: pageup.png,     label: "Scroll page up",   source: "ms-fluent/Arrow Circle Up (MIT)" }
  - { key: PGDN,   mods: [CTRL, SHIFT], icon: pagedown.png,  label: "Scroll page down", source: "ms-fluent/Arrow Circle Down (MIT)" }
  - { key: HOME,  mods: [CTRL, SHIFT], icon: totop.png,      label: "Scroll to top",    source: "ms-fluent/Arrow Upload (MIT)" }
  - { key: END,   mods: [CTRL, SHIFT], icon: tobottom.png,   label: "Scroll to bottom", source: "ms-fluent/Arrow Download (MIT)" }
  # new tab with profile 1..9 -- one glyph on all nine; the KEY says which profile
  - { key: "1", mods: [CTRL, SHIFT], icon: newtab.png, label: "New tab, profile 1", source: "ms-fluent/Tab Add (MIT)" }
  - { key: "2", mods: [CTRL, SHIFT], icon: newtab.png, label: "New tab, profile 2", source: "ms-fluent/Tab Add (MIT)" }
  - { key: "3", mods: [CTRL, SHIFT], icon: newtab.png, label: "New tab, profile 3", source: "ms-fluent/Tab Add (MIT)" }
  - { key: "4", mods: [CTRL, SHIFT], icon: newtab.png, label: "New tab, profile 4", source: "ms-fluent/Tab Add (MIT)" }
  - { key: "5", mods: [CTRL, SHIFT], icon: newtab.png, label: "New tab, profile 5", source: "ms-fluent/Tab Add (MIT)" }
  - { key: "6", mods: [CTRL, SHIFT], icon: newtab.png, label: "New tab, profile 6", source: "ms-fluent/Tab Add (MIT)" }
  - { key: "7", mods: [CTRL, SHIFT], icon: newtab.png, label: "New tab, profile 7", source: "ms-fluent/Tab Add (MIT)" }
  - { key: "8", mods: [CTRL, SHIFT], icon: newtab.png, label: "New tab, profile 8", source: "ms-fluent/Tab Add (MIT)" }
  - { key: "9", mods: [CTRL, SHIFT], icon: newtab.png, label: "New tab, profile 9", source: "ms-fluent/Tab Add (MIT)" }

  # --- Ctrl+Alt (combo G channel) ---------------------------------------
  - { key: COMMA, mods: [CTRL, ALT], icon: defaultsfile.png, label: "Default settings file", source: "ms-fluent/Document (MIT)" }
  - { key: LEFT,  mods: [CTRL, ALT], icon: focusleft.png,    label: "Previous pane",         source: "ms-fluent/Arrow Left (MIT)" }
  - { key: "1", mods: [CTRL, ALT], icon: tab1.png, label: "Switch to tab 1", source: "ms-fluent/Tab (MIT) + digit" }
  - { key: "2", mods: [CTRL, ALT], icon: tab2.png, label: "Switch to tab 2", source: "ms-fluent/Tab (MIT) + digit" }
  - { key: "3", mods: [CTRL, ALT], icon: tab3.png, label: "Switch to tab 3", source: "ms-fluent/Tab (MIT) + digit" }
  - { key: "4", mods: [CTRL, ALT], icon: tab4.png, label: "Switch to tab 4", source: "ms-fluent/Tab (MIT) + digit" }
  - { key: "5", mods: [CTRL, ALT], icon: tab5.png, label: "Switch to tab 5", source: "ms-fluent/Tab (MIT) + digit" }
  - { key: "6", mods: [CTRL, ALT], icon: tab6.png, label: "Switch to tab 6", source: "ms-fluent/Tab (MIT) + digit" }
  - { key: "7", mods: [CTRL, ALT], icon: tab7.png, label: "Switch to tab 7", source: "ms-fluent/Tab (MIT) + digit" }
  - { key: "8", mods: [CTRL, ALT], icon: tab8.png, label: "Switch to tab 8", source: "ms-fluent/Tab (MIT) + digit" }
  - { key: "9", mods: [CTRL, ALT], icon: tobottom.png, label: "Switch to LAST tab", source: "ms-fluent/Arrow Download (MIT)" }

  # --- Alt+Shift (combo B channel) --------------------------------------
  - { key: MINUS, mods: [ALT, SHIFT], icon: splitdown.png,  label: "Split pane down",  source: "ms-fluent/Split Horizontal (MIT)" }
  - { key: EQUAL, mods: [ALT, SHIFT], icon: splitright.png, label: "Split pane right", source: "ms-fluent/Split Vertical (MIT)" }
  - { key: UP,    mods: [ALT, SHIFT], icon: resizepane.png, label: "Resize pane up",    source: "ms-fluent/Resize (MIT)" }
  - { key: DOWN,  mods: [ALT, SHIFT], icon: resizepane.png, label: "Resize pane down",  source: "ms-fluent/Resize (MIT)" }
  - { key: LEFT,  mods: [ALT, SHIFT], icon: resizepane.png, label: "Resize pane left",  source: "ms-fluent/Resize (MIT)" }
  - { key: RIGHT, mods: [ALT, SHIFT], icon: resizepane.png, label: "Resize pane right", source: "ms-fluent/Resize (MIT)" }
