# VICE shortcut overlay for PolyKybd. See SOURCES.md.
#
# Keys are VICE's default hotkeys, from data/hotkeys/*.vhk of the 3.10.0
# release (identical on trunk, read 2026-11-06). VICE binds every hotkey to Alt
# on Windows and Linux and to Command on macOS, so each binding below is written
# twice: Alt with `except: [macos]` and Cmd with `only: [macos]`. Two exceptions:
# Copy and Paste are Alt+Delete / Alt+Insert on every platform, and the monitor
# is Cmd+Esc on macOS, which is not drawn because Esc carries the program mark.
# Pause saves a screenshot without a modifier. Every hotkey can be changed in
# Settings > Hotkeys.
#
# One spec serves every VICE emulator (x64sc, x128, xvic, xplus4, xpet, ...).
# A few keys do nothing on some machines (the cartridge keys on xpet, the tape
# keys on x64dtv; SOURCES.md lists them): those entries draw them all the same.
#
# Regenerate:
#   PYTHONPATH=. .venv/bin/python polyhost/res/overlay_sources/vice/fetch_icons.py
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/vice/vice.yaml --preview /tmp/vice_preview
app: vice
match: [x64sc, x64, x128, xvic, xplus4, xpet, xcbm2, xcbm5x0, xscpu64, x64dtv]
output: vice_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: alpha
threshold: 128

program_icon: vice.png
program_icon_mode: alpha
program_icon_region: [40, 11]
program_icon_anchor: bottom-right
program_icon_margin: 0

bindings:
