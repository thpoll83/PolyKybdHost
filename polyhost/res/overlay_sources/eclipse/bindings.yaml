# Eclipse IDE shortcut overlays for PolyKybd (Windows, Linux and macOS).
#
# Keys: the "Default" key scheme of the Eclipse IDE for Java Developers, read
# from the plugin.xml files on master of eclipse.platform.ui, eclipse.platform,
# eclipse.jdt.ui, EGit and m2e (2026-10-30). See SOURCES.md.
#
# How Eclipse spells a chord, and how it is written here:
#   M1 (Ctrl, Cmd on macOS)         -> CMDCTRL
#   M2 (Shift)                      -> SHIFT
#   M3 (Alt, Option on macOS)       -> ALT
#   M4 (Control, macOS only)        -> CTRL with `only: [macos]`
#   a literal CTRL / ALT / COMMAND  -> CTRL / ALT / GUI. A literal CTRL stays
#                                      Control on macOS (Ctrl+Space, Ctrl+Q, ...).
#   a chord the macOS scheme moves  -> written twice with disjoint `only:` lists.
#   a `[gtk]` / `(not gtk)` row     -> `only: [linux]` / `except: [linux]`; Eclipse
#                                      on Linux is always the GTK port.
#
# A key bound in several contexts draws the Java editor's meaning (Java editor
# > text editor > window). F5..F8 draw the debugging meaning. SOURCES.md lists
# each meaning that was not drawn.
#
# Regenerate (from the repo root, with the project venv):
#   .venv/bin/python polyhost/res/overlay_sources/eclipse/fetch_icons.py
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/eclipse/bindings.yaml --preview /tmp/eclipse_preview
app: eclipse
match: [eclipse]
output: eclipse_template
output_macos: eclipse_template_mac
output_linux: eclipse_template_linux
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

program_icon: eclipse.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

# JetBrains' whole-cell drawings (borrowed) render 1:1, as they do there.
_reclaimed: &reclaimed { region: [72, 40], anchor: center }
# Word composites are drawn 1-bit at 40x40 and placed 1:1.
_worded: &worded { region: [40, 40], mode: alpha }

bindings:
