# GNU Emacs, org-mode keys for PolyKybd. See SOURCES.md.
#
# Only the keys where org-mode differs from the global keys. The mapping loads
# this set AFTER emacs_template (global.yaml), and a later file takes priority
# per key, so every other key keeps its global icon. Keys: the Org Mode
# Reference Card (Org 9.8) and the Org manual, checked against org-mode-map of
# Org 9.6.15 in GNU Emacs 29.3.
#
# Org keys that only work in a table or on a timestamp are drawn with their
# headline meaning (S-up/down: priority on a headline, previous/next item in a
# plain list). C-S-up/down (clock timestamps) and C-# (table recalculation
# marks) are left out: see SOURCES.md.
#
# Regenerate:
#   python polyhost/res/overlay_sources/emacs/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/emacs/org.yaml --preview /tmp/emacs_org_preview
app: emacs
match: [emacs]
output: emacs_org_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: esc_org.png        # the set's word beside the logo (fetch_icons.py)
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [72, 40]
program_icon_margin: 0
program_icon_legend: false

bindings:
  # visibility cycling
  - { key: TAB, icon: cycle.png, label: "Cycle subtree" }
  - { key: TAB, mods: [SHIFT], icon: cycle_all.png, label: "Cycle whole buffer" }

  # new headings and items
  - { key: ENTER, mods: [ALT], icon: org_heading.png, region: [40, 32], label: "New heading / item" }
  - { key: ENTER, mods: [CTRL], icon: org_heading_after.png, region: [40, 32], label: "New heading after subtree" }
  - { key: ENTER, mods: [ALT, SHIFT], icon: org_todo_new.png, region: [40, 32], label: "New TODO / checkbox" }
  - { key: ENTER, mods: [CTRL, SHIFT], icon: org_todo_after.png, region: [40, 32], label: "New TODO after subtree" }
  - { key: ENTER, mods: [SHIFT], icon: org_copy_down.png, region: [40, 32], label: "Copy field down (table)" }

  # structure editing
  - { key: LEFT, mods: [ALT], icon: promote.png, label: "Promote heading" }
  - { key: RIGHT, mods: [ALT], icon: demote.png, label: "Demote heading" }
  - { key: LEFT, mods: [ALT, SHIFT], icon: org_promote_tree.png, region: [40, 32], label: "Promote subtree" }
  - { key: RIGHT, mods: [ALT, SHIFT], icon: org_demote_tree.png, region: [40, 32], label: "Demote subtree" }
  - { key: UP, mods: [ALT], icon: org_tree_up.png, region: [40, 32], label: "Move subtree up" }
  - { key: DOWN, mods: [ALT], icon: org_tree_down.png, region: [40, 32], label: "Move subtree down" }
  - { key: UP, mods: [ALT, SHIFT], icon: org_line_up.png, region: [40, 32], label: "Move line up" }
  - { key: DOWN, mods: [ALT, SHIFT], icon: org_line_down.png, region: [40, 32], label: "Move line down" }

  # TODO state and priority
  - { key: LEFT, mods: [SHIFT], icon: org_todo_prev.png, region: [40, 32], label: "Previous TODO state" }
  - { key: RIGHT, mods: [SHIFT], icon: org_todo_next.png, region: [40, 32], label: "Next TODO state" }
  - { key: UP, mods: [SHIFT], icon: org_prio_up.png, region: [40, 32], label: "Raise priority" }
  - { key: DOWN, mods: [SHIFT], icon: org_prio_down.png, region: [40, 32], label: "Lower priority" }
  - { key: LEFT, mods: [CTRL, SHIFT], icon: org_set_prev.png, region: [40, 32], label: "Previous TODO keyword set" }
  - { key: RIGHT, mods: [CTRL, SHIFT], icon: org_set_next.png, region: [40, 32], label: "Next TODO keyword set" }

  # global keys with an org meaning
  - { key: H, mods: [ALT], icon: org_mark_elem.png, region: [40, 32], label: "Mark element" }
  - { key: "[", mods: [ALT, SHIFT], icon: org_elem_back.png, region: [40, 32], label: "Backward element" }   # M-{
  - { key: "]", mods: [ALT, SHIFT], icon: org_elem_fwd.png, region: [40, 32], label: "Forward element" }     # M-}
  - { key: T, mods: [CTRL, ALT], icon: org_tr_elem.png, region: [40, 32], label: "Transpose elements" }

  # agenda files (C-' and C-, reach Emacs only in a GUI frame)
  - { key: "'", mods: [CTRL], icon: agenda_cycle.png, label: "Cycle agenda files" }
  - { key: ",", mods: [CTRL], icon: agenda_cycle.png, label: "Cycle agenda files" }
