# GNU Emacs, Dired (directory editor) keys for PolyKybd. See SOURCES.md.
#
# A complete set, NOT drawn on top of global.yaml: a Dired buffer is
# read-only, so the global editing keys (kill, yank, transpose) do nothing
# useful there, and C-t is an image-dired prefix in Dired. The global keys that
# still apply (search, scrolling, buffer start/end, M-x, undo, help) are
# repeated here with the same icons, so they cost no extra overlay slot.
#
# Keys: the Dired Reference Card (GNU Emacs 31) and the manual's Dired
# chapter, checked against dired-mode-map of GNU Emacs 29.3. Dired's keys are
# single letters and symbols; an upper-case letter or a shifted symbol is drawn
# on the key's Shift variant. The prefixes `*`, `%` and `:` and the digit
# arguments are left out: see SOURCES.md.
#
# Regenerate:
#   python polyhost/res/overlay_sources/emacs/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/emacs/dired.yaml --preview /tmp/emacs_dired_preview
app: emacs
match: [emacs]
output: emacs_dired_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 32]
margin: 0
mode: alpha
threshold: 150

program_icon: emacs.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [40, 40]
program_icon_margin: 0

bindings:
  # --- single lower-case letters and symbols ---
  - { key: F, icon: open.png, label: "Open file" }
  - { key: E, icon: open.png, label: "Open file" }
  - { key: ENTER, icon: open.png, label: "Open file" }
  - { key: A, icon: findalternate.png, label: "Open in this buffer" }
  - { key: O, icon: openother.png, label: "Open in other window" }
  - { key: V, icon: view.png, label: "View file" }
  - { key: N, icon: line_next.png, label: "Next line" }
  - { key: P, icon: line_prev.png, label: "Previous line" }
  - { key: SPACE, icon: line_next.png, label: "Next line" }
  - { key: SPACE, mods: [SHIFT], icon: line_prev.png, label: "Previous line" }
  - { key: M, icon: mark.png, label: "Mark" }
  - { key: U, icon: unmark.png, label: "Unmark" }
  - { key: BACKSPACE, icon: unmarkback.png, label: "Unmark backward" }
  - { key: T, icon: togglemarks.png, label: "Toggle marks" }
  - { key: D, icon: flagdel.png, label: "Flag for deletion" }
  - { key: X, icon: delete.png, label: "Delete flagged" }
  - { key: C, icon: zip.png, label: "Compress to archive" }
  - { key: G, icon: refresh.png, label: "Refresh" }
  - { key: L, icon: redisplay.png, label: "Redisplay marked" }
  - { key: I, icon: subdir.png, label: "Insert subdirectory" }
  - { key: J, icon: gotofile.png, label: "Go to file" }
  - { key: K, icon: hide.png, label: "Remove lines" }
  - { key: S, icon: sort.png, label: "Sort name / date" }
  - { key: W, icon: dired_copyname.png, label: "Copy file name" }
  - { key: Y, icon: filetype.png, label: "Show file type" }
  - { key: Q, icon: quitwin.png, label: "Quit window" }
  - { key: H, label: "Help" }                                   # describe-mode
  - { key: "=", icon: diff.png, label: "Diff" }
  - { key: ".", icon: clean.png, label: "Clean directory" }

  # --- Shift: upper-case letters and shifted symbols ---
  - { key: C, mods: [SHIFT], icon: copyfiles.png, label: "Copy files" }
  - { key: R, mods: [SHIFT], icon: rename.png, label: "Rename / move" }
  - { key: D, mods: [SHIFT], icon: deletenow.png, label: "Delete marked" }
  - { key: Z, mods: [SHIFT], icon: compress.png, label: "Compress / uncompress" }
  - { key: A, mods: [SHIFT], icon: grep.png, label: "Search marked files" }
  - { key: Q, mods: [SHIFT], icon: queryreplace.png, label: "Replace in marked files" }
  - { key: B, mods: [SHIFT], icon: bytecompile.png, label: "Byte-compile" }
  - { key: L, mods: [SHIFT], icon: load.png, label: "Load (Lisp)" }
  - { key: G, mods: [SHIFT], icon: chgrp.png, label: "Change group" }
  - { key: O, mods: [SHIFT], icon: chown.png, label: "Change owner" }
  - { key: M, mods: [SHIFT], icon: chmod.png, label: "Change mode" }
  - { key: T, mods: [SHIFT], icon: touch.png, label: "Touch (timestamp)" }
  - { key: H, mods: [SHIFT], icon: dired_hardlink.png, label: "Hard link" }
  - { key: S, mods: [SHIFT], icon: dired_symlink.png, label: "Symbolic link" }
  - { key: Y, mods: [SHIFT], icon: dired_relsymlink.png, label: "Relative symbolic link" }
  - { key: I, mods: [SHIFT], icon: info.png, label: "Open in Info" }
  - { key: N, mods: [SHIFT], icon: man.png, label: "Open as man page" }
  - { key: P, mods: [SHIFT], label: "Print" }
  - { key: U, mods: [SHIFT], icon: unmarkall.png, label: "Unmark all" }
  - { key: W, mods: [SHIFT], icon: browse.png, label: "Open in browser" }
  - { key: X, mods: [SHIFT], icon: shell.png, label: "Shell command" }
  - { key: "1", mods: [SHIFT], icon: shell.png, label: "Shell command" }               # !
  - { key: "7", mods: [SHIFT], icon: shell_async.png, label: "Async shell command" }   # &
  - { key: ",", mods: [SHIFT], icon: dired_dir_prev.png, label: "Previous directory line" }  # <
  - { key: ".", mods: [SHIFT], icon: dired_dir_next.png, label: "Next directory line" }      # >
  - { key: "6", mods: [SHIFT], icon: updir.png, label: "Parent directory" }            # ^
  - { key: "=", mods: [SHIFT], icon: mkdir.png, label: "New directory" }               # +
  - { key: "9", mods: [SHIFT], icon: details.png, label: "Hide / show details" }       # (
  - { key: "3", mods: [SHIFT], icon: dired_flag_autosave.png, label: "Flag auto-save files" }  # #
  - { key: "`", mods: [SHIFT], icon: dired_flag_backup.png, label: "Flag backup files" }       # ~
  - { key: "4", mods: [SHIFT], icon: hidesubdir.png, label: "Hide subdirectory" }      # $
  - { key: "/", mods: [SHIFT], icon: summary.png, label: "Summary" }                   # ?

  # --- Dired's own modified keys ---
  - { key: O, mods: [CTRL], icon: display.png, label: "Display in other window" }
  - { key: "[", mods: [ALT, SHIFT], icon: dired_marked_prev.png, label: "Previous marked file" }  # M-{
  - { key: "]", mods: [ALT, SHIFT], icon: dired_marked_next.png, label: "Next marked file" }      # M-}
  - { key: "4", mods: [ALT, SHIFT], icon: hideall.png, label: "Hide all subdirectories" }        # M-$
  - { key: BACKSPACE, mods: [ALT], icon: unmarkall.png, label: "Unmark all" }
  - { key: N, mods: [CTRL, ALT], icon: dired_subdir_next.png, label: "Next subdirectory" }
  - { key: P, mods: [CTRL, ALT], icon: dired_subdir_prev.png, label: "Previous subdirectory" }
  - { key: U, mods: [CTRL, ALT], icon: dired_tree_up.png, label: "Up directory tree" }
  - { key: D, mods: [CTRL, ALT], icon: dired_tree_down.png, label: "Down directory tree" }

  # --- global keys that apply in Dired (same icons as global.yaml) ---
  - { key: N, mods: [CTRL], icon: line_next.png, label: "Next line" }
  - { key: P, mods: [CTRL], icon: line_prev.png, label: "Previous line" }
  - { key: V, mods: [CTRL], icon: page_down.png, label: "Next screen" }
  - { key: V, mods: [ALT], icon: page_up.png, label: "Previous screen" }
  - { key: ",", mods: [ALT, SHIFT], icon: buf_start.png, label: "Buffer start" }       # M-<
  - { key: ".", mods: [ALT, SHIFT], icon: buf_end.png, label: "Buffer end" }           # M->
  - { key: S, mods: [CTRL], icon: isearch_fwd.png, label: "Search forward" }
  - { key: R, mods: [CTRL], icon: isearch_back.png, label: "Search backward" }
  - { key: L, mods: [CTRL], icon: recenter.png, label: "Recenter" }
  - { key: G, mods: [CTRL], icon: abort.png, label: "Abort command" }
  - { key: X, mods: [ALT], icon: command.png, label: "Run command (M-x)" }
  - { key: "/", mods: [CTRL], label: "Undo" }                    # dired-undo
  - { key: "-", mods: [CTRL, SHIFT], label: "Undo" }              # C-_
  - { key: H, mods: [CTRL], label: "Help" }
  - { key: F1, label: "Help" }
  - { key: F10, icon: menu.png, label: "Menu bar" }
