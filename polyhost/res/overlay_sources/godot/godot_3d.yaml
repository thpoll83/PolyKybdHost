# Godot editor, 3D screen (Node3D editor) keys for PolyKybd. See SOURCES.md.
#
# Only the keys of the 3D screen, drawn on top of godot_template (godot.yaml)
# when the plugin reports godot://3d. Shortcuts:
# editor/scene/3d/node_3d_editor_plugin.cpp and the node menu of
# editor/editor_node.cpp in Godot 4.7.2. The view keys (Top, Front, Right,
# orbit) are on the keypad and have no cell. The axis locks (X, Y, Z) work
# only while a transform runs and are left out: Y is also Use Snap. Freelook's
# W A S D Q E work only while the right mouse button is held.
#
# Regenerate:
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/godot/godot_3d.yaml --preview /tmp/godot_3d_preview
app: godot
match: [godot]
output: godot_3d_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: esc_3d.png         # the logo with the screen name (fetch_icons.py)
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [72, 40]
program_icon_margin: 0
program_icon_legend: false
bindings:
  # tools
  - { key: Q, icon: transform.png, label: "Transform mode" }
  - { key: W, icon: move.png, label: "Move mode" }
  - { key: E, icon: rotate.png, label: "Rotate mode" }
  - { key: R, icon: scale.png, label: "Scale mode" }
  - { key: V, icon: select.png, label: "Select mode" }
  - { key: M, icon: ruler.png, label: "Ruler mode" }
  - { key: T, icon: localspace.png, label: "Use local space" }
  - { key: Y, icon: snap.png, label: "Use snap" }
  - { key: U, icon: trackball.png, label: "Use trackball" }
  - { key: P, icon: preserve.png, label: "Preserve children transform" }
  - { key: B, icon: vertexsnap.png, label: "Vertex snap" }
  # view
  - { key: F, icon: fit_view.png, label: "Focus selection" }
  - { key: O, icon: origin.png, label: "Focus origin" }
  - { key: F, mods: [SHIFT], icon: freelook.png, label: "Toggle freelook" }
  - { key: P, mods: [CTRL], icon: camerapreview.png, label: "Toggle camera preview" }
  - { key: "1", mods: [CMDCTRL], icon: vp1.png, label: "1 viewport" }
  - { key: "2", mods: [CMDCTRL], icon: vp2.png, label: "2 viewports" }
  - { key: "2", mods: [CMDCTRL, ALT], icon: vp2alt.png, label: "2 viewports (alt)" }
  - { key: "3", mods: [CMDCTRL], icon: vp3.png, label: "3 viewports" }
  - { key: "3", mods: [CMDCTRL, ALT], icon: vp3alt.png, label: "3 viewports (alt)" }
  - { key: "4", mods: [CMDCTRL], icon: vp4.png, label: "4 viewports" }
  - { key: EQUAL, mods: [CMDCTRL], icon: fovless.png, label: "Decrease field of view" }
  - { key: MINUS, mods: [CMDCTRL], icon: fovmore.png, label: "Increase field of view" }
  - { key: "0", mods: [CMDCTRL], icon: fovreset.png, label: "Reset field of view" }
  # transform
  - { key: PGDN, icon: floor.png, label: "Snap object to floor" }
  - { key: G, mods: [SHIFT], icon: collision.png, label: "Reposition using collisions" }
  - { key: F, mods: [CMDCTRL, ALT], icon: alignrot.png, label: "Align rotation with view" }
  - { key: M, mods: [CTRL, ALT], icon: aligntransform.png, label: "Align transform with view", except: [macos] }
  - { key: W, mods: [ALT], icon: resetpos.png, label: "Reset position" }
  - { key: E, mods: [ALT], icon: resetrot.png, label: "Reset rotation" }
  - { key: R, mods: [ALT], icon: resetscale.png, label: "Reset scale" }
  - { key: K, icon: key_insert.png, label: "Insert animation key" }
  # nodes (editor_node.cpp)
  - { key: L, mods: [CMDCTRL], icon: lock.png, label: "Lock selected" }
  - { key: L, mods: [CMDCTRL, SHIFT], icon: unlock.png, label: "Unlock selected" }
  - { key: G, mods: [CMDCTRL], icon: group.png, label: "Group selected" }
  - { key: G, mods: [CMDCTRL, SHIFT], icon: ungroup.png, label: "Ungroup selected" }
  - { key: H, icon: visibility.png, label: "Toggle visibility" }
