# Godot editor (4.x) shortcut overlays for PolyKybd: the keys of every main
# screen. See SOURCES.md.
#
# This is the fallback set: the mapping shows it when no report from the
# PolyKybd Reporter plugin (godot-plugin/) arrives, and on the Asset Store
# screen. The 2D, 3D, Script and Game sets (godot_2d.yaml, ...) are drawn on
# top of it: a later file takes priority per key.
#
# Shortcuts: the default bindings in Godot 4.7.2's source (ED_SHORTCUT calls in
# editor/editor_node.cpp, editor/run/editor_run_bar.cpp,
# editor/docks/scene_tree_dock.cpp), checked against the "Default editor
# shortcuts" docs page (4.6). See SOURCES.md for the table.
#   CMDCTRL          Godot's CMD_OR_CTRL: Ctrl on Windows/Linux, Cmd on macOS.
#   CTRL             Godot's plain CTRL: Ctrl on every platform.
#   only: / except:  Godot's macOS overrides (ED_SHORTCUT_OVERRIDE "macos").
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/godot/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/godot/godot.yaml --preview /tmp/godot_preview
app: godot
match: [godot, godot_v4, godot_mono, org.godotengine.godot, org.godotengine.editor]
output: godot_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: godot.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- main screens ---
  - { key: F1, mods: [CTRL], icon: screen_2d.png, label: "2D screen", except: [macos] }
  - { key: F2, mods: [CTRL], icon: screen_3d.png, label: "3D screen", except: [macos] }
  - { key: F3, mods: [CTRL], icon: screen_script.png, label: "Script screen", except: [macos] }
  - { key: F4, mods: [CTRL], icon: screen_game.png, label: "Game screen", except: [macos] }
  - { key: F5, mods: [CTRL], icon: screen_assets.png, label: "Asset Store", except: [macos] }
  - { key: "1", mods: [GUI, CTRL], icon: screen_2d.png, label: "2D screen", only: [macos] }
  - { key: "2", mods: [GUI, CTRL], icon: screen_3d.png, label: "3D screen", only: [macos] }
  - { key: "3", mods: [GUI, CTRL], icon: screen_script.png, label: "Script screen", only: [macos] }
  - { key: "4", mods: [GUI, CTRL], icon: screen_game.png, label: "Game screen", only: [macos] }
  - { key: "5", mods: [GUI, CTRL], icon: screen_assets.png, label: "Asset Store", only: [macos] }

  # --- scene files ---
  - { key: N, mods: [CMDCTRL], icon: newscene.png, label: "New scene" }
  - { key: N, mods: [CMDCTRL, SHIFT], icon: inherited.png, label: "New inherited scene" }
  - { key: O, mods: [CMDCTRL], label: Open }
  - { key: S, mods: [CMDCTRL], label: Save }
  - { key: S, mods: [CMDCTRL, SHIFT], label: "Save as" }
  - { key: S, mods: [CMDCTRL, SHIFT, ALT], icon: saveall.png, label: "Save all scenes" }
  - { key: W, mods: [CMDCTRL, SHIFT], icon: closescene.png, label: "Close scene", except: [macos] }
  - { key: W, mods: [CMDCTRL], icon: closescene.png, label: "Close scene", only: [macos] }
  - { key: T, mods: [CMDCTRL, SHIFT], icon: reopen.png, label: "Reopen closed scene" }
  - { key: TAB, mods: [CTRL], icon: tab_next.png, label: "Next scene tab" }
  - { key: TAB, mods: [CTRL, SHIFT], icon: tab_prev.png, label: "Previous scene tab" }
  - { key: Q, mods: [CMDCTRL], label: Quit }
  - { key: Q, mods: [CTRL, SHIFT], icon: projectlist.png, label: "Quit to project list", except: [macos] }
  - { key: Q, mods: [GUI, CTRL, ALT], icon: projectlist.png, label: "Quit to project list", only: [macos] }
  - { key: COMMA, mods: [GUI], icon: settings.png, label: "Editor settings", only: [macos] }

  # --- quick open, search ---
  - { key: P, mods: [CMDCTRL], icon: quickopen.png, label: "Quick open" }
  - { key: O, mods: [SHIFT, ALT], icon: quickopen.png, label: "Quick open", except: [macos] }
  - { key: O, mods: [GUI, CTRL], icon: quickopen.png, label: "Quick open", only: [macos] }
  - { key: O, mods: [CMDCTRL, SHIFT], icon: openscene.png, label: "Quick open scene" }
  - { key: O, mods: [CMDCTRL, ALT], icon: openscript.png, label: "Quick open script" }
  - { key: P, mods: [CMDCTRL, SHIFT], icon: palette.png, label: "Command palette" }
  - { key: P, mods: [CMDCTRL, ALT], icon: filterfiles.png, label: "Filter files" }
  - { key: F, mods: [CMDCTRL, SHIFT], icon: findinfiles.png, label: "Find in files" }
  - { key: F1, icon: help.png, label: "Search help", except: [macos] }
  - { key: SPACE, mods: [ALT], icon: help.png, label: "Search help", only: [macos] }

  # --- edit ---
  - { key: Z, mods: [CMDCTRL], label: Undo }
  - { key: Z, mods: [CMDCTRL, SHIFT], label: Redo }

  # --- run (the run bar) ---
  - { key: F5, icon: play.png, label: "Run project", except: [macos] }
  - { key: F6, icon: playscene.png, label: "Run current scene", except: [macos] }
  - { key: F5, mods: [CTRL, SHIFT], icon: playcustom.png, label: "Run specific scene", except: [macos] }
  - { key: F7, icon: pause.png, label: "Pause running project", except: [macos] }
  - { key: F8, icon: stop.png, label: "Stop running project", except: [macos] }
  - { key: B, mods: [GUI], icon: play.png, label: "Run project", only: [macos] }
  - { key: R, mods: [GUI], icon: playscene.png, label: "Run current scene", only: [macos] }
  - { key: R, mods: [GUI, SHIFT], icon: playcustom.png, label: "Run specific scene", only: [macos] }
  - { key: Y, mods: [GUI, CTRL], icon: pause.png, label: "Pause running project", only: [macos] }
  - { key: DOT, mods: [GUI], icon: stop.png, label: "Stop running project", only: [macos] }
  # Debugger (docs page): while the project is stopped at a breakpoint.
  - { key: F10, icon: stepover.png, label: "Step over" }
  - { key: F11, icon: stepinto.png, label: "Step into" }
  - { key: F12, icon: continue.png, label: "Continue" }

  # --- window and panels ---
  - { key: F11, mods: [CTRL, SHIFT], icon: distraction.png, label: "Distraction free mode", except: [macos] }
  - { key: D, mods: [GUI, SHIFT], icon: distraction.png, label: "Distraction free mode", only: [macos] }
  - { key: F11, mods: [SHIFT], icon: fullscreen.png, label: "Toggle fullscreen", except: [macos] }
  - { key: F, mods: [GUI, CTRL], icon: fullscreen.png, label: "Toggle fullscreen", only: [macos] }
  - { key: F12, mods: [CTRL], icon: screenshot.png, label: "Take screenshot", except: [macos] }
  - { key: F12, mods: [GUI], icon: screenshot.png, label: "Take screenshot", only: [macos] }
  - { key: F12, mods: [SHIFT], icon: expandpanel.png, label: "Expand bottom panel" }
  - { key: J, mods: [CMDCTRL], icon: bottompanel.png, label: "Toggle last bottom panel" }
  - { key: D, mods: [ALT], icon: debugger.png, label: "Debugger panel" }
  - { key: F, mods: [ALT], icon: filesystem.png, label: "FileSystem dock" }
  - { key: N, mods: [ALT], icon: animation.png, label: "Animation panel" }
  - { key: A, mods: [ALT], icon: audio.png, label: "Audio panel" }
  - { key: O, mods: [ALT], icon: output.png, label: "Output panel" }
  - { key: S, mods: [ALT], icon: shader.png, label: "Shader editor panel" }

  # --- scene tree dock (when it has focus) ---
  - { key: A, mods: [CMDCTRL], icon: addnode.png, label: "Add child node" }
  - { key: A, mods: [CMDCTRL, SHIFT], icon: instantiate.png, label: "Instantiate child scene" }
  - { key: D, mods: [CMDCTRL], icon: duplicate.png, label: "Duplicate" }
  - { key: X, mods: [CMDCTRL], label: Cut }
  - { key: C, mods: [CMDCTRL], label: Copy }
  - { key: V, mods: [CMDCTRL], label: Paste }
  - { key: V, mods: [CMDCTRL, SHIFT], icon: pastesibling.png, label: "Paste as sibling" }
  - { key: V, mods: [ALT], icon: pastereplace.png, label: "Paste as replacement" }
  - { key: C, mods: [CMDCTRL, SHIFT], icon: nodepath.png, label: "Copy node path" }
  - { key: UP, mods: [CMDCTRL], icon: moveup.png, label: "Move node up" }
  - { key: DOWN, mods: [CMDCTRL], icon: movedown.png, label: "Move node down" }
  - { key: F2, icon: rename.png, label: "Rename", except: [macos] }
  - { key: F2, mods: [SHIFT], icon: batch_rename.png, label: "Batch rename", except: [macos] }
  - { key: DEL, mods: [SHIFT], icon: forcedelete.png, label: "Delete without asking" }
