# Godot editor, Script screen keys for PolyKybd. See SOURCES.md.
#
# Only the keys of the script editor, drawn on top of godot_template
# (godot.yaml) when the plugin reports godot://script. Shortcuts:
# editor/script/script_text_editor.cpp and editor/script/script_editor_plugin.cpp
# in Godot 4.7.2 (with their macOS overrides); Redo (Ctrl+Y), Select next
# occurrence, Complete symbol and the zoom keys from the docs page.
#   On macOS Godot gives Cmd+Shift+B to both Toggle Breakpoint and Go to
#   Previous Bookmark; the key shows Toggle Breakpoint there.
#
# Regenerate:
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/godot/godot_script.yaml --preview /tmp/godot_script_preview
app: godot
match: [godot]
output: godot_script_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: esc_script.png         # the logo with the screen name (fetch_icons.py)
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [72, 40]
program_icon_margin: 0
program_icon_legend: false

bindings:
  # edit
  - { key: X, mods: [CMDCTRL], label: Cut }
  - { key: C, mods: [CMDCTRL], label: Copy }
  - { key: V, mods: [CMDCTRL], label: Paste }
  - { key: A, mods: [CMDCTRL], label: "Select all" }
  - { key: Y, mods: [CMDCTRL], label: Redo }
  - { key: D, mods: [CMDCTRL], icon: nextoccurrence.png, label: "Select next occurrence" }
  - { key: SPACE, mods: [CTRL], icon: complete.png, label: "Complete symbol" }
  # lines
  - { key: UP, mods: [ALT], icon: lineup.png, label: "Move line up" }
  - { key: DOWN, mods: [ALT], icon: linedown.png, label: "Move line down" }
  - { key: K, mods: [CMDCTRL, SHIFT], icon: deleteline.png, label: "Delete line" }
  - { key: J, mods: [CMDCTRL, SHIFT], icon: joinlines.png, label: "Join lines" }
  - { key: K, mods: [CMDCTRL], icon: comment.png, label: "Toggle comment" }
  - { key: SLASH, mods: [CMDCTRL], icon: comment.png, label: "Toggle comment" }
  - { key: F, mods: [ALT], icon: fold.png, label: "Fold / unfold line", except: [macos] }
  - { key: F, mods: [GUI, CTRL], icon: fold.png, label: "Fold / unfold line", only: [macos] }
  - { key: R, mods: [ALT], icon: region.png, label: "Create code region" }
  - { key: D, mods: [CTRL, SHIFT], icon: dupselection.png, label: "Duplicate selection", except: [macos] }
  - { key: C, mods: [GUI, SHIFT], icon: dupselection.png, label: "Duplicate selection", only: [macos] }
  - { key: DOWN, mods: [CMDCTRL, ALT], icon: duplines.png, label: "Duplicate lines", except: [macos] }
  - { key: DOWN, mods: [CMDCTRL, SHIFT], icon: duplines.png, label: "Duplicate lines", only: [macos] }
  - { key: E, mods: [CMDCTRL, SHIFT], icon: evaluate.png, label: "Evaluate selection" }
  - { key: Z, mods: [ALT], icon: wordwrap.png, label: "Toggle word wrap" }
  - { key: T, mods: [CMDCTRL, ALT], icon: trim.png, label: "Trim trailing whitespace" }
  - { key: Y, mods: [CMDCTRL, SHIFT], icon: tospaces.png, label: "Indent to spaces" }
  - { key: I, mods: [CMDCTRL, SHIFT], icon: totabs.png, label: "Indent to tabs" }
  - { key: I, mods: [CMDCTRL], icon: autoindent.png, label: "Auto indent" }
  - { key: F4, mods: [SHIFT], icon: upper.png, label: Uppercase }
  - { key: F5, mods: [SHIFT], icon: lower.png, label: Lowercase }
  - { key: F6, mods: [SHIFT], icon: capitalize.png, label: Capitalize }
  # search
  - { key: F, mods: [CMDCTRL], label: Find }
  - { key: F3, icon: findnext.png, label: "Find next", shared: false, except: [macos] }
  - { key: F3, mods: [SHIFT], icon: findprev.png, label: "Find previous", except: [macos] }
  - { key: G, mods: [GUI], icon: findnext.png, label: "Find next", shared: false, only: [macos] }
  - { key: G, mods: [GUI, SHIFT], icon: findprev.png, label: "Find previous", only: [macos] }
  - { key: R, mods: [CTRL], icon: replace.png, label: Replace, except: [macos] }
  - { key: F, mods: [GUI, ALT], icon: replace.png, label: Replace, only: [macos] }
  - { key: R, mods: [CMDCTRL, SHIFT], icon: replaceinfiles.png, label: "Replace in files" }
  - { key: F1, mods: [ALT], icon: contexthelp.png, label: "Contextual help", except: [macos] }
  - { key: SPACE, mods: [ALT, SHIFT], icon: contexthelp.png, label: "Contextual help", only: [macos] }
  # go to
  - { key: G, mods: [CMDCTRL], icon: gotoline.png, label: "Go to line", except: [macos] }
  - { key: L, mods: [CMDCTRL], icon: gotoline.png, label: "Go to line", only: [macos] }
  - { key: F, mods: [CTRL, ALT], icon: gotosymbol.png, label: "Go to function", except: [macos] }
  - { key: J, mods: [GUI, CTRL], icon: gotosymbol.png, label: "Go to function", only: [macos] }
  - { key: B, mods: [CMDCTRL, ALT], icon: bookmark.png, label: "Toggle bookmark" }
  - { key: B, mods: [CMDCTRL], icon: bookmarknext.png, label: "Next bookmark", except: [macos] }
  - { key: B, mods: [CMDCTRL, SHIFT, ALT], icon: bookmarknext.png, label: "Next bookmark", only: [macos] }
  - { key: B, mods: [CMDCTRL, SHIFT], icon: bookmarkprev.png, label: "Previous bookmark", except: [macos] }
  - { key: LEFT, mods: [ALT], icon: goback.png, label: "History previous", except: [macos] }
  - { key: RIGHT, mods: [ALT], icon: goforward.png, label: "History next", except: [macos] }
  - { key: LEFT, mods: [GUI, ALT], icon: goback.png, label: "History previous", only: [macos] }
  - { key: RIGHT, mods: [GUI, ALT], icon: goforward.png, label: "History next", only: [macos] }
  # breakpoints
  - { key: F9, icon: breakpoint.png, label: "Toggle breakpoint", except: [macos] }
  - { key: B, mods: [GUI, SHIFT], icon: breakpoint.png, label: "Toggle breakpoint", only: [macos] }
  - { key: F9, mods: [CMDCTRL, SHIFT], icon: clearbreakpoints.png, label: "Remove all breakpoints" }
  - { key: DOT, mods: [CTRL], icon: nextbreakpoint.png, label: "Next breakpoint" }
  - { key: COMMA, mods: [CTRL], icon: prevbreakpoint.png, label: "Previous breakpoint" }
  # script files
  - { key: N, mods: [CMDCTRL], icon: newscript.png, label: "New script" }
  - { key: N, mods: [CMDCTRL, SHIFT], icon: newtextfile.png, label: "New text file" }
  - { key: S, mods: [CMDCTRL, ALT], icon: savescript.png, label: "Save script" }
  - { key: S, mods: [SHIFT, ALT], icon: saveall.png, label: "Save all scripts", except: [macos] }
  - { key: S, mods: [GUI, CTRL], icon: saveall.png, label: "Save all scripts", only: [macos] }
  - { key: R, mods: [CMDCTRL, ALT], icon: softreload.png, label: "Soft reload tool script" }
  - { key: W, mods: [CMDCTRL], icon: closeeditor.png, label: "Close script" }
  - { key: T, mods: [CMDCTRL, SHIFT], icon: reopen.png, label: "Reopen closed script" }
  - { key: X, mods: [CMDCTRL, SHIFT], icon: runscript.png, label: "Run script" }
  - { key: BACKSLASH, mods: [CMDCTRL], icon: sidebar.png, label: "Toggle files panel" }
  - { key: DOT, mods: [CMDCTRL, SHIFT], icon: tab_next.png, label: "Next script" }
  - { key: COMMA, mods: [CMDCTRL, SHIFT], icon: tab_prev.png, label: "Previous script" }
  - { key: UP, mods: [SHIFT, ALT], icon: moveup.png, label: "Move script up in list" }
  - { key: DOWN, mods: [SHIFT, ALT], icon: movedown.png, label: "Move script down in list" }
  # zoom
  - { key: EQUAL, mods: [CMDCTRL], label: "Zoom in" }
  - { key: MINUS, mods: [CMDCTRL], label: "Zoom out" }
  - { key: "0", mods: [CMDCTRL], icon: zoom100.png, label: "Reset zoom" }
