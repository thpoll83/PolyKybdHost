  - { key: "6", mods: [CMDCTRL, ALT], icon: print.png, label: "Print module" }
  - { key: "7", mods: [CMDCTRL, ALT], icon: web.png, label: "Web module" }
  - { key: LEFT, mods: [CMDCTRL, ALT], icon: back.png, label: "Go back" }
