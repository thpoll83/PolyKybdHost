# Adobe Lightroom Classic shortcut overlays for PolyKybd. See SOURCES.md.
#
# Shortcuts: Adobe Help, "Keyboard shortcuts" for Lightroom Classic (last
# updated 2025-10-29). Lightroom maps Ctrl to Cmd and Alt to Option on macOS,
# so every Ctrl chord is written CMDCTRL and one spec gives both sets
# (lightroom_template.* and lightroom_template_mac.*). Keys that differ on macOS
# are written twice under `except: [macos]` / `only: [macos]`. A literal CTRL
# (HDR merge, panorama merge, enhance) is Control on macOS, as Adobe lists it.
# A key with different meanings in different modules shows the Library or
# Develop meaning (SOURCES.md lists them).
#
# Regenerate:
#   python polyhost/res/overlay_sources/lightroom/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/lightroom/bindings.yaml --preview /tmp/lightroom_preview
app: lightroom
match: [lightroom, adobe lightroom classic]
output: lightroom_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: lightroom.png
program_icon_mode: alpha
program_icon_anchor: bottom-right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- views and tools (no modifier) ---
  - { key: G, mods: [], icon: grid.png, label: "Grid view" }
  - { key: E, mods: [], icon: loupe.png, label: "Loupe view" }
  - { key: C, mods: [], icon: compare.png, label: "Compare view" }
  - { key: N, mods: [], icon: survey.png, label: "Survey view" }
  - { key: D, mods: [], icon: develop.png, label: "Develop" }
  - { key: L, mods: [], icon: lightsout.png, label: "Lights out" }
  - { key: F, mods: [], icon: screenmode.png, label: "Screen mode" }
  - { key: I, mods: [], icon: info.png, label: "Info overlay" }
  - { key: T, mods: [], icon: toolbar.png, label: "Toolbar" }
  - { key: R, mods: [], icon: crop.png, label: "Crop" }
  - { key: W, mods: [], icon: whitebalance.png, label: "White balance" }
  - { key: K, mods: [], icon: brush.png, label: "Masking brush" }
  - { key: M, mods: [], icon: lineargradient.png, label: "Linear gradient" }
  - { key: Q, mods: [], icon: healing.png, label: "Spot removal" }
  - { key: P, mods: [], icon: pick.png, label: "Flag as pick" }
  - { key: X, mods: [], icon: reject.png, label: "Flag as reject" }
  - { key: U, mods: [], icon: unflag.png, label: "Unflag" }
  - { key: B, mods: [], icon: quickcollection.png, label: "Quick Collection" }
  - { key: V, mods: [], icon: grayscale.png, label: "Black and white" }
  - { key: J, mods: [], icon: clipping.png, label: "Show clipping" }
  - { key: Z, mods: [], icon: zoomview.png, label: "Zoom view" }
  - { key: Y, mods: [], icon: beforeafter.png, label: "Before / after" }
  - { key: "0", mods: [], icon: norating.png, label: "No rating" }
  - { key: "1", mods: [], icon: star1.png, label: "1 star" }
  - { key: "2", mods: [], icon: star2.png, label: "2 stars" }
  - { key: "3", mods: [], icon: star3.png, label: "3 stars" }
  - { key: "4", mods: [], icon: star4.png, label: "4 stars" }
  - { key: "5", mods: [], icon: star5.png, label: "5 stars" }
  - { key: "6", mods: [], icon: labelR.png, label: "Red label" }
  - { key: "7", mods: [], icon: labelY.png, label: "Yellow label" }
  - { key: "8", mods: [], icon: labelG.png, label: "Green label" }
  - { key: "9", mods: [], icon: labelB.png, label: "Blue label" }
  - { key: TAB, mods: [], icon: sidepanels.png, label: "Side panels" }
  - { key: F2, mods: [], icon: rename.png, label: "Rename photo" }
  - { key: F6, mods: [], icon: filmstrip.png, label: "Filmstrip" }
  - { key: F7, mods: [], icon: leftpanels.png, label: "Left panels" }
  - { key: F8, mods: [], icon: rightpanels.png, label: "Right panels" }
  # --- Shift ---
  - { key: P, mods: [SHIFT], icon: pick.png, label: "Pick, next photo" }
  - { key: X, mods: [SHIFT], icon: reject.png, label: "Reject, next photo" }
  - { key: U, mods: [SHIFT], icon: unflag.png, label: "Unflag, next photo" }
  - { key: Y, mods: [SHIFT], icon: splitview.png, label: "Before / after split" }
  - { key: W, mods: [SHIFT], icon: masking.png, label: "Masking" }
  - { key: M, mods: [SHIFT], icon: radialgradient.png, label: "Radial gradient" }
  - { key: R, mods: [SHIFT], icon: reference.png, label: "Reference view" }
  - { key: H, mods: [SHIFT], icon: hdrview.png, label: "HDR view" }
  # --- Alt / Option ---
  - { key: Y, mods: [ALT], icon: beforeaftertb.png, label: "Before / after top-bottom" }
  # --- Ctrl / Cmd ---
  - { key: Z, mods: [CMDCTRL], label: "Undo" }
  - { key: Y, mods: [CTRL], label: "Redo", except: [macos] }
  - { key: A, mods: [CMDCTRL], label: "Select all" }
  - { key: D, mods: [CMDCTRL], icon: deselect.png, label: "Deselect all" }
  - { key: F, mods: [CMDCTRL], icon: find.png, label: "Find photo" }
  - { key: G, mods: [CMDCTRL], icon: stack.png, label: "Group into stack" }
  - { key: L, mods: [CMDCTRL], icon: filters.png, label: "Filters on/off" }
  - { key: K, mods: [CMDCTRL], icon: keywords.png, label: "Add keywords" }
  - { key: J, mods: [CMDCTRL], icon: viewoptions.png, label: "View options" }
  - { key: B, mods: [CMDCTRL], icon: showquick.png, label: "Show Quick Collection" }
  - { key: E, mods: [CMDCTRL], icon: photoshop.png, label: "Edit in Photoshop" }
  - { key: R, mods: [CMDCTRL], icon: showfolder.png, label: "Show in folder" }
  - { key: U, mods: [CMDCTRL], icon: autotone.png, label: "Auto tone" }
  - { key: S, mods: [CMDCTRL], icon: savemeta.png, label: "Save metadata" }
  - { key: P, mods: [CMDCTRL], icon: print.png, label: "Print" }
  - { key: COMMA, mods: [CMDCTRL], icon: settings.png, label: "Preferences" }
  - { key: EQUAL, mods: [CMDCTRL], label: "Zoom in" }
  - { key: MINUS, mods: [CMDCTRL], label: "Zoom out" }
  - { key: RBRACKET, mods: [CMDCTRL], icon: rotateright.png, label: "Rotate right" }
  - { key: LBRACKET, mods: [CMDCTRL], icon: rotateleft.png, label: "Rotate left" }
  - { key: QUOTE, mods: [CMDCTRL], icon: virtualcopy.png, label: "Virtual copy" }
  - { key: ENTER, mods: [CMDCTRL], icon: slideshow.png, label: "Impromptu slide show" }
  - { key: SLASH, mods: [CMDCTRL], icon: shortcuts.png, label: "Module shortcuts" }
  - { key: LEFT, mods: [CMDCTRL], icon: prevphoto.png, label: "Previous photo" }
  - { key: RIGHT, mods: [CMDCTRL], icon: nextphoto.png, label: "Next photo" }
  - { key: O, mods: [CTRL], icon: catalog.png, label: "Open catalog", except: [macos] }
  - { key: O, mods: [GUI, SHIFT], icon: catalog.png, label: "Open catalog", only: [macos] }
  - { key: H, mods: [CTRL], icon: hdrmerge.png, label: "HDR merge" }
