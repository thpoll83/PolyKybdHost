#
# Keys: less 590 (Ubuntu 24.04 package), the summary of commands printed by `less -?` (= the `h` help
# screen), plus PageUp/PageDown/Home/End/arrows checked by driving less in a pty (TERM=xterm,
# LESSKEY=/dev/null). man pages are not installed here. man uses less, so this set serves both.
# Left out: commands that need a count or a following argument beyond one key (z, w), ESC-^F/^B,
# ^X^X and ^X^V chords, :-commands other than the ':' prefix, Esc.
# Terminal program: no Cmd keys. Esc shows the program mark.
#
#
# Regenerate:
#   python polyhost/res/overlay_sources/tui/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/tui/less.yaml --preview /tmp/less_preview
app: less
match: [less]
output: less_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

program_icon: less.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- Moving (help screen "MOVING"). Letter keys with their Ctrl aliases.
  # "e ^E j ^N CR" forward one line; "y ^Y k ^K ^P" backward one line;
  # "f ^F ^V SPACE" forward one window; "b ^B ESC-v" backward one window.
  - { key: E, icon: scroll_down.png, label: "Line down" }
  - { key: J, icon: scroll_down.png, label: "Line down" }
  - { key: ENTER, icon: scroll_down.png, label: "Line down" }
  - { key: E, mods: [CTRL], icon: scroll_down.png, label: "Line down" }
  - { key: N, mods: [CTRL], icon: scroll_down.png, label: "Line down" }
  - { key: Y, icon: scroll_up.png, label: "Line up" }
  - { key: K, icon: scroll_up.png, label: "Line up" }
  - { key: Y, mods: [CTRL], icon: scroll_up.png, label: "Line up" }
  - { key: K, mods: [CTRL], icon: scroll_up.png, label: "Line up" }
  - { key: P, mods: [CTRL], icon: scroll_up.png, label: "Line up" }
  - { key: F, icon: page_down.png, label: "Page down" }
  - { key: F, mods: [CTRL], icon: page_down.png, label: "Page down" }
  - { key: V, mods: [CTRL], icon: page_down.png, label: "Page down" }
  - { key: SPACE, icon: page_down.png, label: "Page down" }
  - { key: B, icon: page_up.png, label: "Page up" }
  - { key: B, mods: [CTRL], icon: page_up.png, label: "Page up" }
  - { key: V, mods: [ALT], icon: page_up.png, label: "Page up" }
  - { key: SPACE, mods: [ALT], icon: page_down.png, label: "Page down to the end" }
  - { key: D, icon: halfdown.png, label: "Half page down" }
  - { key: D, mods: [CTRL], icon: halfdown.png, label: "Half page down" }
  - { key: U, icon: halfup.png, label: "Half page up" }
  - { key: U, mods: [CTRL], icon: halfup.png, label: "Half page up" }
  # Arrow and paging keys: pty test with the xterm terminfo codes. Down/Up scroll one line,
  # PageDown/PageUp one window, Home/End go to first/last line, Right/Left scroll half a screen
  # width ("ESC-) RightArrow", "ESC-( LeftArrow").
  - { key: DOWN, icon: scroll_down.png, label: "Line down" }
  - { key: UP, icon: scroll_up.png, label: "Line up" }
  - { key: PAGE_DOWN, icon: page_down.png, label: "Page down" }
  - { key: PAGE_UP, icon: page_up.png, label: "Page up" }
  - { key: HOME, icon: file_start.png, label: "First line" }
  - { key: END, icon: file_end.png, label: "Last line" }
  - { key: RIGHT, icon: scroll_right.png, label: "Scroll right" }
  - { key: LEFT, icon: scroll_left.png, label: "Scroll left" }
  - { key: RIGHT, mods: [ALT], icon: scroll_right.png, label: "Scroll right" }
  - { key: LEFT, mods: [ALT], icon: scroll_left.png, label: "Scroll left" }
  # "F" forward forever like tail -f; "ESC-F" the same but stop when the search pattern is found.
  - { key: F, mods: [SHIFT], icon: follow.png, label: "Follow (tail -f)" }
  - { key: F, mods: [ALT, SHIFT], icon: follow.png, label: "Follow until match" }
  # "r ^R ^L" repaint; "R" repaint and discard buffered input.
  - { key: R, icon: reload.png, label: "Repaint screen" }
  - { key: R, mods: [CTRL], icon: reload.png, label: "Repaint screen" }
  - { key: L, mods: [CTRL], icon: reload.png, label: "Repaint screen" }
  - { key: R, mods: [SHIFT], icon: reload.png, label: "Repaint, drop input" }

  # --- Searching (help screen "SEARCHING").
  # "/pattern" forward, "?pattern" backward, "n" repeat, "N" repeat reversed,
  # "ESC-n" / "ESC-N" the same across files, "ESC-u" toggle highlight, "ESC-U" clear it,
  # "&pattern" show only matching lines.
  - { key: "/", icon: search.png, label: "Search forward" }
  - { key: "/", mods: [SHIFT], icon: search_back.png, label: "Search backward" }
  - { key: N, icon: find_next.png, label: "Next match" }
  - { key: N, mods: [SHIFT], icon: find_prev.png, label: "Previous match" }
  - { key: N, mods: [ALT], icon: find_next.png, label: "Next match, any file" }
  - { key: N, mods: [ALT, SHIFT], icon: find_prev.png, label: "Previous, any file" }
  - { key: U, mods: [ALT], icon: highlight.png, label: "Toggle highlight" }
  - { key: U, mods: [ALT, SHIFT], icon: clearhighlight.png, label: "Clear highlight" }
  - { key: "7", mods: [SHIFT], icon: filter.png, label: "Show matching lines" }

  # --- Jumping (help screen "JUMPING").
  # "g < ESC-<" first line (or line N); "G > ESC->" last line; "p %" N percent into the file;
  # "t" / "T" next / previous tag; "{ ( [" find close bracket; "} ) ]" find open bracket.
  - { key: G, icon: file_start.png, label: "First line" }
  - { key: ",", mods: [SHIFT], icon: file_start.png, label: "First line" }
  - { key: ",", mods: [ALT, SHIFT], icon: file_start.png, label: "First line" }
  - { key: G, mods: [SHIFT], icon: file_end.png, label: "Last line" }
  - { key: ".", mods: [SHIFT], icon: file_end.png, label: "Last line" }
  - { key: ".", mods: [ALT, SHIFT], icon: file_end.png, label: "Last line" }
  - { key: P, icon: goto_line.png, label: "Go to percent" }
  - { key: "5", mods: [SHIFT], icon: goto_line.png, label: "Go to percent" }
  - { key: T, icon: next.png, label: "Next tag" }
  - { key: T, mods: [SHIFT], icon: prev.png, label: "Previous tag" }
  - { key: "[", icon: bracket.png, label: "Find close bracket" }
  - { key: "]", icon: bracket.png, label: "Find open bracket" }
  # "m<letter>" mark top line, "M<letter>" mark bottom line, "'<letter>" go to mark,
  # "''" previous position, "ESC-M<letter>" clear a mark.
  - { key: M, icon: mark.png, label: "Set mark (top)" }
  - { key: M, mods: [SHIFT], icon: mark.png, label: "Set mark (bottom)" }
  - { key: "'", icon: gotomark.png, label: "Go to mark" }
  - { key: M, mods: [ALT, SHIFT], icon: clearmark.png, label: "Clear a mark" }

  # --- Changing files and miscellaneous.
  # ":" starts :e (examine), :n / :p (next / previous file), :x, :d, :f, :q.
  # "= ^G :f" print file name and position; "-<flag>" toggle an option; "_<flag>" show an option;
  # "!command" shell; "|Xcommand" pipe to a shell command; "s file" save input;
  # "v" edit with $VISUAL or $EDITOR; "V" version; "h H" help; "q :q Q :Q ZZ" quit.
  - { key: ";", mods: [SHIFT], icon: commandpalette.png, label: "Command (:e :n :p)" }
  - { key: "=", icon: fileinfo.png, label: "File name, position" }
  - { key: G, mods: [CTRL], icon: fileinfo.png, label: "File name, position" }
  - { key: "-", icon: option.png, label: "Toggle option" }
  - { key: "-", mods: [SHIFT], icon: option.png, label: "Show option" }
  - { key: "1", mods: [SHIFT], icon: terminal.png, label: "Shell command" }
  - { key: "\\", mods: [SHIFT], icon: pipe.png, label: "Pipe to command" }
  - { key: S, icon: save.png, label: "Save input to file" }
  - { key: V, icon: editor.png, label: "Edit in $EDITOR" }
  - { key: V, mods: [SHIFT], icon: version.png, label: "Show version" }
  - { key: H, icon: shortcuts.png, label: "Help" }
  - { key: H, mods: [SHIFT], icon: shortcuts.png, label: "Help" }
  - { key: Q, icon: exit.png, label: "Quit" }
  - { key: Q, mods: [SHIFT], icon: exit.png, label: "Quit" }
