#
# Keys: htop 3.3.0 (htop-dev/htop tag 3.3.0), Action.c Action_setBindings() and the
# man page (htop.1.in, INTERACTIVE COMMANDS). Only the main process view is covered.
# Terminal program: no Cmd keys. Esc shows the program mark. Plain letter keys are the
# main commands of the main process view. Keys that act only inside a dialog or popup
# (signal menu, setup screen, sort menu, help) are left out.
#
#
# Regenerate:
#   python polyhost/res/overlay_sources/tui/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/tui/htop.yaml --preview /tmp/htop_preview
app: "htop"
match: [htop]
output: htop_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

program_icon: htop.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- Action.c Action_setBindings: keys[KEY_F(1)]=keys['h']=keys['?']=actionHelp,
  # F2/S/C=actionSetup, F3 and '/'=actionIncSearch, F4 and '\\'=actionIncFilter,
  # F9 and 'k'=actionKill, F10 and 'q'=actionQuit.
  - { key: F1, icon: shortcuts.png, label: "Help" }
  - { key: H, icon: shortcuts.png, label: "Help" }
  - { key: "/", mods: [SHIFT], icon: shortcuts.png, label: "Help" }
  - { key: F2, icon: settings.png, label: "Setup" }
  - { key: S, mods: [SHIFT], icon: settings.png, label: "Setup" }
  - { key: C, mods: [SHIFT], icon: settings.png, label: "Setup" }
  - { key: F3, icon: search.png, label: "Search" }
  - { key: "/", icon: search.png, label: "Search" }
  - { key: F4, icon: filter.png, label: "Filter" }
  - { key: "\\", icon: filter.png, label: "Filter" }
  - { key: F5, icon: tree.png, label: "Tree view" }
  - { key: T, icon: tree.png, label: "Tree view" }
  - { key: F9, icon: kill.png, label: "Kill process" }
  - { key: K, icon: kill.png, label: "Kill process" }
  - { key: F10, icon: exit.png, label: "Quit" }
  - { key: Q, icon: exit.png, label: "Quit" }
  # --- Sorting. F6 and ',' '.' '<' '>' all run actionSetSortColumn (opens the sort
  # column menu). M/N/P/T = actionSortByMemory/PID/CPU/Time, I = actionInvertSortOrder.
  - { key: F6, icon: sort.png, label: "Sort by..." }
  - { key: ",", icon: sort.png, label: "Sort by..." }
  - { key: ".", icon: sort.png, label: "Sort by..." }
  - { key: ",", mods: [SHIFT], icon: sort.png, label: "Sort by..." }
  - { key: ".", mods: [SHIFT], icon: sort.png, label: "Sort by..." }
  - { key: M, mods: [SHIFT], icon: sort_mem.png, label: "Sort by memory" }
  - { key: N, mods: [SHIFT], icon: sort_pid.png, label: "Sort by PID" }
  - { key: P, mods: [SHIFT], icon: sort_cpu.png, label: "Sort by CPU" }
  - { key: T, mods: [SHIFT], icon: sort_time.png, label: "Sort by time" }
  - { key: I, mods: [SHIFT], icon: sort_invert.png, label: "Invert sort order" }
  # --- Priority: F7 and ']' = actionHigherPriority, F8 and '[' = actionLowerPriority.
  # Raising priority needs root.
  - { key: F7, icon: nice_up.png, label: "Raise priority" }
  - { key: "]", icon: nice_up.png, label: "Raise priority" }
  - { key: F8, icon: nice_down.png, label: "Lower priority" }
  - { key: "[", icon: nice_down.png, label: "Lower priority" }
  # --- Process tools: 'a' actionSetAffinity, 'e' actionShowEnvScreen, 'l' actionLsof,
  # 's' actionStrace, 'w' actionShowCommandScreen, 'x' actionShowLocks,
  # 'u' actionFilterByUser, 'F' Action_follow. l, s need lsof/strace installed.
  - { key: A, icon: affinity.png, label: "CPU affinity" }
  - { key: E, icon: env.png, label: "Environment" }
  - { key: L, icon: lsof.png, label: "Open files" }
  - { key: S, icon: strace.png, label: "Trace syscalls" }
  - { key: W, icon: command.png, label: "Full command line" }
  - { key: X, icon: locks.png, label: "File locks" }
  - { key: U, icon: user.png, label: "Filter by user" }
  - { key: F, mods: [SHIFT], icon: follow.png, label: "Follow process" }
  # --- Tagging: ' ' actionTag, 'c' actionTagAllChildren, 'U' actionUntagAll.
  - { key: SPACE, icon: tag.png, label: "Tag process" }
  - { key: C, icon: tag.png, label: "Tag with children" }
  - { key: U, mods: [SHIFT], icon: untag.png, label: "Untag all" }
  # --- Tree view: '+' '-' '=' actionExpandOrCollapse, '*' actionExpandOrCollapseAllBranches.
  # Act only in tree view.
  - { key: "=", icon: expand.png, label: "Expand/collapse" }
  - { key: "=", mods: [SHIFT], icon: expand.png, label: "Expand/collapse" }
  - { key: "-", icon: expand.png, label: "Expand/collapse" }
  - { key: "8", mods: [SHIFT], icon: expand_all.png, label: "Expand/collapse all" }
  # --- Display toggles: H actionToggleUserlandThreads, K actionToggleKernelThreads,
  # O actionToggleRunningInContainer, m actionToggleMergedCommand,
  # p actionToggleProgramPath, '#' actionToggleHideMeters, Z actionTogglePauseUpdate.
  - { key: H, mods: [SHIFT], icon: hide_threads.png, label: "Hide user threads" }
  - { key: K, mods: [SHIFT], icon: hide_kernel.png, label: "Hide kernel threads" }
  - { key: O, mods: [SHIFT], icon: hide_containers.png, label: "Hide containers" }
  - { key: M, icon: merge.png, label: "Merge command" }
  - { key: P, icon: path.png, label: "Show program path" }
  - { key: "3", mods: [SHIFT], icon: hide_meters.png, label: "Hide meters" }
  - { key: Z, mods: [SHIFT], icon: pause.png, label: "Pause updates" }
  # --- Screens and redraw: '\t' actionNextScreen, KEY_SHIFT_TAB actionPrevScreen (screen
  # tabs, shown when enabled in setup), Ctrl+L ('\014') actionRedraw.
  - { key: TAB, icon: screen_tab.png, label: "Next screen tab" }
  - { key: TAB, mods: [SHIFT], icon: screen_tab_prev.png, label: "Prev screen tab" }
  - { key: L, mods: [CTRL], icon: reload.png, label: "Redraw" }
