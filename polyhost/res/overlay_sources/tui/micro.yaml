#
# Keys: micro 2.0.13, default bindings in internal/action/defaults_other.go (bufdefaults, Linux/Windows; the
# Darwin table is not used because Cmd never reaches a terminal). Cursor movement, selection
# by Shift+arrows, Backspace/Delete and Esc are left out.
# Terminal program: no Cmd keys. Esc shows the program mark.
#
#
# Regenerate:
#   python polyhost/res/overlay_sources/tui/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/tui/micro.yaml --preview /tmp/micro_preview
app: micro
match: [micro]
output: micro_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

program_icon: micro.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- File and tabs: "Ctrl-o":"OpenFile", "Ctrl-s":"Save", "F2":"Save", "Ctrl-q":"Quit", "F4"/"F10":"Quit",
  # "Ctrl-t":"AddTab", "Alt-,":"PreviousTab", "Alt-.":"NextTab".
  - { key: O, mods: [CTRL], icon: openfile.png, label: "Open file" }
  - { key: S, mods: [CTRL], icon: save.png, label: "Save" }
  - { key: F2, icon: save.png, label: "Save" }
  - { key: Q, mods: [CTRL], icon: exit.png, label: "Quit" }
  - { key: F4, icon: exit.png, label: "Quit" }
  - { key: F10, icon: exit.png, label: "Quit" }
  - { key: T, mods: [CTRL], icon: newtab.png, label: "New tab" }
  - { key: ",", mods: [ALT], icon: prev.png, label: "Previous tab" }
  - { key: ".", mods: [ALT], icon: next.png, label: "Next tab" }
  # --- Search: "Ctrl-f":"Find", "F3"/"F7":"Find", "Alt-F":"FindLiteral", "Ctrl-n":"FindNext", "Ctrl-p":"FindPrevious".
  - { key: F, mods: [CTRL], icon: find.png, label: "Find" }
  - { key: F3, icon: find.png, label: "Find" }
  - { key: F7, icon: find.png, label: "Find" }
  - { key: F, mods: [ALT, SHIFT], icon: search.png, label: "Find literal" }
  - { key: N, mods: [CTRL], icon: find_next.png, label: "Find next" }
  - { key: P, mods: [CTRL], icon: find_prev.png, label: "Find previous" }
  # --- Edit: "Ctrl-z":"Undo", "Ctrl-y":"Redo", "Ctrl-c":"CopyLine|Copy", "Ctrl-x":"Cut", "Ctrl-k":"CutLine",
  # "Ctrl-d":"DuplicateLine", "Ctrl-v":"Paste", "Ctrl-a":"SelectAll", "Insert":"ToggleOverwriteMode".
  - { key: Z, mods: [CTRL], icon: undo.png, label: "Undo" }
  - { key: Y, mods: [CTRL], icon: redo.png, label: "Redo" }
  - { key: C, mods: [CTRL], icon: copy.png, label: "Copy" }
  - { key: X, mods: [CTRL], icon: cut.png, label: "Cut" }
  - { key: K, mods: [CTRL], icon: cutline.png, label: "Cut line" }
  - { key: D, mods: [CTRL], icon: duplicate.png, label: "Duplicate line" }
  - { key: V, mods: [CTRL], icon: paste.png, label: "Paste" }
  - { key: A, mods: [CTRL], icon: selectall.png, label: "Select all" }
  - { key: INSERT, icon: overwrite.png, label: "Overwrite mode" }
  # --- Tab: "Tab":"Autocomplete|IndentSelection|InsertTab", "Backtab":"CycleAutocompleteBack|OutdentSelection|OutdentLine".
  - { key: TAB, icon: indent.png, label: "Complete / indent" }
  - { key: TAB, mods: [SHIFT], icon: unindent.png, label: "Outdent" }
  # --- Lines and changes: "AltUp":"MoveLinesUp", "AltDown":"MoveLinesDown", "Alt-[":"DiffPrevious|CursorStart",
  # "Alt-]":"DiffNext|CursorEnd".
  - { key: UP, mods: [ALT], icon: moveup.png, label: "Move line up" }
  - { key: DOWN, mods: [ALT], icon: movedown.png, label: "Move line down" }
  - { key: "[", mods: [ALT], icon: prevchange.png, label: "Previous change" }
  - { key: "]", mods: [ALT], icon: nextchange.png, label: "Next change" }
  # --- Multiple cursors: "Alt-n":"SpawnMultiCursor", "Alt-m":"SpawnMultiCursorSelect", "AltShiftUp"/"AltShiftDown":
  # "SpawnMultiCursorUp/Down", "Alt-p":"RemoveMultiCursor", "Alt-c":"RemoveAllMultiCursors", "Alt-x":"SkipMultiCursor".
  - { key: N, mods: [ALT], icon: multicursor.png, label: "Add cursor at match" }
  - { key: M, mods: [ALT], icon: multicursorsel.png, label: "Cursors on selection" }
  - { key: UP, mods: [ALT, SHIFT], icon: cursorabove.png, label: "Cursor above" }
  - { key: DOWN, mods: [ALT, SHIFT], icon: cursorbelow.png, label: "Cursor below" }
  - { key: P, mods: [ALT], icon: cursorremove.png, label: "Remove last cursor" }
  - { key: C, mods: [ALT], icon: cursorsclear.png, label: "Remove all cursors" }
  - { key: X, mods: [ALT], icon: cursorskip.png, label: "Skip match" }
  # --- UI: "Ctrl-g":"ToggleHelp", "Alt-g":"ToggleKeyMenu", "Ctrl-r":"ToggleRuler", "Ctrl-l":"command-edit:goto ",
  # "Ctrl-b":"ShellMode", "Ctrl-e":"CommandMode", "Ctrl-w":"NextSplit", "Ctrl-u":"ToggleMacro", "Ctrl-j":"PlayMacro".
  - { key: G, mods: [CTRL], icon: shortcuts.png, label: "Help" }
  - { key: G, mods: [ALT], icon: helplines.png, label: "Key menu" }
  - { key: R, mods: [CTRL], icon: linenumbers.png, label: "Line numbers" }
  - { key: L, mods: [CTRL], icon: goto_line.png, label: "Go to line" }
  - { key: B, mods: [CTRL], icon: terminal.png, label: "Shell command" }
  - { key: E, mods: [CTRL], icon: commandpalette.png, label: "Command bar" }
  - { key: W, mods: [CTRL], icon: focusnext.png, label: "Next split" }
  - { key: U, mods: [CTRL], icon: macro_record.png, label: "Record macro" }
  - { key: J, mods: [CTRL], icon: macro_run.png, label: "Play macro" }
