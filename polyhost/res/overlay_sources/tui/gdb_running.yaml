#
# GDB while the program runs: the title `gdb ▶ <program>` that the PolyKybd GDB script
# (gdb-plugin/polykybd.py) writes on `gdb.events.cont`. The terminal then belongs to the program,
# so the prompt's keys do nothing. Only Ctrl+C reaches GDB: "an interrupt (often Ctrl-c) does not
# exit from GDB, but rather terminates the action of any GDB command that is in progress and
# returns to GDB command level" (gdb.texinfo, GDB 15.1, node "Interrupting"). The program receives
# every other key. Checked by driving gdb 15.1 with the script in a pty.
# Terminal program: no Cmd keys. Esc shows the program mark.
#
# Regenerate:
#   python polyhost/res/overlay_sources/tui/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/tui/gdb_running.yaml --preview /tmp/gdb_running_preview
app: GDB (program running)
match: [gdb]
output: gdb_running_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

program_icon: gdb.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  - { key: C, mods: [CTRL], icon: stop.png, label: "Interrupt" }
