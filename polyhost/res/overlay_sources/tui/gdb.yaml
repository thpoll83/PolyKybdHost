#
# Keys: GDB 15.1 (Ubuntu 24.04 package). Docs: gdb.texinfo at tag gdb-15.1-release, node "TUI Key
# Bindings" (C-x a/1/2/o/s, PgUp/PgDn/Up/Down/Left/Right, C-L) and "Quitting GDB" (Ctrl-d); Ctrl-c
# from "Interrupting". Ctrl+R (readline reverse-search-history), Ctrl+L, Ctrl+D and Ctrl+X 1 were also
# checked by driving gdb in a pty. The TUI single-key mode letters are left out.
# Letter keys: the one-letter abbreviations of the prompt's commands (b break, c continue, ...),
# each checked with `gdb -batch -ex "help <letter>"`. They are typed at the (gdb) prompt, followed
# by Enter, and do nothing while the program runs.
# Terminal program: no Cmd keys. Esc shows the program mark.
#
#
# Regenerate:
#   python polyhost/res/overlay_sources/tui/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/tui/gdb.yaml --preview /tmp/gdb_preview
app: GDB
match: [gdb]
output: gdb_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

program_icon: gdb.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

# The IDE sets' step icons are whole 72x40 cells; they render 1:1 as there.
_reclaimed: &reclaimed { region: [72, 40], anchor: center }

bindings:
  # --- Interrupt and quit. "an interrupt (often Ctrl-c) does not exit from GDB, but rather
  # terminates the action of any GDB command that is in progress and returns to GDB command level";
  # "type an end-of-file character (usually Ctrl-d)" to exit.
  - { key: C, mods: [CTRL], icon: stop.png, label: "Interrupt" }
  - { key: D, mods: [CTRL], icon: exit.png, label: "Quit GDB" }
  # --- Readline default emacs keymap (GDB uses readline): Ctrl+R is reverse-search-history;
  # in a pty it shows "(reverse-i-search)". Ctrl+L: in the CLI it clears the screen (pty test);
  # in the TUI, "C-L: Refresh the screen".
  - { key: R, mods: [CTRL], icon: history.png, label: "History search" }
  - { key: L, mods: [CTRL], icon: reload.png, label: "Refresh screen" }
  # --- TUI "following key bindings only work in the TUI mode": scroll the ACTIVE window.
  # In the command window (or in CLI mode) the arrows keep their readline meaning (history,
  # cursor); the label is for the TUI.
  - { key: PAGE_UP, icon: page_up.png, label: "Scroll window page" }
  - { key: PAGE_DOWN, icon: page_down.png, label: "Scroll window page" }
  - { key: UP, icon: scroll_up.png, label: "Scroll window up" }
  - { key: DOWN, icon: scroll_down.png, label: "Scroll window down" }
  - { key: LEFT, icon: scroll_left.png, label: "Scroll window left" }
  - { key: RIGHT, icon: scroll_right.png, label: "Scroll window right" }
  # --- Ctrl+X is the leader of the TUI keys: C-x a / A / C-x C-a toggle TUI mode, C-x 1 one
  # window, C-x 2 next two-window layout, C-x o next window (active window), C-x s single-key mode.
  - { key: X, mods: [CTRL], icon: gdb_tui.png, label: "TUI keys" }

  # --- One-letter command abbreviations (gdb.texinfo "Command Syntax": a
  # command name may be abbreviated when unambiguous, and these one-letter
  # forms are defined aliases). They are typed at the (gdb) prompt and need
  # Enter, so the keys work as a cheat sheet; while the program runs gdb takes
  # no commands. Checked with `help <letter>` in GDB 15.1.
  - { key: B, icon: gdb_break.png, label: "b: break" }
  - { key: C, icon: gdb_continue.png, label: "c: continue" }
  - { key: D, icon: gdb_delete.png, label: "d: delete breakpts" }
  - { key: F, icon: gdb_frame.png, label: "f: frame" }
  - { key: I, icon: details.png, label: "i: info" }
  - { key: J, icon: jump.png, label: "j: jump" }
  - { key: K, icon: kill.png, label: "k: kill program" }
  - { key: L, icon: listing.png, label: "l: list source" }
  - { key: N, icon: stepover.png, <<: *reclaimed, label: "n: next (over)" }
  - { key: P, icon: quickwatch.png, label: "p: print" }
  - { key: Q, icon: exit.png, label: "q: quit" }
  - { key: R, icon: gdb_run.png, label: "r: run" }
  - { key: S, icon: stepinto.png, <<: *reclaimed, label: "s: step (into)" }
  - { key: T, icon: gdb_thread.png, label: "t: thread" }
  - { key: U, icon: runtocursor.png, label: "u: until" }
  - { key: X, icon: sort_cpu.png, label: "x: examine memory" }
