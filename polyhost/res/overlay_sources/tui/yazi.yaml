#
# Keys: Yazi 0.3.3, default keymap yazi-config/preset/keymap.toml at tag v0.3.3
# (github.com/sxyazi/yazi), the [manager] section (the file list view). The installed
# binary reports "Yazi 0.3.3 (7c445ce 2024-09-04)". Chords (g g, g h, m s, c c, ,m ...)
# are left out. Esc / Ctrl+[ shows the program mark. Plain letters are Yazi's main commands.
#
#
# Regenerate:
#   python polyhost/res/overlay_sources/tui/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/tui/yazi.yaml --preview /tmp/yazi_preview
app: Yazi
match: [yazi]
output: yazi_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

program_icon: yazi.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- [manager]: q "quit", Q "quit --no-cwd-file", <C-c> "close" (close tab, quit if last),
  # <C-z> "suspend"
  - { key: Q, icon: exit.png, label: "Quit" }
  - { key: Q, mods: [SHIFT], icon: exit.png, label: "Quit, no cwd file" }
  - { key: C, mods: [CTRL], icon: close.png, label: "Close tab" }
  - { key: Z, mods: [CTRL], icon: suspend.png, label: "Suspend" }
  # --- [manager] Hopping: k/j "arrow -1/1", h "leave", l "enter", <C-u>/<C-d> "arrow -50%",
  # <C-b>/<C-f> "arrow -100%", <S-PageUp>/<S-PageDown> "arrow +-50%", <PageUp>/<PageDown> "arrow +-100%",
  # G "arrow 99999999", H "back", L "forward"
  - { key: K, icon: scroll_up.png, label: "Cursor up" }
  - { key: J, icon: scroll_down.png, label: "Cursor down" }
  - { key: H, icon: back.png, label: "Parent directory" }
  - { key: L, icon: openfolder.png, label: "Enter directory" }
  - { key: U, mods: [CTRL], icon: page_up.png, label: "Half page up" }
  - { key: D, mods: [CTRL], icon: page_down.png, label: "Half page down" }
  - { key: B, mods: [CTRL], icon: page_up.png, label: "Page up" }
  - { key: F, mods: [CTRL], icon: page_down.png, label: "Page down" }
  - { key: PAGE_UP, mods: [SHIFT], icon: page_up.png, label: "Half page up" }
  - { key: PAGE_DOWN, mods: [SHIFT], icon: page_down.png, label: "Half page down" }
  - { key: PAGE_UP, icon: page_up.png, label: "Page up" }
  - { key: PAGE_DOWN, icon: page_down.png, label: "Page down" }
  - { key: G, mods: [SHIFT], icon: file_end.png, label: "Go to bottom" }
  - { key: H, mods: [SHIFT], icon: prev.png, label: "Back in history" }
  - { key: L, mods: [SHIFT], icon: next.png, label: "Forward in history" }
  # --- [manager] Seeking: K "seek -5", J "seek 5" (preview)
  - { key: K, mods: [SHIFT], icon: scroll_up.png, label: "Preview up" }
  - { key: J, mods: [SHIFT], icon: scroll_down.png, label: "Preview down" }
  # --- [manager] Selection: <Space> "select --state=none" + "arrow 1", v "visual_mode",
  # V "visual_mode --unset", <C-a> "select_all --state=true", <C-r> "select_all --state=none"
  - { key: SPACE, icon: mark.png, label: "Toggle selection" }
  - { key: V, icon: visual.png, label: "Visual mode" }
  - { key: V, mods: [SHIFT], icon: visual.png, label: "Visual mode (unset)" }
  - { key: A, mods: [CTRL], icon: selectgroup.png, label: "Select all" }
  - { key: R, mods: [CTRL], icon: invert.png, label: "Invert selection" }
  # --- [manager] Operation: o/<Enter> "open", O "open --interactive", y "yank",
  # x "yank --cut", p "paste", P "paste --force", - "link", _ "link --relative",
  # Y/X "unyank", d "remove", D "remove --permanently", a "create", r "rename --cursor=before_ext",
  # ; "shell --interactive", : "shell --block --interactive", . "hidden toggle"
  - { key: O, icon: open.png, label: "Open" }
  - { key: ENTER, icon: open.png, label: "Open" }
  - { key: O, mods: [SHIFT], icon: open.png, label: "Open with..." }
  - { key: Y, icon: copy.png, label: "Yank (copy)" }
  - { key: X, icon: cut.png, label: "Yank (cut)" }
  - { key: P, icon: paste.png, label: "Paste" }
  - { key: P, mods: [SHIFT], icon: paste.png, label: "Paste, overwrite" }
  - { key: "-", icon: link.png, label: "Symlink (absolute)" }
  - { key: "-", mods: [SHIFT], icon: link.png, label: "Symlink (relative)" }
  - { key: Y, mods: [SHIFT], icon: cancel.png, label: "Cancel yank" }
  - { key: X, mods: [SHIFT], icon: cancel.png, label: "Cancel yank" }
  - { key: D, icon: delete.png, label: "Move to trash" }
  - { key: D, mods: [SHIFT], icon: delete.png, label: "Delete permanently" }
  - { key: A, icon: newfile.png, label: "Create file or dir" }
  - { key: R, icon: rename.png, label: "Rename" }
  - { key: ";", icon: terminal.png, label: "Run shell command" }
  - { key: ";", mods: [SHIFT], icon: terminal.png, label: "Shell, wait for it" }
  - { key: ".", icon: hidden.png, label: "Toggle hidden files" }
  # --- [manager] Search: s "search fd", S "search rg", <C-s> "escape --search",
  # z "plugin zoxide", Z "plugin fzf"
  - { key: S, icon: search.png, label: "Search by name" }
  - { key: S, mods: [SHIFT], icon: find.png, label: "Search content" }
  - { key: S, mods: [CTRL], icon: stop.png, label: "Cancel search" }
  - { key: Z, icon: jump.png, label: "Jump (zoxide)" }
  - { key: Z, mods: [SHIFT], icon: jump.png, label: "Jump (fzf)" }
  # --- [manager] Filter / Find: f "filter --smart", / "find --smart", ? "find --previous --smart",
  # n "find_arrow", N "find_arrow --previous"
  - { key: F, icon: filter.png, label: "Filter files" }
  - { key: "/", icon: search_fwd.png, label: "Find next" }
  - { key: "/", mods: [SHIFT], icon: search_back.png, label: "Find previous" }
  - { key: N, icon: find_next.png, label: "Next match" }
  - { key: N, mods: [SHIFT], icon: find_prev.png, label: "Previous match" }
  # --- [manager] Tabs: t "tab_create --current", 1-9 "tab_switch 0-8", [ ] "tab_switch -1/1 --relative",
  # { } "tab_swap -1/1"
  - { key: T, icon: tab_new.png, label: "New tab" }
  - { key: "1", icon: tab1.png, label: "Tab 1" }
  - { key: "2", icon: tab2.png, label: "Tab 2" }
  - { key: "3", icon: tab3.png, label: "Tab 3" }
  - { key: "4", icon: tab4.png, label: "Tab 4" }
  - { key: "5", icon: tab5.png, label: "Tab 5" }
  - { key: "6", icon: tab6.png, label: "Tab 6" }
  - { key: "7", icon: tab7.png, label: "Tab 7" }
  - { key: "8", icon: tab8.png, label: "Tab 8" }
  - { key: "9", icon: tab9.png, label: "Tab 9" }
  - { key: "[", icon: prev.png, label: "Previous tab" }
  - { key: "]", icon: next.png, label: "Next tab" }
  - { key: "[", mods: [SHIFT], icon: tab_swap.png, label: "Move tab left" }
  - { key: "]", mods: [SHIFT], icon: tab_swap.png, label: "Move tab right" }
  # --- [manager] Tasks / Help: w "tasks_show", ~ "help", <F1> "help"
  - { key: W, icon: activity.png, label: "Task manager" }
  - { key: "`", mods: [SHIFT], icon: shortcuts.png, label: "Help" }
  - { key: F1, icon: shortcuts.png, label: "Help" }
