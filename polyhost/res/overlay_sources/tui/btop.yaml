#
# Keys: btop 1.3.0 (aristocratos/btop tag v1.3.0), src/btop_input.cpp Input::process()
# and the help text in src/btop_menu.cpp (help_text). Default config: vim_keys off, so
# h/k keep their help/kill meaning. Main view only.
# Terminal program: no Cmd keys. Esc shows the program mark. Plain letter keys are the
# main commands of the main process view. Keys that act only inside a dialog or popup
# (signal menu, setup screen, sort menu, help) are left out.
#
#
# Regenerate:
#   python polyhost/res/overlay_sources/tui/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/tui/btop.yaml --preview /tmp/btop_preview
app: "btop"
match: [btop]
output: btop_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: btop.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- Global: "q" clean_quit; help text "q, ctrl + c  Quits program" (Ctrl+C is the
  # SIGINT handler). "m" and Esc open the main menu, "F1","?","h" help, "F2","o" options.
  - { key: Q, icon: exit.png, label: "Quit" }
  - { key: C, mods: [CTRL], icon: exit.png, label: "Quit" }
  - { key: M, icon: menu.png, label: "Main menu" }
  - { key: F1, icon: shortcuts.png, label: "Help" }
  - { key: "/", mods: [SHIFT], icon: shortcuts.png, label: "Help" }
  - { key: H, icon: shortcuts.png, label: "Help" }
  - { key: F2, icon: settings.png, label: "Options" }
  - { key: O, icon: settings.png, label: "Options" }
  # Ctrl+Z is the shell's SIGTSTP; help text "ctrl + z  Sleep program and put in background".
  - { key: Z, mods: [CTRL], icon: suspend.png, label: "Suspend" }
  # --- Boxes and presets: "1".."4" Config::toggle_box (cpu, mem, net, proc); "5" is the
  # GPU box and works only in a GPU build with a GPU present, so it is left out.
  # "p" / "P" cycle presets (only when more than one preset is configured; two or more by default).
  - { key: "1", icon: box_cpu.png, label: "Toggle CPU box" }
  - { key: "2", icon: box_mem.png, label: "Toggle memory box" }
  - { key: "3", icon: box_net.png, label: "Toggle network box" }
  - { key: "4", icon: box_proc.png, label: "Toggle process box" }
  - { key: P, icon: preset.png, label: "Next preset" }
  - { key: P, mods: [SHIFT], icon: preset_prev.png, label: "Previous preset" }
  # --- CPU box: "+" and "-" change update_ms by 100 ms (1000 ms on a fast repeat).
  - { key: "=", mods: [SHIFT], icon: timer_up.png, label: "Slower updates" }
  - { key: "-", icon: timer_down.png, label: "Faster updates" }
  # --- Process box: f and "/" start the filter, Delete clears it, c per-core CPU,
  # r reverse, e tree, "%" memory display mode, Left/Right previous/next sort column,
  # Enter detailed view, Space expand/collapse (tree), t SIGTERM, k SIGKILL, s signal menu.
  # t, k, s need a selected process. Up/Down/Page/Home/End only move the selection.
  - { key: F, icon: filter.png, label: "Filter" }
  - { key: "/", icon: filter.png, label: "Filter" }
  - { key: DELETE, icon: clear.png, label: "Clear filter" }
  - { key: C, icon: percore.png, label: "Per-core CPU" }
  - { key: R, icon: sort_invert.png, label: "Reverse sort" }
  - { key: E, icon: tree.png, label: "Tree view" }
  - { key: "5", mods: [SHIFT], icon: mem_mode.png, label: "Memory as bytes" }
  - { key: LEFT, icon: sort_prev.png, label: "Previous sort" }
  - { key: RIGHT, icon: sort_next.png, label: "Next sort" }
  - { key: ENTER, icon: details.png, label: "Process details" }
  - { key: SPACE, icon: expand.png, label: "Expand/collapse" }
  - { key: T, icon: terminate.png, label: "Terminate (SIGTERM)" }
  - { key: K, icon: kill.png, label: "Kill (SIGKILL)" }
  - { key: S, icon: signal.png, label: "Send signal" }
  # --- Mem box: d disks view, i disk IO mode.
  - { key: D, icon: disks.png, label: "Toggle disks" }
  - { key: I, icon: io_mode.png, label: "Disk IO mode" }
  # --- Net box: b / n previous / next device, z reset totals, a auto scale, y synced scale.
  - { key: B, icon: net_prev.png, label: "Previous net device" }
  - { key: N, icon: net_next.png, label: "Next net device" }
  - { key: Z, icon: reset.png, label: "Reset net totals" }
  - { key: A, icon: autoscale.png, label: "Auto scale graph" }
  - { key: Y, icon: sync.png, label: "Sync graph scale", concept: reload }
