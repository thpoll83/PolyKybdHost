#
# Keys: k9s v0.32.5, tag v0.32.5 of github.com/derailed/k9s. Global keys:
# internal/view/app.go `bindKeys()` and internal/ui/app.go `bindKeys()`. Resource
# list keys: internal/view/table.go `bindKeys()`, internal/view/browser.go
# `refreshActions()`/`bindKeys()` and `namespaceActions()`, internal/ui/table.go
# `doUpdate()`. Pods view: internal/view/pod.go `bindDangerousKeys()`/`bindKeys()`/
# `resourceSorters()`, plus the extenders logs_extender.go, pf_extender.go,
# owner_extender.go, image_extender.go. Terminal program: no Cmd keys. Esc shows
# the program mark. Shift+letter = capital letter.
# Simple Icons has no k9s slug (only "kubernetes"); use letter frame "K9".
#
#
# Regenerate:
#   python polyhost/res/overlay_sources/tui/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/tui/k9s.yaml --preview /tmp/k9s_preview
app: "k9s"
match: [k9s]
output: k9s_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: k9s.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- Global (ui/app.go): KeyColon ":" Cmd, Ctrl-R Redraw (the pods view
  # rebinds Ctrl-R to Refresh, below), Ctrl-P Persist (saves the context config).
  # (view/app.go): "?" Help, Ctrl-A Aliases, Ctrl-E ToggleHeader, Ctrl-G
  # toggleCrumbs, Ctrl-C Quit. Ctrl-C quits at once unless noExitOnCtrlC is set.
  - { key: ";", mods: [SHIFT], icon: commandpalette.png, label: "Command mode" }
  - { key: "/", mods: [SHIFT], icon: shortcuts.png, label: "Help" }
  - { key: A, mods: [CTRL], icon: aliases.png, label: "Resource aliases" }
  - { key: E, mods: [CTRL], icon: header.png, label: "Toggle header" }
  - { key: G, mods: [CTRL], icon: crumbs.png, label: "Toggle crumbs" }
  - { key: P, mods: [CTRL], icon: save.png, label: "Save context config" }
  - { key: C, mods: [CTRL], icon: exit.png, label: "Quit" }
  # --- Resource list (view/table.go bindKeys): "/" Filter Mode, Ctrl-S Save
  # (table to file), Space Mark, Ctrl-Space Mark Range, Ctrl-\ Marks Clear,
  # Ctrl-Z Toggle Faults, Ctrl-W Toggle Wide.
  - { key: "/", icon: search.png, label: "Filter", concept: find }
  - { key: S, mods: [CTRL], icon: save.png, label: "Save table to file" }
  - { key: SPACE, icon: checklist.png, label: "Mark row" }
  - { key: SPACE, mods: [CTRL], icon: checklist.png, label: "Mark range" }
  - { key: "\\", mods: [CTRL], icon: clear.png, label: "Clear marks" }
  - { key: Z, mods: [CTRL], icon: warnings.png, label: "Toggle faults only" }
  - { key: W, mods: [CTRL], icon: viewmode.png, label: "Toggle wide columns" }
  # --- Resource list (view/browser.go refreshActions): "c" Copy, Enter View,
  # Ctrl-R Refresh, "e" Edit, Ctrl-D Delete, "y" YAML, "d" Describe, "n" Copy
  # Namespace, "0" all namespaces, "1".."9" favourite namespaces. Enter in the pods
  # view is the Enter function showContainers (pod.go NewPod).
  - { key: ENTER, icon: containers.png, label: "Containers" }
  - { key: D, icon: describe.png, label: "Describe" }
  - { key: Y, icon: yaml.png, label: "View YAML" }
  - { key: E, icon: editor.png, label: "Edit resource" }
  - { key: D, mods: [CTRL], icon: delete.png, label: "Delete" }
  - { key: C, icon: copy.png, label: "Copy name" }
  - { key: N, icon: copy.png, label: "Copy namespace" }
  - { key: R, mods: [CTRL], icon: reload.png, label: "Refresh" }
  - { key: "0", icon: namespace.png, label: "All namespaces" }
  - { key: "1", icon: namespace.png, label: "Favourite namespace 1" }
  # --- Pods view (pod.go): bindDangerousKeys Ctrl-K Kill, "s" Shell,
  # "a" Attach, "t" Transfer, "z" Sanitize (only when not read-only);
  # bindKeys "o" Show Node. Extenders: "l" Logs, "p" Logs Previous
  # (logs_extender.go), "f" Show PortForward and Shift-F Port-Forward
  # (pf_extender.go), Shift-J Jump Owner (owner_extender.go), "i" Set Image
  # (image_extender.go, not read-only).
  - { key: L, icon: logs.png, label: "Logs" }
  - { key: P, icon: logs.png, label: "Previous logs" }
  - { key: S, icon: terminal.png, label: "Shell into container" }
  - { key: A, icon: attachpod.png, label: "Attach" }
  - { key: K, mods: [CTRL], icon: stop.png, label: "Kill pod" }
  - { key: T, icon: transfer.png, label: "Transfer files" }
  - { key: Z, icon: sanitize.png, label: "Sanitize" }
  - { key: O, icon: node.png, label: "Show node" }
  - { key: J, mods: [SHIFT], icon: owner.png, label: "Jump to owner" }
  - { key: F, icon: portforward.png, label: "Show port-forwards" }
  - { key: F, mods: [SHIFT], icon: portforward.png, label: "Port-forward" }
  - { key: I, icon: image.png, label: "Set image" }
  # --- Pods view sort keys (pod.go bindKeys, resourceSorters; table.go bindKeys):
  # Shift-N Name, Shift-A Age, Shift-R Ready, Shift-T Restarts, Shift-S Status,
  # Shift-I IP, Shift-O Node, Shift-C CPU, Shift-M MEM, Shift-X %CPU/R,
  # Shift-Z %MEM/R, Ctrl-X %CPU/L, Ctrl-Q %MEM/L. Ctrl-Q is also the app-level
  # "Clear Filter" but only while the filter prompt is active.
  - { key: N, mods: [SHIFT], icon: sort.png, label: "Sort by name" }
  - { key: A, mods: [SHIFT], icon: sort.png, label: "Sort by age" }
  - { key: R, mods: [SHIFT], icon: sort.png, label: "Sort by ready" }
  - { key: T, mods: [SHIFT], icon: sort.png, label: "Sort by restarts" }
  - { key: S, mods: [SHIFT], icon: sort.png, label: "Sort by status" }
  - { key: I, mods: [SHIFT], icon: sort.png, label: "Sort by IP" }
  - { key: O, mods: [SHIFT], icon: sort.png, label: "Sort by node" }
  - { key: C, mods: [SHIFT], icon: sort.png, label: "Sort by CPU" }
  - { key: M, mods: [SHIFT], icon: sort.png, label: "Sort by memory" }
  - { key: X, mods: [SHIFT], icon: sort.png, label: "Sort by CPU/request" }
  - { key: Z, mods: [SHIFT], icon: sort.png, label: "Sort by MEM/request" }
  - { key: X, mods: [CTRL], icon: sort.png, label: "Sort by CPU/limit" }
  - { key: Q, mods: [CTRL], icon: sort.png, label: "Sort by MEM/limit" }
