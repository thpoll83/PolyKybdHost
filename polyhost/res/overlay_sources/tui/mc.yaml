#
# Keys: GNU Midnight Commander 4.8.30, shipped default keymap /etc/mc/mc.default.keymap
# (identical to /etc/mc/mc.keymap). Sections [filemanager] (the "main" panels view),
# [panel] and the F-key bar. Plain letters that only type into the command line are left out.
# Terminal program: no Cmd keys. Esc shows the program mark. Chords (Ctrl+X ...,
# Esc-prefixed digits) are left out. Alt keys need a terminal that sends Alt as Meta.
# F13..F20 in the keymap are Shift+F3..Shift+F10 (mc's own naming; inferred from the
# button bar help and the action names).
#
#
# Regenerate:
#   python polyhost/res/overlay_sources/tui/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/tui/mc.yaml --preview /tmp/mc_preview
app: "Midnight Commander"
match: [mc]
output: mc_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: mc.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- [filemanager]: "Help = f1", "UserMenu = f2", "View = f3", "Edit = f4",
  # "Copy = f5", "Move = f6", "MakeDir = f7", "Delete = f8", "Menu = f9", "Quit = f10"
  - { key: F1, icon: shortcuts.png, label: "Help" }
  - { key: F2, icon: commandpalette.png, label: "User menu" }
  - { key: F3, icon: viewmode.png, label: "View file" }
  - { key: F4, icon: editor.png, label: "Edit file" }
  - { key: F5, icon: copy.png, label: "Copy" }
  - { key: F6, icon: move.png, label: "Move / rename" }
  - { key: F7, icon: newfolder.png, label: "Make directory" }
  - { key: F8, icon: delete.png, label: "Delete" }
  - { key: F9, icon: menu.png, label: "Pull-down menu" }
  - { key: F10, icon: exit.png, label: "Quit" }
  # --- [panel]: "ViewRaw = f13", "EditNew = f14", "CopySingle = f15",
  # "MoveSingle = f16", "DeleteSingle = f18" ; [filemanager]: "MenuLastSelected = f19",
  # "QuitQuiet = f20" (Shift+F3 ... Shift+F10)
  - { key: F3, mods: [SHIFT], icon: rawoutput.png, label: "View raw" }
  - { key: F4, mods: [SHIFT], icon: newfile.png, label: "Edit new file" }
  - { key: F5, mods: [SHIFT], icon: copy.png, label: "Copy (single)" }
  - { key: F6, mods: [SHIFT], icon: move.png, label: "Move (single)" }
  - { key: F8, mods: [SHIFT], icon: delete.png, label: "Delete (single)" }
  - { key: F9, mods: [SHIFT], icon: menu.png, label: "Last menu item" }
  - { key: F10, mods: [SHIFT], icon: exit.png, label: "Quit, no prompt" }
  # --- [filemanager]: "ChangePanel = tab; ctrl-i"
  - { key: TAB, icon: focusnext.png, label: "Other panel" }
  # --- [filemanager]: "Reread = ctrl-r", "Swap = ctrl-u", "Shell = ctrl-o",
  # "Suspend = ctrl-z", "HotList = ctrl-backslash", "DirSize = ctrl-space"
  - { key: R, mods: [CTRL], icon: reload.png, label: "Reread panel" }
  - { key: U, mods: [CTRL], icon: swap.png, label: "Swap panels", concept: replace }
  - { key: O, mods: [CTRL], icon: terminal.png, label: "Show shell" }
  - { key: Z, mods: [CTRL], icon: suspend.png, label: "Suspend" }
  - { key: "\\", mods: [CTRL], icon: hotlist.png, label: "Directory hotlist" }
  - { key: SPACE, mods: [CTRL], icon: dirsize.png, label: "Directory size" }
  # --- [panel]: "Search = ctrl-s; alt-s", "Mark = insert; ctrl-t"
  - { key: S, mods: [CTRL], icon: search.png, label: "Quick search", concept: find }
  - { key: S, mods: [ALT], icon: search.png, label: "Quick search", concept: find }
  - { key: INSERT, icon: mark.png, region: [40, 32], label: "Mark file" }
  - { key: T, mods: [CTRL], icon: mark.png, region: [40, 32], label: "Mark file" }
  # --- [panel]: "MarkUp = shift-up", "MarkDown = shift-down"
  - { key: UP, mods: [SHIFT], icon: selectup.png, label: "Mark and up" }
  - { key: DOWN, mods: [SHIFT], icon: selectdown.png, label: "Mark and down" }
  # --- [panel]: "CdChild = ctrl-pgdn", "CdParent = ctrl-pgup"
  - { key: PAGE_DOWN, mods: [CTRL], icon: cdchild.png, label: "Enter directory" }
  - { key: PAGE_UP, mods: [CTRL], icon: cdparent.png, label: "Parent directory" }
  # --- [panel]: "CycleListingFormat = alt-t", "PanelOtherCd = alt-o",
  # "PanelOtherCdLink = alt-l", "PanelOtherSync = alt-i", "SelectCodepage = alt-e"
  - { key: T, mods: [ALT], icon: listing.png, label: "Listing format" }
  - { key: O, mods: [ALT], icon: otherpanel.png, label: "Other panel here" }
  - { key: L, mods: [ALT], icon: link.png, label: "Other panel to link" }
  - { key: I, mods: [ALT], icon: panelsync.png, label: "Sync other panel" }
  - { key: E, mods: [ALT], icon: codepage.png, label: "Select codepage" }
  # --- [panel]: "History = alt-shift-h", "HistoryNext = alt-u", "HistoryPrev = alt-y";
  # [filemanager]: "History = alt-h", "EditorViewerHistory = alt-shift-e"
  - { key: H, mods: [ALT, SHIFT], icon: history.png, label: "Directory history" }
  - { key: U, mods: [ALT], icon: next.png, label: "History next" }
  - { key: Y, mods: [ALT], icon: prev.png, label: "History previous" }
  - { key: H, mods: [ALT], icon: history.png, label: "Command history" }
  - { key: E, mods: [ALT, SHIFT], icon: history.png, label: "Edit/view history" }
  # --- [panel]: "TopOnScreen = alt-g", "MiddleOnScreen = alt-r", "BottomOnScreen = alt-j"
  - { key: G, mods: [ALT], icon: row_top.png, region: [40, 32], label: "Top of screen" }
  - { key: R, mods: [ALT], icon: recenter.png, label: "Middle of screen" }
  - { key: J, mods: [ALT], icon: row_bottom.png, region: [40, 32], label: "Bottom of screen" }
  # --- [panel]: "Select = alt-plus", "Unselect = alt-minus", "SelectInvert = alt-asterisk"
  - { key: "=", mods: [ALT, SHIFT], icon: selectgroup.png, label: "Select group" }
  - { key: "-", mods: [ALT], icon: unselectgroup.png, label: "Unselect group" }
  - { key: "8", mods: [ALT, SHIFT], icon: invert.png, label: "Invert selection" }
  # --- [filemanager]: "Find = alt-question", "CdQuick = alt-c", "ShowHidden = alt-dot",
  # "ViewFiltered = alt-exclamation", "ScreenList = alt-prime"
  - { key: "/", mods: [ALT, SHIFT], icon: find.png, label: "Find file", concept: find }
  - { key: C, mods: [ALT], icon: openfolder.png, label: "Quick change dir" }
  - { key: ".", mods: [ALT], icon: hidden.png, label: "Show hidden files" }
  - { key: "1", mods: [ALT, SHIFT], icon: filter.png, label: "View filtered output" }
  - { key: "'", mods: [ALT], icon: screens.png, label: "Screen list" }
  # --- [filemanager]: "SplitVertHoriz = alt-comma", "SplitEqual = alt-equal",
  # "SplitMore = alt-shift-right", "SplitLess = alt-shift-left"
  - { key: ",", mods: [ALT], icon: splitright.png, label: "Split orientation" }
  - { key: "=", mods: [ALT], icon: splitequal.png, label: "Equal panel size" }
  - { key: RIGHT, mods: [ALT, SHIFT], icon: expand.png, label: "Widen panel" }
  - { key: LEFT, mods: [ALT, SHIFT], icon: shrink.png, label: "Narrow panel" }
  # --- [filemanager]: "PutCurrentPath = alt-a", "PutOtherPath = alt-shift-a",
  # "PutCurrentSelected = alt-enter; ctrl-enter"
  - { key: A, mods: [ALT], icon: pathcurrent.png, label: "Path to cmd line" }
  - { key: A, mods: [ALT, SHIFT], icon: pathother.png, label: "Other path to cmd" }
  - { key: ENTER, mods: [ALT], icon: pathfile.png, label: "File name to cmd" }
