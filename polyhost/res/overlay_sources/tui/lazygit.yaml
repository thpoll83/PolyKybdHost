#
# Keys: lazygit v0.44.1 (binary release), default config `GetDefaultConfig()` ->
# `Keybinding: KeybindingConfig{...}` in pkg/config/user_config.go, cross-checked
# against docs/keybindings/Keybindings_en.md at tag v0.44.1. lazygit's keys depend on
# the focused panel. Drawn here: the Universal (global) keys and the Files panel,
# which has the focus at start. Keys that belong to other panels (Commits, Branches,
# Stash, ...) are left out because they change meaning there.
# Terminal program: no Cmd keys. Esc shows the program mark. A "Shift" capital
# letter is the letter with SHIFT.
# No program mark in Simple Icons (no lazygit slug); use letter frame "LG".
#
#
# Regenerate:
#   python polyhost/res/overlay_sources/tui/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/tui/lazygit.yaml --preview /tmp/lazygit_preview
app: "lazygit"
match: [lazygit]
output: lazygit_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

program_icon: lazygit.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- Global (Universal): Push "P", Pull "p", Refresh "R", ExtrasMenu "@",
  # ExecuteShellCommand ":", OptionMenuAlt1 "?", CreateRebaseOptionsMenu "m".
  - { key: P, mods: [SHIFT], icon: push.png, label: "Push" }
  - { key: P, icon: pull.png, label: "Pull" }
  - { key: R, mods: [SHIFT], icon: reload.png, label: "Refresh" }
  - { key: "2", mods: [SHIFT], icon: commandlog.png, label: "Command log options" }
  - { key: ";", mods: [SHIFT], icon: terminal.png, label: "Run shell command" }
  - { key: "/", mods: [SHIFT], icon: shortcuts.png, label: "Keybindings menu" }
  - { key: M, icon: rebaseoptions.png, label: "Merge/rebase options" }
  # --- Global: Quit "q" and QuitAlt1 "<c-c>", QuitWithoutChangingDirectory "Q".
  - { key: Q, icon: exit.png, label: "Quit" }
  - { key: C, mods: [CTRL], icon: exit.png, label: "Quit" }
  - { key: Q, mods: [SHIFT], icon: exit.png, label: "Quit, keep directory" }
  # --- Global: OpenRecentRepos "<c-r>", Undo "z", Redo "<c-z>" (reflog based).
  - { key: R, mods: [CTRL], icon: recents.png, label: "Recent repos" }
  - { key: Z, icon: undo.png, label: "Undo (reflog)" }
  - { key: Z, mods: [CTRL], icon: redo.png, label: "Redo (reflog)" }
  # --- Global: CreatePatchOptionsMenu "<c-p>", FilteringMenu "<c-s>",
  # DiffingMenu "W", DiffingMenuAlt "<c-e>", OpenDiffTool "<c-t>",
  # ToggleWhitespaceInDiffView "<c-w>".
  - { key: P, mods: [CTRL], icon: patch.png, label: "Custom patch options" }
  - { key: S, mods: [CTRL], icon: filter.png, label: "Filter commit log" }
  - { key: W, mods: [SHIFT], icon: diff.png, label: "Diffing options" }
  - { key: E, mods: [CTRL], icon: diff.png, label: "Diffing options" }
  - { key: T, mods: [CTRL], icon: difftool.png, label: "External diff tool" }
  - { key: W, mods: [CTRL], icon: whitespace.png, label: "Toggle whitespace" }
  # --- Global: Increase/DecreaseContextInDiffView "}" "{",
  # Increase/DecreaseRenameSimilarityThreshold ")" "(".
  - { key: "]", mods: [SHIFT], icon: contextmore.png, label: "More diff context" }
  - { key: "[", mods: [SHIFT], icon: contextless.png, label: "Less diff context" }
  - { key: "0", mods: [SHIFT], icon: rename.png, label: "Rename threshold +" }
  - { key: "9", mods: [SHIFT], icon: rename.png, label: "Rename threshold -" }
  # --- Global: NextScreenMode "+", PrevScreenMode "_".
  - { key: "=", mods: [SHIFT], icon: expand.png, label: "Next screen mode" }
  - { key: "-", mods: [SHIFT], icon: collapse.png, label: "Prev screen mode" }
  # --- Global: scroll the main (diff) view: ScrollUpMain "<pgup>",
  # ScrollDownMain "<pgdown>", Alt1 "K"/"J", Alt2 "<c-u>"/"<c-d>"
  # (all bound in pkg/gui/keybindings.go).
  - { key: PAGE_UP, icon: scroll_up.png, label: "Scroll diff up" }
  - { key: PAGE_DOWN, icon: scroll_down.png, label: "Scroll diff down" }
  - { key: K, mods: [SHIFT], icon: scroll_up.png, label: "Scroll diff up" }
  - { key: J, mods: [SHIFT], icon: scroll_down.png, label: "Scroll diff down" }
  - { key: U, mods: [CTRL], icon: scroll_up.png, label: "Scroll diff up" }
  - { key: D, mods: [CTRL], icon: scroll_down.png, label: "Scroll diff down" }
  # --- Global list navigation: ScrollLeft "H", ScrollRight "L", PrevPage ",",
  # NextPage ".", GotoTop "<", GotoBottom ">", ToggleRangeSelect "v",
  # StartSearch "/".
  - { key: H, mods: [SHIFT], icon: scroll_left.png, label: "Scroll left" }
  - { key: L, mods: [SHIFT], icon: scroll_right.png, label: "Scroll right" }
  - { key: ",", icon: page_up.png, label: "Previous page" }
  - { key: ".", icon: page_down.png, label: "Next page" }
  - { key: ",", mods: [SHIFT], icon: file_start.png, label: "Go to top" }
  - { key: ".", mods: [SHIFT], icon: file_end.png, label: "Go to bottom" }
  - { key: V, icon: checklist.png, label: "Range select" }
  - { key: "/", icon: search.png, label: "Search list" }
  # --- Global panel switching: JumpToBlock ["1".."5"] over
  # WindowHelper.SideWindows() = status, files, branches, commits, stash;
  # NextBlockAlt2 "<tab>", PrevBlockAlt2 "<backtab>".
  - { key: "1", icon: tab1.png, label: "Status panel" }
  - { key: "2", icon: tab2.png, label: "Files panel" }
  - { key: "3", icon: tab3.png, label: "Branches panel" }
  - { key: "4", icon: tab4.png, label: "Commits panel" }
  - { key: "5", icon: tab5.png, label: "Stash panel" }
  - { key: TAB, icon: next.png, label: "Next panel" }
  - { key: TAB, mods: [SHIFT], icon: prev.png, label: "Previous panel" }

  # --- Files panel (KeybindingFilesConfig): CommitChanges "c",
  # CommitChangesWithoutHook "w", AmendLastCommit "A", CommitChangesWithEditor "C",
  # FindBaseCommitForFixup "<c-f>".
  - { key: C, icon: commit.png, label: "Commit" }
  - { key: W, icon: commit.png, label: "Commit, skip hook" }
  - { key: A, mods: [SHIFT], icon: amend.png, label: "Amend last commit" }
  - { key: C, mods: [SHIFT], icon: editor.png, label: "Commit in git editor" }
  - { key: F, mods: [CTRL], icon: findbase.png, label: "Find fixup base" }
  # --- Files panel: Select "<space>" (stage), ToggleStagedAll "a",
  # GoInto "<enter>" (stage lines), Remove "d" (discard menu), ViewResetOptions "D",
  # "g" (upstream reset options, from Keybindings_en.md; no config key).
  - { key: SPACE, icon: stage.png, label: "Stage / unstage" }
  - { key: A, icon: stageall.png, label: "Stage all" }
  - { key: ENTER, icon: stagelines.png, label: "Stage lines" }
  - { key: D, icon: discard.png, label: "Discard changes" }
  - { key: D, mods: [SHIFT], icon: resettree.png, label: "Reset options" }
  - { key: G, icon: resettree.png, label: "Upstream reset options" }
  # --- Files panel: Edit "e", OpenFile "o", IgnoreFile "i", RefreshFiles "r",
  # StashAllChanges "s", ViewStashOptions "S", Fetch "f", OpenMergeTool "M",
  # ToggleTreeView "`", OpenStatusFilter "<c-b>", CopyFileInfoToClipboard "y",
  # CopyToClipboard "<c-o>".
  - { key: E, icon: editor.png, label: "Edit file" }
  - { key: O, icon: openfile.png, label: "Open file" }
  - { key: I, icon: ignore.png, label: "Ignore file" }
  - { key: R, icon: reload.png, label: "Refresh files" }
  - { key: S, icon: stash.png, label: "Stash all" }
  - { key: S, mods: [SHIFT], icon: stash.png, label: "Stash options" }
  - { key: F, icon: fetch.png, label: "Fetch" }
  - { key: M, mods: [SHIFT], icon: mergetool.png, label: "Open merge tool" }
  - { key: "`", icon: filelist.png, label: "Toggle file tree" }
  - { key: B, mods: [CTRL], icon: filter.png, label: "Filter by status" }
  - { key: Y, icon: copy.png, label: "Copy to clipboard" }
  - { key: O, mods: [CTRL], icon: copy.png, label: "Copy path" }
