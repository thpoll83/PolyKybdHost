# Autodesk AutoCAD shortcut overlays for PolyKybd (Windows and AutoCAD for Mac;
# AutoCAD has no Linux version). See SOURCES.md.
#
# Keys: the default shortcut keys of the AutoCAD CUIx file, from Autodesk's own
# help pages (URLs in SOURCES.md):
#   Windows  AutoCAD 2026 Customization Guide, "Shortcut Keys Reference"
#   macOS    AutoCAD for Mac 2026 Customization Guide, "About Creating and
#            Customizing of Shortcut Keys", and the F1..F12 table of the AutoCAD
#            for Mac 2025 Getting Started guide.
# Command aliases (L for LINE, typed and confirmed with Enter) are not keyboard
# shortcuts and are not drawn.
#
# AutoCAD for Mac binds most commands twice, to Cmd+key and to Ctrl+key, and
# several keys differ from Windows (Ctrl+E is Toggle Grid, Cmd+3 the command
# line). So the Windows keys are `except: [macos]` and the Mac keys
# `only: [macos]`. The function keys and Shift+F1..F5 are the same on both.
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/autocad/fetch_icons.py
#   PYTHONPATH=. python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/autocad/bindings.yaml --preview /tmp/autocad_preview
app: autocad
match: [acad, autocad]
output: autocad_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

# Drawn substitute mark (the AutoCAD logo is an Autodesk trademark): a tile with
# the letter A knocked out and the drawing crosshair. White on transparent.
program_icon: autocad.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

