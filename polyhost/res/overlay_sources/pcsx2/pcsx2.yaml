# PCSX2 (PlayStation 2 emulator) shortcut overlay for PolyKybd. See SOURCES.md.
#
# Keys are PCSX2's defaults, release 2.8.2 (PCSX2/pcsx2): the hotkeys of
# Pad::SetDefaultHotkeyConfig in pcsx2/SIO/Pad/Pad.cpp and the keyboard map of
# controller 1 from InputManager::GetGenericBindingMapping("Keyboard") in
# pcsx2/Input/InputManager.cpp. Esc opens the pause menu and carries the PCSX2
# mark.
#
# Not drawn: Ctrl+Plus (zoom in; a US layout has no unshifted plus key) and
# Shift+R (input recording mode).
#
# Regenerate:
#   PYTHONPATH=. .venv/bin/python polyhost/res/overlay_sources/pcsx2/fetch_icons.py
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/pcsx2/pcsx2.yaml --preview /tmp/pcsx2_preview
app: pcsx2
match: [pcsx2-qt, pcsx2, net.pcsx2.pcsx2]
output: pcsx2_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: alpha
threshold: 128

program_icon: pcsx2.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 31]
program_icon_margin: 0

bindings:
  # Save states
  - { key: F1, mods: [], icon: savestate.png, label: "Save state" }
  - { key: F2, mods: [], icon: slotplus.png, label: "Next state slot" }
  - { key: F2, mods: [SHIFT], icon: slotminus.png, label: "Previous state slot" }
  - { key: F3, mods: [], icon: loadstate.png, label: "Load state" }
  # System
  - { key: F4, mods: [], icon: framelimit.png, label: "Frame limit on/off" }
  - { key: SPACE, mods: [], icon: pause.png, label: Pause }
  - { key: TAB, mods: [], icon: turbo.png, label: "Turbo (toggle)" }
  - { key: DOT, mods: [], icon: ffhold.png, label: "Turbo (hold)" }
  - { key: TAB, mods: [SHIFT], icon: slowmo.png, label: "Slow motion (toggle)" }
  - { key: ENTER, mods: [ALT], icon: fullscreen.png, label: "Full screen" }
  # Graphics
  - { key: F5, mods: [], icon: interlace.png, label: "Next deinterlace mode" }
  - { key: F6, mods: [], icon: aspect.png, label: "Next aspect ratio" }
  - { key: F8, mods: [], icon: screenshot.png, label: Screenshot }
  - { key: F8, mods: [SHIFT], icon: gsdump.png, label: "Save GS dump (one frame)" }
  - { key: F8, mods: [CTRL, SHIFT], icon: gsdumpmulti.png, label: "Save GS dump (several frames)" }
  - { key: F9, mods: [], icon: software.png, label: "Software renderer on/off" }
  - { key: INSERT, mods: [], icon: mipmap.png, label: "Mipmapping on/off" }
  - { key: MINUS, mods: [CTRL], icon: zoomout.png, label: "Zoom out" }
  # DualShock 2, controller 1; drawn 1:1 at their own size
  - { key: I, mods: [], icon: triangle.png, label: "Triangle", region: [32, 32], margin: 2 }
  - { key: L, mods: [], icon: circle.png, label: "Circle", region: [32, 32], margin: 2 }
  - { key: K, mods: [], icon: cross.png, label: "Cross", region: [32, 32], margin: 2 }
  - { key: J, mods: [], icon: square.png, label: "Square", region: [32, 32], margin: 2 }
  - { key: Q, mods: [], icon: l1.png, label: "L1", region: [40, 24], margin: 2 }
  - { key: "1", mods: [], icon: l2.png, label: "L2", region: [40, 24], margin: 2 }
  - { key: "2", mods: [], icon: l3.png, label: "L3 (left stick click)", region: [40, 24], margin: 2 }
  - { key: E, mods: [], icon: r1.png, label: "R1", region: [40, 24], margin: 2 }
  - { key: "3", mods: [], icon: r2.png, label: "R2", region: [40, 24], margin: 2 }
  - { key: "4", mods: [], icon: r3.png, label: "R3 (right stick click)", region: [40, 24], margin: 2 }
  - { key: ENTER, mods: [], icon: start.png, label: "Start", region: [49, 15], margin: 2 }
  - { key: BACKSPACE, mods: [], icon: select.png, label: "Select", region: [57, 15], margin: 2 }
  - { key: UP, mods: [], icon: dpadup.png, label: "D-pad up", region: [32, 32], margin: 2 }
  - { key: DOWN, mods: [], icon: dpaddown.png, label: "D-pad down", region: [32, 32], margin: 2 }
  - { key: LEFT, mods: [], icon: dpadleft.png, label: "D-pad left", region: [32, 32], margin: 2 }
  - { key: RIGHT, mods: [], icon: dpadright.png, label: "D-pad right", region: [32, 32], margin: 2 }
  - { key: W, mods: [], icon: lstickup.png, label: "Left stick up", region: [32, 32], margin: 2 }
  - { key: S, mods: [], icon: lstickdown.png, label: "Left stick down", region: [32, 32], margin: 2 }
  - { key: A, mods: [], icon: lstickleft.png, label: "Left stick left", region: [32, 32], margin: 2 }
  - { key: D, mods: [], icon: lstickright.png, label: "Left stick right", region: [32, 32], margin: 2 }
  - { key: T, mods: [], icon: rstickup.png, label: "Right stick up", region: [32, 32], margin: 2 }
  - { key: G, mods: [], icon: rstickdown.png, label: "Right stick down", region: [32, 32], margin: 2 }
  - { key: F, mods: [], icon: rstickleft.png, label: "Right stick left", region: [32, 32], margin: 2 }
  - { key: H, mods: [], icon: rstickright.png, label: "Right stick right", region: [32, 32], margin: 2 }
