# The slicer shortcut table: ONE list for PrusaSlicer, Bambu Studio and
# OrcaSlicer. gen_slicer_bindings.py writes one binding file per app from it.
#
# A row is one chord with one meaning. `apps` names the apps that bind it and,
# for each, where that app's source says so:
#
#   prusa  src/slic3r/GUI/KBShortcutsDialog.cpp (prusa3d/PrusaSlicer)
#   bambu  src/slic3r/GUI/KBShortcutsDialog.cpp (bambulab/BambuStudio), or the
#          gizmo file that sets the key when the dialog does not list it
#   orca   src/slic3r/GUI/Shortcuts.cpp shortcut_table (the enum name), or a
#          fixed row of KBShortcutsDialog.cpp (SoftFever/OrcaSlicer)
#
# Commits and dates are in SOURCES.md. Where two apps give one chord different
# meanings, each meaning is its own row. `CMDCTRL` is the dialogs' `ctrl`
# prefix (shortkey_ctrl_prefix(), or wxMOD_CONTROL in Orca's table), which is
# Cmd on macOS. `only:` / `except:` carry the dialogs' #ifdef __APPLE__ and
# __WINDOWS__ branches.
#
# `editor` is the 3D plater (Prepare tab) of each app. `gcodeviewer` is
# PrusaSlicer's separate G-code Viewer.

editor:
