  - {key: N, mods: [CMDCTRL], label: "New project", icon: new_project,
     apps: {prusa: "New project, clear plater", bambu: "New Project", orca: NewProject}}
  - {key: O, mods: [CMDCTRL], label: "Open",
     apps: {prusa: "Open project AMF/3MF with config", bambu: "Open Project", orca: OpenProject}}
  - {key: S, mods: [CMDCTRL], label: "Save",
     apps: {prusa: "Save project (3mf)", bambu: "Save Project", orca: SaveProject}}
  - {key: S, mods: [CMDCTRL, ALT], label: "Save as", apps: {prusa: "Save project as (3mf)"}}
  - {key: S, mods: [CMDCTRL, SHIFT], label: "Save as",
     apps: {bambu: "Save Project as", orca: SaveProjectAs}}
  - {key: I, mods: [CMDCTRL], label: "Import model", icon: import_model,
     apps: {prusa: "Import STL/3MF/STEP/OBJ/AMF without config", bambu: "Import geometry data",
            orca: ImportModel}}
  - {key: L, mods: [CMDCTRL], label: "Import config", icon: import_config,
     apps: {prusa: "Import Config from ini/amf/3mf/gcode"}}
  - {key: L, mods: [CMDCTRL, ALT], label: "Load config and merge", icon: merge_config,
     apps: {prusa: "Load Config from ini/amf/3mf/gcode and merge"}}
  - {key: E, mods: [CMDCTRL], label: "Export config", icon: export_config,
     apps: {prusa: "Export config"}}
  - {key: E, mods: [CMDCTRL, SHIFT], label: "Publish 3MF", icon: publish, apps: {orca: Publish3mf}}
  - {key: I, mods: [CMDCTRL, SHIFT], label: "New instance", icon: new_instance,
     apps: {prusa: "Open new instance"}}

  # ------------------------------------------------- slicing and printing
