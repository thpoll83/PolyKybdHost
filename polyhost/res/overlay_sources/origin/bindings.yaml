# OriginPro shortcut overlays for PolyKybd (Windows).
# GENERATED by gen_specs.py from its table -- edit the table, not this file.
#
# Shortcuts: OriginLab, "Hotkeys/Accelerator Keys/Keyboard Shortcuts in Origin"
# (Origin 2025b help). Only keys that are global or mean the same in a
# worksheet and a graph. See SOURCES.md.
#
# Regenerate:
#   python polyhost/res/overlay_sources/origin/fetch_icons.py
#   python polyhost/res/overlay_sources/origin/gen_specs.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/origin/bindings.yaml --preview /tmp/origin_preview
app: origin
match: [origin64]
output: origin_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: origin.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:

  # --- project ---
  - { key: "N", mods: [CTRL], label: "New" }
  - { key: "O", mods: [CTRL, ALT], icon: newproject.png, label: "New project" }
  - { key: "P", mods: [CTRL, ALT], icon: projprops.png, label: "Project properties" }
  - { key: "I", mods: [CTRL, ALT], icon: image.png, label: "Import image" }
  - { key: "T", mods: [CTRL, ALT], icon: images.png, label: "Import multiple images" }
  - { key: "R", mods: [CTRL, ALT], icon: toolbars.png, label: "Hide toolbars" }
  - { key: "O", mods: [CTRL], label: "Open" }
  - { key: "P", mods: [CTRL], label: "Print" }
  - { key: "S", mods: [CTRL], label: "Save" }
  - { key: "F4", mods: [CTRL], icon: closewin.png, label: "Close window", shared: false }
  - { key: "F6", mods: [CTRL], icon: nextwindow.png, label: "Next window", shared: false }
  - { key: "F9", mods: [CTRL], icon: float.png, label: "Float window" }
  - { key: "F9", mods: [CTRL, SHIFT], icon: retract.png, label: "Retract floating windows" }
  - { key: "Z", mods: [CTRL, ALT], icon: lastwindow.png, label: "Last window" }
  - { key: "KC_TAB", mods: [CTRL], icon: switcher.png, label: "Window switcher" }
  - { key: "KC_TAB", mods: [CTRL, SHIFT], icon: switcherback.png, label: "Window switcher back" }
  - { key: "F3", mods: [], icon: browser.png, label: "Project Browser" }
  - { key: "F12", mods: [CTRL, SHIFT], icon: findfiles.png, label: "Find in project files" }
