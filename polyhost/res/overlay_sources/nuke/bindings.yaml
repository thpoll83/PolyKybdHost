# Foundry Nuke shortcut overlays for PolyKybd (Node Graph). See SOURCES.md.
#
# The keys are the Global and Node Graph tables of Foundry's keyboard shortcut
# reference for Nuke 17.1v3. The Viewer, the Timeline and the other panels give
# many of the same keys other meanings, so they are not drawn: this set shows
# what a key does while the Node Graph has focus, which is where Nuke's single
# letters insert nodes. Where the Node Graph table and the Global table give
# one key two meanings, the Node Graph meaning is drawn (Ctrl+D).
#
# Foundry: "On Mac, replace the Ctrl key with the Cmd key." So every Ctrl chord
# is CMDCTRL and Alt stays ALT (Option).
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/nuke/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/nuke/bindings.yaml --preview /tmp/nuke_preview
app: nuke
match: [nuke, nukex]
output: nuke_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: nuke.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- no modifier: insert a node ---
  - { key: ".", mods: [], icon: dot.png, label: "Insert Dot" }
  - { key: B, mods: [], icon: blur.png, label: "Insert Blur" }
  - { key: C, mods: [], icon: colorcorrect.png, label: "Insert ColorCorrect" }
  - { key: G, mods: [], icon: grade.png, label: "Insert Grade" }
  - { key: K, mods: [], icon: copynode.png, label: "Insert Copy" }
  - { key: M, mods: [], icon: merge.png, label: "Insert Merge" }
  - { key: O, mods: [], icon: roto.png, label: "Insert Roto" }
  - { key: P, mods: [], icon: rotopaint.png, label: "Insert RotoPaint" }
  - { key: R, mods: [], icon: read.png, label: "Insert Read" }
  - { key: T, mods: [], icon: move.png, label: "Insert Transform" }
  - { key: W, mods: [], icon: write.png, label: "Insert Write" }

  # --- no modifier: Node Graph ---
  - { key: "-", mods: [], icon: zoomout.png, label: "Zoom out" }
  - { key: "/", mods: [], icon: search.png, label: "Search by node name" }
  - { key: "\\", mods: [], icon: snapall.png, label: "Snap all nodes to grid" }
  - { key: BACKSPACE, mods: [], icon: delete.png, label: "Delete nodes" }
  - { key: DELETE, mods: [], icon: delete.png, label: "Delete nodes" }
  - { key: D, mods: [], icon: mute.png, label: "Disable/enable node" }
  - { key: DOWN, mods: [], icon: hier_child.png, label: "Next node in tree" }
  - { key: UP, mods: [], icon: hier_parent.png, label: "Previous node in tree" }
  - { key: F, mods: [], icon: fit_view.png, label: "Fit nodes to panel" }
  - { key: F5, mods: [], icon: render_anim.png, label: "Render all Writes" }
  - { key: F7, mods: [], icon: rendersel.png, label: "Render selected Writes" }
  - { key: I, mods: [], icon: info.png, label: "Node information" }
  - { key: J, mods: [], icon: jumpbookmark.png, label: "Jump to bookmark" }
  - { key: L, mods: [], icon: autoplace.png, label: "Auto-place nodes" }
  - { key: N, mods: [], icon: rename.png, label: "Rename node" }
  - { key: Q, mods: [], icon: scriptinfo_named.png, label: "Named script info" }
  - { key: ENTER, mods: [], icon: properties.png, label: "Open properties" }
  - { key: S, mods: [], icon: projectsettings.png, label: "Project settings" }
  - { key: TAB, mods: [], icon: nodesearch.png, label: "Tab node search" }
  - { key: X, mods: [], icon: command.png, label: "Command entry" }

  # --- no modifier: Global ---
  - { key: F12, mods: [], icon: clearcache.png, label: "Clear buffers and cache" }
  - { key: SPACE, mods: [], icon: maximize.png, label: "Expand panel" }

  # --- Shift ---
  - { key: "\\", mods: [SHIFT], icon: snapsel.png, label: "Snap node to grid" }
  - { key: A, mods: [SHIFT], icon: addmix.png, label: "Insert AddMix" }
  - { key: X, mods: [SHIFT], icon: swap.png, label: "Swap A/B inputs" }
  - { key: S, mods: [SHIFT], icon: preferences.png, label: "Preferences" }

  # --- Alt (Option on macOS) ---
  - { key: B, mods: [ALT], icon: extrude_forked.png, label: "Duplicate and branch" }
  - { key: C, mods: [ALT], icon: duplicate.png, label: "Duplicate nodes" }
  - { key: D, mods: [ALT], icon: ed_dopesheet.png, label: "Always in Dope Sheet" }
  - { key: DOWN, mods: [ALT], icon: versiondown.png, label: "Version down" }
  - { key: UP, mods: [ALT], icon: versionup.png, label: "Version up" }
  - { key: E, mods: [ALT], icon: link.png, label: "Expression links" }
  - { key: F, mods: [ALT], icon: play_rendered.png, label: "Flipbook" }
  - { key: H, mods: [ALT], icon: hideinputs.png, label: "Hide node inputs" }
  - { key: I, mods: [ALT], icon: scriptinfo.png, label: "Script information" }
  - { key: K, mods: [ALT], icon: duplicate_linked.png, label: "Clone nodes" }
  - { key: N, mods: [ALT], icon: stickynote.png, label: "Create StickyNote" }
  - { key: P, mods: [ALT], icon: node_preview.png, label: "Postage stamp" }
  - { key: X, mods: [ALT], icon: runscript.png, label: "Run a script" }
  - { key: S, mods: [ALT], icon: fullscreen.png, label: "Full screen" }
  - { key: "`", mods: [ALT], icon: ed_graph.png, label: "Curve Editor" }

  # --- Alt+Shift ---
  - { key: K, mods: [ALT, SHIFT], icon: declone.png, label: "Declone nodes" }
  - { key: UP, mods: [ALT, SHIFT], icon: versionlatest.png, label: "Latest version" }

  # --- Ctrl (Cmd on macOS) ---
  - { key: N, mods: [CMDCTRL], icon: new.png, label: "New script" }
  - { key: O, mods: [CMDCTRL], icon: open.png, label: "Open script" }
  - { key: S, mods: [CMDCTRL], icon: save.png, label: "Save" }
  - { key: W, mods: [CMDCTRL], icon: close.png, label: "Close script" }
  - { key: Q, mods: [CMDCTRL], icon: quit.png, label: "Quit" }
  - { key: Z, mods: [CMDCTRL], icon: undo.png, label: Undo }
  - { key: C, mods: [CMDCTRL], icon: copy.png, label: Copy }
  - { key: X, mods: [CMDCTRL], icon: cut.png, label: Cut }
  - { key: V, mods: [CMDCTRL], icon: paste.png, label: Paste }
  - { key: A, mods: [CMDCTRL], icon: selectall.png, label: "Select all" }
  - { key: T, mods: [CMDCTRL], icon: tab_cycle.png, label: "Cycle tabs" }
  - { key: B, mods: [CMDCTRL], icon: buffer.png, label: "Toggle node buffer" }
  - { key: D, mods: [CMDCTRL], icon: disconnect.png, label: "Disconnect upstream" }
  - { key: DOWN, mods: [CMDCTRL], icon: downstream.png, label: "Move node downstream" }
  - { key: UP, mods: [CMDCTRL], icon: upstream.png, label: "Move node upstream" }
  - { key: G, mods: [CMDCTRL], icon: group.png, label: "Nest nodes in Group" }
  - { key: I, mods: [CMDCTRL], icon: viewer.png, label: "New Viewer" }
  - { key: K, mods: [CMDCTRL], icon: copyclone.png, label: "Copy as clone" }
  - { key: L, mods: [CMDCTRL], icon: livegroup.png, label: "LiveGroup" }
  - { key: P, mods: [CMDCTRL], icon: proxy.png, label: "Toggle proxy" }
  - { key: ENTER, mods: [CMDCTRL], icon: group_enter.png, label: "Open Group sub-graph" }

  # --- Ctrl+Alt ---
  - { key: G, mods: [CMDCTRL, ALT], icon: ungroup.png, label: "Replace Group with nodes" }
  - { key: V, mods: [CMDCTRL, ALT], icon: pasteknobs.png, label: "Paste knob values" }
  - { key: "`", mods: [CMDCTRL, ALT], icon: workspace_next.png, label: "Next pane" }

  # --- Ctrl+Shift ---
  - { key: A, mods: [CMDCTRL, SHIFT], icon: deselect.png, label: "Select none" }
  - { key: S, mods: [CMDCTRL, SHIFT], icon: saveas.png, label: "Save as" }
  - { key: Z, mods: [CMDCTRL, SHIFT], icon: redo.png, label: Redo }
  - { key: "[", mods: [CMDCTRL, SHIFT], icon: tab_next.png, label: "Next tab" }
  - { key: "]", mods: [CMDCTRL, SHIFT], icon: tab_prev.png, label: "Previous tab" }
  - { key: "/", mods: [CMDCTRL, SHIFT], icon: searchreplace.png, label: "Search and replace" }
  - { key: B, mods: [CMDCTRL, SHIFT], icon: bookmark.png, label: "Toggle bookmark" }
  - { key: C, mods: [CMDCTRL, SHIFT], icon: nodecolor.png, label: "Change node color" }
  - { key: G, mods: [CMDCTRL, SHIFT], icon: gizmogroup.png, label: "Copy gizmo to group" }
  - { key: V, mods: [CMDCTRL, SHIFT], icon: pastebranch.png, label: "Paste into new branch" }
  - { key: N, mods: [CMDCTRL, SHIFT], icon: newsession.png, label: "New script, new session" }
  - { key: P, mods: [CMDCTRL, SHIFT], icon: precomp.png, label: "Create Precomp" }
  - { key: X, mods: [CMDCTRL, SHIFT], icon: extract.png, label: "Extract nodes" }

  # --- Ctrl+Alt+Shift ---
  - { key: G, mods: [CMDCTRL, ALT, SHIFT], icon: group.png, label: "Create Group" }
  - { key: K, mods: [CMDCTRL, ALT, SHIFT], icon: forceclone.png, label: "Force clone" }
  - { key: "`", mods: [CMDCTRL, ALT, SHIFT], icon: workspace_prev.png, label: "Previous pane" }
