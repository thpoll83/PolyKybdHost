# kitty shortcut overlays for PolyKybd (Linux and macOS). See SOURCES.md.
#
# The keys are kitty's default shortcuts, read from its source at commit
# da8cac32: kitty/options/definition.py, every `map(...)` entry that is added
# to the defaults (`add_to_default=False` marks an example, and the one such
# map, Ctrl+Shift+Alt+H "send text", is not drawn). `kitty_mod` is Ctrl+Shift
# by default. Entries marked `only='macos'` are kitty's macOS Cmd keys.
#
# kitty has no Windows build, so the default artwork set is the Linux one.
#
# In kitty a "window" is a pane inside a tab, and an "OS window" is a desktop
# window. The labels keep kitty's words.
#
# On macOS kitty keeps every Ctrl+Shift key and adds Cmd keys. The macOS set
# draws the Cmd key where kitty has one for the same action and leaves out the
# Ctrl+Shift copy; the Ctrl+Shift keys with no Cmd form are drawn on both
# platforms.
#
# Not drawn: Ctrl+Shift+Esc (kitty shell), because the ESC key shows the
# program mark on every layer. Ctrl+Shift+keypad +/- have no overlay cell.
# Ctrl+Shift+P and Ctrl+Shift+A start two-key sequences; only the first key
# is drawn (SOURCES.md lists the second keys).
#
# Regenerate:
#   PYTHONPATH=. .venv/bin/python polyhost/res/overlay_sources/kitty/fetch_icons.py
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/kitty/bindings.yaml --preview /tmp/kitty_preview
app: kitty
match: [kitty]
output: kitty_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

# kitty's own logo (GPL-3.0), traced to 32x32 in fetch_icons.py.
program_icon: kitty.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- Ctrl / Shift ---
  - { key: TAB, mods: [CTRL], icon: nexttab.png, label: "Next tab" }
  - { key: INSERT, mods: [SHIFT], icon: pastesel.png, label: "Paste from selection" }

  # --- Ctrl+Shift (kitty_mod) with a Cmd form on macOS: not on macOS ---
  - { key: C, mods: [CTRL, SHIFT], icon: copy.png, label: "Copy", except: [macos] }
  - { key: V, mods: [CTRL, SHIFT], icon: paste.png, label: "Paste", except: [macos] }
  - { key: UP, mods: [CTRL, SHIFT], icon: lineup.png, label: "Scroll line up", except: [macos] }
  - { key: DOWN, mods: [CTRL, SHIFT], icon: linedown.png, label: "Scroll line down", except: [macos] }
  - { key: PGUP, mods: [CTRL, SHIFT], icon: pageup.png, label: "Scroll page up", except: [macos] }
  - { key: PGDN, mods: [CTRL, SHIFT], icon: pagedown.png, label: "Scroll page down", except: [macos] }
  - { key: HOME, mods: [CTRL, SHIFT], icon: totop.png, label: "Scroll to top", except: [macos] }
  - { key: END, mods: [CTRL, SHIFT], icon: tobottom.png, label: "Scroll to bottom", except: [macos] }
  - { key: ENTER, mods: [CTRL, SHIFT], icon: newwin.png, label: "New window (pane)", except: [macos] }
  - { key: N, mods: [CTRL, SHIFT], icon: newoswin.png, label: "New OS window", except: [macos] }
  - { key: W, mods: [CTRL, SHIFT], icon: closewin.png, label: "Close window (pane)", except: [macos] }
  - { key: R, mods: [CTRL, SHIFT], icon: resizewin.png, label: "Resize window (pane)", except: [macos] }
  - { key: "1", mods: [CTRL, SHIFT], icon: win1.png, label: "Window 1", except: [macos] }
