  - { key: "]", mods: [], icon: brushinc.png, mode: alpha, label: "Brush size +" }
  - { key: SPACE, mods: [], icon: hand.png,      label: "Pan (hold)" }

  # ============================================================= #
  # TIMELINE / CONTROL  (no-mod, Shift)                           #
  # ============================================================= #
