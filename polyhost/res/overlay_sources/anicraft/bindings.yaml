# AniCraft (ArtCraft "Crafting Apps", Adobe-Animate-style 2D animation) shortcut overlays.
#
# Shortcuts: AniCraft's OWN keymap at storytold/anicraft@9e49ae93 (the engine
# command registry, Tool::shortcut, VIEW_SHORTCUTS and the keys app.rs and
# stage.rs handle before the keymap) -- NOT Adobe's list. file:line for every
# group is in SOURCES.md.
#
# The keymap writes "Ctrl" and parses it to egui `Modifiers::COMMAND`
# (src/keymap.rs::parse): Cmd on macOS, Ctrl elsewhere. So every Ctrl chord is
# CMDCTRL and the generator emits anicraft_template.* and _mac.*. Nothing is
# remapped on macOS (SOURCES.md "macOS").
#
# Icons: Fluent (MIT) + Material Symbols (Apache-2.0) via fetch_icons.py,
# VectorCraft's committed tool icons for the same tools, drawn timeline cells.
# Program mark: AniCraft's own icon (MIT OR Apache-2.0). See SOURCES.md.
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/anicraft/fetch_icons.py
#   PYTHONPATH=. python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/anicraft/bindings.yaml --preview /tmp/anicraft_preview
app: anicraft
# Windows exe anicraft.exe, Linux binary `anicraft`, macOS bundle "AniCraft";
# Wayland app id / X11 WM_CLASS ai.storyteller.anicraft (src/platform.rs APP_ID,
# StartupWMClass in packaging/linux/ai.storyteller.anicraft.desktop).
match: [anicraft, ai.storyteller.anicraft]
output: anicraft_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

# The app's own .ico, 128 px frame. Sweep (frames 48/64/128/256 x luma
# 80..160 / bright 140..225): `luma` lights the ink, which at 40 px is a
# scatter of engraving strokes up to t125 and a noisy blob at t160. `bright`
# 170 lights the yellow field and the paper, leaving the rabbit as a dark
# silhouette in a lit tile with both ears readable; 140 fills the rabbit in,
# 200 drops the field. 128 and 256 render alike; 64 loses the inner ear.
program_icon: anicraft.png
program_icon_mode: bright
program_icon_threshold: 170
program_icon_anchor: right
program_icon_region: [40, 40]
program_icon_margin: 0

bindings:
