  - { key: U, mods: [], icon: width.png, mode: alpha, label: "Width tool" }
  - { key: M, mods: [], icon: bone.png,          label: "Bone tool" }
  - { key: P, mods: [], icon: pen.png, mode: alpha, label: Pen }
  - { key: T, mods: [], icon: type.png,          label: Text }
  - { key: Y, mods: [SHIFT], icon: pencil.png,   label: Pencil }
  - { key: B, mods: [], icon: blobbrush.png,     label: "Brush (fills)" }
  - { key: Y, mods: [], icon: paintbrush.png,    label: "Paint brush" }
  - { key: E, mods: [], icon: eraser.png,        label: Eraser }
  - { key: R, mods: [], icon: rectangle.png,     label: Rectangle }
  - { key: O, mods: [], icon: ellipse.png,       label: Oval }
  - { key: N, mods: [], icon: line.png, mode: alpha, label: Line }
  - { key: K, mods: [], icon: fill.png,          label: "Paint bucket" }
