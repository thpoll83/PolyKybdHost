# tmux for PolyKybd. See SOURCES.md.
#
# Keys: tmux's default key table, `key_bindings_init()` in key-bindings.c
# (github.com/tmux/tmux, tag 3.8), cross-checked with tmux(1) DEFAULT KEY
# BINDINGS and with `list-keys -T prefix` from tmux 3.4. Only bindings that
# are the same in 3.4 and 3.8 are drawn.
#
# Every tmux command key follows the PREFIX, Ctrl+B. The overlay therefore
# shows the prefix table:
#   * Ctrl+B is the prefix itself (the "PRFX" icon with the tmux logo).
#   * Every other icon is what that key does when it is pressed AFTER the
#     prefix, on the layer of the modifiers it is pressed with: `c` on the
#     plain layer, `%` (Shift+5) on the Shift layer, Alt+1 on the Alt layer,
#     Ctrl+O on the Ctrl layer. Without the prefix the keys type as usual.
# A character that needs Shift on a US layout is drawn on its key's Shift
# variant (% is Shift+5, " is Shift+', { is Shift+[), as in the nano set.
# Esc shows the program mark. No macOS set: tmux runs in a terminal, where
# its keys are the same on every system (Ctrl is Control on a Mac).
#
# Routed by the terminal's WINDOW TITLE (overlay-mapping.poly.yaml,
# `&editor_titles`): tmux does not set the outer title by default
# (`set-titles` is off), so the title keeps what the shell or the terminal
# wrote when tmux started.
#
# Regenerate:
#   PYTHONPATH=. .venv/bin/python polyhost/res/overlay_sources/tmux/fetch_icons.py
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/tmux/tmux.yaml --preview /tmp/tmux_preview
app: tmux
match: [tmux]
output: tmux_template
icon_dir: icons
fit: contain
anchor: bottom-right
# The drawn icons are 40x32 and placed 1:1 in this region.
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py

program_icon: tmux.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- the prefix, and the Ctrl keys after it ---
  - { key: B, mods: [CTRL], icon: prefix.png, region: [40, 32], label: "Prefix (twice: send it)" }
  - { key: O, mods: [CTRL], icon: pane_rotate.png, region: [40, 32], label: "Rotate the panes" }
  - { key: Z, mods: [CTRL], icon: suspend.png, label: "Suspend the client" }
  - { key: UP, mods: [CTRL], icon: size_up.png, region: [40, 32], label: "Resize pane up" }
  - { key: DOWN, mods: [CTRL], icon: size_down.png, region: [40, 32], label: "Resize pane down" }
  - { key: LEFT, mods: [CTRL], icon: size_left.png, region: [40, 32], label: "Resize pane left" }
  - { key: RIGHT, mods: [CTRL], icon: size_right.png, region: [40, 32], label: "Resize pane right" }

  # --- windows ---
  - { key: C, mods: [], icon: newwindow.png, label: "New window" }
  - { key: N, mods: [], icon: win_next.png, region: [40, 32], label: "Next window" }
  - { key: P, mods: [], icon: win_prev.png, region: [40, 32], label: "Previous window" }
  - { key: L, mods: [], icon: win_last.png, region: [40, 32], label: "Last window" }
  - { key: W, mods: [], icon: win_choose.png, region: [40, 32], label: "Choose a window" }
  - { key: F, mods: [], icon: win_find.png, region: [40, 32], label: "Find a window" }
  - { key: I, mods: [], icon: info.png, label: "Window information" }
  - { key: ",", mods: [], icon: win_rename.png, region: [40, 32], label: "Rename window" }
  - { key: ".", mods: [], icon: win_move.png, region: [40, 32], label: "Move window" }
  - { key: "'", mods: [], icon: win_index.png, region: [40, 32], label: "Window by index" }
  - { key: "7", mods: [SHIFT], icon: win_kill.png, region: [40, 32], label: "Kill window" }
  - { key: ",", mods: [SHIFT], icon: win_menu.png, region: [40, 32], label: "Window menu" }
  - { key: N, mods: [ALT], icon: win_alert_next.png, region: [40, 32], label: "Next window with alert" }
  - { key: P, mods: [ALT], icon: win_alert_prev.png, region: [40, 32], label: "Previous window with alert" }
  - { key: "0", mods: [], icon: win0.png, region: [40, 32], label: "Window 0" }
  - { key: "1", mods: [], icon: win1.png, region: [40, 32], label: "Window 1" }
  - { key: "2", mods: [], icon: win2.png, region: [40, 32], label: "Window 2" }
  - { key: "3", mods: [], icon: win3.png, region: [40, 32], label: "Window 3" }
  - { key: "4", mods: [], icon: win4.png, region: [40, 32], label: "Window 4" }
  - { key: "5", mods: [], icon: win5.png, region: [40, 32], label: "Window 5" }
  - { key: "6", mods: [], icon: win6.png, region: [40, 32], label: "Window 6" }
  - { key: "7", mods: [], icon: win7.png, region: [40, 32], label: "Window 7" }
  - { key: "8", mods: [], icon: win8.png, region: [40, 32], label: "Window 8" }
  - { key: "9", mods: [], icon: win9.png, region: [40, 32], label: "Window 9" }

  # --- panes ---
  - { key: "5", mods: [SHIFT], icon: split_h.png, region: [40, 32], label: "Split left and right" }
  - { key: "'", mods: [SHIFT], icon: split_v.png, region: [40, 32], label: "Split top and bottom" }
  - { key: UP, mods: [], icon: pane_up.png, region: [40, 32], label: "Pane above" }
  - { key: DOWN, mods: [], icon: pane_down.png, region: [40, 32], label: "Pane below" }
  - { key: LEFT, mods: [], icon: pane_left.png, region: [40, 32], label: "Pane to the left" }
  - { key: RIGHT, mods: [], icon: pane_right.png, region: [40, 32], label: "Pane to the right" }
  - { key: O, mods: [], icon: pane_next.png, region: [40, 32], label: "Next pane" }
  - { key: ";", mods: [], icon: pane_last.png, region: [40, 32], label: "Last pane" }
  - { key: Z, mods: [], icon: zoom.png, label: "Zoom pane" }
  - { key: X, mods: [], icon: pane_kill.png, region: [40, 32], label: "Kill pane" }
  - { key: Q, mods: [], icon: pane_numbers.png, region: [40, 32], label: "Show pane numbers" }
  - { key: M, mods: [], icon: pane_mark.png, region: [40, 32], label: "Mark pane" }
  - { key: M, mods: [SHIFT], icon: pane_unmark.png, region: [40, 32], label: "Clear the marked pane" }
  - { key: "1", mods: [SHIFT], icon: pane_break.png, region: [40, 32], label: "Break pane to a window" }
  - { key: "[", mods: [SHIFT], icon: pane_swap_up.png, region: [40, 32], label: "Swap with pane above" }
  - { key: "]", mods: [SHIFT], icon: pane_swap_down.png, region: [40, 32], label: "Swap with pane below" }
  - { key: ".", mods: [SHIFT], icon: pane_menu.png, region: [40, 32], label: "Pane menu" }
  - { key: O, mods: [ALT], icon: pane_rotate_back.png, region: [40, 32], label: "Rotate the panes back" }
  - { key: UP, mods: [ALT], icon: size5_up.png, region: [40, 32], label: "Resize pane up by 5" }
  - { key: DOWN, mods: [ALT], icon: size5_down.png, region: [40, 32], label: "Resize pane down by 5" }
  - { key: LEFT, mods: [ALT], icon: size5_left.png, region: [40, 32], label: "Resize pane left by 5" }
  - { key: RIGHT, mods: [ALT], icon: size5_right.png, region: [40, 32], label: "Resize pane right by 5" }

  # --- layouts ---
  - { key: SPACE, mods: [], icon: layout_next.png, region: [40, 32], label: "Next layout" }
  - { key: E, mods: [SHIFT], icon: layout_even.png, region: [40, 32], label: "Spread panes evenly" }
  - { key: "1", mods: [ALT], icon: layout_even_h.png, region: [40, 32], label: "Layout even-horizontal" }
  - { key: "2", mods: [ALT], icon: layout_even_v.png, region: [40, 32], label: "Layout even-vertical" }
  - { key: "3", mods: [ALT], icon: layout_main_h.png, region: [40, 32], label: "Layout main-horizontal" }
  - { key: "4", mods: [ALT], icon: layout_main_v.png, region: [40, 32], label: "Layout main-vertical" }
  - { key: "5", mods: [ALT], icon: layout_tiled.png, region: [40, 32], label: "Layout tiled" }

  # --- sessions and clients ---
  - { key: D, mods: [], icon: detach.png, label: "Detach" }
  - { key: S, mods: [], icon: sess_choose.png, region: [40, 32], label: "Choose a session" }
  - { key: "4", mods: [SHIFT], icon: sess_rename.png, region: [40, 32], label: "Rename session" }
  - { key: D, mods: [SHIFT], icon: client_choose.png, region: [40, 32], label: "Choose a client" }
  - { key: "9", mods: [SHIFT], icon: client_prev.png, region: [40, 32], label: "Previous client" }
  - { key: "0", mods: [SHIFT], icon: client_next.png, region: [40, 32], label: "Next client" }
  - { key: L, mods: [SHIFT], icon: client_last.png, region: [40, 32], label: "Last client" }

  # --- copy mode and paste buffers ---
  - { key: "[", mods: [], icon: copymode.png, region: [40, 32], label: "Copy mode" }
  - { key: PGUP, mods: [], icon: copymode_up.png, region: [40, 32], label: "Copy mode, scroll up" }
  - { key: "]", mods: [], icon: paste.png, label: "Paste buffer" }
  - { key: "3", mods: [SHIFT], icon: buf_list.png, region: [40, 32], label: "List paste buffers" }
  - { key: "=", mods: [], icon: buf_choose.png, region: [40, 32], label: "Choose a paste buffer" }
  - { key: "-", mods: [], icon: buf_delete.png, region: [40, 32], label: "Delete paste buffer" }

  # --- the client's view, when the terminal is smaller than the window ---
  - { key: UP, mods: [SHIFT], icon: view_up.png, region: [40, 32], label: "Move the view up" }
  - { key: DOWN, mods: [SHIFT], icon: view_down.png, region: [40, 32], label: "Move the view down" }
  - { key: LEFT, mods: [SHIFT], icon: view_left.png, region: [40, 32], label: "Move the view left" }
  - { key: RIGHT, mods: [SHIFT], icon: view_right.png, region: [40, 32], label: "Move the view right" }
  - { key: DELETE, mods: [], icon: view_reset.png, region: [40, 32], label: "View follows the cursor" }

  # --- commands and help ---
  - { key: ";", mods: [SHIFT], icon: command.png, label: "Command prompt" }
  - { key: "/", mods: [SHIFT], icon: listkeys.png, label: "List key bindings" }
  - { key: "/", mods: [], icon: describekey.png, region: [40, 32], label: "Describe a key" }
  - { key: C, mods: [SHIFT], icon: customize.png, label: "Customize options" }
  - { key: T, mods: [], icon: clock.png, label: "Show a clock" }
  - { key: R, mods: [], icon: redraw.png, label: "Redraw the client" }
  - { key: "`", mods: [SHIFT], icon: messages.png, label: "Show messages" }
