# Logic Pro shortcut overlays for PolyKybd (macOS only). See SOURCES.md.
#
# Shortcuts: Apple, Logic Pro User Guide for Mac, "Key command tables": Global
# Commands, Various Windows, Main Window Tracks and Various Editors, Views
# Showing Time Ruler, Main Window Tracks (the U.S. default preset). Logic Pro
# is a macOS app, so every binding is scoped `only: [macos]` and only the
# `_mac` set is written. Command is GUI, Option is ALT, Control is CTRL.
#
# The set has the Tracks area keys and the global keys; keys that act only in
# an editor (Piano Roll, Score, Event List, Step Sequencer) are left out. On
# macOS the host also reads every menu shortcut of the focused app; those fill
# each key this set leaves free.
#
# Regenerate:
#   python polyhost/res/overlay_sources/logicpro/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/logicpro/bindings.yaml --preview /tmp/logicpro_preview
app: logicpro
match: [logic pro, logic pro x]
output: logicpro_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

# No program_icon: ESC is left to the host's program mark (the app's own
# icon from its bundle), as for the other proprietary apps.

_m: &m { only: [macos] }

bindings:
  # --- File ---
  - { key: N, mods: [GUI], icon: fromtemplate.png, <<: *m, label: "New from template" }
  - { key: N, mods: [GUI, SHIFT], <<: *m, label: New }
  - { key: O, mods: [GUI], <<: *m, label: Open }
  - { key: S, mods: [GUI], <<: *m, label: Save }
  - { key: S, mods: [GUI, SHIFT], <<: *m, label: "Save as" }
  - { key: W, mods: [GUI, ALT], icon: closeproject.png, <<: *m, label: "Close project" }
  - { key: W, mods: [GUI], <<: *m, label: Close }
  - { key: Q, mods: [GUI], <<: *m, label: Quit }
  - { key: I, mods: [GUI], icon: import.png, <<: *m, label: Import }
  - { key: E, mods: [GUI], icon: exportaudio.png, <<: *m, label: "Export track as audio" }
  - { key: E, mods: [GUI, SHIFT], icon: exportall.png, <<: *m, label: "Export all tracks as audio" }
  - { key: E, mods: [GUI, ALT], icon: exportmidi.png, <<: *m, label: "Export selection as MIDI" }
