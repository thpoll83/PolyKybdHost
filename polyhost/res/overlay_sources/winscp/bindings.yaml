# WinSCP shortcut overlays for PolyKybd (Commander interface).
#
# Shortcuts come from WinSCP's OWN documentation -- "Commander Keyboard
# Shortcuts" -- so this is the documented set rather than a third-party summary.
# See SOURCES.md.
#
# ⚠️ Two things about this app that the overlay makes visible and nothing else
# does. It is an F-KEY app in the Norton Commander tradition (F5 copy, F6 move,
# F7 new folder, F8 delete), so most of the no-modifier row is live. And several
# shortcuts are DIRECTIONAL rather than absolute: F5/F6 mean download, upload or
# local copy depending on which panel is active, so the icons say "transfer",
# not "download".
#
# Icons: Microsoft Fluent UI System Icons (MIT). Program mark (ESC, all layers):
# two panels with a transfer arrow, drawn here -- see fetch_icons.py for why a
# letter tile was rejected.
#
# Regenerate:
#   python polyhost/res/overlay_sources/winscp/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/winscp/bindings.yaml --preview /tmp/winscp_preview
app: winscp
match: [winscp]
output: winscp_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: winscp.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [42, 34]
program_icon_margin: 0

bindings:
  # --- no modifier: the Commander F-keys (primary A channel) ------------
  - { key: F2,  mods: [], icon: rename.png,    label: Rename,          source: "ms-fluent/Rename (MIT)" }
  - { key: F3,  mods: [], icon: find.png,      label: "Find file",     source: "ms-fluent/Document Search (MIT)" }
  - { key: F4,  mods: [], icon: edit.png,      label: "Edit file",     source: "ms-fluent/Text Edit Style (MIT)" }
  - { key: F5,  mods: [], icon: copyfiles.png, label: "Copy / transfer", source: "ms-fluent/Copy (MIT)" }
  - { key: F6,  mods: [], icon: movefiles.png, label: "Move / transfer + delete", source: "ms-fluent/Arrow Forward (MIT)" }
  - { key: F7,  mods: [], icon: newfolder.png, label: "New folder",    source: "ms-fluent/Folder Add (MIT)" }
  - { key: F8,  mods: [], icon: delete.png,    label: Delete,          source: "ms-fluent/Delete (MIT)" }
  - { key: F9,  mods: [], icon: props.png,     label: Properties,      source: "ms-fluent/Info (MIT)" }
  - { key: F10, mods: [], icon: quit.png,      label: Quit,            source: "ms-fluent/Power (MIT)" }
  - { key: TAB, mods: [], icon: switchpanel.png, label: "Switch panel", source: "ms-fluent/Arrow Swap (MIT)" }
  - { key: BACKSPACE, mods: [], icon: parent.png, label: "Parent folder", source: "ms-fluent/Folder Arrow Up (MIT)" }

  # --- Shift (primary B channel) ----------------------------------------
  - { key: F2, mods: [SHIFT], icon: compare.png,   label: "Compare panels",     source: "ms-fluent/Document Split Hint (MIT)" }
  - { key: F4, mods: [SHIFT], icon: editnew.png,   label: "Edit / create file", source: "ms-fluent/Document Add (MIT)" }
  - { key: F5, mods: [SHIFT], icon: duplicate.png, label: "Duplicate (remote)", source: "ms-fluent/Document Multiple (MIT)" }
  - { key: F6, mods: [SHIFT], icon: rename.png,    label: "Move / rename (remote)", source: "ms-fluent/Rename (MIT)" }
  - { key: DELETE, mods: [SHIFT], icon: delete.png, label: Delete,              source: "ms-fluent/Delete (MIT)" }

  # --- Ctrl: transfer & session (primary R channel) ---------------------
  - { key: K, mods: [CTRL], icon: copyfiles.png,    label: "Copy / transfer",   source: "ms-fluent/Copy (MIT)" }
  - { key: S, mods: [CTRL], icon: sync.png,         label: "Synchronise dirs",  source: "ms-fluent/Cloud Sync (MIT)" }
  - { key: U, mods: [CTRL], icon: keepuptodate.png, label: "Keep remote up to date", source: "ms-fluent/Arrow Sync Checkmark (MIT)" }
  - { key: Q, mods: [CTRL], icon: queue.png,        label: "Focus queue",       source: "ms-fluent/Timer (MIT)" }
  - { key: P, mods: [CTRL], icon: putty.png,        label: "Open in PuTTY",     source: "ms-fluent/Open (MIT)" }
  - { key: T, mods: [CTRL], icon: newtab.png,       label: "New tab",           source: "ms-fluent/Tab Add (MIT)" }
  - { key: N, mods: [CTRL], icon: newsession.png,   label: "New session",       source: "ms-fluent/Server (MIT)" }
  - { key: W, mods: [CTRL], icon: closetab.png,     label: "Close tab",         source: "ms-fluent/Dismiss Square (MIT)" }
  - { key: TAB, mods: [CTRL], icon: nexttab.png,    label: "Next tab",          source: "ms-fluent/Arrow Right (MIT)" }

  # --- Ctrl: navigation & selection -------------------------------------
  - { key: R, mods: [CTRL], icon: reread.png,    label: "Re-read panel",   source: "ms-fluent/Arrow Sync (MIT)" }
  - { key: H, mods: [CTRL], icon: homedir.png,   label: "Home directory",  source: "ms-fluent/Home (MIT)" }
  - { key: B, mods: [CTRL], icon: bookmark.png,  label: "Bookmark folder", source: "ms-fluent/Star (MIT)" }
  - { key: O, mods: [CTRL], icon: bookmarks.png, label: Bookmarks,         source: "ms-fluent/Bookmark Multiple (MIT)" }
  - { key: L, mods: [CTRL], icon: bookmarks.png, label: Bookmarks,         source: "ms-fluent/Bookmark Multiple (MIT)" }
  - { key: A, mods: [CTRL], icon: selectall.png, label: "Select all",      source: "ms-fluent/Select All On (MIT)" }
  - { key: C, mods: [CTRL], icon: copynames.png, label: "Copy to clipboard", source: "ms-fluent/Clipboard Letter (MIT)" }
  - { key: V, mods: [CTRL], icon: paste.png,     label: Paste,             source: "ms-fluent/Clipboard Paste (MIT)" }
  - { key: F, mods: [CTRL], icon: incsearch.png, label: "Incremental search", source: "ms-fluent/Search (MIT)" }
  - { key: BACKSLASH,    mods: [CTRL], icon: root.png,       label: "Root directory",    source: "ms-fluent/Home (MIT)" }
  - { key: LEFT_BRACKET, mods: [CTRL], icon: copylocal.png,  label: "Copy local path",   source: "ms-fluent/Panel Left (MIT)" }
  - { key: RIGHT_BRACKET, mods: [CTRL], icon: copyremote.png, label: "Copy remote path", source: "ms-fluent/Panel Right (MIT)" }
  # sorting (Ctrl+F3..F9)
  - { key: F3, mods: [CTRL], icon: sortname.png,  label: "Sort by name",       source: "ms-fluent/Text Sort Ascending (MIT)" }
  - { key: F4, mods: [CTRL], icon: sortext.png,   label: "Sort by extension",  source: "ms-fluent/Filter (MIT)" }
  - { key: F5, mods: [CTRL], icon: sorttime.png,  label: "Sort by time",       source: "ms-fluent/Calendar (MIT)" }
  - { key: F6, mods: [CTRL], icon: sortsize.png,  label: "Sort by size",       source: "ms-fluent/Data Bar Vertical (MIT)" }
  - { key: F7, mods: [CTRL], icon: sortattrs.png, label: "Sort by permissions", source: "ms-fluent/Options (MIT)" }
  - { key: F8, mods: [CTRL], icon: sortowner.png, label: "Sort by owner",      source: "ms-fluent/Person (MIT)" }
  - { key: F9, mods: [CTRL], icon: sortgroup.png, label: "Sort by group",      source: "ms-fluent/People (MIT)" }

  # --- Alt (primary G channel) ------------------------------------------
  - { key: UP,    mods: [ALT], icon: parent.png,    label: "Parent folder", source: "ms-fluent/Folder Arrow Up (MIT)" }
  - { key: LEFT,  mods: [ALT], icon: back.png,      label: Back,            source: "ms-fluent/Arrow Circle Left (MIT)" }
  - { key: RIGHT, mods: [ALT], icon: forward.png,   label: Forward,         source: "ms-fluent/Arrow Circle Right (MIT)" }
  - { key: D,     mods: [ALT], icon: bookmarks.png, label: Bookmarks,       source: "ms-fluent/Bookmark Multiple (MIT)" }
  - { key: ENTER, mods: [ALT], icon: props.png,     label: Properties,      source: "ms-fluent/Info (MIT)" }
  - { key: F1,    mods: [ALT], icon: pathleft.png,  label: "Left panel path",  source: "ms-fluent/Panel Left (MIT)" }
  - { key: F2,    mods: [ALT], icon: pathright.png, label: "Right panel path", source: "ms-fluent/Panel Right (MIT)" }
  - { key: F6,    mods: [ALT], icon: link.png,      label: "Add / edit link",  source: "ms-fluent/Link (MIT)" }
  - { key: F7,    mods: [ALT], icon: find.png,      label: "Find file",        source: "ms-fluent/Document Search (MIT)" }
  # Alt+<N> switches to tab N -- the number is the information, so it is drawn
  - { key: "1", mods: [ALT], icon: tab1.png, label: "Switch to tab 1", source: "ms-fluent/Tab (MIT) + digit" }
  - { key: "2", mods: [ALT], icon: tab2.png, label: "Switch to tab 2", source: "ms-fluent/Tab (MIT) + digit" }
  - { key: "3", mods: [ALT], icon: tab3.png, label: "Switch to tab 3", source: "ms-fluent/Tab (MIT) + digit" }
  - { key: "4", mods: [ALT], icon: tab4.png, label: "Switch to tab 4", source: "ms-fluent/Tab (MIT) + digit" }
  - { key: "5", mods: [ALT], icon: tab5.png, label: "Switch to tab 5", source: "ms-fluent/Tab (MIT) + digit" }
  - { key: "6", mods: [ALT], icon: tab6.png, label: "Switch to tab 6", source: "ms-fluent/Tab (MIT) + digit" }
  - { key: "7", mods: [ALT], icon: tab7.png, label: "Switch to tab 7", source: "ms-fluent/Tab (MIT) + digit" }
  - { key: "8", mods: [ALT], icon: tab8.png, label: "Switch to tab 8", source: "ms-fluent/Tab (MIT) + digit" }
  - { key: "9", mods: [ALT], icon: tab9.png, label: "Switch to tab 9", source: "ms-fluent/Tab (MIT) + digit" }
  - { key: "0", mods: [ALT], icon: tab0.png, label: "Switch to tab 10", source: "ms-fluent/Tab (MIT) + digit" }

  # --- Ctrl+Shift (combo R channel) -------------------------------------
  - { key: L, mods: [CTRL, SHIFT], icon: deselectall.png,  label: "Deselect all",     source: "ms-fluent/Select All Off (MIT)" }
  - { key: S, mods: [CTRL, SHIFT], icon: restoresel.png,   label: "Restore selection", source: "ms-fluent/Arrow Counterclockwise (MIT)" }
  - { key: D, mods: [CTRL, SHIFT], icon: closetab.png,     label: "Close tab",        source: "ms-fluent/Dismiss Square (MIT)" }
  - { key: N, mods: [CTRL, SHIFT], icon: newlocaltab.png,  label: "New local tab",    source: "ms-fluent/Window New (MIT)" }
  - { key: R, mods: [CTRL, SHIFT], icon: reconnect.png,    label: "Reconnect session", source: "ms-fluent/Plug Connected (MIT)" }
  - { key: Q, mods: [CTRL, SHIFT], icon: processqueue.png, label: "Process queue",    source: "ms-fluent/Play (MIT)" }
  - { key: T, mods: [CTRL, SHIFT], icon: terminal.png,     label: "Open terminal",    source: "drawn `>_` (prompt_glyph)", mode: alpha }
  - { key: C, mods: [CTRL, SHIFT], icon: copynames.png,    label: "Copy file names",  source: "ms-fluent/Clipboard Letter (MIT)" }
  - { key: M, mods: [CTRL, SHIFT], icon: commandline.png,  label: "Command line",     source: "ms-fluent/Text Grammar Settings (MIT)" }
  - { key: TAB, mods: [CTRL, SHIFT], icon: prevtab.png,    label: "Previous tab",     source: "ms-fluent/Arrow Left (MIT)" }

  # --- Ctrl+Alt (combo G channel) ---------------------------------------
  - { key: T, mods: [CTRL, ALT], icon: tree.png,        label: "Tree panel",           source: "ms-fluent/Organization (MIT)" }
  - { key: B, mods: [CTRL, ALT], icon: syncbrowse.png,  label: "Synchronised browsing", source: "ms-fluent/Arrow Swap (MIT)" }
  - { key: P, mods: [CTRL, ALT], icon: prefs.png,       label: Preferences,            source: "ms-fluent/Settings (MIT)" }
  - { key: R, mods: [CTRL, ALT], icon: autorefresh.png, label: "Auto refresh",         source: "ms-fluent/Arrow Repeat All (MIT)" }
  - { key: C, mods: [CTRL, ALT], icon: copypaths.png,   label: "Copy names + paths",   source: "ms-fluent/Clipboard Link (MIT)" }
  - { key: H, mods: [CTRL, ALT], icon: hidden.png,      label: "Hidden files",         source: "ms-fluent/Eye Off (MIT)" }
  - { key: F, mods: [CTRL, ALT], icon: filter.png,      label: "Filter files",         source: "ms-fluent/Filter (MIT)" }
  - { key: E, mods: [CTRL, ALT], icon: explorer.png,    label: "Open in Explorer",     source: "ms-fluent/Folder Open (MIT)" }
