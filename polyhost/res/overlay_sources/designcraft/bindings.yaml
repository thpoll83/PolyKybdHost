  - { key: L, mods: [], icon: ellipse.png,      label: Ellipse,           source: "illustrator/ellipse.png (Fluent Oval, MIT)" }
  - { key: C, mods: [], icon: scissors.png, mode: alpha, label: Scissors, source: "illustrator/scissors.png (drawn)" }
  - { key: E, mods: [], icon: freetransform.png, label: "Free transform", source: "material-symbols/crop_free (Apache-2.0)" }
  - { key: R, mods: [], icon: rotate.png,       label: Rotate,            source: "illustrator/rotate.png (Fluent Arrow Rotate Clockwise, MIT)" }
