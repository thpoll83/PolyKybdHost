# DesignCraft (storytold/designcraft, InDesign-like page layout) shortcut overlays.
#
# Shortcuts: the app's OWN default keymap at commit e862e0a6 (SOURCES.md has
# file:line per group) - not InDesign's. DesignCraft writes "Cmd" for egui's
# `command` modifier (Ctrl on Windows/Linux, Cmd on macOS), so every such chord
# is CMDCTRL here and the generator also emits designcraft_template_mac.*.
# No default uses a literal Ctrl or the Win/GUI key.
#
# Dispatch (crates/ui-egui/src/menus.rs `shortcuts`): command shortcuts first
# (first match in UI_COMMANDS, then engine command order), then single-key /
# Shift+key tool shortcuts when no text is being edited.
#
# Icons: Illustrator's committed glyphs for the same actions (byte-identical
# copies), Fluent (MIT), Material Symbols (Apache-2.0) and four drawn glyphs.
# Program mark (ESC): DesignCraft's own app icon (MIT OR Apache-2.0).
#
# Regenerate:
#   PYTHONPATH=. .venv/bin/python polyhost/res/overlay_sources/designcraft/fetch_icons.py
#   PYTHONPATH=. .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/designcraft/bindings.yaml --preview /tmp/designcraft_preview
app: designcraft
match: [designcraft, ai.storyteller.designcraft]
output: designcraft_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: designcraft.png
program_icon_mode: luma
program_icon_threshold: 160
program_icon_anchor: bottom-right
program_icon_region: [46, 40]
program_icon_margin: 0

bindings:
  # ===== Tools, no modifier (crates/tools/src/catalog.rs) =====
