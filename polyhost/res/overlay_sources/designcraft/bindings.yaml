  - { key: BACKSLASH, mods: [], icon: line.png, mode: alpha, label: Line, source: "illustrator/line.png (drawn)" }
  - { key: P, mods: [], icon: pen.png, mode: alpha, label: Pen,           source: "illustrator/pen.png (drawn)" }
  - { key: EQUAL, mods: [], icon: addanchor.png, mode: alpha, label: "Add anchor point", source: "custom (drawn: pen nib + plus)" }
  - { key: MINUS, mods: [], icon: delanchor.png, mode: alpha, label: "Delete anchor point", source: "custom (drawn: pen nib + minus)" }
  - { key: N, mods: [], icon: pencil.png,       label: Pencil,            source: "illustrator/pencil.png (Fluent Edit, MIT)" }
  - { key: F, mods: [], icon: rectframe.png, mode: alpha, label: "Rectangle frame", source: "custom (drawn: rectangle with X)" }
