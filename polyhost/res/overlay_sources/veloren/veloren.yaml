# Veloren overlay for PolyKybd.
#
# Keys: `default_binding()` in voxygen/src/settings/control.rs of
# veloren/veloren, release v0.18.0. See SOURCES.md.
#
# Every key here does the same thing whatever the character holds. Sneak is
# Shift and is held while the character moves, so the movement keys are drawn
# on the Shift layer as well. Camera zoom is bound to the characters ")" and
# "(", which are Shift+0 and Shift+9 on a US layout.
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/veloren/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/veloren/veloren.yaml --preview /tmp/veloren_preview
app: veloren
match: [veloren-voxygen, veloren, net.veloren.veloren]
output: veloren_template
icon_dir: icons
fit: contain
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150
# As for the other game sets: the icon uses the full height on the right; the
# firmware clears 3 px around it, so a letter legend stays whole.
anchor: right
region: [40, 40]
margin: 0

# The game's application icon at 40 x 40, at the right edge beside the ESC legend.
program_icon: program.png
program_icon_mode: alpha
program_icon_region: [40, 40]
program_icon_anchor: right
program_icon_margin: 0

bindings:

  # Movement, also on the Shift (sneak) layer
  - { key: W, icon: forward.png, label: "Move forward" }
  - { key: A, icon: left.png, label: "Move left" }
  - { key: S, icon: back.png, label: "Move back" }
  - { key: D, icon: right.png, label: "Move right" }
  - { key: SPACE, icon: jump.png, label: "Jump" }
  - { key: W, mods: [SHIFT], icon: forward.png, label: "Move forward" }
  - { key: A, mods: [SHIFT], icon: left.png, label: "Move left" }
  - { key: S, mods: [SHIFT], icon: back.png, label: "Move back" }
  - { key: D, mods: [SHIFT], icon: right.png, label: "Move right" }
  - { key: SPACE, mods: [SHIFT], icon: jump.png, label: "Jump" }
  - { key: KC_LEFT_SHIFT, icon: sneak.png, label: "Sneak", region: [34, 40] }
  - { key: KC_LEFT_SHIFT, mods: [SHIFT], icon: sneak.png, label: "Sneak", region: [34, 40] }
  - { key: KC_LEFT_CTRL, icon: glide.png, label: "Glide", region: [34, 40] }
  - { key: B, icon: togglewalk.png, label: "Walk on / off" }
  - { key: DOT, icon: autowalk.png, label: "Auto walk" }
  - { key: K, icon: sit.png, label: "Sit" }
  - { key: J, icon: dance.png, label: "Dance" }
  - { key: H, icon: greet.png, label: "Greet" }

  # Combat and interaction
  - { key: KC_LEFT_ALT, icon: block.png, label: "Block", region: [34, 40] }
  - { key: R, icon: wield.png, label: "Draw / sheathe weapon" }
  - { key: TAB, icon: swaploadout.png, label: "Swap loadout" }
  - { key: E, icon: interact.png, label: "Interact" }
  - { key: X, icon: select.png, label: "Select entity" }
  - { key: G, icon: lantern.png, label: "Lantern on / off" }
  - { key: F, icon: mount.png, label: "Mount" }
  - { key: V, icon: stayfollow.png, label: "Pet: stay / follow" }

  # Hotbar slots 1 to 10
  - { key: "1", icon: slot1.png, label: "Hotbar slot 1" }
  - { key: "2", icon: slot2.png, label: "Hotbar slot 2" }
  - { key: "3", icon: slot3.png, label: "Hotbar slot 3" }
  - { key: "4", icon: slot4.png, label: "Hotbar slot 4" }
  - { key: "5", icon: slot5.png, label: "Hotbar slot 5" }
  - { key: "6", icon: slot6.png, label: "Hotbar slot 6" }
  - { key: "7", icon: slot7.png, label: "Hotbar slot 7" }
  - { key: "8", icon: slot8.png, label: "Hotbar slot 8" }
  - { key: "9", icon: slot9.png, label: "Hotbar slot 9" }
  - { key: Q, icon: slot10.png, label: "Hotbar slot 10" }

  # Windows
  - { key: M, icon: map.png, label: "Map" }
  - { key: I, icon: inventory.png, label: "Inventory" }
  - { key: T, icon: trade.png, label: "Trade" }
  - { key: O, icon: social.png, label: "Social" }
  - { key: C, icon: crafting.png, label: "Crafting" }
  - { key: P, icon: diary.png, label: "Diary" }
  - { key: F10, icon: settings.png, label: "Settings", shared: false }
  - { key: F1, icon: controls.png, label: "Controls", region: [34, 40] }

  # Group invite
  - { key: Y, icon: accept.png, label: "Accept group invite" }
  - { key: N, icon: decline.png, label: "Decline group invite" }

  # Camera
  - { key: L, icon: freelook.png, label: "Free look" }
  - { key: QUOTE, icon: cameraclamp.png, label: "Camera clamp" }
  - { key: "0", icon: cyclecamera.png, label: "Cycle camera" }
  - { key: "0", mods: [SHIFT], icon: zoomin.png, label: "Camera zoom in" }
  - { key: "9", mods: [SHIFT], icon: zoomout.png, label: "Camera zoom out" }
  - { key: EQUAL, mods: [SHIFT], icon: mapzoomin.png, label: "Map zoom in" }
  - { key: MINUS, icon: mapzoomout.png, label: "Map zoom out" }

  # Interface
  - { key: COMMA, icon: togglecursor.png, label: "Cursor on / off" }
  - { key: F2, icon: toggleinterface.png, label: "Interface on / off", region: [34, 40] }
  - { key: F3, icon: debug.png, label: "Debug info" }
  - { key: F4, icon: screenshot.png, label: "Take screenshot", region: [30, 40] }
  - { key: F5, icon: togglechat.png, label: "Chat on / off", region: [34, 40] }
  - { key: F6, icon: toggleingameui.png, label: "Name tags on / off", region: [34, 40] }
  - { key: F8, icon: mutemusic.png, label: "Mute music", region: [34, 40] }
  - { key: F11, icon: fullscreen.png, label: "Toggle fullscreen" }

  # Chat
  - { key: ENTER, icon: chat.png, label: "Open chat" }
  - { key: "/", icon: command.png, label: "Open command" }
