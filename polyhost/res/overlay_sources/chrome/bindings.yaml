# Chrome / Chromium-based browser shortcut overlays for PolyKybd.
#
# ONE spec, TWO artwork sets:
#   chrome_template.*      Windows / Linux  (Chromium's accelerator_table.cc)
#   chrome_mac_template.*  macOS            (accelerators_cocoa.mm +
#                                            global_keyboard_shortcuts_mac.mm)
#
# The same set serves every Chromium browser the mapping lists (Chrome, Brave,
# Edge, Vivaldi, Opera, Arc). The web-app overlays (GitHub, Google Docs, ...)
# are separate specs selected by URL; see overlay-mapping.poly.yaml.
#
# All artwork is RECLAIMED: the previously shipped hand-drawn set, cut
# pixel-for-pixel out of the old PNGs and rendered 1:1, so the Windows/Linux set
# keeps exactly the drawings it had. One cell was dropped: Alt+H (history),
# which Chromium binds on no platform. See SOURCES.md.
#
# Regenerate (from the repo root, with the project venv):
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/chrome/bindings.yaml --preview /tmp/chrome_preview
app: chrome
match: [chrome, google chrome, google-chrome, chromium, brave, msedge, vivaldi, opera, arc]
output: chrome_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

# No program_icon. This template is shared by every Chromium browser, so ESC is
# left blank and each browser's own mark takes it (main 6b7a0d24,
# tests/device/shared_template_esc_test.py).

# Reclaimed artwork renders 1:1: the old cell IS the icon.
_r: &r { region: [72, 40], anchor: center, source: reclaimed }

bindings:
  # -- the same chord with Cmd on macOS --
  - { key: D,   mods: [CMDCTRL], icon: bookmark.png,   <<: *r, label: "Bookmark page" }
  - { key: F,   mods: [CMDCTRL], icon: find.png,       <<: *r, label: Find }
  - { key: G,   mods: [CMDCTRL], icon: findnext.png,   <<: *r, label: "Find next" }
  - { key: L,   mods: [CMDCTRL], icon: addressbar.png, <<: *r, label: "Address bar" }
  - { key: N,   mods: [CMDCTRL], icon: newwindow.png,  <<: *r, label: "New window" }
  - { key: R,   mods: [CMDCTRL], icon: reload.png,     <<: *r, label: Reload }
  - { key: T,   mods: [CMDCTRL], icon: newtab.png,     <<: *r, label: "New tab" }
  - { key: W,   mods: [CMDCTRL], icon: closetab.png,   <<: *r, label: "Close tab" }
  - { key: "1", mods: [CMDCTRL], icon: tab1.png,       <<: *r, label: "Tab 1" }
  - { key: "2", mods: [CMDCTRL], icon: tab2.png,       <<: *r, label: "Tab 2" }
  - { key: "3", mods: [CMDCTRL], icon: tab3.png,       <<: *r, label: "Tab 3" }
  - { key: "4", mods: [CMDCTRL], icon: tab4.png,       <<: *r, label: "Tab 4" }
  - { key: "5", mods: [CMDCTRL], icon: tab5.png,       <<: *r, label: "Tab 5" }
  - { key: "6", mods: [CMDCTRL], icon: tab6.png,       <<: *r, label: "Tab 6" }
  - { key: "7", mods: [CMDCTRL], icon: tab7.png,       <<: *r, label: "Tab 7" }
  - { key: "8", mods: [CMDCTRL], icon: tab8.png,       <<: *r, label: "Tab 8" }
  - { key: "9", mods: [CMDCTRL], icon: lasttab.png,    <<: *r, label: "Last tab" }
  - { key: "0", mods: [CMDCTRL], icon: zoomreset.png,  <<: *r, label: "Reset zoom" }
  - { key: "-", mods: [CMDCTRL], icon: zoomout.png,    <<: *r, label: "Zoom out" }
  - { key: "=", mods: [CMDCTRL], icon: zoomin.png,     <<: *r, label: "Zoom in" }
  - { key: N,   mods: [CMDCTRL, SHIFT], icon: incognito.png, <<: *r, label: "Incognito window" }
  - { key: T,   mods: [CMDCTRL, SHIFT], icon: reopentab.png, <<: *r, label: "Reopen closed tab" }

  # -- literal Ctrl on every platform: macOS cycles tabs with ⌃Tab too --
  - { key: TAB, mods: [CTRL],        icon: nexttab.png, <<: *r, label: "Next tab" }
  - { key: TAB, mods: [CTRL, SHIFT], icon: prevtab.png, <<: *r, label: "Previous tab" }

  # -- a different chord on macOS --
  - { key: H,     mods: [CTRL], only: [windows, linux], icon: history.png,   <<: *r, label: History }
  - { key: Y,     mods: [GUI],  only: [macos],          icon: history.png,   <<: *r, label: History }
  - { key: J,     mods: [CTRL], only: [windows, linux], icon: downloads.png, <<: *r, label: Downloads }
  - { key: L,     mods: [GUI, ALT], only: [macos],      icon: downloads.png, <<: *r, label: Downloads }
  - { key: LEFT,  mods: [ALT],  only: [windows, linux], icon: back.png,      <<: *r, label: Back }
  - { key: "[",   mods: [GUI],  only: [macos],          icon: back.png,      <<: *r, label: Back }
  - { key: RIGHT, mods: [ALT],  only: [windows, linux], icon: forward.png,   <<: *r, label: Forward }
  - { key: "]",   mods: [GUI],  only: [macos],          icon: forward.png,   <<: *r, label: Forward }
  - { key: F11,   mods: [],     only: [windows, linux], icon: fullscreen.png, <<: *r, label: "Full screen" }
  - { key: F,     mods: [GUI, CTRL], only: [macos],     icon: fullscreen.png, <<: *r, label: "Full screen" }
  - { key: I,     mods: [CTRL, SHIFT], only: [windows, linux], icon: devtools.png, <<: *r, label: "Developer tools" }
  - { key: I,     mods: [GUI, ALT],    only: [macos],          icon: devtools.png, <<: *r, label: "Developer tools" }

  # -- Windows/Linux only: macOS binds none of these --
  - { key: F4,  mods: [CTRL],  only: [windows, linux], icon: closetab_f4.png,    <<: *r, label: "Close tab" }
  - { key: F3,  mods: [],      only: [windows, linux], icon: findnext_f3.png,    <<: *r, label: "Find next" }
  - { key: F5,  mods: [],      only: [windows, linux], icon: reload_f5.png,      <<: *r, label: Reload }
  - { key: F6,  mods: [],      only: [windows, linux], icon: addressbar_f6.png,  <<: *r, label: "Address bar" }
  - { key: F10, mods: [SHIFT], only: [windows, linux], icon: contextmenu.png,    <<: *r, label: "Context menu" }

  # --- standard editing (shared Fluent concepts) ---
  # Chromium binds these on every platform (see SOURCES.md): Save page / Open
  # file / Print in accelerator_table.cc (Win/Linux) and accelerators_cocoa.mm
  # (macOS); Cut/Copy/Paste in GetStandardAcceleratorForCommandId (Win/Linux)
  # and the Edit menu (macOS); Undo/Redo/Select all in Blink's
  # editing_behavior.cc (Win/Linux) and the Edit menu (macOS). They serve the
  # web-app overlays layered on top of this set too.
  # Already above and NOT repeated: Find, Find next (Ctrl+G, F3), Close (W),
  # Reload (R, F5), Zoom in/out. Cmd+Y on macOS is History, so macOS Redo is
  # Cmd+Shift+Z only.
  - { key: S, mods: [CMDCTRL], label: "Save", source: "concept (shared Fluent)" }
  - { key: O, mods: [CMDCTRL], label: "Open", source: "concept (shared Fluent)" }
  - { key: P, mods: [CMDCTRL], label: "Print", source: "concept (shared Fluent)" }
  - { key: X, mods: [CMDCTRL], label: "Cut", source: "concept (shared Fluent)" }
  - { key: C, mods: [CMDCTRL], label: "Copy", source: "concept (shared Fluent)" }
  - { key: V, mods: [CMDCTRL], label: "Paste", source: "concept (shared Fluent)" }
  - { key: Z, mods: [CMDCTRL], label: "Undo", source: "concept (shared Fluent)" }
  # Ctrl+Shift+Z is Redo on Windows/Linux too (Blink), and Cmd+Shift+Z on macOS.
  - { key: Z, mods: [CMDCTRL, SHIFT], label: "Redo", source: "concept (shared Fluent)" }
  - { key: Y, mods: [CTRL], only: [windows, linux], label: "Redo", source: "concept (shared Fluent)" }
  - { key: A, mods: [CMDCTRL], label: "Select all", source: "concept (shared Fluent)" }
