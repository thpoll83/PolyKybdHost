# Mathematica / Wolfram notebook shortcut overlays for PolyKybd (Windows, Linux
# and macOS).
#
# ONE spec, three artwork sets: Windows (`output`), Linux (`<output>_linux`, it
# closes a notebook with Ctrl+W instead of Ctrl+F4) and macOS (`<output>_mac`).
#   CMDCTRL          Ctrl on Windows/Linux, Cmd on macOS -- only where Wolfram's
#                    docs give the Cmd version as the Mac key.
#   CTRL             literal Control on every platform: the typesetting keys,
#                    Add Row and Add Column stay Control on the Mac.
#   GUI / ALT        Cmd / Option, for Mac-only keys.
#   only: / except:  the Mac keymap is a remap in places (Alt+1..9 styles are
#                    Cmd+1..9, Alt+. abort is Cmd+.). Keys with no documented
#                    Mac equivalent are `except: [macos]`.
#
# Shortcuts: Wolfram's "Keyboard Shortcut Listing" tech note (Windows keys), the
# per-item menu reference pages (Windows / Macintosh / Linux) and Wolfram's
# shortcut card. See SOURCES.md, which also lists what was left out.
#
# Regenerate:
#   python polyhost/res/overlay_sources/mathematica/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/mathematica/bindings.yaml --preview /tmp/mma_preview
app: mathematica
match: [mathematica, wolframnb, wolfram]
output: mathematica_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

bindings:
  # --- File menu ---
  - { key: N, mods: [CMDCTRL], label: New }
  - { key: O, mods: [CMDCTRL], label: Open }
  - { key: S, mods: [CMDCTRL], label: Save }
  - { key: S, mods: [CMDCTRL, SHIFT], label: "Save as" }
  - { key: P, mods: [CMDCTRL], label: Print }
  - { key: P, mods: [CMDCTRL, SHIFT], icon: printsel.png, label: "Print selection" }
  - { key: F4, mods: [CTRL], icon: close.png, label: "Close notebook", only: [windows] }
  - { key: W, mods: [CMDCTRL], icon: close.png, label: "Close notebook", except: [windows] }

  # --- Edit menu ---
  - { key: Z, mods: [CMDCTRL], label: Undo }
  - { key: X, mods: [CMDCTRL], label: Cut }
  - { key: C, mods: [CMDCTRL], label: Copy }
  - { key: V, mods: [CMDCTRL], label: Paste }
  - { key: A, mods: [CMDCTRL], label: "Select all" }
  - { key: DEL, mods: [], icon: clear.png, label: Clear, except: [macos] }
  - { key: X, mods: [CMDCTRL, SHIFT], icon: clear.png, label: Clear, only: [macos] }
  - { key: C, mods: [CTRL, SHIFT], icon: copytext.png, label: "Copy as plain text", except: [macos] }
  - { key: DOT, mods: [CTRL], icon: extendsel.png, label: "Extend selection" }
  - { key: B, mods: [CMDCTRL, SHIFT], icon: balance.png, label: "Check balance" }
  - { key: QUOTE, mods: [CTRL, ALT], icon: iconize.png, label: "Iconize selection", except: [macos] }
  - { key: QUOTE, mods: [GUI, CTRL], icon: iconize.png, label: "Iconize selection", only: [macos] }
  - { key: SLASH, mods: [ALT], icon: comment.png, label: "Un/comment", except: [macos] }
  - { key: SLASH, mods: [GUI], icon: comment.png, label: "Un/comment", only: [macos] }
  - { key: K, mods: [CMDCTRL], icon: complete.png, label: "Complete selection" }
  - { key: K, mods: [CMDCTRL, SHIFT], icon: template.png, label: "Make template" }
  - { key: SEMICOLON, mods: [ALT], icon: spelling.png, label: "Check spelling", except: [macos] }
  - { key: SEMICOLON, mods: [GUI], icon: spelling.png, label: "Check spelling", only: [macos] }
  - { key: F, mods: [CMDCTRL], label: Find }
  - { key: E, mods: [CMDCTRL], icon: entersel.png, label: "Use selection for find" }
  - { key: F3, mods: [], label: "Find next", except: [macos] }
  - { key: G, mods: [GUI], label: "Find next", only: [macos] }
  - { key: F3, mods: [SHIFT], icon: findprev.png, label: "Find previous", except: [macos] }

  # --- Insert menu ---
  - { key: L, mods: [CMDCTRL], icon: inputabove.png, label: "Input from above" }
  - { key: L, mods: [CMDCTRL, SHIFT], icon: outputabove.png, label: "Output from above" }
  - { key: ENTER, mods: [ALT], icon: samestyle.png, label: "Cell with same style" }
  - { key: EQUAL, mods: [CTRL], icon: freeform.png, label: "Inline free-form input", except: [macos] }
  - { key: H, mods: [CTRL, SHIFT], icon: hyperlink.png, label: Hyperlink, except: [macos] }
  - { key: "1", mods: [CTRL], icon: newcanvas.png, label: "New canvas", except: [macos] }
  - { key: D, mods: [CTRL], icon: canvas.png, label: "Convert to/from canvas", except: [macos] }

  # --- typesetting: Control on every platform ---
  - { key: "6", mods: [CTRL], icon: superscript.png, label: Superscript }
  - { key: MINUS, mods: [CTRL], icon: subscript.png, label: Subscript }
  - { key: "7", mods: [CTRL], icon: above.png, label: Above }
  - { key: "5", mods: [CTRL], icon: opposite.png, label: "Opposite position" }
  - { key: SLASH, mods: [CTRL], icon: fraction.png, label: Fraction }
  - { key: "2", mods: [CTRL], icon: radical.png, label: Radical }
  - { key: SPACE, mods: [CTRL], icon: endsub.png, label: "End subexpression" }
  - { key: ENTER, mods: [CTRL], icon: addrow.png, label: "Add row" }
  - { key: COMMA, mods: [CTRL], icon: addcol.png, label: "Add column" }

  # --- Format menu ---
  - { key: SPACE, mods: [CTRL, SHIFT], icon: clearfmt.png, label: "Clear formatting", except: [macos] }
  - { key: O, mods: [CMDCTRL, SHIFT], icon: optinspector.png, label: "Option inspector" }
  - { key: B, mods: [CMDCTRL], icon: bold.png, label: Bold }
  - { key: I, mods: [CMDCTRL], icon: italic.png, label: Italic }
  - { key: U, mods: [CTRL], icon: underline.png, label: Underline, except: [macos] }
  - { key: EQUAL, mods: [ALT], icon: larger.png, label: "Font larger", except: [macos] }
  - { key: MINUS, mods: [ALT], icon: smaller.png, label: "Font smaller", except: [macos] }
  - { key: EQUAL, mods: [GUI], icon: larger.png, label: "Font larger", only: [macos] }
  - { key: MINUS, mods: [GUI], icon: smaller.png, label: "Font smaller", only: [macos] }
  # Styles of the default stylesheet: Alt+1..9, Cmd+1..9 on macOS.
  - { key: "1", mods: [ALT], icon: title.png, label: "Title style", except: [macos] }
  - { key: "2", mods: [ALT], icon: chapter.png, label: "Chapter style", except: [macos] }
  - { key: "3", mods: [ALT], icon: subchapter.png, label: "Subchapter style", except: [macos] }
  - { key: "4", mods: [ALT], icon: section.png, label: "Section style", except: [macos] }
  - { key: "5", mods: [ALT], icon: subsection.png, label: "Subsection style", except: [macos] }
  - { key: "6", mods: [ALT], icon: subsubsection.png, label: "Subsubsection style", except: [macos] }
  - { key: "7", mods: [ALT], icon: text.png, label: "Text style", except: [macos] }
  - { key: "8", mods: [ALT], icon: code.png, label: "Code style", except: [macos] }
  - { key: "9", mods: [ALT], icon: input.png, label: "Input style", except: [macos] }
  - { key: "1", mods: [GUI], icon: title.png, label: "Title style", only: [macos] }
  - { key: "2", mods: [GUI], icon: chapter.png, label: "Chapter style", only: [macos] }
  - { key: "3", mods: [GUI], icon: subchapter.png, label: "Subchapter style", only: [macos] }
  - { key: "4", mods: [GUI], icon: section.png, label: "Section style", only: [macos] }
  - { key: "5", mods: [GUI], icon: subsection.png, label: "Subsection style", only: [macos] }
  - { key: "6", mods: [GUI], icon: subsubsection.png, label: "Subsubsection style", only: [macos] }
  - { key: "7", mods: [GUI], icon: text.png, label: "Text style", only: [macos] }
  - { key: "8", mods: [GUI], icon: code.png, label: "Code style", only: [macos] }
  - { key: "9", mods: [GUI], icon: input.png, label: "Input style", only: [macos] }

  # --- Cell menu ---
  - { key: D, mods: [CMDCTRL, SHIFT], icon: divide.png, label: "Divide cell" }
  - { key: M, mods: [CMDCTRL, SHIFT], icon: merge.png, label: "Merge cells" }
  - { key: E, mods: [CMDCTRL, SHIFT], icon: showexpr.png, label: "Show expression" }
  - { key: I, mods: [CMDCTRL, SHIFT], icon: inputform.png, label: "Convert to InputForm" }
  - { key: R, mods: [CTRL, SHIFT], icon: rawinputform.png, label: "Convert to raw InputForm", except: [macos] }
  - { key: N, mods: [CMDCTRL, SHIFT], icon: standardform.png, label: "Convert to StandardForm" }
  - { key: T, mods: [CMDCTRL, SHIFT], icon: traditionalform.png, label: "Convert to TraditionalForm" }
  - { key: J, mods: [CMDCTRL], icon: celltags.png, label: "Cell tags" }
  - { key: G, mods: [CMDCTRL, SHIFT], icon: group.png, label: "Group cells" }
  - { key: U, mods: [CMDCTRL, SHIFT], icon: ungroup.png, label: "Ungroup cells" }
  # Ctrl+{ and Ctrl+} need Shift on a US layout; the Mac key is Shift+Cmd+{ / }.
  - { key: LBRACKET, mods: [CMDCTRL, SHIFT], icon: openall.png, label: "Open all subgroups" }
  - { key: RBRACKET, mods: [CMDCTRL, SHIFT], icon: closeall.png, label: "Close all subgroups" }
  - { key: QUOTE, mods: [CMDCTRL], icon: openclose.png, label: "Open/close group" }

  # --- Evaluation menu ---
  - { key: ENTER, mods: [SHIFT], icon: evaluate.png, label: "Evaluate cells" }
  - { key: ENTER, mods: [CTRL, SHIFT], icon: evalinplace.png, label: "Evaluate in place", except: [macos] }
  - { key: ENTER, mods: [GUI], icon: evalinplace.png, label: "Evaluate in place", only: [macos] }
  - { key: F7, mods: [], icon: subsession.png, label: "Evaluate in subsession", except: [macos] }
  - { key: ENTER, mods: [ALT, SHIFT], icon: subsession.png, label: "Evaluate in subsession", only: [macos] }
  - { key: DOT, mods: [ALT], icon: abort.png, label: "Abort evaluation", except: [macos] }
  - { key: DOT, mods: [GUI], icon: abort.png, label: "Abort evaluation", only: [macos] }
  - { key: DOT, mods: [ALT, SHIFT], icon: removequeue.png, label: "Remove from queue", except: [macos] }

  # --- Window and Help menus ---
  - { key: F12, mods: [], icon: fullscreen.png, label: "Full screen", except: [macos] }
  - { key: F, mods: [GUI, ALT], icon: fullscreen.png, label: "Full screen", only: [macos] }
  - { key: F1, mods: [], icon: findfunction.png, label: "Find selected function", except: [macos] }
  - { key: F, mods: [GUI, SHIFT], icon: findfunction.png, label: "Find selected function", only: [macos] }

  # --- moving in a notebook (Windows and Linux) ---
  - { key: HOME, mods: [CTRL], icon: notebookstart.png, label: "Notebook start", except: [macos] }
  - { key: END, mods: [CTRL], icon: notebookend.png, label: "Notebook end", except: [macos] }
  - { key: TAB, mods: [CTRL], icon: nextexpr.png, label: "Next expression", except: [macos] }
  - { key: TAB, mods: [CTRL, SHIFT], icon: prevexpr.png, label: "Previous expression", except: [macos] }
  - { key: DEL, mods: [CTRL, SHIFT], icon: delnext.png, label: "Delete next expression", except: [macos] }
  - { key: BSPC, mods: [CTRL, SHIFT], icon: delprev.png, label: "Delete previous expression", except: [macos] }
