# Age of Empires IV (and the Anniversary Edition) overlays for PolyKybd.
#
# Keys: the global keys of the default "Grid Keys" layout, as listed by the
# official hotkey announcement (Xbox Wire and ageofempires.com, 2021-10-22),
# which the Age of Empires support site names as the default hotkeys. See
# SOURCES.md.
#
# Only keys that do the same thing whatever is selected are labelled. In the
# Grid layout the letter keys alone build, train and give unit commands, and
# their meaning changes with the selection, so they stay blank (except H,
# Cycle through Town Centers).
#
# Regenerate:
#   python polyhost/res/overlay_sources/aoe4/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/aoe4/aoe4.yaml --preview /tmp/aoe4_preview
app: aoe4
match: [reliccardinal, steam_app_1466860]
output: aoe4_template
icon_dir: icons
fit: contain
mode: alpha
threshold: 150
# As for AoE2 and Warcraft III: the icon uses the full height on the right; the
# firmware clears 3 px around it, so a letter legend stays whole.
anchor: right
region: [40, 40]
margin: 0

# AoE2's mark with a dotted IV, drawn over the whole cell without the ESC
# legend (protocol v25, cmd 44).
program_icon: program.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0
program_icon_legend: false

bindings:

  # Control groups: digit selects, Ctrl+digit sets, Shift+digit adds the selection.
  # The select and set icons are AoE2's, so the cells are shared with that set.
  - { key: "1", icon: group1.png, label: "Select group 1", region: [48, 40], margin: 5 }
  - { key: "2", icon: group2.png, label: "Select group 2", region: [48, 40], margin: 5 }
  - { key: "3", icon: group3.png, label: "Select group 3", region: [48, 40], margin: 5 }
  - { key: "4", icon: group4.png, label: "Select group 4", region: [48, 40], margin: 5 }
  - { key: "5", icon: group5.png, label: "Select group 5", region: [48, 40], margin: 5 }
  - { key: "6", icon: group6.png, label: "Select group 6", region: [48, 40], margin: 5 }
  - { key: "7", icon: group7.png, label: "Select group 7", region: [48, 40], margin: 5 }
  - { key: "8", icon: group8.png, label: "Select group 8", region: [48, 40], margin: 5 }
  - { key: "9", icon: group9.png, label: "Select group 9", region: [48, 40], margin: 5 }
  - { key: "0", icon: group0.png, label: "Select group 0", region: [48, 40], margin: 5 }
  - { key: "1", mods: [CTRL], icon: groupnew1.png, label: "Set group 1", region: [48, 40], margin: 5 }
  - { key: "2", mods: [CTRL], icon: groupnew2.png, label: "Set group 2", region: [48, 40], margin: 5 }
  - { key: "3", mods: [CTRL], icon: groupnew3.png, label: "Set group 3", region: [48, 40], margin: 5 }
  - { key: "4", mods: [CTRL], icon: groupnew4.png, label: "Set group 4", region: [48, 40], margin: 5 }
  - { key: "5", mods: [CTRL], icon: groupnew5.png, label: "Set group 5", region: [48, 40], margin: 5 }
  - { key: "6", mods: [CTRL], icon: groupnew6.png, label: "Set group 6", region: [48, 40], margin: 5 }
  - { key: "7", mods: [CTRL], icon: groupnew7.png, label: "Set group 7", region: [48, 40], margin: 5 }
  - { key: "8", mods: [CTRL], icon: groupnew8.png, label: "Set group 8", region: [48, 40], margin: 5 }
  - { key: "9", mods: [CTRL], icon: groupnew9.png, label: "Set group 9", region: [48, 40], margin: 5 }
  - { key: "0", mods: [CTRL], icon: groupnew0.png, label: "Set group 0", region: [48, 40], margin: 5 }
  - { key: "1", mods: [SHIFT], icon: groupadd1.png, label: "Add to group 1", region: [48, 40], margin: 5 }
  - { key: "2", mods: [SHIFT], icon: groupadd2.png, label: "Add to group 2", region: [48, 40], margin: 5 }
  - { key: "3", mods: [SHIFT], icon: groupadd3.png, label: "Add to group 3", region: [48, 40], margin: 5 }
  - { key: "4", mods: [SHIFT], icon: groupadd4.png, label: "Add to group 4", region: [48, 40], margin: 5 }
  - { key: "5", mods: [SHIFT], icon: groupadd5.png, label: "Add to group 5", region: [48, 40], margin: 5 }
  - { key: "6", mods: [SHIFT], icon: groupadd6.png, label: "Add to group 6", region: [48, 40], margin: 5 }
  - { key: "7", mods: [SHIFT], icon: groupadd7.png, label: "Add to group 7", region: [48, 40], margin: 5 }
  - { key: "8", mods: [SHIFT], icon: groupadd8.png, label: "Add to group 8", region: [48, 40], margin: 5 }
  - { key: "9", mods: [SHIFT], icon: groupadd9.png, label: "Add to group 9", region: [48, 40], margin: 5 }
  - { key: "0", mods: [SHIFT], icon: groupadd0.png, label: "Add to group 0", region: [48, 40], margin: 5 }

  # Find units and buildings
  - { key: F1, icon: milbuildings.png, label: "Select all military production buildings", region: [34, 40] }
  - { key: F2, icon: ecobuildings.png, label: "Select all economy buildings", region: [34, 40] }
  - { key: F3, icon: techbuildings.png, label: "Select all research buildings", region: [34, 40] }
  - { key: F4, icon: landmarks.png, label: "Select all landmarks, wonders and capital Town Centers", region: [30, 40] }
  - { key: H, icon: towncenter.png, label: "Cycle through Town Centers" }
  - { key: H, mods: [CTRL], icon: capital.png, label: "Focus on capital Town Center" }
  - { key: DOT, icon: idlevillager.png, label: "Cycle through idle economy units", margin: 5 }
  - { key: DOT, mods: [CTRL], icon: allidlevillagers.png, label: "Select all idle villagers" }
  - { key: COMMA, icon: idlemilitary.png, label: "Cycle through idle military units" }
  - { key: COMMA, mods: [CTRL], icon: allidlemilitary.png, label: "Select all idle military units" }
  - { key: QUOTE, icon: monks.png, label: "Cycle through monks" }
  - { key: SLASH, icon: scouts.png, label: "Cycle through scouts" }
  - { key: A, mods: [CTRL], icon: selectscreen.png, label: "Select all units on screen" }
  - { key: A, mods: [CTRL, SHIFT], icon: allunits.png, label: "Select all units" }
  - { key: V, mods: [CTRL, SHIFT], icon: allvillagers.png, label: "Select all villagers" }
  - { key: C, mods: [CTRL, SHIFT], icon: allmilitary.png, label: "Select all military units" }
  - { key: R, mods: [CTRL, SHIFT], icon: backtowork.png, label: "Return all villagers to work" }
  - { key: F, mods: [CTRL], icon: gatherfood.png, label: "Cycle through villagers gathering food" }
  - { key: W, mods: [CTRL], icon: gatherwood.png, label: "Cycle through villagers gathering wood" }
  - { key: G, mods: [CTRL], icon: gathergold.png, label: "Cycle through villagers gathering gold" }
  - { key: S, mods: [CTRL], icon: gatherstone.png, label: "Cycle through villagers gathering stone" }
  - { key: TAB, icon: subgroup.png, label: "Cycle through selected units" }
  - { key: TAB, mods: [CTRL], icon: subgroupback.png, label: "Cycle through selected units (reverse)" }
  - { key: DEL, icon: delete.png, label: "Delete unit or building (hold)" }

  # Camera
  - { key: F5, icon: focus.png, label: "Focus on selected units", region: [34, 40] }
  - { key: HOME, icon: follow.png, label: "Follow selected unit" }
  - { key: BSPC, icon: resetcamera.png, label: "Reset camera" }
  - { key: "[", icon: rotateleft.png, label: "Rotate camera 45 degrees counter-clockwise" }
  - { key: "]", icon: rotateright.png, label: "Rotate camera 45 degrees clockwise" }
  - { key: SPACE, icon: lastevent.png, label: "Focus on last event" }

  # Communication
  - { key: ENTER, icon: chatallies.png, label: "Team chat" }
  - { key: ENTER, mods: [SHIFT], icon: chatall.png, label: "Global chat" }
  - { key: PGUP, icon: chatback.png, label: "Scroll chat messages (older)" }
  - { key: PGDN, icon: chatfwd.png, label: "Scroll chat messages (newer)" }
  - { key: F6, icon: tribute.png, label: "Players and tribute panel", region: [34, 40] }
  - { key: INSERT, icon: allycolours.png, label: "Toggle team or unique player colours" }
  - { key: E, mods: [CTRL], icon: flare.png, label: "Notify ping" }
  - { key: R, mods: [CTRL], icon: pingattack.png, label: "Attack ping" }
  - { key: T, mods: [CTRL], icon: pingdefend.png, label: "Defend ping" }

  # Game
  - { key: F8, icon: save.png, label: "Quick save" }
  - { key: F9, icon: load.png, label: "Quick load" }
  - { key: F10, icon: gamemenu.png, label: "Game menu" }
  - { key: F11, icon: gametime.png, label: "Toggle game time display", region: [21, 40] }
  - { key: PAUSE, icon: pause.png, label: "Pause" }
