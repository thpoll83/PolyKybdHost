# Google Meet shortcut overlays for PolyKybd. See SOURCES.md.
#
# Meet runs only in a browser, so this set loads from the browser entries'
# `urls-contains: meet.google.com` (and the "Google Meet" title fallback).
# Windows, Linux and ChromeOS share one key column; macOS uses Cmd for the
# microphone and camera and Ctrl+Cmd where the others use Ctrl+Alt, so every
# key is written twice, under `except: [macos]` and `only: [macos]`.
#
# Regenerate:
#   python polyhost/res/overlay_sources/meet/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/meet/bindings.yaml --preview /tmp/meet_preview
app: meet
match: []
output: meet_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: meet.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  - { key: D, mods: [CTRL], icon: mute.png, label: "Mute", except: [macos] }
  - { key: D, mods: [GUI], icon: mute.png, label: "Mute", only: [macos] }
  - { key: E, mods: [CTRL], icon: camera.png, label: "Camera on/off", except: [macos] }
  - { key: E, mods: [GUI], icon: camera.png, label: "Camera on/off", only: [macos] }
  - { key: T, mods: [CTRL, ALT], icon: present.png, label: "Present", except: [macos] }
  - { key: T, mods: [CTRL, GUI], icon: present.png, label: "Present", only: [macos] }
  - { key: C, mods: [CTRL, ALT], icon: chat.png, label: "Chat", except: [macos] }
  - { key: C, mods: [CTRL, GUI], icon: chat.png, label: "Chat", only: [macos] }
  - { key: P, mods: [CTRL, ALT], icon: people.png, label: "People", except: [macos] }
  - { key: P, mods: [CTRL, GUI], icon: people.png, label: "People", only: [macos] }
  - { key: H, mods: [CTRL, ALT], icon: raisehand.png, label: "Raise hand", except: [macos] }
  - { key: H, mods: [CTRL, GUI], icon: raisehand.png, label: "Raise hand", only: [macos] }
  - { key: K, mods: [CTRL, ALT], icon: moretiles.png, label: "More tiles", except: [macos] }
  - { key: K, mods: [CTRL, GUI], icon: moretiles.png, label: "More tiles", only: [macos] }
  - { key: J, mods: [CTRL, ALT], icon: fewertiles.png, label: "Fewer tiles", except: [macos] }
  - { key: J, mods: [CTRL, GUI], icon: fewertiles.png, label: "Fewer tiles", only: [macos] }
  - { key: M, mods: [CTRL, ALT], icon: minimize.png, label: "Minimize video", except: [macos] }
  - { key: M, mods: [CTRL, GUI], icon: minimize.png, label: "Minimize video", only: [macos] }
  - { key: S, mods: [CTRL, ALT], icon: speaker.png, label: "Announce speaker", except: [macos] }
  - { key: S, mods: [CTRL, GUI], icon: speaker.png, label: "Announce speaker", only: [macos] }
  - { key: I, mods: [CTRL, ALT], icon: roominfo.png, label: "Announce room info", except: [macos] }
  - { key: I, mods: [CTRL, GUI], icon: roominfo.png, label: "Announce room info", only: [macos] }
