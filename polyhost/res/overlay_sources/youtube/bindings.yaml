# YouTube (youtube.com in a browser tab) player shortcut overlays for PolyKybd.
# See SOURCES.md.
#
# Keys: every row of YouTube Help "Keyboard shortcuts for YouTube"
# (support.google.com/youtube/answer/7631406, read 2026-10-30). The player keys
# are single keys and act while no text field has focus. Media keys have no
# keycap cell and are left out. The one platform difference is the chapter
# keys: Ctrl+Left/Right on Windows (and Linux), Option+Left/Right on macOS.
#
# Regenerate:
#   python polyhost/res/overlay_sources/youtube/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/youtube/bindings.yaml --preview /tmp/youtube_preview
app: youtube
match: []
output: youtube_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: youtube.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [40, 32]
program_icon_margin: 0

bindings:
  # --- playback ---
  - { key: K, icon: playpause.png, label: "Play or pause" }
  - { key: SPACE, icon: playpause.png, label: "Play or pause" }
  - { key: J, icon: back10.png, label: "Back 10 s" }
  - { key: L, icon: fwd10.png, label: "Forward 10 s" }
  - { key: LEFT, icon: back5.png, label: "Back 5 s" }
  - { key: RIGHT, icon: fwd5.png, label: "Forward 5 s" }
  - { key: UP, icon: volup.png, label: "Volume up" }
  - { key: DOWN, icon: voldown.png, label: "Volume down" }
  - { key: M, icon: mute.png, label: "Mute", shared: false }
  - { key: ",", icon: prevframe.png, label: "Previous frame" }
  - { key: ".", icon: nextframe.png, label: "Next frame" }
  - { key: ",", mods: [SHIFT], icon: slower.png, label: "Slower" }
  - { key: ".", mods: [SHIFT], icon: faster.png, label: "Faster" }
  - { key: HOME, icon: start.png, label: "Start of video" }
  - { key: END, icon: end.png, label: "End of video" }
  - { key: LEFT, mods: [CTRL], icon: prevchapter.png, label: "Previous chapter", except: [macos] }
  - { key: RIGHT, mods: [CTRL], icon: nextchapter.png, label: "Next chapter", except: [macos] }
  - { key: LEFT, mods: [ALT], icon: prevchapter.png, label: "Previous chapter", only: [macos] }
  - { key: RIGHT, mods: [ALT], icon: nextchapter.png, label: "Next chapter", only: [macos] }

  # --- view and navigation ---
  - { key: F, icon: fullscreen.png, label: "Full screen" }
  - { key: C, icon: captions.png, label: "Captions" }
  - { key: I, icon: miniplayer.png, label: "Miniplayer" }
  - { key: "/", icon: search.png, label: "Search", shared: false }
  - { key: N, mods: [SHIFT], icon: nextvideo.png, label: "Next video" }
  - { key: P, mods: [SHIFT], icon: prevvideo.png, label: "Previous video" }
  - { key: "/", mods: [SHIFT], icon: shortcuts.png, label: "Shortcuts" }

  # --- digits: seek to 0 % .. 90 % (drawn seek bar) ---
  - { key: "0", icon: seek_0.png, label: "Seek to start", mode: alpha, region: [40, 40] }
  - { key: "1", icon: seek_1.png, label: "Seek to 10 %", mode: alpha, region: [40, 40] }
  - { key: "2", icon: seek_2.png, label: "Seek to 20 %", mode: alpha, region: [40, 40] }
  - { key: "3", icon: seek_3.png, label: "Seek to 30 %", mode: alpha, region: [40, 40] }
  - { key: "4", icon: seek_4.png, label: "Seek to 40 %", mode: alpha, region: [40, 40] }
  - { key: "5", icon: seek_5.png, label: "Seek to 50 %", mode: alpha, region: [40, 40] }
  - { key: "6", icon: seek_6.png, label: "Seek to 60 %", mode: alpha, region: [40, 40] }
  - { key: "7", icon: seek_7.png, label: "Seek to 70 %", mode: alpha, region: [40, 40] }
  - { key: "8", icon: seek_8.png, label: "Seek to 80 %", mode: alpha, region: [40, 40] }
  - { key: "9", icon: seek_9.png, label: "Seek to 90 %", mode: alpha, region: [40, 40] }
