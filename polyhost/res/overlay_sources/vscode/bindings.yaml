# Visual Studio Code shortcut overlays for PolyKybd.
#
# ONE spec, TWO artwork sets. Every chord below that VS Code itself registers as
# `KeyMod.CtrlCmd` is written `CMDCTRL`, so the generator emits:
#
#   vscode_template.*      CMDCTRL -> Ctrl   (Windows / Linux, the default)
#   vscode_mac_template.*  CMDCTRL -> Cmd    (macOS, via the `os: macos` branch)
#
# Before this, VS Code shipped a single Ctrl-only set and macOS users saw Ctrl
# artwork for an app that is Cmd almost throughout — every icon on the wrong key.
#
# ⚠️ Three classes of binding live here, and the difference is deliberate:
#
#   CMDCTRL  — Ctrl on Windows/Linux, Cmd on macOS. The large majority.
#   CTRL     — literal Ctrl, and it stays Ctrl on macOS too. VS Code keeps a
#              couple of chords on Control on the Mac; writing CMDCTRL for these
#              would draw them on Cmd, where nothing happens.
#   (none)/SHIFT + F-keys — identical on both platforms.
#
# Anything whose macOS chord is a genuine REMAP rather than a modifier swap is
# deliberately absent — one spec cannot express those, and a wrong overlay is
# worse than a missing one. The exclusions are listed in SOURCES.md.
#
# Shortcuts: VS Code default keybindings, cross-checked against the official
# macOS shortcut card and, where the two disagreed, the vscode source itself.
# See SOURCES.md.
#
# Regenerate:
#   python polyhost/res/overlay_sources/vscode/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/vscode/bindings.yaml --preview /tmp/vscode_preview
app: code
match: [code]
title: .* Visual Studio Code
output: vscode_template
# Follow the sublime_mac_template naming rather than the default `_mac` suffix.
output_macos: vscode_mac_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

program_icon: vscode.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_anchor: center
program_icon_margin: 0

bindings:
  # ---------------------------------------------------------------- CMDCTRL --
  # Ctrl on Windows/Linux, Cmd on macOS. All verified `KeyMod.CtrlCmd`.
  - { key: P, mods: [CMDCTRL], icon: quickopen.png,    label: "Quick Open / Go to File", source: "ms-fluent/Document Search (MIT)" }
  - { key: N, mods: [CMDCTRL], icon: newfile.png,      label: "New file",       source: "ms-fluent/Document Add (MIT)" }
  - { key: T, mods: [CMDCTRL], icon: symbols.png,      label: "Show all symbols", source: "ms-fluent/Code (MIT)" }
  - { key: B, mods: [CMDCTRL], icon: sidebar.png,      label: "Toggle sidebar", source: "ms-fluent/Panel Left (MIT)" }
  - { key: W, mods: [CMDCTRL], icon: closeeditor.png,  label: "Close editor",   source: "ms-fluent/Dismiss (MIT)" }
  - { key: "\\", mods: [CMDCTRL], icon: split.png,     label: "Split editor",   source: "ms-fluent/Split Horizontal (MIT)" }
  - { key: "/", mods: [CMDCTRL], icon: comment.png,    label: "Toggle line comment", source: "ms-fluent/Comment (MIT)" }
  - { key: ",", mods: [CMDCTRL], icon: settings.png,   label: Settings,         source: "ms-fluent/Settings (MIT)" }
  - { key: "=", mods: [CMDCTRL], icon: zoomin.png,     label: "Zoom in",        source: "ms-fluent/Zoom In (MIT)" }
  - { key: "-", mods: [CMDCTRL], icon: zoomout.png,    label: "Zoom out",       source: "ms-fluent/Zoom Out (MIT)" }

  # CMDCTRL+Shift
  - { key: P, mods: [CMDCTRL, SHIFT], icon: palette.png,        label: "Command palette",  region: [72, 40], anchor: center, source: "reclaimed from the previously shipped vscode_template" }
  - { key: F, mods: [CMDCTRL, SHIFT], icon: findinfiles.png,    label: "Find in files",    source: "ms-fluent/Folder Search (MIT)" }
  - { key: H, mods: [CMDCTRL, SHIFT], icon: replaceinfiles.png, label: "Replace in files", source: "ms-fluent/Arrow Swap (MIT)" }
  - { key: O, mods: [CMDCTRL, SHIFT], icon: gotosymbol.png,     label: "Go to symbol in file", source: "ms-fluent/Text Bullet List Tree (MIT)" }
  - { key: L, mods: [CMDCTRL, SHIFT], icon: selectall.png,      label: "Select all occurrences", source: "ms-fluent/Select All On (MIT)" }
  - { key: V, mods: [CMDCTRL, SHIFT], icon: mdpreview.png,      label: "Markdown preview", source: "ms-fluent/Eye (MIT)" }
  - { key: E, mods: [CMDCTRL, SHIFT], icon: explorer.png,       label: Explorer,           source: "ms-fluent/Folder (MIT)" }
  - { key: X, mods: [CMDCTRL, SHIFT], icon: extensions.png,     label: Extensions,         source: "ms-fluent/Puzzle Piece (MIT)" }
  - { key: D, mods: [CMDCTRL, SHIFT], icon: debugview.png,      label: "Run and debug",    source: "ms-fluent/Bug (MIT)" }
  - { key: M, mods: [CMDCTRL, SHIFT], icon: problems.png,       label: Problems,           source: "ms-fluent/Warning (MIT)" }
  - { key: U, mods: [CMDCTRL, SHIFT], icon: output.png,         label: Output,             source: "ms-fluent/Document Text (MIT)" }
  - { key: "\\", mods: [CMDCTRL, SHIFT], icon: matchbracket.png, label: "Jump to matching bracket", region: [72, 40], anchor: center, source: "reclaimed from the previously shipped vscode_template" }

  # ------------------------------------------------------------ literal CTRL --
  # These stay on Control on macOS (⌃G, ⌃`, ⌃F5) — NOT CMDCTRL. Writing them as
  # CMDCTRL would put the icon on a Cmd chord that does nothing in VS Code.
  - { key: G, mods: [CTRL], icon: gotoline.png,   label: "Go to line",          source: "ms-fluent/Number Symbol (MIT)" }
  - { key: "`", mods: [CTRL], icon: terminal.png, label: "Toggle terminal",     source: "ms-fluent/Window Console (MIT)" }
  - { key: F5, mods: [CTRL], icon: runnodebug.png, label: "Run without debugging", source: "ms-fluent/Play Circle (MIT)" }

  # ------------------------------------------------ identical on both platforms --
  - { key: F5,  mods: [],      icon: run.png,        label: "Start debugging", source: "ms-fluent/Play (MIT)" }
  - { key: F5,  mods: [SHIFT], icon: stopdebug.png,  label: "Stop debugging",  source: "ms-fluent/Stop (MIT)" }
  - { key: F9,  mods: [],      icon: breakpoint.png, label: "Toggle breakpoint", source: "ms-fluent/Record (MIT)" }
  - { key: F10, mods: [],      icon: stepover.png,   label: "Step over",       source: "ms-fluent/Arrow Step Over (MIT)" }
  - { key: F11, mods: [],      icon: stepinto.png,   label: "Step into",       source: "ms-fluent/Arrow Step In (MIT)" }
  - { key: F11, mods: [SHIFT], icon: stepout.png,    label: "Step out",        source: "ms-fluent/Arrow Step Out (MIT)" }
  - { key: F2,  mods: [],      icon: rename.png,     label: "Rename symbol",   source: "ms-fluent/Rename (MIT)" }
  - { key: F12, mods: [],      icon: definition.png, label: "Go to definition", source: "ms-fluent/Target (MIT)" }
