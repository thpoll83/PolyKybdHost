# FreeCAD 1.1 shortcut overlays for PolyKybd (Windows, Linux and macOS).
#
# Shortcuts: FreeCAD's source at tag 1.1.4 (`sAccel` in the command
# constructors, `Accel` in the Python commands). The QKeySequence standard keys
# are resolved with Qt 6.8's platform table. See SOURCES.md.
#   CMDCTRL          Ctrl on Windows/Linux, Cmd on macOS (Qt's "Ctrl").
#   only: / except:  Redo is Ctrl+Y on Windows and Ctrl+Shift+Z elsewhere; Close
#                    is Ctrl+F4 on Windows and Ctrl+W elsewhere; Delete is
#                    Backspace on macOS; F2 rename and F5 refresh do not exist on
#                    macOS, and Help is Cmd+? there.
#
# ⚠️ The workbench is not in the window title, so the host cannot tell them
# apart. This set has the global keys plus the single keys of Sketcher, Draft
# and TechDraw, which share no key with the global set. Most workbench keys are
# two-key sequences (G, L), which one keycap cannot show; they are left out.
#
# Regenerate:
#   python polyhost/res/overlay_sources/freecad/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/freecad/bindings.yaml --preview /tmp/freecad_preview
app: freecad
match: [freecad, org.freecad.freecad]
output: freecad_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

bindings:
  # --- file ---
  - { key: N, mods: [CMDCTRL], label: New }
  - { key: O, mods: [CMDCTRL], label: Open }
  - { key: S, mods: [CMDCTRL], label: Save }
  - { key: S, mods: [CMDCTRL, SHIFT], label: "Save as" }
  - { key: I, mods: [CMDCTRL, SHIFT], icon: import.png, label: Import }
  - { key: E, mods: [CMDCTRL], icon: export.png, label: Export }
  - { key: P, mods: [CMDCTRL], label: Print }
  - { key: F4, mods: [CTRL], label: Close, only: [windows] }
  - { key: W, mods: [CMDCTRL], label: Close, except: [windows] }

  # --- edit ---
  - { key: Z, mods: [CMDCTRL], label: Undo }
  - { key: Y, mods: [CTRL], label: Redo, only: [windows] }
  - { key: Z, mods: [CMDCTRL, SHIFT], label: Redo, except: [windows] }
  - { key: X, mods: [CMDCTRL], label: Cut }
  - { key: C, mods: [CMDCTRL], label: Copy }
  - { key: V, mods: [CMDCTRL], label: Paste }
  - { key: A, mods: [CMDCTRL], label: "Select all" }
  - { key: DEL, mods: [], label: Delete, except: [macos] }
  - { key: BSPC, mods: [], label: Delete, only: [macos] }
  - { key: F2, mods: [], icon: rename.png, label: Rename, except: [macos] }
  - { key: ENTER, mods: [ALT], icon: properties.png, label: Properties }
  - { key: D, mods: [CMDCTRL], icon: appearance.png, label: Appearance }
  - { key: R, mods: [CMDCTRL], icon: recompute.png, label: Recompute }
  - { key: F5, mods: [], icon: refresh.png, label: Refresh, except: [macos] }
  - { key: COMMA, mods: [CMDCTRL], icon: preferences.png, label: Preferences }

  # --- tools and help ---
  - { key: P, mods: [CMDCTRL, SHIFT], icon: console.png, label: "Send to Python console" }
  - { key: F6, mods: [CMDCTRL], icon: runmacro.png, label: "Execute macro" }
  - { key: F1, mods: [], icon: help.png, label: Help, except: [macos] }
  - { key: SLASH, mods: [GUI, SHIFT], icon: help.png, label: Help, only: [macos] }
  - { key: F1, mods: [SHIFT], icon: whatsthis.png, label: "What's this?" }

  # --- view ---
  - { key: SPACE, mods: [], icon: visibility.png, label: "Toggle visibility" }
  - { key: HOME, mods: [], icon: home.png, label: "Home view" }
  - { key: "0", mods: [], icon: isometric.png, label: Isometric }
  - { key: "1", mods: [], icon: front.png, label: "View front" }
  - { key: "2", mods: [], icon: top.png, label: "View top" }
  - { key: "3", mods: [], icon: right.png, label: "View right" }
  - { key: "4", mods: [], icon: rear.png, label: "View rear" }
  - { key: "5", mods: [], icon: bottom.png, label: "View bottom" }
  - { key: "6", mods: [], icon: left.png, label: "View left" }
  - { key: LEFT, mods: [SHIFT], icon: rotleft.png, label: "Rotate left" }
  - { key: RIGHT, mods: [SHIFT], icon: rotright.png, label: "Rotate right" }
  - { key: F, mods: [SHIFT], icon: freeze.png, label: "Freeze display" }
  - { key: EQUAL, mods: [CMDCTRL], label: "Zoom in" }
  - { key: MINUS, mods: [CMDCTRL], label: "Zoom out" }
  - { key: B, mods: [CMDCTRL], icon: boxzoom.png, label: "Box zoom" }
  - { key: B, mods: [SHIFT], icon: boxsel.png, label: "Box selection" }
  - { key: E, mods: [SHIFT], icon: boxelemsel.png, label: "Box element selection" }
  - { key: F11, mods: [], icon: fullscreen.png, label: "Full screen" }
  - { key: F11, mods: [ALT], icon: fullscreen.png, label: "Full screen (main window)" }
  - { key: LEFT, mods: [CMDCTRL], icon: panelleft.png, label: "Toggle left panel" }
  - { key: RIGHT, mods: [CMDCTRL], icon: panelright.png, label: "Toggle right panel" }
  - { key: UP, mods: [CMDCTRL], icon: paneltop.png, label: "Toggle top panel" }
  - { key: DOWN, mods: [CMDCTRL], icon: panelbottom.png, label: "Toggle bottom panel" }
  - { key: END, mods: [SHIFT], icon: storeview.png, label: "Store working view" }
  - { key: END, mods: [], icon: recallview.png, label: "Recall working view" }
  - { key: TAB, mods: [CTRL], icon: nextwin.png, label: "Next window", except: [macos] }
  - { key: TAB, mods: [CTRL, SHIFT], icon: prevwin.png, label: "Previous window", except: [macos] }

  # --- Sketcher ---
  - { key: D, mods: [], icon: dimension.png, label: Dimension }
  - { key: A, mods: [], icon: horver.png, label: "Horizontal/vertical constraint" }
  - { key: H, mods: [], icon: horizontal.png, label: "Horizontal constraint" }
  - { key: V, mods: [], icon: vertical.png, label: "Vertical constraint" }
  - { key: C, mods: [], icon: coincident.png, label: "Coincident constraint" }
  - { key: O, mods: [], icon: pointonobj.png, label: "Point on object" }
  - { key: L, mods: [], icon: hdim.png, label: "Horizontal dimension" }
  - { key: I, mods: [], icon: vdim.png, label: "Vertical dimension" }
  - { key: P, mods: [], icon: parallel.png, label: "Parallel constraint" }
  - { key: N, mods: [], icon: perpendicular.png, label: "Perpendicular constraint" }
  - { key: T, mods: [], icon: tangent.png, label: "Tangent constraint" }
  - { key: R, mods: [], icon: raddia.png, label: "Radius/diameter" }
  - { key: E, mods: [], icon: equal.png, label: "Equal constraint" }
  - { key: S, mods: [], icon: symmetric.png, label: "Symmetric constraint" }
  - { key: W, mods: [], icon: transform.png, label: "Move/array transform" }

  # --- Draft and TechDraw ---
  - { key: S, mods: [SHIFT], icon: snaplock.png, label: "Snap lock" }
  - { key: SPACE, mods: [SHIFT], icon: wireframe.png, label: "Toggle wireframe" }
  - { key: H, mods: [SHIFT], icon: hdim.png, label: "Horizontal dimension (TechDraw)" }
  - { key: V, mods: [SHIFT], icon: vdim.png, label: "Vertical dimension (TechDraw)" }
