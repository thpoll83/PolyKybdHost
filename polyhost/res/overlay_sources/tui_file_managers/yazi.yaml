# yazi file manager for PolyKybd. See SOURCES.md.
#
# Keys: yazi's default keymap, the [mgr] section of
# yazi-config/preset/keymap-default.toml at the v26.9.1 tag of sxyazi/yazi
# (commit 8dd895c6). Only the main browsing view ([mgr]) is drawn; the task
# list, the input box, the help screen and the pickers have their own keymaps.
#
# yazi writes the key as typed: `Q` is Shift+Q, `?` is Shift+/, `~` is
# Shift+`. A sequence of two keys (`g g`, `c c`, `, m`) shows only its first
# key, and only where every sequence that starts with it does one kind of
# thing (SOURCES.md has the list). Esc shows the program mark.
#
# The keys are the same on Windows, macOS and Linux (yazi runs in a terminal,
# where Cmd never reaches it), so there is one set.
#
# Routed by the terminal's WINDOW TITLE (overlay-mapping.poly.yaml,
# `&editor_titles`): yazi writes "Yazi: <directory>" itself.
#
# Regenerate:
#   PYTHONPATH=. .venv/bin/python polyhost/res/overlay_sources/tui_file_managers/fetch_icons.py
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/tui_file_managers/yazi.yaml --preview /tmp/yazi_preview
app: yazi
match: [yazi]
output: yazi_template
icon_dir: icons
fit: contain
anchor: bottom-right
# The drawn composites are 40x32 and placed 1:1 in this region.
region: [40, 32]
margin: 0
mode: alpha
threshold: 150

program_icon: yazi.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- no modifier ------------------------------------------------------------
  - { key: Q, mods: [], icon: quit.png, label: "Quit" }
  - { key: K, mods: [], icon: up.png, label: "Previous file" }
  - { key: J, mods: [], icon: down.png, label: "Next file" }
  - { key: H, mods: [], icon: parent.png, label: "Parent directory" }
  - { key: L, mods: [], icon: enter.png, label: "Enter directory" }
  - { key: SPACE, mods: [], icon: toggle_select.png, label: "Toggle selection" }
  - { key: V, mods: [], icon: visual.png, label: "Visual mode" }
  - { key: TAB, mods: [], icon: info.png, label: "File info" }               # spot
  - { key: O, mods: [], icon: open.png, label: "Open" }
  - { key: ENTER, mods: [], icon: open.png, label: "Open" }
  - { key: Y, mods: [], icon: copy.png, label: "Copy" }                      # yank
  - { key: X, mods: [], icon: cut.png, label: "Cut" }                        # yank --cut
  - { key: P, mods: [], icon: paste.png, label: "Paste" }
  - { key: "-", mods: [], icon: symlink.png, label: "Symlink" }
  - { key: D, mods: [], icon: trash.png, label: "Move to trash" }
  - { key: A, mods: [], icon: newfile.png, label: "Create file" }
  - { key: R, mods: [], icon: rename.png, label: "Rename" }
  - { key: ";", mods: [], icon: shell.png, label: "Shell command" }
  - { key: ".", mods: [], icon: hidden.png, label: "Toggle hidden" }
  - { key: S, mods: [], icon: search.png, label: "Search names" }            # via fd
  - { key: Z, mods: [], icon: find_file.png, label: "Jump with fzf" }
  - { key: F, mods: [], icon: filter.png, label: "Filter" }
  - { key: "/", mods: [], icon: search_fwd.png, label: "Find next", shared: false }
  - { key: N, mods: [], icon: find_next.png, label: "Next match", shared: false }
  - { key: "1", mods: [], icon: tab1.png, label: "Tab 1" }
  - { key: "2", mods: [], icon: tab2.png, label: "Tab 2" }
  - { key: "3", mods: [], icon: tab3.png, label: "Tab 3" }
  - { key: "4", mods: [], icon: tab4.png, label: "Tab 4" }
  - { key: "5", mods: [], icon: tab5.png, label: "Tab 5" }
  - { key: "6", mods: [], icon: tab6.png, label: "Tab 6" }
  - { key: "7", mods: [], icon: tab7.png, label: "Tab 7" }
  - { key: "8", mods: [], icon: tab8.png, label: "Tab 8" }
  - { key: "9", mods: [], icon: tab9.png, label: "Tab 9" }
  - { key: "[", mods: [], icon: tab_prev.png, label: "Previous tab" }
  - { key: "]", mods: [], icon: tab_next.png, label: "Next tab" }
  - { key: W, mods: [], icon: tasks.png, label: "Task manager" }
  - { key: F1, mods: [], label: "Help" }
  # The first key of a two-key sequence (SOURCES.md).
  - { key: G, mods: [], icon: goto.png, label: "Go to..." }                  # gg gh gc gd gt gf
  - { key: M, mods: [], icon: linemode.png, label: "Linemode..." }           # ms mp mb mm mo mn
  - { key: C, mods: [], icon: copy_path.png, label: "Copy path..." }         # cc cC cd cD cf cn
  - { key: ",", mods: [], icon: sort.png, label: "Sort..." }                 # ,m ,b ,e ,a ,n ,s ,r
  - { key: T, mods: [], icon: tab_group.png, label: "Tab..." }               # tt tr

  # --- Shift ------------------------------------------------------------------
  - { key: Q, mods: [SHIFT], icon: quit.png, label: "Quit, no cwd file" }
  - { key: G, mods: [SHIFT], icon: last.png, label: "Last file" }
  - { key: H, mods: [SHIFT], icon: back.png, label: "Back" }
  - { key: L, mods: [SHIFT], icon: forward.png, label: "Forward" }
  - { key: V, mods: [SHIFT], icon: visual_unset.png, label: "Visual unset mode" }
  - { key: K, mods: [SHIFT], icon: preview_up.png, label: "Preview up" }
  - { key: J, mods: [SHIFT], icon: preview_down.png, label: "Preview down" }
  - { key: O, mods: [SHIFT], icon: open_with.png, label: "Open with" }
  - { key: ENTER, mods: [SHIFT], icon: open_with.png, label: "Open with" }
  - { key: P, mods: [SHIFT], icon: paste_force.png, label: "Paste, overwrite" }
  - { key: "-", mods: [SHIFT], icon: symlink_rel.png, label: "Relative symlink" }   # _
  - { key: Y, mods: [SHIFT], icon: unyank.png, label: "Cancel yank" }
  - { key: X, mods: [SHIFT], icon: unyank.png, label: "Cancel yank" }
  - { key: D, mods: [SHIFT], icon: delete_perm.png, label: "Delete permanently" }
  - { key: A, mods: [SHIFT], icon: bulk_create.png, label: "Bulk create" }
  - { key: ";", mods: [SHIFT], icon: shell_wait.png, label: "Shell, wait" }          # :
  - { key: S, mods: [SHIFT], icon: search_content.png, label: "Search contents" }   # via ripgrep
  - { key: Z, mods: [SHIFT], icon: jump_dir.png, label: "Jump with zoxide" }
  - { key: "/", mods: [SHIFT], icon: search_back.png, label: "Find previous" }      # ?
  - { key: N, mods: [SHIFT], icon: find_prev.png, label: "Previous match" }
  - { key: "[", mods: [SHIFT], icon: tab_swap_left.png, label: "Swap tab left" }     # {
  - { key: "]", mods: [SHIFT], icon: tab_swap_right.png, label: "Swap tab right" }   # }
  - { key: "`", mods: [SHIFT], label: "Help" }                                      # ~

  # --- Ctrl -------------------------------------------------------------------
  - { key: C, mods: [CTRL], icon: closetab.png, label: "Close tab" }
  - { key: Z, mods: [CTRL], icon: suspend.png, label: "Suspend" }
  - { key: U, mods: [CTRL], icon: half_up.png, label: "Half page up" }
  - { key: D, mods: [CTRL], icon: half_down.png, label: "Half page down" }
  - { key: B, mods: [CTRL], icon: page_up.png, label: "Page up" }
  - { key: F, mods: [CTRL], icon: page_down.png, label: "Page down" }
  - { key: A, mods: [CTRL], icon: select_all.png, label: "Select all" }
  - { key: R, mods: [CTRL], icon: invert_select.png, label: "Invert selection" }
  - { key: S, mods: [CTRL], icon: search_cancel.png, label: "Cancel search" }
  - { key: "-", mods: [CTRL], icon: hardlink.png, label: "Hardlink" }
