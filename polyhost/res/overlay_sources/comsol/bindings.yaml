  - { key: "F1", mods: [], icon: help.png, label: "Help" }
  - { key: "F1", mods: [CTRL], icon: documentation.png, label: "Documentation", only: [windows, linux] }
  - { key: "F1", mods: [GUI], icon: documentation.png, label: "Documentation", only: [macos] }
