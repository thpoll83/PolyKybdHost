# ONLYOFFICE Spreadsheet Editor shortcut overlays for PolyKybd.
#
# Serves Windows/Linux AND macOS from this one file (`CMDCTRL` is Ctrl on
# Windows/Linux and Cmd on macOS). Keys: the editor's own "Keyboard Shortcuts"
# help page (see SOURCES.md). The mapping loads this set for a
# `DesktopEditors` window whose title has a spreadsheet file extension.
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/onlyoffice/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/onlyoffice/spreadsheet.yaml --preview /tmp/oo_sheet_preview
app: onlyoffice-spreadsheet
match: [desktopeditors]
output: onlyoffice_spreadsheet_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: onlyoffice.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- file and window ---
  - { key: O, mods: [CMDCTRL], icon: open.png,  label: Open,  source: "ms-fluent/Folder Open (MIT), from word/" }
  - { key: S, mods: [CMDCTRL], icon: save.png,  label: Save,  source: "ms-fluent/Save (MIT), from word/" }
  - { key: S, mods: [CMDCTRL, SHIFT], icon: saveas.png, label: "Save as", source: "ms-fluent/Save Edit (MIT), from word/" }
  - { key: P, mods: [CMDCTRL], icon: print.png, label: Print, source: "ms-fluent/Print (MIT), from word/" }
  - { key: W, mods: [CMDCTRL], icon: close.png, label: "Close file", source: "ms-fluent/Document Dismiss (MIT), from word/" }
  - { key: F4, mods: [CTRL], icon: close.png, label: "Close file", source: "ms-fluent/Document Dismiss (MIT), from word/", except: [macos] }
  - { key: TAB, mods: [CTRL],        icon: nexttab.png, label: "Next tab",     source: "ms-fluent/Arrow Next (MIT)" }
  - { key: TAB, mods: [CTRL, SHIFT], icon: prevtab.png, label: "Previous tab", source: "ms-fluent/Arrow Previous (MIT)" }
  - { key: F, mods: [ALT],       icon: filepanel.png, label: "File panel", source: "ms-fluent/Navigation (MIT)", except: [macos] }
  - { key: F, mods: [CTRL, ALT], icon: filepanel.png, label: "File panel", source: "ms-fluent/Navigation (MIT)", only: [macos] }
  - { key: F1, mods: [], icon: help.png, label: Help, source: "ms-fluent/Question Circle (MIT)" }
  - { key: "0", mods: [CMDCTRL], icon: zoomreset.png, label: "Zoom 100%", source: "ms-fluent/Ratio One To One (MIT)" }
  - { key: EQUAL, mods: [CMDCTRL], icon: zoomin.png,  label: "Zoom in",  source: "ms-fluent/Zoom In (MIT)" }
  - { key: MINUS, mods: [CMDCTRL], icon: zoomout.png, label: "Zoom out", source: "ms-fluent/Zoom Out (MIT)" }

  # --- edit ---
  - { key: Z, mods: [CMDCTRL], icon: undo.png,  label: Undo,  source: "ms-fluent/Arrow Undo (MIT), from word/" }
  - { key: Y, mods: [CMDCTRL], icon: redo.png,  label: Redo,  source: "ms-fluent/Arrow Redo (MIT), from word/" }
  - { key: X, mods: [CMDCTRL], icon: cut.png,   label: Cut,   source: "ms-fluent/Cut (MIT), from word/" }
  - { key: C, mods: [CMDCTRL], icon: copy.png,  label: Copy,  source: "ms-fluent/Copy (MIT), from word/" }
  - { key: V, mods: [CMDCTRL], icon: paste.png, label: Paste, source: "ms-fluent/Clipboard Paste (MIT), from word/" }
  - { key: A, mods: [CMDCTRL], icon: selectall.png, label: "Select all", source: "ms-fluent/Select All On (MIT), from word/" }
  - { key: F, mods: [CMDCTRL], icon: find.png,    label: Find,             source: "ms-fluent/Search (MIT), from word/" }
  - { key: H, mods: [CTRL],    icon: replace.png, label: "Find & replace", source: "ms-fluent/Arrow Swap (MIT), from word/" }
  - { key: K, mods: [CMDCTRL], icon: hyperlink.png, label: Hyperlink, source: "ms-fluent/Link (MIT), from word/" }
  - { key: F2, mods: [], icon: edit.png, label: "Edit cell", source: "ms-fluent/Edit (MIT), from excel/" }

  # --- comments ---
  - { key: H, mods: [CMDCTRL, SHIFT], icon: comments.png, label: Comments, source: "ms-fluent/Comment Multiple (MIT)" }
  - { key: H, mods: [ALT],       icon: addcomment.png, label: "Add comment", source: "ms-fluent/Comment Add (MIT)", except: [macos] }
  - { key: A, mods: [GUI, ALT],  icon: addcomment.png, label: "Add comment", source: "ms-fluent/Comment Add (MIT)", only: [macos] }

  # --- formatting ---
  - { key: B, mods: [CMDCTRL], icon: bold.png,      label: Bold,      source: "ms-fluent/Text Bold (MIT), from word/" }
  - { key: I, mods: [CMDCTRL], icon: italic.png,    label: Italic,    source: "ms-fluent/Text Italic (MIT), from word/" }
  - { key: U, mods: [CMDCTRL], icon: underline.png, label: Underline, source: "ms-fluent/Text Underline (MIT), from word/" }
  - { key: "5", mods: [CMDCTRL], icon: strike.png, label: Strikeout, source: "ms-fluent/Text Strikethrough (MIT), from excel/" }
  - { key: "1", mods: [CMDCTRL], icon: formatcells.png, label: "Number format", source: "ms-fluent/Table Settings (MIT), from excel/" }
  - { key: GRAVE, mods: [CTRL, SHIFT], icon: fmtgeneral.png,  label: "General format",     mode: alpha, source: "drawn text, DejaVu Sans Bold" }
  - { key: "4",   mods: [CTRL, SHIFT], icon: fmtcurrency.png, label: "Currency format",    mode: alpha, source: "drawn text, DejaVu Sans Bold" }
  - { key: "5",   mods: [CTRL, SHIFT], icon: fmtpercent.png,  label: "Percentage format",  mode: alpha, source: "drawn text, DejaVu Sans Bold" }
  - { key: "6",   mods: [CTRL, SHIFT], icon: fmtexp.png,      label: "Exponential format", mode: alpha, source: "drawn text, DejaVu Sans Bold" }
  - { key: "3",   mods: [CTRL, SHIFT], icon: fmtdate.png,     label: "Date format",        mode: alpha, source: "drawn text, DejaVu Sans Bold" }
  - { key: "2",   mods: [CTRL, SHIFT], icon: fmttime.png,     label: "Time format",        mode: alpha, source: "drawn text, DejaVu Sans Bold" }
  - { key: "1",   mods: [CTRL, SHIFT], icon: fmtnumber.png,   label: "Number format 0.00", mode: alpha, source: "drawn text, DejaVu Sans Bold" }

  # --- filter and tables ---
  - { key: L, mods: [CMDCTRL, SHIFT], icon: filter.png, label: Filter, source: "ms-fluent/Filter (MIT), from excel/" }
  - { key: DOWN, mods: [ALT], icon: dropdown.png, label: "Drop-down list", source: "ms-fluent/Chevron Circle Down (MIT)" }
  - { key: L, mods: [CMDCTRL], icon: table.png, label: "Format as table", source: "ms-fluent/Table (MIT), from excel/" }
  - { key: R, mods: [CMDCTRL, SHIFT], icon: summaryrow.png, label: "Summary row", source: "ms-fluent/Table Bottom Row (MIT)" }
  - { key: F5, mods: [ALT],       icon: pivot.png, label: "Update pivot table", source: "ms-fluent/Table Lightning (MIT)" }
  - { key: F5, mods: [CTRL, ALT], icon: pivotall.png, label: "Update all pivots", source: "ms-fluent/Arrow Sync Circle (MIT)" }

  # --- data entry ---
  - { key: ENTER, mods: [CTRL], icon: fillrange.png,   label: "Fill range",    source: "ms-fluent/Paint Bucket (MIT)" }
  - { key: ENTER, mods: [ALT],  icon: cellnewline.png, label: "New line in cell", source: "ms-fluent/Text Wrap (MIT)" }
  - { key: EQUAL, mods: [CMDCTRL, SHIFT], icon: insertcells.png, label: "Insert cells", source: "ms-fluent/Table Add (MIT), from wps/" }
  - { key: MINUS, mods: [CMDCTRL, SHIFT], icon: delcells.png,    label: "Delete cells", source: "ms-fluent/Table Delete Row (MIT), from excel/" }
  - { key: ";", mods: [CMDCTRL],        icon: date.png, label: "Insert date", source: "ms-fluent/Calendar Today (MIT), from wps/" }
  - { key: ";", mods: [CMDCTRL, SHIFT], icon: time.png, label: "Insert time", source: "ms-fluent/Clock (MIT), from wps/" }

  # --- functions ---
  - { key: F3, mods: [SHIFT], icon: function.png, label: "Insert function", source: "material-symbols/function (Apache-2.0)" }
  - { key: EQUAL, mods: [ALT],       icon: sigma.png, label: AutoSum, mode: alpha, source: "drawn text, DejaVu Sans Bold", except: [macos] }
  - { key: EQUAL, mods: [CTRL, ALT], icon: sigma.png, label: AutoSum, mode: alpha, source: "drawn text, DejaVu Sans Bold", only: [macos] }
  - { key: F9, mods: [],      icon: calc.png,        label: Recalculate,    source: "ms-fluent/Calculator (MIT), from excel/" }
  - { key: F9, mods: [SHIFT], icon: recalcsheet.png, label: "Recalc sheet", source: "ms-fluent/Arrow Sync (MIT)" }
  - { key: GRAVE, mods: [CTRL], icon: showformulas.png, label: "Show formulas", mode: alpha, source: "drawn text, DejaVu Sans Bold" }
  - { key: F4, mods: [], icon: absref.png, label: "Reference type", source: "ms-fluent/Lock Closed (MIT), from excel/" }
