# FS-UAE shortcut overlay for PolyKybd. See SOURCES.md.
#
# Keys are FS-UAE's default shortcuts, from the table in src/fs-uae/keyboard.c
# of the v3.2.35 release, checked against docs/keyboard-shortcuts.md. Most use
# the modifier key "Mod": left Alt on Windows and Linux, Command on macOS
# (initialize_modifier_key in libfsemu/src/emu/input.c), so each Mod binding is
# written twice, with `except: [macos]` and `only: [macos]`. F11, F12, Pause,
# Print Screen and Ctrl+F10 need no Mod.
#
# Not drawn: Mod+X (an undocumented developer function), Mod+Tab (switch
# window; Windows takes Alt+Tab itself), Mod+arrow keys (the Amiga cursor keys
# while joystick emulation is on; the keycap already shows the arrow), Ctrl+F9
# (benchmark), and the media keys (disk swapper, volume), which have no keycap
# cell. Every shortcut can be changed through the keyboard_key_* options.
#
# Regenerate:
#   PYTHONPATH=. .venv/bin/python polyhost/res/overlay_sources/fs_uae/fetch_icons.py
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/fs_uae/fs_uae.yaml --preview /tmp/fs_uae_preview
app: fs-uae
match: [fs-uae]
output: fs_uae_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: alpha
threshold: 128

program_icon: fs-uae.png
program_icon_mode: alpha
program_icon_region: [37, 32]
program_icon_anchor: right
program_icon_margin: 0

bindings:
  - { key: A, mods: [ALT], icon: stretch.png, label: "Cycle stretch mode", except: [macos] }
  - { key: A, mods: [GUI], icon: stretch.png, label: "Cycle stretch mode", only: [macos] }
  - { key: B, mods: [ALT], icon: border.png, label: "Zoom border", except: [macos] }
  - { key: B, mods: [GUI], icon: border.png, label: "Zoom border", only: [macos] }
  - { key: C, mods: [ALT], icon: freeze.png, label: "Cartridge freeze", except: [macos] }
  - { key: C, mods: [GUI], icon: freeze.png, label: "Cartridge freeze", only: [macos] }
  - { key: D, mods: [ALT], icon: debugger.png, label: "Debugger", except: [macos] }
  - { key: D, mods: [GUI], icon: debugger.png, label: "Debugger", only: [macos] }
  - { key: F, mods: [ALT], icon: fullscreen.png, label: "Full screen", except: [macos] }
  - { key: F, mods: [GUI], icon: fullscreen.png, label: "Full screen", only: [macos] }
  - { key: ENTER, mods: [ALT], icon: fullscreen.png, label: "Full screen", except: [macos] }
  - { key: ENTER, mods: [GUI], icon: fullscreen.png, label: "Full screen", only: [macos] }
  - { key: G, mods: [ALT], icon: grab.png, label: "Grab input", except: [macos] }
  - { key: G, mods: [GUI], icon: grab.png, label: "Grab input", only: [macos] }
  - { key: K, mods: [ALT], icon: keyboard.png, label: "Full keyboard emulation", except: [macos] }
  - { key: K, mods: [GUI], icon: keyboard.png, label: "Full keyboard emulation", only: [macos] }
  - { key: M, mods: [ALT], icon: mute.png, label: "Mute", except: [macos] }
  - { key: M, mods: [GUI], icon: mute.png, label: "Mute", only: [macos] }
  - { key: N, mods: [ALT], icon: floppymute.png, label: "Mute floppy sounds", except: [macos] }
  - { key: N, mods: [GUI], icon: floppymute.png, label: "Mute floppy sounds", only: [macos] }
  - { key: P, mods: [ALT], icon: pause.png, label: "Pause", except: [macos] }
  - { key: P, mods: [GUI], icon: pause.png, label: "Pause", only: [macos] }
  - { key: Q, mods: [ALT], icon: quit.png, label: "Quit", except: [macos] }
  - { key: Q, mods: [GUI], icon: quit.png, label: "Quit", only: [macos] }
  - { key: F4, mods: [ALT], icon: quit.png, label: "Quit", except: [macos] }
  - { key: F4, mods: [GUI], icon: quit.png, label: "Quit", only: [macos] }
  - { key: R, mods: [ALT], icon: softreset.png, label: "Soft reset", except: [macos] }
  - { key: R, mods: [GUI], icon: softreset.png, label: "Soft reset", only: [macos] }
  - { key: T, mods: [ALT], icon: hardreset.png, label: "Hard reset", except: [macos] }
  - { key: T, mods: [GUI], icon: hardreset.png, label: "Hard reset", only: [macos] }
  - { key: S, mods: [ALT], icon: screenshot.png, label: "Screenshot", except: [macos] }
  - { key: S, mods: [GUI], icon: screenshot.png, label: "Screenshot", only: [macos] }
  - { key: Z, mods: [ALT], icon: zoom.png, label: "Cycle zoom", except: [macos] }
  - { key: Z, mods: [GUI], icon: zoom.png, label: "Cycle zoom", only: [macos] }
  - { key: W, mods: [ALT], icon: warp.png, label: "Warp mode", except: [macos] }
  - { key: W, mods: [GUI], icon: warp.png, label: "Warp mode", only: [macos] }
  - { key: COMMA, mods: [ALT], icon: voldown.png, label: "Volume down", except: [macos] }
  - { key: COMMA, mods: [GUI], icon: voldown.png, label: "Volume down", only: [macos] }
  - { key: DOT, mods: [ALT], icon: volup.png, label: "Volume up", except: [macos] }
  - { key: DOT, mods: [GUI], icon: volup.png, label: "Volume up", only: [macos] }
  - { key: F11, mods: [], icon: autozoom.png, label: "Auto zoom" }
  - { key: F12, mods: [], icon: menu.png, label: "Menu" }
  - { key: PAUSE, mods: [], icon: pause.png, label: "Pause" }
  - { key: PSCR, mods: [], icon: screenshot.png, label: "Screenshot" }
  - { key: F10, mods: [CTRL], icon: perf.png, label: "Performance graphs" }
