# FL Studio shortcut overlays for PolyKybd (Windows and macOS; FL Studio has no
# Linux version).
#
# Shortcuts: Image-Line's online manual, "Keyboard & Mouse Shortcuts". FL on
# macOS maps Ctrl to Cmd and Alt to Option, so:
#   CMDCTRL          Ctrl on Windows, Cmd on macOS.
#   ALT              Alt on Windows, Option on macOS (the same key).
#   except: [macos]  keys macOS takes for itself (Cmd+Space Spotlight, Cmd+H
#                    Hide, Cmd+M Minimize).
#
# ⚠️ Most FL keys depend on which FL window has focus (Playlist, Piano roll,
# Channel Rack, Mixer), and those windows are inside one OS window, so the host
# cannot tell them apart. This set has the global keys, the window keys, and
# the tool and edit keys the Playlist and the Piano roll share. Single-key
# shortcuts do nothing while "Typing keyboard to piano" (Ctrl+T) is on. See
# SOURCES.md.
#
# Regenerate:
#   python polyhost/res/overlay_sources/flstudio/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/flstudio/bindings.yaml --preview /tmp/fl_preview
app: flstudio
match: [fl64, fl studio 2024, fl studio 2025, fl studio 2026, osxfl]
output: flstudio_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

bindings:
  # --- file and export (any window) ---
  - { key: O, mods: [CMDCTRL], label: Open }
  - { key: S, mods: [CMDCTRL], label: Save }
  - { key: S, mods: [CMDCTRL, SHIFT], label: "Save as" }
  - { key: N, mods: [CMDCTRL], icon: savenew.png, label: "Save new version" }
  - { key: R, mods: [CMDCTRL], icon: exportwav.png, label: "Export wave" }
  - { key: R, mods: [CMDCTRL, SHIFT], icon: exportmp3.png, label: "Export mp3" }
  - { key: M, mods: [CMDCTRL, SHIFT], icon: exportmidi.png, label: "Export MIDI" }
  - { key: Z, mods: [CMDCTRL], label: Undo }
  - { key: Z, mods: [CMDCTRL, ALT], icon: undosteps.png, label: "Undo step by step" }

  # --- transport and recording (any window) ---
  - { key: SPACE, mods: [], icon: playstop.png, label: "Play/stop" }
  - { key: SPACE, mods: [CTRL], icon: pause.png, label: "Play/pause", except: [macos] }
  - { key: L, mods: [], icon: songmode.png, label: "Pattern/song mode" }
  - { key: R, mods: [], icon: record.png, label: Record }
  - { key: BSPC, mods: [], icon: snap.png, label: "Toggle snap" }
  - { key: E, mods: [CMDCTRL], icon: stepedit.png, label: "Step edit" }
  - { key: H, mods: [CTRL], icon: panic.png, label: "Panic (stop sound)", except: [macos] }
  - { key: I, mods: [CMDCTRL], icon: waitinput.png, label: "Wait for input to record" }
  - { key: M, mods: [CTRL], icon: metronome.png, label: Metronome, except: [macos] }
  - { key: T, mods: [CMDCTRL], icon: typingpiano.png, label: "Typing keyboard to piano" }
  - { key: HOME, mods: [], icon: tohome.png, label: "Playhead to start" }

  # --- windows (any window) ---
  - { key: ENTER, mods: [], icon: maxplaylist.png, label: "Playlist maximize" }
  - { key: TAB, mods: [], icon: cyclewin.png, label: "Cycle windows" }
  - { key: F1, mods: [], icon: help.png, label: Help }
  - { key: F2, mods: [], icon: rename.png, label: "Rename pattern" }
  - { key: F4, mods: [], icon: emptypattern.png, label: "Next empty pattern" }
  - { key: F5, mods: [], icon: playlist.png, label: Playlist }
  - { key: F6, mods: [], icon: channelrack.png, label: "Channel rack" }
  - { key: F7, mods: [], icon: pianoroll.png, label: "Piano roll" }
  - { key: F7, mods: [ALT], icon: touch.png, label: "Touch controllers" }
  - { key: F8, mods: [], icon: pluginpicker.png, label: "Plugin picker" }
  - { key: F8, mods: [ALT], icon: browser.png, label: Browser }
  - { key: F8, mods: [CMDCTRL], icon: projectpicker.png, label: "Project picker" }
  - { key: F9, mods: [], icon: mixer.png, label: Mixer }
  - { key: F10, mods: [], icon: midisettings.png, label: "MIDI settings" }
  - { key: F11, mods: [], icon: songinfo.png, label: "Song info" }
  - { key: F12, mods: [], icon: closeall.png, label: "Close all windows" }
  - { key: H, mods: [CMDCTRL, SHIFT], icon: arrange.png, label: "Arrange windows" }

  # --- Playlist and Piano roll: tools ---
  - { key: P, mods: [], icon: draw.png, label: "Draw tool" }
  - { key: B, mods: [], icon: paint.png, label: "Paint tool" }
  - { key: D, mods: [], icon: deltool.png, label: "Delete tool" }
  - { key: T, mods: [], icon: mutetool.png, label: "Mute tool" }
  - { key: C, mods: [], icon: slice.png, label: "Slice tool" }
  - { key: E, mods: [], icon: select.png, label: "Select tool" }
  - { key: Z, mods: [], icon: zoomtool.png, label: "Zoom tool" }
  - { key: Y, mods: [], icon: playtool.png, label: "Playback tool" }

  # --- Playlist and Piano roll: edit ---
  - { key: A, mods: [CMDCTRL], label: "Select all" }
  - { key: D, mods: [CMDCTRL], icon: deselect.png, label: Deselect }
  - { key: C, mods: [CMDCTRL], label: Copy }
  - { key: X, mods: [CMDCTRL], label: Cut }
  - { key: V, mods: [CMDCTRL], label: Paste }
  - { key: B, mods: [CMDCTRL], icon: duplicate.png, label: Duplicate }
  - { key: DEL, mods: [], label: Delete }
  - { key: DEL, mods: [CMDCTRL], icon: delspace.png, label: "Delete space" }
  - { key: INSERT, mods: [CTRL], icon: insspace.png, label: "Insert space", except: [macos] }
  - { key: I, mods: [SHIFT], icon: invert.png, label: "Invert selection" }
  - { key: G, mods: [SHIFT], icon: group.png, label: Group }
  - { key: G, mods: [ALT], icon: ungroup.png, label: Ungroup }
  - { key: M, mods: [ALT], icon: mutesel.png, label: "Mute selection" }
  - { key: M, mods: [ALT, SHIFT], icon: unmutesel.png, label: "Unmute selection" }
  - { key: PGUP, mods: [], icon: zoomin.png, label: "Zoom in" }
  - { key: PGDN, mods: [], icon: zoomout.png, label: "Zoom out" }
  - { key: "0", mods: [SHIFT], icon: centerplay.png, label: "Center on playhead" }
  - { key: "4", mods: [SHIFT], icon: showall.png, label: "Show all" }
  - { key: "5", mods: [SHIFT], icon: zoomsel.png, label: "Zoom to selection" }
