# GENERATED by gen_mods.py from openra_ra.yaml -- edit that file, not this one.
# OpenRA, Dune 2000 mod.
# OpenRA overlay for PolyKybd: the Red Alert mod. gen_mods.py writes the
# Tiberian Dawn and Dune 2000 copies (openra_cnc.yaml, openra_d2k.yaml) from
# this file; edit this one.
#
# Keys: OpenRA's defaults, from mods/common/hotkeys/*.yaml in the OpenRA
# repository, which all mods share, and the mod's own mods/<mod>/hotkeys.yaml
# (production tabs, power down). Unlike the original games, OpenRA's letter
# orders (A attack move, S stop, D guard, F deploy) do not change with the
# selection, so they are labelled. See SOURCES.md.
#
# Regenerate:
#   python polyhost/res/overlay_sources/openra/fetch_icons.py
#   python polyhost/res/overlay_sources/openra/gen_mods.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/openra/openra_ra.yaml --preview /tmp/openra_preview
app: openra_d2k
match: [openra]
output: openra_d2k_template
icon_dir: icons
fit: contain
mode: alpha
threshold: 150
# As for C&C: the icon uses the full height on the right; the firmware clears
# 3 px around it, so a letter legend stays whole.
anchor: right
region: [40, 40]
margin: 0

# The mod's logo and name over the whole cell, without the ESC legend (protocol v25).
program_icon: program_d2k.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0
program_icon_legend: false

bindings:

