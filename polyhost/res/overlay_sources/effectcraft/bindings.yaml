# EffectCraft shortcut overlays for PolyKybd.
#
# EffectCraft (storytold/effectcraft, MIT OR Apache-2.0) is the ArtCraft suite's
# After Effects-like motion graphics / VFX compositor. Shortcuts are ITS default
# preset ("EffectCraft Default"), read from the source at commit
# 549e9d825132986d6167c1432cd3328efcbb0278 -- the engine menu tree + command
# registry (crates/engine/src/menus.rs, commands/*) resolved through
# crates/engine/src/shortcuts.rs::bindables, plus the frontend's UI_COMMANDS
# (crates/ui-egui/src/menus.rs:29-128). See SOURCES.md for file:line per group.
#
# EffectCraft writes `Cmd` for egui's COMMAND modifier (Ctrl on Windows/Linux,
# Cmd on macOS; shortcuts.rs:11), so every such chord is CMDCTRL here and the
# generator emits effectcraft_template.* and effectcraft_template_mac.*. The
# default preset binds no literal-Ctrl chord. Two chords are scoped off macOS,
# where the native app menu's predefined Hide (Cmd+H) / Hide Others (Cmd+Alt+H)
# items take them (crates/ui-egui/src/native_menu.rs:185, apps/effectcraft/src/
# native_menu.rs:117-118).
#
# Icons: aftereffects/ reference icons (copied byte-identical where the action
# matches), Microsoft Fluent UI System Icons (MIT), Material Symbols (Apache-2.0),
# a few drawn text badges. Program mark: EffectCraft's own icon (MIT OR Apache-2.0).
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/effectcraft/fetch_icons.py
#   PYTHONPATH=. python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/effectcraft/bindings.yaml --preview /tmp/ec_preview
app: effectcraft
# effectcraft.exe (Windows), "EffectCraft" (macOS bundle name, X11 process name),
# ai.storyteller.effectcraft (Wayland app id / StartupWMClass, GNOME wm_class).
match: [effectcraft, ai.storyteller.effectcraft]
output: effectcraft_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

# Own icon, 48px ICO frame. Sweep (frames 32..256 x luma/bright x t60..210, through
# the generator's own render_icon): luma lights the pink field as a solid tile at t>=110
# and loses the head below; bright t130 on the 48px frame lights the paper-coloured
# unicorn head + horn most solidly (64+ frames are near-identical, sparser at t>=150).
program_icon: effectcraft.png
program_icon_mode: bright
program_icon_threshold: 130
program_icon_anchor: right
program_icon_region: [40, 40]
program_icon_margin: 0

