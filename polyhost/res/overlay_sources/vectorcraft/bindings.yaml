# VectorCraft shortcut overlays for PolyKybd.
#
# VectorCraft (storytold/vectorcraft, MIT OR Apache-2.0) is the ArtCraft suite's
# Illustrator-like vector editor (Rust/egui). Its keymap imitates Illustrator's but
# is its OWN: every chord here comes from the app's source at the commit pinned in
# SOURCES.md (engine `cmd!` specs, `menus::UI_COMMANDS`, `PANEL_SHORTCUTS`, the
# tool catalogue, and the hard-wired keys in `shortcuts::handle`). Both shipped
# presets ("VectorCraft Defaults", "Classic Defaults") are the empty override map,
# so there is one default keymap.
#
# Icons: the Illustrator overlay's glyphs where the action is the same (borrowed,
# so both overlays draw the same cell), VectorCraft's own toolbar/panel icons for
# its tools and panels, Fluent (MIT) / Material Symbols (Apache-2.0) for the rest,
# and a few badge composites (fetch_icons.py). Program mark (ESC): the app's own
# dragon icon reduced to its silhouette.
#
# ONE spec, TWO artwork sets. VectorCraft writes every command chord as `Cmd+…`,
# parsed to egui `Modifiers::COMMAND` (Ctrl on Windows/Linux, Cmd on macOS), so
# each is CMDCTRL here and the generator also emits vectorcraft_template_mac.*.
# No chord is literal Ctrl. The one macOS-only chord (Cmd+, Settings) is scoped
# with `only: [macos]`. macOS notes are in SOURCES.md.
#
# A key's no-mod TOOL letter and its Cmd MENU meaning coexist on the same cell in
# different channels - correct and intended.
#
# Regenerate:
#   PYTHONPATH=. .venv/bin/python polyhost/res/overlay_sources/vectorcraft/fetch_icons.py
#   PYTHONPATH=. .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/vectorcraft/bindings.yaml --preview /tmp/vectorcraft_preview
app: vectorcraft
match: [vectorcraft, ai.storyteller.vectorcraft]   # Windows vectorcraft.exe, macOS "VectorCraft", Linux app id / WM_CLASS ai.storyteller.vectorcraft
output: vectorcraft_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: vectorcraft.png
program_icon_mode: alpha
program_icon_anchor: bottom-right
program_icon_region: [40, 40]
program_icon_margin: 0

bindings:
  # ===== Tools: single key, no modifier (crates/tools/src/catalog.rs) =====
