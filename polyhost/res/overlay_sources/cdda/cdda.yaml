  - { key: V, icon: insert.png, label: "Insert an item into a container" }
  - { key: T, icon: throw.png, label: "Throw an item" }
  - { key: F, icon: fire.png, label: "Fire the wielded item" }
  - { key: R, icon: reload.png, label: "Reload an item" }
  - { key: D, icon: drop.png, label: "Drop an item" }
  - { key: F3, icon: defaultammo.png, label: "Select the default ammunition", region: [34, 40] }
