# Cataclysm: Dark Days Ahead overlay for PolyKybd.
#
# Keys: the default bindings in data/raw/keybindings.json of
# CleverRaven/Cataclysm-DDA, stable tag cdda-0.I-2026-09-19-2324: the
# DEFAULTMODE category (the main game screen) and the movement keys of the
# global category. See SOURCES.md.
#
# The game gives a lower-case and an upper-case letter different commands, so
# the plain and the Shift layer are drawn. No main-screen command uses Ctrl or
# Alt. The Shift layer's symbol keys follow the US layout, which the file
# itself names (`"mod": ["shift"], "key": "7"` beside `&`).
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/cdda/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/cdda/cdda.yaml --preview /tmp/cdda_preview
app: cdda
match: [cataclysm-tiles, cataclysm-tiles.exe, org.cataclysmdda.CataclysmDDA]
output: cdda_template
icon_dir: icons
fit: contain
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150
# As for fheroes2: the icon uses the full height on the right; the firmware
# clears 3 px around it, so a letter legend stays whole.
anchor: right
region: [40, 40]
margin: 0

# "Cataclysm" over "DDA" drawn over the whole cell, without the ESC legend
# (protocol v25).
program_icon: program.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0
program_icon_legend: false

bindings:

  # --- Plain keys ---------------------------------------------------------
  # Movement: the vi keys and the digit row
  - { key: H, icon: move_w.png, label: "Move west" }
  - { key: J, icon: move_s.png, label: "Move south" }
  - { key: K, icon: move_n.png, label: "Move north" }
  - { key: L, icon: move_e.png, label: "Move east" }
  - { key: Y, icon: move_nw.png, label: "Move north-west" }
  - { key: U, icon: move_ne.png, label: "Move north-east" }
  - { key: B, icon: move_sw.png, label: "Move south-west" }
  - { key: N, icon: move_se.png, label: "Move south-east" }
  - { key: 1, icon: move_sw.png, label: "Move south-west" }
  - { key: 2, icon: move_s.png, label: "Move south" }
  - { key: 3, icon: move_se.png, label: "Move south-east" }
  - { key: 4, icon: move_w.png, label: "Move west" }
  - { key: 6, icon: move_e.png, label: "Move east" }
  - { key: 7, icon: move_nw.png, label: "Move north-west" }
  - { key: 8, icon: move_n.png, label: "Move north" }
  - { key: 9, icon: move_ne.png, label: "Move north-east" }
  - { key: 5, icon: pause.png, label: "Wait one turn" }
  - { key: DOT, icon: pause.png, label: "Wait one turn" }
  - { key: TAB, icon: autoattack.png, label: "Attack the nearest enemy" }
  # The surroundings
