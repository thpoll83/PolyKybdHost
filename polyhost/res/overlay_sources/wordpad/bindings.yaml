# WordPad shortcut overlays for PolyKybd.
#
# ⚠️ WordPad is CLOSED SOURCE and was REMOVED from Windows in 24H2, so this
# overlay only ever fires on a machine that still has it. Kept because plenty of
# machines do. Every binding is one TWO independent references agree on;
# single-source claims are in SOURCES.md as unverified rather than guessed at.
#
# Icons: Microsoft Fluent UI System Icons (MIT), reusing the `word` overlay's
# glyphs where the action matches so the two rich-text editors read alike.
# Program mark (ESC, all layers): the shared license-clean letter tile.
#
# Regenerate:
#   python polyhost/res/overlay_sources/wordpad/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/wordpad/bindings.yaml --preview /tmp/wordpad_preview
app: wordpad
match: [wordpad]
output: wordpad_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: wordpad.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [42, 34]
program_icon_margin: 0

bindings:
  # --- Ctrl: file (primary R channel) -----------------------------------
  - { key: N, mods: [CTRL], icon: new.png,   label: New,   source: "ms-fluent/Document Add (MIT)" }
  - { key: O, mods: [CTRL], icon: open.png,  label: Open,  source: "ms-fluent/Folder Open (MIT)" }
  - { key: S, mods: [CTRL], icon: save.png,  label: Save,  source: "ms-fluent/Save (MIT)" }
  - { key: P, mods: [CTRL], icon: print.png, label: Print, source: "ms-fluent/Print (MIT)" }

  # --- Ctrl: edit -------------------------------------------------------
  - { key: Z, mods: [CTRL], icon: undo.png,      label: Undo,         source: "ms-fluent/Arrow Undo (MIT)" }
  - { key: Y, mods: [CTRL], icon: redo.png,      label: Redo,         source: "ms-fluent/Arrow Redo (MIT)" }
  - { key: X, mods: [CTRL], icon: cut.png,       label: Cut,          source: "ms-fluent/Cut (MIT)" }
  - { key: C, mods: [CTRL], icon: copy.png,      label: Copy,         source: "ms-fluent/Copy (MIT)" }
  - { key: V, mods: [CTRL], icon: paste.png,     label: Paste,        source: "ms-fluent/Clipboard Paste (MIT)" }
  - { key: A, mods: [CTRL], icon: selectall.png, label: "Select all", source: "ms-fluent/Select All On (MIT)" }
  - { key: F, mods: [CTRL], icon: find.png,      label: Find,         source: "ms-fluent/Search (MIT)" }
  - { key: H, mods: [CTRL], icon: replace.png,   label: Replace,      source: "ms-fluent/Arrow Swap (MIT)" }

  # --- Ctrl: character formatting ---------------------------------------
  - { key: B, mods: [CTRL], icon: bold.png,      label: Bold,      source: "ms-fluent/Text Bold (MIT)" }
  - { key: I, mods: [CTRL], icon: italic.png,    label: Italic,    source: "ms-fluent/Text Italic (MIT)" }
  - { key: U, mods: [CTRL], icon: underline.png, label: Underline, source: "ms-fluent/Text Underline (MIT)" }
  - { key: EQUAL, mods: [CTRL], icon: subscript.png, label: Subscript, source: "ms-fluent/Text Subscript (MIT)" }

  # --- Ctrl: paragraph --------------------------------------------------
  # ⚠️ NOT the obvious meanings: in WordPad Ctrl+E is centre (not "search"),
  # Ctrl+R is right-align (not "reload"), Ctrl+J is justify, Ctrl+L is left.
  - { key: L, mods: [CTRL], icon: alignleft.png,   label: "Align left",   source: "ms-fluent/Text Align Left (MIT)" }
  - { key: E, mods: [CTRL], icon: aligncenter.png, label: "Align centre", source: "ms-fluent/Text Align Center (MIT)" }
  - { key: R, mods: [CTRL], icon: alignright.png,  label: "Align right",  source: "ms-fluent/Text Align Right (MIT)" }
  - { key: J, mods: [CTRL], icon: justify.png,     label: Justify,        source: "ms-fluent/Text Align Justify (MIT)" }
  - { key: "1", mods: [CTRL], icon: linespacing1.png, mode: alpha, region: [38, 34],  label: "Single spacing", source: "ms-fluent/Text Line Spacing + '1' (MIT)" }
  - { key: "5", mods: [CTRL], icon: linespacing15.png, mode: alpha, region: [38, 34], label: "1.5 spacing",    source: "ms-fluent/Text Line Spacing + '1½' (MIT)" }
  - { key: "2", mods: [CTRL], icon: linespacing2.png, mode: alpha, region: [38, 34],  label: "Double spacing", source: "ms-fluent/Text Line Spacing + '2' (MIT)" }

  # --- Ctrl: insert & navigation ----------------------------------------
  - { key: D,     mods: [CTRL], icon: drawing.png,   label: "Insert Paint drawing", source: "ms-fluent/Paint Brush (MIT)" }
  - { key: HOME,  mods: [CTRL], icon: doctop.png,    label: "Top of document",  source: "ms-fluent/Arrow Upload (MIT)" }
  - { key: END,   mods: [CTRL], icon: docend.png,    label: "End of document",  source: "ms-fluent/Arrow Download (MIT)" }
  - { key: LEFT,  mods: [CTRL], icon: wordleft.png,  label: "Word left",  source: "ms-fluent/Arrow Previous (MIT)" }
  - { key: RIGHT, mods: [CTRL], icon: wordright.png, label: "Word right", source: "ms-fluent/Arrow Next (MIT)" }

  # --- no modifier (primary A channel) ----------------------------------
  - { key: F3,  mods: [], icon: findnext.png, label: "Find next", source: "ms-fluent/Chevron Right (MIT)" }
  - { key: F12, mods: [], icon: saveas.png,   label: "Save as",   source: "ms-fluent/Save Edit (MIT)" }

  # --- Ctrl+Shift (combo R channel) -------------------------------------
  - { key: EQUAL,  mods: [CTRL, SHIFT], icon: superscript.png, label: Superscript,    source: "ms-fluent/Text Superscript (MIT)" }
  - { key: A,      mods: [CTRL, SHIFT], icon: allcaps.png,     label: "ALL CAPS",     source: "ms-fluent/Text Case Uppercase (MIT)" }
  - { key: L,      mods: [CTRL, SHIFT], icon: bullets.png,     label: "Bullet style", source: "ms-fluent/Text Bullet List (MIT)" }
  - { key: PERIOD, mods: [CTRL, SHIFT], icon: fontbig.png,     label: "Font bigger",  source: "ms-fluent/Font Increase (MIT)" }
  - { key: COMMA,  mods: [CTRL, SHIFT], icon: fontsmall.png,   label: "Font smaller", source: "ms-fluent/Font Decrease (MIT)" }
