# GitKraken Desktop shortcut overlays for PolyKybd (Windows, Linux and macOS).
# See SOURCES.md.
#
# The keys are GitKraken's help page "Keyboard Shortcuts", checked against the
# menu accelerators in the 12.6.2 app (resources/app.asar). `CMDCTRL` is Ctrl
# on Windows and Linux and Cmd on macOS. A literal Ctrl in the menu (Ctrl+Tab,
# Ctrl+`) is Control on macOS too, so those lines use CTRL.
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/gitkraken/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/gitkraken/bindings.yaml --preview /tmp/gk_preview
app: gitkraken
match: [gitkraken]
output: gitkraken_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: gitkraken.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- application ---
  - { key: SLASH, mods: [CMDCTRL], icon: shortcuts.png, label: "Keyboard shortcuts" }
  - { key: COMMA, mods: [CMDCTRL], label: "Settings" }
  - { key: P, mods: [CMDCTRL], icon: palette.png, label: "Command palette" }
  - { key: F11, mods: [], icon: fullscreen.png, label: "Full screen", except: [macos] }
  - { key: F, mods: [GUI, CTRL], icon: fullscreen.png, label: "Full screen", only: [macos] }
  - { key: EQUAL, mods: [CMDCTRL], label: "Zoom in" }
  - { key: MINUS, mods: [CMDCTRL], label: "Zoom out" }
  - { key: "0", mods: [CMDCTRL], icon: resetzoom.png, label: "Reset zoom" }
  - { key: J, mods: [CMDCTRL], icon: leftpanel.png, label: "Left panel" }
  - { key: K, mods: [CMDCTRL], icon: detailpanel.png, label: "Commit detail panel" }
  - { key: GRAVE, mods: [CTRL], icon: terminalpanel.png, label: "Terminal panel" }
  - { key: I, mods: [CTRL, SHIFT], icon: devtools.png, label: "Developer tools", except: [macos] }
  - { key: I, mods: [ALT, GUI], icon: devtools.png, label: "Developer tools", only: [macos] }
  # --- repositories ---
  - { key: N, mods: [CMDCTRL], icon: clone.png, label: "Clone repository" }
  - { key: I, mods: [CMDCTRL], icon: init.png, label: "Init repository" }
  - { key: O, mods: [CMDCTRL], icon: openrepo.png, label: "Open repository" }
  - { key: O, mods: [CMDCTRL, ALT], icon: repomanagement.png, label: "Repository management" }
  - { key: O, mods: [CMDCTRL, SHIFT], icon: openpalette.png, label: "Open repo in palette" }
  - { key: E, mods: [CMDCTRL, SHIFT], icon: editor.png, label: "Open in external editor" }
  - { key: T, mods: [ALT], icon: terminal.png, label: "Open in terminal" }
  - { key: O, mods: [ALT], icon: filemanager.png, label: "Open in file manager" }
  - { key: L, mods: [CMDCTRL], icon: fetch.png, label: "Fetch all" }
  - { key: B, mods: [CMDCTRL], icon: newbranch.png, label: "Create branch" }
  # --- staging and commits ---
  - { key: S, mods: [], icon: stage.png, label: "Stage file" }
  - { key: U, mods: [], icon: unstage.png, label: "Unstage file" }
  - { key: S, mods: [CMDCTRL, SHIFT], icon: stageall.png, label: "Stage all files" }
  - { key: U, mods: [CMDCTRL, SHIFT], icon: unstageall.png, label: "Unstage all files" }
  - { key: ENTER, mods: [CMDCTRL], icon: commit.png, label: "Commit" }
  - { key: ENTER, mods: [CMDCTRL, SHIFT], icon: stagecommit.png, label: "Stage all and commit" }
  - { key: M, mods: [CMDCTRL, SHIFT], icon: summary.png, label: "Commit message" }
  - { key: D, mods: [CMDCTRL], icon: difftool.png, label: "Diff or merge tool" }
  - { key: Z, mods: [CMDCTRL], label: "Undo" }
  - { key: Y, mods: [CMDCTRL], label: "Redo" }
  - { key: Z, mods: [CMDCTRL, SHIFT], label: "Redo" }
  # --- graph and search ---
  - { key: HOME, mods: [CTRL], icon: firstcommit.png, label: "First commit", except: [macos] }
  - { key: END, mods: [CTRL], icon: lastcommit.png, label: "Last commit", except: [macos] }
  - { key: UP, mods: [GUI], icon: firstcommit.png, label: "First commit", only: [macos] }
  - { key: DOWN, mods: [GUI], icon: lastcommit.png, label: "Last commit", only: [macos] }
  - { key: F, mods: [CMDCTRL], icon: searchcommits.png, label: "Search commits" }
  - { key: H, mods: [CMDCTRL, SHIFT], icon: blame.png, label: "File history and blame" }
  - { key: F, mods: [CMDCTRL, ALT], icon: filter.png, label: "Filter left panel" }
  # --- tabs ---
  - { key: T, mods: [CMDCTRL], icon: newtab.png, label: "New tab" }
  - { key: W, mods: [CMDCTRL], icon: closetab.png, label: "Close tab" }
  - { key: T, mods: [CMDCTRL, SHIFT], icon: reopentab.png, label: "Reopen closed tab" }
  - { key: A, mods: [CMDCTRL, SHIFT], icon: tabslist.png, label: "Tab list" }
  - { key: TAB, mods: [CTRL], icon: nexttab.png, label: "Next tab" }
  - { key: TAB, mods: [CTRL, SHIFT], icon: prevtab.png, label: "Previous tab" }
  - { key: "1", mods: [CMDCTRL], icon: tab1.png, label: "Tab 1" }
  - { key: "2", mods: [CMDCTRL], icon: tab2.png, label: "Tab 2" }
  - { key: "3", mods: [CMDCTRL], icon: tab3.png, label: "Tab 3" }
  - { key: "4", mods: [CMDCTRL], icon: tab4.png, label: "Tab 4" }
  - { key: "5", mods: [CMDCTRL], icon: tab5.png, label: "Tab 5" }
  - { key: "6", mods: [CMDCTRL], icon: tab6.png, label: "Tab 6" }
  - { key: "7", mods: [CMDCTRL], icon: tab7.png, label: "Tab 7" }
  - { key: "8", mods: [CMDCTRL], icon: tab8.png, label: "Tab 8" }
  - { key: "9", mods: [CMDCTRL], icon: tab9.png, label: "Tab 9" }
  # --- favourite repositories (Ctrl+Alt+N; Cmd+Ctrl+N on macOS) ---
  - { key: "1", mods: [CTRL, ALT], icon: fav1.png, label: "Favorite repo 1", except: [macos] }
  - { key: "2", mods: [CTRL, ALT], icon: fav2.png, label: "Favorite repo 2", except: [macos] }
  - { key: "3", mods: [CTRL, ALT], icon: fav3.png, label: "Favorite repo 3", except: [macos] }
  - { key: "4", mods: [CTRL, ALT], icon: fav4.png, label: "Favorite repo 4", except: [macos] }
  - { key: "5", mods: [CTRL, ALT], icon: fav5.png, label: "Favorite repo 5", except: [macos] }
  - { key: "6", mods: [CTRL, ALT], icon: fav6.png, label: "Favorite repo 6", except: [macos] }
  - { key: "7", mods: [CTRL, ALT], icon: fav7.png, label: "Favorite repo 7", except: [macos] }
  - { key: "8", mods: [CTRL, ALT], icon: fav8.png, label: "Favorite repo 8", except: [macos] }
  - { key: "9", mods: [CTRL, ALT], icon: fav9.png, label: "Favorite repo 9", except: [macos] }
  - { key: "1", mods: [GUI, CTRL], icon: fav1.png, label: "Favorite repo 1", only: [macos] }
  - { key: "2", mods: [GUI, CTRL], icon: fav2.png, label: "Favorite repo 2", only: [macos] }
  - { key: "3", mods: [GUI, CTRL], icon: fav3.png, label: "Favorite repo 3", only: [macos] }
  - { key: "4", mods: [GUI, CTRL], icon: fav4.png, label: "Favorite repo 4", only: [macos] }
  - { key: "5", mods: [GUI, CTRL], icon: fav5.png, label: "Favorite repo 5", only: [macos] }
  - { key: "6", mods: [GUI, CTRL], icon: fav6.png, label: "Favorite repo 6", only: [macos] }
  - { key: "7", mods: [GUI, CTRL], icon: fav7.png, label: "Favorite repo 7", only: [macos] }
  - { key: "8", mods: [GUI, CTRL], icon: fav8.png, label: "Favorite repo 8", only: [macos] }
  - { key: "9", mods: [GUI, CTRL], icon: fav9.png, label: "Favorite repo 9", only: [macos] }
