# Command & Conquer Remastered Collection (Steam) overlay for PolyKybd.
#
# Keys: the Remastered Collection default hotkeys. Tiberian Dawn and Red Alert
# share them; Q (queued move) works in Red Alert only. See SOURCES.md.
#
# Only keys that do the same thing whatever is selected are labelled. Mouse
# shortcuts (Ctrl+click force attack, Alt+click force move) have no key cell.
#
# Regenerate:
#   python polyhost/res/overlay_sources/cnc_remastered/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/cnc_remastered/cnc_remastered.yaml \
#       --preview /tmp/cnc_preview
app: cnc_remastered
match: [clientg, clientg.exe, steam_app_1213210]
output: cnc_remastered_template
icon_dir: icons
fit: contain
mode: alpha
threshold: 150
# As for AoE2: the icon uses the full height on the right; the firmware clears
# 3 px around it, so a letter legend stays whole.
anchor: right
region: [40, 40]
margin: 0

# "C&C" drawn over the whole cell, without the ESC legend (protocol v25).
program_icon: program.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0
program_icon_legend: false

bindings:

  # Control groups: digit selects, Ctrl+digit creates
  - { key: "1", icon: group1.png, label: "Select group 1", region: [48, 40], margin: 5 }
  - { key: "2", icon: group2.png, label: "Select group 2", region: [48, 40], margin: 5 }
  - { key: "3", icon: group3.png, label: "Select group 3", region: [48, 40], margin: 5 }
  - { key: "4", icon: group4.png, label: "Select group 4", region: [48, 40], margin: 5 }
  - { key: "5", icon: group5.png, label: "Select group 5", region: [48, 40], margin: 5 }
  - { key: "6", icon: group6.png, label: "Select group 6", region: [48, 40], margin: 5 }
  - { key: "7", icon: group7.png, label: "Select group 7", region: [48, 40], margin: 5 }
  - { key: "8", icon: group8.png, label: "Select group 8", region: [48, 40], margin: 5 }
  - { key: "9", icon: group9.png, label: "Select group 9", region: [48, 40], margin: 5 }
  - { key: "0", icon: group0.png, label: "Select group 0", region: [48, 40], margin: 5 }
  - { key: "1", mods: [CTRL], icon: groupnew1.png, label: "Create group 1", region: [48, 40], margin: 5 }
  - { key: "2", mods: [CTRL], icon: groupnew2.png, label: "Create group 2", region: [48, 40], margin: 5 }
  - { key: "3", mods: [CTRL], icon: groupnew3.png, label: "Create group 3", region: [48, 40], margin: 5 }
  - { key: "4", mods: [CTRL], icon: groupnew4.png, label: "Create group 4", region: [48, 40], margin: 5 }
  - { key: "5", mods: [CTRL], icon: groupnew5.png, label: "Create group 5", region: [48, 40], margin: 5 }
  - { key: "6", mods: [CTRL], icon: groupnew6.png, label: "Create group 6", region: [48, 40], margin: 5 }
  - { key: "7", mods: [CTRL], icon: groupnew7.png, label: "Create group 7", region: [48, 40], margin: 5 }
  - { key: "8", mods: [CTRL], icon: groupnew8.png, label: "Create group 8", region: [48, 40], margin: 5 }
  - { key: "9", mods: [CTRL], icon: groupnew9.png, label: "Create group 9", region: [48, 40], margin: 5 }
  - { key: "0", mods: [CTRL], icon: groupnew0.png, label: "Create group 0", region: [48, 40], margin: 5 }

  # Sidebar tabs
  - { key: W, icon: tabstructures.png, label: "Structures tab" }
  - { key: E, icon: tabinfantry.png, label: "Infantry tab" }
  - { key: R, icon: tabvehicles.png, label: "Vehicles tab" }
  - { key: T, icon: tabsuper.png, label: "Superweapons tab" }

  # Orders and selection
  - { key: S, icon: stop.png, label: "Stop" }
  - { key: X, icon: scatter.png, label: "Scatter" }
  - { key: G, icon: guard.png, label: "Guard area" }
  - { key: Q, icon: queuedmove.png, label: "Queued move (Red Alert)" }
  - { key: A, icon: selectscreen.png, label: "Select all units on screen" }
  - { key: A, mods: [CTRL], icon: selectall.png, label: "Select all units on map" }

  # Camera
  - { key: H, icon: conyard.png, label: "Go to Construction Yard" }
  - { key: TAB, icon: lastevent.png, label: "Go to last event", region: [30, 40] }
  - { key: F1, icon: bookmark.png, label: "Go to bookmark 1", region: [30, 40] }
  - { key: F2, icon: bookmark.png, label: "Go to bookmark 2", region: [30, 40] }
  - { key: F3, icon: bookmark.png, label: "Go to bookmark 3", region: [30, 40] }
  - { key: F4, icon: bookmark.png, label: "Go to bookmark 4", region: [30, 40] }
  - { key: F1, mods: [CTRL], icon: bookmarkset.png, label: "Set bookmark 1", region: [30, 40] }
  - { key: F2, mods: [CTRL], icon: bookmarkset.png, label: "Set bookmark 2", region: [30, 40] }
  - { key: F3, mods: [CTRL], icon: bookmarkset.png, label: "Set bookmark 3", region: [30, 40] }
  - { key: F4, mods: [CTRL], icon: bookmarkset.png, label: "Set bookmark 4", region: [30, 40] }

  # Display
  - { key: SPACE, icon: graphics.png, label: "Classic / remastered graphics" }
  - { key: ENTER, mods: [ALT], icon: fullscreen.png, label: "Full screen / window", region: [30, 40] }
