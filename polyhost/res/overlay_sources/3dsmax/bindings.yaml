# Autodesk 3ds Max shortcut overlays for PolyKybd (Windows only). See SOURCES.md.
#
# The keys are the "Main UI Hotkeys" table of Autodesk's 3ds Max 2026 help
# (Keyboard Shortcut Tables; the default hotkey map since 3ds Max 2020.1). The
# other tables (Edit, Schematic View, Track View, UVW Unwrap, Material Editor,
# ...) apply while that editor has focus and are not drawn. Labels are the
# table's action names, shortened.
#
# Note the 3ds Max defaults that differ from most applications: Ctrl+V is
# Clone, Ctrl+C creates a camera from the view, Ctrl+D is Select None and
# Ctrl+H is Hold.
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/3dsmax/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/3dsmax/bindings.yaml --preview /tmp/3dsmax_preview
app: 3dsmax
match: [3dsmax]
output: 3dsmax_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: 3dsmax.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- no modifier: transform tools and selection ---
