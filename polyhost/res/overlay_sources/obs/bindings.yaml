# OBS Studio shortcut overlays for PolyKybd (Windows, Linux, macOS). See SOURCES.md.
#
# OBS hotkeys (record, stream, switch scene, mute) have no default key: the
# user assigns them in Settings > Hotkeys. So the set shows only the keys OBS
# sets in its own source:
#   * frontend/forms/OBSBasic.ui (Edit menu: copy, paste, transform, order;
#     View menu: fullscreen interface; Del on the scene and source lists);
#   * frontend/widgets/OBSBasic.cpp, OBSBasic::OBSInit (undo, redo, rename,
#     the preview nudge keys, and the per-platform keys below).
#
# Ctrl+S is "Stretch to screen" and Ctrl+F is "Fit to screen"; neither saves or
# searches. Qt writes Ctrl for the Cmd key on macOS, so those keys are CMDCTRL.
# Per platform (OBSBasic.cpp):
#   * Rename is F2 on Windows and Linux, Return on macOS.
#   * Remove is Del everywhere, and also Backspace on macOS.
#   * Exit is Ctrl+Q on Linux only; Windows has no key for it. On macOS OBS
#     deletes its Exit action and Qt's application menu gives Quit Cmd+Q and
#     Settings (PreferencesRole) Cmd+,.
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/obs/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/obs/bindings.yaml --preview /tmp/obs_preview
app: obs
match: [obs, obs64, obs studio, com.obsproject.studio]
output: obs_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: obs.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- edit ---
  - { key: Z, mods: [CMDCTRL], icon: undo.png, label: "Undo" }
  - { key: Y, mods: [CMDCTRL], icon: redo.png, label: "Redo" }
  - { key: Z, mods: [CMDCTRL, SHIFT], icon: redo.png, label: "Redo" }
  - { key: C, mods: [CMDCTRL], icon: copysource.png, label: "Copy source" }
  - { key: V, mods: [CMDCTRL], icon: pasteref.png, label: "Paste reference" }
  - { key: DEL, mods: [], icon: remove.png, label: "Remove" }
  - { key: BSPC, mods: [], icon: remove.png, label: "Remove", only: [macos] }
  - { key: F2, mods: [], icon: rename.png, label: "Rename", except: [macos] }
  - { key: ENTER, mods: [], icon: rename.png, label: "Rename", only: [macos] }

  # --- transform (Edit > Transform) ---
  - { key: E, mods: [CMDCTRL], icon: edittransform.png, label: "Edit transform" }
  - { key: C, mods: [CMDCTRL, SHIFT], icon: copytransform.png, label: "Copy transform" }
  - { key: V, mods: [CMDCTRL, SHIFT], icon: pastetransform.png, label: "Paste transform" }
  - { key: R, mods: [CMDCTRL], icon: resettransform.png, label: "Reset transform" }
  - { key: F, mods: [CMDCTRL], icon: fitscreen.png, label: "Fit to screen" }
  - { key: S, mods: [CMDCTRL], icon: stretchscreen.png, label: "Stretch to screen" }
  - { key: D, mods: [CMDCTRL], icon: centerscreen.png, label: "Center to screen" }

  # --- order (Edit > Order) ---
  - { key: UP, mods: [CMDCTRL], icon: moveup.png, label: "Move up" }
  - { key: DOWN, mods: [CMDCTRL], icon: movedown.png, label: "Move down" }
  - { key: HOME, mods: [CMDCTRL], icon: movetop.png, label: "Move to top" }
  - { key: END, mods: [CMDCTRL], icon: movebottom.png, label: "Move to bottom" }

  # --- nudge the selected source in the preview by 10 px ---
  - { key: LEFT, mods: [SHIFT], icon: nudgeleft.png, label: "Nudge left 10 px" }
  - { key: RIGHT, mods: [SHIFT], icon: nudgeright.png, label: "Nudge right 10 px" }
  - { key: UP, mods: [SHIFT], icon: nudgeup.png, label: "Nudge up 10 px" }
  - { key: DOWN, mods: [SHIFT], icon: nudgedown.png, label: "Nudge down 10 px" }

  # --- view and application ---
  - { key: F11, mods: [], icon: fullscreen.png, label: "Fullscreen interface" }
  - { key: COMMA, mods: [CMDCTRL], icon: settings.png, label: "Settings", only: [macos] }
  - { key: Q, mods: [CMDCTRL], icon: quit.png, label: "Quit OBS", only: [macos] }
  - { key: Q, mods: [CTRL], icon: quit.png, label: "Exit", only: [linux] }
