# Wargus (Warcraft II on the Stratagus engine) overlay for PolyKybd.
#
# Keys: the default bindings in the source of Stratagus v3.3.2
# (src/ui/interface.cpp, CommandKey()) and Wargus v3.3.2 (scripts/commands.lua,
# HandleIngameCommandKey()). See SOURCES.md.
#
# Only keys that do the same thing whatever is selected are labelled. The
# letter keys alone train, build and give orders through the button panel, and
# their meaning changes with the selection, so they stay blank.
#
# Regenerate:
#   python polyhost/res/overlay_sources/wargus/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/wargus/wargus.yaml --preview /tmp/wargus_preview
app: wargus
match: [stratagus, stratagus.exe, wargus, wargus.exe]
output: wargus_template
icon_dir: icons
fit: contain
mode: alpha
threshold: 150
# As for Warcraft III: the icon uses the full height on the right; the firmware
# clears 3 px around it, so a letter legend stays whole.
anchor: right
region: [40, 40]
margin: 0

# WAR over GUS drawn over the whole cell, without the ESC legend (protocol v25).
program_icon: program.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0
program_icon_legend: false

bindings:

  # Control groups (CommandKey_Group): digit selects, Ctrl+digit creates,
  # Shift+digit adds the group to the selection, Ctrl+Shift+digit adds the
  # selection to the group.
  - { key: "1", icon: group1.png, label: "Select group 1", region: [48, 40], margin: 5 }
  - { key: "2", icon: group2.png, label: "Select group 2", region: [48, 40], margin: 5 }
