# Safari shortcut overlays for PolyKybd (macOS). See SOURCES.md.
#
# Safari's own keys from Apple's Safari User Guide. On macOS the host also
# harvests every menu shortcut of the focused app, and those fill each key this
# set leaves free. The main job of the set is the mapping entry it belongs to:
# with it, a web app open in Safari (GitHub, Notion, Meet, Teams on the web ...)
# gets its own set on top, through the shared `&web_urls_mac` map. The host
# reads Safari's URL over AppleScript (`services/browser_url_macos.py`).
#
# Regenerate:
#   .venv/bin/python polyhost/res/overlay_sources/safari/fetch_icons.py
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/safari/bindings.yaml --preview /tmp/safari_preview
app: safari
match: [safari, safari technology preview]
output: safari_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

# No program_icon: ESC is left to the generic program mark, as for the other
# browsers.

# The Chrome set's reclaimed cells (borrowed through ../firefox) render 1:1.
_r: &r { region: [72, 40], anchor: center, source: "reclaimed (chrome/icons)" }
_m: &m { only: [macos] }

bindings:
  # --- tabs ---
  - { key: "1", mods: [GUI], icon: tab1.png, <<: [*r, *m], label: "Tab 1" }
  - { key: "2", mods: [GUI], icon: tab2.png, <<: [*r, *m], label: "Tab 2" }
  - { key: "3", mods: [GUI], icon: tab3.png, <<: [*r, *m], label: "Tab 3" }
  - { key: "4", mods: [GUI], icon: tab4.png, <<: [*r, *m], label: "Tab 4" }
  - { key: "5", mods: [GUI], icon: tab5.png, <<: [*r, *m], label: "Tab 5" }
  - { key: "6", mods: [GUI], icon: tab6.png, <<: [*r, *m], label: "Tab 6" }
  - { key: "7", mods: [GUI], icon: tab7.png, <<: [*r, *m], label: "Tab 7" }
  - { key: "8", mods: [GUI], icon: tab8.png, <<: [*r, *m], label: "Tab 8" }
  - { key: "9", mods: [GUI], icon: lasttab.png, <<: [*r, *m], label: "Last tab" }
  - { key: W, mods: [GUI], icon: closetab.png, <<: [*r, *m], label: "Close tab" }
  - { key: T, mods: [GUI, SHIFT], icon: reopentab.png, <<: [*r, *m], label: "Reopen closed tab" }
  - { key: RBRACKET, mods: [GUI, SHIFT], icon: nexttab.png, <<: [*r, *m], label: "Next tab" }
  - { key: LBRACKET, mods: [GUI, SHIFT], icon: prevtab.png, <<: [*r, *m], label: "Previous tab" }
  - { key: TAB, mods: [CTRL], icon: nexttab.png, <<: [*r, *m], label: "Next tab" }
  - { key: TAB, mods: [CTRL, SHIFT], icon: prevtab.png, <<: [*r, *m], label: "Previous tab" }
  - { key: BACKSLASH, mods: [GUI, SHIFT], icon: taboverview.png, label: "Tab overview", <<: *m }
  # --- page and history ---
  - { key: L, mods: [GUI], icon: addressbar.png, <<: [*r, *m], label: "Address bar" }
  - { key: LBRACKET, mods: [GUI], icon: back.png, <<: [*r, *m], label: "Back" }
  - { key: RBRACKET, mods: [GUI], icon: forward.png, <<: [*r, *m], label: "Forward" }
  - { key: H, mods: [GUI, SHIFT], icon: home.png, label: "Home page", <<: *m }
  - { key: UP, mods: [GUI], icon: pagetop.png, label: "Top of page", <<: *m }
  - { key: DOWN, mods: [GUI], icon: pagebottom.png, label: "Bottom of page", <<: *m }
  - { key: F, mods: [GUI], label: "Find", <<: *m }
  - { key: P, mods: [GUI], label: "Print", <<: *m }
  - { key: C, mods: [GUI], label: "Copy", <<: *m }
  - { key: V, mods: [GUI], label: "Paste", <<: *m }
  - { key: EQUAL, mods: [GUI], label: "Zoom in", <<: *m }
  - { key: MINUS, mods: [GUI], label: "Zoom out", <<: *m }
  # --- reader, reading list, bookmarks ---
  - { key: R, mods: [GUI, SHIFT], icon: reader.png, label: "Reader", <<: *m }
  - { key: D, mods: [GUI, SHIFT], icon: addreading.png, label: "Add to Reading List", <<: *m }
  - { key: "2", mods: [CTRL, GUI], icon: readinglist.png, label: "Reading List sidebar", <<: *m }
  - { key: "1", mods: [CTRL, GUI], icon: bmsidebar.png, label: "Bookmarks sidebar", <<: *m }
  # --- window and settings ---
  - { key: GRAVE, mods: [GUI], icon: switchwindow.png, label: "Next Safari window", <<: *m }
  - { key: COMMA, mods: [GUI], icon: settings.png, label: "Settings", <<: *m }
