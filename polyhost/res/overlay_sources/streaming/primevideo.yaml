# Prime Video's own player keys and ESC mark, for PolyKybd. Loaded on top of
# player.yaml. See SOURCES.md.
#
# Keys: Prime Video Help, "Keyboard shortcuts"
# (primevideo.com/help?nodeId=GE4VW9VWJD7FM6DR, read 2026-11-26), which names the
# web player and the Windows and macOS apps. The ESC mark is the logo's words in
# a free font: Simple Icons has no Prime Video logo.
#
# Regenerate (from the repo root, with the project venv):
#   PYTHONPATH=. .venv/bin/python polyhost/res/overlay_sources/streaming/fetch_icons.py
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/streaming/primevideo.yaml --preview /tmp/primevideo_preview
app: primevideo
match: [primevideo]
output: primevideo_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: primevideo.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0
program_icon_legend: false

bindings:
  - { key: UP,   icon: volup.png,      label: "Volume up" }
  - { key: DOWN, icon: voldown.png,    label: "Volume down" }
  - { key: C,    icon: captions.png,   label: "Subtitles" }
  - { key: A,    icon: audiotrack.png, label: "Audio track" }
