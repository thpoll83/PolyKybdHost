# FigCraft shortcut overlays for PolyKybd.
#
# FigCraft (https://github.com/storytold/figcraft, MIT OR Apache-2.0) is an
# open-source Rust/egui interface-design tool modelled on Figma. Its keymap is ONE
# table, crates/engine/src/keymap.rs `KEYS` (sha e56856f), which every menu, the
# shortcuts panel and the canvas resolve through; this file is that table for the
# canvas context (text-only bindings are left out). See SOURCES.md.
#
# ONE spec, TWO artwork sets: figcraft_template.* (Windows/Linux) and
# figcraft_template_mac.* (macOS).
#   CMDCTRL     keymap `Cmd` (Cmd on macOS, Ctrl on Windows/Linux).
#   CTRL        keymap `Ctrl` that is literal Control on macOS too.
#   only: [...] the eleven commands whose `.win(...)` keys differ from the Mac ones,
#               written once per platform.
#
# Icons: the Figma overlay's committed icons for the shared actions (borrowed
# byte-identical), Fluent UI System Icons (MIT), Material Symbols (Apache-2.0) and
# a few Fluent composites. Program icon: FigCraft's own chameleon (MIT OR Apache-2.0).
#
# Regenerate:
#   PYTHONPATH=. .venv/bin/python polyhost/res/overlay_sources/figcraft/fetch_icons.py
#   PYTHONPATH=. .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/figcraft/bindings.yaml --preview /tmp/figcraft_preview
app: figcraft
match: [figcraft, ai.storyteller.figcraft]
output: figcraft_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: figcraft.png       # FigCraft's own icon, outline + ink (fetch_icons._program_mark)
program_icon_mode: alpha
program_icon_anchor: bottom-right
program_icon_region: [46, 40]
program_icon_margin: 0

