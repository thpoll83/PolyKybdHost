  - { key: ENTER, mods: [], icon: pause.png, label: "Play/pause" }
  - { key: SPACE, mods: [CTRL], icon: pause.png, label: "Play/pause", except: [macos] }
  - { key: SPACE, mods: [CTRL], icon: pause.png, label: "Play/pause", only: [macos] }
  - { key: SPACE, mods: [ALT], icon: playskip.png, label: "Play, skip time selection" }
