# REAPER shortcut overlays for PolyKybd (Windows, Linux and macOS).
#
# The default main-section (arrange view) key bindings of REAPER 7.82. They are
# compiled into the program: they were read from the default key table in the
# Windows, macOS and Linux builds and from a run of the Linux build that listed
# every action's shortcut. See SOURCES.md.
#   CMDCTRL          Ctrl on Windows/Linux, Cmd on macOS (REAPER's rule).
#   ALT              Alt on Windows/Linux, Option on macOS (the same key).
#   only: / except:  the six bindings the macOS build defines differently
#                    (Preferences, Full Screen, Delete, Play/Pause).
# Windows and Linux bind the same keys for everything drawn here.
#
# Keys REAPER binds as characters (< > " ~ ! @ ? { } _) are drawn on the US key
# that types them with Shift.
#
# Regenerate:
#   python polyhost/res/overlay_sources/reaper/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/reaper/bindings.yaml --preview /tmp/reaper_preview
app: reaper
match: [reaper]
output: reaper_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

bindings:
