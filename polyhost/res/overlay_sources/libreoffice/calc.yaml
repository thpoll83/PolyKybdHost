# LibreOffice Calc shortcut overlays for PolyKybd. See writer.yaml header + SOURCES.md.
#
# Serves Windows/Linux AND macOS from this one file: `CMDCTRL` is Ctrl on
# Windows/Linux and Cmd on macOS (the generator also writes <output>_mac.*);
# a chord macOS moves is written twice under disjoint `only:` lists, and one
# with no macOS equivalent carries `except: [macos]`. See SOURCES.md -> macOS.
#
# Regenerate:
#   python polyhost/res/overlay_sources/libreoffice/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/libreoffice/calc.yaml --preview /tmp/lo_calc_preview
app: libreoffice-calc
match: [soffice]
output: libreoffice_calc_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: lo_calc.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0

bindings:
  # --- no modifier ---
  - { key: F2,  mods: [], icon: editcell.png,  label: "Edit cell",  source: "ms-fluent/Table Cell Edit (MIT)" }
  - { key: F4,  mods: [], icon: absref.png,    label: "Absolute / relative reference", source: "ms-fluent/Money (MIT)" }
  - { key: F5,  mods: [], icon: navigator.png, label: Navigator,    source: "ms-fluent/Compass Northwest (MIT)" }
  - { key: F7,  mods: [], icon: spelling.png,  label: Spelling,     source: "ms-fluent/Text Grammar Wand (MIT)", except: [macos] }
  - { key: F9,  mods: [], icon: recalc.png,    label: Recalculate,  source: "ms-fluent/Arrow Sync (MIT)" }
  - { key: F11, mods: [], icon: styles.png,    label: Styles,       source: "ms-fluent/Text Effects (MIT)", only: [windows, linux] }
  - { key: T, mods: [GUI], icon: styles.png,    label: Styles,       source: "ms-fluent/Text Effects (MIT)", only: [macos] }
  - { key: F12, mods: [], icon: groupdata.png, label: "Group data range", source: "ms-fluent/Group (MIT)" }

  # --- Ctrl ---
  - { key: N, mods: [CMDCTRL], icon: new.png,       label: New,        source: "ms-fluent/Document Add (MIT)" }
  - { key: O, mods: [CMDCTRL], icon: open.png,      label: Open,       source: "ms-fluent/Folder Open (MIT)" }
  - { key: S, mods: [CMDCTRL], icon: save.png,      label: Save,       source: "ms-fluent/Save (MIT)" }
  - { key: P, mods: [CMDCTRL], icon: print.png,     label: Print,      source: "ms-fluent/Print (MIT)" }
  - { key: Z, mods: [CMDCTRL], icon: undo.png,      label: Undo,       source: "ms-fluent/Arrow Undo (MIT)" }
  - { key: Y, mods: [CMDCTRL], icon: redo.png,      label: Redo,       source: "ms-fluent/Arrow Redo (MIT)" }
  - { key: X, mods: [CMDCTRL], icon: cut.png,       label: Cut,        source: "ms-fluent/Cut (MIT)" }
  - { key: C, mods: [CMDCTRL], icon: copy.png,      label: Copy,       source: "ms-fluent/Copy (MIT)" }
  - { key: V, mods: [CMDCTRL], icon: paste.png,     label: Paste,      source: "ms-fluent/Clipboard Paste (MIT)" }
  - { key: A, mods: [CMDCTRL], icon: selectall.png, label: "Select all", source: "ms-fluent/Select All On (MIT)" }
  - { key: F, mods: [CMDCTRL], icon: find.png,      label: Find,       source: "ms-fluent/Search (MIT)" }
  - { key: H, mods: [CTRL], icon: replace.png,   label: "Find & replace", source: "ms-fluent/Arrow Swap (MIT)", only: [windows, linux] }
  - { key: F, mods: [GUI, ALT], icon: replace.png,   label: "Find & replace", source: "ms-fluent/Arrow Swap (MIT)", only: [macos] }
  - { key: B, mods: [CMDCTRL], icon: bold.png,      label: Bold,       source: "ms-fluent/Text Bold (MIT)" }
  - { key: I, mods: [CMDCTRL], icon: italic.png,    label: Italic,     source: "ms-fluent/Text Italic (MIT)" }
  - { key: U, mods: [CMDCTRL], icon: underline.png, label: Underline,  source: "ms-fluent/Text Underline (MIT)" }
  - { key: M, mods: [CTRL], icon: clearfmt.png,  label: "Clear direct formatting", source: "ms-fluent/Text Clear Formatting (MIT)" }
  - { key: "1", mods: [CMDCTRL], icon: formatcells.png, label: "Format cells", source: "ms-fluent/Table Simple (MIT)" }
  - { key: SPACE, mods: [CTRL], icon: selectcolumn.png, label: "Select column", source: "ms-fluent/Table Insert Column (MIT)" }
  - { key: "-", mods: [CMDCTRL], icon: deletecells.png, label: "Delete cells", source: "ms-fluent/Table Delete Row (MIT)" }
  - { key: "`", mods: [CTRL], icon: showformulas.png, label: "Show formulas", source: "ms-fluent/Calculator (MIT)" }

  # --- Shift ---
  - { key: SPACE, mods: [SHIFT], icon: selectrow.png, label: "Select row", source: "ms-fluent/Table Insert Row (MIT)" }

  # --- Ctrl+Shift ---
  # Ctrl+Plus is Ctrl+Shift+= on a US layout, which is how it is bound here.
  - { key: "=", mods: [CMDCTRL, SHIFT], icon: insertcells.png,    label: "Insert cells", source: "ms-fluent/Table Add (MIT)" }
  - { key: SPACE, mods: [CTRL, SHIFT], icon: selectallcells.png, label: "Select all cells", source: "ms-fluent/Table Simple (MIT)" }
  - { key: V, mods: [CMDCTRL, SHIFT], icon: pastespecial.png, label: "Paste special", source: "ms-fluent/Clipboard Paste (MIT)" }
  - { key: "1", mods: [CTRL, SHIFT], icon: fmtdecimal.png,  label: "Format: 2 decimals", source: "ms-fluent/Text Number Format (MIT)" }
  - { key: "2", mods: [CTRL, SHIFT], icon: fmtexp.png,      label: "Format: exponential", source: "ms-fluent/Text Superscript (MIT)" }
  - { key: "3", mods: [CTRL, SHIFT], icon: fmtdate.png,     label: "Format: date",     source: "ms-fluent/Calendar (MIT)" }
  - { key: "4", mods: [CTRL, SHIFT], icon: fmtcurrency.png, label: "Format: currency", source: "ms-fluent/Money (MIT)" }
  - { key: "5", mods: [CTRL, SHIFT], icon: fmtpercent.png,  label: "Format: percent",  source: "ms-fluent/Circle Half Fill (MIT)" }
  - { key: F9, mods: [CMDCTRL, SHIFT], icon: recalcall.png,    label: "Recalculate all",  source: "ms-fluent/Arrow Repeat All (MIT)" }
