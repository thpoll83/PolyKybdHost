# LibreOffice Writer shortcut overlays for PolyKybd.
#
# Serves Windows/Linux AND macOS from this one file: `CMDCTRL` is Ctrl on
# Windows/Linux and Cmd on macOS (the generator also writes <output>_mac.*);
# a chord macOS moves is written twice under disjoint `only:` lists, and one
# with no macOS equivalent carries `except: [macos]`. See SOURCES.md -> macOS.
#
# Icons: Microsoft Fluent UI System Icons (MIT); ESC program mark drawn
# (../program_marks.py). Shortcuts: LibreOffice's own help. See SOURCES.md.
#
# The three LibreOffice modules share ONE mapping entry (they are one process,
# `soffice`) and are told apart by window title (`titles-endswith`) - see SOURCES.md.
#
# Regenerate:
#   python polyhost/res/overlay_sources/libreoffice/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/libreoffice/writer.yaml --preview /tmp/lo_writer_preview
app: libreoffice-writer
match: [soffice]
output: libreoffice_writer_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: lo_writer.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0

bindings:
  # --- no modifier ---
  - { key: F5,  mods: [], icon: navigator.png, label: Navigator, source: "ms-fluent/Compass Northwest (MIT)" }
  - { key: F7,  mods: [], icon: spelling.png,  label: Spelling,  source: "ms-fluent/Text Grammar Wand (MIT)", only: [windows, linux] }
  - { key: ";", mods: [GUI, SHIFT], icon: spelling.png,  label: Spelling,  source: "ms-fluent/Text Grammar Wand (MIT)", only: [macos] }
  - { key: F11, mods: [], icon: styles.png,    label: Styles,    source: "ms-fluent/Text Effects (MIT)", except: [macos] }
  - { key: F12, mods: [], icon: orderedlist.png, label: "Ordered list", source: "material-symbols/format_list_numbered (Apache-2.0)" }

  # --- Ctrl ---
  - { key: N, mods: [CMDCTRL], icon: new.png,       label: New,        source: "ms-fluent/Document Add (MIT)" }
  - { key: O, mods: [CMDCTRL], icon: open.png,      label: Open,       source: "ms-fluent/Folder Open (MIT)" }
  - { key: S, mods: [CMDCTRL], icon: save.png,      label: Save,       source: "ms-fluent/Save (MIT)" }
  - { key: P, mods: [CMDCTRL], icon: print.png,     label: Print,      source: "ms-fluent/Print (MIT)" }
  - { key: Q, mods: [CMDCTRL], icon: quit.png,      label: Quit,       source: "ms-fluent/Dismiss (MIT)" }
  - { key: Z, mods: [CMDCTRL], icon: undo.png,      label: Undo,       source: "ms-fluent/Arrow Undo (MIT)" }
  - { key: Y, mods: [CMDCTRL], icon: redo.png,      label: Redo,       source: "ms-fluent/Arrow Redo (MIT)" }
  - { key: X, mods: [CMDCTRL], icon: cut.png,       label: Cut,        source: "ms-fluent/Cut (MIT)" }
  - { key: C, mods: [CMDCTRL], icon: copy.png,      label: Copy,       source: "ms-fluent/Copy (MIT)" }
  - { key: V, mods: [CMDCTRL], icon: paste.png,     label: Paste,      source: "ms-fluent/Clipboard Paste (MIT)" }
  - { key: A, mods: [CMDCTRL], icon: selectall.png, label: "Select all", source: "ms-fluent/Select All On (MIT)" }
  - { key: F, mods: [CMDCTRL], icon: find.png,      label: Find,       source: "ms-fluent/Search (MIT)" }
  - { key: H, mods: [CTRL], icon: replace.png,   label: "Find & replace", source: "ms-fluent/Arrow Swap (MIT)", only: [windows, linux] }
  - { key: F, mods: [GUI, ALT], icon: replace.png,   label: "Find & replace", source: "ms-fluent/Arrow Swap (MIT)", only: [macos] }
  - { key: B, mods: [CMDCTRL], icon: bold.png,      label: Bold,       source: "ms-fluent/Text Bold (MIT)" }
  - { key: I, mods: [CMDCTRL], icon: italic.png,    label: Italic,     source: "ms-fluent/Text Italic (MIT)" }
  - { key: U, mods: [CMDCTRL], icon: underline.png, label: Underline,  source: "ms-fluent/Text Underline (MIT)" }
  - { key: D, mods: [CMDCTRL], icon: doubleunderline.png, label: "Double underline", source: "ms-fluent/Text Underline Double (MIT)" }
  - { key: M, mods: [CTRL], icon: clearfmt.png,  label: "Clear direct formatting", source: "ms-fluent/Text Clear Formatting (MIT)" }
  - { key: E, mods: [CMDCTRL], icon: center.png,    label: Center,     source: "ms-fluent/Text Align Center (MIT)" }
  - { key: L, mods: [CMDCTRL], icon: left.png,      label: "Align left", source: "ms-fluent/Text Align Left (MIT)" }
  - { key: R, mods: [CMDCTRL], icon: right.png,     label: "Align right", source: "ms-fluent/Text Align Right (MIT)" }
  - { key: J, mods: [CMDCTRL], icon: justify.png,   label: Justify,    source: "ms-fluent/Text Align Justify (MIT)" }
  - { key: "0", mods: [CMDCTRL], icon: bodytext.png, label: "Body text", source: "ms-fluent/Text Paragraph (MIT)" }
  - { key: "1", mods: [CMDCTRL], icon: heading1.png, label: "Heading 1", source: "ms-fluent/Text Header 1 (MIT)" }
  - { key: "2", mods: [CMDCTRL], icon: heading2.png, label: "Heading 2", source: "ms-fluent/Text Header 2 (MIT)" }
  - { key: "3", mods: [CMDCTRL], icon: heading3.png, label: "Heading 3", source: "ms-fluent/Text Header 3 (MIT)" }

  # --- Shift ---
  - { key: F5,  mods: [SHIFT], icon: lastpos.png,       label: "Last edit position", source: "ms-fluent/Arrow Undo (MIT)" }
  - { key: F11, mods: [SHIFT], icon: createstyle.png,   label: "Create style",  source: "ms-fluent/Star Emphasis (MIT)" }
  - { key: F12, mods: [SHIFT], icon: unorderedlist.png, label: "Unordered list", source: "ms-fluent/Text Bullet List (MIT)" }

  # --- Ctrl+Shift ---
  - { key: P, mods: [CMDCTRL, SHIFT], icon: superscript.png,  label: Superscript,     source: "ms-fluent/Text Superscript (MIT)" }
  - { key: B, mods: [CMDCTRL, SHIFT], icon: subscript.png,    label: Subscript,       source: "ms-fluent/Text Subscript (MIT)" }
  - { key: V, mods: [CMDCTRL, SHIFT], icon: pastespecial.png, label: "Paste special", source: "ms-fluent/Clipboard Paste (MIT)" }
  - { key: F11, mods: [CMDCTRL, SHIFT], icon: updatestyle.png, label: "Update style", source: "ms-fluent/Arrow Sync (MIT)" }

  # --- standard editing (shared Fluent concepts) ---
  - { key: W, mods: [CMDCTRL],        label: "Close",     source: "concept (shared Fluent)" }
  - { key: F, mods: [CMDCTRL, SHIFT], label: "Find next", source: "concept (shared Fluent)" }
  - { key: Z, mods: [GUI, SHIFT], only: [macos], label: "Redo", source: "concept (shared Fluent)" }
