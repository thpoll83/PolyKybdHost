# LibreOffice Impress shortcut overlays for PolyKybd. See writer.yaml header + SOURCES.md.
#
# Regenerate:
#   python polyhost/res/overlay_sources/libreoffice/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/libreoffice/impress.yaml --preview /tmp/lo_impress_preview
app: libreoffice-impress
match: [soffice]
output: libreoffice_impress_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: lo_impress.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [42, 34]
program_icon_margin: 0

bindings:
  # --- no modifier ---
  - { key: F2,  mods: [], icon: edittext.png,  label: "Edit text", source: "ms-fluent/Text T (MIT)" }
  - { key: F5,  mods: [], icon: slideshow.png, label: "Start slideshow", source: "ms-fluent/Slide Play (MIT)" }
  - { key: F7,  mods: [], icon: spelling.png,  label: Spelling,    source: "ms-fluent/Text Grammar Wand (MIT)" }
  - { key: F11, mods: [], icon: styles.png,    label: Styles,      source: "ms-fluent/Text Effects (MIT)" }

  # --- Ctrl ---
  - { key: N, mods: [CTRL], icon: new.png,       label: New,        source: "ms-fluent/Document Add (MIT)" }
  - { key: O, mods: [CTRL], icon: open.png,      label: Open,       source: "ms-fluent/Folder Open (MIT)" }
  - { key: S, mods: [CTRL], icon: save.png,      label: Save,       source: "ms-fluent/Save (MIT)" }
  - { key: P, mods: [CTRL], icon: print.png,     label: Print,      source: "ms-fluent/Print (MIT)" }
  - { key: Z, mods: [CTRL], icon: undo.png,      label: Undo,       source: "ms-fluent/Arrow Undo (MIT)" }
  - { key: Y, mods: [CTRL], icon: redo.png,      label: Redo,       source: "ms-fluent/Arrow Redo (MIT)" }
  - { key: X, mods: [CTRL], icon: cut.png,       label: Cut,        source: "ms-fluent/Cut (MIT)" }
  - { key: C, mods: [CTRL], icon: copy.png,      label: Copy,       source: "ms-fluent/Copy (MIT)" }
  - { key: V, mods: [CTRL], icon: paste.png,     label: Paste,      source: "ms-fluent/Clipboard Paste (MIT)" }
  - { key: A, mods: [CTRL], icon: selectall.png, label: "Select all", source: "ms-fluent/Select All On (MIT)" }
  - { key: F, mods: [CTRL], icon: find.png,      label: Find,       source: "ms-fluent/Search (MIT)" }
  - { key: H, mods: [CTRL], icon: replace.png,   label: "Find & replace", source: "ms-fluent/Arrow Swap (MIT)" }
  - { key: B, mods: [CTRL], icon: bold.png,      label: Bold,       source: "ms-fluent/Text Bold (MIT)" }
  - { key: I, mods: [CTRL], icon: italic.png,    label: Italic,     source: "ms-fluent/Text Italic (MIT)" }
  - { key: U, mods: [CTRL], icon: underline.png, label: Underline,  source: "ms-fluent/Text Underline (MIT)" }
  - { key: M, mods: [CTRL], icon: clearfmt.png,  label: "Clear direct formatting", source: "ms-fluent/Text Clear Formatting (MIT)" }
  - { key: "-", mods: [CTRL], icon: backward.png, label: "Send backward", source: "ms-fluent/Position Backward (MIT)" }

  # --- Shift ---
  - { key: F3, mods: [SHIFT], icon: duplicateslide.png, label: "Duplicate slide", source: "ms-fluent/Slide Multiple (MIT)" }

  # --- Ctrl+Shift ---
  # Ctrl+Plus is Ctrl+Shift+= on a US layout, which is how it is bound here.
  - { key: "=", mods: [CTRL, SHIFT], icon: tofront.png,      label: "Bring to front", source: "ms-fluent/Position Forward (MIT)" }
  - { key: G, mods: [CTRL, SHIFT], icon: group.png,          label: Group,            source: "ms-fluent/Group (MIT)" }
  - { key: K, mods: [CTRL, SHIFT], icon: combine.png,        label: "Combine objects", source: "ms-fluent/Layer (MIT)" }
  - { key: V, mods: [CTRL, SHIFT], icon: pastespecial.png,   label: "Paste special",  source: "ms-fluent/Clipboard Paste (MIT)" }

  # --- Ctrl+Alt+Shift (the `extra` layer) ---
  - { key: A, mods: [CTRL, ALT, SHIFT], icon: ungroup.png, label: Ungroup, source: "ms-fluent/Group Dismiss (MIT)" }
