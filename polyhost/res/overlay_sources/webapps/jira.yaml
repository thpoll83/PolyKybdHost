# Jira Cloud overlay for PolyKybd (shown while a browser has Jira open).
#
# Icons: Microsoft Fluent UI System Icons (MIT) via webapps/fetch_icons.py,
# replacing the earlier hand-drawn jira_* set. The ESC mark (jira_mark.png)
# stays the reclaimed hand-drawn mark.
#
# Keys: Jira Cloud's own shortcut dialog (`?`), transcribed 2026-10-13: Global,
# Navigating issues, Issue actions and Board. Left out: two-key sequences
# (g then i, s then t), the Plans-only Ctrl+Alt keys, bare `s` (it starts the
# s-then-t/b sequences), the arrow keys and Ctrl+B (skip to toolbar). Ctrl is
# Cmd on macOS (CMDCTRL). See SOURCES.md.
#
# Regenerate (from the repo root, with the project venv):
#   PYTHONPATH=. .venv/bin/python polyhost/res/overlay_sources/webapps/fetch_icons.py
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/webapps/jira.yaml --preview /tmp/jira_preview
app: jira
match: [chrome]
output: jira_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: jira_mark.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_anchor: center
program_icon_margin: 0

bindings:
  # --- issue actions ---
  - { key: A, mods: [], icon: assignee.png,     label: "Assign",              source: "ms-fluent/Person (MIT)" }
  - { key: I, mods: [], icon: assigntome.png,   label: "Assign to me",        source: "ms-fluent/Person Arrow Left (MIT)" }
  - { key: M, mods: [], icon: comment.png,      label: "Comment",             source: "ms-fluent/Comment (MIT)" }
  - { key: L, mods: [], icon: label.png,        label: "Edit labels",         source: "ms-fluent/Tag (MIT)" }
  - { key: D, mods: [], icon: changestatus.png, label: "Change status",       source: "ms-fluent/Arrow Sync Circle (MIT)" }
  - { key: Q, mods: [], icon: logwork.png,      label: "Log work",            source: "ms-fluent/Timer (MIT)" }
  - { key: ".", mods: [], icon: actions.png,    label: "Actions",             source: "ms-fluent/More Horizontal (MIT)" }
  - { key: S, mods: [SHIFT], icon: share.png,   label: "Share",               source: "ms-fluent/Share (MIT)" }
  - { key: C, mods: [SHIFT], icon: childissue.png, label: "Create child issue", source: "ms-fluent/Add Square Multiple (MIT)" }
  - { key: K, mods: [SHIFT], icon: linkissue.png,  label: "Link existing issue", source: "ms-fluent/Link Add (MIT)" }

  # --- global ---
  - { key: C, mods: [], icon: createissue.png,  label: "Create work item",    source: "ms-fluent/Add Circle (MIT)" }
  - { key: "/", mods: [], icon: search.png,     label: "Quick search",        source: "ms-fluent/Search (MIT)" }
  - { key: "/", mods: [SHIFT], icon: shortcuts.png, label: "Keyboard shortcuts", source: "ms-fluent/Keyboard (MIT)" }
  - { key: "[", mods: [], icon: sidebar.png,    label: "Toggle sidebar",      source: "ms-fluent/Panel Left (MIT)" }
  - { key: H, mods: [], icon: help.png,         label: "Help panel",          source: "ms-fluent/Question Circle (MIT)" }
  - { key: K, mods: [CMDCTRL], icon: commandpalette.png, label: "Command palette", source: "ms-fluent/Apps List Detail (MIT)" }

  # --- navigating issues ---
  - { key: O, mods: [], icon: openitem.png,     label: "Open issue",          source: "ms-fluent/Open (MIT)" }
  - { key: J, mods: [], icon: nextitem.png,     label: "Next issue",          source: "ms-fluent/Chevron Down (MIT)" }
  - { key: K, mods: [], icon: previtem.png,     label: "Previous issue",      source: "ms-fluent/Chevron Up (MIT)" }
  - { key: Z, mods: [], icon: fullscreen.png,   label: "Issue fullscreen",    source: "ms-fluent/Full Screen Maximize (MIT)" }
  - { key: F, mods: [], icon: filter.png,       label: "Focus search field",  source: "ms-fluent/Filter (MIT)" }
  - { key: U, mods: [], icon: findfiles.png,    label: "Search for issues",   source: "ms-fluent/Document Search (MIT)" }
  - { key: Y, mods: [], icon: sortorder.png,    label: "Order by",            source: "ms-fluent/Arrow Sort (MIT)" }
  # n/p and t mean the same move on boards (column, detail view) as in the
  # issue navigator (activity, filter view), so one icon serves both.
  - { key: N, mods: [], icon: nextfile.png,     label: "Next column / activity",     source: "ms-fluent/Chevron Right (MIT)" }
  - { key: P, mods: [], icon: prevfile.png,     label: "Previous column / activity", source: "ms-fluent/Chevron Left (MIT)" }
  - { key: T, mods: [], icon: rightsidebar.png, label: "Toggle detail view",  source: "ms-fluent/Panel Right (MIT)" }

  # --- boards ---
  - { key: E, mods: [], icon: epicpanel.png,    label: "Epic panel",          source: "ms-fluent/Flash (MIT)" }
  - { key: V, mods: [], icon: publish.png,      label: "Version panel",       source: "ms-fluent/Rocket (MIT)" }
  - { key: MINUS, mods: [], icon: swimlanes.png, label: "Toggle swimlanes",   source: "ms-fluent/Arrow Collapse All (MIT)" }
