# Google Calendar (in-browser) shortcut overlays for PolyKybd. See SOURCES.md.
# GENERATED by gen_google_specs.py from its table -- edit the table, not this file.
#
# Shortcuts: the PC and Mac tables of Google's help page
# https://support.google.com/calendar/answer/37034
# Bare letters, digits and Shift+letter keys are left out: they would replace
# the letter legends while the user types.
#
# Regenerate:
#   python polyhost/res/overlay_sources/webapps/fetch_icons.py
#   python polyhost/res/overlay_sources/webapps/gen_google_specs.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/webapps/googlecalendar.yaml --preview /tmp/googlecalendar_preview
app: googlecalendar
match: [googlecalendar]
output: googlecalendar_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: gcal.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:

  - { key: S, mods: [CMDCTRL], icon: save.png, label: "Save event", shared: false }
  - { key: DOT, mods: [CTRL, ALT], icon: sidepanel.png, label: "Side panel", except: [macos] }
  - { key: DOT, mods: [ALT, GUI], icon: sidepanel.png, label: "Side panel", only: [macos] }
  - { key: COMMA, mods: [CTRL, ALT], icon: sidepanel.png, label: "Side panel", except: [macos] }
  - { key: COMMA, mods: [ALT, GUI], icon: sidepanel.png, label: "Side panel", only: [macos] }
