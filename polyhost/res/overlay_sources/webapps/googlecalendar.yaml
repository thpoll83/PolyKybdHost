# Google Calendar (in-browser) shortcut overlays for PolyKybd. See SOURCES.md.
# GENERATED by gen_google_specs.py from its table -- edit the table, not this file.
#
# Shortcuts: the PC and Mac tables of Google's help page
# https://support.google.com/calendar/answer/37034
# Calendar's single keys are included: they are on by default and act only
# when no text field has focus.
#
# Regenerate:
#   python polyhost/res/overlay_sources/webapps/fetch_icons.py
#   python polyhost/res/overlay_sources/webapps/gen_google_specs.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/webapps/googlecalendar.yaml --preview /tmp/googlecalendar_preview
app: googlecalendar
match: [googlecalendar]
output: googlecalendar_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: gcal.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:

  - { key: J, icon: calnext.png, label: "Next date range" }
  - { key: N, icon: calnext.png, label: "Next date range" }
  - { key: K, icon: calprev.png, label: "Previous date range" }
  - { key: P, icon: calprev.png, label: "Previous date range" }
  - { key: R, icon: calrefresh.png, label: "Refresh" }
  - { key: T, icon: caltoday.png, label: "Today" }
  - { key: SLASH, icon: search.png, label: "Search" }
  - { key: S, icon: settings.png, label: "Settings" }
  - { key: G, icon: calgoto.png, label: "Go to date" }
  - { key: "1", icon: calday.png, label: "Day view" }
  - { key: D, icon: calday.png, label: "Day view" }
  - { key: "2", icon: calweek.png, label: "Week view" }
  - { key: W, icon: calweek.png, label: "Week view" }
  - { key: "3", icon: calmonth.png, label: "Month view" }
  - { key: M, icon: calmonth.png, label: "Month view" }
  - { key: "4", icon: calcustom.png, label: "Custom view" }
  - { key: X, icon: calcustom.png, label: "Custom view" }
  - { key: "5", icon: calagenda.png, label: "Agenda view" }
  - { key: A, icon: calagenda.png, label: "Agenda view" }
  - { key: C, icon: calnew.png, label: "Create event" }
  - { key: E, icon: calinfo.png, label: "Event details" }
  - { key: BSPC, icon: delete.png, label: "Delete event" }
  - { key: DELETE, icon: delete.png, label: "Delete event" }
  - { key: Z, label: "Undo" }
  - { key: S, mods: [CMDCTRL], icon: save.png, label: "Save event", shared: false }
  - { key: DOT, mods: [CTRL, ALT], icon: sidepanel.png, label: "Side panel", except: [macos] }
  - { key: DOT, mods: [ALT, GUI], icon: sidepanel.png, label: "Side panel", only: [macos] }
  - { key: COMMA, mods: [CTRL, ALT], icon: sidepanel.png, label: "Side panel", except: [macos] }
  - { key: COMMA, mods: [ALT, GUI], icon: sidepanel.png, label: "Side panel", only: [macos] }
