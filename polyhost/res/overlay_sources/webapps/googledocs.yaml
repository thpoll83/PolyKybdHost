# Google Docs (in-browser) shortcut overlays for PolyKybd. See SOURCES.md.
#
# Serves Windows/Linux AND macOS from this one file: `CMDCTRL` is Ctrl on
# Windows/Linux and Cmd on macOS (the generator also writes <output>_mac.*);
# a chord macOS moves is written twice under disjoint `only:` lists, and one
# with no macOS equivalent carries `except: [macos]`. See SOURCES.md -> macOS.
#
# Regenerate:
#   python polyhost/res/overlay_sources/webapps/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/webapps/googledocs.yaml --preview /tmp/gd_preview
app: googledocs
match: [googledocs]
output: googledocs_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: gd.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0

bindings:
  # --- Ctrl ---
  - { key: C, mods: [CMDCTRL], icon: copy.png,      label: Copy,        source: "ms-fluent/Copy (MIT)" }
  - { key: X, mods: [CMDCTRL], icon: cut.png,       label: Cut,         source: "ms-fluent/Cut (MIT)" }
  - { key: V, mods: [CMDCTRL], icon: paste.png,     label: Paste,       source: "ms-fluent/Clipboard Paste (MIT)" }
  - { key: Z, mods: [CMDCTRL], icon: undo.png,      label: Undo,        source: "ms-fluent/Arrow Undo (MIT)" }
  - { key: F, mods: [CMDCTRL], icon: find.png,      label: Find,        source: "ms-fluent/Search (MIT)" }
  - { key: H, mods: [CTRL], icon: findreplace.png, label: "Find and replace", source: "ms-fluent/Arrow Swap (MIT)", only: [windows, linux] }
  - { key: H, mods: [GUI, SHIFT], icon: findreplace.png, label: "Find and replace", source: "ms-fluent/Arrow Swap (MIT)", only: [macos] }
  - { key: K, mods: [CMDCTRL], icon: link.png,      label: "Insert link", source: "ms-fluent/Link (MIT)" }
  - { key: O, mods: [CMDCTRL], icon: open.png,      label: Open,        source: "ms-fluent/Folder Open (MIT)" }
  - { key: P, mods: [CMDCTRL], icon: print.png,     label: Print,       source: "ms-fluent/Print (MIT)" }
  - { key: S, mods: [CMDCTRL], icon: save.png,      label: Save,        source: "ms-fluent/Save (MIT)" }
  - { key: A, mods: [CMDCTRL], icon: selectall.png, label: "Select all", source: "ms-fluent/Select All On (MIT)" }
  - { key: B, mods: [CMDCTRL], icon: bold.png,      label: Bold,        source: "ms-fluent/Text Bold (MIT)" }
  - { key: I, mods: [CMDCTRL], icon: italic.png,    label: Italic,      source: "ms-fluent/Text Italic (MIT)" }
  - { key: U, mods: [CMDCTRL], icon: underline.png, label: Underline,   source: "ms-fluent/Text Underline (MIT)" }
  - { key: ".", mods: [CMDCTRL], icon: superscript.png, label: Superscript, source: "ms-fluent/Text Superscript (MIT)" }
  - { key: ",", mods: [CMDCTRL], icon: subscript.png,   label: Subscript,   source: "ms-fluent/Text Subscript (MIT)" }
  - { key: "\\", mods: [CMDCTRL], icon: clearfmt.png,   label: "Clear formatting", source: "ms-fluent/Text Clear Formatting (MIT)" }
  - { key: "]", mods: [CMDCTRL], icon: indent.png,  label: Indent,      source: "ms-fluent/Text Indent Increase (MIT)" }
  - { key: "[", mods: [CMDCTRL], icon: outdent.png, label: Outdent,     source: "ms-fluent/Text Indent Decrease (MIT)" }
  - { key: "/", mods: [CMDCTRL], icon: shortcuts.png, label: "Show shortcuts", source: "ms-fluent/Keyboard (MIT)" }

  # --- Ctrl+Shift ---
  - { key: Z, mods: [CMDCTRL, SHIFT], icon: redo.png,        label: Redo,          source: "ms-fluent/Arrow Redo (MIT)" }
  - { key: V, mods: [CMDCTRL, SHIFT], icon: pasteplain.png,  label: "Paste without formatting", source: "ms-fluent/Clipboard Paste (MIT)" }
  - { key: L, mods: [CMDCTRL, SHIFT], icon: alignleft.png,   label: "Align left",   source: "ms-fluent/Text Align Left (MIT)" }
  - { key: E, mods: [CMDCTRL, SHIFT], icon: aligncenter.png, label: "Center align", source: "ms-fluent/Text Align Center (MIT)" }
  - { key: R, mods: [CMDCTRL, SHIFT], icon: alignright.png,  label: "Right align",  source: "ms-fluent/Text Align Right (MIT)" }
  - { key: J, mods: [CMDCTRL, SHIFT], icon: alignjustify.png, label: Justify,       source: "ms-fluent/Text Align Justify (MIT)" }
  - { key: "7", mods: [CMDCTRL, SHIFT], icon: numberlist.png, label: "Numbered list", source: "material-symbols/format_list_numbered (Apache-2.0)" }
  - { key: "8", mods: [CMDCTRL, SHIFT], icon: bulletlist.png, label: "Bulleted list", source: "ms-fluent/Text Bullet List (MIT)" }
  - { key: C, mods: [CMDCTRL, SHIFT], icon: wordcount.png,   label: "Word count",   source: "ms-fluent/Text Word Count (MIT)" }
  - { key: ".", mods: [CMDCTRL, SHIFT], icon: fontinc.png,   label: "Increase font size", source: "ms-fluent/Text Font (MIT)" }
  - { key: ",", mods: [CMDCTRL, SHIFT], icon: fontdec.png,   label: "Decrease font size", source: "ms-fluent/Text Font Size (MIT)" }

  # --- Ctrl+Alt: paragraph styles + comments ---
  - { key: "0", mods: [CMDCTRL, ALT], icon: normaltext.png, label: "Normal text", source: "ms-fluent/Text Paragraph (MIT)" }
  - { key: "1", mods: [CMDCTRL, ALT], icon: heading1.png,   label: "Heading 1",   source: "ms-fluent/Text Header 1 (MIT)" }
  - { key: "2", mods: [CMDCTRL, ALT], icon: heading2.png,   label: "Heading 2",   source: "ms-fluent/Text Header 2 (MIT)" }
  - { key: "3", mods: [CMDCTRL, ALT], icon: heading3.png,   label: "Heading 3",   source: "ms-fluent/Text Header 3 (MIT)" }
  - { key: M, mods: [CMDCTRL, ALT], icon: addcomment.png,   label: "Insert comment", source: "ms-fluent/Chat Add (MIT)" }

  # --- Alt+Shift ---
  - { key: "5", mods: [ALT, SHIFT], icon: strikethrough.png, label: Strikethrough, source: "ms-fluent/Text Strikethrough (MIT)", only: [windows, linux] }
  - { key: X, mods: [GUI, SHIFT], icon: strikethrough.png, label: Strikethrough, source: "ms-fluent/Text Strikethrough (MIT)", only: [macos] }

  # --- Ctrl+Alt+Shift (the `extra` layer) ---
  - { key: A, mods: [CMDCTRL, ALT, SHIFT], icon: comment.png, label: "Open discussion thread", source: "ms-fluent/Comment (MIT)" }
