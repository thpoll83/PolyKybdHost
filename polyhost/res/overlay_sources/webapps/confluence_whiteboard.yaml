# Confluence Cloud whiteboard overlay for PolyKybd (a browser tab on
# <site>.atlassian.net/wiki/.../whiteboard/...). See SOURCES.md.
#
# Every key is from the Whiteboards tab of Confluence's "?" dialog
# (Windows/Linux, transcribed 2026-10-13). Left out: the arrow keys (nudge and
# move the board) and Esc (exit fullscreen).
#
# Serves Windows/Linux AND macOS from this one file: `CMDCTRL` is Ctrl on
# Windows/Linux and Cmd on macOS. See SOURCES.md -> macOS.
#
# Regenerate:
#   python polyhost/res/overlay_sources/webapps/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/webapps/confluence_whiteboard.yaml --preview /tmp/cfwb_preview
app: confluence_whiteboard
match: [confluence]
output: confluence_whiteboard_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: cf.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- single key: tools ---
  - { key: S, mods: [], icon: sticky.png,   label: Sticky,       source: "ms-fluent/Note (MIT)" }
  - { key: T, mods: [], icon: textbox.png,  label: "Text box",   source: "ms-fluent/Text Field (MIT)" }
  - { key: E, mods: [], icon: ellipse.png,  label: Ellipse,      source: "ms-fluent/Circle (MIT)" }
  - { key: L, mods: [], icon: line.png,     label: Line,         source: "ms-fluent/Line (MIT)" }
  - { key: H, mods: [], icon: handtool.png, label: "Hand tool",  source: "ms-fluent/Hand Left (MIT)" }
  - { key: V, mods: [], icon: select.png,   label: Select,       source: "ms-fluent/Cursor (MIT)" }
  - { key: DELETE, mods: [], icon: delete.png, label: Delete,    source: "ms-fluent/Delete (MIT)" }

  # --- Ctrl ---
  - { key: K, mods: [CMDCTRL], icon: link.png,      label: Link,         source: "ms-fluent/Link (MIT)" }
  - { key: C, mods: [CMDCTRL], icon: copy.png,      label: Copy,         source: "ms-fluent/Copy (MIT)" }
  - { key: X, mods: [CMDCTRL], icon: cut.png,       label: Cut,          source: "ms-fluent/Cut (MIT)" }
  - { key: V, mods: [CMDCTRL], icon: paste.png,     label: Paste,        source: "ms-fluent/Clipboard Paste (MIT)" }
  - { key: A, mods: [CMDCTRL], icon: selectall.png, label: "Select all", source: "ms-fluent/Select All On (MIT)" }
  - { key: Z, mods: [CMDCTRL], icon: undo.png,      label: Undo,         source: "ms-fluent/Arrow Undo (MIT)" }
  - { key: J, mods: [CMDCTRL], icon: createissue.png, label: "Jira issue", source: "ms-fluent/Add Circle (MIT)" }
  - { key: "]", mods: [CMDCTRL], icon: bringfront.png, label: "Bring to front", source: "material-symbols/flip_to_front (Apache-2.0)" }
  - { key: "[", mods: [CMDCTRL], icon: sendback.png,   label: "Send to back",   source: "material-symbols/flip_to_back (Apache-2.0)" }
  - { key: ".", mods: [CMDCTRL], icon: hideui.png,     label: "Show/hide UI",   source: "ms-fluent/Eye Off (MIT)" }
  - { key: EQUAL, mods: [CMDCTRL], icon: zoomin.png,    label: "Zoom in",   source: "ms-fluent/Zoom In (MIT)" }
  - { key: MINUS, mods: [CMDCTRL], icon: zoomout.png,   label: "Zoom out",  source: "ms-fluent/Zoom Out (MIT)" }
  - { key: "0",   mods: [CMDCTRL], icon: zoomreset.png, label: "Zoom 100%", source: "ms-fluent/Ratio One To One (MIT)" }

  # --- Ctrl+Shift ---
  - { key: Z,   mods: [CMDCTRL, SHIFT], icon: redo.png,          label: Redo,                source: "ms-fluent/Arrow Redo (MIT)" }
  - { key: L,   mods: [CMDCTRL, SHIFT], icon: lock.png,          label: "Lock/unlock",       source: "ms-fluent/Lock Closed (MIT)" }
  - { key: "1", mods: [CMDCTRL, SHIFT], icon: zoomfit.png,       label: "Zoom to fit",       source: "ms-fluent/Zoom Fit (MIT)" }
  - { key: "2", mods: [CMDCTRL, SHIFT], icon: zoomselection.png, label: "Zoom to selection", source: "ms-fluent/Select Object (MIT)" }

  # --- Ctrl+Alt ---
  - { key: D, mods: [CMDCTRL, ALT], icon: duplicate.png, label: Duplicate, source: "ms-fluent/Square Multiple (MIT)" }

  # --- Shift ---
  - { key: F, mods: [SHIFT], only: [windows, linux], icon: fullscreen.png, label: Fullscreen, source: "ms-fluent/Full Screen Maximize (MIT)" }
  # Atlassian's page gives Cmd+F for fullscreen on the Mac.
  - { key: F, mods: [CMDCTRL], only: [macos], icon: fullscreen.png, label: Fullscreen, source: "ms-fluent/Full Screen Maximize (MIT)" }
  - { key: M, mods: [SHIFT], icon: diffcomments.png, label: "Toggle comments", source: "ms-fluent/Comment Multiple (MIT)" }
