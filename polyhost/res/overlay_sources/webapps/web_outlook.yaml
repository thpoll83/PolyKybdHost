# Outlook on the web overlay for PolyKybd (shown while a browser has outlook.office.com or outlook.live.com open).
#
# Icons: Microsoft Fluent UI System Icons (MIT) via webapps/fetch_icons.py,
# replacing the earlier reclaimed hand-drawn owa_* set. The ESC mark
# (owa_mark.png) stays the reclaimed hand-drawn mark. Labels that name a shared
# concept (Copy, Paste, Undo, Bold, ...) are drawn by the shared renderer.
#
# Keys: Microsoft's "Keyboard shortcuts for Outlook", tab "Outlook on the web"
# (default shortcut set), transcribed 2026-10-16. See SOURCES.md -> Outlook on
# the web.
#
# macOS: the article lists Windows chords only. Single keys are kept on macOS.
# Ctrl chords that are the standard editor chords (bold, link, copy, ...) are
# Cmd there (CMDCTRL). Every other Ctrl or Alt chord is left off macOS: there is
# no confirmed Mac chord, and the Cmd version collides with the browser
# (Cmd+Q quits, Cmd+Shift+R reloads). Ctrl+R and Ctrl+Enter keep their earlier
# CMDCTRL binding.
#
# Regenerate (from the repo root, with the project venv):
#   PYTHONPATH=. .venv/bin/python polyhost/res/overlay_sources/webapps/fetch_icons.py
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/webapps/web_outlook.yaml --preview /tmp/web_outlook_preview
app: web_outlook
match: [chrome]
output: web_outlook_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: owa_mark.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_anchor: center
program_icon_margin: 0

bindings:
  # --- mail: single keys (message list and reading pane) ---
  - { key: N, mods: [],        icon: mailnew.png,      label: "New message",  source: "ms-fluent/Mail Add (MIT)" }
  - { key: R, mods: [],        icon: mailreply.png,    label: "Reply",        source: "ms-fluent/Arrow Reply (MIT)" }
  - { key: R, mods: [SHIFT],   icon: mailreplyall.png, label: "Reply all",    source: "ms-fluent/Arrow Reply All (MIT)" }
  - { key: F, mods: [SHIFT],   icon: mailforward.png,  label: "Forward",      source: "ms-fluent/Arrow Forward (MIT)" }
  - { key: E, mods: [],        icon: mailarchive.png,  label: "Archive",      source: "ms-fluent/Archive (MIT)" }
  - { key: Q, mods: [],        icon: mailread.png,     label: "Mark read",    source: "ms-fluent/Mail Read (MIT)" }
  - { key: U, mods: [],        icon: mailunread.png,   label: "Mark unread",  source: "ms-fluent/Mail Unread (MIT)" }
  - { key: DELETE, mods: [],   icon: delete.png,       label: "Delete",       source: "ms-fluent/Delete (MIT)" }
  - { key: DELETE, mods: [SHIFT], icon: deleteperm.png, label: "Delete permanently", source: "ms-fluent/Delete Dismiss (MIT)" }
  # Insert: no such key on a Mac keyboard, and the browser sees Help there.
  - { key: INSERT, mods: [],   icon: mailflag.png,     label: "Flag",         source: "ms-fluent/Flag (MIT)", except: [macos] }
  - { key: ENTER, mods: [SHIFT], icon: openwindow.png, label: "Open in new window", source: "ms-fluent/Window New (MIT)" }
  - { key: "/", mods: [SHIFT], icon: shortcuts.png,    label: "Keyboard shortcuts", source: "ms-fluent/Keyboard (MIT)" }

  # --- mail: Ctrl chords ---
  - { key: R, mods: [CMDCTRL], icon: mailreply.png,    label: "Reply",        source: "ms-fluent/Arrow Reply (MIT)" }
  - { key: ENTER, mods: [CMDCTRL], icon: submit.png,   label: "Send",         source: "ms-fluent/Send (MIT)" }
  - { key: R, mods: [CTRL, SHIFT], icon: mailreplyall.png, label: "Reply all", source: "ms-fluent/Arrow Reply All (MIT)", except: [macos] }
  - { key: F, mods: [CTRL, SHIFT], icon: mailforward.png,  label: "Forward",  source: "ms-fluent/Arrow Forward (MIT)", except: [macos] }
  - { key: Q, mods: [CTRL],    icon: mailread.png,     label: "Mark read",    source: "ms-fluent/Mail Read (MIT)", except: [macos] }
  # Ctrl+U is "Mark unread" in the message list and "Underline" in the editor.
  # Bare U already shows Mark unread, so Ctrl+U shows Underline (below).
  - { key: S, mods: [ALT],     icon: submit.png,       label: "Send",         source: "ms-fluent/Send (MIT)", except: [macos] }
  - { key: Q, mods: [ALT],     icon: search.png,       label: "Search",       source: "ms-fluent/Search (MIT)", except: [macos] }

  # --- switch module (Ctrl+Shift+number) ---
  - { key: "1", mods: [CTRL, SHIFT], icon: mailview.png,   label: "Mail",     source: "ms-fluent/Mail Inbox (MIT)", except: [macos] }
  - { key: "2", mods: [CTRL, SHIFT], icon: calview.png,    label: "Calendar", source: "ms-fluent/Calendar (MIT)", except: [macos] }
  - { key: "3", mods: [CTRL, SHIFT], icon: copilot.png,    label: "Copilot",  source: "ms-fluent/Sparkle (MIT)", except: [macos] }
  - { key: "4", mods: [CTRL, SHIFT], icon: peopleview.png, label: "People",   source: "ms-fluent/People (MIT)", except: [macos] }

  # --- calendar ---
  - { key: Y, mods: [ALT, SHIFT], icon: caltoday.png,    label: "Go to today", source: "ms-fluent/Calendar Today (MIT)", except: [macos] }
  - { key: "1", mods: [ALT, SHIFT], icon: calday.png,    label: "Day view",    source: "ms-fluent/Calendar Day (MIT)", except: [macos] }
  - { key: "2", mods: [ALT, SHIFT], icon: calworkweek.png, label: "Work week view", source: "ms-fluent/Calendar Work Week (MIT)", except: [macos] }
  - { key: "3", mods: [ALT, SHIFT], icon: calweek.png,   label: "Week view",   source: "ms-fluent/Calendar Week Numbers (MIT)", except: [macos] }
  - { key: "4", mods: [ALT, SHIFT], icon: calmonth.png,  label: "Month view",  source: "ms-fluent/Calendar Month (MIT)", except: [macos] }
  - { key: LEFT, mods: [CTRL, ALT],  icon: calprev.png,  label: "Previous day", source: "ms-fluent/Arrow Previous (MIT)", except: [macos] }
  - { key: RIGHT, mods: [CTRL, ALT], icon: calnext.png,  label: "Next day",     source: "ms-fluent/Arrow Next (MIT)", except: [macos] }

  # --- people ---
  - { key: N, mods: [SHIFT],   icon: newcontact.png,     label: "New contact",      source: "ms-fluent/Person Add (MIT)" }
  - { key: E, mods: [SHIFT],   icon: editcontact.png,    label: "Edit contact",     source: "ms-fluent/Person Edit (MIT)" }
  - { key: L, mods: [SHIFT],   icon: newcontactlist.png, label: "New contact list", source: "ms-fluent/People Add (MIT)" }

  # --- edit and format text (Cmd on macOS) ---
  - { key: S, mods: [CMDCTRL], icon: save.png,       label: "Save",       source: "ms-fluent/Save (MIT)" }
  - { key: K, mods: [CMDCTRL], icon: link.png,       label: "Hyperlink",  source: "ms-fluent/Link (MIT)" }
  - { key: B, mods: [CMDCTRL], icon: bold.png,       label: "Bold",       source: "ms-fluent/Text Bold (MIT)" }
  - { key: I, mods: [CMDCTRL], icon: italic.png,     label: "Italic",     source: "ms-fluent/Text Italic (MIT)" }
  - { key: U, mods: [CMDCTRL], icon: underline.png,  label: "Underline",  source: "ms-fluent/Text Underline (MIT)" }
  - { key: X, mods: [CMDCTRL], label: "Cut",        source: "concept (shared Fluent)" }
  - { key: C, mods: [CMDCTRL], label: "Copy",       source: "concept (shared Fluent)" }
  - { key: V, mods: [CMDCTRL], label: "Paste",      source: "concept (shared Fluent)" }
  - { key: Z, mods: [CMDCTRL], label: "Undo",       source: "concept (shared Fluent)" }
  # Ctrl+Y "Repeat the most recent action"; Cmd+Y is browser history on macOS.
  - { key: Y, mods: [CTRL],    label: "Redo",       source: "concept (shared Fluent)", except: [macos] }
  - { key: A, mods: [CMDCTRL], label: "Select all", source: "concept (shared Fluent)" }
