# Photopea (photopea.com) shortcut overlays for PolyKybd. See SOURCES.md.
#
# Keys: read from Photopea itself on 2026-11-05. The menu chords are the
# shortcut labels of every File/Edit/Image/Layer/Select/Filter/View menu entry
# (submenus included) with a document open; the tool letters are the letters
# in each toolbar group's tool list. X and D are from photopea.com/learn/workspace.
# Photopea moves the chords a browser keeps for itself: New is Ctrl+Alt+N and
# Free Transform is Ctrl+Alt+T, and Ctrl+Z is Step Backward. Photopea uses Cmd
# for Ctrl on macOS (CMDCTRL). Cmd+H and Cmd+M are left off the macOS set,
# because macOS hides or minimizes the browser before the page sees them, and
# so are Cmd+Shift+[ and ], which switch tabs in Chrome and Safari. New layer
# (Ctrl+Shift+N) is left out on every platform: the browser opens a private
# window and the page never sees the key.
#
# Icons: the Photoshop set (../photoshop/icons, icon_dir) where the action is
# the same; the menu commands Photoshop's set has no icon for are pp_*.png in
# this folder (fetch_icons.py, PHOTOPEA). ESC: Photopea's logo from Simple Icons
# (CC0 artwork), as for Linear and Overleaf.
#
# Regenerate:
#   python -m polyhost.res.overlay_sources.webapps.fetch_icons
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/webapps/photopea.yaml --preview /tmp/photopea_preview
app: photopea
match: [chrome]
output: photopea_template
icon_dir: ../photoshop/icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: ../../webapps/icons/photopea.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- tools (bare letters) ---
  - { key: V, mods: [], icon: move.png, label: "Move" }
  - { key: M, mods: [], icon: marquee.png, mode: alpha, label: "Rectangle / Ellipse select" }
  - { key: L, mods: [], icon: lasso.png, mode: alpha, label: "Lasso" }
  - { key: W, mods: [], icon: magicwand.png, mode: alpha, label: "Magic wand / Quick selection" }
  - { key: C, mods: [], icon: crop.png, label: "Crop" }
  - { key: I, mods: [], icon: eyedropper.png, label: "Eyedropper" }
  - { key: J, mods: [], icon: healing.png, mode: alpha, label: "Healing brush" }
  - { key: B, mods: [], icon: brush.png, label: "Brush" }
  - { key: S, mods: [], icon: clonestamp.png, mode: alpha, label: "Clone stamp" }
  - { key: E, mods: [], icon: eraser.png, label: "Eraser" }
  - { key: G, mods: [], icon: gradient.png, mode: alpha, label: "Gradient / Paint bucket" }
  - { key: O, mods: [], icon: dodgeburn.png, mode: alpha, label: "Dodge / Burn / Sponge" }
  - { key: T, mods: [], icon: type.png, label: "Type" }
  - { key: P, mods: [], icon: pen.png, label: "Pen" }
  - { key: A, mods: [], icon: pathselect.png, mode: alpha, label: "Path select" }
  - { key: U, mods: [], icon: shape.png, label: "Shape" }
  - { key: H, mods: [], icon: hand.png, label: "Hand" }
  - { key: R, mods: [], icon: ../../webapps/icons/rotateccw.png, label: "Rotate view" }
  - { key: Z, mods: [], icon: zoom.png, label: "Zoom" }
  - { key: X, mods: [], icon: swapcolors.png, mode: alpha, region: [72, 40], anchor: center, label: "Swap FG/BG" }
  - { key: D, mods: [], icon: defaultcolors.png, mode: alpha, label: "Default colours" }
  - { key: Q, mods: [], icon: quickmask.png, mode: alpha, label: "Quick mask" }

  # --- File ---
  - { key: N, mods: [CMDCTRL, ALT], icon: new.png, label: "New" }
  - { key: O, mods: [CMDCTRL], icon: open.png, label: "Open" }
  - { key: O, mods: [CMDCTRL, ALT], icon: ../../webapps/icons/pp_storage.png, label: "Open from storage" }
  - { key: S, mods: [CMDCTRL], icon: save.png, label: "Save" }
  - { key: P, mods: [CMDCTRL], icon: print.png, label: "Print" }

  # --- Edit ---
  - { key: Z, mods: [CMDCTRL], icon: undo.png, label: "Undo" }
  - { key: Z, mods: [CMDCTRL, SHIFT], icon: redo.png, label: "Redo" }
  - { key: F, mods: [CMDCTRL, SHIFT], icon: ../../webapps/icons/pp_fade.png, label: "Fade" }
  - { key: X, mods: [CMDCTRL], icon: cut.png, label: "Cut" }
  - { key: C, mods: [CMDCTRL], icon: copy.png, label: "Copy" }
  - { key: C, mods: [CMDCTRL, SHIFT], icon: copymerged.png, label: "Copy merged" }
  - { key: V, mods: [CMDCTRL], icon: paste.png, label: "Paste" }
  - { key: F5, mods: [SHIFT], icon: fill.png, label: "Fill" }
  - { key: T, mods: [CMDCTRL, ALT], icon: freetransform.png, label: "Free transform" }
  - { key: K, mods: [CMDCTRL], icon: ../../webapps/icons/settings.png, label: "Preferences" }

  # --- Image ---
  - { key: L, mods: [CMDCTRL], icon: levels.png, label: "Levels" }
  - { key: M, mods: [CMDCTRL], except: [macos], icon: curves.png, label: "Curves" }
  - { key: U, mods: [CMDCTRL], icon: huesat.png, label: "Hue / Saturation" }
  - { key: B, mods: [CMDCTRL], icon: colorbalance.png, label: "Color balance" }
  - { key: I, mods: [CMDCTRL], icon: invert.png, label: "Invert" }
  - { key: U, mods: [CMDCTRL, SHIFT], icon: desaturate.png, label: "Desaturate" }
  - { key: C, mods: [CMDCTRL, ALT], icon: ../../webapps/icons/pp_canvassize.png, label: "Canvas size" }
  - { key: I, mods: [CMDCTRL, ALT], icon: ../../webapps/icons/pp_imagesize.png, label: "Image size" }
  - { key: DOT, mods: [CMDCTRL], icon: ../../webapps/icons/pp_trim.png, label: "Trim" }

  # --- Layer ---
  - { key: J, mods: [CMDCTRL], icon: duplayer.png, label: "Layer via copy" }
  - { key: J, mods: [CMDCTRL, SHIFT], icon: newlayer.png, label: "Layer via cut" }
  - { key: G, mods: [CMDCTRL, ALT], icon: ../../webapps/icons/pp_clipmask.png, label: "Clipping mask" }
  - { key: G, mods: [CMDCTRL], icon: group.png, label: "Group layers" }
  - { key: "]", mods: [CMDCTRL, SHIFT], except: [macos], icon: ../../webapps/icons/bringfront.png, label: "Bring to front" }
  - { key: "]", mods: [CMDCTRL], icon: ../../webapps/icons/pp_forward.png, label: "Bring forward" }
  - { key: "[", mods: [CMDCTRL], icon: ../../webapps/icons/pp_backward.png, label: "Send backward" }
  - { key: "[", mods: [CMDCTRL, SHIFT], except: [macos], icon: ../../webapps/icons/sendback.png, label: "Send to back" }
  - { key: E, mods: [CMDCTRL], icon: mergedown.png, label: "Merge down" }

  # --- Select ---
  - { key: A, mods: [CMDCTRL], icon: selectall.png, label: "Select all" }
  - { key: D, mods: [CMDCTRL], icon: deselect.png, label: "Deselect" }
  - { key: I, mods: [CMDCTRL, SHIFT], icon: invertsel.png, label: "Inverse selection" }
  - { key: F6, mods: [SHIFT], icon: feather.png, label: "Feather selection" }

  # --- Filter ---
  - { key: F, mods: [CMDCTRL, ALT], icon: ../../webapps/icons/pp_lastfilter.png, label: "Last filter" }
  - { key: A, mods: [CMDCTRL, SHIFT], icon: ../../webapps/icons/pp_cameraraw.png, label: "Camera Raw" }

  # --- View ---
  - { key: EQUAL, mods: [CMDCTRL], icon: zoomin.png, label: "Zoom in" }
  - { key: MINUS, mods: [CMDCTRL], icon: zoomout.png, label: "Zoom out" }
  - { key: "0", mods: [CMDCTRL], icon: fitscreen.png, label: "Fit the area" }
  - { key: "1", mods: [CMDCTRL], icon: zoom1to1.png, label: "Zoom 100%" }
  - { key: H, mods: [CMDCTRL], except: [macos], icon: extras.png, label: "Extras" }
  - { key: SEMICOLON, mods: [CMDCTRL], icon: ../../webapps/icons/pp_guides.png, label: "Guides" }
  - { key: QUOTE, mods: [CMDCTRL], icon: ../../webapps/icons/dio_grid.png, label: "Grid" }
  - { key: R, mods: [CMDCTRL], icon: rulers.png, label: "Rulers" }
