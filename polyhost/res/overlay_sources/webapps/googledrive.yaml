# Google Drive (in-browser) shortcut overlays for PolyKybd. See SOURCES.md.
# GENERATED by gen_google_specs.py from its table -- edit the table, not this file.
#
# Shortcuts: the PC and Mac tables of Google's help page
# https://support.google.com/drive/answer/2563044
# Drive's single keys (/ to search, F2, Delete) are included; they act only
# when no text field has focus. The two-key sequences (Alt+G then N, Alt+C
# then T, ...), the arrow-key selection keys and the preview-only keys are
# left out. Copy and Paste are not in Google's table; Drive added them in 2022.
#
# Regenerate:
#   python polyhost/res/overlay_sources/webapps/fetch_icons.py
#   python polyhost/res/overlay_sources/webapps/gen_google_specs.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/webapps/googledrive.yaml --preview /tmp/googledrive_preview
app: googledrive
match: [googledrive]
output: googledrive_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: gdrive.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:

  - { key: SLASH, mods: [CMDCTRL], icon: shortcuts.png, label: "Keyboard shortcuts" }
  - { key: SLASH, icon: search.png, label: "Search Drive" }
  - { key: F, mods: [CMDCTRL], icon: find.png, label: "Find" }
  - { key: P, mods: [CMDCTRL], icon: print.png, label: "Print" }
  - { key: Z, mods: [CMDCTRL], label: "Undo" }
  - { key: Y, mods: [CMDCTRL], label: "Redo" }
  - { key: A, mods: [CMDCTRL], label: "Select all" }
  - { key: ENTER, mods: [CMDCTRL], icon: newtab.png, label: "Open in new tab" }
  - { key: F2, icon: rename.png, label: "Rename" }
  - { key: A, mods: [CTRL, ALT], icon: share.png, label: "Share", except: [macos] }
  - { key: A, mods: [ALT, GUI], icon: share.png, label: "Share", only: [macos] }
  - { key: M, mods: [CTRL, ALT], icon: gdr_movefolder.png, label: "Move to new folder", except: [macos] }
  - { key: M, mods: [ALT, GUI], icon: gdr_movefolder.png, label: "Move to new folder", only: [macos] }
  - { key: S, mods: [CTRL, ALT], icon: starred.png, label: "Star or unstar", except: [macos] }
  - { key: S, mods: [ALT, GUI], icon: starred.png, label: "Star or unstar", only: [macos] }
  - { key: R, mods: [CTRL, ALT], icon: gdr_shortcut.png, label: "Create shortcut", except: [macos] }
  - { key: R, mods: [ALT, GUI], icon: gdr_shortcut.png, label: "Create shortcut", only: [macos] }
  - { key: DELETE, icon: delete.png, label: "Remove" }
  - { key: L, mods: [CTRL, ALT], icon: link.png, label: "Copy links", except: [macos] }
  - { key: L, mods: [ALT, GUI], icon: link.png, label: "Copy links", only: [macos] }
  - { key: C, mods: [CMDCTRL, SHIFT], icon: gdr_copytitle.png, label: "Copy titles" }
  - { key: C, mods: [CMDCTRL], label: "Copy" }
  - { key: X, mods: [CMDCTRL], label: "Cut" }
  - { key: V, mods: [CMDCTRL], label: "Paste" }
  - { key: V, mods: [CMDCTRL, SHIFT], icon: gdr_pasteshortcut.png, label: "Paste as shortcut" }
  - { key: P, mods: [CTRL, ALT], icon: preview.png, label: "Preview", except: [macos] }
  - { key: P, mods: [ALT, GUI], icon: preview.png, label: "Preview", only: [macos] }
  - { key: N, mods: [ALT], icon: gdr_create.png, label: "Create menu", except: [macos] }
  - { key: N, mods: [CTRL], icon: gdr_create.png, label: "Create menu", only: [macos] }
  - { key: A, mods: [ALT], icon: actions.png, label: "More actions", except: [macos] }
  - { key: A, mods: [CTRL], icon: actions.png, label: "More actions", only: [macos] }
  - { key: F10, mods: [SHIFT], icon: actions.png, label: "More actions" }
  - { key: A, mods: [ALT, SHIFT], icon: gdr_foldermenu.png, label: "Folder actions", except: [macos] }
  - { key: A, mods: [CTRL, SHIFT], icon: gdr_foldermenu.png, label: "Folder actions", only: [macos] }
  - { key: R, mods: [ALT], icon: sortorder.png, label: "Sort menu", except: [macos] }
  - { key: R, mods: [CTRL], icon: sortorder.png, label: "Sort menu", only: [macos] }
  - { key: S, mods: [CMDCTRL, SHIFT], icon: settings.png, label: "Settings menu" }
