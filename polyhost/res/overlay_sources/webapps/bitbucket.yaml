# Bitbucket pull request overlay for PolyKybd (shown while a browser has a Bitbucket pull request open).
#
# All artwork is RECLAIMED: the previously hand-drawn set, cut pixel-for-pixel
# out of the old PNGs and rendered 1:1, so the Windows/Linux set is unchanged.
# Submit is Cmd+Enter on macOS (CMDCTRL); every other binding is a bare or Shift key.
#
# Regenerate (from the repo root, with the project venv):
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/webapps/bitbucket.yaml --preview /tmp/bitbucket_preview
app: bitbucket
match: [chrome]
output: bitbucket_pr_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

program_icon: bitbucket_mark.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_anchor: center
program_icon_margin: 0

_r: &r { region: [72, 40], anchor: center, source: reclaimed }

bindings:
  - { key: ENTER, mods: [CMDCTRL], icon: bb_submit.png, <<: *r, label: "Submit comment" }
  - { key: C, mods: [SHIFT], icon: bb_comments.png, <<: *r, label: "Toggle comments" }
  - { key: D, mods: [SHIFT], icon: bb_sidebyside.png, <<: *r, label: "Side-by-side diff" }
  - { key: E, mods: [SHIFT], icon: bb_expand.png, <<: *r, label: "Expand all" }
  - { key: L, mods: [SHIFT], icon: bb_wrap.png, <<: *r, label: "Wrap lines" }
  - { key: W, mods: [SHIFT], icon: bb_whitespace.png, <<: *r, label: "Ignore whitespace" }
  - { key: "/", mods: [SHIFT], icon: bb_help.png, <<: *r, label: "Shortcut help" }
  - { key: A, mods: [], icon: bb_approve.png, <<: *r, label: "Approve" }
  - { key: E, mods: [], icon: bb_edit.png, <<: *r, label: "Edit" }
  - { key: M, mods: [], icon: bb_comment.png, <<: *r, label: "Comment" }
  - { key: U, mods: [], icon: bb_filelist.png, <<: *r, label: "File list" }
  - { key: W, mods: [], icon: bb_watch.png, <<: *r, label: "Watch" }
  - { key: "[", mods: [], icon: bb_sidebar.png, <<: *r, label: "Toggle sidebar" }
  - { key: "/", mods: [], icon: bb_search.png, <<: *r, label: "Search" }
