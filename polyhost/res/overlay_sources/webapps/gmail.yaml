# Gmail (in-browser) shortcut overlays for PolyKybd. See SOURCES.md.
# GENERATED by gen_google_specs.py from its table -- edit the table, not this file.
#
# Shortcuts: the PC and Mac tables of Google's help page
# https://support.google.com/mail/answer/6594
# Gmail's single keys are included. They work only after the user turns
# "Keyboard shortcuts on" in Gmail's settings, and only when no text field has
# focus. Keys that need Shift on a US layout (! # _ : ~ * + ?) and the two-key
# sequences (g then i, * then a) are left out.
#
# Regenerate:
#   python polyhost/res/overlay_sources/webapps/fetch_icons.py
#   python polyhost/res/overlay_sources/webapps/gen_google_specs.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/webapps/gmail.yaml --preview /tmp/gmail_preview
app: gmail
match: [gmail]
output: gmail_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: gmail.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:

  - { key: X, icon: gm_select.png, label: "Select conversation" }
  - { key: S, icon: gm_star.png, label: "Star" }
  - { key: E, icon: gm_archive.png, label: "Archive" }
  - { key: M, icon: gm_mute.png, label: "Mute conversation" }
  - { key: R, icon: gm_reply.png, label: "Reply" }
  - { key: R, mods: [SHIFT], icon: gm_newwindow.png, label: "Reply in new window" }
  - { key: A, icon: gm_replyall.png, label: "Reply all" }
  - { key: A, mods: [SHIFT], icon: gm_newwindow.png, label: "Reply all in new window" }
  - { key: F, icon: gm_forward.png, label: "Forward" }
  - { key: F, mods: [SHIFT], icon: gm_newwindow.png, label: "Forward in new window" }
  - { key: N, mods: [SHIFT], icon: gm_update.png, label: "Update conversation" }
  - { key: LBRACKET, icon: gm_archprev.png, label: "Archive, previous" }
  - { key: RBRACKET, icon: gm_archnext.png, label: "Archive, next" }
  - { key: Z, label: "Undo" }
  - { key: I, mods: [SHIFT], icon: gm_read.png, label: "Mark as read" }
  - { key: U, mods: [SHIFT], icon: gm_unread.png, label: "Mark as unread" }
  - { key: EQUAL, icon: gm_important.png, label: "Mark as important" }
  - { key: MINUS, icon: gm_notimportant.png, label: "Mark as not important" }
  - { key: B, icon: gm_snooze.png, label: "Snooze" }
  - { key: SEMICOLON, icon: gm_expand.png, label: "Expand conversation" }
  - { key: T, mods: [SHIFT], icon: gm_addtask.png, label: "Add to Tasks" }
  - { key: U, icon: gm_list.png, label: "Back to list" }
  - { key: K, icon: gm_newer.png, label: "Newer conversation" }
  - { key: J, icon: gm_older.png, label: "Older conversation" }
  - { key: O, icon: openlink.png, label: "Open conversation" }
  - { key: P, icon: gm_prevmsg.png, label: "Previous message" }
  - { key: N, icon: gm_nextmsg.png, label: "Next message" }
  - { key: C, icon: mailnew.png, label: "Compose" }
  - { key: D, icon: newtab.png, label: "Compose in new tab" }
  - { key: SLASH, icon: search.png, label: "Search mail" }
  - { key: DOT, icon: gm_more.png, label: "More actions" }
  - { key: V, icon: gm_move.png, label: "Move to" }
  - { key: L, icon: gm_label.png, label: "Label as" }
  - { key: COMMA, icon: compact.png, label: "Focus toolbar" }
  - { key: DOT, mods: [CTRL], icon: nextchat.png, label: "Next chat or compose", except: [macos] }
  - { key: DOT, mods: [CTRL], icon: nextchat.png, label: "Next chat or compose", only: [macos] }
  - { key: COMMA, mods: [CTRL], icon: prevchat.png, label: "Previous chat or compose", except: [macos] }
  - { key: COMMA, mods: [CTRL], icon: prevchat.png, label: "Previous chat or compose", only: [macos] }
  - { key: ENTER, mods: [CMDCTRL], icon: submit.png, label: "Send", shared: false }
  - { key: C, mods: [CMDCTRL, SHIFT], icon: addcc.png, label: "Add Cc" }
  - { key: B, mods: [CMDCTRL, SHIFT], icon: addbcc.png, label: "Add Bcc" }
  - { key: F, mods: [CMDCTRL, SHIFT], icon: fromaddr.png, label: "Change From" }
  - { key: K, mods: [CMDCTRL], icon: link.png, label: "Insert link" }
  - { key: M, mods: [CTRL], icon: spelling.png, label: "Spelling suggestions", except: [macos] }
  - { key: SEMICOLON, mods: [GUI], icon: nextspell.png, label: "Next misspelling", only: [macos] }
  - { key: "5", mods: [CMDCTRL, SHIFT], icon: prevfont.png, label: "Previous font" }
  - { key: "6", mods: [CMDCTRL, SHIFT], icon: nextfont.png, label: "Next font" }
  - { key: MINUS, mods: [CMDCTRL, SHIFT], icon: fontdec.png, label: "Smaller text" }
  - { key: EQUAL, mods: [CMDCTRL, SHIFT], icon: fontinc.png, label: "Larger text" }
  - { key: B, mods: [CMDCTRL], label: "Bold" }
