  - { key: LBRACKET, mods: [CMDCTRL], icon: outdent.png, label: "Outdent" }
  - { key: RBRACKET, mods: [CMDCTRL], icon: indent.png, label: "Indent" }
  - { key: L, mods: [CMDCTRL, SHIFT], icon: alignleft.png, label: "Align left" }
  - { key: E, mods: [CMDCTRL, SHIFT], icon: aligncenter.png, label: "Align center" }
  - { key: R, mods: [CMDCTRL, SHIFT], icon: alignright.png, label: "Align right" }
  - { key: BACKSLASH, mods: [CMDCTRL], icon: clearfmt.png, label: "Remove formatting" }
  - { key: DOT, mods: [CTRL, ALT], icon: sidepanel.png, label: "Side panel", except: [macos] }
  - { key: DOT, mods: [ALT, GUI], icon: sidepanel.png, label: "Side panel", only: [macos] }
  - { key: COMMA, mods: [CTRL, ALT], icon: sidepanel.png, label: "Side panel", except: [macos] }
  - { key: COMMA, mods: [ALT, GUI], icon: sidepanel.png, label: "Side panel", only: [macos] }
