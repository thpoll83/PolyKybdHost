# Gmail (in-browser) shortcut overlays for PolyKybd. See SOURCES.md.
# GENERATED by gen_google_specs.py from its table -- edit the table, not this file.
#
# Shortcuts: the PC and Mac tables of Google's help page
# https://support.google.com/mail/answer/6594
# Bare letters, digits and Shift+letter keys are left out: they would replace
# the letter legends while the user types.
#
# Regenerate:
#   python polyhost/res/overlay_sources/webapps/fetch_icons.py
#   python polyhost/res/overlay_sources/webapps/gen_google_specs.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/webapps/gmail.yaml --preview /tmp/gmail_preview
app: gmail
match: [gmail]
output: gmail_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: gmail.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:

  - { key: DOT, mods: [CTRL], icon: nextchat.png, label: "Next chat or compose", except: [macos] }
  - { key: DOT, mods: [CTRL], icon: nextchat.png, label: "Next chat or compose", only: [macos] }
  - { key: COMMA, mods: [CTRL], icon: prevchat.png, label: "Previous chat or compose", except: [macos] }
  - { key: COMMA, mods: [CTRL], icon: prevchat.png, label: "Previous chat or compose", only: [macos] }
  - { key: ENTER, mods: [CMDCTRL], icon: submit.png, label: "Send", shared: false }
  - { key: C, mods: [CMDCTRL, SHIFT], icon: addcc.png, label: "Add Cc" }
  - { key: B, mods: [CMDCTRL, SHIFT], icon: addbcc.png, label: "Add Bcc" }
  - { key: F, mods: [CMDCTRL, SHIFT], icon: fromaddr.png, label: "Change From" }
  - { key: K, mods: [CMDCTRL], icon: link.png, label: "Insert link" }
  - { key: M, mods: [CTRL], icon: spelling.png, label: "Spelling suggestions", except: [macos] }
  - { key: SEMICOLON, mods: [GUI], icon: nextspell.png, label: "Next misspelling", only: [macos] }
  - { key: "5", mods: [CMDCTRL, SHIFT], icon: prevfont.png, label: "Previous font" }
  - { key: "6", mods: [CMDCTRL, SHIFT], icon: nextfont.png, label: "Next font" }
  - { key: MINUS, mods: [CMDCTRL, SHIFT], icon: fontdec.png, label: "Smaller text" }
  - { key: EQUAL, mods: [CMDCTRL, SHIFT], icon: fontinc.png, label: "Larger text" }
  - { key: B, mods: [CMDCTRL], label: "Bold" }
  - { key: I, mods: [CMDCTRL], label: "Italic" }
  - { key: U, mods: [CMDCTRL], label: "Underline" }
  - { key: "7", mods: [CMDCTRL, SHIFT], icon: numberlist.png, label: "Numbered list" }
  - { key: "8", mods: [CMDCTRL, SHIFT], icon: bulletlist.png, label: "Bulleted list" }
  - { key: "9", mods: [CMDCTRL, SHIFT], icon: quote.png, label: "Quote" }
  - { key: LBRACKET, mods: [CMDCTRL], icon: outdent.png, label: "Outdent" }
  - { key: RBRACKET, mods: [CMDCTRL], icon: indent.png, label: "Indent" }
  - { key: L, mods: [CMDCTRL, SHIFT], icon: alignleft.png, label: "Align left" }
  - { key: E, mods: [CMDCTRL, SHIFT], icon: aligncenter.png, label: "Align center" }
  - { key: R, mods: [CMDCTRL, SHIFT], icon: alignright.png, label: "Align right" }
  - { key: BACKSLASH, mods: [CMDCTRL], icon: clearfmt.png, label: "Remove formatting" }
  - { key: DOT, mods: [CTRL, ALT], icon: sidepanel.png, label: "Side panel", except: [macos] }
  - { key: DOT, mods: [ALT, GUI], icon: sidepanel.png, label: "Side panel", only: [macos] }
  - { key: COMMA, mods: [CTRL, ALT], icon: sidepanel.png, label: "Side panel", except: [macos] }
  - { key: COMMA, mods: [ALT, GUI], icon: sidepanel.png, label: "Side panel", only: [macos] }
