# GitHub (in-browser) shortcut overlays for PolyKybd.
#
# Icons: Microsoft Fluent UI System Icons (MIT); ESC program mark drawn
# GitHub's own monochrome mark via Simple Icons (CC0, ../brand_marks.py).
# Shortcuts: GitHub's own docs.
# See SOURCES.md.
#
# Wired under the browser entry via `urls-contains: github.com` - there is no
# GitHub process to match on. The two-key "g then c" chord shortcuts are
# deliberately absent (an overlay cell shows one keypress).
#
# Regenerate:
#   python polyhost/res/overlay_sources/webapps/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/webapps/github.yaml --preview /tmp/gh_preview
app: github
match: [github]
output: github_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: gh.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [42, 34]
program_icon_margin: 0

bindings:
  # --- single keys (no modifier): GitHub is a single-key-driven site ---
  - { key: S, mods: [], icon: search.png,      label: "Focus search",   source: "ms-fluent/Search (MIT)" }
  - { key: "/", mods: [], icon: search.png,    label: "Focus search",   source: "ms-fluent/Search (MIT)" }
  - { key: T, mods: [], icon: filefinder.png,  label: "File finder",    source: "ms-fluent/Document Search (MIT)" }
  - { key: W, mods: [], icon: branch.png,      label: "Switch branch / tag", source: "ms-fluent/Branch (MIT)" }
  - { key: B, mods: [], icon: blame.png,       label: "Blame view",     source: "ms-fluent/History (MIT)" }
  - { key: Y, mods: [], icon: canonical.png,   label: "Canonical link", source: "ms-fluent/Link (MIT)" }
  - { key: ".", mods: [], icon: webide.png,    label: "Open github.dev", source: "ms-fluent/Code (MIT)" }
  - { key: C, mods: [], icon: createissue.png, label: "Create issue",   source: "ms-fluent/Add Circle (MIT)" }
  - { key: O, mods: [], icon: openitem.png,    label: "Open issue",     source: "ms-fluent/Open (MIT)" }
  - { key: E, mods: [], icon: edit.png,        label: "Edit file",      source: "ms-fluent/Document Edit (MIT)" }
  - { key: Q, mods: [], icon: reviewer.png,    label: "Request reviewer", source: "ms-fluent/Person Add (MIT)" }
  - { key: A, mods: [], icon: assignee.png,    label: "Set assignee",   source: "ms-fluent/Person (MIT)" }
  - { key: L, mods: [], icon: label.png,       label: "Apply label",    source: "ms-fluent/Tag (MIT)" }
  - { key: M, mods: [], icon: milestone.png,   label: "Set milestone",  source: "ms-fluent/Flag (MIT)" }
  - { key: I, mods: [], icon: diffcomments.png, label: "Show / hide diff comments", source: "ms-fluent/Comment Multiple (MIT)" }

  # --- Shift ---
  - { key: "/", mods: [SHIFT], icon: shortcuts.png, label: "Show shortcuts", source: "ms-fluent/Keyboard (MIT)" }
  - { key: ".", mods: [SHIFT], icon: webide.png,    label: "github.dev (new tab)", source: "ms-fluent/Code (MIT)" }

  # --- Ctrl: the comment editor ---
  - { key: B, mods: [CTRL], icon: bold.png,   label: "Bold (comment)",   source: "ms-fluent/Text Bold (MIT)" }
  - { key: I, mods: [CTRL], icon: italic.png, label: "Italic (comment)", source: "ms-fluent/Text Italic (MIT)" }
  - { key: K, mods: [CTRL], icon: link.png,   label: "Link (comment)",   source: "ms-fluent/Link (MIT)" }
  - { key: ENTER, mods: [CTRL], icon: submit.png, label: "Submit comment", source: "ms-fluent/Send (MIT)" }

  # --- Ctrl+Shift ---
  - { key: P, mods: [CTRL, SHIFT], icon: preview.png, label: "Toggle Write / Preview", source: "ms-fluent/Eye (MIT)" }
