# Google Keep (in-browser) shortcut overlays for PolyKybd. See SOURCES.md.
# GENERATED by gen_google_specs.py from its table -- edit the table, not this file.
#
# Shortcuts: the PC and Mac tables of Google's help page
# https://support.google.com/keep/answer/12862970
# Keep's single keys are included: they are on by default and act only
# when no text field has focus.
#
# Regenerate:
#   python polyhost/res/overlay_sources/webapps/fetch_icons.py
#   python polyhost/res/overlay_sources/webapps/gen_google_specs.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/webapps/googlekeep.yaml --preview /tmp/googlekeep_preview
app: googlekeep
match: [googlekeep]
output: googlekeep_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: gkeep.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:

  - { key: J, icon: keep_nextnote.png, label: "Next note" }
  - { key: K, icon: keep_prevnote.png, label: "Previous note" }
  - { key: J, mods: [SHIFT], icon: keep_movenote_down.png, label: "Move note down" }
  - { key: K, mods: [SHIFT], icon: keep_movenote_up.png, label: "Move note up" }
  - { key: N, icon: keep_nextitem.png, label: "Next list item" }
  - { key: P, icon: keep_previtem.png, label: "Previous list item" }
  - { key: N, mods: [SHIFT], icon: keep_moveitem_down.png, label: "Move list item down" }
  - { key: P, mods: [SHIFT], icon: keep_moveitem_up.png, label: "Move list item up" }
  - { key: C, icon: keep_newnote.png, label: "New note" }
  - { key: L, icon: keep_newlist.png, label: "New list" }
  - { key: SLASH, icon: search.png, label: "Search notes", concept: find }
  - { key: A, mods: [CMDCTRL], label: "Select all" }
  - { key: E, icon: keep_archive.png, label: "Archive note" }
  - { key: F, icon: keep_pin.png, label: "Pin or unpin" }
  - { key: X, icon: keep_select.png, label: "Select note" }
  - { key: ENTER, icon: keep_open.png, label: "Open note" }
  - { key: G, mods: [CMDCTRL], icon: keep_view.png, label: "List or grid view" }
  - { key: ENTER, mods: [CMDCTRL], icon: keep_done.png, label: "Finish editing" }
  - { key: "8", mods: [CMDCTRL, SHIFT], icon: keep_checkboxes.png, label: "Toggle checkboxes" }
  - { key: RBRACKET, mods: [CMDCTRL], icon: indent.png, label: "Indent list item" }
  - { key: LBRACKET, mods: [CMDCTRL], icon: outdent.png, label: "Dedent list item" }
