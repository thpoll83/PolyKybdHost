# GitLab (in-browser) shortcut overlays for PolyKybd. See SOURCES.md.
#
# Regenerate:
#   python polyhost/res/overlay_sources/webapps/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/webapps/gitlab.yaml --preview /tmp/gl_preview
app: gitlab
match: [gitlab]
output: gitlab_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: gl.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [42, 34]
program_icon_margin: 0

bindings:
  # --- single keys (no modifier) ---
  - { key: S, mods: [], icon: search.png,     label: "Focus search",  source: "ms-fluent/Search (MIT)" }
  - { key: "/", mods: [], icon: search.png,   label: "Focus search",  source: "ms-fluent/Search (MIT)" }
  - { key: T, mods: [], icon: filefinder.png, label: "Project file search", source: "ms-fluent/Document Search (MIT)" }
  - { key: ".", mods: [], icon: webide.png,   label: "Open Web IDE",  source: "ms-fluent/Code (MIT)" }
  - { key: E, mods: [], icon: edit.png,       label: "Edit description", source: "ms-fluent/Document Edit (MIT)" }
  - { key: R, mods: [], icon: addcomment.png, label: "Reply / comment", source: "ms-fluent/Chat Add (MIT)" }
  - { key: A, mods: [], icon: assignee.png,   label: "Change assignee", source: "ms-fluent/Person (MIT)" }
  - { key: M, mods: [], icon: milestone.png,  label: "Change milestone", source: "ms-fluent/Flag (MIT)" }
  - { key: L, mods: [], icon: label.png,      label: "Change label",  source: "ms-fluent/Tag (MIT)" }
  # merge-request review
  - { key: J, mods: [], icon: nextfile.png,   label: "Next file",     source: "ms-fluent/Chevron Right (MIT)" }
  - { key: K, mods: [], icon: prevfile.png,   label: "Previous file", source: "ms-fluent/Chevron Left (MIT)" }
  - { key: "]", mods: [], icon: nextfile.png, label: "Next file",     source: "ms-fluent/Chevron Right (MIT)" }
  - { key: "[", mods: [], icon: prevfile.png, label: "Previous file", source: "ms-fluent/Chevron Left (MIT)" }
  - { key: N, mods: [], icon: nextthread.png, label: "Next open thread", source: "ms-fluent/Arrow Down (MIT)" }
  - { key: P, mods: [], icon: prevthread.png, label: "Previous open thread", source: "ms-fluent/Arrow Up (MIT)" }

  # --- Shift ---
  - { key: F, mods: [SHIFT], icon: filebrowser.png, label: "Toggle file browser", source: "ms-fluent/Folder Open (MIT)" }
  - { key: "/", mods: [SHIFT], icon: shortcuts.png, label: "Show shortcuts",      source: "ms-fluent/Keyboard (MIT)" }

  # --- Ctrl ---
  - { key: ENTER, mods: [CTRL], icon: submit.png, label: "Submit / save changes", source: "ms-fluent/Send (MIT)" }

  # --- Ctrl+Shift ---
  - { key: P, mods: [CTRL, SHIFT], icon: preview.png, label: "Toggle Markdown preview", source: "ms-fluent/Eye (MIT)" }
