# Notion shortcut overlays for PolyKybd. See SOURCES.md.
#
# Notion is wired BOTH ways: a native mapping entry for the desktop app
# (`notion`) and a browser `urls-contains: notion.so` entry, so the overlay
# loads whichever way the user runs it.
#
# Regenerate:
#   python polyhost/res/overlay_sources/webapps/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/webapps/notion.yaml --preview /tmp/nt_preview
app: notion
match: [notion]
output: notion_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: nt.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- Ctrl ---
  - { key: N, mods: [CTRL], icon: newpage.png,  label: "New page",       source: "ms-fluent/Document Add (MIT)" }
  - { key: P, mods: [CTRL], icon: search.png,   label: "Search / jump to", source: "ms-fluent/Search (MIT)" }
  - { key: K, mods: [CTRL], icon: link.png,     label: "Add link",       source: "ms-fluent/Link (MIT)" }
  - { key: F, mods: [CTRL], icon: find.png,     label: "Search in page", source: "ms-fluent/Search (MIT)" }
  - { key: L, mods: [CTRL], icon: canonical.png, label: "Copy page URL", source: "ms-fluent/Link (MIT)" }
  - { key: D, mods: [CTRL], icon: duplicate.png, label: Duplicate,       source: "ms-fluent/Square Multiple (MIT)" }
  - { key: B, mods: [CTRL], icon: bold.png,     label: Bold,             source: "ms-fluent/Text Bold (MIT)" }
  - { key: I, mods: [CTRL], icon: italic.png,   label: Italic,           source: "ms-fluent/Text Italic (MIT)" }
  - { key: U, mods: [CTRL], icon: underline.png, label: Underline,       source: "ms-fluent/Text Underline (MIT)" }
  - { key: E, mods: [CTRL], icon: code.png,     label: "Inline code",    source: "ms-fluent/Code (MIT)" }
  - { key: Z, mods: [CTRL], icon: undo.png,     label: Undo,             source: "ms-fluent/Arrow Undo (MIT)" }
  - { key: "[", mods: [CTRL], icon: back.png,   label: Back,             source: "ms-fluent/Arrow Left (MIT)" }
  - { key: "]", mods: [CTRL], icon: forward.png, label: Forward,         source: "ms-fluent/Arrow Right (MIT)" }
  - { key: "/", mods: [CTRL], icon: commandpalette.png, label: "Edit selected blocks", source: "ms-fluent/Apps List Detail (MIT)" }

  # --- Ctrl+Shift ---
  - { key: N, mods: [CTRL, SHIFT], icon: newtab.png,       label: "New window",   source: "ms-fluent/Tab Desktop (MIT)" }
  - { key: L, mods: [CTRL, SHIFT], icon: darkmode.png,     label: "Toggle dark mode", source: "ms-fluent/Weather Moon (MIT)" }
  - { key: S, mods: [CTRL, SHIFT], icon: strikethrough.png, label: Strikethrough, source: "ms-fluent/Text Strikethrough (MIT)" }
  - { key: M, mods: [CTRL, SHIFT], icon: addcomment.png,   label: "Create comment", source: "ms-fluent/Chat Add (MIT)" }
  - { key: UP,   mods: [CTRL, SHIFT], icon: prevthread.png, label: "Move block up",   source: "ms-fluent/Arrow Up (MIT)" }
  - { key: DOWN, mods: [CTRL, SHIFT], icon: nextthread.png, label: "Move block down", source: "ms-fluent/Arrow Down (MIT)" }

  # --- no modifier ---
  - { key: TAB, mods: [], icon: indent.png, label: "Indent / nest", source: "ms-fluent/Text Indent Increase (MIT)" }
  - { key: TAB, mods: [SHIFT], icon: outdent.png, label: Outdent,    source: "ms-fluent/Text Indent Decrease (MIT)" }
