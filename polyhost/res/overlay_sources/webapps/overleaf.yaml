# Overleaf (overleaf.com) shortcut overlays for PolyKybd. See SOURCES.md.
#
# Keys: Overleaf's "Keyboard shortcuts" page
# (docs.overleaf.com/navigating-in-the-editor/keyboard-shortcuts) and the editor
# key map in Overleaf's source (services/web/frontend/js/features/
# source-editor/extensions/shortcuts.ts). `Mod` there is `CMDCTRL`; keys the
# source binds to Ctrl stay Ctrl on macOS too (case change, autocomplete).
#
# Regenerate:
#   python polyhost/res/overlay_sources/webapps/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/webapps/overleaf.yaml --preview /tmp/overleaf_preview
app: overleaf
match: [overleaf]
output: overleaf_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: overleaf.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  - { key: ENTER, mods: [CMDCTRL], icon: ol_compile.png, label: "Compile" }
  - { key: S, mods: [CMDCTRL], icon: ol_compile.png, label: "Compile", shared: false }
  - { key: F, mods: [CMDCTRL], icon: findreplace.png, label: "Find and replace", shared: false }
  - { key: Z, mods: [CMDCTRL], label: "Undo" }
  - { key: Y, mods: [CMDCTRL], label: "Redo" }
  - { key: Z, mods: [CMDCTRL, SHIFT], label: "Redo" }
  - { key: A, mods: [CMDCTRL], label: "Select all" }
  - { key: B, mods: [CMDCTRL], label: "Bold" }
  - { key: I, mods: [CMDCTRL], label: "Italic" }
  - { key: HOME, mods: [CMDCTRL], icon: ol_first.png, label: "First line" }
  - { key: END, mods: [CMDCTRL], icon: ol_last.png, label: "Last line" }
  - { key: L, mods: [CMDCTRL, SHIFT], icon: ol_gotoline.png, label: "Go to line" }
  - { key: SLASH, mods: [CMDCTRL], icon: ol_comment.png, label: "Comment lines" }
  - { key: D, mods: [CMDCTRL], icon: ol_deleteline.png, label: "Delete line" }
  - { key: D, mods: [CMDCTRL, SHIFT], icon: ol_dupsel.png, label: "Duplicate selection" }
  - { key: U, mods: [CTRL], icon: ol_upper.png, label: "Upper case" }
  - { key: U, mods: [CTRL, SHIFT], icon: ol_lower.png, label: "Lower case" }
  - { key: SPACE, mods: [CTRL], icon: ol_autocomplete.png, label: "Autocomplete" }
  - { key: J, mods: [CMDCTRL], icon: ol_review.png, label: "Review panel" }
  - { key: C, mods: [CMDCTRL, SHIFT], icon: addcomment.png, label: "Add comment" }
  - { key: A, mods: [CMDCTRL, SHIFT], icon: ol_track.png, label: "Track changes" }
