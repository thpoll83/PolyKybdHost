# Linear (linear.app and the desktop app) shortcut overlays for PolyKybd.
# See SOURCES.md.
#
# Keys: the modifier shortcuts named in Linear's docs (linear.app/docs/*.md, read
# 2026-10-22). Linear writes Cmd/Ctrl, so `CMDCTRL` serves every OS; Option/Alt
# is `ALT`. Bare letters (C new issue, A assign ...) and two-key sequences
# (G then I) are left out, as in the Gmail set: they would replace the letter
# legends while the user types. Cmd/Ctrl+B and Cmd/Ctrl+I also mean bold and
# italic in the text editor; the set draws their view meaning (layout, details
# sidebar).
#
# Regenerate:
#   python polyhost/res/overlay_sources/webapps/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/webapps/linear.yaml --preview /tmp/linear_preview
app: linear
match: [linear]
output: linear_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: linear.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  - { key: K, mods: [CMDCTRL], icon: commandpalette.png, label: "Command menu" }
  - { key: F, mods: [CMDCTRL], icon: search.png, label: "Search in view", shared: false }
  - { key: B, mods: [CMDCTRL], icon: lin_layout.png, label: "Board or list layout" }
  - { key: I, mods: [CMDCTRL], icon: sidebar.png, label: "Details sidebar" }
  - { key: I, mods: [CMDCTRL, SHIFT], icon: lin_insights.png, label: "Insights" }
  - { key: J, mods: [CMDCTRL], icon: lin_agent.png, label: "Linear Agent" }
  - { key: Z, mods: [CMDCTRL], label: "Undo" }
  - { key: Z, mods: [CMDCTRL, SHIFT], label: "Redo" }
  - { key: A, mods: [CMDCTRL], label: "Select all" }
  - { key: O, mods: [CMDCTRL, SHIFT], icon: childissue.png, label: "Create sub-issue" }
  - { key: ENTER, mods: [CMDCTRL], icon: submit.png, label: "Save or post", shared: false }
  - { key: ENTER, mods: [CMDCTRL, SHIFT], icon: lin_createmore.png, label: "Create more" }
  - { key: A, mods: [CMDCTRL, SHIFT], icon: lin_attach.png, label: "Attach files" }
  - { key: DOT, mods: [CMDCTRL, SHIFT], icon: lin_branch.png, label: "Copy git branch name" }
  - { key: C, mods: [ALT], icon: lin_template.png, label: "Issue from template" }
  - { key: F, mods: [ALT], icon: favorite.png, label: "Favorite" }
  - { key: UP, mods: [ALT], icon: lin_moveup.png, label: "Move up" }
  - { key: DOWN, mods: [ALT], icon: lin_movedown.png, label: "Move down" }
  - { key: UP, mods: [ALT, SHIFT], icon: lin_movetop.png, label: "Move to top" }
  - { key: DOWN, mods: [ALT, SHIFT], icon: lin_movebottom.png, label: "Move to bottom" }
  - { key: M, mods: [CMDCTRL, ALT], icon: lin_inline.png, label: "Inline comment" }
  - { key: C, mods: [CMDCTRL, ALT], icon: lin_copymd.png, label: "Copy as Markdown", only: [macos] }
  - { key: U, mods: [CMDCTRL, SHIFT], icon: lin_upload.png, label: "Upload files", only: [macos] }
  # --- text editor ---
  - { key: U, mods: [CMDCTRL], label: "Underline" }
  - { key: E, mods: [CMDCTRL], icon: code.png, label: "Inline code" }
  - { key: "7", mods: [CMDCTRL, SHIFT], icon: todo.png, label: "Checklist" }
  - { key: "8", mods: [CMDCTRL, SHIFT], icon: bulletlist.png, label: "Bulleted list" }
  - { key: "9", mods: [CMDCTRL, SHIFT], icon: numberlist.png, label: "Numbered list" }
