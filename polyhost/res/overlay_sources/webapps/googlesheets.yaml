# Google Sheets (in-browser) shortcut overlays for PolyKybd. See SOURCES.md.
# GENERATED by gen_google_specs.py from its table -- edit the table, not this file.
#
# Shortcuts: the PC and Mac tables of Google's help page
# https://support.google.com/docs/answer/181110
# Bare letters, digits and Shift+letter keys are left out: they would replace
# the letter legends while the user types.
#
# Regenerate:
#   python polyhost/res/overlay_sources/webapps/fetch_icons.py
#   python polyhost/res/overlay_sources/webapps/gen_google_specs.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/webapps/googlesheets.yaml --preview /tmp/googlesheets_preview
app: googlesheets
match: [googlesheets]
output: googlesheets_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: gs.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0

bindings:

  - { key: A, mods: [CMDCTRL], label: "Select all" }
  - { key: Z, mods: [CMDCTRL], label: "Undo" }
  - { key: Y, mods: [CMDCTRL], label: "Redo" }
  - { key: Z, mods: [CMDCTRL, SHIFT], label: "Redo" }
