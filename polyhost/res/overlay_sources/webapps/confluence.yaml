# Confluence Cloud (in-browser) shortcut overlays for PolyKybd. See SOURCES.md.
#
# Serves Windows/Linux AND macOS from this one file: `CMDCTRL` is Ctrl on
# Windows/Linux and Cmd on macOS (the generator also writes <output>_mac.*);
# a chord macOS moves is written twice under disjoint `only:` lists, and one
# with no macOS equivalent carries `except: [macos]`. See SOURCES.md -> macOS.
#
# Regenerate:
#   python polyhost/res/overlay_sources/webapps/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/webapps/confluence.yaml --preview /tmp/cf_preview
app: confluence
match: [confluence]
output: confluence_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: cf.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- single key (viewing a page) ---
  - { key: E, mods: [], icon: edit.png, label: "Edit page", source: "ms-fluent/Document Edit (MIT)" }

  # --- Ctrl: the editor ---
  - { key: B, mods: [CMDCTRL], icon: bold.png,      label: Bold,      source: "ms-fluent/Text Bold (MIT)" }
  - { key: I, mods: [CMDCTRL], icon: italic.png,    label: Italic,    source: "ms-fluent/Text Italic (MIT)" }
  - { key: U, mods: [CMDCTRL], icon: underline.png, label: Underline, source: "ms-fluent/Text Underline (MIT)" }
  - { key: K, mods: [CMDCTRL], icon: link.png,      label: Link,      source: "ms-fluent/Link (MIT)" }
  - { key: Z, mods: [CMDCTRL], icon: undo.png,      label: Undo,      source: "ms-fluent/Arrow Undo (MIT)" }
  - { key: Y, mods: [CMDCTRL], icon: redo.png,      label: Redo,      source: "ms-fluent/Arrow Redo (MIT)" }
  - { key: ENTER, mods: [CMDCTRL], icon: publish.png, label: Publish, source: "ms-fluent/Rocket (MIT)" }

  # --- Ctrl+Shift ---
  - { key: S, mods: [CMDCTRL, SHIFT], icon: strikethrough.png, label: Strikethrough,  source: "ms-fluent/Text Strikethrough (MIT)" }
  - { key: M, mods: [CMDCTRL, SHIFT], icon: codeblock.png,     label: "Code block",   source: "ms-fluent/Code Block (MIT)" }
  - { key: I, mods: [CMDCTRL, SHIFT], icon: table.png,         label: "Insert table", source: "ms-fluent/Table Simple (MIT)" }
  - { key: "7", mods: [CMDCTRL, SHIFT], icon: numberlist.png,  label: "Numbered list", source: "material-symbols/format_list_numbered (Apache-2.0)" }
  - { key: "8", mods: [CMDCTRL, SHIFT], icon: bulletlist.png,  label: "Bullet list",  source: "ms-fluent/Text Bullet List (MIT)" }
  - { key: "9", mods: [CMDCTRL, SHIFT], icon: quote.png,       label: "Block quote",  source: "ms-fluent/Text Quote (MIT)" }

  # --- Ctrl+Alt: headings ---
  - { key: "1", mods: [CMDCTRL, ALT], icon: heading1.png, label: "Heading 1", source: "ms-fluent/Text Header 1 (MIT)" }
  - { key: "2", mods: [CMDCTRL, ALT], icon: heading2.png, label: "Heading 2", source: "ms-fluent/Text Header 2 (MIT)" }
  - { key: "3", mods: [CMDCTRL, ALT], icon: heading3.png, label: "Heading 3", source: "ms-fluent/Text Header 3 (MIT)" }

  # --- Alt+Shift ---
  - { key: Z, mods: [ALT, SHIFT], icon: search.png, label: "Quick search", source: "ms-fluent/Search (MIT)" }
