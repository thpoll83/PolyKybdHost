# draw.io / diagrams.net shortcut overlays for PolyKybd. See SOURCES.md.
#
# Keys: the action shortcuts in draw.io's own Actions.js and its shortcut sheet
# (shortcuts.svg). draw.io writes Ctrl and Alt and says to read Cmd and Option on
# macOS, so `CMDCTRL` and `ALT` serve every OS. Loads in a browser on
# app.diagrams.net / draw.io and for the draw.io desktop app.
#
# Regenerate:
#   python polyhost/res/overlay_sources/webapps/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/webapps/drawio.yaml --preview /tmp/drawio_preview
app: drawio
match: [drawio, draw-io, draw.io]
output: drawio_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: drawio.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- document ---
  - { key: S, mods: [CMDCTRL], label: "Save" }
  - { key: S, mods: [CMDCTRL, SHIFT], icon: dio_saveas.png, label: "Save as", shared: false }
  - { key: P, mods: [CMDCTRL], label: "Print" }
  - { key: Z, mods: [CMDCTRL], label: "Undo" }
  - { key: Y, mods: [CMDCTRL], label: "Redo" }
  - { key: Z, mods: [CMDCTRL, SHIFT], label: "Redo" }
  # --- edit ---
  - { key: X, mods: [CMDCTRL], label: "Cut" }
  - { key: C, mods: [CMDCTRL], label: "Copy" }
  - { key: V, mods: [CMDCTRL], label: "Paste" }
  - { key: X, mods: [CMDCTRL, ALT], icon: dio_copyimage.png, label: "Copy as image" }
  - { key: V, mods: [CMDCTRL, SHIFT], icon: pasteplain.png, label: "Paste unformatted text" }
  - { key: D, mods: [CMDCTRL], icon: duplicate.png, label: "Duplicate" }
  - { key: DELETE, mods: [CMDCTRL], icon: delete.png, label: "Delete with connections" }
  - { key: G, mods: [CMDCTRL], icon: group.png, label: "Group" }
  - { key: U, mods: [CMDCTRL, SHIFT], icon: ungroup.png, label: "Ungroup" }
  - { key: L, mods: [CMDCTRL], icon: lock.png, label: "Lock or unlock" }
  - { key: R, mods: [CMDCTRL], icon: rotatecw.png, label: "Turn 90 degrees" }
  - { key: F, mods: [CMDCTRL, SHIFT], icon: bringfront.png, label: "Bring to front" }
  - { key: B, mods: [CMDCTRL, SHIFT], icon: sendback.png, label: "Send to back" }
  - { key: F, mods: [CMDCTRL, ALT, SHIFT], icon: bringforward.png, label: "Bring forward" }
  - { key: B, mods: [CMDCTRL, ALT, SHIFT], icon: sendbackward.png, label: "Send backward" }
  - { key: HOME, mods: [CMDCTRL], icon: collapse.png, label: "Collapse container" }
  - { key: END, mods: [CMDCTRL], icon: expand.png, label: "Expand container" }
  - { key: END, mods: [CMDCTRL, SHIFT], icon: dio_entergroup.png, label: "Enter group" }
  - { key: HOME, mods: [CMDCTRL, SHIFT], icon: dio_exitgroup.png, label: "Exit group" }
  - { key: Y, mods: [CMDCTRL, SHIFT], icon: dio_autosize.png, label: "Autosize" }
  - { key: F, mods: [ALT, SHIFT], icon: dio_copysize.png, label: "Copy size" }
  - { key: V, mods: [ALT, SHIFT], icon: dio_pastesize.png, label: "Paste size" }
  - { key: B, mods: [ALT, SHIFT], icon: dio_copydata.png, label: "Copy data" }
  - { key: E, mods: [ALT, SHIFT], icon: dio_pastedata.png, label: "Paste data" }
  - { key: C, mods: [CMDCTRL, ALT], icon: dio_copystyle.png, label: "Copy style" }
  - { key: V, mods: [CMDCTRL, ALT], icon: dio_pastestyle.png, label: "Paste style" }
  - { key: R, mods: [ALT, SHIFT], icon: dio_waypoints.png, label: "Clear waypoints" }
  - { key: T, mods: [ALT, SHIFT], icon: dio_tooltip.png, label: "Edit tooltip" }
  - { key: N, mods: [ALT, SHIFT], icon: dio_editnote.png, label: "Edit note" }
  - { key: L, mods: [ALT, SHIFT], icon: link.png, label: "Edit link" }
  - { key: M, mods: [CMDCTRL], icon: dio_metadata.png, label: "Edit data" }
  # --- select ---
  - { key: A, mods: [CMDCTRL], label: "Select all" }
  - { key: A, mods: [CMDCTRL, SHIFT], icon: dio_selnone.png, label: "Select none" }
  - { key: I, mods: [CMDCTRL, SHIFT], icon: dio_selvertices.png, label: "Select vertices" }
  - { key: E, mods: [CMDCTRL, SHIFT], icon: dio_seledges.png, label: "Select edges" }
  # --- label text ---
  - { key: B, mods: [CMDCTRL], label: "Bold" }
  - { key: I, mods: [CMDCTRL], label: "Italic" }
  - { key: U, mods: [CMDCTRL], label: "Underline" }
  - { key: DOT, mods: [CMDCTRL], icon: superscript.png, label: "Superscript" }
  - { key: COMMA, mods: [CMDCTRL], icon: subscript.png, label: "Subscript" }
  - { key: LBRACKET, mods: [CMDCTRL, SHIFT], icon: fontdec.png, label: "Smaller font" }
  - { key: RBRACKET, mods: [CMDCTRL, SHIFT], icon: fontinc.png, label: "Larger font" }
  # --- styles ---
  - { key: E, mods: [CMDCTRL], icon: dio_editstyle.png, label: "Edit style" }
  - { key: D, mods: [CMDCTRL, SHIFT], icon: dio_setstyle.png, label: "Set as default style" }
  - { key: R, mods: [CMDCTRL, SHIFT], icon: clearfmt.png, label: "Clear default style" }
  # --- view ---
  - { key: EQUAL, mods: [CMDCTRL], label: "Zoom in" }
  - { key: MINUS, mods: [CMDCTRL], label: "Zoom out" }
  - { key: H, mods: [CMDCTRL, SHIFT], icon: dio_fitwindow.png, label: "Fit window" }
  - { key: J, mods: [CMDCTRL], icon: zoomfit.png, label: "Fit page" }
  - { key: J, mods: [CMDCTRL, SHIFT], icon: dio_fittwo.png, label: "Fit two pages" }
  - { key: "0", mods: [CMDCTRL], icon: dio_customzoom.png, label: "Custom zoom" }
  - { key: HOME, mods: [SHIFT], icon: dio_home.png, label: "Home" }
  - { key: G, mods: [CMDCTRL, SHIFT], icon: dio_grid.png, label: "Grid" }
  - { key: A, mods: [ALT, SHIFT], icon: dio_arrows.png, label: "Connection arrows" }
  - { key: O, mods: [ALT, SHIFT], icon: dio_points.png, label: "Connection points" }
  - { key: L, mods: [CMDCTRL, SHIFT], icon: dio_layers.png, label: "Layers" }
  - { key: O, mods: [CMDCTRL, SHIFT], icon: dio_outline.png, label: "Outline" }
  - { key: P, mods: [CMDCTRL, SHIFT], icon: dio_format.png, label: "Format panel" }
  - { key: K, mods: [CMDCTRL, SHIFT], icon: dio_shapes.png, label: "Shapes" }
  - { key: M, mods: [CMDCTRL, SHIFT], icon: dio_geometry.png, label: "Edit geometry" }
  - { key: K, mods: [CMDCTRL], icon: dio_tags.png, label: "Tags" }
  - { key: F, mods: [CMDCTRL], icon: findreplace.png, label: "Find and replace", shared: false }
  - { key: PGUP, mods: [CMDCTRL, SHIFT], icon: dio_prevpage.png, label: "Previous page" }
  - { key: PGDN, mods: [CMDCTRL, SHIFT], icon: dio_nextpage.png, label: "Next page" }
  # --- tools (bare keys, as in the Miro set) ---
  - { key: A, mods: [], icon: textbox.png, label: "Add text" }
  - { key: S, mods: [], icon: dio_note.png, label: "Add note" }
  - { key: D, mods: [], icon: dio_rect.png, label: "Add rectangle" }
  - { key: F, mods: [], icon: ellipse.png, label: "Add ellipse" }
  - { key: C, mods: [], icon: line.png, label: "Add line" }
  - { key: X, mods: [], icon: dio_freehand.png, label: "Freehand" }
