# Zoom Workplace main window shortcut overlays for PolyKybd (Windows, Linux and
# macOS). The meeting window has its own spec, bindings.yaml.
#
# The mapping loads this set for the window titled "Zoom Workplace" (measured on
# the 7.2.1 Linux client): chat, Zoom Phone and the general keys. Zoom's macOS
# keymap is a remap, as in bindings.yaml, so each line has literal mods and an
# `only:` list.
#
# Shortcuts: Zoom Support, "Using hot keys and keyboard shortcuts" (KB0067050,
# 2026-07-01 revision), its Windows, Linux and macOS tabs. See SOURCES.md.
#
# Regenerate:
#   python polyhost/res/overlay_sources/zoom/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/zoom/main.yaml --preview /tmp/zoom_main_preview
app: zoom-main
match: [zoom, zoom.us]
output: zoom_main_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: zoom.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_anchor: center
program_icon_margin: 0

_wl: &wl { only: [windows, linux] }
_mac: &mac { only: [macos] }

bindings:
  # --- Windows / Linux ---
  - { key: BACKSLASH, mods: [CTRL], icon: showcontrols.png, region: [72, 40], anchor: center, mode: alpha, label: "Always show controls" }
  - { key: W, mods: [CTRL],         <<: *wl, icon: closechat.png, region: [72, 40], anchor: center, mode: alpha, label: "Close chat" }
  - { key: A, mods: [CTRL, SHIFT],  <<: *wl, icon: acceptcall.png,  label: "Accept call" }
  - { key: D, mods: [CTRL, SHIFT],  <<: *wl, icon: declinecall.png, label: "Decline call" }
  - { key: E, mods: [CTRL, SHIFT],  <<: *wl, icon: endcall.png,     label: "End call" }
  - { key: M, mods: [CTRL, SHIFT],  <<: *wl, icon: mutecall.png,    label: "Mute call" }
  - { key: H, mods: [CTRL, SHIFT],  <<: *wl, icon: holdcall.png,    label: "Hold call" }
  - { key: LEFT, mods: [ALT],       <<: *wl, icon: back.png,        label: "Back in chat history" }
  - { key: RIGHT, mods: [ALT],      <<: *wl, icon: forward.png,     label: "Forward in chat history" }
  - { key: LEFT, mods: [ALT, SHIFT], <<: *wl, icon: collapse.png,   label: "Collapse chat sections" }
  - { key: T, mods: [ALT, SHIFT],   <<: *wl, icon: screenshot.png,  label: Screenshot }

  # --- macOS: meetings ---
  - { key: J, mods: [GUI],          <<: *mac, icon: join.png,         label: "Join meeting" }
  - { key: V, mods: [GUI, CTRL],    <<: *mac, icon: startmeeting.png, label: "Start meeting" }
  - { key: D, mods: [GUI],          <<: *mac, icon: schedule.png,     label: "Schedule meeting" }
  - { key: S, mods: [GUI, CTRL],    <<: *mac, icon: directshare.png,  label: "Direct share" }
  # --- macOS: chat ---
  - { key: T, mods: [GUI],          <<: *mac, icon: screenshot.png,  label: Screenshot }
  - { key: F, mods: [GUI],          <<: *mac, icon: searchchat.png,  label: "Search chat" }
  - { key: LBRACKET, mods: [GUI],   <<: *mac, icon: back.png,        label: "Back in chat history" }
  - { key: RBRACKET, mods: [GUI],   <<: *mac, icon: forward.png,     label: "Forward in chat history" }
  - { key: N, mods: [GUI],          <<: *mac, icon: newmessage.png,  label: "New message" }
  - { key: "0", mods: [GUI, ALT],   <<: *mac, icon: collapse.png,    label: "Collapse all" }
  - { key: I, mods: [GUI, ALT],     <<: *mac, icon: addmember.png,   label: "Add member" }
  - { key: L, mods: [GUI, SHIFT],   <<: *mac, icon: chatlist.png,    label: "Chat list" }
  - { key: N, mods: [GUI, CTRL],    <<: *mac, icon: newmessages.png, label: "Jump to new messages" }
  - { key: U, mods: [GUI, SHIFT],   <<: *mac, icon: latest.png,      label: "Latest message" }
  - { key: E, mods: [GUI, SHIFT],   <<: *mac, icon: chatinput.png,   label: "Chat input" }
  - { key: C, mods: [GUI, SHIFT],   <<: *mac, icon: clip.png,        label: "Record clip" }
  # --- macOS: phone ---
  - { key: C, mods: [CTRL, SHIFT],  <<: *mac, icon: callnumber.png,  label: "Call number" }
  - { key: A, mods: [CTRL, SHIFT],  <<: *mac, icon: acceptcall.png,  label: "Accept call" }
  - { key: D, mods: [CTRL, SHIFT],  <<: *mac, icon: declinecall.png, label: "Decline call" }
  - { key: E, mods: [CTRL, SHIFT],  <<: *mac, icon: endcall.png,     label: "End call" }
  - { key: M, mods: [CTRL, SHIFT],  <<: *mac, icon: mutecall.png,    label: "Mute call" }
  - { key: H, mods: [CTRL, SHIFT],  <<: *mac, icon: holdcall.png,    label: "Hold call" }
  - { key: T, mods: [CTRL, SHIFT],  <<: *mac, icon: transfer.png,    label: "Transfer call" }
  # --- macOS: general ---
  - { key: E, mods: [GUI],          <<: *mac, icon: globalsearch.png, label: "Global search" }
  - { key: EQUAL, mods: [GUI],      <<: *mac, label: "Zoom in" }
  - { key: MINUS, mods: [GUI],      <<: *mac, label: "Zoom out" }
  - { key: "0", mods: [GUI],        <<: *mac, icon: resetsize.png,    label: "Reset chat size" }
  - { key: W, mods: [GUI],          <<: *mac, label: Close }
  - { key: TAB, mods: [CTRL],       <<: *mac, icon: nexttab.png,     label: "Next tab" }
  - { key: TAB, mods: [CTRL, SHIFT], <<: *mac, icon: prevtab.png,    label: "Previous tab" }
  - { key: "1", mods: [GUI], <<: *mac, icon: tab1.png, label: "Tab 1" }
  - { key: "2", mods: [GUI], <<: *mac, icon: tab2.png, label: "Tab 2" }
  - { key: "3", mods: [GUI], <<: *mac, icon: tab3.png, label: "Tab 3" }
  - { key: "4", mods: [GUI], <<: *mac, icon: tab4.png, label: "Tab 4" }
  - { key: "5", mods: [GUI], <<: *mac, icon: tab5.png, label: "Tab 5" }
  - { key: "6", mods: [GUI], <<: *mac, icon: tab6.png, label: "Tab 6" }
  - { key: "7", mods: [GUI], <<: *mac, icon: tab7.png, label: "Tab 7" }
  - { key: "8", mods: [GUI], <<: *mac, icon: tab8.png, label: "Tab 8" }
  - { key: "9", mods: [GUI],        <<: *mac, icon: lasttab.png,     label: "Last tab" }
  - { key: L, mods: [GUI],          <<: *mac, icon: orientation.png, label: "Portrait/landscape" }
  - { key: O, mods: [GUI, SHIFT],   <<: *mac, icon: aichat.png,      label: "AI chat panel" }
  - { key: J, mods: [GUI, SHIFT],   <<: *mac, icon: calendarpanel.png, label: "Calendar panel" }
