# SumatraPDF shortcut overlays for PolyKybd (Windows only). See SOURCES.md.
#
# SumatraPDF runs only on Windows. Every binding carries `except: [macos]`, so
# the generator writes the Windows set only (no `_mac` or `_linux` files).
#
# Regenerate:
#   python polyhost/res/overlay_sources/sumatrapdf/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/sumatrapdf/bindings.yaml --preview /tmp/sumatrapdf_preview
app: sumatrapdf
match: [sumatrapdf]
output: sumatrapdf_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

# No program_icon: ESC is left to the generic program mark (the OS icon of
# SumatraPDF.exe).

bindings:
  - { key: N, mods: [CTRL], icon: newwindow.png, label: "New window", except: [macos] }
  - { key: O, mods: [CTRL], label: "Open", except: [macos] }
  - { key: W, mods: [CTRL], icon: close.png, label: "Close document", except: [macos] }
  - { key: S, mods: [CTRL], icon: saveas.png, label: "Save as", except: [macos] }
  - { key: S, mods: [CTRL, SHIFT], icon: saveannots.png, label: "Save annotations to PDF", except: [macos] }
  - { key: N, mods: [CTRL, SHIFT], icon: openinwindow.png, label: "Open in new window", except: [macos] }
  - { key: P, mods: [CTRL], label: "Print", except: [macos] }
  - { key: D, mods: [CTRL], icon: properties.png, label: "Properties", except: [macos] }
  - { key: Q, mods: [CTRL], icon: quit.png, label: "Quit", except: [macos] }
  - { key: F2, mods: [], icon: rename.png, label: "Rename file", except: [macos] }
  - { key: G, mods: [CTRL], icon: gotopage.png, label: "Go to page", except: [macos] }
  - { key: LEFT, mods: [ALT], icon: back.png, label: "Back", except: [macos] }
  - { key: RIGHT, mods: [ALT], icon: forward.png, label: "Forward", except: [macos] }
  - { key: UP, mods: [CTRL], icon: prevpage.png, label: "Previous page", except: [macos] }
  - { key: DOWN, mods: [CTRL], icon: nextpage.png, label: "Next page", except: [macos] }
  - { key: LEFT, mods: [CTRL, SHIFT], icon: prevfile.png, label: "Previous file in folder", except: [macos] }
  - { key: RIGHT, mods: [CTRL, SHIFT], icon: nextfile.png, label: "Next file in folder", except: [macos] }
  - { key: F, mods: [CTRL], label: "Find", except: [macos] }
  - { key: F3, mods: [], icon: findnext.png, label: "Find next", except: [macos] }
  - { key: F3, mods: [SHIFT], icon: findprev.png, label: "Find previous", except: [macos] }
  - { key: B, mods: [CTRL], icon: favorite.png, label: "Add to favorites", except: [macos] }
  - { key: A, mods: [CTRL], label: "Select all", except: [macos] }
  - { key: C, mods: [CTRL], label: "Copy", except: [macos] }
  - { key: Z, mods: [CTRL], label: "Undo", except: [macos] }
  - { key: Z, mods: [CTRL, SHIFT], label: "Redo", except: [macos] }
  - { key: "6", mods: [CTRL], icon: singlepage.png, label: "Single page", except: [macos] }
  - { key: "7", mods: [CTRL], icon: facing.png, label: "Facing", except: [macos] }
  - { key: "8", mods: [CTRL], icon: bookview.png, label: "Book view", except: [macos] }
  - { key: MINUS, mods: [CTRL, SHIFT], icon: rotateleft.png, label: "Rotate left", except: [macos] }
  - { key: EQUAL, mods: [CTRL, SHIFT], icon: rotateright.png, label: "Rotate right", except: [macos] }
  - { key: "0", mods: [CTRL], icon: fitpage.png, label: "Fit page", except: [macos] }
  - { key: "1", mods: [CTRL], icon: actualsize.png, label: "Actual size", except: [macos] }
  - { key: "2", mods: [CTRL], icon: fitwidth.png, label: "Fit width", except: [macos] }
  - { key: "3", mods: [CTRL], icon: fitcontent.png, label: "Fit content", except: [macos] }
  - { key: Y, mods: [CTRL], icon: customzoom.png, label: "Custom zoom", except: [macos] }
  - { key: L, mods: [CTRL], icon: presentation.png, label: "Presentation", except: [macos] }
  - { key: F5, mods: [], icon: presentation.png, label: "Presentation", except: [macos] }
  - { key: L, mods: [CTRL, SHIFT], icon: fullscreen.png, label: "Full screen", except: [macos] }
  - { key: F11, mods: [], icon: fullscreen.png, label: "Full screen", except: [macos] }
  - { key: F12, mods: [], icon: bookmarks.png, label: "Bookmarks", except: [macos] }
  - { key: F12, mods: [SHIFT], icon: toc.png, label: "Table of contents", except: [macos] }
  - { key: F8, mods: [], icon: toolbar.png, label: "Toolbar", except: [macos] }
  - { key: F9, mods: [], icon: menubar.png, label: "Menu bar", except: [macos] }
  - { key: F7, mods: [], icon: caret.png, label: "Keyboard text selection", except: [macos] }
  - { key: K, mods: [CTRL], icon: palette.png, label: "Command palette", except: [macos] }
  - { key: F1, mods: [], icon: help.png, label: "Manual", except: [macos] }
  # Single keys and Shift+letter: they act while the document has focus (the
  # normal state). Labels for 3.6+ (i = page info, Shift+I = invert colors).
  - { key: J, mods: [], icon: scrolldown.png, label: "Scroll down", except: [macos] }
  - { key: K, mods: [], icon: scrollup.png, label: "Scroll up", except: [macos] }
  - { key: H, mods: [], icon: scrollleft.png, label: "Scroll left", except: [macos] }
  - { key: L, mods: [], icon: scrollright.png, label: "Scroll right", except: [macos] }
  - { key: N, mods: [], icon: nextpage.png, label: "Next page", except: [macos] }
  - { key: P, mods: [], icon: prevpage.png, label: "Previous page", except: [macos] }
  - { key: G, mods: [], icon: gotopage.png, label: "Go to page", except: [macos] }
  - { key: B, mods: [], icon: flippage.png, label: "Flip page (book mode)", except: [macos] }
  - { key: Z, mods: [], icon: cyclezoom.png, label: "Cycle zoom", except: [macos] }
  - { key: C, mods: [], icon: continuous.png, label: "Continuous / single page", except: [macos] }
  - { key: F, mods: [], icon: fullscreen.png, label: "Full screen", except: [macos] }
  - { key: I, mods: [], icon: pageinfo.png, label: "Page info", except: [macos] }
  - { key: I, mods: [SHIFT], icon: invert.png, label: "Invert colors", except: [macos] }
  - { key: M, mods: [], icon: cursorpos.png, label: "Cursor position", except: [macos] }
  - { key: R, mods: [], icon: reload.png, label: "Reload", except: [macos] }
  - { key: Q, mods: [], icon: close.png, label: "Close tab", except: [macos] }
  - { key: SLASH, mods: [], label: "Find", except: [macos] }
  - { key: LBRACKET, mods: [], icon: rotateleft.png, label: "Rotate left", except: [macos] }
  - { key: RBRACKET, mods: [], icon: rotateright.png, label: "Rotate right", except: [macos] }
  - { key: A, mods: [], icon: highlight.png, label: "Highlight selection", except: [macos] }
  - { key: A, mods: [SHIFT], icon: highlight.png, label: "Highlight selection, edit PDF", except: [macos] }
  - { key: U, mods: [], icon: underline.png, label: "Underline selection", except: [macos] }
  - { key: U, mods: [SHIFT], icon: underline.png, label: "Underline selection, edit PDF", except: [macos] }
  # Ctrl+Tab is Smart Tab Switch: with three or more tabs it goes in most-recently-used
  # order, so it gets its own icon, apart from Ctrl+Page Down/Up (tab-strip order).
  - { key: TAB, mods: [CTRL], icon: recenttab.png, label: "Recent tab (Smart Tab Switch)", except: [macos] }
  - { key: TAB, mods: [CTRL, SHIFT], icon: recenttab.png, label: "Recent tab, backwards (Smart Tab Switch)", except: [macos] }
  - { key: PGDN, mods: [CTRL], icon: nexttab.png, label: "Next tab", except: [macos] }
  - { key: PGUP, mods: [CTRL], icon: prevtab.png, label: "Previous tab", except: [macos] }
  - { key: "1", mods: [ALT], icon: tab1.png, label: "Tab 1", except: [macos] }
  - { key: "2", mods: [ALT], icon: tab2.png, label: "Tab 2", except: [macos] }
  - { key: "3", mods: [ALT], icon: tab3.png, label: "Tab 3", except: [macos] }
  - { key: "4", mods: [ALT], icon: tab4.png, label: "Tab 4", except: [macos] }
  - { key: "5", mods: [ALT], icon: tab5.png, label: "Tab 5", except: [macos] }
  - { key: "6", mods: [ALT], icon: tab6.png, label: "Tab 6", except: [macos] }
  - { key: "7", mods: [ALT], icon: tab7.png, label: "Tab 7", except: [macos] }
  - { key: "8", mods: [ALT], icon: tab8.png, label: "Tab 8", except: [macos] }
  - { key: "9", mods: [ALT], icon: tab9.png, label: "Last tab", except: [macos] }
