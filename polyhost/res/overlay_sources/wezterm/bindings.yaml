# WezTerm shortcut overlays for PolyKybd (Windows, Linux and macOS). See SOURCES.md.
#
# The keys are WezTerm's default key assignments, read from its source at commit
# e68a8ec2 (wezterm-gui/src/commands.rs: CommandDef keys and permute_keys) and
# checked against docs/config/default-keys.md at the same commit.
#
# WezTerm registers every SUPER (Win/Cmd) key on every platform and adds a
# Ctrl+Shift copy of it (permute_keys). On Windows and Linux the Win/Super key
# is taken by the desktop for most letters, so the default set draws the
# Ctrl+Shift form. The macOS set draws the Cmd form where WezTerm has one and
# leaves out the Ctrl+Shift copy of the same action; the Ctrl+Shift keys that
# have no Cmd form (command palette, copy mode, pane keys, ...) are drawn on
# every platform.
#
# Not drawn: Ctrl+Shift+Alt+" and % are written on the ' and 5 keys (the
# characters are their shifted forms on a US layout, which is what WezTerm
# binds). ShowLauncher and ShowTabNavigator have no default key. The Copy and
# Paste keys of some keyboards have no overlay cell.
#
# Regenerate:
#   PYTHONPATH=. .venv/bin/python polyhost/res/overlay_sources/wezterm/fetch_icons.py
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/wezterm/bindings.yaml --preview /tmp/wezterm_preview
app: wezterm
match: [wezterm, wezterm-gui, org.wezfurlong.wezterm]
output: wezterm_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

# WezTerm's own icon (MIT), traced to 32x32 in fetch_icons.py.
program_icon: wezterm.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- Ctrl ---
  - { key: "=", mods: [CTRL], icon: fontbig.png, label: "Increase font size", except: [macos] }
  - { key: "-", mods: [CTRL], icon: fontsmall.png, label: "Decrease font size", except: [macos] }
  - { key: "0", mods: [CTRL], icon: fontreset.png, label: "Reset font size", except: [macos] }
  - { key: TAB, mods: [CTRL], icon: nexttab.png, label: "Next tab" }
  - { key: PGUP, mods: [CTRL], icon: prevtab.png, label: "Previous tab" }
  - { key: PGDN, mods: [CTRL], icon: nexttab.png, label: "Next tab" }
  - { key: INSERT, mods: [CTRL], icon: copysel.png, label: "Copy to primary selection", except: [macos] }

  # --- Alt (Option on macOS) ---
  - { key: ENTER, mods: [ALT], icon: fullscreen.png, label: "Full screen" }

  # --- Shift ---
  - { key: PGUP, mods: [SHIFT], icon: pageup.png, label: "Scroll page up" }
  - { key: PGDN, mods: [SHIFT], icon: pagedown.png, label: "Scroll page down" }
  - { key: INSERT, mods: [SHIFT], icon: pastesel.png, label: "Paste primary selection", except: [macos] }

  # --- Ctrl+Shift: the Ctrl+Shift copies of the SUPER keys (not on macOS) ---
  - { key: C, mods: [CTRL, SHIFT], icon: copy.png, label: "Copy", except: [macos] }
  - { key: V, mods: [CTRL, SHIFT], icon: paste.png, label: "Paste", except: [macos] }
  - { key: N, mods: [CTRL, SHIFT], icon: newwindow.png, label: "New window", except: [macos] }
  - { key: T, mods: [CTRL, SHIFT], icon: newtab.png, label: "New tab", except: [macos] }
  - { key: W, mods: [CTRL, SHIFT], icon: closetab.png, label: "Close tab", except: [macos] }
  - { key: R, mods: [CTRL, SHIFT], icon: reload.png, label: "Reload configuration", except: [macos] }
  - { key: K, mods: [CTRL, SHIFT], icon: clear.png, label: "Clear scrollback", except: [macos] }
  - { key: F, mods: [CTRL, SHIFT], icon: find.png, label: "Search", except: [macos] }
  - { key: "1", mods: [CTRL, SHIFT], icon: tab1.png, label: "Tab 1", except: [macos] }
  - { key: "2", mods: [CTRL, SHIFT], icon: tab2.png, label: "Tab 2", except: [macos] }
  - { key: "3", mods: [CTRL, SHIFT], icon: tab3.png, label: "Tab 3", except: [macos] }
  - { key: "4", mods: [CTRL, SHIFT], icon: tab4.png, label: "Tab 4", except: [macos] }
  - { key: "5", mods: [CTRL, SHIFT], icon: tab5.png, label: "Tab 5", except: [macos] }
  - { key: "6", mods: [CTRL, SHIFT], icon: tab6.png, label: "Tab 6", except: [macos] }
  - { key: "7", mods: [CTRL, SHIFT], icon: tab7.png, label: "Tab 7", except: [macos] }
  - { key: "8", mods: [CTRL, SHIFT], icon: tab8.png, label: "Tab 8", except: [macos] }
  - { key: "9", mods: [CTRL, SHIFT], icon: lasttab.png, label: "Last tab", except: [macos] }

  # --- Ctrl+Shift: keys with no Cmd form (every platform) ---
  - { key: P, mods: [CTRL, SHIFT], icon: palette.png, label: "Command palette" }
  - { key: X, mods: [CTRL, SHIFT], icon: copymode.png, label: "Copy mode" }
  - { key: SPACE, mods: [CTRL, SHIFT], icon: quickselect.png, label: "Quick select" }
  - { key: U, mods: [CTRL, SHIFT], icon: charselect.png, label: "Character select" }
  - { key: L, mods: [CTRL, SHIFT], icon: debug.png, label: "Debug overlay" }
  - { key: Z, mods: [CTRL, SHIFT], icon: zoompane.png, label: "Zoom pane" }
  - { key: TAB, mods: [CTRL, SHIFT], icon: prevtab.png, label: "Previous tab" }
  - { key: PGUP, mods: [CTRL, SHIFT], icon: movetableft.png, label: "Move tab left" }
  - { key: PGDN, mods: [CTRL, SHIFT], icon: movetabright.png, label: "Move tab right" }
  - { key: UP, mods: [CTRL, SHIFT], icon: focusup.png, label: "Pane up" }
  - { key: DOWN, mods: [CTRL, SHIFT], icon: focusdown.png, label: "Pane down" }
  - { key: LEFT, mods: [CTRL, SHIFT], icon: focusleft.png, label: "Pane left" }
  - { key: RIGHT, mods: [CTRL, SHIFT], icon: focusright.png, label: "Pane right" }

  # --- Ctrl+Alt+Shift: panes ---
  - { key: "'", mods: [CTRL, ALT, SHIFT], icon: splitdown.png, label: "Split top/bottom" }
  - { key: "5", mods: [CTRL, ALT, SHIFT], icon: splitright.png, label: "Split left/right" }
  - { key: UP, mods: [CTRL, ALT, SHIFT], icon: resizepane.png, label: "Resize pane up" }
  - { key: DOWN, mods: [CTRL, ALT, SHIFT], icon: resizepane.png, label: "Resize pane down" }
  - { key: LEFT, mods: [CTRL, ALT, SHIFT], icon: resizepane.png, label: "Resize pane left" }
  - { key: RIGHT, mods: [CTRL, ALT, SHIFT], icon: resizepane.png, label: "Resize pane right" }

  # --- Cmd (macOS only) ---
  - { key: C, mods: [GUI], icon: copy.png, label: "Copy", only: [macos] }
  - { key: V, mods: [GUI], icon: paste.png, label: "Paste", only: [macos] }
  - { key: N, mods: [GUI], icon: newwindow.png, label: "New window", only: [macos] }
  - { key: T, mods: [GUI], icon: newtab.png, label: "New tab", only: [macos] }
  - { key: W, mods: [GUI], icon: closetab.png, label: "Close tab", only: [macos] }
  - { key: R, mods: [GUI], icon: reload.png, label: "Reload configuration", only: [macos] }
  - { key: K, mods: [GUI], icon: clear.png, label: "Clear scrollback", only: [macos] }
  - { key: F, mods: [GUI], icon: find.png, label: "Search", only: [macos] }
  - { key: M, mods: [GUI], icon: minimize.png, label: "Minimize window", only: [macos] }
  - { key: H, mods: [GUI], icon: hideapp.png, label: "Hide WezTerm", only: [macos] }
  - { key: Q, mods: [GUI], icon: quit.png, label: "Quit WezTerm", only: [macos] }
  - { key: "=", mods: [GUI], icon: fontbig.png, label: "Increase font size", only: [macos] }
  - { key: "-", mods: [GUI], icon: fontsmall.png, label: "Decrease font size", only: [macos] }
  - { key: "0", mods: [GUI], icon: fontreset.png, label: "Reset font size", only: [macos] }
  - { key: "1", mods: [GUI], icon: tab1.png, label: "Tab 1", only: [macos] }
  - { key: "2", mods: [GUI], icon: tab2.png, label: "Tab 2", only: [macos] }
  - { key: "3", mods: [GUI], icon: tab3.png, label: "Tab 3", only: [macos] }
  - { key: "4", mods: [GUI], icon: tab4.png, label: "Tab 4", only: [macos] }
  - { key: "5", mods: [GUI], icon: tab5.png, label: "Tab 5", only: [macos] }
  - { key: "6", mods: [GUI], icon: tab6.png, label: "Tab 6", only: [macos] }
  - { key: "7", mods: [GUI], icon: tab7.png, label: "Tab 7", only: [macos] }
  - { key: "8", mods: [GUI], icon: tab8.png, label: "Tab 8", only: [macos] }
  - { key: "9", mods: [GUI], icon: lasttab.png, label: "Last tab", only: [macos] }

  # --- Cmd+Shift (macOS only) ---
  - { key: T, mods: [GUI, SHIFT], icon: newtab.png, label: "New tab (default domain)", only: [macos] }
  - { key: "[", mods: [GUI, SHIFT], icon: prevtab.png, label: "Previous tab", only: [macos] }
  - { key: "]", mods: [GUI, SHIFT], icon: nexttab.png, label: "Next tab", only: [macos] }
