# Steinberg Cubase shortcut overlays for PolyKybd (Windows and macOS; Cubase
# has no Linux version). See SOURCES.md.
#
# Shortcuts: Cubase Pro 14 Operation Manual, chapter "Key Commands" >
# "Default Key Commands", one table per category. The manual writes the
# Windows key first and the macOS key second:
#   Ctrl/Cmd   -> CMDCTRL (Ctrl on Windows, Cmd on macOS)
#   Alt/Opt    -> ALT     (the same key)
# No binding needs `only:` / `except:`: every default key is the same chord on
# both systems.
#
# Left out: numeric keypad keys (no cell: Record, Cycle, Stop, the locator
# keys, Workspaces), the MIDI editor insert-length keys (Alt+1..8), the focus
# keys, the parameter keys, and Esc (the program mark, which the host draws).
# SOURCES.md lists every omission.
#
# Regenerate:
#   python polyhost/res/overlay_sources/cubase/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/cubase/bindings.yaml --preview /tmp/cubase_preview
app: cubase
match: [cubase12, cubase13, cubase14, cubase15, cubase 12, cubase 13, cubase 14, cubase 15]
output: cubase_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

# No program_icon: ESC is left to the host's program mark (OS icon, then the
# icon catalogs), as for the other proprietary DAWs.

bindings:
