# Beyond All Reason overlay for PolyKybd.
#
# Keys: the "Grid" profile (the default) in common/configs/keybind_defaults.json
# of beyond-all-reason/Beyond-All-Reason at commit d90b8ad, and two widget
# manifests. See SOURCES.md.
#
# The grid build-menu keys (Z X C V, and Q W E R / A S D F with a builder or a
# factory selected) depend on the selection and are not drawn. The order keys
# are drawn; where the profile binds Shift+key to the same order (queued), the
# Shift layer shows the same icon.
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/beyond_all_reason/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/beyond_all_reason/beyond_all_reason.yaml --preview /tmp/bar_preview
app: beyond_all_reason
match: [spring, spring.exe, beyond-all-reason, beyond-all-reason.exe, info.beyondallreason.bar]
output: beyond_all_reason_template
icon_dir: icons
fit: contain
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150
# As for 0 A.D. and StarCraft II: the icon uses the full height on the right;
# the firmware clears 3 px around it, so a letter legend stays whole.
anchor: right
region: [40, 40]
margin: 0

# BAR drawn over the whole cell, without the ESC legend (protocol v25).
program_icon: program.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0
program_icon_legend: false

bindings:

  # Orders. Shift+key queues the same order.
  - { key: A, icon: attack.png, label: "Attack" }
  - { key: A, mods: [SHIFT], icon: attack.png, label: "Attack (queued)" }
  - { key: D, icon: manualfire.png, label: "Manual fire (D-gun) or manual launch" }
  - { key: D, mods: [SHIFT], icon: manualfire.png, label: "Manual fire (D-gun) or manual launch (queued)" }
  - { key: E, icon: reclaim.png, label: "Reclaim" }
  - { key: E, mods: [SHIFT], icon: reclaim.png, label: "Reclaim (queued)" }
  - { key: F, icon: fight.png, label: "Fight" }
  - { key: F, mods: [SHIFT], icon: fight.png, label: "Fight (queued)" }
  - { key: G, icon: stop.png, label: "Stop" }
  - { key: G, mods: [SHIFT], icon: stop.png, label: "Stop (queued)" }
  - { key: H, icon: patrol.png, label: "Patrol" }
  - { key: H, mods: [SHIFT], icon: patrol.png, label: "Patrol (queued)" }
  - { key: J, icon: loadunits.png, label: "Load units" }
  - { key: J, mods: [SHIFT], icon: loadunits.png, label: "Load units (queued)" }
  - { key: K, icon: cloak.png, label: "Cloak" }
  - { key: K, mods: [SHIFT], icon: cloak.png, label: "Cloak (queued)" }
  - { key: L, icon: firestate.png, label: "Cycle fire state" }
  - { key: L, mods: [SHIFT], icon: firestate.png, label: "Cycle fire state (queued)" }
  - { key: SEMICOLON, icon: movestate.png, label: "Cycle move state" }
  - { key: SEMICOLON, mods: [SHIFT], icon: movestate.png, label: "Cycle move state (queued)" }
  - { key: M, icon: restore.png, label: "Restore terrain" }
  - { key: M, mods: [SHIFT], icon: restore.png, label: "Restore terrain (queued)" }
  - { key: O, icon: guard.png, label: "Guard" }
  - { key: O, mods: [SHIFT], icon: guard.png, label: "Guard (queued)" }
  - { key: P, icon: gatherwait.png, label: "Gather and wait" }
  - { key: P, mods: [SHIFT], icon: gatherwait.png, label: "Gather and wait (queued)" }
  - { key: R, icon: repair.png, label: "Repair" }
