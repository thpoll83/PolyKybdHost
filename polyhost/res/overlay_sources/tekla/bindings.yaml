# Tekla Structures shortcut overlays for PolyKybd (Windows only; Tekla
# Structures has no macOS or Linux version). See SOURCES.md.
#
# Keys: Tekla Structures 2026 user guide, "Default keyboard shortcuts"
# (URL in SOURCES.md). This set has the modeling keys. Drawing mode runs in the
# same window and gives several keys other meanings (F is Add free dimension,
# G Add orthogonal dimension, Ctrl+O Document manager); the host cannot tell
# the two modes apart, so the drawing-only keys are not drawn.
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/tekla/fetch_icons.py
#   PYTHONPATH=. python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/tekla/bindings.yaml --preview /tmp/tekla_preview
app: tekla
match: [teklastructures, tekla structures]
output: tekla_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

# The Tekla logo (tekla.com favicon), 32x32 at 1 bit, white on transparent.
program_icon: tekla.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- common commands ---
  - { key: F1, mods: [], label: Help }
  - { key: O, mods: [CTRL], label: Open }
  - { key: N, mods: [CTRL], label: New }
  - { key: S, mods: [CTRL], label: Save }
  - { key: DEL, mods: [], label: Delete }
  - { key: ENTER, mods: [ALT], icon: properties.png, label: Properties }
  - { key: Z, mods: [CTRL], label: Undo }
  - { key: Y, mods: [CTRL], label: Redo }
  - { key: ENTER, mods: [], icon: repeatcmd.png, label: "Repeat last command" }
  - { key: K, mods: [CTRL], icon: ctxtoolbar.png, label: "Contextual toolbar" }
  - { key: D, mods: [], icon: directmod.png, label: "Direct modification" }
  - { key: Q, mods: [CTRL], icon: quicklaunch.png, label: "Quick Launch" }
  - { key: E, mods: [CTRL], icon: preferences.png, label: "Advanced options" }
  - { key: F, mods: [CTRL], icon: catalog.png, label: "Applications and components" }
  - { key: C, mods: [CTRL, SHIFT], icon: shortcutsdlg.png, label: "Keyboard shortcuts" }

  # --- rendering: Ctrl = parts, Shift = components, Ctrl+Shift = references ---
  - { key: "1", mods: [CTRL], icon: wireframe.png, label: "Parts wireframe" }
  - { key: "2", mods: [CTRL], icon: shadedwire.png, label: "Parts shaded wireframe" }
  - { key: "3", mods: [CTRL], icon: grayscale.png, label: "Parts grayscale" }
  - { key: "4", mods: [CTRL], icon: rendered.png, label: "Parts rendered" }
  - { key: "5", mods: [CTRL], icon: onlyselected.png, label: "Only selected part" }
  - { key: "1", mods: [SHIFT], icon: wireframe.png, label: "Components wireframe" }
  - { key: "2", mods: [SHIFT], icon: shadedwire.png, label: "Components shaded wireframe" }
  - { key: "3", mods: [SHIFT], icon: grayscale.png, label: "Components grayscale" }
  - { key: "4", mods: [SHIFT], icon: rendered.png, label: "Components rendered" }
  - { key: "5", mods: [SHIFT], icon: onlyselected.png, label: "Only selected component" }
  - { key: "1", mods: [CTRL, SHIFT], icon: wireframe.png, label: "References wireframe" }
  - { key: "2", mods: [CTRL, SHIFT], icon: shadedwire.png, label: "References shaded wireframe" }
  - { key: "3", mods: [CTRL, SHIFT], icon: grayscale.png, label: "References grayscale" }
  - { key: "4", mods: [CTRL, SHIFT], icon: rendered.png, label: "References rendered" }
  - { key: "5", mods: [CTRL, SHIFT], icon: onlyselected.png, label: "Only selected reference" }
  - { key: "1", mods: [CTRL, ALT], icon: wireframe.png, label: "Building hierarchy wireframe" }
  - { key: "2", mods: [CTRL, ALT], icon: shadedwire.png, label: "Building hierarchy shaded wireframe" }

  # --- selecting ---
  - { key: H, mods: [], icon: rollover.png, label: "Rollover highlight" }
  - { key: F2, mods: [], icon: selswitchall.png, label: "Select all switch" }
  - { key: F3, mods: [], icon: selswitchparts.png, label: "Select parts switch" }
  - { key: Q, mods: [ALT], icon: selrebarsets.png, label: "Select rebar sets" }
  - { key: W, mods: [ALT], icon: selrebargroups.png, label: "Select rebar groups" }
  - { key: E, mods: [ALT], icon: selrebarsingle.png, label: "Select single rebars" }
  - { key: A, mods: [CTRL], label: "Select all" }
  - { key: P, mods: [ALT], icon: selprev.png, label: "Select previous" }
  - { key: G, mods: [CTRL], icon: quickselect.png, label: "Selection filters" }
  - { key: H, mods: [SHIFT], icon: hideobject.png, label: "Hide object" }

  # --- snapping ---
  - { key: F4, mods: [], icon: snapref.png, label: "Snap to reference points" }
  - { key: F5, mods: [], icon: snapgeom.png, label: "Snap to geometry points" }
  - { key: F6, mods: [], icon: snapnear.png, label: "Snap to nearest points" }
  - { key: F7, mods: [], icon: snapany.png, label: "Snap to any position" }
  - { key: O, mods: [], icon: ortho.png, label: Ortho }
  - { key: R, mods: [], icon: coordrel.png, label: "Relative coordinates" }
  - { key: A, mods: [], icon: coordabs.png, label: "Absolute coordinates" }
  - { key: G, mods: [], icon: coordglobal.png, label: "Global coordinates" }
  - { key: TAB, mods: [], icon: snapnext.png, label: "Next snap point" }
  - { key: TAB, mods: [SHIFT], icon: snapprev.png, label: "Previous snap point" }
  - { key: X, mods: [], icon: lockx.png, label: "Lock X" }
  - { key: Y, mods: [], icon: locky.png, label: "Lock Y" }
  - { key: Z, mods: [], icon: lockz.png, label: "Lock Z" }

  # --- copying and moving ---
  - { key: C, mods: [CTRL], label: Copy }
  - { key: V, mods: [CTRL], label: Paste }
  - { key: M, mods: [CTRL], icon: move.png, label: Move }
  - { key: S, mods: [], icon: smartselect.png, label: "Smart select" }
  - { key: C, mods: [SHIFT], icon: copyprops.png, label: "Copy properties" }
  - { key: V, mods: [SHIFT], icon: pasteprops.png, label: "Paste properties" }

  # --- viewing the model ---
  - { key: I, mods: [CTRL], icon: modelviews.png, label: "Model views" }
  - { key: P, mods: [CTRL], icon: isometric.png, label: "3D / plane view" }
  - { key: TAB, mods: [CTRL], icon: nextwin.png, label: "Next view" }
  - { key: U, mods: [CTRL], icon: refresh.png, label: "Update window" }
  - { key: HOME, mods: [], icon: home.png, label: "Zoom original" }
  - { key: END, mods: [], icon: zoomprev.png, label: "Zoom previous" }
  - { key: PGUP, mods: [], label: "Zoom in" }
  - { key: PGDN, mods: [], label: "Zoom out" }
  - { key: SPACE, mods: [SHIFT], icon: boxzoom.png, label: "Zoom selected" }
  - { key: R, mods: [CTRL], icon: orbit.png, label: "Rotate with mouse" }
  - { key: V, mods: [], icon: rotpoint.png, label: "View rotation point" }
  - { key: R, mods: [SHIFT], icon: rotright.png, label: "Rotate once" }
  - { key: T, mods: [SHIFT], icon: rotcont.png, label: "Rotate continuously" }
  - { key: F8, mods: [], icon: rotswitch.png, label: "View rotation on/off" }
  - { key: P, mods: [], icon: hand.png, label: Pan }
  - { key: M, mods: [SHIFT], icon: mousepan.png, label: "Middle button pan" }
  - { key: LEFT, mods: [], icon: viewleft.png, label: "Move view left" }
  - { key: RIGHT, mods: [], icon: viewright.png, label: "Move view right" }
  - { key: UP, mods: [], icon: viewup.png, label: "Move view up" }
  - { key: DOWN, mods: [], icon: viewdown.png, label: "Move view down" }
  - { key: INSERT, mods: [], icon: centercursor.png, label: "Center by cursor" }
  - { key: F, mods: [SHIFT], icon: fly.png, label: Fly }
  - { key: X, mods: [SHIFT], icon: clipplane.png, label: "Clip plane" }
  - { key: F11, mods: [], icon: fullscreen.png, label: "Full screen" }

  # --- checking the model ---
  - { key: I, mods: [SHIFT], icon: inquire.png, label: Inquire }
  - { key: F, mods: [], icon: measure.png, label: "Measure distance" }
  - { key: B, mods: [CTRL], icon: report.png, label: "Create report" }
  - { key: H, mods: [CTRL], icon: phases.png, label: "Phase manager" }
  - { key: J, mods: [CTRL], icon: autoconn.png, label: AutoConnections }
  - { key: L, mods: [CTRL], icon: docmanager.png, label: "Document manager" }

  # --- rebar display ---
  - { key: "1", mods: [ALT], icon: legface.png, label: "Leg faces" }
  - { key: "2", mods: [ALT], icon: guideline.png, label: Guidelines }
  - { key: "3", mods: [ALT], icon: propmod.png, label: "Property modifiers" }
  - { key: "4", mods: [ALT], icon: splitter.png, label: Splitters }
  - { key: "5", mods: [ALT], icon: enddetail.png, label: "End detail modifiers" }
  - { key: "6", mods: [ALT], icon: rebardim.png, label: "Rebar dimensions" }
  - { key: "7", mods: [ALT], icon: rebarcolors.png, label: "Color rebar groups" }

  # --- part position ---
  - { key: UP, mods: [ALT], icon: partup.png, label: "Part position up" }
  - { key: DOWN, mods: [ALT], icon: partdown.png, label: "Part position down" }
  - { key: LEFT, mods: [ALT], icon: partleft.png, label: "Part position left" }
  - { key: RIGHT, mods: [ALT], icon: partright.png, label: "Part position right" }
  - { key: SPACE, mods: [ALT], icon: partrot90.png, label: "Rotate part 90°" }
