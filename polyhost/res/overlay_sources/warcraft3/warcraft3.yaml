# Warcraft III (classic, 1.26 to 1.31) overlay for PolyKybd.
#
# Keys: the default hotkeys from the back of the Reign of Chaos manual, as
# listed by the Warcraft Wiki. See SOURCES.md.
#
# Only keys that do the same thing whatever is selected are labelled. The
# letter keys alone train, build and cast, and their meaning changes with the
# selection, so they stay blank.
#
# Regenerate:
#   python polyhost/res/overlay_sources/warcraft3/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/warcraft3/warcraft3.yaml --preview /tmp/wc3_preview
app: warcraft3
match: [war3, war3.exe, warcraft iii, warcraft iii.exe, frozen throne, frozen throne.exe]
output: warcraft3_template
icon_dir: icons
fit: contain
mode: alpha
threshold: 150
# As for AoE2 and C&C: the icon uses the full height on the right; the firmware
# clears 3 px around it, so a letter legend stays whole.
anchor: right
region: [40, 40]
margin: 0

# WARCRAFT III drawn over the whole cell, without the ESC legend (protocol v25).
program_icon: program.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0
program_icon_legend: false

bindings:

  # Control groups: digit selects, Ctrl+digit creates, Shift+digit adds the selection
  - { key: "1", icon: group1.png, label: "Select group 1", region: [48, 40], margin: 5 }
  - { key: "2", icon: group2.png, label: "Select group 2", region: [48, 40], margin: 5 }
  - { key: "3", icon: group3.png, label: "Select group 3", region: [48, 40], margin: 5 }
  - { key: "4", icon: group4.png, label: "Select group 4", region: [48, 40], margin: 5 }
  - { key: "5", icon: group5.png, label: "Select group 5", region: [48, 40], margin: 5 }
  - { key: "6", icon: group6.png, label: "Select group 6", region: [48, 40], margin: 5 }
  - { key: "7", icon: group7.png, label: "Select group 7", region: [48, 40], margin: 5 }
  - { key: "8", icon: group8.png, label: "Select group 8", region: [48, 40], margin: 5 }
  - { key: "9", icon: group9.png, label: "Select group 9", region: [48, 40], margin: 5 }
  - { key: "0", icon: group0.png, label: "Select group 0", region: [48, 40], margin: 5 }
  - { key: "1", mods: [CTRL], icon: groupnew1.png, label: "Create group 1", region: [48, 40], margin: 5 }
  - { key: "2", mods: [CTRL], icon: groupnew2.png, label: "Create group 2", region: [48, 40], margin: 5 }
  - { key: "3", mods: [CTRL], icon: groupnew3.png, label: "Create group 3", region: [48, 40], margin: 5 }
  - { key: "4", mods: [CTRL], icon: groupnew4.png, label: "Create group 4", region: [48, 40], margin: 5 }
  - { key: "5", mods: [CTRL], icon: groupnew5.png, label: "Create group 5", region: [48, 40], margin: 5 }
  - { key: "6", mods: [CTRL], icon: groupnew6.png, label: "Create group 6", region: [48, 40], margin: 5 }
  - { key: "7", mods: [CTRL], icon: groupnew7.png, label: "Create group 7", region: [48, 40], margin: 5 }
  - { key: "8", mods: [CTRL], icon: groupnew8.png, label: "Create group 8", region: [48, 40], margin: 5 }
  - { key: "9", mods: [CTRL], icon: groupnew9.png, label: "Create group 9", region: [48, 40], margin: 5 }
  - { key: "0", mods: [CTRL], icon: groupnew0.png, label: "Create group 0", region: [48, 40], margin: 5 }
  - { key: "1", mods: [SHIFT], icon: groupadd1.png, label: "Add to group 1", region: [48, 40], margin: 5 }
  - { key: "2", mods: [SHIFT], icon: groupadd2.png, label: "Add to group 2", region: [48, 40], margin: 5 }
  - { key: "3", mods: [SHIFT], icon: groupadd3.png, label: "Add to group 3", region: [48, 40], margin: 5 }
  - { key: "4", mods: [SHIFT], icon: groupadd4.png, label: "Add to group 4", region: [48, 40], margin: 5 }
  - { key: "5", mods: [SHIFT], icon: groupadd5.png, label: "Add to group 5", region: [48, 40], margin: 5 }
  - { key: "6", mods: [SHIFT], icon: groupadd6.png, label: "Add to group 6", region: [48, 40], margin: 5 }
  - { key: "7", mods: [SHIFT], icon: groupadd7.png, label: "Add to group 7", region: [48, 40], margin: 5 }
  - { key: "8", mods: [SHIFT], icon: groupadd8.png, label: "Add to group 8", region: [48, 40], margin: 5 }
  - { key: "9", mods: [SHIFT], icon: groupadd9.png, label: "Add to group 9", region: [48, 40], margin: 5 }
  - { key: "0", mods: [SHIFT], icon: groupadd0.png, label: "Add to group 0", region: [48, 40], margin: 5 }

  # Heroes and selection
  - { key: F1, icon: hero1.png, label: "Select hero 1", region: [34, 40] }
  - { key: F2, icon: hero2.png, label: "Select hero 2", region: [34, 40] }
  - { key: F3, icon: hero3.png, label: "Select hero 3", region: [34, 40] }
  - { key: F8, icon: idleworker.png, label: "Select idle workers", region: [34, 40] }
  - { key: BSPC, icon: townhall.png, label: "Cycle town halls" }
  - { key: SPACE, icon: lastevent.png, label: "Go to last notification" }
  - { key: TAB, icon: subgroup.png, label: "Next subgroup" }
  - { key: C, mods: [CTRL], icon: portrait.png, label: "Center on portrait unit" }
  - { key: C, mods: [ALT], icon: portrait.png, label: "Center on portrait unit" }

  # Camera
  - { key: PGUP, icon: zoomin.png, label: "Camera: zoom in" }
  - { key: PGDN, icon: zoomout.png, label: "Camera: zoom out" }
  - { key: INSERT, icon: rotateleft.png, label: "Camera: rotate left" }
  - { key: DEL, icon: rotateright.png, label: "Camera: rotate right" }

  # Menus
  - { key: F9, icon: questlog.png, label: "Quest log" }
  - { key: F10, icon: gamemenu.png, label: "Game menu" }
  - { key: F11, icon: allies.png, label: "Allies menu" }
  - { key: F12, icon: chatlog.png, label: "Message log" }
  - { key: O, mods: [ALT], icon: options.png, label: "Options" }
  - { key: S, mods: [ALT], icon: save.png, label: "Save game" }
  - { key: L, mods: [ALT], icon: load.png, label: "Load game" }
  - { key: H, mods: [ALT], icon: help.png, label: "Help", shared: false }
  - { key: Q, mods: [ALT], icon: quit.png, label: "Quit", shared: false }
  - { key: M, mods: [CTRL], icon: music.png, label: "Music on / off" }
  - { key: S, mods: [CTRL], icon: sound.png, label: "Sound effects on / off" }
  - { key: PRTSC, icon: screenshot.png, label: "Screenshot" }

  # Chat
  - { key: ENTER, icon: chat.png, label: "Chat" }
  - { key: ENTER, mods: [SHIFT], icon: chatall.png, label: "Chat to all players" }
  - { key: ENTER, mods: [CTRL], icon: chatallies.png, label: "Chat to allies" }
