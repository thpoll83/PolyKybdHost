# keybr (keybr.com) practice-page keycap overlays for PolyKybd (Windows, Linux
# and macOS). See SOURCES.md.
#
# Keys: read from keybr's source, aradzie/keybr.com at commit
# 05a37bc5265f65ff538c59c613db29442f345d51. The practice page ("/", or
# "/<locale>") binds, in packages/page-practice/lib/practice/Controller.tsx:
#   * Ctrl+Left: reset the lesson (also Esc, which carries the ESC mark);
#   * Ctrl+Right: skip the lesson;
# and packages/keybr-textinput-ui/lib/TextArea.tsx binds Enter to focus the
# text, so typing goes to the lesson. The page's own buttons name the first two
# ("Reset the current lesson (Ctrl + Left Arrow)", Controls.tsx).
# keybr's hotkey parser (keybr-widget/lib/hooks/use-hotkeys.ts) tests the
# Control key itself, never Cmd, and macOS uses Ctrl+Left/Right to switch
# desktops by default, so the macOS set has only Enter. The letter, digit and
# punctuation keys type the lesson, so they stay empty.
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/typingtests/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/typingtests/keybr.yaml --preview /tmp/keybr_preview
app: keybr
match: [chrome]
output: keybr_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: alpha

program_icon: keybr.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  - { key: LEFT, mods: [CTRL], icon: reset.png, label: "Reset lesson", except: [macos] }
  - { key: RIGHT, mods: [CTRL], icon: skip.png, label: "Skip lesson", except: [macos] }
  - { key: ENTER, mods: [], icon: focus.png, label: "Focus the text" }
