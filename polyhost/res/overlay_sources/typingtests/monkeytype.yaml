# Monkeytype (monkeytype.com) keycap overlays for PolyKybd (Windows, Linux and
# macOS). See SOURCES.md.
#
# Keys: read from Monkeytype's source, monkeytypegame/monkeytype at commit
# 0e07023d4a7af1d0c2d8497afdff30eaff615279 (frontend/src/ts/input/hotkeys/,
# states/hotkeys.ts, input/handlers/keydown.ts), with the default config
# (constants/default-config.ts: quickRestart "off"). With that default:
#   * Esc opens the command line (states/hotkeys.ts). Esc carries the ESC mark.
#   * Ctrl+Shift+P (Cmd+Shift+P on macOS, "Mod") also opens the command line.
#   * Tab, then Enter restarts the test: the page labels it "tab > enter"
#     (components/hotkeys/QuickRestartHotkey.tsx). Tab moves the focus to the
#     restart button and Enter presses it.
#   * Shift+Enter finishes a zen-mode test, and pressed twice bails out of a
#     long test (input/handlers/keydown.ts handleEnter).
# The letter, digit and punctuation keys type the test text, so they stay
# empty. Firefox reserves Ctrl/Cmd+Shift+P for a private window, so Firefox
# loads monkeytype_firefox.yaml, which leaves that key out.
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/typingtests/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/typingtests/monkeytype.yaml --preview /tmp/monkeytype_preview
app: monkeytype
match: [chrome]
output: monkeytype_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py

program_icon: monkeytype.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  - { key: TAB, mods: [], icon: restart.png, label: "Restart test (then Enter)" }
  - { key: ENTER, mods: [SHIFT], icon: finish.png, label: "Finish zen / bail out" }
  - { key: P, mods: [CMDCTRL, SHIFT], icon: commandline.png, label: "Command line" }
