# GNOME Files (Nautilus) shortcut overlays for PolyKybd.
#
# Icons: Microsoft Fluent UI System Icons (MIT), two Material Symbols
# (Apache-2.0) for the list/grid views. Program icon (ESC, all layers):
# Nautilus's own symbolic icon (GPL-3.0-or-later). Shortcuts: Nautilus 46, read
# from its source. See SOURCES.md.
#
# Not drawn: Alt+0..8 (open tab N; the digit is the legend already) and
# "~" (home location bar), whose key depends on the keyboard layout.
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/nautilus/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/nautilus/bindings.yaml --preview /tmp/nautilus_preview
app: nautilus
match: [nautilus, org.gnome.Nautilus]   # X11 WM_CLASS (forwarder log, 2026-10-13) and the Wayland app id
output: nautilus_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: alpha

program_icon: nautilus.png       # dark glyph on transparent: the alpha is the shape
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [34, 34]

bindings:
  # --- Ctrl -> R channel of primary ---
  - { key: N, mods: [CTRL], icon: newwindow.png,   label: "New window" }
  - { key: T, mods: [CTRL], icon: newtab.png,      label: "New tab" }
  - { key: W, mods: [CTRL], icon: close.png,       label: Close }
  - { key: Q, mods: [CTRL], icon: quit.png,        label: Quit }
  - { key: F, mods: [CTRL], icon: search.png,      label: Search }
  - { key: L, mods: [CTRL], icon: location.png,    label: "Enter location" }
  - { key: D, mods: [CTRL], icon: bookmark.png,    label: Bookmark }
  - { key: H, mods: [CTRL], icon: hidden.png,      label: "Hidden files" }
  - { key: S, mods: [CTRL], icon: selectmatch.png, label: "Select matching" }
  - { key: M, mods: [CTRL], icon: link.png,        label: "Link to copied item" }
  - { key: I, mods: [CTRL], icon: properties.png,  label: Properties }
  - { key: O, mods: [CTRL], icon: open.png,        label: Open }
  - { key: ENTER, mods: [CTRL], icon: opentab.png, label: "Open in new tab" }
  - { key: "1", mods: [CTRL], icon: listview.png,  label: "List view" }
  - { key: "2", mods: [CTRL], icon: gridview.png,  label: "Grid view" }
  - { key: EQUAL, mods: [CTRL], icon: zoomin.png,  label: "Zoom in" }
  - { key: MINUS, mods: [CTRL], icon: zoomout.png, label: "Zoom out" }
  - { key: "0", mods: [CTRL], icon: zoomreset.png, label: "Reset zoom" }
  - { key: COMMA, mods: [CTRL], icon: preferences.png, label: Preferences }
  - { key: PGUP, mods: [CTRL], icon: prevtab.png,  label: "Previous tab" }
  - { key: PGDN, mods: [CTRL], icon: nexttab.png,  label: "Next tab" }
  # shared concepts (drawn by the shared renderer)
  - { key: A, mods: [CTRL], label: "Select all" }
  - { key: C, mods: [CTRL], label: Copy }
  - { key: X, mods: [CTRL], label: Cut }
  - { key: V, mods: [CTRL], label: Paste }
  - { key: Z, mods: [CTRL], label: Undo }
  - { key: R, mods: [CTRL], label: Reload }

  # --- Ctrl+Shift -> R channel of combo ---
  - { key: N, mods: [CTRL, SHIFT], icon: newfolder.png,  label: "New folder" }
  - { key: F, mods: [CTRL, SHIFT], icon: searchall.png,  label: "Search everywhere" }
  - { key: T, mods: [CTRL, SHIFT], icon: restoretab.png, label: "Restore tab" }
  - { key: M, mods: [CTRL, SHIFT], icon: linkhere.png,   label: "Link to selected item" }
  - { key: I, mods: [CTRL, SHIFT], icon: invertsel.png,  label: "Invert selection" }
  - { key: PGUP, mods: [CTRL, SHIFT], icon: movetableft.png,  label: "Move tab left" }
  - { key: PGDN, mods: [CTRL, SHIFT], icon: movetabright.png, label: "Move tab right" }
  - { key: SLASH, mods: [CTRL, SHIFT], icon: shortcuts.png,   label: "Keyboard shortcuts" }
  - { key: Z, mods: [CTRL, SHIFT], label: Redo }

  # --- Ctrl+Alt -> G channel of combo ---
  - { key: O, mods: [CTRL, ALT], icon: openlocation.png, label: "Open item location" }

  # --- Alt -> G channel of primary ---
  - { key: LEFT,  mods: [ALT], icon: back.png,       label: Back }
  - { key: RIGHT, mods: [ALT], icon: forward.png,    label: Forward }
  - { key: UP,    mods: [ALT], icon: up.png,         label: "Parent folder" }
  - { key: DOWN,  mods: [ALT], icon: down.png,       label: "Go down" }
  - { key: HOME,  mods: [ALT], icon: home.png,       label: Home }
  - { key: ENTER, mods: [ALT], icon: properties.png, label: Properties }

  # --- Shift -> B channel of primary ---
  - { key: ENTER, mods: [SHIFT], icon: openwindow.png, label: "Open in new window" }
  # `normalize` would fold this onto the bare concept "delete" (the trash can
  # on plain Del). Permanent delete is a different action, so it keeps its own icon.
  - { key: DELETE, mods: [SHIFT], icon: deleteperm.png, label: "Delete permanently", shared: false }

  # --- no modifier -> A channel of primary ---
  - { key: F1,     mods: [], icon: help.png,    label: Help }
  - { key: F2,     mods: [], icon: rename.png,  label: Rename }
  - { key: F5,     mods: [], label: Reload }
  - { key: F9,     mods: [], icon: sidebar.png, label: Sidebar }
  - { key: F10,    mods: [], icon: menu.png,    label: "Main menu" }
  - { key: DELETE, mods: [], icon: trash.png,   label: "Move to trash" }
  - { key: SLASH,  mods: [], icon: root.png,    label: "Root location" }
