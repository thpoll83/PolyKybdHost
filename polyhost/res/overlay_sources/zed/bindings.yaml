# Zed (zed.dev) shortcut overlays for PolyKybd.
#
# ONE spec, THREE artwork sets, because Zed ships three default keymaps
# (assets/keymaps/default-{windows,linux,macos}.json) and they genuinely differ:
#
#   zed_template.*        Windows   (the default set)
#   zed_linux_template.*  Linux     (`os: linux` branch)
#   zed_mac_template.*    macOS     (`os: macos` branch)
#
# ⚠️ CMDCTRL alone would NOT be faithful here. Measured over the drawable cells
# of the contexts below, macOS vs Linux (Cmd normalised to Ctrl): 113 cells
# agree, 32 cells bind the SAME chord to a DIFFERENT action, and 75 of 183
# shared actions sit on a disjoint chord set (Alt+1..9 is tab N on Linux, Ctrl+1..9
# on macOS; Ctrl+Shift+Up is "select previous occurrence" on Linux and "select to
# start of paragraph" on macOS; Fold is Ctrl+Shift+[ vs Cmd+Alt+[). Windows vs
# Linux also differs: 6 same-chord collisions and 19 moved actions (Linux avoids
# Alt+letter, so Windows' Alt+Shift+F format is Ctrl+Shift+I there).
# So every binding below is derived mechanically from the three keymaps and
# scoped with `only:`. A chord is written CMDCTRL only when it is literally Ctrl
# on Windows/Linux AND Cmd on macOS for the same action; otherwise it is literal
# (CTRL / GUI / ALT ...) and scoped to the platforms that bind it.
# See SOURCES.md for the derivation rules and the contexts drawn.
#
# `source:` on each binding = Zed action @ keymap line (w=default-windows.json,
# l=default-linux.json, m=default-macos.json) at the commit pinned in SOURCES.md.
#
# GENERATED by derive_bindings.py from derive_table.yaml -- edit the table, not
# this file. Regenerate (from the repo root, with the project venv):
#   git clone --filter=blob:none --sparse https://github.com/zed-industries/zed <zed>
#   git -C <zed> checkout 36682547bea1c3d4fa60c08d341cf60081853941
#   git -C <zed> sparse-checkout set assets/keymaps
#   .venv/bin/python polyhost/res/overlay_sources/zed/derive_bindings.py <zed>
#   .venv/bin/python polyhost/res/overlay_sources/zed/fetch_icons.py
#   PYTHONPATH=. .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/zed/bindings.yaml --preview /tmp/zed_preview
app: zed
match: [zed, zed preview, zed nightly, zed dev, zed-editor, dev.zed.zed, dev.zed.zed-preview, dev.zed.zed-nightly, dev.zed.zed-dev]
output: zed_template
output_macos: zed_mac_template
output_linux: zed_linux_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

# Zed's OWN app icon (GPL-3.0-or-later, crates/zed), cropped to its mark by
# fetch_icons.py. Dark tile with light linework -> `bright` (alpha = one blob).
# Swept t70..t160 x three regions; t110 keeps the nested frames open and the Z
# diagonal unbroken. See SOURCES.md.
program_icon: zed.png
program_icon_mode: bright
program_icon_threshold: 110
program_icon_region: [46, 40]
program_icon_anchor: right
program_icon_margin: 0

# JetBrains' reclaimed whole-cell drawings, borrowed byte-identical, render 1:1
# exactly as they do in ../jetbrains (same geometry -> same cell bytes).
_reclaimed: &reclaimed { region: [72, 40], anchor: center }

