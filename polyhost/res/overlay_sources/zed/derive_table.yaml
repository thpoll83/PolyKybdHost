# Hand-chosen table read by derive_bindings.py. Edit THIS, never bindings.yaml.
# actions: Zed action (with args when they matter) -> [group, label, icon].
# icon null = a lexicon concept drawn by the shared renderer.

contexts:   # context -> depth; deeper wins, negative = fill free cells only
  null: 0
  "!Terminal": 0
  "!SettingsWindow": 0
  "Workspace": 1
  "Workspace && !Terminal": 1
  "Pane": 2
  "Editor": 3
  "Editor && mode == full": 3
  "Workspace && debugger_stopped": -1
  "Workspace && debugger_session": -1
  "Workspace && debugger_running": -1

skip_prefix: ["menu::", "picker::", "dev::"]

skip:   # cursor/text primitives and macOS Emacs bindings
  - "editor::Backspace"
  - "editor::Backtab"
