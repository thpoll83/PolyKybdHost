# Ghidra CodeBrowser shortcut overlays for PolyKybd. See SOURCES.md.
#
# Keys: every default KeyBindingData in the Ghidra source at the tags
# Ghidra_12.2_build (newest release, 2026-10-15) and Ghidra_11.4.3_build, read
# 2026-10-30. Each cell draws what the key does in the Listing window, the main
# view of the CodeBrowser. Keys that act only in the Decompiler window (Ctrl+L,
# Ctrl+comma, backslash, Shift+]) are drawn as well, because the Listing has
# no action on them. Where the Decompiler gives a key another meaning, that is
# listed in SOURCES.md.
#
# Ghidra converts every Ctrl binding to the menu shortcut key, which is Cmd on
# macOS (KeyBindingUtils.validateKeyStroke), so they are all `CMDCTRL`. Alt is
# Option on macOS. `except: [macos]` leaves out a chord that macOS takes for
# itself before Ghidra sees it (Spotlight, Hide, the app switcher, Show
# Desktop, Dock hiding).
#
# Regenerate:
#   python polyhost/res/overlay_sources/ghidra/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/ghidra/bindings.yaml --preview /tmp/ghidra_preview
app: ghidra
match: []
output: ghidra_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: alpha
threshold: 150

program_icon: ghidra.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [46, 40]
program_icon_margin: 0

# A 40x40 composite (glyph + word) is placed 1:1.
_word: &word { region: [40, 40], mode: alpha }

bindings:
  # ---------------- single keys (Listing) ----------------
  - { key: D, icon: disassemble.png, label: "Disassemble" }
  - { key: C, icon: clear.png, label: "Clear code bytes" }
  - { key: L, icon: label.png, label: "Add or edit label" }
  - { key: H, icon: labelhistory.png, label: "Label history" }
  - { key: ";", icon: comment.png, label: "Set comment" }
  - { key: F, icon: function.png, label: "Create function" }
  - { key: B, icon: cycle_int.png, label: "Cycle byte/word/dword/qword", <<: *word }
  - { key: "'", icon: cycle_str.png, label: "Cycle char/string/unicode", <<: *word }
  - { key: T, icon: type_choose.png, label: "Choose data type", <<: *word }
  - { key: Y, icon: type_repeat.png, label: "Recently used data type", <<: *word }
  - { key: P, icon: pointer.png, label: "Pointer", <<: *word }
  - { key: V, icon: void.png, label: "Void", <<: *word }
  - { key: "[", icon: array.png, label: "Create array" }
  - { key: "[", mods: [SHIFT], icon: structure.png, label: "Create structure" }
  - { key: E, icon: equate.png, label: "Set equate" }
  - { key: R, icon: references.png, label: "View/edit references" }
  - { key: M, icon: markselect.png, label: "Mark and select" }
  - { key: G, icon: goto.png, label: "Go to address/label" }
  - { key: I, icon: import.png, label: "Import file" }
  - { key: O, icon: export.png, label: "Export program" }
  - { key: A, icon: autoanalyze.png, label: "Auto analyze" }
  - { key: S, icon: memsearch.png, label: "Search memory", <<: *word }
  - { key: "2", icon: programdiff.png, label: "Program differences" }
  - { key: SPACE, icon: expand.png, label: "Toggle expand (12.x)" }
  - { key: DELETE, icon: delete.png, label: "Delete" }
  # Decompiler window only (12.x)
  - { key: "\\", icon: casts.png, label: "Toggle type casts (Decompiler)", <<: *word }
  - { key: "]", mods: [SHIFT], icon: next_brace.png, label: "Next brace (Decompiler)", <<: *word }

  # ---------------- function keys ----------------
  - { key: F1, label: "Help" }
  - { key: F3, icon: search_next.png, label: "Next memory search match", <<: *word }
  - { key: F3, mods: [SHIFT], icon: search_prev.png, label: "Previous memory search match", <<: *word }
  - { key: F4, icon: keybinding.png, label: "Set key binding" }
  - { key: F5, icon: refresh.png, label: "Refresh decompiler (12.x)" }
  - { key: F10, mods: [SHIFT], icon: contextmenu.png, label: "Context menu" }
  - { key: F11, icon: isa_1.png, label: "Disassemble ARM / x86-64", except: [macos], <<: *word }
  - { key: F12, icon: isa_2.png, label: "Disassemble Thumb / x86-32", <<: *word }

  # ---------------- Ctrl (Cmd on macOS) ----------------
  - { key: Z, mods: [CMDCTRL], label: "Undo" }
  - { key: Z, mods: [CMDCTRL, SHIFT], label: "Redo" }
  - { key: S, mods: [CMDCTRL], label: "Save" }
  - { key: O, mods: [CMDCTRL], label: "Open" }
  - { key: W, mods: [CMDCTRL], label: "Close" }
  - { key: Q, mods: [CMDCTRL], label: "Quit" }
  - { key: P, mods: [CMDCTRL], label: "Print" }
  - { key: C, mods: [CMDCTRL], label: "Copy" }
  - { key: V, mods: [CMDCTRL], label: "Paste" }
  - { key: A, mods: [CMDCTRL], label: "Select all" }
  - { key: E, mods: [CMDCTRL], icon: decompiler.png, label: "Decompiler window" }
  - { key: B, mods: [CMDCTRL], icon: bookmarks.png, label: "Bookmarks window" }
  - { key: D, mods: [CMDCTRL], icon: addbookmark.png, label: "Add bookmark" }
  - { key: T, mods: [CMDCTRL], icon: symboltable.png, label: "Symbol table" }
  - { key: R, mods: [CMDCTRL], icon: registers.png, label: "Register values" }
  - { key: F, mods: [CMDCTRL], icon: searchtext.png, label: "Search program text" }
  - { key: H, mods: [CMDCTRL], icon: highlight.png, label: "Set highlight from selection", except: [macos] }
  - { key: G, mods: [CMDCTRL], icon: datagraph.png, label: "Data graph (12.x)" }
  - { key: I, mods: [CMDCTRL], icon: filesystem.png, label: "Open file system" }
  - { key: J, mods: [CMDCTRL], icon: next_pane.png, label: "Next window panel", <<: *word }
  - { key: J, mods: [CMDCTRL, SHIFT], icon: prev_pane.png, label: "Previous window panel", <<: *word }
  - { key: "3", mods: [CMDCTRL], icon: actionchooser.png, label: "Action chooser" }
  - { key: SPACE, mods: [CMDCTRL], icon: functiongraph.png, label: "Toggle Listing / Function Graph", except: [macos] }
  - { key: "=", mods: [CMDCTRL], icon: fontup.png, label: "Larger font" }
  - { key: "-", mods: [CMDCTRL], icon: fontdown.png, label: "Smaller font" }
  - { key: "9", mods: [CMDCTRL], icon: prev_highlight.png, label: "Previous highlighted range", <<: *word }
  - { key: "0", mods: [CMDCTRL], icon: next_highlight.png, label: "Next highlighted range", <<: *word }
  - { key: ";", mods: [CMDCTRL], icon: refs_back.png, label: "Select back references", <<: *word }
  - { key: ".", mods: [CMDCTRL], icon: refs_fwd.png, label: "Select forward references", <<: *word }
  - { key: ",", mods: [CMDCTRL], icon: prev_token.png, label: "Previous highlighted token (Decompiler)", <<: *word }
  - { key: L, mods: [CMDCTRL], icon: type_retype.png, label: "Retype (Decompiler)", <<: *word }
  - { key: TAB, mods: [CMDCTRL], icon: nextcomponent.png, label: "Next component", except: [macos] }
  - { key: TAB, mods: [CMDCTRL, SHIFT], icon: prevcomponent.png, label: "Previous component", except: [macos] }
  - { key: UP, mods: [CMDCTRL], icon: prev_func.png, label: "Previous function", <<: *word }
  - { key: DOWN, mods: [CMDCTRL], icon: next_func.png, label: "Next function", <<: *word }
  - { key: F3, mods: [CMDCTRL], icon: next_window.png, label: "Next window", <<: *word }
  - { key: F3, mods: [CMDCTRL, SHIFT], icon: prev_window.png, label: "Previous window", <<: *word }
  - { key: F6, mods: [CMDCTRL], icon: lastactive.png, label: "Last active component" }
  - { key: F7, mods: [CMDCTRL], icon: gotoprogram.png, label: "Go to program" }
  - { key: F8, mods: [CMDCTRL], icon: prev_tab.png, label: "Previous program tab", <<: *word }
  - { key: F9, mods: [CMDCTRL], icon: next_tab.png, label: "Next program tab", <<: *word }

  # ---------------- Ctrl+Shift (Cmd+Shift) ----------------
  - { key: D, mods: [CMDCTRL, SHIFT], icon: type_edit.png, label: "Edit data type", <<: *word }
  - { key: R, mods: [CMDCTRL, SHIFT], icon: rerun_script.png, label: "Rerun last script", <<: *word }
  - { key: S, mods: [CMDCTRL, SHIFT], icon: scripts.png, label: "Script quick launch" }
  - { key: E, mods: [CMDCTRL, SHIFT], icon: editfield.png, label: "Edit field" }
  - { key: F, mods: [CMDCTRL, SHIFT], icon: finduses.png, label: "Find uses of data type", <<: *word }
  - { key: G, mods: [CMDCTRL, SHIFT], icon: patch_ins.png, label: "Patch instruction", <<: *word }
  - { key: H, mods: [CMDCTRL, SHIFT], icon: patch_data.png, label: "Patch data", <<: *word }
  - { key: T, mods: [CMDCTRL, SHIFT], icon: cloneview.png, label: "Clone view" }
  - { key: "[", mods: [CMDCTRL, SHIFT], icon: next_selection.png, label: "Next selected range", <<: *word }
  - { key: "]", mods: [CMDCTRL, SHIFT], icon: prev_selection.png, label: "Previous selected range", <<: *word }

  # ---------------- Ctrl+Alt (Cmd+Option): navigation ----------------
  - { key: T, mods: [CMDCTRL, ALT], icon: togglesearchdir.png, label: "Toggle search direction" }
  - { key: I, mods: [CMDCTRL, ALT], icon: next_ins.png, label: "Next instruction", <<: *word }
  - { key: D, mods: [CMDCTRL, ALT], icon: next_data.png, label: "Next data", except: [macos], <<: *word }
  - { key: U, mods: [CMDCTRL, ALT], icon: next_undef.png, label: "Next undefined", <<: *word }
  - { key: L, mods: [CMDCTRL, ALT], icon: next_label.png, label: "Next label", <<: *word }
  - { key: F, mods: [CMDCTRL, ALT], icon: next_func.png, label: "Next function", <<: *word }
  - { key: V, mods: [CMDCTRL, ALT], icon: next_bytes.png, label: "Next different byte value", <<: *word }
  - { key: B, mods: [CMDCTRL, ALT], icon: next_bookmark.png, label: "Next bookmark", <<: *word }
  - { key: N, mods: [CMDCTRL, ALT], icon: next_diff.png, label: "Next difference", <<: *word }
  - { key: P, mods: [CMDCTRL, ALT], icon: prev_diff.png, label: "Previous difference", <<: *word }
  - { key: R, mods: [CMDCTRL, ALT], icon: defaultref.png, label: "Create default reference" }

  # ---------------- Alt (Option): history ----------------
  - { key: LEFT, mods: [ALT], icon: back.png, label: "Back" }
  - { key: RIGHT, mods: [ALT], icon: forward.png, label: "Forward" }
  - { key: LEFT, mods: [ALT, SHIFT], icon: hist_func_back.png, label: "Previous function in history", <<: *word }
  - { key: RIGHT, mods: [ALT, SHIFT], icon: hist_func_fwd.png, label: "Next function in history", <<: *word }
