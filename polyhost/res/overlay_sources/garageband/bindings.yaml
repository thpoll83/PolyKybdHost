# GarageBand shortcut overlays for PolyKybd (macOS only). See SOURCES.md.
#
# Shortcuts: Apple, GarageBand User Guide for Mac, "Main window shortcuts in
# GarageBand on Mac". GarageBand is a macOS app, so every binding is scoped
# `only: [macos]` and only the `_mac` set is written. Command is GUI, Option is
# ALT, Control is CTRL.
#
# On macOS the host also reads every menu shortcut of the focused app; those
# fill each key this set leaves free.
#
# Left out: numeric keypad keys (no cell), fn and Page/Home/End scrolling, Tab
# focus, the system window keys (Cmd+H, Option+Cmd+H, Cmd+M, Option+Cmd+M,
# Ctrl+Cmd+M) and Esc (the program mark, which the host draws). SOURCES.md lists
# every omission.
#
# Regenerate:
#   python polyhost/res/overlay_sources/garageband/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/garageband/bindings.yaml --preview /tmp/garageband_preview
app: garageband
match: [garageband]
output: garageband_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

# No program_icon: ESC is left to the host's program mark (the app's own
# icon from its bundle), as for the other proprietary apps.

_m: &m { only: [macos] }

bindings:
  # --- Projects ---
  - { key: N, mods: [GUI], <<: *m, label: New }
  - { key: O, mods: [GUI], <<: *m, label: Open }
  - { key: S, mods: [GUI], <<: *m, label: Save }
  - { key: S, mods: [GUI, SHIFT], <<: *m, label: "Save as" }
  - { key: W, mods: [GUI], <<: *m, label: Close }
  - { key: Q, mods: [GUI], <<: *m, label: Quit }

  # --- Tracks ---
  - { key: N, mods: [GUI, ALT], icon: inserttrack.png, <<: *m, label: "New track" }
  - { key: A, mods: [GUI, ALT], icon: audiotrack.png, <<: *m, label: "New audio track" }
  - { key: S, mods: [GUI, ALT], icon: miditrack.png, <<: *m, label: "New software instrument track" }
  - { key: D, mods: [GUI], icon: trackdup.png, <<: *m, label: "Duplicate track" }
  - { key: BACKSPACE, mods: [GUI], icon: removetrack.png, <<: *m, label: "Delete track" }
  - { key: M, mods: [GUI, SHIFT], icon: master.png, <<: *m, label: "Master track" }
  - { key: UP, mods: [], icon: prevtrack.png, <<: *m, label: "Select higher track" }
  - { key: DOWN, mods: [], icon: nexttrack.png, <<: *m, label: "Select lower track" }
  - { key: ENTER, mods: [SHIFT], icon: rename.png, <<: *m, label: "Rename track" }
  - { key: T, mods: [ALT], icon: trackheader.png, <<: *m, label: "Configure track header" }
  - { key: RBRACKET, mods: [], icon: nextpatch.png, <<: *m, label: "Next patch" }
  - { key: LBRACKET, mods: [], icon: prevpatch.png, <<: *m, label: "Previous patch" }
  - { key: I, mods: [GUI, SHIFT], icon: import.png, <<: *m, label: "Import audio file" }
  - { key: O, mods: [GUI, ALT], icon: video.png, <<: *m, label: "Import movie" }

  # --- Transport ---
  - { key: SPACE, mods: [], icon: playstop.png, <<: *m, label: "Play/stop" }
  - { key: SPACE, mods: [SHIFT], icon: playsel.png, <<: *m, label: "Play from selection" }
  - { key: SPACE, mods: [ALT], icon: preview.png, <<: *m, label: "Preview audio file" }
  - { key: R, mods: [], icon: record.png, <<: *m, label: Record }
  - { key: COMMA, mods: [], icon: rewind.png, <<: *m, label: "Back one bar" }
  - { key: DOT, mods: [], icon: fastforward.png, <<: *m, label: "Forward one bar" }
  - { key: DOT, mods: [GUI, SHIFT], icon: gridright.png, <<: *m, label: "Cycle range forward" }
  - { key: COMMA, mods: [GUI, SHIFT], icon: gridleft.png, <<: *m, label: "Cycle range back" }
  - { key: COMMA, mods: [CTRL, SHIFT], icon: loopstart.png, <<: *m, label: "To left locator" }
  - { key: DOT, mods: [CTRL, SHIFT], icon: loopend.png, <<: *m, label: "To right locator" }
  - { key: ENTER, mods: [], icon: tostart.png, <<: *m, label: "Go to beginning" }
  - { key: ENTER, mods: [ALT], icon: toend.png, <<: *m, label: "Go to end of last region" }
  - { key: HOME, mods: [CTRL], icon: trimstart.png, <<: *m, label: "Go to selection start" }

  # --- Modes ---
  - { key: S, mods: [], icon: solo.png, <<: *m, label: Solo }
  - { key: S, mods: [ALT], icon: clearsolo.png, <<: *m, label: "Clear/recall solo" }
  - { key: M, mods: [], icon: mute.png, <<: *m, label: Mute }
  - { key: M, mods: [CTRL, SHIFT], icon: unmutesel.png, <<: *m, label: "Mute off, all tracks" }
  - { key: I, mods: [CTRL], icon: inputmon.png, <<: *m, label: "Input monitoring" }
  - { key: R, mods: [CTRL], icon: arm.png, <<: *m, label: "Record enable" }
  - { key: C, mods: [], icon: loop.png, <<: *m, label: "Cycle mode" }
  - { key: K, mods: [], icon: metronome.png, <<: *m, label: Metronome }
  - { key: K, mods: [SHIFT], icon: countin.png, <<: *m, label: "Count-in" }
  - { key: G, mods: [GUI, ALT], icon: guides.png, <<: *m, label: "Alignment guides" }
  - { key: G, mods: [GUI], icon: snap.png, <<: *m, label: "Snap to grid" }
  - { key: GRAVE, mods: [], icon: follow.png, <<: *m, label: "Catch playhead" }

  # --- Windows ---
  - { key: Y, mods: [], icon: library.png, <<: *m, label: Library }
  - { key: SLASH, mods: [SHIFT], icon: help.png, <<: *m, label: "Quick Help" }
  - { key: SLASH, mods: [GUI], <<: *m, label: Help }
  - { key: B, mods: [], icon: smartcontrols.png, <<: *m, label: "Smart Controls" }
  - { key: E, mods: [], icon: lowerzone.png, <<: *m, label: "Editor pane" }
  - { key: P, mods: [], icon: pianoroll.png, <<: *m, label: "Piano Roll" }
  - { key: N, mods: [], icon: scoreeditor.png, <<: *m, label: "Score Editor" }
  - { key: P, mods: [GUI, ALT], icon: notepad.png, <<: *m, label: "Note pad" }
  - { key: O, mods: [], icon: loopbrowser.png, <<: *m, label: "Loop Browser" }
  - { key: C, mods: [ALT], icon: color.png, <<: *m, label: "Color palette" }
  - { key: COMMA, mods: [GUI], icon: settings.png, <<: *m, label: Settings }
  - { key: K, mods: [GUI], icon: keymap.png, <<: *m, label: "Musical Typing" }
  - { key: F, mods: [GUI, CTRL], icon: fullscreen.png, <<: *m, label: "Full screen" }

  # --- Editing ---
  - { key: Z, mods: [GUI], <<: *m, label: Undo }
  - { key: Z, mods: [GUI, SHIFT], <<: *m, label: Redo }
  - { key: X, mods: [GUI], <<: *m, label: Cut }
  - { key: C, mods: [GUI], <<: *m, label: Copy }
  - { key: V, mods: [GUI], <<: *m, label: Paste }
  - { key: V, mods: [GUI, SHIFT], icon: inspaste.png, <<: *m, label: "Paste and replace" }
  - { key: A, mods: [GUI], <<: *m, label: "Select all" }
  - { key: D, mods: [SHIFT], icon: deselect.png, <<: *m, label: "Deselect all" }
  - { key: BACKSPACE, mods: [], <<: *m, label: Delete }
  - { key: LEFT, mods: [GUI], <<: *m, label: "Zoom out" }
  - { key: RIGHT, mods: [GUI], <<: *m, label: "Zoom in" }
  - { key: LEFT, mods: [], icon: prevclip.png, <<: *m, label: "Previous region" }
  - { key: RIGHT, mods: [], icon: nextclip.png, <<: *m, label: "Next region" }
  - { key: A, mods: [], icon: automation.png, <<: *m, label: "Automation lanes" }
  - { key: BACKSPACE, mods: [GUI, CTRL, SHIFT], icon: cutarea.png, <<: *m, label: "Delete all automation" }
  - { key: L, mods: [], icon: loopregion.png, <<: *m, label: "Loop regions" }
  - { key: Q, mods: [], icon: quantize.png, <<: *m, label: Quantize }
  - { key: J, mods: [GUI], icon: glue.png, <<: *m, label: Join }
  - { key: T, mods: [GUI], icon: split.png, <<: *m, label: "Split at playhead" }
  - { key: O, mods: [CTRL, SHIFT], icon: addloop.png, <<: *m, label: "Add to loop library" }
  - { key: N, mods: [SHIFT], icon: rename.png, <<: *m, label: "Rename regions" }
