# Adobe After Effects shortcut overlays for PolyKybd.
#
# Icons: Microsoft Fluent UI System Icons (MIT). Program mark (ESC, all layers):
# drawn substitute, NOT the Adobe trademark. See SOURCES.md.
# Shortcuts: After Effects Windows defaults, from Adobe's own keyboard-shortcuts
# reference (see SOURCES.md).
#
# Regenerate:
#   python polyhost/res/overlay_sources/aftereffects/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/aftereffects/bindings.yaml --preview /tmp/ae_preview
app: aftereffects
match: [adobe after effects]
output: aftereffects_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: aftereffects.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [42, 34]
program_icon_margin: 0

bindings:
  # --- layer properties (no modifier -> A channel): After Effects' signature row.
  # Each reveals that property in the timeline for the selected layer.
  - { key: A, mods: [], icon: anchorpoint.png, label: "Anchor point", source: "ms-fluent/Target (MIT)" }
  - { key: P, mods: [], icon: position.png,    label: Position,       source: "ms-fluent/Arrow Move (MIT)" }
  - { key: S, mods: [], icon: scale.png,       label: Scale,          source: "ms-fluent/Resize (MIT)" }
  - { key: R, mods: [], icon: rotation.png,    label: Rotation,       source: "ms-fluent/Arrow Rotate Clockwise (MIT)" }
  - { key: T, mods: [], icon: opacity.png,     label: Opacity,        source: "ms-fluent/Circle Half Fill (MIT)" }
  - { key: F, mods: [], icon: feather.png,     label: "Mask feather", source: "ms-fluent/Blur (MIT)" }
  - { key: E, mods: [], icon: effects.png,     label: Effects,        source: "ms-fluent/Wand (MIT)" }
  - { key: U, mods: [], icon: keyframes.png,   label: Keyframes,      source: "ms-fluent/Diamond (MIT)" }

  # --- tools (no modifier) ---
  - { key: V, mods: [], icon: select.png,    label: "Selection tool",  source: "ms-fluent/Cursor (MIT)" }
  - { key: H, mods: [], icon: hand.png,      label: "Hand tool",       source: "ms-fluent/Hand Right (MIT)" }
  - { key: Z, mods: [], icon: zoom.png,      label: "Zoom tool",       source: "ms-fluent/Zoom In (MIT)" }
  - { key: W, mods: [], icon: rotation.png,  label: "Rotation tool",   source: "ms-fluent/Arrow Rotate Clockwise (MIT)" }
  - { key: G, mods: [], icon: pen.png,       label: "Pen tool",        source: "ms-fluent/Pen (MIT)" }
  - { key: Q, mods: [], icon: shape.png,     label: "Shape / mask tool", source: "ms-fluent/Shapes (MIT)" }
  - { key: Y, mods: [], icon: panbehind.png, label: "Pan behind tool", source: "ms-fluent/Drag (MIT)" }

  # --- timeline (no modifier) ---
  - { key: I, mods: [], icon: gotoin.png,  label: "Go to layer In",  source: "ms-fluent/Arrow Import (MIT)" }
  - { key: O, mods: [], icon: gotoout.png, label: "Go to layer Out", source: "ms-fluent/Arrow Export (MIT)" }
  - { key: SPACE, mods: [], icon: preview.png, label: Preview,       source: "ms-fluent/Play (MIT)" }

  # --- Ctrl (R channel of the primary file) ---
  - { key: N, mods: [CTRL], icon: newcomp.png,      label: "New composition",    source: "ms-fluent/Add Square (MIT)" }
  - { key: O, mods: [CTRL], icon: open.png,         label: "Open project",       source: "ms-fluent/Folder Open (MIT)" }
  - { key: S, mods: [CTRL], icon: save.png,         label: Save,                 source: "ms-fluent/Save (MIT)" }
  - { key: I, mods: [CTRL], icon: import.png,       label: Import,               source: "ms-fluent/Arrow Import (MIT)" }
  - { key: K, mods: [CTRL], icon: compsettings.png, label: "Composition settings", source: "ms-fluent/Settings (MIT)" }
  - { key: M, mods: [CTRL], icon: renderqueue.png,  label: "Add to render queue", source: "ms-fluent/List (MIT)" }
  - { key: Y, mods: [CTRL], icon: solid.png,        label: "New solid",          source: "ms-fluent/Square (MIT)" }
  - { key: T, mods: [CTRL], icon: type.png,         label: "Type tool",          source: "ms-fluent/Text T (MIT)" }
  - { key: Z, mods: [CTRL], icon: undo.png,         label: Undo,                 source: "ms-fluent/Arrow Undo (MIT)" }
  - { key: X, mods: [CTRL], icon: cut.png,          label: Cut,                  source: "ms-fluent/Cut (MIT)" }
  - { key: C, mods: [CTRL], icon: copy.png,         label: Copy,                 source: "ms-fluent/Copy (MIT)" }
  - { key: V, mods: [CTRL], icon: paste.png,        label: Paste,                source: "ms-fluent/Clipboard Paste (MIT)" }
  - { key: A, mods: [CTRL], icon: selectall.png,    label: "Select all",         source: "ms-fluent/Select All On (MIT)" }
  - { key: D, mods: [CTRL], icon: duplicate.png,    label: Duplicate,            source: "ms-fluent/Square Multiple (MIT)" }

  # --- Ctrl+Shift (R channel of the combo file) ---
  - { key: Z, mods: [CTRL, SHIFT], icon: redo.png,       label: Redo,         source: "ms-fluent/Arrow Redo (MIT)" }
  - { key: D, mods: [CTRL, SHIFT], icon: splitlayer.png, label: "Split layer", source: "ms-fluent/Split Vertical (MIT)" }
  - { key: C, mods: [CTRL, SHIFT], icon: precompose.png, label: Precompose,   source: "ms-fluent/Layer (MIT)" }
