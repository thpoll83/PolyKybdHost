# Microsoft Sticky Notes shortcut overlays for PolyKybd.
#
# ⚠️ EVERY binding below is from Microsoft's OWN published table -- "Keyboard
# shortcuts for Sticky Notes", support.microsoft.com/en-us/office/
# keyboard-shortcuts-for-sticky-notes-feb2133e-5b3e-4447-8c71-9803349eeeb5 --
# complete, in both its sections ("Type and edit" and "Format"). Nothing here is
# a guess or a second-hand list, which is why this app got an overlay while
# Camera and Weather did not (see SOURCES.md).
#
# ⚠️ THE PROCESS IS `ONENOTE.EXE`, NOT A STICKY NOTES BINARY. The new Sticky
# Notes ships inside OneNote, so the app name the window tracker reports is
# "onenote" and the TITLE is the only thing that says which app is on screen --
# the same shape as the Win11 packaged apps under `ApplicationFrameHost.exe`.
# Observed in a field daemon_log.txt (2026-09-14): `"ONENOTE.EXE", Title:
# 'Sticky Notes (new)'` -> "No match". The mapping entry therefore matches on
# title AND names its own mark with `icon:`, or the keycap would show a OneNote
# logo for a Sticky Notes window.
#
# Regenerate:
#   python polyhost/res/overlay_sources/stickynotes/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/stickynotes/bindings.yaml --preview /tmp/sn
app: stickynotes
match: [onenote]
output: stickynotes_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha

# No `program_icon:` -- the mark comes from the mapping entry's `icon:`
# (mdi:sticker-text), because a process-name lookup would resolve to OneNote.

bindings:
  # --- Ctrl: the note itself --------------------------------------------
  - { key: N, mods: [CTRL], icon: newnote.png,   label: "New sticky note" }
  - { key: W, mods: [CTRL], icon: closenote.png, label: "Close the current note" }
  - { key: D, mods: [CTRL], icon: delnote.png,   label: "Delete the current note" }
  - { key: H, mods: [CTRL], icon: noteslist.png, label: "Move focus to the list of all notes" }
  - { key: TAB, mods: [CTRL], icon: cyclefwd.png, label: "Cycle forward between open notes" }

  # --- Ctrl: editing -----------------------------------------------------
  - { key: A, mods: [CTRL], icon: selectall.png, label: "Select all text on the note" }
  - { key: C, mods: [CTRL], icon: copy.png,      label: "Copy" }
  - { key: X, mods: [CTRL], icon: cut.png,       label: "Cut" }
  - { key: V, mods: [CTRL], icon: paste.png,     label: "Paste" }
  - { key: Z, mods: [CTRL], icon: undo.png,      label: "Undo" }
  - { key: Y, mods: [CTRL], icon: redo.png,      label: "Redo" }
  - { key: F, mods: [CTRL], icon: find.png,      label: "Search in any sticky note" }

  # --- Ctrl: caret motion ------------------------------------------------
  # Home/End with no modifier are deliberately absent: the keycap already shows
  # the key, and they mean the same thing in every text field on the machine.
  - { key: LEFT,  mods: [CTRL], icon: wordleft.png,   label: "Move one word left" }
  - { key: RIGHT, mods: [CTRL], icon: wordright.png,  label: "Move one word right" }
  - { key: HOME,  mods: [CTRL], icon: notetop.png,    label: "Move to the beginning of the note" }
  - { key: END,   mods: [CTRL], icon: notebottom.png, label: "Move to the end of the note" }
  - { key: DELETE,    mods: [CTRL], icon: delword.png,     label: "Delete the next word" }
  - { key: BACKSPACE, mods: [CTRL], icon: delwordback.png, label: "Delete the previous word" }

  # --- Ctrl: formatting --------------------------------------------------
  - { key: B, mods: [CTRL], icon: bold.png,      label: "Bold" }
  - { key: I, mods: [CTRL], icon: italic.png,    label: "Italic" }
  - { key: U, mods: [CTRL], icon: underline.png, label: "Underline" }
  - { key: T, mods: [CTRL], icon: strike.png,    label: "Strikethrough" }

  # --- Ctrl+Shift --------------------------------------------------------
  - { key: L,   mods: [CTRL, SHIFT], icon: bullets.png,   label: "Bulleted list" }
  - { key: TAB, mods: [CTRL, SHIFT], icon: cycleback.png, label: "Cycle backwards between open notes" }

  # ⚠️ TWO documented shortcuts are deliberately NOT drawn:
  #   * `Esc` (clear the search box) -- the program mark owns ESC on every
  #     overlay in this repo, and `tests/res/overlay_cells_test.py` fails the
  #     build if a binding collides with it.
  #   * `Alt+F4` (close Sticky Notes) -- Windows owns that chord on every window;
  #     it is filtered out of the UIA harvest for the same reason
  #     (WINDOW_MANAGER_CHORDS in services/shortcut_source/model.py), so drawing
  #     it here would contradict the rest of the app.
