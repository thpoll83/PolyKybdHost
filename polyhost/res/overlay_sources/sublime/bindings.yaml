# Sublime Text shortcut overlays for PolyKybd.
#
# Icons: Microsoft Fluent UI System Icons (MIT) + shared custom-drawn editor
# glyphs (../editor_glyphs.py). Program mark (ESC, all layers): drawn
# substitute, NOT the Sublime HQ logo. See SOURCES.md.
# Shortcuts: Sublime Text Windows/Linux defaults (docs.sublimetext.io).
#
# NOTE: Sublime's two-key chords (Ctrl+K, Ctrl+B / Ctrl+K, Ctrl+U / ...) are
# deliberately absent - an overlay cell shows one keypress, so a chord prefix
# cannot be represented. See SOURCES.md.
#
# Regenerate:
#   python polyhost/res/overlay_sources/sublime/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/sublime/bindings.yaml --preview /tmp/sublime_preview
app: sublime_text
match: [sublime_text]
output: sublime_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: sublime.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [42, 34]
program_icon_margin: 0

bindings:
  # --- Ctrl (R channel of the primary file) ---
  - { key: P, mods: [CTRL], icon: gotoanything.png, label: "Goto Anything",  source: "ms-fluent/Document Search (MIT)" }
  - { key: R, mods: [CTRL], icon: gotosymbol.png,   label: "Goto symbol",    source: "ms-fluent/Code (MIT)" }
  - { key: G, mods: [CTRL], icon: gotoline.png,     label: "Goto line",      source: "ms-fluent/Text Number Format (MIT)" }
  - { key: ";", mods: [CTRL], icon: gotoword.png,   label: "Goto word",      source: "ms-fluent/Text Word Count (MIT)" }
  - { key: D, mods: [CTRL], icon: multicursor.png,  label: "Select next occurrence", source: "custom/editor_glyphs", mode: alpha }
  - { key: L, mods: [CTRL], icon: selectline.png,   label: "Select line",    source: "custom/editor_glyphs", mode: alpha }
  - { key: M, mods: [CTRL], icon: matchbracket.png, label: "Jump to matching bracket", source: "ms-fluent/Braces (MIT)" }
  - { key: "]", mods: [CTRL], icon: indent.png,     label: Indent,           source: "ms-fluent/Text Indent Increase (MIT)" }
  - { key: "[", mods: [CTRL], icon: unindent.png,   label: Un-indent,        source: "ms-fluent/Text Indent Decrease (MIT)" }
  - { key: "/", mods: [CTRL], icon: comment.png,    label: "Toggle comment", source: "ms-fluent/Comment (MIT)" }
  - { key: F, mods: [CTRL], icon: find.png,         label: Find,             source: "ms-fluent/Search (MIT)" }
  - { key: H, mods: [CTRL], icon: replace.png,      label: Replace,          source: "ms-fluent/Arrow Swap (MIT)" }
  - { key: B, mods: [CTRL], icon: build.png,        label: Build,            source: "ms-fluent/Play (MIT)" }
  - { key: W, mods: [CTRL], icon: closetab.png,     label: "Close tab",      source: "ms-fluent/Dismiss (MIT)" }
  - { key: X, mods: [CTRL], icon: cutline.png,      label: "Cut line",       source: "ms-fluent/Cut (MIT)" }
  - { key: Y, mods: [CTRL], icon: redo.png,         label: Redo,             source: "ms-fluent/Arrow Redo (MIT)" }
  - { key: U, mods: [CTRL], icon: softundo.png,     label: "Soft undo",      source: "ms-fluent/Arrow Undo (MIT)" }
  - { key: SPACE, mods: [CTRL], icon: autocomplete.png, label: Autocomplete, source: "ms-fluent/Text Grammar Wand (MIT)" }
  - { key: ENTER, mods: [CTRL], icon: insertafter.png,  label: "Insert line after", source: "ms-fluent/Arrow Enter (MIT)" }

  # --- Ctrl+Shift (R channel of the combo file) ---
  - { key: P, mods: [CTRL, SHIFT], icon: commandpalette.png, label: "Command palette", source: "ms-fluent/Apps List Detail (MIT)" }
  - { key: D, mods: [CTRL, SHIFT], icon: duplicate.png,   label: "Duplicate line",  source: "ms-fluent/Row Triple (MIT)" }
  - { key: K, mods: [CTRL, SHIFT], icon: deleteline.png,  label: "Delete line",     source: "custom/editor_glyphs", mode: alpha }
  - { key: J, mods: [CTRL, SHIFT], icon: joinlines.png,   label: "Join lines",      source: "ms-fluent/Text Wrap Off (MIT)" }
  - { key: "/", mods: [CTRL, SHIFT], icon: blockcomment.png, label: "Block comment", source: "ms-fluent/Comment Multiple (MIT)" }
  - { key: F, mods: [CTRL, SHIFT], icon: findinfiles.png, label: "Find in files",   source: "ms-fluent/Folder Open (MIT)" }
  - { key: T, mods: [CTRL, SHIFT], icon: reopentab.png,   label: "Reopen closed tab", source: "ms-fluent/Tab Desktop (MIT)" }
  - { key: V, mods: [CTRL, SHIFT], icon: pasteindent.png, label: "Paste and indent", source: "ms-fluent/Clipboard Paste (MIT)" }
  - { key: M, mods: [CTRL, SHIFT], icon: selectbrackets.png, label: "Select inside brackets", source: "ms-fluent/Braces (MIT)" }
  - { key: "[", mods: [CTRL, SHIFT], icon: fold.png,      label: Fold,              source: "ms-fluent/Text Collapse (MIT)" }
  - { key: "]", mods: [CTRL, SHIFT], icon: unfold.png,    label: Unfold,            source: "ms-fluent/Text Expand (MIT)" }
  - { key: UP,   mods: [CTRL, SHIFT], icon: swapup.png,   label: "Swap line up",    source: "ms-fluent/Arrow Sort Up (MIT)" }
  - { key: DOWN, mods: [CTRL, SHIFT], icon: swapdown.png, label: "Swap line down",  source: "ms-fluent/Arrow Sort Down (MIT)" }
  - { key: ENTER, mods: [CTRL, SHIFT], icon: insertbefore.png, label: "Insert line before", source: "ms-fluent/Arrow Enter (MIT)" }

  # --- Ctrl+Alt (G channel of the combo file): multiple cursors ---
  - { key: UP,   mods: [CTRL, ALT], icon: cursorabove.png, label: "Add cursor above", source: "custom/editor_glyphs", mode: alpha }
  - { key: DOWN, mods: [CTRL, ALT], icon: cursorbelow.png, label: "Add cursor below", source: "custom/editor_glyphs", mode: alpha }

  # --- Alt (G channel of the primary file) ---
  - { key: F3, mods: [ALT], icon: selectalloccur.png, label: "Select all occurrences", source: "ms-fluent/Select All On (MIT)" }
  - { key: ".", mods: [ALT], icon: wraptag.png,       label: "Close HTML tag",         source: "ms-fluent/Code (MIT)" }

  # --- Alt+Shift (B channel of the combo file) ---
  - { key: W, mods: [ALT, SHIFT], icon: wraptag.png, label: "Wrap selection in tag", source: "ms-fluent/Code (MIT)" }

  # --- bookmarks (no modifier) ---
  - { key: F2, mods: [], icon: bookmark.png, label: "Next bookmark", source: "ms-fluent/Bookmark (MIT)" }
