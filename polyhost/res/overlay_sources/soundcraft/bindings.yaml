# SoundCraft (ArtCraft "Crafting Apps", Pro-Tools-style DAW) shortcut overlays.
#
# Shortcuts: SoundCraft's OWN keymap at storytold/soundcraft@c0cb9934 (the
# engine command registry, menus.rs UI_COMMANDS and shortcuts.rs) -- NOT Avid
# Pro Tools'. file:line for every group is in SOURCES.md.
#
# The registry stores macOS strings: "Cmd" is Cmd on macOS and Ctrl elsewhere
# (shortcuts.rs::mods_match), so it is written CMDCTRL and the generator emits
# soundcraft_template.* and soundcraft_template_mac.*. A registry "Ctrl" is the
# Mac CONTROL key and has no key off macOS, so those chords are `only: [macos]`
# -- except the four that shortcuts.rs::fixed also maps to Ctrl off macOS
# (track height, clip gain), which are literal CTRL on every platform.
#
# Single letters are "Commands Keyboard Focus", on by default
# (model/session.rs:287 keyboard_focus: "commands"), Edit window only.
#
# Icons: Fluent (MIT) + Material Symbols (Apache-2.0) via fetch_icons.py,
# Premiere's committed icons for shared actions, ../nle_glyphs.py, drawn fades,
# ../number_badge.py composites. Program mark: SoundCraft's own icon (MIT OR
# Apache-2.0). See SOURCES.md.
#
# Regenerate:
#   python polyhost/res/overlay_sources/soundcraft/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/soundcraft/bindings.yaml --preview /tmp/soundcraft_preview
app: soundcraft
match: [soundcraft, ai.storyteller.soundcraft]
output: soundcraft_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: soundcraft.png
program_icon_mode: luma
program_icon_threshold: 110
program_icon_anchor: bottom-right
program_icon_region: [42, 40]
program_icon_margin: 0

