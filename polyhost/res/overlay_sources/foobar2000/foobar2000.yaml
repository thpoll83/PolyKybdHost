# foobar2000 shortcut overlay for PolyKybd. See SOURCES.md.
#
# Keys are the nine predefined shortcuts of a fresh foobar2000 installation
# (v0.9.5 and later), as listed on the Hydrogenaudio Knowledgebase page
# "Foobar2000:Preferences:Keyboard Shortcuts". Every shortcut can be changed
# in Preferences > General > Keyboard Shortcuts; playback keys have no default.
# Windows only: the macOS build has no documented default list.
#
# Regenerate:
#   PYTHONPATH=. .venv/bin/python polyhost/res/overlay_sources/foobar2000/fetch_icons.py
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/foobar2000/foobar2000.yaml --preview /tmp/foobar2000_preview
app: foobar2000
match: [foobar2000]
output: foobar2000_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 128

program_icon: foobar2000.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  - { key: F, mods: [CTRL], icon: search.png, label: Search }
  - { key: N, mods: [CTRL], icon: newplaylist.png, label: "New playlist" }
  - { key: O, mods: [CTRL], icon: openfile.png, label: "Open files" }
  - { key: P, mods: [CTRL], icon: preferences.png, label: Preferences }
  - { key: S, mods: [CTRL], icon: saveplaylist.png, label: "Save playlist" }
  - { key: U, mods: [CTRL], icon: addlocation.png, label: "Add location" }
  - { key: W, mods: [CTRL], icon: removeplaylist.png, label: "Remove playlist" }
  - { key: ENTER, mods: [ALT], icon: properties.png, label: Properties }
  - { key: A, mods: [ALT], icon: ontop.png, label: "Always on top" }
