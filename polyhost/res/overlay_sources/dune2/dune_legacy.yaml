# Dune Legacy overlay for PolyKybd: the open-source remake of Dune II.
#
# Keys: Dune Legacy's defaults, from handleKeyInput() in src/Game.cpp of
# https://sourceforge.net/p/dunelegacy/code (591b9e1, v0.99.5). The letter
# orders are the same whatever is selected, so they are labelled. See SOURCES.md.
#
# Regenerate:
#   python polyhost/res/overlay_sources/dune2/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/dune2/dune_legacy.yaml --preview /tmp/dune_legacy_preview
app: dune_legacy
match: [dunelegacy]
output: dune_legacy_template
icon_dir: icons
fit: contain
mode: alpha
threshold: 150
# As for C&C: the icon uses the full height on the right; the firmware clears
# 3 px around it, so a letter legend stays whole.
anchor: right
region: [40, 40]
margin: 0

# DUNE over LEGACY over the whole cell, without the ESC legend (protocol v25).
program_icon: program_legacy.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0
program_icon_legend: false

bindings:

  # Control groups: a digit selects the group (a second press centres the view
  # on it), Ctrl creates it, Shift adds it to the selection
  - { key: "1", icon: group1.png, label: "Select group 1", region: [48, 40], margin: 5 }
  - { key: "2", icon: group2.png, label: "Select group 2", region: [48, 40], margin: 5 }
  - { key: "3", icon: group3.png, label: "Select group 3", region: [48, 40], margin: 5 }
  - { key: "4", icon: group4.png, label: "Select group 4", region: [48, 40], margin: 5 }
  - { key: "5", icon: group5.png, label: "Select group 5", region: [48, 40], margin: 5 }
  - { key: "6", icon: group6.png, label: "Select group 6", region: [48, 40], margin: 5 }
  - { key: "7", icon: group7.png, label: "Select group 7", region: [48, 40], margin: 5 }
  - { key: "8", icon: group8.png, label: "Select group 8", region: [48, 40], margin: 5 }
  - { key: "9", icon: group9.png, label: "Select group 9", region: [48, 40], margin: 5 }
  - { key: "1", mods: [CTRL], icon: groupnew1.png, label: "Create group 1", region: [48, 40], margin: 5 }
  - { key: "2", mods: [CTRL], icon: groupnew2.png, label: "Create group 2", region: [48, 40], margin: 5 }
  - { key: "3", mods: [CTRL], icon: groupnew3.png, label: "Create group 3", region: [48, 40], margin: 5 }
  - { key: "4", mods: [CTRL], icon: groupnew4.png, label: "Create group 4", region: [48, 40], margin: 5 }
  - { key: "5", mods: [CTRL], icon: groupnew5.png, label: "Create group 5", region: [48, 40], margin: 5 }
  - { key: "6", mods: [CTRL], icon: groupnew6.png, label: "Create group 6", region: [48, 40], margin: 5 }
  - { key: "7", mods: [CTRL], icon: groupnew7.png, label: "Create group 7", region: [48, 40], margin: 5 }
  - { key: "8", mods: [CTRL], icon: groupnew8.png, label: "Create group 8", region: [48, 40], margin: 5 }
  - { key: "9", mods: [CTRL], icon: groupnew9.png, label: "Create group 9", region: [48, 40], margin: 5 }
  - { key: "1", mods: [SHIFT], icon: groupcombine1.png, label: "Add group 1 to the selection", region: [48, 40], margin: 5 }
  - { key: "2", mods: [SHIFT], icon: groupcombine2.png, label: "Add group 2 to the selection", region: [48, 40], margin: 5 }
  - { key: "3", mods: [SHIFT], icon: groupcombine3.png, label: "Add group 3 to the selection", region: [48, 40], margin: 5 }
  - { key: "4", mods: [SHIFT], icon: groupcombine4.png, label: "Add group 4 to the selection", region: [48, 40], margin: 5 }
  - { key: "5", mods: [SHIFT], icon: groupcombine5.png, label: "Add group 5 to the selection", region: [48, 40], margin: 5 }
  - { key: "6", mods: [SHIFT], icon: groupcombine6.png, label: "Add group 6 to the selection", region: [48, 40], margin: 5 }
  - { key: "7", mods: [SHIFT], icon: groupcombine7.png, label: "Add group 7 to the selection", region: [48, 40], margin: 5 }
  - { key: "8", mods: [SHIFT], icon: groupcombine8.png, label: "Add group 8 to the selection", region: [48, 40], margin: 5 }
  - { key: "9", mods: [SHIFT], icon: groupcombine9.png, label: "Add group 9 to the selection", region: [48, 40], margin: 5 }
  - { key: "0", icon: deselect.png, label: "Deselect all" }
  - { key: "0", mods: [CTRL], icon: ungroup.png, label: "Remove the selection from every group" }

  # Orders
  - { key: A, icon: attackmove.png, label: "Attack" }
  - { key: M, icon: move.png, label: "Move" }
  - { key: C, icon: capture.png, label: "Capture" }
  - { key: D, icon: drop.png, label: "Carryall drop" }
  - { key: H, icon: harvesters.png, label: "Harvester: return" }
  - { key: R, icon: repair.png, label: "Repair" }
  - { key: U, icon: tabupgrade.png, label: "Upgrade" }
  - { key: P, icon: place.png, label: "Place the finished structure" }

  # Selection
  - { key: O, icon: ornithopters.png, label: "Select all ornithopters" }
  - { key: G, icon: conyard.png, label: "Next construction yard" }
  - { key: F, icon: cycleproduction.png, label: "Next factory" }

  # Game
  - { key: MINUS, icon: slower.png, label: "Game speed down" }
  - { key: EQUAL, icon: faster.png, label: "Game speed up" }
  - { key: SPACE, icon: pause.png, label: "Pause", region: [40, 21] }
  - { key: T, icon: clock.png, label: "Game clock on / off", region: [40, 24] }
  - { key: F1, icon: zoom1.png, label: "Zoom level 1", region: [30, 40] }
  - { key: F2, icon: zoom2.png, label: "Zoom level 2", region: [30, 40] }
  - { key: F3, icon: zoom3.png, label: "Zoom level 3", region: [30, 40] }
  - { key: F4, icon: skip10.png, label: "Skip 10 seconds (single player)", region: [30, 40] }
  - { key: F5, icon: skip30.png, label: "Skip 30 seconds (single player)", region: [30, 40] }
  - { key: F6, icon: skip120.png, label: "Skip 2 minutes (single player)", region: [30, 40] }
  - { key: F10, icon: sound.png, label: "Sound on / off", region: [30, 40] }
  - { key: F11, icon: music.png, label: "Music on / off", region: [30, 40] }
  - { key: F12, icon: fps.png, label: "Frame rate on / off", region: [30, 40] }

  # Other
  - { key: ENTER, icon: teamchat.png, label: "Chat" }
  - { key: ENTER, mods: [ALT], icon: fullscreen.png, label: "Full screen / window", region: [30, 21] }
  - { key: PRTSC, icon: screenshot.png, label: "Screenshot", region: [26, 40] }
  - { key: P, mods: [CTRL], icon: screenshot.png, label: "Screenshot", region: [26, 40] }

# Keys redrawn from the user's own Dune II files (DUNE.PAK), by the westwood_d2
# reader in polyhost/services/game_assets. House: the game_dune2_house setting.
# Portrait numbers are those of SHAPES.SHP (Dune Legacy's GFXManager.cpp).

game_assets:
  reader: westwood_d2
  icons:
    group1: {src: 'shp:shapes.shp:81', engine: dither, cut: true, frame: 1, mode: levels, lo: 5, hi: 95, gamma: 0.8, curve: 0.3, sharpen: 1, floor: 0.15, outline: true, mirror: false, region: [48, 40], margin: 5}
    group2: {src: 'shp:shapes.shp:91', engine: dither, cut: true, frame: 1, mode: levels, lo: 5, hi: 95, gamma: 1, curve: 0.3, sharpen: 1, floor: 0.15, outline: true, mirror: false, region: [48, 40], margin: 5}
    group3: {src: 'shp:shapes.shp:80', engine: dither, cut: true, frame: 1, mode: levels, lo: 5, hi: 95, gamma: 0.55, curve: 0.3, sharpen: 1, floor: 0.15, outline: true, mirror: false, region: [47, 40], margin: 5}
    group4: {src: 'shp:shapes.shp:74', engine: dither, cut: true, frame: 1, mode: levels, lo: 5, hi: 95, gamma: 0.75, curve: 0.3, sharpen: 1, floor: 0.15, outline: true, mirror: false, valign: top, region: [46, 40], margin: 5}
    group5: {src: 'shp:shapes.shp:78', engine: dither, cut: true, frame: 1, mode: levels, lo: 0, hi: 100, gamma: 0.65, curve: 0.6, sharpen: 0, floor: 0.28, outline: true, mirror: false, region: [48, 40], margin: 5}
    group6: {src: 'shp:shapes.shp:72', engine: dither, cut: true, frame: 1, mode: levels, lo: 3, hi: 95, gamma: 1, curve: 0.3, sharpen: 1, floor: 0.15, outline: true, mirror: false, region: [48, 40], margin: 5}
    group7: {src: 'shp:shapes.shp:73', engine: dither, cut: true, frame: 1, mode: levels, lo: 5, hi: 95, gamma: 1.05, curve: 0.3, sharpen: 1, floor: 0.15, outline: true, mirror: false, region: [48, 40], margin: 5}
    group8:
      atreides: {src: 'shp:shapes.shp:79', engine: dither, cut: true, frame: 1, mode: levels, lo: 5, hi: 95, gamma: 1.1, curve: 0.3, sharpen: 1, floor: 0.15, outline: true, mirror: false, region: [48, 40], margin: 5}
      harkonnen: {src: 'shp:shapes.shp:75', engine: dither, cut: true, frame: 1, mode: fs, lo: 37, hi: 71, gamma: 1, curve: 0.6, sharpen: 1.5, floor: 0.15, outline: true, mirror: false, region: [48, 40], margin: 5}
      ordos: {src: 'shp:shapes.shp:86', engine: dither, cut: true, frame: 1, mode: levels, lo: 5, hi: 95, gamma: 0.95, curve: 0.3, sharpen: 1, floor: 0.15, outline: true, mirror: false, region: [48, 40], margin: 5}
