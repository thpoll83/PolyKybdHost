# FilmCraft shortcut overlays for PolyKybd.
#
# FilmCraft (ArtCraft "Crafting Apps", github.com/storytold/filmcraft, MIT OR
# Apache-2.0) is a Premiere-like NLE. This is its OWN default keymap, the
# "FilmCraft Default" preset, as the app builds it at startup: per-command
# defaults + FILMCRAFT_PANEL + PREMIERE_PANEL + the Premiere entries the audit
# adopts (crates/engine/src/shortcuts.rs builtin_for). Dumped by running that
# code at commit cee1feb1 (see SOURCES.md), not read off the Premiere table.
#
# Keys are written in FilmCraft's canonical notation: `Cmd` (Cmd on macOS, Ctrl
# elsewhere) -> CMDCTRL; `Ctrl` (the macOS Control key) -> CTRL, which is Ctrl
# on every OS. Four Control chords exist on macOS only (`only: [macos]`): off
# macOS they land on the same key as a Cmd chord and the app drops them
# (drop_control_collisions).
#
# Where one key does different things per panel, the application-wide binding
# wins, except Timeline-only keys with no global meaning, and Cmd+Alt(+Shift)+
# Left/Right and Alt+Up/Down, where the Timeline (the canvas) is drawn over the
# graphics/text command the app binds globally. See SOURCES.md.
#
# Icons: Premiere overlay's committed icons (same action, byte-identical), the
# shared NLE glyphs, Fluent (MIT) and Material Symbols (Apache-2.0).
# Program mark (ESC, all layers): FilmCraft's own owl icon (MIT OR Apache-2.0).
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/filmcraft/fetch_icons.py
#   PYTHONPATH=. python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/filmcraft/bindings.yaml --preview /tmp/filmcraft_preview
app: filmcraft
match: [filmcraft, ai.storyteller.filmcraft]
output: filmcraft_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

# Own icon, 64 px ICO frame. Swept frame 48/64/128/256 + SVG x luma/bright x
# t70..210: `bright` t110 keeps the violet tile lit with the owl's face and
# eyes knocked out; luma lights only the scattered ink, t130+ fills the face.
program_icon: filmcraft.png
program_icon_mode: bright
program_icon_threshold: 110
program_icon_anchor: bottom-right
program_icon_region: [37, 32]
program_icon_margin: 0

