# Sourcetree shortcut overlays for PolyKybd (Windows and macOS). See SOURCES.md.
#
# Sourcetree for Windows (WPF) and Sourcetree for Mac are separate programs
# with partly different keys. The Windows keys are the KeyBindings of the
# 3.4.33 main window; the macOS keys are the menu of 4.2.20 (MainMenu.nib),
# which Atlassian's Sourcetree cheat sheet also lists. A key that both
# programs bind to the same action uses `CMDCTRL` (Ctrl on Windows, Cmd on
# macOS); the others are scoped with `only:` / `except:`.
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/sourcetree/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/sourcetree/bindings.yaml --preview /tmp/st_preview
app: sourcetree
match: [sourcetree]
output: sourcetree_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: sourcetree.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- both programs ---
  - { key: N, mods: [CMDCTRL], icon: clone.png, label: "New / clone repository" }
  - { key: O, mods: [CMDCTRL], icon: openrepo.png, label: "Open repository" }
  - { key: W, mods: [CMDCTRL], icon: closetab.png, label: "Close tab" }
  - { key: COMMA, mods: [CMDCTRL], label: "Settings" }
  - { key: COMMA, mods: [CMDCTRL, SHIFT], icon: reposettings.png, label: "Repository settings" }
  - { key: "1", mods: [CMDCTRL], icon: changes.png, label: "File status view" }
  - { key: "2", mods: [CMDCTRL], icon: history.png, label: "History view" }
  - { key: "3", mods: [CMDCTRL], icon: searchview.png, label: "Search view" }
  - { key: C, mods: [CMDCTRL, SHIFT], icon: commit.png, label: "Commit" }
  - { key: P, mods: [CMDCTRL, SHIFT], icon: push.png, label: "Push" }
  - { key: L, mods: [CMDCTRL, SHIFT], icon: pull.png, label: "Pull" }
  - { key: F, mods: [CMDCTRL, SHIFT], icon: fetch.png, label: "Fetch" }
  - { key: B, mods: [CMDCTRL, SHIFT], icon: newbranch.png, label: "Branch" }
  - { key: M, mods: [CMDCTRL, SHIFT], icon: merge.png, label: "Merge" }
  - { key: T, mods: [CMDCTRL, SHIFT], icon: tag.png, label: "Tag" }
  - { key: S, mods: [CMDCTRL, SHIFT], icon: stash.png, label: "Stash" }
  - { key: R, mods: [CMDCTRL, SHIFT], icon: discard.png, label: "Discard / revert" }
  - { key: O, mods: [CMDCTRL, SHIFT], icon: openfile.png, label: "Open file" }
  - { key: D, mods: [CMDCTRL], icon: externaldiff.png, label: "External diff" }
  - { key: EQUAL, mods: [CMDCTRL, SHIFT], icon: add.png, label: "Add to index" }
  - { key: MINUS, mods: [CMDCTRL, SHIFT], icon: unstage.png, label: "Unstage from index" }
  - { key: EQUAL, mods: [CMDCTRL, ALT, SHIFT], icon: addremove.png, label: "Add / remove" }
  # --- Windows only ---
  - { key: T, mods: [CTRL], icon: newtab.png, label: "New tab", except: [macos] }
  - { key: F5, mods: [], icon: refresh.png, label: "Refresh", except: [macos] }
  - { key: R, mods: [ALT, SHIFT], icon: refreshremote.png, label: "Refresh remote status", except: [macos] }
  - { key: C, mods: [ALT, SHIFT], icon: commitselected.png, label: "Commit selected", except: [macos] }
  - { key: U, mods: [CTRL, SHIFT], icon: checkout.png, label: "Checkout", except: [macos] }
  - { key: T, mods: [ALT, SHIFT], icon: shell.png, label: "Open in terminal", except: [macos] }
  - { key: DEL, mods: [CTRL], icon: remove.png, label: "Remove file", except: [macos] }
  - { key: L, mods: [ALT, SHIFT], icon: logselected.png, label: "Log selected", except: [macos] }
  - { key: B, mods: [ALT, SHIFT], icon: blame.png, label: "Blame selected", except: [macos] }
  - { key: F, mods: [ALT, SHIFT], icon: flownext.png, label: "Git flow next action", except: [macos] }
  - { key: P, mods: [ALT, SHIFT], icon: pullrequest.png, label: "Create pull request", except: [macos] }
  - { key: B, mods: [CTRL], icon: sidebar.png, label: "Bookmarks sidebar", except: [macos] }
  # --- macOS only ---
  - { key: R, mods: [GUI], icon: refresh.png, label: "Refresh", only: [macos] }
  - { key: R, mods: [CTRL, ALT], icon: refreshremote.png, label: "Refresh remote status", only: [macos] }
  - { key: C, mods: [GUI, ALT], icon: commitselected.png, label: "Commit selected", only: [macos] }
  - { key: C, mods: [GUI, ALT, SHIFT], icon: commitall.png, label: "Commit all", only: [macos] }
  - { key: U, mods: [GUI, ALT], icon: checkout.png, label: "Checkout / update to", only: [macos] }
  - { key: U, mods: [GUI, SHIFT], icon: update.png, label: "Update (Mercurial)", only: [macos] }
  - { key: T, mods: [GUI, CTRL], icon: shell.png, label: "Open in terminal", only: [macos] }
  - { key: BSPC, mods: [GUI], icon: remove.png, label: "Remove file", only: [macos] }
  - { key: R, mods: [GUI, ALT], icon: discardselected.png, label: "Revert / reset selected", only: [macos] }
  - { key: L, mods: [GUI, ALT], icon: logselected.png, label: "Log selected", only: [macos] }
  - { key: B, mods: [GUI, ALT], icon: blame.png, label: "Blame selected", only: [macos] }
  - { key: F, mods: [GUI, ALT], icon: flownext.png, label: "Git flow next action", only: [macos] }
  - { key: P, mods: [GUI, ALT], icon: pullrequest.png, label: "Create pull request", only: [macos] }
  - { key: W, mods: [GUI, SHIFT], icon: viewongithub.png, label: "View remote", only: [macos] }
  - { key: I, mods: [GUI, SHIFT], icon: repodetails.png, label: "Repository details", only: [macos] }
  - { key: W, mods: [GUI, CTRL], icon: commandhistory.png, label: "Command history", only: [macos] }
  - { key: "0", mods: [GUI], icon: repolist.png, label: "Repository browser", only: [macos] }
  - { key: H, mods: [GUI, SHIFT], icon: remotehosted.png, label: "Remote repositories", only: [macos] }
  - { key: K, mods: [GUI, SHIFT], icon: sidebar.png, label: "Sidebar", only: [macos] }
  - { key: J, mods: [GUI, SHIFT], icon: filter.png, label: "Filter in sidebar", only: [macos] }
  - { key: F, mods: [GUI, CTRL], icon: fullscreen.png, label: "Full screen", only: [macos] }
  # commit message editor (Markdown), macOS only
  - { key: B, mods: [GUI], label: "Bold", only: [macos] }
  - { key: I, mods: [GUI], label: "Italic", only: [macos] }
  - { key: L, mods: [GUI], icon: bulletlist.png, label: "Bulleted list", only: [macos] }
  - { key: O, mods: [GUI, ALT], icon: numberedlist.png, label: "Numbered list", only: [macos] }
  - { key: QUOTE, mods: [GUI], icon: codeblock.png, label: "Code block", only: [macos] }
  - { key: K, mods: [GUI, ALT], icon: link.png, label: "Link", only: [macos] }
  - { key: MINUS, mods: [GUI, ALT], icon: header.png, label: "Header", only: [macos] }
  - { key: MINUS, mods: [GUI, ALT, SHIFT], icon: hrule.png, label: "Horizontal rule", only: [macos] }
