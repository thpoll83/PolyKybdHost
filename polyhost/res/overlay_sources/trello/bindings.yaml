# Trello (trello.com in a browser tab) shortcut overlays for PolyKybd.
# See SOURCES.md.
#
# Keys: every shortcut on trello.com/shortcuts (read 2026-10-30 with headless
# Chromium). Trello writes Control (Windows) / Command (Mac), so `CMDCTRL`
# serves every OS. The single keys act when no text field has focus. Keys
# that only work while typing (@ to mention, Shift+Enter while creating a
# card) and mouse actions (Shift+click, Shift+scroll) are left out.
#
# Regenerate:
#   python polyhost/res/overlay_sources/trello/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/trello/bindings.yaml --preview /tmp/trello_preview
app: trello
match: []
output: trello_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: trello.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- with Ctrl (Cmd on macOS) ---
  - { key: C, mods: [CMDCTRL], label: "Copy" }
  - { key: X, mods: [CMDCTRL], label: "Cut" }
  - { key: V, mods: [CMDCTRL], label: "Paste" }
  - { key: ENTER, mods: [CMDCTRL], icon: save.png, label: "Save text", shared: false }

  # --- single keys (no text field focused) ---
  - { key: J, icon: next.png, label: "Next card" }
  - { key: K, icon: prev.png, label: "Previous card" }
  - { key: "]", icon: boardmenu.png, label: "Board menu" }
  - { key: B, icon: boards.png, label: "Boards" }
  - { key: "/", icon: search.png, label: "Search", shared: false }
  - { key: C, icon: archive.png, label: "Archive card" }
  - { key: D, icon: due.png, label: "Due date" }
  - { key: "-", icon: checklist.png, label: "Add checklist" }
  - { key: E, icon: quickedit.png, label: "Quick edit" }
  - { key: ENTER, icon: open.png, label: "Open card" }
  - { key: F, icon: filter.png, label: "Card filter" }
  - { key: L, icon: labels.png, label: "Labels" }
  - { key: ";", icon: labelnames.png, label: "Label names" }
  - { key: M, icon: members.png, label: "Members" }
  - { key: N, icon: newcard.png, label: "Insert card" }
  - { key: ",", icon: movebottomleft.png, label: "Move to left list" }
  - { key: ".", icon: movebottomright.png, label: "Move to right list" }
  - { key: ",", mods: [SHIFT], icon: movetopleft.png, label: "Move to top of left list" }
  - { key: ".", mods: [SHIFT], icon: movetopright.png, label: "Move to top of right list" }
  - { key: Q, icon: mycards.png, label: "My cards" }
  - { key: S, icon: watch.png, label: "Watch" }
  - { key: SPACE, icon: assignself.png, label: "Assign self" }
  - { key: T, icon: title.png, label: "Edit title" }
  - { key: V, icon: vote.png, label: "Vote" }
  - { key: X, icon: clearfilter.png, label: "Clear filters" }
  - { key: "/", mods: [SHIFT], icon: shortcuts.png, label: "Shortcuts" }
  - { key: Z, label: "Undo" }
  - { key: Z, mods: [SHIFT], label: "Redo" }
  - { key: R, icon: repeat.png, label: "Repeat action" }

  # --- digits: apply or remove a label colour (drawn tag + colour name) ---
  - { key: "1", icon: label_1.png, label: "Green label", mode: alpha, region: [40, 40] }
  - { key: "2", icon: label_2.png, label: "Yellow label", mode: alpha, region: [40, 40] }
  - { key: "3", icon: label_3.png, label: "Orange label", mode: alpha, region: [40, 40] }
  - { key: "4", icon: label_4.png, label: "Red label", mode: alpha, region: [40, 40] }
  - { key: "5", icon: label_5.png, label: "Purple label", mode: alpha, region: [40, 40] }
  - { key: "6", icon: label_6.png, label: "Blue label", mode: alpha, region: [40, 40] }
  - { key: "7", icon: label_7.png, label: "Sky label", mode: alpha, region: [40, 40] }
  - { key: "8", icon: label_8.png, label: "Lime label", mode: alpha, region: [40, 40] }
  - { key: "9", icon: label_9.png, label: "Pink label", mode: alpha, region: [40, 40] }
  - { key: "0", icon: label_0.png, label: "Black label", mode: alpha, region: [40, 40] }
