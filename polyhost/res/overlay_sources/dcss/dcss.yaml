# Dungeon Crawl Stone Soup overlay for PolyKybd.
#
# Keys: the default key table in crawl-ref/source/cmd-keys.h of crawl/crawl,
# release 0.34.1 (the main-view section). See SOURCES.md.
#
# The game gives a lower-case letter, an upper-case letter and Ctrl+letter
# different commands, so three layers are drawn: plain, Shift and Ctrl. The
# Shift layer's symbol keys (Shift+2 for @, Shift+, for <) follow the US layout.
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/dcss/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/dcss/dcss.yaml --preview /tmp/dcss_preview
app: dcss
match: [crawl, crawl-tiles, crawl.exe, crawl-tiles.exe, "dungeon crawl stone soup - tiles"]
output: dcss_template
icon_dir: icons
fit: contain
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150
# As for fheroes2: the icon uses the full height on the right; the firmware
# clears 3 px around it, so a letter legend stays whole.
anchor: right
region: [40, 40]
margin: 0

# The game's own icon, the cauldron, 32 x 32 placed 1:1.
program_icon: program.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:

  # --- Plain keys ---------------------------------------------------------
  # Movement (vi keys) and the navigation cluster
  - { key: H, icon: move_w.png, label: "Move west" }
  - { key: J, icon: move_s.png, label: "Move south" }
  - { key: K, icon: move_n.png, label: "Move north" }
  - { key: L, icon: move_e.png, label: "Move east" }
  - { key: Y, icon: move_nw.png, label: "Move north-west" }
  - { key: U, icon: move_ne.png, label: "Move north-east" }
  - { key: B, icon: move_sw.png, label: "Move south-west" }
  - { key: N, icon: move_se.png, label: "Move south-east" }
  - { key: HOME, icon: move_nw.png, label: "Move north-west" }
  - { key: PGUP, icon: move_ne.png, label: "Move north-east" }
  - { key: END, icon: move_sw.png, label: "Move south-west" }
  - { key: PGDN, icon: move_se.png, label: "Move south-east" }
  - { key: S, icon: wait.png, label: "Wait one turn" }
  - { key: DOT, icon: wait.png, label: "Wait one turn" }
  - { key: DELETE, icon: wait.png, label: "Wait one turn" }
