# Unreal Tournament 2004 overlay for PolyKybd.
#
# Keys: the weapon slots. 1 to 0 run SwitchWeapon 1 to 10, which selects the
# weapon whose InventoryGroup is that number (read from the stock weapon
# classes in XWeapons.u, UT2004 3369). See SOURCES.md.
#
# The other default bindings were not checked against DefUser.ini and are
# left out until they are.
#
# Regenerate:
#   python polyhost/res/overlay_sources/ut2004/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/ut2004/ut2004.yaml --preview /tmp/ut2004_preview
app: unreal tournament 2004
match: [ut2004, ut2004.exe, ut2004-bin, ut2004-bin-linux-amd64, unreal tournament 2004, steam_app_13230]
output: ut2004_template
icon_dir: icons
fit: contain
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150
# As for Counter-Strike 2: the icon uses the full height on the right; the
# firmware clears 3 px around it, so a digit legend stays whole.
anchor: right
region: [40, 40]
margin: 0

# UT2004 drawn over the whole cell, without the ESC legend (protocol v25).
program_icon: program.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0
program_icon_legend: false

bindings:

  # Weapon slots (InventoryGroup). 9 is the Lightning Gun; 0 holds the
  # Redeemer and the Ion Painter, whichever the player picked up.
  - { key: "1", icon: shieldgun.png, label: "Shield Gun", region: [48, 40] }
  - { key: "2", icon: assaultrifle.png, label: "Assault Rifle", region: [48, 40] }
  - { key: "3", icon: biorifle.png, label: "Bio-Rifle", region: [48, 40] }
  - { key: "4", icon: shockrifle.png, label: "Shock Rifle", region: [48, 40] }
  - { key: "5", icon: linkgun.png, label: "Link Gun", region: [48, 40] }
  - { key: "6", icon: minigun.png, label: "Minigun", region: [48, 40] }
  - { key: "7", icon: flakcannon.png, label: "Flak Cannon", region: [48, 40] }
  - { key: "8", icon: rocketlauncher.png, label: "Rocket Launcher", region: [48, 40] }
  - { key: "9", icon: lightninggun.png, label: "Lightning Gun", region: [48, 40] }
  - { key: "0", icon: superweapon.png, label: "Redeemer / Ion Painter", region: [48, 40] }

# The weapon keys drawn from the player's own install when it is on the
# machine (polyhost/services/game_assets/unreal2, reader ut2004): the weapon
# bar picture of each class, at the IconCoords the class declares on
# HudContent.utx's Generic.HUD. It replaces the shipped icon of the same name;
# nothing read from the game is committed. 0 shows the Redeemer.
game_assets:
  reader: ut2004
  icons:
    shieldgun: {weapon: ShieldGun}
    assaultrifle: {weapon: AssaultRifle}
    biorifle: {weapon: BioRifle}
    shockrifle: {weapon: ShockRifle}
    linkgun: {weapon: LinkGun}
    minigun: {weapon: Minigun}
    flakcannon: {weapon: FlakCannon}
    rocketlauncher: {weapon: RocketLauncher}
    lightninggun: {weapon: SniperRifle}
    superweapon: {weapon: Redeemer}
