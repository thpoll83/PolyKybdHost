# Adobe InDesign shortcut overlays for PolyKybd. See SOURCES.md.
#
# Shortcuts: Adobe Help, "Default keyboard shortcuts" (tools, type, panels; the
# page lists only keys that menus and tooltips do not show), and Redokun's list
# of the default set's menu commands. InDesign maps Ctrl to Cmd and Alt to
# Option on macOS, so every Ctrl chord is written CMDCTRL and one spec gives both
# sets (indesign_template.* and indesign_template_mac.*). The panel F-keys that
# need Cmd on macOS are written twice under `except: [macos]` / `only: [macos]`.
#
# Regenerate:
#   python polyhost/res/overlay_sources/indesign/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/indesign/bindings.yaml --preview /tmp/indesign_preview
app: indesign
match: [indesign, adobe indesign]
output: indesign_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: indesign.png
program_icon_mode: alpha
program_icon_anchor: bottom-right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  - { key: V, mods: [], icon: selection.png, label: "Selection" }
  - { key: A, mods: [], icon: directsel.png, label: "Direct selection" }
  - { key: P, mods: [], icon: pen.png, label: "Pen" }
  - { key: T, mods: [], icon: type.png, label: "Type" }
  - { key: N, mods: [], icon: pencil.png, label: "Pencil" }
