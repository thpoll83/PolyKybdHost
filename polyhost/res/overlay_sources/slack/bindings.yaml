# Slack desktop shortcut overlays for PolyKybd.
#
# ONE spec, TWO artwork sets:
#   slack_template.*      Windows / Linux  (Slack lists one Windows/Linux column)
#   slack_mac_template.*  macOS            (Slack's Mac column)
#
# Slack's Mac keymap is its Windows/Linux keymap with Cmd for Ctrl, so almost
# every line is CMDCTRL. The exceptions: Alt+arrow channel navigation keeps
# Option on the Mac (literal ALT), history back/forward is Alt+Left/Right vs
# Cmd+[ / Cmd+] (two lines, disjoint `only:`), and the reclaimed Ctrl+Shift+digit
# view keys have no confirmed Mac chord (`except: [macos]`). See SOURCES.md.
#
# The first 8 bindings are RECLAIMED: the previously shipped hand-drawn set, cut
# pixel-for-pixel out of the old PNGs and rendered 1:1, so the Windows/Linux set
# keeps exactly the drawings it had.
#
# ⚠️ Esc (mark conversation read) and Shift+Esc (mark all read) are real Slack
# chords but are NOT bound here: the program mark owns the ESC cell on every
# modifier layer, and the generator ORs anything else into it.
#
# Regenerate (from the repo root, with the project venv):
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/slack/bindings.yaml --preview /tmp/slack_preview
app: slack
match: [slack]
output: slack_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 150

program_icon: slack.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_anchor: center
program_icon_margin: 0

# Reclaimed artwork renders 1:1: the old cell IS the icon.
_r: &r { region: [72, 40], anchor: center, source: reclaimed }

bindings:
  # ============================ RECLAIMED from the previously shipped set =====
  - { key: F,  mods: [CMDCTRL], icon: searchconversation.png, <<: *r, label: "Search conversation" }
  - { key: G,  mods: [CMDCTRL], icon: search.png,             <<: *r, label: Search }
  # F6 / Shift+F6 cycle focus between window sections on every platform.
  - { key: F6, mods: [],        icon: nextsection.png,        <<: *r, label: "Next section" }
  # The sidebar views of the 2023 redesign. Not in Slack's published table and
  # no Mac chord confirmed, so they stay on Windows/Linux only.
  - { key: "1", mods: [CTRL, SHIFT], except: [macos], icon: home.png,     <<: *r, label: Home }
  - { key: "2", mods: [CTRL, SHIFT], except: [macos], icon: dms.png,      <<: *r, label: "DMs view" }
  - { key: "3", mods: [CTRL, SHIFT], except: [macos], icon: activity.png, <<: *r, label: "Activity view" }
  - { key: "4", mods: [CTRL, SHIFT], except: [macos], icon: later.png,    <<: *r, label: "Later view" }
  - { key: "0", mods: [CTRL, SHIFT], except: [macos], icon: more.png,     <<: *r, label: More }

  # ============================ ADDED from Slack's shortcut reference =========
  # -- navigation --
  - { key: K,     mods: [CMDCTRL],        icon: quickswitcher.png, label: "Quick switcher" }
  - { key: N,     mods: [CMDCTRL],        icon: newmessage.png,    label: "New message" }
  - { key: K,     mods: [CMDCTRL, SHIFT], icon: dms.png,      <<: *r, label: "Direct messages" }
  - { key: M,     mods: [CMDCTRL, SHIFT], icon: activity.png, <<: *r, label: "Mentions & reactions" }
  - { key: S,     mods: [CMDCTRL, SHIFT], icon: later.png,    <<: *r, label: "Saved items" }
  - { key: T,     mods: [CMDCTRL, SHIFT], icon: threads.png,       label: Threads }
  - { key: A,     mods: [CMDCTRL, SHIFT], icon: unreads.png,       label: "All unreads" }
  - { key: D,     mods: [CMDCTRL, SHIFT], icon: sidebar.png,       label: "Toggle sidebar" }
  - { key: ".",   mods: [CMDCTRL],        icon: rightpane.png,     label: "Toggle right pane" }
  # Option+arrow on the Mac too, so these are literal ALT everywhere.
  - { key: UP,    mods: [ALT],            icon: channel.png, label: "Previous channel" }
  - { key: DOWN,  mods: [ALT],            icon: channel.png, label: "Next channel" }
  - { key: UP,    mods: [ALT, SHIFT],     icon: unreads.png, label: "Previous unread" }
  - { key: DOWN,  mods: [ALT, SHIFT],     icon: unreads.png, label: "Next unread" }
  # History: a different chord on macOS.
  - { key: LEFT,  mods: [ALT], only: [windows, linux], icon: back.png,    label: "Back in history" }
  - { key: RIGHT, mods: [ALT], only: [windows, linux], icon: forward.png, label: "Forward in history" }
  - { key: "[",   mods: [GUI], only: [macos],          icon: back.png,    label: "Back in history" }
  - { key: "]",   mods: [GUI], only: [macos],          icon: forward.png, label: "Forward in history" }

  # -- messages & files --
  - { key: U,     mods: [CMDCTRL],        icon: upload.png,  label: "Upload file" }
  - { key: ENTER, mods: [CMDCTRL, SHIFT], icon: snippet.png, label: "Create snippet" }
  - { key: B,     mods: [CMDCTRL],        icon: bold.png,    label: Bold }
  - { key: I,     mods: [CMDCTRL],        icon: italic.png,  label: Italic }
  - { key: X,     mods: [CMDCTRL, SHIFT], icon: strike.png,  label: Strikethrough }
  - { key: C,     mods: [CMDCTRL, SHIFT], icon: code.png,    label: "Inline code" }

  # -- you --
  - { key: Y,     mods: [CMDCTRL, SHIFT], icon: status.png,      label: "Set status" }
  # ⌘⇧H, not the reserved ⌘H (Hide), so it is safe on the Mac.
  - { key: H,     mods: [CMDCTRL, SHIFT], icon: huddle.png,      label: "Toggle huddle" }
  - { key: ",",   mods: [CMDCTRL],        icon: preferences.png, label: Preferences }
  - { key: "/",   mods: [CMDCTRL],        icon: shortcuts.png,   label: "Keyboard shortcuts" }
