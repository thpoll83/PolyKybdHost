# Adobe Premiere Pro shortcut overlays for PolyKybd.
#
# Icons: Microsoft Fluent UI System Icons (MIT) + shared custom-drawn NLE glyphs
# (../nle_glyphs.py). Program mark (ESC, all layers): drawn substitute, NOT the
# Adobe trademark. See SOURCES.md.
# Shortcuts: Premiere Pro Windows defaults. Ambiguous keys (M, T, Q, W, F) are
# deliberately OMITTED - see SOURCES.md "Deliberately excluded".
#
# Regenerate:
#   python polyhost/res/overlay_sources/premiere/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/premiere/bindings.yaml --preview /tmp/premiere_preview
app: premiere
match: [adobe premiere pro]
output: premiere_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: premiere.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [42, 34]
program_icon_margin: 0

bindings:
  # --- the tool row (no modifier -> A channel of the primary file) ---
  # This is Premiere's signature: eleven single-letter tools.
  - { key: V, mods: [], icon: select.png,       label: "Selection tool",    source: "ms-fluent/Cursor (MIT)" }
  - { key: A, mods: [], icon: trackselect.png,  label: "Track select tool", source: "custom/nle_glyphs", mode: alpha }
  - { key: B, mods: [], icon: rippleedit.png,   label: "Ripple edit tool",  source: "custom/nle_glyphs", mode: alpha }
  - { key: N, mods: [], icon: rolledit.png,     label: "Rolling edit tool", source: "custom/nle_glyphs", mode: alpha }
  - { key: X, mods: [], icon: ratestretch.png,  label: "Rate stretch tool", source: "ms-fluent/Top Speed (MIT)" }
  - { key: C, mods: [], icon: blade.png,        label: "Razor tool",        source: "custom/nle_glyphs", mode: alpha }
  - { key: Y, mods: [], icon: slip.png,         label: "Slip tool",         source: "custom/nle_glyphs", mode: alpha }
  - { key: U, mods: [], icon: slide.png,        label: "Slide tool",        source: "custom/nle_glyphs", mode: alpha }
  - { key: P, mods: [], icon: pen.png,          label: "Pen tool",          source: "ms-fluent/Pen (MIT)" }
  - { key: H, mods: [], icon: hand.png,         label: "Hand tool",         source: "ms-fluent/Hand Right (MIT)" }
  - { key: Z, mods: [], icon: zoom.png,         label: "Zoom tool",         source: "ms-fluent/Zoom In (MIT)" }

  # --- timeline / transport (no modifier) ---
  - { key: I, mods: [], icon: markin.png,  label: "Mark In",      source: "custom/nle_glyphs", mode: alpha }
  - { key: O, mods: [], icon: markout.png, label: "Mark Out",     source: "custom/nle_glyphs", mode: alpha }
  - { key: J, mods: [], icon: rev.png,     label: "Shuttle left", source: "ms-fluent/Rewind (MIT)" }
  - { key: K, mods: [], icon: stop.png,    label: "Shuttle stop", source: "ms-fluent/Stop (MIT)" }
  - { key: L, mods: [], icon: fwd.png,     label: "Shuttle right", source: "ms-fluent/Fast Forward (MIT)" }
  - { key: SPACE, mods: [], icon: play.png, label: "Play / Stop", source: "ms-fluent/Play (MIT)" }
  - { key: "=", mods: [], icon: zoomin.png,  label: "Zoom in",  source: "ms-fluent/Zoom In (MIT)" }
  - { key: "-", mods: [], icon: zoomout.png, label: "Zoom out", source: "ms-fluent/Zoom Out (MIT)" }
  - { key: "\\", mods: [], icon: zoomfit.png, label: "Zoom to sequence", source: "ms-fluent/Arrow Expand (MIT)" }

  # --- Ctrl (R channel of the primary file) ---
  - { key: N, mods: [CTRL], icon: newsequence.png, label: "New sequence", source: "ms-fluent/Add Square (MIT)" }
  - { key: O, mods: [CTRL], icon: open.png,        label: "Open project", source: "ms-fluent/Folder Open (MIT)" }
  - { key: S, mods: [CTRL], icon: save.png,        label: Save,           source: "ms-fluent/Save (MIT)" }
  - { key: I, mods: [CTRL], icon: import.png,      label: Import,         source: "ms-fluent/Arrow Import (MIT)" }
  - { key: M, mods: [CTRL], icon: export.png,      label: "Export media", source: "ms-fluent/Arrow Export (MIT)" }
  - { key: Z, mods: [CTRL], icon: undo.png,        label: Undo,           source: "ms-fluent/Arrow Undo (MIT)" }
  - { key: X, mods: [CTRL], icon: cut.png,         label: Cut,            source: "ms-fluent/Cut (MIT)" }
  - { key: C, mods: [CTRL], icon: copy.png,        label: Copy,           source: "ms-fluent/Copy (MIT)" }
  - { key: V, mods: [CTRL], icon: paste.png,       label: Paste,          source: "ms-fluent/Clipboard Paste (MIT)" }
  - { key: A, mods: [CTRL], icon: selectall.png,   label: "Select all",   source: "ms-fluent/Select All On (MIT)" }
  - { key: K, mods: [CTRL], icon: addedit.png,     label: "Add edit",     source: "ms-fluent/Split Vertical (MIT)" }
  - { key: L, mods: [CTRL], icon: link.png,        label: "Link / unlink", source: "ms-fluent/Link (MIT)" }
  - { key: G, mods: [CTRL], icon: group.png,       label: Group,          source: "ms-fluent/Group (MIT)" }
  - { key: R, mods: [CTRL], icon: speed.png,       label: "Speed / duration", source: "ms-fluent/Arrow Autofit Width (MIT)" }

  # --- Shift (B channel of the primary file): the panel row ---
  - { key: DELETE, mods: [SHIFT], icon: rippledelete.png, label: "Ripple delete", source: "custom/nle_glyphs", mode: alpha }
  - { key: "1", mods: [SHIFT], icon: panelproject.png,   label: "Project panel",   source: "ms-fluent/Folder Open (MIT)" }
  - { key: "2", mods: [SHIFT], icon: panelsource.png,    label: "Source monitor",  source: "ms-fluent/Video Clip (MIT)" }
  - { key: "3", mods: [SHIFT], icon: paneltimeline.png,  label: "Timeline panel",  source: "ms-fluent/Timeline (MIT)" }
  - { key: "4", mods: [SHIFT], icon: panelprogram.png,   label: "Program monitor", source: "ms-fluent/Play Circle (MIT)" }
  - { key: "5", mods: [SHIFT], icon: paneleffectctl.png, label: "Effect controls", source: "ms-fluent/Options (MIT)" }
  - { key: "6", mods: [SHIFT], icon: panelaudio.png,     label: "Audio mixer",     source: "ms-fluent/Music Note 2 (MIT)" }
  - { key: "7", mods: [SHIFT], icon: paneleffects.png,   label: "Effects panel",   source: "ms-fluent/Wand (MIT)" }

  # --- Ctrl+Shift (R channel of the combo file) ---
  - { key: Z, mods: [CTRL, SHIFT], icon: redo.png,        label: Redo,          source: "ms-fluent/Arrow Redo (MIT)" }
  - { key: S, mods: [CTRL, SHIFT], icon: saveas.png,      label: "Save as",     source: "ms-fluent/Save Multiple (MIT)" }
  - { key: V, mods: [CTRL, SHIFT], icon: pasteinsert.png, label: "Paste insert", source: "ms-fluent/Arrow Between Down (MIT)" }
  - { key: G, mods: [CTRL, SHIFT], icon: ungroup.png,     label: Ungroup,       source: "ms-fluent/Group Dismiss (MIT)" }

  # --- Ctrl+Alt (G channel of the combo file) ---
  - { key: N, mods: [CTRL, ALT], icon: newproject.png, label: "New project", source: "ms-fluent/Document Add (MIT)" }
