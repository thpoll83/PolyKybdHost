# Okular shortcut overlays for PolyKybd (Linux and Windows). See SOURCES.md.
#
# Okular's default keys come from KDE Frameworks' standard shortcuts
# (KStandardShortcut) plus the ones Okular sets itself. They are the same on
# Linux and on the Windows build, so one set serves both; every binding carries
# `except: [macos]` and the generator writes no `_mac` or `_linux` files.
#
# Regenerate:
#   python polyhost/res/overlay_sources/okular/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/okular/bindings.yaml --preview /tmp/okular_preview
app: okular
match: [okular, org.kde.okular]
output: okular_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

# No program_icon: ESC is left to the generic program mark (the app's own icon).

bindings:
  - { key: O, mods: [CTRL], label: "Open", except: [macos] }
  - { key: S, mods: [CTRL], label: "Save", except: [macos] }
  - { key: S, mods: [CTRL, SHIFT], icon: saveas.png, label: "Save as", except: [macos] }
  - { key: P, mods: [CTRL], label: "Print", except: [macos] }
  - { key: W, mods: [CTRL], icon: close.png, label: "Close", except: [macos] }
  - { key: Q, mods: [CTRL], icon: quit.png, label: "Quit", except: [macos] }
  - { key: ENTER, mods: [ALT], icon: properties.png, label: "Properties", except: [macos] }
  - { key: F5, mods: [], icon: reload.png, label: "Reload", except: [macos] }
  - { key: COMMA, mods: [CTRL, SHIFT], icon: preferences.png, label: "Configure Okular", except: [macos] }
  - { key: F1, mods: [], icon: help.png, label: "Handbook", except: [macos] }
  - { key: F, mods: [CTRL], label: "Find", except: [macos] }
  - { key: F3, mods: [], icon: findnext.png, label: "Find next", except: [macos] }
  - { key: F3, mods: [SHIFT], icon: findprev.png, label: "Find previous", except: [macos] }
  - { key: G, mods: [CTRL], icon: gotopage.png, label: "Go to page", except: [macos] }
  - { key: HOME, mods: [CTRL], icon: firstpage.png, label: "Beginning of document", except: [macos] }
  - { key: END, mods: [CTRL], icon: lastpage.png, label: "End of document", except: [macos] }
  - { key: LEFT, mods: [ALT, SHIFT], icon: back.png, label: "Back", except: [macos] }
  - { key: RIGHT, mods: [ALT, SHIFT], icon: forward.png, label: "Forward", except: [macos] }
  - { key: B, mods: [CTRL], icon: bookmark.png, label: "Add bookmark", except: [macos] }
  - { key: C, mods: [CTRL], label: "Copy", except: [macos] }
  - { key: A, mods: [CTRL], label: "Select all", except: [macos] }
  - { key: Z, mods: [CTRL], label: "Undo", except: [macos] }
  - { key: Z, mods: [CTRL, SHIFT], label: "Redo", except: [macos] }
  - { key: F7, mods: [], icon: sidebar.png, label: "Sidebar", except: [macos] }
  - { key: F6, mods: [], icon: annottoolbar.png, label: "Annotation toolbar", except: [macos] }
  - { key: P, mods: [CTRL, SHIFT], icon: presentation.png, label: "Presentation", except: [macos] }
  - { key: F, mods: [CTRL, SHIFT], icon: fullscreen.png, label: "Full screen", except: [macos] }
  - { key: F11, mods: [], icon: fullscreen.png, label: "Full screen", except: [macos] }
  - { key: M, mods: [CTRL], icon: menubar.png, label: "Menu bar", except: [macos] }
  - { key: PGDN, mods: [CTRL], icon: nexttab.png, label: "Next tab", except: [macos] }
  - { key: PGUP, mods: [CTRL], icon: prevtab.png, label: "Previous tab", except: [macos] }
