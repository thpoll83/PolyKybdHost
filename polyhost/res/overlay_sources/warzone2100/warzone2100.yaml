  # Chat and messages
  - { key: ENTER, icon: chat.png, label: "Send global text message" }
  - { key: ENTER, mods: [CTRL], icon: teamchat.png, label: "Send team text message" }
  - { key: ENTER, mods: [SHIFT], icon: quickchat.png, label: "Send team quick chat" }
  - { key: GRAVE, icon: consolehistory.png, label: "Toggle console history" }
  - { key: GRAVE, mods: [CTRL], icon: teamchathistory.png, label: "Toggle team chat history" }
