  - { key: T, mods: [SHIFT], icon: trucks.png, label: "Select all trucks" }
  - { key: V, mods: [SHIFT], icon: armedvtols.png, label: "Select all fully-armed VTOLs" }
  - { key: C, mods: [ALT], icon: combatcyborgs_nogroup.png, label: "Select all combat cyborgs without group" }
  - { key: D, mods: [ALT], icon: tracks_nogroup.png, label: "Select all tracks without group" }
