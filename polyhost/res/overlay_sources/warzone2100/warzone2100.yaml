# Warzone 2100 overlay for PolyKybd.
#
# Keys: the default key map of Warzone 2100 4.7.0, initializeKeyFunctions() in
# src/input/keyconfig.cpp. See SOURCES.md.
#
# Every function in that table does the same thing whatever is selected: the
# letter keys give orders to the selected units or select units by type, and
# the game builds and trains through the reticule screens (F1 to F6), not
# through letter keys. So the letters are labelled too.
#
# Regenerate:
#   python polyhost/res/overlay_sources/warzone2100/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/warzone2100/warzone2100.yaml --preview /tmp/wz2100_preview
app: warzone2100
match: [warzone2100, warzone2100.exe, warzone 2100, steam_app_1241950]
output: warzone2100_template
icon_dir: icons
fit: contain
mode: alpha
threshold: 150
# As for Warcraft III: the icon uses the full height on the right; the firmware
# clears 3 px around it, so a letter legend stays whole.
anchor: right
region: [40, 40]
margin: 0

# WARZONE 2100 drawn over the whole cell, without the ESC legend (protocol v25).
program_icon: program.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0
program_icon_legend: false

bindings:

  # Reticule screens
  - { key: F1, icon: manufacture.png, label: "Manufacture", region: [34, 40] }
  - { key: F2, icon: research.png, label: "Research", region: [34, 40] }
  - { key: F3, icon: build.png, label: "Build", region: [34, 40] }
  - { key: F4, icon: design.png, label: "Design", region: [30, 40] }
  - { key: F5, icon: intelligence.png, label: "Intelligence display", region: [34, 40] }
  - { key: F6, icon: commanders.png, label: "Commanders", region: [34, 40] }

  # F7 to F12
  - { key: F7, icon: quicksave.png, label: "Quick save", region: [34, 40] }
  - { key: F7, mods: [SHIFT], icon: radar.png, label: "Toggle radar", region: [34, 40] }
  - { key: F8, icon: quickload.png, label: "Quick load", region: [34, 40] }
  - { key: F8, mods: [SHIFT], icon: console.png, label: "Toggle console display", region: [34, 40] }
  - { key: F9, icon: damagebars.png, label: "Toggle damage bars", region: [34, 40] }
  - { key: F10, icon: screenshot.png, label: "Take screenshot", region: [40, 40] }
  - { key: F11, icon: formationspeed.png, label: "Toggle formation speed limiting", region: [40, 40] }
  - { key: F12, icon: lastmessage.png, label: "View location of previous message", region: [40, 40] }
  - { key: F12, mods: [SHIFT], icon: sensordisplay.png, label: "Toggle sensor display", region: [40, 40] }

  # Control groups: digit selects, Ctrl+digit assigns, Shift+digit adds the
  # selection, Alt+digit selects commander N
  - { key: "1", icon: group.png, label: "Select group 1", region: [48, 40], margin: 5 }
  - { key: "2", icon: group.png, label: "Select group 2", region: [48, 40], margin: 5 }
  - { key: "3", icon: group.png, label: "Select group 3", region: [48, 40], margin: 5 }
  - { key: "4", icon: group.png, label: "Select group 4", region: [48, 40], margin: 5 }
  - { key: "5", icon: group.png, label: "Select group 5", region: [48, 40], margin: 5 }
  - { key: "6", icon: group.png, label: "Select group 6", region: [48, 40], margin: 5 }
  - { key: "7", icon: group.png, label: "Select group 7", region: [48, 40], margin: 5 }
  - { key: "8", icon: group.png, label: "Select group 8", region: [48, 40], margin: 5 }
  - { key: "9", icon: group.png, label: "Select group 9", region: [48, 40], margin: 5 }
  - { key: "0", icon: group.png, label: "Select group 0", region: [48, 40], margin: 5 }
  - { key: "1", mods: [CTRL], icon: groupnew.png, label: "Assign group 1", region: [48, 40], margin: 5 }
  - { key: "2", mods: [CTRL], icon: groupnew.png, label: "Assign group 2", region: [48, 40], margin: 5 }
  - { key: "3", mods: [CTRL], icon: groupnew.png, label: "Assign group 3", region: [48, 40], margin: 5 }
  - { key: "4", mods: [CTRL], icon: groupnew.png, label: "Assign group 4", region: [48, 40], margin: 5 }
  - { key: "5", mods: [CTRL], icon: groupnew.png, label: "Assign group 5", region: [48, 40], margin: 5 }
  - { key: "6", mods: [CTRL], icon: groupnew.png, label: "Assign group 6", region: [48, 40], margin: 5 }
  - { key: "7", mods: [CTRL], icon: groupnew.png, label: "Assign group 7", region: [48, 40], margin: 5 }
  - { key: "8", mods: [CTRL], icon: groupnew.png, label: "Assign group 8", region: [48, 40], margin: 5 }
  - { key: "9", mods: [CTRL], icon: groupnew.png, label: "Assign group 9", region: [48, 40], margin: 5 }
  - { key: "0", mods: [CTRL], icon: groupnew.png, label: "Assign group 0", region: [48, 40], margin: 5 }
  - { key: "1", mods: [SHIFT], icon: groupadd.png, label: "Add to group 1", region: [48, 40], margin: 5 }
  - { key: "2", mods: [SHIFT], icon: groupadd.png, label: "Add to group 2", region: [48, 40], margin: 5 }
  - { key: "3", mods: [SHIFT], icon: groupadd.png, label: "Add to group 3", region: [48, 40], margin: 5 }
  - { key: "4", mods: [SHIFT], icon: groupadd.png, label: "Add to group 4", region: [48, 40], margin: 5 }
  - { key: "5", mods: [SHIFT], icon: groupadd.png, label: "Add to group 5", region: [48, 40], margin: 5 }
  - { key: "6", mods: [SHIFT], icon: groupadd.png, label: "Add to group 6", region: [48, 40], margin: 5 }
  - { key: "7", mods: [SHIFT], icon: groupadd.png, label: "Add to group 7", region: [48, 40], margin: 5 }
  - { key: "8", mods: [SHIFT], icon: groupadd.png, label: "Add to group 8", region: [48, 40], margin: 5 }
  - { key: "9", mods: [SHIFT], icon: groupadd.png, label: "Add to group 9", region: [48, 40], margin: 5 }
  - { key: "0", mods: [SHIFT], icon: groupadd.png, label: "Add to group 0", region: [48, 40], margin: 5 }
  - { key: "1", mods: [ALT], icon: commander.png, label: "Select commander 1", region: [48, 40], margin: 5 }
  - { key: "2", mods: [ALT], icon: commander.png, label: "Select commander 2", region: [48, 40], margin: 5 }
  - { key: "3", mods: [ALT], icon: commander.png, label: "Select commander 3", region: [48, 40], margin: 5 }
  - { key: "4", mods: [ALT], icon: commander.png, label: "Select commander 4", region: [48, 40], margin: 5 }
  - { key: "5", mods: [ALT], icon: commander.png, label: "Select commander 5", region: [48, 40], margin: 5 }
  - { key: "6", mods: [ALT], icon: commander.png, label: "Select commander 6", region: [48, 40], margin: 5 }
  - { key: "7", mods: [ALT], icon: commander.png, label: "Select commander 7", region: [48, 40], margin: 5 }
  - { key: "8", mods: [ALT], icon: commander.png, label: "Select commander 8", region: [48, 40], margin: 5 }
  - { key: "9", mods: [ALT], icon: commander.png, label: "Select commander 9", region: [48, 40], margin: 5 }
  - { key: "0", mods: [ALT], icon: commander.png, label: "Select commander 0", region: [48, 40], margin: 5 }

  # Camera and game speed
  - { key: BSPC, icon: north.png, label: "Snap view to north" }
  - { key: SPACE, icon: trackcamera.png, label: "Toggle tracking camera" }
  - { key: UP, mods: [CTRL], icon: north.png, label: "View north" }
  - { key: DOWN, mods: [CTRL], icon: south.png, label: "View south" }
  - { key: LEFT, mods: [CTRL], icon: east.png, label: "View east" }
  - { key: RIGHT, mods: [CTRL], icon: west.png, label: "View west" }
  - { key: MINUS, mods: [CTRL], icon: slowdown.png, label: "Decrease game speed" }
  - { key: EQUAL, mods: [CTRL], icon: speedup.png, label: "Increase game speed" }
  - { key: BSPC, mods: [CTRL], icon: normalspeed.png, label: "Reset game speed" }

  # Radar (with the mouse over the radar) and display
  - { key: MINUS, icon: radarzoomout.png, label: "Zoom radar out" }
  - { key: EQUAL, icon: radarzoomin.png, label: "Zoom radar in" }
  - { key: TAB, icon: overlays.png, label: "Toggle overlays" }
  - { key: TAB, mods: [CTRL], icon: radarterrain.png, label: "Toggle radar terrain" }
  - { key: TAB, mods: [SHIFT], icon: radarallies.png, label: "Toggle ally-enemy radar view" }
  - { key: S, mods: [ALT], icon: shadows.png, label: "Toggle shadows" }
  - { key: T, mods: [ALT], icon: trapcursor.png, label: "Trap cursor" }
  - { key: ENTER, mods: [ALT], icon: fullscreen.png, label: "Toggle fullscreen" }
  - { key: M, icon: mappings.png, label: "Show all keyboard mappings" }

  # Unit orders
  - { key: B, icon: centrehq.png, label: "Center view on HQ" }
  - { key: C, icon: holdfire.png, label: "Hold fire" }
  - { key: D, icon: unassigned.png, label: "View unassigned units" }
  - { key: E, icon: returnfire.png, label: "Return fire" }
  - { key: F, icon: fireatwill.png, label: "Fire at will" }
  - { key: G, icon: guard.png, label: "Guard position" }
  - { key: H, icon: hold.png, label: "Hold position" }
  - { key: H, mods: [SHIFT], icon: returnhq.png, label: "Return to HQ", region: [46, 40] }
  - { key: I, icon: rangeoptimum.png, label: "Optimum range" }
  - { key: O, icon: rangeshort.png, label: "Short range" }
  - { key: U, icon: rangelong.png, label: "Long range" }
  - { key: P, icon: pursue.png, label: "Pursue" }
  - { key: Q, icon: patrol.png, label: "Patrol" }
  - { key: R, icon: repair.png, label: "Return for repair" }
  - { key: R, mods: [CTRL], icon: recycle.png, label: "Return for recycling" }
  - { key: S, icon: stop.png, label: "Stop" }
  - { key: T, icon: transport.png, label: "Go to transport" }
  - { key: COMMA, icon: retreatmedium.png, label: "Retreat at medium damage" }
  - { key: DOT, icon: retreatheavy.png, label: "Retreat at heavy damage" }
  - { key: SLASH, icon: doordie.png, label: "Do or die" }
  - { key: H, mods: [ALT], icon: beacon.png, label: "Drop a beacon" }

  # Select units by type (Alt: only units in no group)
