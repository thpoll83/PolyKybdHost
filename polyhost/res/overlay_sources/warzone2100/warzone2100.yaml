  - { key: F, mods: [CTRL], icon: halftracks.png, label: "Select all half-tracks" }
  - { key: H, mods: [CTRL], icon: hovers.png, label: "Select all hovers" }
  - { key: S, mods: [CTRL], icon: onscreen.png, label: "Select all units on screen" }
