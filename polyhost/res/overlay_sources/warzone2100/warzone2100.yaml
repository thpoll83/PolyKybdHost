  - { key: C, mods: [SHIFT], icon: combatcyborgs.png, label: "Select all combat cyborgs" }
  - { key: E, mods: [SHIFT], icon: engineers.png, label: "Select all engineers" }
  - { key: G, mods: [SHIFT], icon: landcombat.png, label: "Select all land combat units" }
  - { key: M, mods: [SHIFT], icon: mechanics.png, label: "Select all mechanics" }
  - { key: P, mods: [SHIFT], icon: transporters.png, label: "Select all transporters" }
  - { key: R, mods: [SHIFT], icon: repairtanks.png, label: "Select all repair tanks" }
