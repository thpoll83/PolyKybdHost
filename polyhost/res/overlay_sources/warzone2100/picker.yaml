# Candidates for tools/gen_icon_picker.py: for each key of the Warzone 2100
# overlay, the game's interface images (intfac:) and its units rendered from
# the 3D models (model:, wz_models.py). Warzone's art is GPL-2.0-or-later, so
# the picks ship as icons. See tools/ICON_PICKER.md.
title: Warzone 2100 icon picker
reader: warzone2100
palette_from:
- image_build_up
- image_commanddroid_up
- image_design_up
- image_hovercraft
- image_intelmap_up
- image_manufacture_up
- image_ord_destruct1up
- image_ord_embarkup
- image_ord_fatwillup
- image_ord_gotohqup
- image_ord_guardup
- image_ord_haltup
- image_ord_holdfireup
- image_ord_patrolup
- image_ord_pursueup
- image_ord_range1up
- image_ord_range2up
- image_ord_range3up
- image_ord_repair1up
- image_ord_repair2up
- image_ord_repair3up
- image_ord_retfireup
- image_ord_rtrup
- image_research_up
- image_stop_up
- image_tracks
- radar_north
- unittype_cyborg
- unittype_tank
- unittype_vtol
vector_sources:
- polyhost.res.overlay_sources.warzone2100.fetch_icons
presets:
  vector:
    relief: true
    depth: 0.08
    azimuth: 225
    elevation: 42
    ambient: 0.35
    falloff: 0.45
    grain: 1.0
    seed: 1
    flat: 0.6
    mode: fs
    lo: 3
    hi: 97
    gamma: 1.0
    curve: 0.0
    sharpen: 0.0
    floor: 0.15
    outline: true
    mirror: false
    valign: bottom
  model:
    engine: dither
    cut: true
    frame: 0
    mode: fs
    lo: 3
    hi: 97
    gamma: 1.0
    curve: 0.0
    sharpen: 0.0
    floor: 0.15
    outline: true
    mirror: true
  button:
    engine: dither
    cut: true
    frame: 3
    mode: levels
    lo: 5
    hi: 95
    gamma: 1.0
    curve: 0.3
    sharpen: 1.0
    floor: 0.15
    outline: true
    mirror: false
  pixels:
    engine: pixel
    lit: brighter
    pct: 60
    scale: 0
    mirror: false
    crop:
    - 3
    - 3
