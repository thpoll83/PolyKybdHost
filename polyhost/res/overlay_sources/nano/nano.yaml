# GNU nano for PolyKybd. See SOURCES.md.
#
# Keys: nano's own default key table, `shortcut_init()` in src/global.c
# (git.savannah.gnu.org/git/nano.git, commit a90eb863, 2026-10-30), the
# bindings for the edit buffer (MMAIN) with the default (not --modern)
# bindings and a full build. nano writes ^X for Ctrl+X and M-X for Alt+X; a
# character that needs Shift on a US layout is drawn on its key's Shift
# variant (^_ is Ctrl+Shift+minus, M-{ is Alt+Shift+[), as in the Emacs set.
#
# Single key combinations only; nano has no prefix sequences except ^T^Z
# (suspend), which is left out. Esc shows the program mark. No macOS set:
# nano runs in a terminal, where Cmd keys never reach it.
#
# Routed by the terminal's WINDOW TITLE (overlay-mapping.poly.yaml,
# `&editor_titles`): nano sets no title itself.
#
# Regenerate:
#   python polyhost/res/overlay_sources/nano/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/nano/nano.yaml --preview /tmp/nano_preview
app: nano
match: [nano]
output: nano_template
icon_dir: icons
fit: contain
anchor: bottom-right
# The drawn composites are 40x32 and placed 1:1 in this region.
region: [40, 32]
margin: 0
mode: alpha
threshold: 150

program_icon: nano.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [40, 40]
program_icon_margin: 0

bindings:
  # --- Ctrl ---
  - { key: G, mods: [CTRL], label: "Help" }
  - { key: X, mods: [CTRL], icon: exit.png, label: "Exit" }
  - { key: S, mods: [CTRL], label: "Save" }
  - { key: O, mods: [CTRL], label: "Save as" }                      # Write Out
  - { key: R, mods: [CTRL], icon: insertfile.png, label: "Insert file" }
  - { key: W, mods: [CTRL], icon: search_fwd.png, label: "Search forward" }
  - { key: F, mods: [CTRL], icon: search_fwd.png, label: "Search forward" }
  - { key: Q, mods: [CTRL], icon: search_back.png, label: "Search backward" }
  - { key: B, mods: [CTRL], icon: search_back.png, label: "Search backward" }
  - { key: "\\", mods: [CTRL], label: "Replace" }
  - { key: K, mods: [CTRL], label: "Cut" }                          # the line, or the marked text
  - { key: U, mods: [CTRL], label: "Paste" }
  - { key: T, mods: [CTRL], icon: execute.png, label: "Execute command" }
  - { key: J, mods: [CTRL], icon: justify.png, label: "Justify paragraph" }
  - { key: C, mods: [CTRL], icon: location.png, label: "Cursor position" }
  - { key: "/", mods: [CTRL], icon: goto_line.png, label: "Go to line" }   # ^- on a Linux console
  - { key: "-", mods: [CTRL, SHIFT], icon: goto_line.png, label: "Go to line" }   # ^_
  - { key: A, mods: [CTRL], icon: line_start.png, label: "Line start" }
  - { key: E, mods: [CTRL], icon: line_end.png, label: "Line end" }
  - { key: P, mods: [CTRL], icon: line_prev.png, label: "Previous line" }
  - { key: N, mods: [CTRL], icon: line_next.png, label: "Next line" }
  - { key: Y, mods: [CTRL], icon: page_up.png, label: "Page up" }
  - { key: V, mods: [CTRL], icon: page_down.png, label: "Page down" }
  - { key: H, mods: [CTRL], icon: char_back_del.png, label: "Backspace" }
  - { key: D, mods: [CTRL], icon: char_del.png, label: "Delete char" }
  - { key: "6", mods: [CTRL], icon: mark.png, label: "Set mark" }
  - { key: "6", mods: [CTRL, SHIFT], icon: mark.png, label: "Set mark" }     # ^^
  - { key: "]", mods: [CTRL], icon: complete.png, label: "Complete word" }
  - { key: L, mods: [CTRL], icon: recenter.png, label: "Center cursor line" }
  - { key: SPACE, mods: [CTRL], icon: word_fwd.png, label: "Next word" }
  - { key: LEFT, mods: [CTRL], icon: word_back.png, label: "Previous word" }
  - { key: RIGHT, mods: [CTRL], icon: word_fwd.png, label: "Next word" }
  - { key: UP, mods: [CTRL], icon: block_prev.png, label: "Previous block" }
  - { key: DOWN, mods: [CTRL], icon: block_next.png, label: "Next block" }
  - { key: HOME, mods: [CTRL], icon: file_start.png, label: "First line" }
  - { key: END, mods: [CTRL], icon: file_end.png, label: "Last line" }
  - { key: DELETE, mods: [CTRL], icon: word_del.png, label: "Delete next word" }
  - { key: DELETE, mods: [CTRL, SHIFT], icon: word_back_del.png, label: "Delete previous word" }

  # --- Alt (M-) ---
  - { key: "\\", mods: [ALT], icon: file_start.png, label: "First line" }
  - { key: "/", mods: [ALT], icon: file_end.png, label: "Last line" }
  - { key: R, mods: [ALT], label: "Replace" }
  - { key: G, mods: [ALT], icon: goto_line.png, label: "Go to line" }
  - { key: W, mods: [ALT], icon: find_next.png, label: "Find next", shared: false }
  - { key: F, mods: [ALT], icon: find_next.png, label: "Find next", shared: false }
  - { key: Q, mods: [ALT], icon: find_prev.png, label: "Find previous" }
  - { key: B, mods: [ALT], icon: find_prev.png, label: "Find previous" }
  - { key: "]", mods: [ALT], icon: bracket.png, label: "Matching bracket" }
  - { key: A, mods: [ALT], icon: mark.png, label: "Set mark" }
  - { key: "6", mods: [ALT], label: "Copy" }
  - { key: U, mods: [ALT], label: "Undo" }
  - { key: E, mods: [ALT], label: "Redo" }
  - { key: ";", mods: [ALT], icon: macro_run.png, label: "Run macro" }
  - { key: "3", mods: [ALT], icon: comment.png, label: "Comment lines" }
  - { key: T, mods: [ALT], icon: cut_eof.png, label: "Cut to end of file" }
  - { key: D, mods: [ALT], icon: wordcount.png, label: "Word count" }
  - { key: J, mods: [ALT], icon: justify_all.png, label: "Justify file" }
  - { key: V, mods: [ALT], icon: verbatim.png, label: "Verbatim input" }
  - { key: SPACE, mods: [ALT], icon: word_back.png, label: "Previous word" }
  - { key: "7", mods: [ALT], icon: block_prev.png, label: "Previous block" }
  - { key: "8", mods: [ALT], icon: block_next.png, label: "Next block" }
  - { key: "9", mods: [ALT], icon: para_start.png, label: "Paragraph start" }
  - { key: "0", mods: [ALT], icon: para_end.png, label: "Paragraph end" }
  - { key: "-", mods: [ALT], icon: scroll_up.png, label: "Scroll up" }
  - { key: "=", mods: [ALT], icon: scroll_down.png, label: "Scroll down" }
  - { key: UP, mods: [ALT], icon: scroll_up.png, label: "Scroll up" }
  - { key: DOWN, mods: [ALT], icon: scroll_down.png, label: "Scroll down" }
  - { key: ",", mods: [ALT], icon: buf_prev.png, label: "Previous buffer" }
  - { key: ".", mods: [ALT], icon: buf_next.png, label: "Next buffer" }
  - { key: LEFT, mods: [ALT], icon: buf_prev.png, label: "Previous buffer" }
  - { key: RIGHT, mods: [ALT], icon: buf_next.png, label: "Next buffer" }
  - { key: HOME, mods: [ALT], icon: row_top.png, label: "Top row" }
  - { key: END, mods: [ALT], icon: row_bottom.png, label: "Bottom row" }
  - { key: INSERT, mods: [ALT], icon: anchor.png, label: "Place or remove anchor" }
  - { key: "'", mods: [ALT], icon: anchor_next.png, label: "Next anchor" }
  - { key: PGUP, mods: [ALT], icon: anchor_prev.png, label: "Previous anchor" }
  - { key: PGDN, mods: [ALT], icon: anchor_next.png, label: "Next anchor" }
  - { key: BACKSPACE, mods: [ALT], icon: word_back_del.png, label: "Delete previous word" }
  - { key: DELETE, mods: [ALT], icon: zap.png, label: "Throw away line" }
  # Toggles (each switches a setting on or off)
  - { key: Z, mods: [ALT], icon: hide_ui.png, label: "Toggle hidden interface" }
  - { key: X, mods: [ALT], icon: helplines.png, label: "Toggle help lines" }
  - { key: C, mods: [ALT], icon: cursorpos.png, label: "Toggle cursor position display" }
  - { key: N, mods: [ALT], icon: linenumbers.png, label: "Toggle line numbers" }
  - { key: P, mods: [ALT], icon: whitespace.png, label: "Toggle whitespace display" }
  - { key: Y, mods: [ALT], icon: syntax.png, label: "Toggle syntax colors" }
  - { key: S, mods: [ALT], icon: softwrap.png, label: "Toggle soft wrapping" }
  - { key: L, mods: [ALT], icon: hardwrap.png, label: "Toggle hard wrapping" }
  - { key: O, mods: [ALT], icon: tabs_spaces.png, label: "Toggle tabs to spaces" }
  - { key: I, mods: [ALT], icon: autoindent.png, label: "Toggle auto indent" }
  - { key: H, mods: [ALT], icon: smarthome.png, label: "Toggle smart Home" }
  - { key: K, mods: [ALT], icon: cut_from_cursor.png, label: "Toggle cut from cursor" }
  - { key: M, mods: [ALT], icon: mouse.png, label: "Toggle mouse support" }

  # --- Alt+Shift (M- and a shifted character) ---
  - { key: "]", mods: [ALT, SHIFT], icon: indent.png, label: "Indent lines" }          # M-}
  - { key: "[", mods: [ALT, SHIFT], icon: unindent.png, label: "Unindent lines" }      # M-{
  - { key: ";", mods: [ALT, SHIFT], icon: macro_record.png, label: "Record macro" }    # M-:
  - { key: "6", mods: [ALT, SHIFT], label: "Copy" }                                    # M-^
  - { key: "9", mods: [ALT, SHIFT], icon: para_start.png, label: "Paragraph start" }   # M-(
  - { key: "0", mods: [ALT, SHIFT], icon: para_end.png, label: "Paragraph end" }       # M-)
  - { key: "-", mods: [ALT, SHIFT], icon: scroll_up.png, label: "Scroll up" }          # M-_
  - { key: "=", mods: [ALT, SHIFT], icon: scroll_down.png, label: "Scroll down" }      # M-+
  - { key: ",", mods: [ALT, SHIFT], icon: scroll_left.png, label: "Scroll left" }      # M-<
  - { key: ".", mods: [ALT, SHIFT], icon: scroll_right.png, label: "Scroll right" }    # M->
  - { key: "5", mods: [ALT, SHIFT], icon: cycle.png, label: "Cycle cursor line top/center/bottom" }  # M-%
  - { key: "'", mods: [ALT, SHIFT], icon: anchor.png, label: "Place or remove anchor" }  # M-"
  - { key: "3", mods: [ALT, SHIFT], icon: linenumbers.png, label: "Toggle line numbers" }  # M-#
  - { key: "4", mods: [ALT, SHIFT], icon: softwrap.png, label: "Toggle soft wrapping" }  # M-$

  # --- Shift ---
  - { key: DELETE, mods: [SHIFT], icon: char_back_del.png, label: "Backspace" }
  - { key: TAB, mods: [SHIFT], icon: unindent.png, label: "Unindent lines" }

  # --- no modifier ---
  - { key: F1, label: "Help" }
  - { key: F2, icon: exit.png, label: "Exit" }
  - { key: F3, label: "Save as" }
  - { key: F4, icon: justify.png, label: "Justify paragraph" }
  - { key: F5, icon: insertfile.png, label: "Insert file" }
  - { key: F6, icon: search_fwd.png, label: "Search forward" }
  - { key: F7, icon: page_up.png, label: "Page up" }
  - { key: F8, icon: page_down.png, label: "Page down" }
  - { key: F9, label: "Cut" }
  - { key: F10, label: "Paste" }
  - { key: F11, icon: location.png, label: "Cursor position" }
  - { key: F12, icon: spell.png, label: "Spell check" }
  - { key: INSERT, icon: insertfile.png, label: "Insert file" }
