# LightCraft (ArtCraft "Crafting Apps", Lightroom-like photo library + raw developer)
# shortcut overlays for PolyKybd.
#
# Shortcuts: LightCraft's OWN default keymap (not Adobe's), read from the source at
# storytold/lightcraft b3d392b4 -- crates/ui-egui/src/menus.rs (UI_COMMANDS),
# crates/engine/src/cmd/*.rs (cmd! shortcuts), crates/ui-egui/src/shortcuts.rs
# (ALIASES + the hard-wired 0-9 rating/label keys). File:line per group in SOURCES.md.
#
# LightCraft writes "Cmd" for egui's `command` modifier (Ctrl on Windows/Linux, Cmd on
# macOS) -> CMDCTRL here, so the generator emits lightcraft_template.* and
# lightcraft_template_mac.*. Its "Ctrl" is the literal Control key on every OS -> CTRL.
#
# Context-dependent keys: the Detail/develop (canvas) meaning is drawn; the library-grid
# meaning is in SOURCES.md -> "Context-dependent keys".
#
# Icons: Fluent (MIT), Material Symbols (Apache-2.0, ms:), Photoshop overlay drawings
# (shared). Program mark: LightCraft's own lynx icon (MIT OR Apache-2.0).
#
# Regenerate:
#   python polyhost/res/overlay_sources/lightcraft/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/lightcraft/bindings.yaml --preview /tmp/lightcraft_preview
app: lightcraft
# lightcraft.exe (Windows), LightCraft (macOS CFBundleName), lightcraft binary / Wayland
# app id + StartupWMClass ai.storyteller.lightcraft (Linux).
match: [lightcraft, ai.storyteller.lightcraft]
output: lightcraft_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: lightcraft.png
program_icon_mode: luma
program_icon_threshold: 140
program_icon_anchor: bottom-right
program_icon_region: [40, 36]
program_icon_margin: 0

bindings:
