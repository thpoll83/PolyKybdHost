# JupyterLab (and Jupyter Notebook 7) shortcut overlays for PolyKybd: the `terminal` mode set
# (jupyterlab-extension/ reports it; see SOURCES.md).
# GENERATED by gen_specs.py from its table -- edit the table, not this file.
#
# Shortcuts: JupyterLab 4.5.11 default key bindings (schema files). Jupyter
# runs in a browser, so the set loads through the browser entries' URL and
# title maps; the JupyterLab Desktop app loads it by its own name. See
# SOURCES.md.
#
# Regenerate:
#   python polyhost/res/overlay_sources/jupyter/fetch_icons.py
#   python polyhost/res/overlay_sources/jupyter/gen_specs.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/jupyter/bindings.yaml --preview /tmp/jupyter_preview
app: jupyter
match: [jupyterlab]
output: jupyter_terminal_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: jupyter.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:

  - { key: "C", mods: [CTRL, SHIFT], icon: palette.png, label: "Command palette", except: [macos] }
  - { key: "C", mods: [GUI, SHIFT], icon: palette.png, label: "Command palette", only: [macos] }
  - { key: "H", mods: [CTRL, SHIFT], icon: shortcuts.png, label: "Keyboard shortcuts", except: [macos] }
  - { key: "H", mods: [GUI, SHIFT], icon: shortcuts.png, label: "Keyboard shortcuts", only: [macos] }
  - { key: "B", mods: [GUI], icon: leftarea.png, label: "Left sidebar", only: [macos] }
  - { key: "J", mods: [GUI], icon: rightarea.png, label: "Right sidebar", only: [macos] }
  - { key: "F", mods: [CTRL, SHIFT], icon: filebrowser.png, label: "File browser", except: [macos] }
  - { key: "F", mods: [GUI, SHIFT], icon: filebrowser.png, label: "File browser", only: [macos] }
