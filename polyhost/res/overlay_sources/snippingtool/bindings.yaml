# Snipping Tool shortcut overlays for PolyKybd.
#
# ⚠️ SMALL BY NATURE, not by omission. The shortcut everyone knows --
# `Win+Shift+S` -- is a GUI/Win-key combination, and the overlay format has no
# channel for those, so it cannot be drawn at all. What is here is the set that
# works INSIDE the app window once it is open.
#
# Icons: Microsoft Fluent UI System Icons (MIT). Program mark (ESC, all layers):
# the shared license-clean letter tile -- the real icon is Microsoft trademark art.
#
# Regenerate:
#   python polyhost/res/overlay_sources/snippingtool/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/snippingtool/bindings.yaml --preview /tmp/snip_preview
app: snippingtool
match: [snippingtool]
output: snippingtool_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

# ⚠️ NO `program_icon:` HERE, DELIBERATELY -- the ESC mark comes from the
# CURATED GENERIC in `polyhost/res/app_icons.yaml` (mdi:scissors-cutting) instead of a
# baked cell. Both exist and the baked one WINS: `send_overlays_mru` defers a
# synthetic source on any (modifier, keycode) a template already drew, so a
# `program_icon:` here would mean the generic is never uploaded.
#
# The generic reads better at 40x40 than the letter tile it replaced, and it is
# also 8 px wider -- the auto-fetch path fixes the mark at the right-hand 40x40
# square, while a baked one here was 42x34.
#
# ⚠️ The trade, stated because it is invisible from this file: a baked mark
# ALWAYS draws, a fetched one needs `shortcut_icon_auto_fetch` (default on) and
# one successful download. Offline with a cold cache, ESC stays blank.

bindings:
  # --- Ctrl (primary R channel) -----------------------------------------
  - { key: N, mods: [CTRL], icon: newsnip.png,   label: "New snip",   source: "ms-fluent/Cut (MIT)" }
  - { key: S, mods: [CTRL], icon: save.png,      label: Save,         source: "ms-fluent/Save (MIT)" }
  - { key: C, mods: [CTRL], icon: copy.png,      label: Copy,         source: "ms-fluent/Copy (MIT)" }
  - { key: P, mods: [CTRL], icon: print.png,     label: Print,        source: "ms-fluent/Print (MIT)" }
  - { key: Z, mods: [CTRL], icon: undo.png,      label: Undo,         source: "ms-fluent/Arrow Undo (MIT)" }
  - { key: Y, mods: [CTRL], icon: redo.png,      label: Redo,         source: "ms-fluent/Arrow Redo (MIT)" }
  - { key: A, mods: [CTRL], icon: selectall.png, label: "Select all", source: "ms-fluent/Select All On (MIT)" }

  # --- Alt (primary G channel) ------------------------------------------
  - { key: M, mods: [ALT], icon: mode.png,     label: "Snip mode",          source: "ms-fluent/Crop Interim (MIT)" }
  - { key: N, mods: [ALT], icon: samemode.png, label: "New snip, same mode", source: "ms-fluent/Arrow Sync Circle (MIT)" }
