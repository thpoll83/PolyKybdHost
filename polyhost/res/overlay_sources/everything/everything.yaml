# Everything (voidtools file search) shortcut overlay for PolyKybd. See SOURCES.md.
#
# Keys are voidtools' own list, "Keyboard Shortcuts" in the Everything support
# pages: https://www.voidtools.com/support/everything/keyboard_shortcuts/
# Everything is Windows only, so there is one set.
#
# Regenerate:
#   PYTHONPATH=. .venv/bin/python polyhost/res/overlay_sources/everything/fetch_icons.py
#   .venv/bin/python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/everything/everything.yaml --preview /tmp/everything_preview
app: everything
match: [everything]
output: everything_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: alpha
threshold: 128

# A drawn "E" tile. The Everything logo is proprietary freeware art, and no
# licence allows it to be redistributed here.
program_icon: progmark.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

bindings:
  # --- no modifier -----------------------------------------------------------
  - { key: F1, mods: [], label: Help }
  - { key: F2, mods: [], icon: rename.png, label: Rename }
  - { key: F3, mods: [], icon: search.png, label: "Focus search" }
  - { key: F5, mods: [], icon: reload.png, label: "Reload file info" }
  - { key: F11, mods: [], icon: fullscreen.png, label: "Full screen" }
  - { key: DELETE, mods: [], label: Delete }
  - { key: TAB, mods: [], icon: switchfocus.png, label: "Search / results" }

  # --- Shift -----------------------------------------------------------------
  - { key: DELETE, mods: [SHIFT], icon: deleteperm.png, label: "Delete permanently", shared: false }
  - { key: F10, mods: [SHIFT], icon: contextmenu.png, label: "Context menu" }
  - { key: INSERT, mods: [SHIFT], label: Paste }
  - { key: TAB, mods: [SHIFT], icon: switchfocus.png, label: "Search / results" }

  # --- Ctrl ------------------------------------------------------------------
  - { key: A, mods: [CTRL], label: "Select all" }
  - { key: C, mods: [CTRL], label: Copy }
  - { key: INSERT, mods: [CTRL], label: Copy }
  - { key: X, mods: [CTRL], label: Cut }
  - { key: V, mods: [CTRL], label: Paste }
  - { key: W, mods: [CTRL], label: Close }
  - { key: F, mods: [CTRL], icon: search.png, label: "Focus search" }
  - { key: N, mods: [CTRL], icon: newwindow.png, label: "New search window" }
  - { key: O, mods: [CTRL], icon: filelist.png, label: "Open file list" }
  - { key: S, mods: [CTRL], icon: export.png, label: "Export results" }
  - { key: P, mods: [CTRL], icon: options.png, label: Options }
  - { key: Q, mods: [CTRL], icon: exit.png, label: "Exit Everything" }
  - { key: T, mods: [CTRL], icon: ontop.png, label: "Always on top" }
  - { key: D, mods: [CTRL], icon: bookmark.png, label: "Bookmark search" }
  - { key: E, mods: [CTRL], icon: readinfo.png, label: "Read sizes and dates" }
  - { key: H, mods: [CTRL], icon: history.png, label: "Search history" }
  - { key: B, mods: [CTRL], icon: matchword.png, label: "Match whole word" }
  - { key: I, mods: [CTRL], icon: matchcase.png, label: "Match case" }
  - { key: M, mods: [CTRL], icon: diacritics.png, label: "Match diacritics" }
  - { key: R, mods: [CTRL], icon: regex.png, label: Regex }
  - { key: U, mods: [CTRL], icon: matchpath.png, label: "Match path" }
  - { key: ENTER, mods: [CTRL], icon: openpath.png, label: "Open path" }
  - { key: EQUAL, mods: [CTRL], icon: textbigger.png, label: "Larger text" }
  - { key: MINUS, mods: [CTRL], icon: textsmaller.png, label: "Smaller text" }
  - { key: "0", mods: [CTRL], icon: textreset.png, label: "Normal text size" }
  - { key: GRAVE, mods: [CTRL], icon: debug.png, label: "Debug console" }
  - { key: F1, mods: [CTRL], icon: about.png, label: "About Everything" }
  - { key: TAB, mods: [CTRL], icon: nextwindow.png, label: "Next window" }
  # sort
  - { key: "1", mods: [CTRL], icon: sortname.png, label: "Sort by name" }
  - { key: "2", mods: [CTRL], icon: sortpath.png, label: "Sort by path" }
  - { key: "3", mods: [CTRL], icon: sortsize.png, label: "Sort by size" }
  - { key: "4", mods: [CTRL], icon: sortext.png, label: "Sort by extension" }
  - { key: "5", mods: [CTRL], icon: sorttype.png, label: "Sort by type" }
  - { key: "6", mods: [CTRL], icon: sortmod.png, label: "Sort by date modified" }
  - { key: "7", mods: [CTRL], icon: sortcreated.png, label: "Sort by date created" }
  - { key: "8", mods: [CTRL], icon: sortattr.png, label: "Sort by attributes" }
  - { key: "9", mods: [CTRL], icon: sortchanged.png, label: "Sort by date changed" }

  # --- Alt -------------------------------------------------------------------
  - { key: D, mods: [ALT], icon: search.png, label: "Focus search" }
  - { key: P, mods: [ALT], icon: preview.png, label: "Preview pane" }
  - { key: HOME, mods: [ALT], icon: home.png, label: "Home search" }
  - { key: LEFT, mods: [ALT], icon: back.png, label: Back }
  - { key: RIGHT, mods: [ALT], icon: forward.png, label: Forward }
  - { key: UP, mods: [ALT], icon: history.png, label: "Search history" }
  - { key: DOWN, mods: [ALT], icon: history.png, label: "Search history" }
  - { key: ENTER, mods: [ALT], icon: props.png, label: Properties }
  - { key: "1", mods: [ALT], icon: size512.png, label: "Window 512x398" }
  - { key: "2", mods: [ALT], icon: size640.png, label: "Window 640x497" }
  - { key: "3", mods: [ALT], icon: size768.png, label: "Window 768x597" }
  - { key: "4", mods: [ALT], icon: autosize.png, label: "Auto size window" }

  # --- Ctrl+Shift --------------------------------------------------------------
  - { key: "1", mods: [CTRL, SHIFT], icon: thumbxl.png, label: "Extra large thumbnails" }
  - { key: "2", mods: [CTRL, SHIFT], icon: thumbl.png, label: "Large thumbnails" }
  - { key: "3", mods: [CTRL, SHIFT], icon: thumbm.png, label: "Medium thumbnails" }
  - { key: "6", mods: [CTRL, SHIFT], icon: details.png, label: "Detail view" }
  - { key: C, mods: [CTRL, SHIFT], icon: copypath.png, label: "Copy full path" }
  - { key: F, mods: [CTRL, SHIFT], icon: filters.png, label: "Organize filters" }
  - { key: B, mods: [CTRL, SHIFT], icon: bookmarks.png, label: "Organize bookmarks" }
  - { key: H, mods: [CTRL, SHIFT], icon: history.png, label: "Search history" }
  - { key: TAB, mods: [CTRL, SHIFT], icon: prevwindow.png, label: "Previous window" }

  # --- Ctrl+Alt --------------------------------------------------------------
  - { key: EQUAL, mods: [CTRL, ALT], icon: thumbbigger.png, label: "Larger thumbnails" }
  - { key: MINUS, mods: [CTRL, ALT], icon: thumbsmaller.png, label: "Smaller thumbnails" }
