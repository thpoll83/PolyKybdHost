# Affinity Publisher shortcut overlays for PolyKybd.
# GENERATED by gen_specs.py from its table -- edit the table, not this file.
#
# Shortcuts: Serif, Affinity help, "Keyboard shortcuts" for Affinity Publisher 2, the
# Windows and macOS keys. See SOURCES.md.
#
# Regenerate:
#   python polyhost/res/overlay_sources/affinity/gen_specs.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/affinity/publisher.yaml --preview /tmp/affinity_preview
