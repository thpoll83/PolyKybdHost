# Affinity Designer shortcut overlays for PolyKybd.
# GENERATED by gen_specs.py from its table -- edit the table, not this file.
#
# Shortcuts: Serif, Affinity help, "Keyboard shortcuts" for Affinity Designer 2, the
# Windows and macOS keys. See SOURCES.md.
#
# Regenerate:
#   python polyhost/res/overlay_sources/affinity/gen_specs.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/affinity/designer.yaml --preview /tmp/affinity_preview
app: affinity-designer
match: [designer, affinity designer, affinity designer 2]
output: affinity_designer_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: designer.png
program_icon_mode: alpha
program_icon_anchor: bottom-right
program_icon_region: [37, 32]
program_icon_margin: 0

