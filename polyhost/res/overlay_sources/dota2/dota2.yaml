# Dota 2 overlay for PolyKybd.
#
# Keys: the "Arrow (Default)" hotkey template, from the Dota 2 Wiki page
# "Hotkeys". See SOURCES.md.
#
# Every labelled key does the same thing whatever hero is played. The ability
# keys (Q W E D F R) and their Alt (autocast) variants change with the hero,
# so they stay blank. The item keys (Z X C V B N) show which inventory slot
# they use. A user who picks another template or rebinds a key still sees the
# default here.
#
# Regenerate:
#   python polyhost/res/overlay_sources/dota2/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/dota2/dota2.yaml --preview /tmp/dota2_preview
app: dota 2
match: [dota2, steam_app_570]
output: dota2_template
icon_dir: icons
fit: contain
mode: alpha
threshold: 150
# As for League of Legends: the icon uses the full height on the right; the
# firmware clears 3 px around it, so a letter legend stays whole.
anchor: right
region: [40, 40]
margin: 0

# DOTA 2 drawn over the whole cell, without the ESC legend (protocol v25).
program_icon: program.png
program_icon_mode: alpha
program_icon_region: [72, 40]
program_icon_margin: 0
program_icon_legend: false

bindings:

  # Items: Z X C are the top row of the inventory, V B N the bottom row
  - { key: Z, icon: item_z.png, label: "Item slot 1" }
  - { key: X, icon: item_x.png, label: "Item slot 2" }
  - { key: C, icon: item_c.png, label: "Item slot 3" }
  - { key: V, icon: item_v.png, label: "Item slot 4" }
  - { key: B, icon: item_b.png, label: "Item slot 5" }
  - { key: N, icon: item_n.png, label: "Item slot 6" }

  # Unit actions
  - { key: F1, icon: hero.png, label: "Select hero", region: [34, 40] }
  - { key: A, icon: attack.png, label: "Attack move" }
  - { key: H, icon: hold.png, label: "Hold position" }
  - { key: S, icon: stop.png, label: "Stop", shared: false }
  - { key: M, icon: move.png, label: "Move" }
  - { key: O, icon: learn.png, label: "Learn ability" }
  - { key: U, icon: talents.png, label: "Talents" }
  - { key: J, icon: glyph.png, label: "Glyph of Fortification" }
  - { key: P, icon: scan.png, label: "Scan" }
  - { key: TAB, icon: nextunit.png, label: "Next unit" }

  # Control groups
  - { key: "1", icon: group1.png, label: "Group 1" }
  - { key: "2", icon: group2.png, label: "Group 2" }
  - { key: "3", icon: group3.png, label: "Group 3" }
  - { key: "4", icon: group4.png, label: "Group 4" }
  - { key: "5", icon: group5.png, label: "Group 5" }
  - { key: "6", icon: group6.png, label: "Group 6" }
  - { key: "7", icon: group7.png, label: "Group 7" }
  - { key: "8", icon: group8.png, label: "Group 8" }
  - { key: "9", icon: group9.png, label: "Group 9" }
  - { key: "1", mods: [CTRL], icon: groupadd1.png, label: "Assign group 1" }
  - { key: "2", mods: [CTRL], icon: groupadd2.png, label: "Assign group 2" }
  - { key: "3", mods: [CTRL], icon: groupadd3.png, label: "Assign group 3" }
  - { key: "4", mods: [CTRL], icon: groupadd4.png, label: "Assign group 4" }
  - { key: "5", mods: [CTRL], icon: groupadd5.png, label: "Assign group 5" }
  - { key: "6", mods: [CTRL], icon: groupadd6.png, label: "Assign group 6" }
  - { key: "7", mods: [CTRL], icon: groupadd7.png, label: "Assign group 7" }
  - { key: "8", mods: [CTRL], icon: groupadd8.png, label: "Assign group 8" }
  - { key: "9", mods: [CTRL], icon: groupadd9.png, label: "Assign group 9" }

  # Shop and courier
  - { key: F2, icon: courier.png, label: "Select courier", region: [34, 40] }
  - { key: F3, icon: deliver.png, label: "Courier: deliver items", region: [34, 40] }
  - { key: F4, icon: shop.png, label: "Open shop", region: [34, 40] }
  - { key: F5, icon: quickbuy.png, label: "Purchase quickbuy", region: [34, 40] }
  - { key: F8, icon: sticky.png, label: "Purchase sticky item", region: [34, 40] }

  # Interface
  - { key: GRAVE, icon: scoreboard.png, label: "Scoreboard" }
  - { key: F9, icon: pause.png, label: "Pause", region: [34, 40] }
  - { key: F6, icon: screenshot.png, label: "Screenshot", region: [34, 40] }
  - { key: '\', icon: console.png, label: "Console" }
  - { key: I, icon: showcase.png, label: "Showcase view" }

  # Chat
  - { key: ENTER, icon: teamchat.png, label: "Team chat" }
  - { key: ENTER, mods: [SHIFT], icon: allchat.png, label: "All chat" }
  - { key: G, icon: voice.png, label: "Voice chat (team)" }
  - { key: Y, icon: chatwheel.png, label: "Chat wheel" }
