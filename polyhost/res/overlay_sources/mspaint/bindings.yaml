# Microsoft Paint shortcut overlays for PolyKybd.
#
# ⚠️ Paint is CLOSED SOURCE -- no keymap file to read. Every binding here is one
# that TWO independent references agree on; single-source claims are recorded in
# SOURCES.md as unverified rather than guessed at. A wrong icon is worse than no
# icon, because the user believes it.
#
# Icons: Microsoft Fluent UI System Icons (MIT), reusing the same glyphs as the
# other Windows overlays where the action matches. Program mark (ESC, all
# layers): the shared license-clean letter tile -- the real icon is Microsoft
# trademark art.
#
# Regenerate:
#   python polyhost/res/overlay_sources/mspaint/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/mspaint/bindings.yaml --preview /tmp/mspaint_preview
app: mspaint
match: [mspaint]
output: mspaint_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: luma
threshold: 150

program_icon: mspaint.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [42, 34]
program_icon_margin: 0

bindings:
  # --- Ctrl: file (primary R channel) -----------------------------------
  - { key: N, mods: [CTRL], icon: new.png,   label: New,   source: "ms-fluent/Document Add (MIT)" }
  - { key: O, mods: [CTRL], icon: open.png,  label: Open,  source: "ms-fluent/Folder Open (MIT)" }
  - { key: S, mods: [CTRL], icon: save.png,  label: Save,  source: "ms-fluent/Save (MIT)" }
  - { key: P, mods: [CTRL], icon: print.png, label: Print, source: "ms-fluent/Print (MIT)" }

  # --- Ctrl: edit -------------------------------------------------------
  - { key: Z, mods: [CTRL], icon: undo.png,      label: Undo,         source: "ms-fluent/Arrow Undo (MIT)" }
  - { key: Y, mods: [CTRL], icon: redo.png,      label: Redo,         source: "ms-fluent/Arrow Redo (MIT)" }
  - { key: X, mods: [CTRL], icon: cut.png,       label: Cut,          source: "ms-fluent/Cut (MIT)" }
  - { key: C, mods: [CTRL], icon: copy.png,      label: Copy,         source: "ms-fluent/Copy (MIT)" }
  - { key: V, mods: [CTRL], icon: paste.png,     label: Paste,        source: "ms-fluent/Clipboard Paste (MIT)" }
  - { key: A, mods: [CTRL], icon: selectall.png, label: "Select all", source: "ms-fluent/Select All On (MIT)" }

  # --- Ctrl: image ------------------------------------------------------
  # ⚠️ Paint-specific and NOT the obvious meaning: Ctrl+E is Image Properties
  # (not "centre"), Ctrl+W is Resize and Skew (not "close window").
  - { key: E, mods: [CTRL], icon: imageprops.png, label: "Image properties", source: "ms-fluent/Image (MIT)" }
  - { key: W, mods: [CTRL], icon: resize.png,     label: "Resize and skew",  source: "ms-fluent/Resize Image (MIT)" }

  # --- Ctrl: text tool formatting ---------------------------------------
  - { key: B, mods: [CTRL], icon: bold.png,      label: Bold,      source: "ms-fluent/Text Bold (MIT)" }
  - { key: I, mods: [CTRL], icon: italic.png,    label: Italic,    source: "ms-fluent/Text Italic (MIT)" }
  - { key: U, mods: [CTRL], icon: underline.png, label: Underline, source: "ms-fluent/Text Underline (MIT)" }

  # --- Ctrl: view -------------------------------------------------------
  - { key: G,    mods: [CTRL], icon: grid.png,    label: "Gridlines on/off", source: "ms-fluent/Grid (MIT)" }
  - { key: R,    mods: [CTRL], icon: ruler.png,   label: "Ruler on/off",     source: "ms-fluent/Ruler (MIT)" }
  - { key: PGUP, mods: [CTRL], icon: zoomin.png,  label: "Zoom in",          source: "ms-fluent/Zoom In (MIT)" }
  - { key: PGDN, mods: [CTRL], icon: zoomout.png, label: "Zoom out",         source: "ms-fluent/Zoom Out (MIT)" }

  # --- no modifier (primary A channel) ----------------------------------
  - { key: F11, mods: [], icon: fullscreen.png, label: "Full screen",  source: "ms-fluent/Full Screen Maximize (MIT)" }
  - { key: F12, mods: [], icon: saveas.png,     label: "Save as",      source: "ms-fluent/Save Edit (MIT)" }
