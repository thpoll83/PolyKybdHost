# Avid Pro Tools shortcut overlays for PolyKybd (Windows and macOS; Pro Tools
# has no Linux version). See SOURCES.md.
#
# Shortcuts: "Pro Tools Shortcuts Guide", Rev A, created 2026-10-11
# (Pro_Tools_Shortcuts_2026.11.pdf, 92 pages), which gives the Mac and the
# Windows key side by side. The guide pairs the modifiers like this:
#   Command (Mac) = Control (Windows)  -> CMDCTRL
#   Option (Mac)  = Alt (Windows)      -> ALT
#   Control (Mac) = Start (Windows)    -> CTRL on macOS, GUI on Windows; such a
#                                         binding is written twice, with
#                                         except: [macos] and only: [macos]
# Where the guide does not follow this pairing, both keys are written out
# (except:/only:) exactly as the guide gives them.
#
# ⚠️ The keys WITHOUT a modifier are the Commands Keyboard Focus keys (guide
# chapter 3, in QWERTY order). They act only while Commands Keyboard Focus is
# on for the Edit window (the a-z button, or Cmd+Option+1 / Ctrl+Alt+1). The
# host cannot detect that state. With it off, the plain letters type nothing in
# the Edit window. Space, Return, Tab, the F keys and the arrows act either way.
#
# The modifier layers are the Edit window shortcuts (guide chapters 7 and 8).
# Mix-window-only, dialog-only and numeric keypad keys are left out (no keypad
# cell, or no Edit window meaning); SOURCES.md lists them.
#
# Regenerate:
#   PYTHONPATH=. python polyhost/res/overlay_sources/protools/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/protools/bindings.yaml --preview /tmp/protools_preview
app: protools
match: [protools, pro tools]
output: protools_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

program_icon: protools.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

