# Vim (Terminal-Job mode) and Neovim (Terminal mode) both leave it with
# CTRL-\ CTRL-N; every other key goes to the job.
terminal:
  - { key: "\\", mods: [CTRL], icon: esc, label: "CTRL-\\ CTRL-N: Normal mode", tag: t_CTRL-\_CTRL-N }
