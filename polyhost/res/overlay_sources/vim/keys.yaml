# Vim's default keys per mode, the input of gen_vim_bindings.py.
#
# Source: Vim's own command index, `:help index` (runtime/doc/index.txt,
# https://vimhelp.org/index.txt.html, "For Vim version 9.2. Last change: 2026
# Feb 14", read 2026-10-30). `tag` is the help tag of the row each key comes
# from, so `:help <tag>` shows it. Default bindings only; SOURCES.md lists
# what was left out and why.
#
# Keys are US positions: `$` is SHIFT+4, `~` is SHIFT+GRAVE. One icon file is
# one picture, so a key that does the same thing in two modes uses the same
# file and the keyboard keeps one copy of it.
#
# Sections:
#   motions   - cursor motions, in Normal and Visual mode
#   normal    - the rest of Normal mode
#   visual    - Visual mode, drawn over the motions (`:help visual-index`)
#   insert    - Insert mode
#   replace   - Replace mode: Insert mode with these keys changed
#   cmdline   - Command-line mode (`:help ex-edit-index`)
#   terminal  - Terminal mode (`:help terminal`, Neovim `:help terminal-input`)

