  - { key: H, mods: [CTRL], icon: restore_char, label: "Restore character", tag: Replace-mode }
  - { key: W, mods: [CTRL], icon: restore_word, label: "Restore word", tag: Replace-mode }
  - { key: U, mods: [CTRL], icon: restore_line, label: "Restore line", tag: Replace-mode }
  - { key: INSERT, icon: insert, label: "Insert mode", tag: "i_<Insert>" }

