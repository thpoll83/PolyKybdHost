# KeePass 2.x (the original KeePass, keepass.info) shortcut overlay for PolyKybd.
#
# It shares the icon folder with the KeePassXC set (`bindings.yaml`). The keys
# differ from KeePassXC in places: Ctrl+I adds an entry, Ctrl+K duplicates one,
# Ctrl+U opens the URL and Ctrl+Shift+U copies it. See SOURCES.md.
#
# Keys: KeePass 2.59 source, `KeePass/Forms/MainForm_Functions.cs`
# (`AssignShortcut` calls and the key handlers `HandleMainWindowKeyMessage`,
# `HandleGroupKeyEvent`, `HandleEntryKeyEvent`).
#
# KeePass runs on Windows and, under Mono, on Linux. Under Mono the move keys
# are Ctrl+Shift+F5..F8 instead of Alt+Home/Up/Down/End (MonoWorkarounds 1245),
# so the Linux set swaps them. There is no macOS set.
#
# Regenerate (from the repo root):
#   python polyhost/res/overlay_sources/keepassxc/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/keepassxc/keepass.yaml --preview /tmp/keepass_preview
app: keepass
match: [keepass, keepass2]
output: keepass_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: alpha
threshold: 128

program_icon: kp2_progmark.png
program_icon_mode: luma  # frame 64 (32 is different art). t60 keeps the padlock stripes; t110 filled them unevenly and the right edge looked broken
program_icon_threshold: 60
program_icon_anchor: right
program_icon_region: [40, 38]
program_icon_margin: 0

bindings:
  # --- file ---
  - { key: O, mods: [CTRL], icon: kp_open.png, label: "Open database" }
  - { key: O, mods: [CTRL, SHIFT], icon: kp2_openurl.png, label: "Open database from URL" }
  - { key: N, mods: [CTRL], icon: kp_newdb.png, label: "New database" }
  - { key: W, mods: [CTRL], icon: kp_closedb.png, label: "Close database" }
  - { key: S, mods: [CTRL], icon: kp_save.png, label: "Save database" }
  - { key: P, mods: [CTRL], icon: kp2_print.png, label: "Print database" }
  - { key: R, mods: [CTRL], icon: kp2_sync.png, label: "Synchronize with file" }
  - { key: R, mods: [CTRL, SHIFT], icon: kp2_syncurl.png, label: "Synchronize with URL" }
  - { key: L, mods: [CTRL], icon: kp_lock.png, label: "Lock workspace" }
  - { key: Q, mods: [CTRL], icon: kp_quit.png, label: "Exit KeePass" }
  # --- entries ---
  - { key: I, mods: [CTRL], icon: kp_entrynew.png, label: "Add entry" }
  - { key: INS, mods: [], icon: kp_entrynew.png, label: "Add entry" }
  - { key: ENTER, mods: [], icon: kp_entryedit.png, label: "Edit entry" }
  - { key: F2, mods: [], icon: kp_entryedit.png, label: "Edit entry" }
  - { key: K, mods: [CTRL], icon: kp_entryclone.png, label: "Duplicate entry" }
  - { key: DEL, mods: [], icon: kp_entrydelete.png, label: "Delete entry" }
  - { key: A, mods: [CTRL], icon: kp2_selectall.png, label: "Select all entries" }
  - { key: B, mods: [CTRL], icon: kp_copyuser.png, label: "Copy user name" }
  - { key: C, mods: [CTRL], icon: kp_copypass.png, label: "Copy password" }
  - { key: U, mods: [CTRL], icon: kp_openurl.png, label: "Open URL" }
  - { key: U, mods: [CTRL, SHIFT], icon: kp_copyurl.png, label: "Copy URL" }
  - { key: V, mods: [CTRL], icon: kp_autotype.png, label: "Perform auto-type" }
  - { key: T, mods: [CTRL], icon: kp_copytotp.png, label: "Copy TOTP" }
  - { key: T, mods: [CTRL, SHIFT], icon: kp_showtotp.png, label: "Show TOTP" }
  - { key: C, mods: [CTRL, SHIFT], icon: kp2_copyentries.png, label: "Copy entries to clipboard" }
  - { key: V, mods: [CTRL, SHIFT], icon: kp2_pasteentries.png, label: "Paste entries" }
  - { key: INS, mods: [SHIFT], icon: kp2_pasteentries.png, label: "Paste entries" }
  - { key: D, mods: [CTRL], icon: kp2_compare.png, label: "Compare entries" }
  - { key: D, mods: [CTRL, SHIFT], icon: kp2_markcompare.png, label: "Mark for comparison" }
  - { key: P, mods: [CTRL, SHIFT], icon: kp2_print.png, label: "Print group" }
  # --- move the selected entry or group ---
  - { key: HOME, mods: [ALT], icon: kp2_movetop.png, label: "Move to top", except: [linux] }
  - { key: UP, mods: [ALT], icon: kp_moveup.png, label: "Move one up", except: [linux] }
  - { key: DOWN, mods: [ALT], icon: kp_movedown.png, label: "Move one down", except: [linux] }
  - { key: END, mods: [ALT], icon: kp2_movebottom.png, label: "Move to bottom", except: [linux] }
  - { key: F5, mods: [CTRL, SHIFT], icon: kp2_movetop.png, label: "Move to top", only: [linux] }
  - { key: F6, mods: [CTRL, SHIFT], icon: kp_moveup.png, label: "Move one up", only: [linux] }
  - { key: F7, mods: [CTRL, SHIFT], icon: kp_movedown.png, label: "Move one down", only: [linux] }
  - { key: F8, mods: [CTRL, SHIFT], icon: kp2_movebottom.png, label: "Move to bottom", only: [linux] }
  # --- find and view ---
  - { key: F, mods: [CTRL], icon: kp_search.png, label: "Find" }
  - { key: F3, mods: [], icon: kp_search.png, label: "Find" }
  - { key: F, mods: [CTRL, SHIFT], icon: kp2_findgroup.png, label: "Find in group" }
  - { key: G, mods: [CTRL], icon: kp_jumpgroup.png, label: "Go to parent group" }
  - { key: H, mods: [CTRL], icon: kp_hidepass.png, label: "Hide passwords" }
  - { key: J, mods: [CTRL], icon: kp_hideuser.png, label: "Hide user names" }
  - { key: TAB, mods: [CTRL], icon: kp_nexttab.png, label: "Next database tab" }
  - { key: TAB, mods: [CTRL, SHIFT], icon: kp_prevtab.png, label: "Previous database tab" }
  - { key: F1, mods: [], icon: kp2_help.png, label: "Help contents" }
