# KeePassXC shortcut overlays for PolyKybd. See SOURCES.md.
#
# Keys: KeePassXC 2.8.0's own keyboard shortcut page
# (docs/topics/KeyboardShortcuts.adoc) and the source that sets them
# (src/gui/MainWindow.ui, MainWindow.cpp, entry/EntryView.cpp,
# group/GroupView.cpp). KeePassXC writes Ctrl in its .ui file and Qt maps it to
# Cmd on macOS, so those keys are CMDCTRL. Three keys differ per platform in
# MainWindow.cpp:
#   * Select database tab 1..9: Ctrl on Windows, Cmd on macOS, Alt on Linux.
#   * Next / previous database tab: Ctrl+Tab, but Option+Tab on macOS.
#   * SSH agent add / remove: real Ctrl+H on macOS too (Qt::META), so CTRL.
# The program mark is KeePassXC's own monochrome tray icon.
#
# Regenerate:
#   python polyhost/res/overlay_sources/keepassxc/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/keepassxc/bindings.yaml --preview /tmp/keepassxc_preview
app: keepassxc
match: [keepassxc, org.keepassxc.keepassxc]
output: keepassxc_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [40, 36]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 128

program_icon: progmark.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [40, 38]
program_icon_margin: 0

bindings:
  # --- database ---
  - { key: O, mods: [CMDCTRL], icon: kp_open.png, label: "Open database" }
  - { key: S, mods: [CMDCTRL], icon: kp_save.png, label: "Save database" }
  - { key: S, mods: [CMDCTRL, SHIFT], icon: kp_saveas.png, label: "Save database as" }
  - { key: N, mods: [CMDCTRL, SHIFT], icon: kp_newdb.png, label: "New database" }
  - { key: W, mods: [CMDCTRL], icon: kp_closedb.png, label: "Close database" }
  - { key: F4, mods: [CTRL], icon: kp_closedb.png, label: "Close database", only: [windows] }
  - { key: L, mods: [CMDCTRL], icon: kp_lock.png, label: "Lock database" }
  - { key: L, mods: [CMDCTRL, SHIFT], icon: kp_lockall.png, label: "Lock all databases" }
  - { key: COMMA, mods: [CMDCTRL, SHIFT], icon: kp_dbsettings.png, label: "Database settings" }
  - { key: R, mods: [CMDCTRL, SHIFT], icon: kp_reports.png, label: "Database reports" }
  - { key: COMMA, mods: [CMDCTRL], icon: kp_settings.png, label: "Application settings" }
  - { key: Q, mods: [CMDCTRL], icon: kp_quit.png, label: "Quit KeePassXC" }

  # --- entries ---
  - { key: N, mods: [CMDCTRL], icon: kp_entrynew.png, label: "New entry" }
  - { key: E, mods: [CMDCTRL], icon: kp_entryedit.png, label: "Edit entry" }
  - { key: ENTER, mods: [], icon: kp_entryedit.png, label: "Edit entry" }
  - { key: DEL, mods: [], icon: kp_entrydelete.png, label: "Delete entry" }
  - { key: D, mods: [CMDCTRL], icon: kp_entryclone.png, label: "Clone entry" }
  - { key: R, mods: [CMDCTRL], icon: kp_entryrestore.png, label: "Restore entry" }
  - { key: B, mods: [CMDCTRL], icon: kp_copyuser.png, label: "Copy username" }
  - { key: C, mods: [CMDCTRL], icon: kp_copypass.png, label: "Copy password" }
  - { key: U, mods: [CMDCTRL], icon: kp_copyurl.png, label: "Copy URL" }
  - { key: I, mods: [CMDCTRL], icon: kp_copytitle.png, label: "Copy title" }
  - { key: U, mods: [CMDCTRL, SHIFT], icon: kp_openurl.png, label: "Open URL" }
  - { key: T, mods: [CMDCTRL], icon: kp_copytotp.png, label: "Copy TOTP" }
  - { key: Y, mods: [CMDCTRL], icon: kp_copypasstotp.png, label: "Copy password and TOTP" }
  - { key: T, mods: [CMDCTRL, SHIFT], icon: kp_showtotp.png, label: "Show TOTP" }
  - { key: V, mods: [CMDCTRL, SHIFT], icon: kp_autotype.png, label: "Perform Auto-Type" }
  - { key: D, mods: [CMDCTRL, SHIFT], icon: kp_favicon.png, label: "Download favicon" }
  - { key: H, mods: [CTRL], icon: kp_agentadd.png, label: "Add key to SSH agent" }
  - { key: H, mods: [CTRL, SHIFT], icon: kp_agentremove.png, label: "Remove key from SSH agent" }
  - { key: UP, mods: [ALT], icon: ../../effectcraft/icons/nudge10_up.png, label: "Move entry up" }
  - { key: DOWN, mods: [ALT], icon: ../../effectcraft/icons/nudge10_down.png, label: "Move entry down" }
  - { key: J, mods: [CMDCTRL, SHIFT], icon: kp_jumpgroup.png, label: "Jump to group" }

  # --- groups ---
  - { key: DOWN, mods: [CMDCTRL], icon: kp_sortasc.png, label: "Sort groups A-Z" }
  - { key: UP, mods: [CMDCTRL], icon: kp_sortdesc.png, label: "Sort groups Z-A" }
  - { key: PGDN, mods: [CMDCTRL, SHIFT], icon: kp_nextgroup.png, label: "Next group" }
  - { key: PGUP, mods: [CMDCTRL, SHIFT], icon: kp_prevgroup.png, label: "Previous group" }

  # --- view and focus ---
  - { key: F1, mods: [], icon: kp_focusgroups.png, label: "Focus groups" }
  - { key: F2, mods: [], icon: kp_focusentries.png, label: "Focus entries" }
  - { key: F3, mods: [], icon: kp_search.png, label: "Focus search" }
  - { key: F6, mods: [], icon: kp_search.png, label: "Focus search" }
  - { key: F, mods: [CMDCTRL], icon: kp_search.png, label: "Focus search" }
  - { key: C, mods: [CMDCTRL, SHIFT], icon: kp_hidepass.png, label: "Hide passwords" }
  - { key: B, mods: [CMDCTRL, SHIFT], icon: kp_hideuser.png, label: "Hide usernames" }
  - { key: A, mods: [CMDCTRL, SHIFT], icon: kp_ontop.png, label: "Always on top" }
  - { key: "/", mods: [CMDCTRL], icon: kp_shortcuts.png, label: "Keyboard shortcuts" }

  # --- window and database tabs ---
  - { key: M, mods: [CMDCTRL], icon: kp_minimize.png, label: "Minimize window" }
  - { key: M, mods: [CMDCTRL, SHIFT], icon: kp_hidewindow.png, label: "Hide window" }
  - { key: TAB, mods: [CTRL], icon: kp_nexttab.png, label: "Next database tab", except: [macos] }
  - { key: TAB, mods: [CTRL, SHIFT], icon: kp_prevtab.png, label: "Previous database tab", except: [macos] }
  - { key: TAB, mods: [ALT], icon: kp_nexttab.png, label: "Next database tab", only: [macos] }
  - { key: TAB, mods: [ALT, SHIFT], icon: kp_prevtab.png, label: "Previous database tab", only: [macos] }
  - { key: PGDN, mods: [CMDCTRL], icon: kp_nexttab.png, label: "Next database tab" }
  - { key: PGUP, mods: [CMDCTRL], icon: kp_prevtab.png, label: "Previous database tab" }
  - { key: "1", mods: [CMDCTRL], icon: kp_db1.png, label: "Database tab 1", except: [linux] }
  - { key: "2", mods: [CMDCTRL], icon: kp_db2.png, label: "Database tab 2", except: [linux] }
  - { key: "3", mods: [CMDCTRL], icon: kp_db3.png, label: "Database tab 3", except: [linux] }
  - { key: "4", mods: [CMDCTRL], icon: kp_db4.png, label: "Database tab 4", except: [linux] }
  - { key: "5", mods: [CMDCTRL], icon: kp_db5.png, label: "Database tab 5", except: [linux] }
  - { key: "6", mods: [CMDCTRL], icon: kp_db6.png, label: "Database tab 6", except: [linux] }
  - { key: "7", mods: [CMDCTRL], icon: kp_db7.png, label: "Database tab 7", except: [linux] }
  - { key: "8", mods: [CMDCTRL], icon: kp_db8.png, label: "Database tab 8", except: [linux] }
  - { key: "9", mods: [CMDCTRL], icon: kp_db9.png, label: "Last database tab", except: [linux] }
  - { key: "1", mods: [ALT], icon: kp_db1.png, label: "Database tab 1", only: [linux] }
  - { key: "2", mods: [ALT], icon: kp_db2.png, label: "Database tab 2", only: [linux] }
  - { key: "3", mods: [ALT], icon: kp_db3.png, label: "Database tab 3", only: [linux] }
  - { key: "4", mods: [ALT], icon: kp_db4.png, label: "Database tab 4", only: [linux] }
  - { key: "5", mods: [ALT], icon: kp_db5.png, label: "Database tab 5", only: [linux] }
  - { key: "6", mods: [ALT], icon: kp_db6.png, label: "Database tab 6", only: [linux] }
  - { key: "7", mods: [ALT], icon: kp_db7.png, label: "Database tab 7", only: [linux] }
  - { key: "8", mods: [ALT], icon: kp_db8.png, label: "Database tab 8", only: [linux] }
  - { key: "9", mods: [ALT], icon: kp_db9.png, label: "Last database tab", only: [linux] }
