# The default key map of CodeMirror 6's Vim emulation, the input of
# gen_obsidian_modes.py for the Vim layers.
#
# Obsidian's "Vim key bindings" option (Settings -> Editor) runs
# @replit/codemirror-vim. This list is the `defaultKeymap` array of
# @replit/codemirror-vim-core 0.1.0 (vim.js, MIT licence,
# https://github.com/replit/codemirror-vim), the core that
# @replit/codemirror-vim 6.4.0 depends on, read from the npm packages on
# 2026-11-13. Each row is [keys, context]: `keys` as the package writes them,
# context `normal`, `visual`, `insert` or `-` (every context). Only the FIRST
# keystroke of a row matters to the generator. Which version Obsidian bundles
# is not published; a key Obsidian's copy lacks would be drawn and do nothing.
keys:
  - ["<Left>", "-"]
  - ["<Right>", "-"]
  - ["<Up>", "-"]
  - ["<Down>", "-"]
  - ["g<Up>", "-"]
  - ["g<Down>", "-"]
  - ["<Space>", "-"]
  - ["<BS>", "-"]
  - ["<Del>", "-"]
