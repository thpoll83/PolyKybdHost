match: [vlc]
output: vlc_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: vlc.png
program_icon_mode: alpha
program_icon_anchor: right
