# Microsoft Visio shortcut overlays for PolyKybd (Windows; there is no Visio
# for macOS).
#
# Icons: Fluent UI System Icons (MIT), Material Symbols (Apache-2.0) via `ms:`.
# Shortcuts: Microsoft's "Keyboard shortcuts for Visio", plus the standard
# Office file and edit commands drawn by the shared concept renderer. See
# SOURCES.md, which also lists what was left out.
#
# Regenerate:
#   python polyhost/res/overlay_sources/visio/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/visio/bindings.yaml --preview /tmp/visio_preview
app: visio
match: [visio]
output: visio_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: visio.png          # generic drawn mark (fetch_icons._draw_visio_logo)
program_icon_mode: alpha
program_icon_anchor: bottom-right
program_icon_region: [46, 40]
program_icon_margin: 0

bindings:
  # --- standard Office commands (shared concepts) ---
  - { key: N, mods: [CTRL], label: New,   source: "concept (shared Fluent)" }
  - { key: O, mods: [CTRL], label: Open,  source: "concept (shared Fluent)" }
  - { key: S, mods: [CTRL], label: Save,  source: "concept (shared Fluent)" }
  - { key: P, mods: [CTRL], label: Print, source: "concept (shared Fluent)" }
  - { key: Z, mods: [CTRL], label: Undo,  source: "concept (shared Fluent)" }
  - { key: Y, mods: [CTRL], label: Redo,  source: "concept (shared Fluent)" }
  - { key: X, mods: [CTRL], label: Cut,   source: "concept (shared Fluent)" }
  - { key: C, mods: [CTRL], label: Copy,  source: "concept (shared Fluent)" }
  - { key: V, mods: [CTRL], label: Paste, source: "concept (shared Fluent)" }
  - { key: F, mods: [CTRL], label: Find,  source: "concept (shared Fluent)" }
  - { key: A, mods: [CTRL], label: "Select all", source: "concept (shared Fluent)" }

  # --- tools: Ctrl ---
  - { key: "1", mods: [CTRL], icon: pointer.png,   label: "Pointer tool" }
  - { key: "2", mods: [CTRL], icon: texttool.png,  label: "Text tool" }
  - { key: "3", mods: [CTRL], icon: connector.png, label: "Connector tool" }
  - { key: "4", mods: [CTRL], icon: pencil.png,    label: "Pencil tool" }
  - { key: "5", mods: [CTRL], icon: freeform.png,  label: "Freeform tool" }
  - { key: "6", mods: [CTRL], icon: line.png,      label: "Line tool" }
  - { key: "7", mods: [CTRL], icon: arc.png,       label: "Arc tool" }
  - { key: "8", mods: [CTRL], icon: rectangle.png, label: "Rectangle tool" }
  - { key: "9", mods: [CTRL], icon: ellipse.png,   label: "Ellipse tool" }

  # --- arrange and text: Ctrl ---
  - { key: G, mods: [CTRL], icon: group.png,     label: Group }
  - { key: L, mods: [CTRL], icon: rotleft.png,   label: "Rotate left" }
  - { key: R, mods: [CTRL], icon: rotright.png,  label: "Rotate right" }
  - { key: H, mods: [CTRL], icon: fliph.png,     label: "Flip horizontal" }
  - { key: J, mods: [CTRL], icon: flipv.png,     label: "Flip vertical" }
  - { key: B, mods: [CTRL], icon: bold.png,      label: Bold }
  - { key: I, mods: [CTRL], icon: italic.png,    label: Italic }
  - { key: U, mods: [CTRL], icon: underline.png, label: Underline }
  - { key: EQUAL, mods: [CTRL], icon: subscript.png, label: Subscript }
  - { key: TAB,   mods: [CTRL], icon: nextdrawing.png,  label: "Next drawing" }
  - { key: PGDN,  mods: [CTRL], icon: nextpage.png,     label: "Next page" }
  - { key: PGUP,  mods: [CTRL], icon: prevpage.png,     label: "Previous page" }
  - { key: ENTER, mods: [CTRL], icon: insertmaster.png, label: "Insert master" }

  # --- Ctrl+Shift ---
  - { key: "1", mods: [CTRL, SHIFT], icon: connpoint.png,     label: "Connection point tool" }
  - { key: "2", mods: [CTRL, SHIFT], icon: crop.png,          label: "Crop tool" }
  - { key: "4", mods: [CTRL, SHIFT], icon: textblock.png,     label: "Text block tool" }
  - { key: P, mods: [CTRL, SHIFT], icon: formatpainter.png, label: "Format Painter" }
  - { key: U, mods: [CTRL, SHIFT], icon: ungroup.png,      label: Ungroup }
  - { key: F, mods: [CTRL, SHIFT], icon: front.png,        label: "Bring to front" }
  - { key: B, mods: [CTRL, SHIFT], icon: back.png,         label: "Send to back" }
  - { key: D, mods: [CTRL, SHIFT], icon: dblunderline.png, label: "Double underline" }
  - { key: A, mods: [CTRL, SHIFT], icon: allcaps.png,      label: "All caps" }
  - { key: K, mods: [CTRL, SHIFT], icon: smallcaps.png,    label: "Small caps" }
  - { key: EQUAL, mods: [CTRL, SHIFT], icon: superscript.png, label: Superscript }
  - { key: DOT,   mods: [CTRL, SHIFT], icon: fontinc.png,  label: "Font +" }
  - { key: COMMA, mods: [CTRL, SHIFT], icon: fontdec.png,  label: "Font -" }
  - { key: L, mods: [CTRL, SHIFT], icon: left.png,    label: "Align text left" }
  - { key: C, mods: [CTRL, SHIFT], icon: center.png,  label: "Center text" }
  - { key: R, mods: [CTRL, SHIFT], icon: right.png,   label: "Align text right" }
  - { key: J, mods: [CTRL, SHIFT], icon: justify.png, label: Justify }
  - { key: T, mods: [CTRL, SHIFT], icon: vtop.png,    label: "Text top" }
  - { key: M, mods: [CTRL, SHIFT], icon: vmiddle.png, label: "Text middle" }
  - { key: V, mods: [CTRL, SHIFT], icon: vbottom.png, label: "Text bottom" }
  - { key: W, mods: [CTRL, SHIFT], icon: fitwindow.png,   label: "Fit to window" }
  - { key: F7, mods: [CTRL, SHIFT], icon: tilehoriz.png,  label: "Tile horizontally" }
  - { key: TAB, mods: [CTRL, SHIFT], icon: prevdrawing.png, label: "Previous drawing" }

  # --- Ctrl+Alt, Alt, Alt+Shift ---
  - { key: P,  mods: [CTRL, ALT],  icon: reorderpages.png, label: "Reorder pages" }
  - { key: F9, mods: [ALT],        icon: snapglue.png,     label: "Snap & Glue" }
  - { key: F6, mods: [ALT],        icon: zoomin.png,       label: "Zoom in" }
  - { key: F6, mods: [ALT, SHIFT], icon: zoomout.png,      label: "Zoom out" }
  - { key: F7, mods: [ALT],        icon: cascade.png,      label: Cascade }

  # --- plain and Shift ---
  - { key: F2,  mods: [],      icon: edittext.png,    label: "Edit text" }
  - { key: F3,  mods: [],      icon: formatshape.png, label: "Format Shape" }
  - { key: F5,  mods: [],      icon: fullscreen.png,  label: "Full screen" }
  - { key: F8,  mods: [],      icon: alignshapes.png, label: "Align shapes" }
  - { key: F11, mods: [],      icon: textdialog.png,  label: "Text dialog" }
  - { key: F4,  mods: [SHIFT], icon: pagesetup.png,   label: "Page dialog" }
  - { key: F7,  mods: [SHIFT], icon: tilevert.png,    label: "Tile vertically" }
