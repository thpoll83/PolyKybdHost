# Microsoft OneNote shortcut overlays for PolyKybd (Windows and macOS).
#
# ONE spec, TWO artwork sets: Windows/Linux (`output`) and macOS (`<output>_mac`),
# written the way word/bindings.yaml is:
#   CMDCTRL          Ctrl on Windows, Cmd on macOS -- only where the Mac app's
#                    chord really is the Cmd version of the Windows one.
#   GUI / CTRL       literal Cmd / Control, for Mac-only chords.
#   only: / except:  OneNote for Mac is a remap, not a Ctrl->Cmd swap.
#
# ⚠️ ONENOTE.EXE also hosts the new Sticky Notes. The mapping keys this set on
# the process name and sends a "Sticky Notes" title to stickynotes_template.
#
# Icons: Fluent UI System Icons (MIT), Material Symbols (Apache-2.0) via `ms:`.
# Shortcuts: Microsoft's "Keyboard shortcuts in OneNote". See SOURCES.md, which
# also lists the chords left out and why.
#
# Regenerate:
#   python polyhost/res/overlay_sources/onenote/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/onenote/bindings.yaml --preview /tmp/onenote_preview
app: onenote
match: [onenote]
output: onenote_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: luma
threshold: 150

program_icon: onenote.png        # generic drawn mark (fetch_icons._draw_onenote_logo)
program_icon_mode: alpha
program_icon_anchor: bottom-right
program_icon_region: [46, 40]
program_icon_margin: 0

bindings:
  # --- both platforms: Ctrl on Windows, Cmd on macOS ---
  - { key: N, mods: [CMDCTRL], icon: newpage.png,   label: "New page" }
  - { key: O, mods: [CMDCTRL], icon: open.png,      label: "Open notebook" }
  - { key: S, mods: [CMDCTRL], icon: sync.png,      label: "Sync notebook" }
  - { key: F, mods: [CMDCTRL], icon: find.png,      label: "Find on page" }
  - { key: Z, mods: [CMDCTRL], icon: undo.png,      label: Undo }
  - { key: Y, mods: [CMDCTRL], icon: redo.png,      label: Redo }
  - { key: X, mods: [CMDCTRL], icon: cut.png,       label: Cut }
  - { key: C, mods: [CMDCTRL], icon: copy.png,      label: Copy }
  - { key: V, mods: [CMDCTRL], icon: paste.png,     label: Paste }
  - { key: A, mods: [CMDCTRL], icon: selectall.png, label: "Select all" }
  - { key: B, mods: [CMDCTRL], icon: bold.png,      label: Bold }
  - { key: I, mods: [CMDCTRL], icon: italic.png,    label: Italic }
  - { key: U, mods: [CMDCTRL], icon: underline.png, label: Underline }
  - { key: "/", mods: [CMDCTRL], icon: numbering.png, label: "Numbered list" }

