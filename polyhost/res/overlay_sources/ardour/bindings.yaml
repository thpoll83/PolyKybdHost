# Ardour shortcut overlays for PolyKybd (Windows, macOS, Linux). See SOURCES.md.
#
# Shortcuts: Ardour's own default bindings, `gtk2_ardour/ardour.keys.in` at
# Ardour/ardour@35f6a410 ("the reference for any bindings or cheatsheets"),
# which `tools/fmt-bindings` turns into the shipped key bindings. It writes
# modifiers as roles, which `fmt-bindings` maps per system:
#   PRIMARY    Ctrl on Windows/Linux, Cmd on macOS   -> CMDCTRL
#   SECONDARY  Alt on Windows/Linux, Ctrl on macOS   -> ALT except: [macos]
#                                                       + CTRL only: [macos]
# PRIMARY+SECONDARY is written out per system: Ctrl+Alt off macOS, Cmd+Ctrl on it.
#   TERTIARY   Shift                                 -> SHIFT
# The comment after each binding names the Ardour action.
#
# Left out: the MIDI note-editing keys (they act only on selected notes), the
# Recorder page keys, the numeric keypad, F1..F12 (visual states), mouse
# bindings and Esc (the program mark). SOURCES.md lists every omission.
#
# Regenerate:
#   python polyhost/res/overlay_sources/ardour/fetch_icons.py
#   python scripts/generate_app_overlays.py \
#       polyhost/res/overlay_sources/ardour/bindings.yaml --preview /tmp/ardour_preview
app: ardour
match: [ardour, ardour7, ardour8, ardour9, org.ardour.ardour]
output: ardour_template
icon_dir: icons
fit: contain
anchor: bottom-right
region: [36, 32]
margin: 0
mode: auto     # one rule per icon file: see HOUSE_LUMA_THRESHOLD in scripts/generate_app_overlays.py
threshold: 150

# Program mark: Ardour's own icon (GPL-2.0-or-later), see SOURCES.md.
program_icon: ardour.png
program_icon_mode: alpha
program_icon_anchor: right
program_icon_region: [37, 32]
program_icon_margin: 0

