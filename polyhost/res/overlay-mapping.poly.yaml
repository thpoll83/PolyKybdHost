# Terminals route the mode report of a vim or emacs running in them
# (handler/browser_url.py: TERMINAL_APPS, HOSTED_REPORTERS): the Vim plugin
# (vim-plugin/) sends vim://<mode>, the Emacs package (emacs-package/)
# emacs://<major-mode>. `&editor_urls` is the one list of those routes, used by
# every terminal entry and by GUI Vim and GUI Emacs. A matched editor mode or
# program (the routes below) LAYERS over the terminal's own set: the terminal
# reads its own shortcuts first, so they still work and stay on the keycaps,
# dimmed (`Underlay`), as a browser's do under a website. Without a report or a
# title route (a plain shell) the terminal shows its own set. The terminals with
# no set of their own dim their harvested shortcuts the same way
# (`OverlayHandler.template_is_hosted`, `PolyCore._send_generic_overlays`).
windowsterminal,wt:
  overlay: [windowsterminal_template.mods.png, windowsterminal_template.combo.mods.png]
  urls-contains: &editor_urls
    "vim://normal": { overlay: vim_normal_template.mods.png }
    "vim://visual": { overlay: vim_visual_template.mods.png }
    "vim://select": { overlay: vim_select_template.mods.png }
    "vim://insert": { overlay: vim_insert_template.mods.png }
    "vim://replace": { overlay: vim_replace_template.mods.png }
    "vim://cmdline": { overlay: vim_cmdline_template.mods.png }
    "vim://terminal": { overlay: vim_terminal_template.mods.png }
    # GNU Emacs (sources: overlay_sources/emacs/; emacs-package/ sends
    # emacs://<major-mode>[/<evil-state>]). First hit wins, so the specific
    # modes come before `emacs://`. org-mode lists the global set FIRST and its
    # own after it (a later file takes priority per key); Dired's set is
    # complete on its own.
    "emacs://org-mode":
      overlay: [emacs_template.mods.png, emacs_template.combo.mods.png, emacs_template.extra.mods.png, emacs_org_template.mods.png, emacs_org_template.combo.mods.png]
    "emacs://dired-mode":
      overlay: [emacs_dired_template.mods.png, emacs_dired_template.combo.mods.png]
    "emacs://":
      overlay: [emacs_template.mods.png, emacs_template.combo.mods.png, emacs_template.extra.mods.png]
  # GNU nano (sources: overlay_sources/nano/) sets no window title and has no
  # plugin, so it is seen only when the shell or the terminal puts the running
  # command into the title (overlay_sources/nano/SOURCES.md has the formats and
  # the shell snippets). The word `nano` (or iTerm2's `(nano)`) only selects the
  # route; the `title` regex then requires nano at the COMMAND position: at the
  # start (and not followed by " — ", Terminal.app's directory separator, or
  # " : ", Konsole's), after " - " (cmd.exe), " — " (Terminal.app), " : "
  # (Konsole), "(" (iTerm2), "] " (fish over SSH) or "> " (Nushell, which
  # writes "~/dir> nano", or "> ^nano" for an explicit external command),
  # optionally after `sudo`.
  # So `vim nano`, `man nano` and a prompt in ~/nano-docs do not load it. A
  # mode report (urls-contains above) takes priority: with a URL known the
  # matcher skips titles-contains (tests/handler/nano_routing_test.py).
  titles-contains: &editor_titles
    nano: &nano_title
