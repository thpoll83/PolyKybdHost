  # KeyMod.CtrlCmd, so the artwork moves from Ctrl to Cmd. Generated from the
  # SAME bindings file via the CMDCTRL token -- the two sets cannot drift.
  # `title` is repeated on purpose: a matched os: branch REPLACES the outer
  # entry, so a constraint left outside it is dropped.
  os:
    macos:
      overlay: [vscode_mac_template.mods.png, vscode_mac_template.combo.mods.png,
                vscode_mac_template.extra.mods.png]
      # ⚠️ NO `title:` here, deliberately -- a macOS window title does not carry
      # the application name. VS Code titles a window `Welcome — PolyKybdHost`
      # where Windows and Linux give `... - Visual Studio Code`, so the outer
      # regex matched nothing on a Mac and the entry never fired (field,
      # 2026-09-21). Nothing is lost by dropping it: the app name `code` is
      # already unambiguous, and the constraint exists for the platforms whose
      # titles can be checked.
    # Linux differs from the default set by exactly ONE cell: Show Output, which
    # Linux moves to the two-stroke chord Ctrl+K Ctrl+H. Scoped out there rather
    # than dropped outright, which would also have cost the correct Windows and
    # macOS cells. Same bindings file, so the three sets cannot drift.
    linux:
      overlay: [vscode_linux_template.mods.png, vscode_linux_template.combo.mods.png]
      title: .* Visual Studio Code
