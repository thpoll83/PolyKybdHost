      title: &claude_title '^(?:[✳◐◑] |claude(?:$|\s(?![—:-]\s)))|(?:\s[-—:]\s|\(|\]\s|>\s\^?)(?:[✳◐◑] |claude(?:$|\s|\)))'
      overlay: claude_code_cli_template.mods.png
      os:
        macos:
          title: *claude_title
          overlay: claude_code_cli_template_mac.mods.png
        linux:
          title: *claude_title
          overlay: claude_code_cli_template_linux.mods.png
    "◐": *claude_cli
    "◑": *claude_cli
    claude: *claude_cli
    "(claude)": *claude_cli
    "(claude": *claude_cli
    "^claude": *claude_cli
