# Windows Calculator, SCIENTIFIC mode (see overlay_sources/calc/bindings.yaml for
# why it is one mode and not both).
#
# ⚠️ Keyed on the window TITLE because on Windows 11 the packaged apps all run
# inside `ApplicationFrameHost.exe`, so the app name the tracker reports is the
# HOST rather than the app. `title:` is a regex on the entry itself, not a
# sub-map: an entry with only a title sub-map and no overlay of its own is
# refused outright by `find_matching_entry` (`has_overlay` gates it), and a
# top-level fallback overlay here would land on Clock, Photos and Settings too.
#
# ⚠️ `calc` is deliberately NOT in this list. It is what LibreOffice Calc reports
# on some Linux desktops — `app_icons.yaml` already keys `calc, localc` to the
# LibreOffice mark — so claiming it here would put a Windows Calculator overlay
# on a spreadsheet.
#
# ⚠️ The title is ENGLISH. A localized Windows names the window "Rechner",
# "Calculadora", … and this entry will not fire there; the app-name entry below
# still will when Calculator runs unhosted.
# ⚠️ `ApplicationFrameHost.exe` is NOT an app -- it is the Win11 host process for
# packaged apps, so the executable name says nothing about what is on screen and
# the TITLE is the only thing that does. Every hosted app therefore needs its own
# title branch here, and its own `icon:` (the program mark cannot be resolved from
# a host process name -- `si:applicationframehost` will never exist). Add a
# hosted app by adding a branch, not by adding an app_icons.yaml entry.
# ⚠️ The PARENT must carry an overlay of its own, or none of its title branches
# are reachable: `find_matching_entry` returns None immediately for an entry with
# neither `overlay:` nor `remote:`, before it looks at any sub-map. So Calculator
# is the parent (it was here first) and every other hosted app is a
# `titles-startswith` branch, which is checked BEFORE the parent's own `title:`
# regex. A hosted app this file does not name falls through unmatched, which is
# what should happen -- the parent's `^Calculator` gate is what stops Weather or
# Clock being handed calculator keycaps.
applicationframehost:
  title: "^Calculator"
  icon: mdi:calculator
  overlay: [calc_template.mods.png, calc_template.combo.mods.png]
  titles-startswith:
    Sound:
      title: "^Sound Recorder"
      icon: mdi:microphone
      overlay: soundrecorder_template.mods.png
    # Windows 11 renamed Voice Recorder to Sound Recorder; it is the same app and
    # the same shortcut set (both of the references the overlay is built from are
    # Voice Recorder pages), so a Windows 10 box gets the same keycaps. Two
    # branches rather than one loosened regex: the branch key is matched against
    # the title's FIRST WORD, so `^(Sound|Voice) Recorder` under `Sound:` would
    # never be reached for a title starting "Voice".
    Voice:
      title: "^Voice Recorder"
      icon: mdi:microphone
      overlay: soundrecorder_template.mods.png
    # Minecraft: Bedrock Edition as a UWP app (the Microsoft Store builds before
    # the move to a plain Win32 `Minecraft.Windows.exe`), titled "Minecraft".
    # No `icon:`: the template bakes its own ESC mark, which takes priority over
    # a named one. Not checked on an install.
    Minecraft:
      title: "^Minecraft( Preview)?$"
      overlay: [minecraft_bedrock_template.mods.png, minecraft_bedrock_template.combo.mods.png]
calculatorapp:
  overlay: [calc_template.mods.png, calc_template.combo.mods.png]
# All three LibreOffice modules are ONE process, and the app-name lookup is an
# exact dict hit — so they cannot be three separate entries. They are told apart
# by window title instead: LibreOffice titles end in the module name, e.g.
# "Untitled 1 — LibreOffice Writer".
#
# `titles-endswith` (not `titles-contains`) on purpose — twice over. It matches
# the title's LAST word, so a Writer document merely *named* "Calc notes" can't
# pull the Calc overlay. And `titles-contains` would not fire at all here:
# handler/common.py only word-splits the title when the entry also declares
# titles-startswith/endswith, so a contains-only entry silently falls through to
# the default overlay.
#
# The top-level overlay is the fallback — Start Center, Draw, Base, Math.
soffice,soffice.bin,libreoffice,startcenter:
  overlay: [libreoffice_writer_template.mods.png, libreoffice_writer_template.combo.mods.png]
  titles-endswith:
    Writer:
      overlay: [libreoffice_writer_template.mods.png, libreoffice_writer_template.combo.mods.png]
    Calc:
      overlay: [libreoffice_calc_template.mods.png, libreoffice_calc_template.combo.mods.png]
    Impress:
      overlay: [libreoffice_impress_template.mods.png, libreoffice_impress_template.combo.mods.png,
                libreoffice_impress_template.extra.mods.png]
  # macOS: the same title routing onto the Cmd sets. A matched `os:` branch
  # replaces the entry, so the title sub-map is repeated inside it.
  os:
    macos:
      overlay: [libreoffice_writer_template_mac.mods.png, libreoffice_writer_template_mac.combo.mods.png, libreoffice_writer_template_mac.extra.mods.png]
      titles-endswith:
        Writer:
          overlay: [libreoffice_writer_template_mac.mods.png, libreoffice_writer_template_mac.combo.mods.png, libreoffice_writer_template_mac.extra.mods.png]
        Calc:
          overlay: [libreoffice_calc_template_mac.mods.png, libreoffice_calc_template_mac.combo.mods.png, libreoffice_calc_template_mac.extra.mods.png]
        Impress:
          overlay: [libreoffice_impress_template_mac.mods.png, libreoffice_impress_template_mac.combo.mods.png, libreoffice_impress_template_mac.extra.mods.png, libreoffice_impress_template_mac.gui.mods.png]

# WPS Office (sources: overlay_sources/wps/). In the multi-component window
# mode each editor is its own program: wps.exe Writer, et.exe Spreadsheets,
# wpp.exe Presentation. On Linux /usr/bin/wps, et and wpp start
# office6/wps, et and wpp, so the names are the same. The all-in-one window
# mode (one window, a tab per document) has no title that names the editor, so
# a tab there gets the set of the program that owns the window. WPS Office for
# Mac is one app for all three editors and has no set here.
# In the all-in-one window mode every WPS document is a tab of the `wps` process,
# so the Writer default would show over a spreadsheet or a presentation too.
# `titles-match` routes on the file extension in the title. The title format is
# not documented and not checked on an install; an unsaved document ("Book1")
# shows no extension and gets the Writer set.
wps:
  overlay: [wps_writer_template.mods.png, wps_writer_template.combo.mods.png]
  titles-match:
    '(?i)\.(xlsx|xlsm|xlsb|xls|xltx|xlt|et|ett|csv)\b':
      overlay: [wps_sheets_template.mods.png, wps_sheets_template.combo.mods.png]
    '(?i)\.(pptx|pptm|ppt|ppsx|pps|potx|pot|dps|dpt)\b':
      overlay: [wps_presentation_template.mods.png, wps_presentation_template.combo.mods.png]
et:
  overlay: [wps_sheets_template.mods.png, wps_sheets_template.combo.mods.png]
wpp:
  overlay: [wps_presentation_template.mods.png, wps_presentation_template.combo.mods.png]

# ONLYOFFICE Desktop Editors (sources: overlay_sources/onlyoffice/). One process
# hosts the Document, Spreadsheet and Presentation editors as tabs:
# DesktopEditors.exe on Windows, /opt/onlyoffice/desktopeditors/DesktopEditors
# on Linux (WM_CLASS class "ONLYOFFICE", Flatpak id org.onlyoffice.desktopeditors),
# and the app "ONLYOFFICE" on macOS. On Windows and Linux the window title is
# the active tab's file name ("Book1.xlsx", "*Report.docx"), so `titles-match`
# routes on its extension. Any other title (the start page, a .docx, a PDF)
# gets the Document set. On macOS the tabbed main window is always titled
# "ONLYOFFICE"; only a detached editor window shows the file name, so the main
# window gets the Document set there. Not checked on an install.
desktopeditors,onlyoffice,onlyoffice-desktopeditors,org.onlyoffice.desktopeditors:
  overlay: [onlyoffice_document_template.mods.png, onlyoffice_document_template.combo.mods.png]
  titles-match:
    '(?i)\.(xlsx|xlsm|xlsb|xls|xltx|xltm|xlt|ods|ots|fods|csv|et|ett|numbers)(?=(\s+\([^()]*\))?$)':
      overlay: [onlyoffice_spreadsheet_template.mods.png, onlyoffice_spreadsheet_template.combo.mods.png]
    '(?i)\.(pptx|pptm|ppt|ppsx|ppsm|pps|potx|potm|pot|odp|otp|fodp|dps|dpt|key)(?=(\s+\([^()]*\))?$)':
      overlay: [onlyoffice_presentation_template.mods.png, onlyoffice_presentation_template.combo.mods.png]
  # A matched `os:` branch replaces the entry, so the title sub-map is repeated.
  os:
    macos:
      overlay: [onlyoffice_document_template_mac.mods.png, onlyoffice_document_template_mac.combo.mods.png, onlyoffice_document_template_mac.extra.mods.png]
      titles-match:
        '(?i)\.(xlsx|xlsm|xlsb|xls|xltx|xltm|xlt|ods|ots|fods|csv|et|ett|numbers)(?=(\s+\([^()]*\))?$)':
          overlay: [onlyoffice_spreadsheet_template_mac.mods.png, onlyoffice_spreadsheet_template_mac.combo.mods.png, onlyoffice_spreadsheet_template_mac.extra.mods.png]
        '(?i)\.(pptx|pptm|ppt|ppsx|ppsm|pps|potx|potm|pot|odp|otp|fodp|dps|dpt|key)(?=(\s+\([^()]*\))?$)':
          overlay: [onlyoffice_presentation_template_mac.mods.png, onlyoffice_presentation_template_mac.combo.mods.png, onlyoffice_presentation_template_mac.extra.mods.png]

