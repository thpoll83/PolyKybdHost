  # Zellij 0.43.1 and later: "<session>" or "<session> | <pane title>", with a
  # session name that Zellij generated ("<adjective>-<noun>" from two fixed
  # lists; the regex is printed by overlay_sources/zellij/gen_session_regex.py).
  # A session started with a name of its own (`zellij -s work`) is not
  # recognised by its title. tests/handler/zellij_routing_test.py.
  # The key is longer than the 1024 characters YAML allows for a plain key,
  # so it is written as an explicit key ("? ").
  # Title programs matched by a regex over the whole title: Zellij's generated
  # session names and ranger's own "ranger:<path>".
  titles-match: &multiplexer_titles
    ? '^(?:adamant|adept|adventurous|arcadian|auspicious|awesome|blossoming|brave|charming|chatty|circular|considerate|cubic|curious|delighted|didactic|diligent|effulgent|erudite|excellent|exquisite|fabulous|fascinating|friendly|glowing|gracious|gregarious|hopeful|implacable|inventive|joyous|judicious|jumping|kind|likable|loyal|lucky|marvellous|mellifluous|nautical|oblong|outstanding|polished|polite|profound|quadratic|quiet|rectangular|remarkable|rusty|sensible|sincere|sparkling|splendid|stellar|tenacious|tremendous|triangular|undulating|unflappable|unique|verdant|vitreous|wise|zippy)-(?:aardvark|accordion|apple|apricot|bee|brachiosaur|cactus|capsicum|clarinet|cowbell|crab|cuckoo|cymbal|diplodocus|donkey|drum|duck|echidna|elephant|foxglove|galaxy|glockenspiel|goose|hill|horse|iguanadon|iguanodon|jellyfish|kangaroo|lake|lemon|lemur|magpie|megalodon|mountain|mouse|muskrat|newt|oboe|ocelot|orange|panda|peach|pepper|petunia|pheasant|piano|pigeon|platypus|quasar|rhinoceros|river|rustacean|salamander|sitar|stegosaurus|tambourine|tiger|tomato|triceratops|ukulele|viola|weasel|xylophone|yak|zebra)(?:$| \| )'
    : overlay: *zellij_overlay
    # ranger's own title, "ranger:<path>" (with `set update_title true`), is
    # one word, so no `titles-contains` key can name it. macOS and Linux only,
    # as its route in &editor_titles; on Windows nothing matches.
    '(?:^|\s[-—:]\s|\(|\]\s)ranger:\S':
      os:
        macos:
