# Which overlay set the keyboard loads for the focused window.
#
# FULL KEY REFERENCE: polyhost/res/overlay-mapping.md
#   app names (exact, lowercased, .exe stripped on Windows) · overlay · remote ·
#   title / titles-startswith / titles-endswith / titles-contains ·
#   url / urls-contains · os  — plus the matching order and the gotchas.
#
# ⚠️ The SPACED names are macOS's, and they are not decoration: macOS reports
# an app's DISPLAY name ("Google Chrome"), where Windows reports the
# executable (chrome.exe -> chrome) and Linux the .desktop id
# (google-chrome). The lookup is an exact match on the lowercased name, so
# a hyphenated key can never match a Mac and Chrome silently fell through to
# "No match" there (field, 2026-09-21). Any multi-word app added here needs
# its spaced form too.
chrome,google chrome,google-chrome,chromium,brave,brave browser,brave-browser,msedge,microsoft edge,microsoft-edge,vivaldi,opera,arc:
  overlay: [chrome_template.mods.png, chrome_template.combo.mods.png]
  # urls-contains matches on the focused tab's URL (needs the browser extension
  # or, on macOS, the AppleScript fallback — see settings `browser_url_detection`
  # and browser-extension/README.md). A URL identifies a web-app far more
  # reliably than its window title, so these win over titles-contains below.
  # The titles-contains block below is the fallback for when NO url is known
  # (no extension installed, or its report is stale). It is skipped whenever a
  # URL *is* known -- a URL that matched none of the needles above already says
  # this is not Miro/Outlook/Jira, so a stray word in the title must not
  # overrule it (searching google.com for "jira" would otherwise load the Jira
  # overlay). Keys match whole title words; a key of several words (Claude
  # Code) matches them adjacent, and is tried before a shorter key (Claude).
  urls-contains: &web_urls
    miro.com:
      overlay: miro_template.mods.png
    # Photopea (sources: overlay_sources/webapps/photopea.yaml). The editor
    # is the bare host; the gate keeps /learn, /blog and /tutorials off the set.
    photopea.com:
      url: '^https?://(www\.)?photopea\.com/([?#].*)?$'
      overlay: [photopea_template.mods.png, photopea_template.combo.mods.png]
    outlook.office.com:
      overlay: [web_outlook_template.mods.png, web_outlook_template.combo.mods.png]
    outlook.live.com:
      overlay: [web_outlook_template.mods.png, web_outlook_template.combo.mods.png]
    github.com:
      overlay: [github_template.mods.png, github_template.combo.mods.png]
    drive.google.com:
      overlay: [googledrive_template.mods.png, googledrive_template.combo.mods.png]
    gitlab.com:
      overlay: [gitlab_template.mods.png, gitlab_template.combo.mods.png]
    # Google Keep (sources: overlay_sources/webapps/googlekeep.yaml).
    keep.google.com:
      url: '^https?://keep\.google\.com([/?#]|$)'
      overlay: [googlekeep_template.mods.png, googlekeep_template.combo.mods.png]
    # Jupyter (sources: overlay_sources/jupyter/): a local server or a
    # JupyterHub. The url gate needs /lab, /notebooks or /tree right after the
    # host (or /user/<name>), so github.com/<o>/<r>/tree/... does not match;
    # github.com and gitlab.com are above anyway (first hit wins).
    /lab:
      url: '^https?://[^/]+(/user/[^/]+)?/(lab|notebooks|tree)(/|\?|#|$)'
      overlay: [jupyter_template.mods.png, jupyter_template.combo.mods.png]
    /notebooks/:
      url: '^https?://[^/]+(/user/[^/]+)?/(lab|notebooks|tree)(/|\?|#|$)'
      overlay: [jupyter_template.mods.png, jupyter_template.combo.mods.png]
    /tree:
      url: '^https?://[^/]+(/user/[^/]+)?/(lab|notebooks|tree)(/|\?|#|$)'
      overlay: [jupyter_template.mods.png, jupyter_template.combo.mods.png]
    # Web tools (sources: overlay_sources/webapps/). Each is gated to its own
    # host, so a search URL that names the site does not match.
    diagrams.net:
      url: '^https?://([^/?#]+\.)?(diagrams\.net|draw\.io)/'
      overlay: [drawio_template.mods.png, drawio_template.combo.mods.png, drawio_template.extra.mods.png]
    draw.io:
      url: '^https?://([^/?#]+\.)?(diagrams\.net|draw\.io)/'
      overlay: [drawio_template.mods.png, drawio_template.combo.mods.png, drawio_template.extra.mods.png]
    excalidraw.com:
      url: '^https?://([^/?#]+\.)?excalidraw\.com/'
      overlay: [excalidraw_template.mods.png, excalidraw_template.combo.mods.png]
    # Canva (sources: overlay_sources/webapps/canva.yaml): the design editor
    # only (/design/<id>/edit). The home page and the help pages are not gated
    # in, because the bare tool letters would draw over their search fields.
    # There is no title entry: the help pages also have "Canva" in their
    # titles, so a title cannot tell the editor apart.
    canva.com:
      url: '^https?://([^/?#]+\.)?canva\.com/design/[^/?#]+/edit(?:[/?#]|$)'
      overlay: [canva_template.mods.png, canva_template.combo.mods.png]
    # Figma (sources: overlay_sources/figma/figma_web.yaml): the design editor
    # and prototypes only. FigJam (/board/) and Figma Slides (/slides/) have
    # other tool keys and keep the browser set.
    figma.com:
      url: '^https?://([^/?#]+\.)?figma\.com/(design|file|proto)/'
      overlay: [figma_web_template.mods.png, figma_web_template.combo.mods.png]
    linear.app:
      url: '^https?://([^/?#]+\.)?linear\.app/'
      overlay: [linear_template.mods.png, linear_template.combo.mods.png]
    overleaf.com/project:
      url: '^https?://([^/?#]+\.)?overleaf\.com/project'
      overlay: [overleaf_template.mods.png, overleaf_template.combo.mods.png]
    # A Confluence whiteboard (<site>.atlassian.net/wiki/spaces/<KEY>/whiteboard/<id>)
    # has its own tool keys, so it MUST stay above atlassian.net/wiki. The url
    # gate keeps the bare "/whiteboard/" needle from catching other sites.
    /whiteboard/:
      url: '^https?://[^/]+\.atlassian\.net/wiki/.*/whiteboard/'
      overlay: [confluence_whiteboard_template.mods.png, confluence_whiteboard_template.combo.mods.png]
    # MUST stay above the bare atlassian.net (Jira) entry: matching is
    # first-hit over this map in order, and a Confluence URL
    # (<site>.atlassian.net/wiki/...) also contains "atlassian.net".
    atlassian.net/wiki:
      overlay: [confluence_template.mods.png, confluence_template.combo.mods.png,
                confluence_template.extra.mods.png]
    atlassian.net:
      overlay: jira_template.mods.png
    bitbucket.org:
      overlay: [bitbucket_pr_template.mods.png, bitbucket_pr_template.combo.mods.png]
    docs.google.com/document:
      overlay: [googledocs_template.mods.png, googledocs_template.combo.mods.png,
                googledocs_template.extra.mods.png]
    docs.google.com/spreadsheets:
      overlay: [googlesheets_template.mods.png, googlesheets_template.combo.mods.png, googlesheets_template.extra.mods.png]
    docs.google.com/presentation:
      overlay: [googleslides_template.mods.png, googleslides_template.combo.mods.png, googleslides_template.extra.mods.png]
    mail.google.com:
      overlay: [gmail_template.mods.png, gmail_template.combo.mods.png]
    calendar.google.com:
      overlay: [googlecalendar_template.mods.png, googlecalendar_template.combo.mods.png]
    teams.microsoft.com:
      overlay: &teams_web [teams_web_template.mods.png, teams_web_template.combo.mods.png, teams_web_template.extra.mods.png]
    teams.cloud.microsoft:
      overlay: *teams_web
    teams.live.com:
      overlay: *teams_web
    notion.so:
      overlay: [notion_template.mods.png, notion_template.combo.mods.png]
    # Trello (sources: overlay_sources/trello/): boards (/b/), cards (/c/) and
    # the member pages (/u/), where the card keys act. The home page keeps the
    # browser set.
    trello.com:
      url: '^https?://([^/?#]+\.)?trello\.com/[bcu]/'
      overlay: trello_template.mods.png
    # Google Meet (sources: overlay_sources/meet/) runs only in a browser.
    meet.google.com:
      overlay: [meet_template.mods.png, meet_template.combo.mods.png]
    # YouTube (sources: overlay_sources/youtube/): the player keys, on the pages
    # with a player (/watch, /live/, /embed/). The home page and search results
    # keep the browser set. The gate also leaves out music.youtube.com and
    # studio.youtube.com, which have other keys.
    youtube.com:
      url: '^https?://(www\.|m\.)?youtube\.com/(watch[?/]|live/|embed/)'
      overlay: youtube_template.mods.png
    # Claude Code on the web. MUST stay above claude.ai, which it contains.
    claude.ai/code:
      overlay: [claude_code_web_template.mods.png, claude_code_web_template.combo.mods.png]
    claude.ai:
      overlay: [claude_web_template.mods.png, claude_web_template.combo.mods.png]
    # Codex in a tab has no overlay of its own. MUST stay above chatgpt.com,
    # which it contains: without it the ChatGPT set would load for Codex.
    chatgpt.com/codex:
      overlay: [chrome_template.mods.png, chrome_template.combo.mods.png]
    chatgpt.com:
      overlay: [chatgpt_template.mods.png, chatgpt_template.combo.mods.png]
    # Copilot has no title fallback below: "Copilot" is also in Microsoft 365
    # Copilot's and GitHub Copilot's page titles, and they have other keymaps.
    copilot.microsoft.com:
      url: '^https?://copilot\.microsoft\.com/'
      overlay: [copilot_web_template.mods.png, copilot_web_template.combo.mods.png]
    # Office on the web (sources: overlay_sources/officeweb/). A SharePoint share
    # link names the app in its path (/:w:/ Word ...); a document URL names the
    # file type (file=X.docx, ithint=file%2cdocx). Both are gated to Microsoft's
    # hosts, so a .docx link on any other site does not match, and the file-type
    # gates need the extension at the end of a query value, so a site path
    # named "docx-guides" does not decide the app. No title fallback: the tab
    # title is only the file name.
    /:w:/:
      url: '^https?://[^/?#@]+\.sharepoint\.com/'
      overlay: [word_web_template.mods.png, word_web_template.combo.mods.png]
    /:x:/:
      url: '^https?://[^/?#@]+\.sharepoint\.com/'
      overlay: [excel_web_template.mods.png, excel_web_template.combo.mods.png, excel_web_template.extra.mods.png]
    /:p:/:
      url: '^https?://[^/?#@]+\.sharepoint\.com/'
      overlay: [powerpoint_web_template.mods.png, powerpoint_web_template.combo.mods.png]
    /:o:/:
      url: '^https?://[^/?#@]+\.sharepoint\.com/'
      overlay: [onenote_web_template.mods.png, onenote_web_template.combo.mods.png]
    docx:
      url: '(?i)^https?://([^/?#@]+\.)?(sharepoint\.com|onedrive\.live\.com|officeapps\.live\.com|cloud\.microsoft|onenote\.com)/.*(\.|%2c)docx([?&#]|$)'
      overlay: [word_web_template.mods.png, word_web_template.combo.mods.png]
    xlsx:
      url: '(?i)^https?://([^/?#@]+\.)?(sharepoint\.com|onedrive\.live\.com|officeapps\.live\.com|cloud\.microsoft|onenote\.com)/.*(\.|%2c)xlsx([?&#]|$)'
      overlay: [excel_web_template.mods.png, excel_web_template.combo.mods.png, excel_web_template.extra.mods.png]
    pptx:
      url: '(?i)^https?://([^/?#@]+\.)?(sharepoint\.com|onedrive\.live\.com|officeapps\.live\.com|cloud\.microsoft|onenote\.com)/.*(\.|%2c)pptx([?&#]|$)'
      overlay: [powerpoint_web_template.mods.png, powerpoint_web_template.combo.mods.png]
    # A notebook: personal OneDrive marks it `ithint=onenote`; onenote.com is
    # OneNote's own host. SharePoint notebooks take /:o:/ above. Not every page
    # whose path merely contains "onenote" (a site named onenote-team).
    onenote:
      url: '(?i)^https?://(([^/?#@]+\.)?(sharepoint\.com|onedrive\.live\.com|officeapps\.live\.com|cloud\.microsoft)/.*[?&]ithint=onenote|(www\.)?onenote\.com/)'
      overlay: [onenote_web_template.mods.png, onenote_web_template.combo.mods.png]
    # Todoist (sources: overlay_sources/todoist/): the web app is under
    # app.todoist.com/app; the marketing and help pages keep the browser keys.
    todoist.com/app:
      url: '^https?://(app\.)?todoist\.com/app'
      overlay: [todoist_web_template.mods.png, todoist_web_template.combo.mods.png]
    # Monkeytype (sources: overlay_sources/typingtests/monkeytype.yaml). The
    # typing test is the bare host; the gate keeps /settings, /account and the
    # other pages, where Tab does not restart a test, on the browser set.
    # Firefox replaces this entry with its own set (see the firefox entry).
    monkeytype.com:
      url: '^https?://(www\.)?monkeytype\.com/([?#].*)?$'
      overlay: [monkeytype_template.mods.png, monkeytype_template.combo.mods.png]
    # keybr (sources: overlay_sources/typingtests/keybr.yaml). The practice
    # page is "/" or "/<locale>" (/de, /pt-br); the gate keeps /typing-test,
    # /multiplayer and the other pages, which bind other keys, on the browser set.
    keybr.com:
      url: '^https?://(www\.)?keybr\.com/([a-z]{2}(-[a-z]{2})?/?)?([?#].*)?$'
      overlay: keybr_template.mods.png
  # Only sites whose page titles carry a stable brand name are listed. Codex
  # cannot be told apart from ChatGPT by title, so without a URL it gets the
  # ChatGPT set. Never key on "Google" alone: every Chrome window title on
  # Windows and Linux ends in "Google Chrome".
  titles-contains: &web_titles
    Miro:
      overlay: miro_template.mods.png
    # The editor tab is titled "Photopea | Online Photo Editor"; the learn
    # pages are "Photopea - <topic>" and stay off the set.
    Photopea:
      title: '^Photopea \| Online Photo Editor'
      overlay: [photopea_template.mods.png, photopea_template.combo.mods.png]
    Google Meet:
      overlay: [meet_template.mods.png, meet_template.combo.mods.png]
    # A meeting tab is titled "Meet - <code>"; the gate requires the code
    # (abc-defg-hij), so the plain word "Meet" in other titles does not match.
    Meet:
      title: '^Meet - [a-z]{3}-[a-z]{4}-[a-z]{3}\b'
      overlay: [meet_template.mods.png, meet_template.combo.mods.png]
    Outlook:
      overlay: [web_outlook_template.mods.png, web_outlook_template.combo.mods.png]
    Jira:
      overlay: jira_template.mods.png
    Confluence:
      overlay: [confluence_template.mods.png, confluence_template.combo.mods.png,
                confluence_template.extra.mods.png]
    GitHub:
      overlay: [github_template.mods.png, github_template.combo.mods.png]
    # A Drive tab is titled "<folder> - Google Drive"; the gate requires that
    # ending, so a document that names Drive in its title keeps its own set.
    Google Drive:
      title: ' - Google Drive( [-—] [^-—]+)?$'
      overlay: [googledrive_template.mods.png, googledrive_template.combo.mods.png]
    # Logged in, GitHub drops "· GitHub" from its titles ("Workflow runs ·
    # owner/repo"), so the brand word above misses most pages. Every one ends in
    # "· owner/repo" (or "@sha"), which the gate requires. GitLab spaces its
    # path ("group / project") and ends in "· GitLab", so it fails the gate and
    # the scan moves on to its own key.
    "·":
      title: '· [\w.-]+/[\w.-]+(@[0-9a-f]{7,40})?( · GitHub)?( [-—] [^·]+)?$'
      overlay: [github_template.mods.png, github_template.combo.mods.png]
    GitLab:
      overlay: [gitlab_template.mods.png, gitlab_template.combo.mods.png]
    # A Keep tab title starts with "Google Keep"; the gate keeps pages that only
    # name Keep, such as its help pages ("... - Google Keep Help"), off the set.
    Google Keep:
      title: '^Google Keep( [-—] |$)'
      overlay: [googlekeep_template.mods.png, googlekeep_template.combo.mods.png]
    # A Jupyter tab title ends in " - JupyterLab" or " - Jupyter Notebook"
    # (the browser may append its own name); the gate keeps a page that only
    # mentions Jupyter, such as its documentation, off the set.
    JupyterLab:
      title: ' - JupyterLab( [-—] [^-—]+)?$'
      overlay: [jupyter_template.mods.png, jupyter_template.combo.mods.png]
    Jupyter Notebook:
      title: ' - Jupyter Notebook( [-—] [^-—]+)?$'
      overlay: [jupyter_template.mods.png, jupyter_template.combo.mods.png]
    draw.io:
      overlay: [drawio_template.mods.png, drawio_template.combo.mods.png, drawio_template.extra.mods.png]
    # A Figma file tab is titled "<file> – Figma" (a FigJam board ends in
    # "– FigJam"); the gate keeps pages that only name Figma off the set.
    Figma:
      title: ' – Figma( [-—] [^–—-]+)?$'
      overlay: [figma_web_template.mods.png, figma_web_template.combo.mods.png]
    Excalidraw:
      overlay: [excalidraw_template.mods.png, excalidraw_template.combo.mods.png]
    Online LaTeX Editor:
      overlay: [overleaf_template.mods.png, overleaf_template.combo.mods.png]
    Bitbucket:
      overlay: [bitbucket_pr_template.mods.png, bitbucket_pr_template.combo.mods.png]
    Microsoft Teams:
      overlay: *teams_web
    Notion:
      overlay: [notion_template.mods.png, notion_template.combo.mods.png]
    # A board tab is titled "<board> | Trello"; the gate requires that ending.
    Trello:
      title: ' \| Trello( [-—] [^|—-]+)?$'
      overlay: trello_template.mods.png
    Google Docs:
      overlay: [googledocs_template.mods.png, googledocs_template.combo.mods.png,
                googledocs_template.extra.mods.png]
    Google Sheets:
      overlay: [googlesheets_template.mods.png, googlesheets_template.combo.mods.png, googlesheets_template.extra.mods.png]
    Google Slides:
      overlay: [googleslides_template.mods.png, googleslides_template.combo.mods.png, googleslides_template.extra.mods.png]
    Gmail:
      overlay: [gmail_template.mods.png, gmail_template.combo.mods.png]
    Google Calendar:
      overlay: [googlecalendar_template.mods.png, googlecalendar_template.combo.mods.png]
    # A video tab is titled "<video> - YouTube"; the gate requires that ending.
    YouTube:
      title: ' - YouTube( [-—] [^-—]+)?$'
      overlay: youtube_template.mods.png
    Claude Code:
      overlay: [claude_code_web_template.mods.png, claude_code_web_template.combo.mods.png]
    Claude:
      overlay: [claude_web_template.mods.png, claude_web_template.combo.mods.png]
    ChatGPT:
      overlay: [chatgpt_template.mods.png, chatgpt_template.combo.mods.png]
    # Todoist (sources: overlay_sources/todoist/): the app's tabs are titled
    # "<view> - Todoist" or "Todoist"; the gate keeps pages that only mention
    # Todoist ("Use keyboard shortcuts in Todoist") off the set.
    Todoist:
      title: '(^|[-–—:|] ?)Todoist( [-—] [^-—]+)?$'
      overlay: [todoist_web_template.mods.png, todoist_web_template.combo.mods.png]
    # Monkeytype: the test page is titled "Monkeytype | A minimalistic,
    # customizable typing test"; the other pages are "<Page> | Monkeytype" and
    # stay off the set. keybr's titles ("Practice") name no brand, so keybr
    # has no title entry.
    Monkeytype:
      title: '^Monkeytype \| A minimalistic'
      overlay: [monkeytype_template.mods.png, monkeytype_template.combo.mods.png]
  # macOS: Chromium's Mac keymap (Cmd, plus remaps such as History Cmd+Y and
  # Back Cmd+[). ⚠️ The `os:` branch is matched BEFORE urls-contains and
  # REPLACES the entry, so the whole URL and title routing is repeated inside it,
  # in the same order (first hit wins).
  os:
    macos:
      overlay: [chrome_template_mac.mods.png, chrome_template_mac.combo.mods.png, chrome_template_mac.extra.mods.png]
      urls-contains: &web_urls_mac
        miro.com:
          overlay: [miro_template_mac.mods.png, miro_template_mac.combo.mods.png]
        photopea.com:
          url: '^https?://(www\.)?photopea\.com/([?#].*)?$'
          overlay: [photopea_template_mac.mods.png, photopea_template_mac.combo.mods.png, photopea_template_mac.extra.mods.png]
        outlook.office.com:
          overlay: [web_outlook_template_mac.mods.png, web_outlook_template_mac.combo.mods.png]
        outlook.live.com:
          overlay: [web_outlook_template_mac.mods.png, web_outlook_template_mac.combo.mods.png]
        github.com:
          overlay: [github_template_mac.mods.png, github_template_mac.combo.mods.png, github_template_mac.extra.mods.png]
        drive.google.com:
          overlay: [googledrive_template_mac.mods.png, googledrive_template_mac.combo.mods.png, googledrive_template_mac.extra.mods.png]
        gitlab.com:
          overlay: [gitlab_template_mac.mods.png, gitlab_template_mac.combo.mods.png, gitlab_template_mac.extra.mods.png]
        keep.google.com:
          url: '^https?://keep\.google\.com([/?#]|$)'
          overlay: [googlekeep_template_mac.mods.png, googlekeep_template_mac.combo.mods.png, googlekeep_template_mac.extra.mods.png]
        # Jupyter (sources: overlay_sources/jupyter/): a local server or a
        # JupyterHub. The url gate needs /lab, /notebooks or /tree right after the
        # host (or /user/<name>), so github.com/<o>/<r>/tree/... does not match;
        # github.com and gitlab.com are above anyway (first hit wins).
        /lab:
          url: '^https?://[^/]+(/user/[^/]+)?/(lab|notebooks|tree)(/|\?|#|$)'
          overlay: [jupyter_template_mac.mods.png, jupyter_template_mac.combo.mods.png, jupyter_template_mac.extra.mods.png]
        /notebooks/:
          url: '^https?://[^/]+(/user/[^/]+)?/(lab|notebooks|tree)(/|\?|#|$)'
          overlay: [jupyter_template_mac.mods.png, jupyter_template_mac.combo.mods.png, jupyter_template_mac.extra.mods.png]
        /tree:
          url: '^https?://[^/]+(/user/[^/]+)?/(lab|notebooks|tree)(/|\?|#|$)'
          overlay: [jupyter_template_mac.mods.png, jupyter_template_mac.combo.mods.png, jupyter_template_mac.extra.mods.png]
        # Web tools (sources: overlay_sources/webapps/). Each is gated to its own
        # host, so a search URL that names the site does not match.
        diagrams.net:
          url: '^https?://([^/?#]+\.)?(diagrams\.net|draw\.io)/'
          overlay: [drawio_template_mac.mods.png, drawio_template_mac.combo.mods.png, drawio_template_mac.extra.mods.png, drawio_template_mac.gui.mods.png]
        draw.io:
          url: '^https?://([^/?#]+\.)?(diagrams\.net|draw\.io)/'
          overlay: [drawio_template_mac.mods.png, drawio_template_mac.combo.mods.png, drawio_template_mac.extra.mods.png, drawio_template_mac.gui.mods.png]
