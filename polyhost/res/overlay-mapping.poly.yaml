      # regex matched nothing on a Mac and the entry never fired (field,
      # 2026-09-21). Nothing is lost by dropping it: the app name `code` is
      # already unambiguous, and the constraint exists for the platforms whose
      # titles can be checked.
    # Linux differs from the default set by exactly ONE cell: Show Output, which
