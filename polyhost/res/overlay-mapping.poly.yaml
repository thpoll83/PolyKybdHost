# Which overlay set the keyboard loads for the focused window.
#
# FULL KEY REFERENCE: polyhost/res/overlay-mapping.md
#   app names (exact, lowercased, .exe stripped on Windows) · overlay · remote ·
#   title / titles-startswith / titles-endswith / titles-contains ·
#   url / urls-contains · os  — plus the matching order and the gotchas.
#
# ⚠️ The SPACED names are macOS's, and they are not decoration: macOS reports
# an app's DISPLAY name ("Google Chrome"), where Windows reports the
# executable (chrome.exe -> chrome) and Linux the .desktop id
# (google-chrome). The lookup is an exact match on the lowercased name, so
# a hyphenated key can never match a Mac and Chrome silently fell through to
# "No match" there (field, 2026-09-21). Any multi-word app added here needs
# its spaced form too.
chrome,google chrome,google-chrome,chromium,brave,brave browser,brave-browser,msedge,microsoft edge,microsoft-edge,vivaldi,opera,arc:
  overlay: [chrome_template.mods.png, chrome_template.combo.mods.png]
  # urls-contains matches on the focused tab's URL (needs the browser extension
  # or, on macOS, the AppleScript fallback — see settings `browser_url_detection`
  # and browser-extension/README.md). A URL identifies a web-app far more
  # reliably than its window title, so these win over titles-contains below.
  # The titles-contains block below is the fallback for when NO url is known
  # (no extension installed, or its report is stale). It is skipped whenever a
  # URL *is* known -- a URL that matched none of the needles above already says
  # this is not Miro/Outlook/Jira, so a stray word in the title must not
  # overrule it (searching google.com for "jira" would otherwise load the Jira
  # overlay). Keys match whole title words; a key of several words (Claude
  # Code) matches them adjacent, and is tried before a shorter key (Claude).
  urls-contains: &web_urls
    miro.com:
      overlay: miro_template.mods.png
    outlook.office.com:
      overlay: [web_outlook_template.mods.png, web_outlook_template.combo.mods.png]
    outlook.live.com:
      overlay: [web_outlook_template.mods.png, web_outlook_template.combo.mods.png]
    github.com:
      overlay: [github_template.mods.png, github_template.combo.mods.png]
    gitlab.com:
      overlay: [gitlab_template.mods.png, gitlab_template.combo.mods.png]
    # A Confluence whiteboard (<site>.atlassian.net/wiki/spaces/<KEY>/whiteboard/<id>)
    # has its own tool keys, so it MUST stay above atlassian.net/wiki. The url
    # gate keeps the bare "/whiteboard/" needle from catching other sites.
    /whiteboard/:
      url: '^https?://[^/]+\.atlassian\.net/wiki/.*/whiteboard/'
      overlay: [confluence_whiteboard_template.mods.png, confluence_whiteboard_template.combo.mods.png]
    # MUST stay above the bare atlassian.net (Jira) entry: matching is
    # first-hit over this map in order, and a Confluence URL
    # (<site>.atlassian.net/wiki/...) also contains "atlassian.net".
    atlassian.net/wiki:
      overlay: [confluence_template.mods.png, confluence_template.combo.mods.png,
                confluence_template.extra.mods.png]
    atlassian.net:
      overlay: jira_template.mods.png
    bitbucket.org:
      overlay: [bitbucket_pr_template.mods.png, bitbucket_pr_template.combo.mods.png]
    docs.google.com/document:
      overlay: [googledocs_template.mods.png, googledocs_template.combo.mods.png,
                googledocs_template.extra.mods.png]
    teams.microsoft.com:
      overlay: &teams_web [teams_web_template.mods.png, teams_web_template.combo.mods.png, teams_web_template.extra.mods.png]
    teams.cloud.microsoft:
      overlay: *teams_web
    teams.live.com:
      overlay: *teams_web
    notion.so:
      overlay: [notion_template.mods.png, notion_template.combo.mods.png]
    # Google Meet (sources: overlay_sources/meet/) runs only in a browser.
    meet.google.com:
      overlay: [meet_template.mods.png, meet_template.combo.mods.png]
    # Claude Code on the web. MUST stay above claude.ai, which it contains.
    claude.ai/code:
      overlay: [claude_code_web_template.mods.png, claude_code_web_template.combo.mods.png]
    claude.ai:
      overlay: [claude_web_template.mods.png, claude_web_template.combo.mods.png]
    # Codex in a tab has no overlay of its own. MUST stay above chatgpt.com,
    # which it contains: without it the ChatGPT set would load for Codex.
    chatgpt.com/codex:
      overlay: [chrome_template.mods.png, chrome_template.combo.mods.png]
    chatgpt.com:
      overlay: [chatgpt_template.mods.png, chatgpt_template.combo.mods.png]
    # Copilot has no title fallback below: "Copilot" is also in Microsoft 365
    # Copilot's and GitHub Copilot's page titles, and they have other keymaps.
    copilot.microsoft.com:
      url: '^https?://copilot\.microsoft\.com/'
      overlay: [copilot_web_template.mods.png, copilot_web_template.combo.mods.png]
    # Office on the web (sources: overlay_sources/officeweb/). A SharePoint share
    # link names the app in its path (/:w:/ Word ...); a document URL names the
    # file type (file=X.docx, ithint=file%2cdocx). Both are gated to Microsoft's
    # hosts, so a .docx link on any other site does not match, and the file-type
    # gates need the extension at the end of a query value, so a site path
    # named "docx-guides" does not decide the app. No title fallback: the tab
    # title is only the file name.
    /:w:/:
      url: '^https?://[^/?#@]+\.sharepoint\.com/'
      overlay: [word_web_template.mods.png, word_web_template.combo.mods.png]
    /:x:/:
      url: '^https?://[^/?#@]+\.sharepoint\.com/'
      overlay: [excel_web_template.mods.png, excel_web_template.combo.mods.png, excel_web_template.extra.mods.png]
    /:p:/:
      url: '^https?://[^/?#@]+\.sharepoint\.com/'
      overlay: [powerpoint_web_template.mods.png, powerpoint_web_template.combo.mods.png]
    /:o:/:
      url: '^https?://[^/?#@]+\.sharepoint\.com/'
      overlay: [onenote_web_template.mods.png, onenote_web_template.combo.mods.png]
    docx:
      url: '(?i)^https?://([^/?#@]+\.)?(sharepoint\.com|onedrive\.live\.com|officeapps\.live\.com|cloud\.microsoft|onenote\.com)/.*(\.|%2c)docx([?&#]|$)'
      overlay: [word_web_template.mods.png, word_web_template.combo.mods.png]
    xlsx:
      url: '(?i)^https?://([^/?#@]+\.)?(sharepoint\.com|onedrive\.live\.com|officeapps\.live\.com|cloud\.microsoft|onenote\.com)/.*(\.|%2c)xlsx([?&#]|$)'
      overlay: [excel_web_template.mods.png, excel_web_template.combo.mods.png, excel_web_template.extra.mods.png]
    pptx:
      url: '(?i)^https?://([^/?#@]+\.)?(sharepoint\.com|onedrive\.live\.com|officeapps\.live\.com|cloud\.microsoft|onenote\.com)/.*(\.|%2c)pptx([?&#]|$)'
      overlay: [powerpoint_web_template.mods.png, powerpoint_web_template.combo.mods.png]
    # A notebook: personal OneDrive marks it `ithint=onenote`; onenote.com is
    # OneNote's own host. SharePoint notebooks take /:o:/ above. Not every page
    # whose path merely contains "onenote" (a site named onenote-team).
    onenote:
      url: '(?i)^https?://(([^/?#@]+\.)?(sharepoint\.com|onedrive\.live\.com|officeapps\.live\.com|cloud\.microsoft)/.*[?&]ithint=onenote|(www\.)?onenote\.com/)'
      overlay: [onenote_web_template.mods.png, onenote_web_template.combo.mods.png]
  # Only sites whose page titles carry a stable brand name are listed. Codex
  # cannot be told apart from ChatGPT by title, so without a URL it gets the
  # ChatGPT set. Never key on "Google" alone: every Chrome window title on
  # Windows and Linux ends in "Google Chrome".
  titles-contains: &web_titles
    Miro:
      overlay: miro_template.mods.png
    Google Meet:
      overlay: [meet_template.mods.png, meet_template.combo.mods.png]
    # A meeting tab is titled "Meet - <code>"; the gate requires the code
    # (abc-defg-hij), so the plain word "Meet" in other titles does not match.
    Meet:
      title: '^Meet - [a-z]{3}-[a-z]{4}-[a-z]{3}\b'
      overlay: [meet_template.mods.png, meet_template.combo.mods.png]
    Outlook:
      overlay: [web_outlook_template.mods.png, web_outlook_template.combo.mods.png]
    Jira:
      overlay: jira_template.mods.png
    Confluence:
      overlay: [confluence_template.mods.png, confluence_template.combo.mods.png,
                confluence_template.extra.mods.png]
    GitHub:
      overlay: [github_template.mods.png, github_template.combo.mods.png]
    # Logged in, GitHub drops "· GitHub" from its titles ("Workflow runs ·
    # owner/repo"), so the brand word above misses most pages. Every one ends in
    # "· owner/repo" (or "@sha"), which the gate requires. GitLab spaces its
    # path ("group / project") and ends in "· GitLab", so it fails the gate and
    # the scan moves on to its own key.
    "·":
      title: '· [\w.-]+/[\w.-]+(@[0-9a-f]{7,40})?( · GitHub)?( [-—] [^·]+)?$'
      overlay: [github_template.mods.png, github_template.combo.mods.png]
    GitLab:
      overlay: [gitlab_template.mods.png, gitlab_template.combo.mods.png]
    Bitbucket:
      overlay: [bitbucket_pr_template.mods.png, bitbucket_pr_template.combo.mods.png]
    Microsoft Teams:
      overlay: *teams_web
    Notion:
      overlay: [notion_template.mods.png, notion_template.combo.mods.png]
    Google Docs:
      overlay: [googledocs_template.mods.png, googledocs_template.combo.mods.png,
                googledocs_template.extra.mods.png]
    Claude Code:
      overlay: [claude_code_web_template.mods.png, claude_code_web_template.combo.mods.png]
    Claude:
      overlay: [claude_web_template.mods.png, claude_web_template.combo.mods.png]
    ChatGPT:
      overlay: [chatgpt_template.mods.png, chatgpt_template.combo.mods.png]
  # macOS: Chromium's Mac keymap (Cmd, plus remaps such as History Cmd+Y and
  # Back Cmd+[). ⚠️ The `os:` branch is matched BEFORE urls-contains and
  # REPLACES the entry, so the whole URL and title routing is repeated inside it,
  # in the same order (first hit wins).
  os:
    macos:
      overlay: [chrome_template_mac.mods.png, chrome_template_mac.combo.mods.png, chrome_template_mac.extra.mods.png]
      urls-contains: &web_urls_mac
        miro.com:
          overlay: [miro_template_mac.mods.png, miro_template_mac.combo.mods.png]
        outlook.office.com:
          overlay: [web_outlook_template_mac.mods.png, web_outlook_template_mac.combo.mods.png]
        outlook.live.com:
          overlay: [web_outlook_template_mac.mods.png, web_outlook_template_mac.combo.mods.png]
        github.com:
          overlay: [github_template_mac.mods.png, github_template_mac.combo.mods.png, github_template_mac.extra.mods.png]
        gitlab.com:
          overlay: [gitlab_template_mac.mods.png, gitlab_template_mac.combo.mods.png, gitlab_template_mac.extra.mods.png]
        /whiteboard/:
          url: '^https?://[^/]+\.atlassian\.net/wiki/.*/whiteboard/'
          overlay: [confluence_whiteboard_template_mac.mods.png, confluence_whiteboard_template_mac.combo.mods.png, confluence_whiteboard_template_mac.extra.mods.png]
        atlassian.net/wiki:
          overlay: [confluence_template_mac.mods.png, confluence_template_mac.combo.mods.png, confluence_template_mac.extra.mods.png, confluence_template_mac.gui.mods.png]
        atlassian.net:
          overlay: [jira_template_mac.mods.png, jira_template_mac.combo.mods.png]
        bitbucket.org:
          overlay: [bitbucket_pr_template_mac.mods.png, bitbucket_pr_template_mac.combo.mods.png, bitbucket_pr_template_mac.extra.mods.png]
        docs.google.com/document:
          overlay: [googledocs_template_mac.mods.png, googledocs_template_mac.combo.mods.png, googledocs_template_mac.extra.mods.png, googledocs_template_mac.gui.mods.png]
        teams.microsoft.com:
          overlay: &teams_web_mac [teams_web_template_mac.mods.png, teams_web_template_mac.combo.mods.png, teams_web_template_mac.extra.mods.png, teams_web_template_mac.gui.mods.png]
        teams.cloud.microsoft:
          overlay: *teams_web_mac
        teams.live.com:
          overlay: *teams_web_mac
        notion.so:
          overlay: [notion_template_mac.mods.png, notion_template_mac.combo.mods.png, notion_template_mac.extra.mods.png]
        meet.google.com:
          overlay: [meet_template_mac.mods.png, meet_template_mac.combo.mods.png, meet_template_mac.extra.mods.png]
        claude.ai/code:
          overlay: claude_code_web_template_mac.mods.png
        claude.ai:
          overlay: [claude_web_template_mac.mods.png, claude_web_template_mac.combo.mods.png, claude_web_template_mac.extra.mods.png]
        chatgpt.com/codex:
          overlay: [chrome_template_mac.mods.png, chrome_template_mac.combo.mods.png, chrome_template_mac.extra.mods.png]
        chatgpt.com:
          overlay: [chatgpt_template_mac.mods.png, chatgpt_template_mac.combo.mods.png, chatgpt_template_mac.extra.mods.png]
        copilot.microsoft.com:
          url: '^https?://copilot\.microsoft\.com/'
          overlay: [copilot_web_template.mods.png, copilot_web_template.combo.mods.png]
        # Office on the web: only PowerPoint documents its Mac chords; Word, Excel
        # and OneNote on the web keep the browser's keycaps on macOS.
        /:p:/:
          url: '^https?://[^/?#@]+\.sharepoint\.com/'
          overlay: [powerpoint_web_template_mac.mods.png, powerpoint_web_template_mac.combo.mods.png, powerpoint_web_template_mac.extra.mods.png, powerpoint_web_template_mac.gui.mods.png]
        pptx:
          url: '(?i)^https?://([^/?#@]+\.)?(sharepoint\.com|onedrive\.live\.com|officeapps\.live\.com|cloud\.microsoft|onenote\.com)/.*(\.|%2c)pptx([?&#]|$)'
          overlay: [powerpoint_web_template_mac.mods.png, powerpoint_web_template_mac.combo.mods.png, powerpoint_web_template_mac.extra.mods.png, powerpoint_web_template_mac.gui.mods.png]
      titles-contains: &web_titles_mac
        Miro:
          overlay: [miro_template_mac.mods.png, miro_template_mac.combo.mods.png]
        Google Meet:
          overlay: [meet_template_mac.mods.png, meet_template_mac.combo.mods.png, meet_template_mac.extra.mods.png]
        Meet:
          title: '^Meet - [a-z]{3}-[a-z]{4}-[a-z]{3}\b'
          overlay: [meet_template_mac.mods.png, meet_template_mac.combo.mods.png, meet_template_mac.extra.mods.png]
        Outlook:
          overlay: [web_outlook_template_mac.mods.png, web_outlook_template_mac.combo.mods.png]
        Jira:
          overlay: [jira_template_mac.mods.png, jira_template_mac.combo.mods.png]
        Confluence:
          overlay: [confluence_template_mac.mods.png, confluence_template_mac.combo.mods.png, confluence_template_mac.extra.mods.png, confluence_template_mac.gui.mods.png]
        GitHub:
          overlay: [github_template_mac.mods.png, github_template_mac.combo.mods.png, github_template_mac.extra.mods.png]
        "·":
          title: '· [\w.-]+/[\w.-]+(@[0-9a-f]{7,40})?( · GitHub)?( [-—] [^·]+)?$'
          overlay: [github_template_mac.mods.png, github_template_mac.combo.mods.png, github_template_mac.extra.mods.png]
        GitLab:
          overlay: [gitlab_template_mac.mods.png, gitlab_template_mac.combo.mods.png, gitlab_template_mac.extra.mods.png]
        Bitbucket:
          overlay: [bitbucket_pr_template_mac.mods.png, bitbucket_pr_template_mac.combo.mods.png, bitbucket_pr_template_mac.extra.mods.png]
        Microsoft Teams:
          overlay: *teams_web_mac
        Notion:
          overlay: [notion_template_mac.mods.png, notion_template_mac.combo.mods.png, notion_template_mac.extra.mods.png]
        Google Docs:
          overlay: [googledocs_template_mac.mods.png, googledocs_template_mac.combo.mods.png, googledocs_template_mac.extra.mods.png, googledocs_template_mac.gui.mods.png]
        Claude Code:
          overlay: claude_code_web_template_mac.mods.png
        Claude:
          overlay: [claude_web_template_mac.mods.png, claude_web_template_mac.combo.mods.png, claude_web_template_mac.extra.mods.png]
        ChatGPT:
          overlay: [chatgpt_template_mac.mods.png, chatgpt_template_mac.combo.mods.png, chatgpt_template_mac.extra.mods.png]
# Mozilla Firefox (sources: overlay_sources/firefox/). Firefox has its own
# keymap, so it has its own entry, but the web-app routing is the browser
# entry's above, shared by YAML alias (&web_urls ...): one list to maintain.
# A `<<:` merge keeps that map's ORDER (first hit wins) and replaces only
# chatgpt.com/codex, whose value names the browser's own set. The `os:` branches
# REPLACE the entry, so each repeats the routing, as the browser entry does.
# Names: firefox(.exe) on Windows (Developer Edition and Nightly too); WM_CLASS
# firefox / firefox-esr (Debian) / firefox-dev (Developer Edition remoting name)
# / firefox-nightly / firefox_firefox (Ubuntu snap) and the Flatpak app id
# org.mozilla.firefox on Linux; the display names on macOS.
firefox,firefox-esr,firefox-dev,firefox-nightly,firefox_firefox,org.mozilla.firefox,firefox developer edition,firefox nightly:
  overlay: [firefox_template.mods.png, firefox_template.combo.mods.png, firefox_template.extra.mods.png]
  urls-contains:
    <<: *web_urls
    chatgpt.com/codex:
      overlay: [firefox_template.mods.png, firefox_template.combo.mods.png, firefox_template.extra.mods.png]
  titles-contains: *web_titles
  os:
    macos:
      overlay: [firefox_template_mac.mods.png, firefox_template_mac.combo.mods.png, firefox_template_mac.extra.mods.png, firefox_template_mac.gui.mods.png]
      urls-contains:
        <<: *web_urls_mac
        chatgpt.com/codex:
          overlay: [firefox_template_mac.mods.png, firefox_template_mac.combo.mods.png, firefox_template_mac.extra.mods.png, firefox_template_mac.gui.mods.png]
      titles-contains: *web_titles_mac
    linux:
      overlay: [firefox_template_linux.mods.png, firefox_template_linux.combo.mods.png, firefox_template_linux.extra.mods.png]
      urls-contains:
        <<: *web_urls
        chatgpt.com/codex:
          overlay: [firefox_template_linux.mods.png, firefox_template_linux.combo.mods.png, firefox_template_linux.extra.mods.png]
      titles-contains: *web_titles
# AI assistant desktop apps (sources: overlay_sources/aichat/). The browser
# forms are under the browser entry above (claude.ai, chatgpt.com). The Claude
# desktop app shows its Chat and Code tabs in one window of one process, so one
# set serves both; it draws the Code tab's chords. `claude` is also the Claude
# Code CLI's process name, but a CLI session's focused window is the terminal,
# so the terminal's name is what arrives here.
claude:
  overlay: [claude_desktop_template.mods.png, claude_desktop_template.combo.mods.png]
  os:
    macos:
      overlay: [claude_desktop_template_mac.mods.png, claude_desktop_template_mac.combo.mods.png, claude_desktop_template_mac.extra.mods.png]
chatgpt:
  overlay: [chatgpt_template.mods.png, chatgpt_template.combo.mods.png]
  os:
    macos:
      overlay: [chatgpt_template_mac.mods.png, chatgpt_template_mac.combo.mods.png, chatgpt_template_mac.extra.mods.png]
# Microsoft Copilot (sources: overlay_sources/aichat/copilot.yaml). The app is
# copilot.microsoft.com in a Chromium window, so UI Automation finds no
# shortcuts; its four Alt chords come from the page's script. `mscopilot` on
# Windows, `copilot` on macOS (Option chords, same keys). No `os:` branch: one
# set serves both. The ESC mark comes from the app's own executable.
mscopilot,copilot:
  overlay: [copilot_template.mods.png, copilot_template.combo.mods.png]
# Microsoft 365 Copilot (sources: overlay_sources/aichat/m365copilot.yaml),
# `M365Copilot.exe` on Windows. Microsoft documents no in-app shortcut; the set
# has the keys tested by hand on 2026-10-22 (Ctrl+Shift+H/Q/Y/I, Copy, Paste,
# Select all, zoom). No macOS set: its keys were not tested there.
m365copilot:
  overlay: [m365copilot_template.mods.png, m365copilot_template.combo.mods.png]
codex,codex-desktop:
  overlay: [codex_template.mods.png, codex_template.combo.mods.png]
  os:
    macos:
      overlay: [codex_template_mac.mods.png, codex_template_mac.combo.mods.png, codex_template_mac.extra.mods.png]
nxplayer:
  remote: true
  # A session window is titled '<host> - NoMachine'. The connection chooser
  # is titled 'NoMachine' alone and is not a remote session.
  title: ' - NoMachine$'
# GIMP 2.10 is `gimp-2.10.exe` on Windows, which the host cuts at the first dot
# to `gimp-2`, and `gimp-2.10` on Linux. Neither was listed, so 2.10 loaded nothing.
gimp-2.0,gimp-2.8,gimp-2,gimp-2.10,gimp-3.0,gimp,gimp-3,org.gimp.GIMP:
  overlay: [gimp_template.mods.png, gimp_template.combo.mods.png]
  os:
    macos:
      overlay: [gimp_mac_template.mods.png, gimp_mac_template.combo.mods.png, gimp_mac_template.extra.mods.png]
# Zoom (sources: overlay_sources/zoom/). macOS reports Zoom's display name,
# `zoom.us`; Linux reports `zoom` (measured, 7.2.1). The main window is titled
# "Zoom Workplace" and gets the chat, phone and general keys; the meeting and
# webinar windows ("Zoom Meeting", "Zoom Webinar") get the meeting keys. The
# `title` gate keeps Zoom's other windows (settings, pop-out chat) out; a window
# whose title is unknown skips the gate and gets the meeting set.
zoom,zoom.us:
  overlay: [zoom_template.mods.png, zoom_template.combo.mods.png]
  title: '^Zoom (Meeting|Webinar|Workplace)'
  titles-startswith:
    Zoom Workplace: {overlay: [zoom_main_template.mods.png, zoom_main_template.combo.mods.png]}
  os:
    macos:
      overlay: [zoom_template_mac.mods.png, zoom_template_mac.combo.mods.png, zoom_template_mac.extra.mods.png, zoom_template_mac.gui.mods.png]
      title: '^Zoom (Meeting|Webinar|Workplace)'
      titles-startswith:
        Zoom Workplace: {overlay: [zoom_main_template_mac.mods.png, zoom_main_template_mac.combo.mods.png, zoom_main_template_mac.extra.mods.png]}
discord:
  overlay: [discord_template.mods.png, discord_template.combo.mods.png, discord_template.extra.mods.png]
  os:
    macos:
      overlay: [discord_template_mac.mods.png, discord_template_mac.combo.mods.png, discord_template_mac.extra.mods.png, discord_template_mac.gui.mods.png]
inkscape,org.inkscape.Inkscape:
  overlay: inkscape_template.mods.png
# Mathematica, renamed Wolfram in 14.1 (sources: overlay_sources/mathematica/).
# The notebook front end is `Mathematica.exe` / Mathematica.app up to 14.0 and
# `WolframNB.exe` / Wolfram.app / `WolframNB` on Linux since 14.1. Linux has its
# own set because Close is Ctrl+W there and Ctrl+F4 on Windows.
mathematica,wolframnb,wolfram:
  overlay: [mathematica_template.mods.png, mathematica_template.combo.mods.png]
  os:
    macos:
      overlay: [mathematica_template_mac.mods.png, mathematica_template_mac.combo.mods.png, mathematica_template_mac.extra.mods.png]
    linux:
      overlay: [mathematica_template_linux.mods.png, mathematica_template_linux.combo.mods.png]
# BEGIN generated by overlay_sources/kicad/gen_titles.py -- do not edit by hand
# KiCad (sources: overlay_sources/kicad/). Started from the project manager,
# every editor runs in the `kicad` process; started on its own, it is `pcbnew`,
# `eeschema` or `gerbview`, and `pcbnew` and `eeschema` each host several
# windows. So the windows are told apart by the title only: an editor's title
# ends in its name ("board — PCB Editor"), the 3D Viewer's starts with it. KiCad
# translates these names, so each one is listed in every language KiCad ships
# (window_titles.yaml). The `title` gate keeps the project manager and the other
# tools out, and fails when there is no window at all, so the macOS windowless
# path draws nothing rather than the PCB keys. The entry's own overlay is
# reached only by a window with an empty title (the gate is skipped then).
# Window names from KiCad 10.0.7, 44 languages.
kicad,pcbnew,eeschema,gerbview:
  overlay: [kicad_pcb_template.mods.png, kicad_pcb_template.combo.mods.png]
