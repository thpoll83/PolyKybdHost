# Application name -> Simple Icons slug, for the program icon drawn on ESC.
#
# Only consulted when the normalised executable name does NOT already equal the
# slug: "inkscape", "gimp-2.0", "krita", "figma" and about twenty others resolve
# on their own (see app_icons.normalise). This file is for the cases where the
# binary and the brand disagree.
#
# The key may be a comma-separated list, matched against the raw app name the
# window tracker reports and against its normalised form. A value of `null`
# means "never guess for this one" -- the way to suppress a guess that lands on
# the wrong brand, which is the one failure the resolver cannot detect itself.
#
# ⚠️ Every slug here was verified against simple-icons 15.22.0 (the pinned
# version -- v16 REMOVED brands, see app_icons.py). Do not add one from memory:
# a slug that does not exist costs a fetch and a curation entry on every switch
# to that app, and a slug that exists for a DIFFERENT brand draws a wrong logo.
#
# A value may name the OTHER catalog: `mdi:microsoft-word`. Simple Icons has no
# Microsoft and no Adobe at all (measured by substring over the whole
# collection), so the Office family, Visual Studio and Edge all come from
# Material Design Icons, which draws them as monochrome single-path glyphs and
# renders them cleanly at 40x40.
#
# ⚠️ ADOBE PRODUCTS SHARE THE COMPANY "A", because nothing more specific
# survives 1 bit. The obvious better answer -- the `logos:` collection's
# `adobe-photoshop`, `adobe-illustrator`, `adobe-premiere`, `adobe-indesign`,
# `adobe-lightroom`, `adobe-after-effects`, all CC0 -- was rendered and looked
# at: the product letters ("Ps", "Ai") are SEPARATE COLOURED PATHS rather than
# knockouts, so flattening to a silhouette gives six identical solid rounded
# squares of 1516 lit pixels. Six apps showing the same white block is worse
# than one shared "A" that at least says Adobe. Acrobat keeps its own mark.
#
# ⚠️ `chromium -> google-chrome` stays OUT on a different rule: it names a
# DIFFERENT PRODUCT (a different browser), where the Adobe "A" is the true
# company. `explorer -> microsoft-windows` was out for the same reason and is
# still out -- but Explorer now gets a plain FOLDER instead, see the generic
# section at the bottom.

chrome: googlechrome
vlc: vlcmediaplayer
notepad++: notepadplusplus
resolve: davinciresolve

# LibreOffice reports its module in the title, not the executable.
soffice, soffice.bin, startcenter: libreoffice

# JetBrains ships one binary per IDE, all with a 64-bit suffix the version
# stripper does not touch (it only removes a trailing version).
idea: intellijidea
jetbrains-pycharm, jetbrains-pycharm-ce, pycharm64: pycharm
webstorm64: webstorm
goland64: goland
rider64: rider
datagrip64: datagrip
phpstorm64: phpstorm
rubymine64: rubymine
studio64: androidstudio

obs, obs64: obsstudio
nvim: neovim
emacs: gnuemacs
codium: vscodium
thunderbird-bin: thunderbird

# --- Material Design Icons (Apache-2.0) ------------------------------------
# The brands Simple Icons refuses. Each verified present in mdi; each is a
# PRODUCT mark, never a company or a generic symbol.
winword: mdi:microsoft-word
excel: mdi:microsoft-excel
powerpnt: mdi:microsoft-powerpoint
msaccess: mdi:microsoft-access
outlook: mdi:microsoft-outlook
onenote: mdi:microsoft-onenote
teams, ms-teams: mdi:microsoft-teams
msedge, microsoft-edge: mdi:microsoft-edge
devenv: mdi:microsoft-visual-studio
code, code-oss: mdi:microsoft-visual-studio-code
skype: mdi:microsoft-skype
acrobat, acroread: mdi:adobe-acrobat

# Real brands mdi holds under a BARE name. Listed one by one rather than
# guessed, because a bare mdi name is usually a generic UI symbol -- see the
# note in app_icons.candidates().
powershell, pwsh: mdi:powershell

# LibreOffice reports its module rather than the suite on some desktops.
writer, lowriter: si:libreofficewriter
calc, localc: si:libreofficecalc
impress, loimpress: si:libreofficeimpress

# Adobe products, sharing the company mark -- see the note at the top.
photoshop, adobe photoshop: mdi:adobe
illustrator, adobe illustrator: mdi:adobe
afterfx, adobe after effects: mdi:adobe
premiere, adobe premiere pro: mdi:adobe
indesign, adobe indesign: mdi:adobe
lightroom, adobe lightroom: mdi:adobe
audition, adobe audition: mdi:adobe

# --- Generic marks for apps NO catalog carries a brand for ------------------
#
# ⚠️ THIS SECTION BREAKS THE "PRODUCT MARK, NEVER A GENERIC SYMBOL" RULE ABOVE,
# deliberately, and it is easy to delete if you disagree with the trade.
#
# The first field report of this feature was "so far nothing" (2026-09-10), and
# a third of the reason was here: Windows' own bundled apps have no brand mark
# in either catalog. Measured against both -- Notepad, Paint, Paint.NET,
# Windows Terminal, WordPad, Snipping Tool, Task Manager, Explorer, 7-Zip,
# PuTTY, WinSCP: ZERO hits, in Simple Icons or in mdi, under any spelling the
# resolver guesses. Microsoft does not license those logos and mdi does not
# draw them.
#
# So the choice is a symbol that says WHAT THE APP IS, or nothing at all. The
# repo already made that call once: the hand-made `explorer_template` draws a
# FOLDER on ESC, and its own bindings.yaml says so. A folder identifies
# Explorer, a palette identifies Paint, and `>_` identifies a terminal -- which
# is the whole job of the mark. What it must never do is name the wrong BRAND,
# which is why every entry here is a neutral object rather than another
# company's logo.
#
# Every one was rendered at the real 40x40 and looked at before being listed;
# a symbol that does not survive 1 bit is worse than no icon.
notepad: mdi:note-text
wordpad: mdi:text-box
mspaint: mdi:palette
paintdotnet: mdi:brush-variant
explorer: mdi:folder
windowsterminal, wt: mdi:console
cmd: mdi:console-line
snippingtool, snippingtool2: mdi:scissors-cutting
taskmgr: mdi:monitor-dashboard
regedit: mdi:cog-box
systemsettings: mdi:cog
photos: mdi:image-multiple
7zfm, 7zg: mdi:folder-zip
putty: mdi:console-network
winscp: mdi:folder-network

# ⚠️ NOT listed, because the entry could never fire: on Windows 11 Calculator,
# Clock and the other packaged apps all run inside `ApplicationFrameHost.exe`,
# so the app name the window tracker reports is the HOST, not the app. Their
# identity is in the window TITLE, which this file cannot key on. Adding
# `calculator: mdi:calculator` would look like coverage and resolve for nobody.
