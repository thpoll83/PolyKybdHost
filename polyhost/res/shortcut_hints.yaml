# Curated label -> keycap glyph hints for the shortcut-icon mapper.
#
# The lexicon in polyhost/services/shortcut_icons.py holds the general rules.
# This file holds the JUDGEMENTS: labels a real application uses that the rules
# either miss or get wrong. It is consulted FIRST, so an entry here always wins.
#
# It is the other half of a feedback loop. `shortcut_probe.py --unmatched
# <file>` logs every label that produced no icon, with a count and the apps it
# came from; `--review <file>` prints them by frequency with a stub to paste in
# here. Reviewing means giving a label an icon, or marking it `text` -- and
# `text` is a real answer, not a failure, which is why it removes the label from
# the queue instead of leaving it to resurface every run.
#
# Value forms:
#   <concept>   a concept name from LEXICON -- reuses that glyph
#   U+XXXX      a literal codepoint (it MUST resolve in the shipped fonts; the
#               test in tests/services/shortcut_icons_test.py checks every one)
#   text        deliberately no icon -- draw the label instead
#
# Keys are matched against the NORMALIZED label, so write them lower-case with
# no mnemonic marker and no trailing ellipsis: "save as", not "&Save As...".

hints:
  # --- text FOR NOW, because the glyph does not ship yet ---------------------
  # ⚠️ These are "not yet", NOT "never" -- an earlier note here said the fonts
  # carry no distinctive glyph for them, which was reached by guessing codepoints
  # rather than searching. Measured properly: across the 7242 codepoints the
  # shipped fonts cover there is indeed no bold, italic or paintbrush glyph --
  # but NotoSansMath, already in polyhost/res/fonts/noto-fonts.yaml, has both
  # letterforms, and rendered at keycap size all three read clearly:
  #
  #   bold B       U+1D5D5  MATHEMATICAL SANS-SERIF BOLD CAPITAL B   (256 px vs
  #                         200 for a plain B -- visibly heavier)
  #   italic I     U+1D610  MATHEMATICAL SANS-SERIF ITALIC CAPITAL I (serifed,
  #                         so it does not read as a plain stem)
  #   underlined U          U+0055 + U+0332 as a fontconvert -C composite, the
  #                         same mechanism the matra fonts use
  #
  # ⚠️ Derive a math-alphanumeric codepoint from its block's 'A', never by hand:
  # the sans-serif italic block starts at U+1D608 = capital A, so I is +8. Taking
  # U+1D608 for "italic I" renders an italic A, which a render caught and a name
  # written into a script did not.
  #
  # They stay `text` until the glyphs actually ship, because a hint naming a
  # missing glyph draws a BLANK keycap -- worse than the word, and the failure
  # the codepoint validation exists to prevent. Landing them means a fonts.yaml
  # entry, a symbol-bundle content_version bump and a reship, which needs the
  # pinned fontconvert build.
  bold: text
  italic: text
  underline: text
  # Superscript ² (U+00B2) ships; subscript ₂ (U+2082) is in no bundle, and would
  # need the U+2080..208E range added. Half a symmetric pair reads as a bug on the
  # keyboard rather than as a gap, so neither is mapped until both can be.
  superscript: text
  subscript: text
  # Genuinely absent: no brush, paint or roller glyph among the 7242 covered
  # codepoints, and none in the catalog sources either. This one needs bespoke art.
  format painter: text
  # The window system menu -- "System" names the menu, not an action.
  system: text

  # --- resolved by hand ----------------------------------------------------
  # (add entries here as `--review` surfaces them)
