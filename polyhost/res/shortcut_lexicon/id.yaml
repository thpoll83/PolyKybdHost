# Indonesian. Menu labels that mean each concept, as applications show them in
# Indonesian.
# Format and matching rules: polyhost/services/shortcut_icons.py,
# "Labels in other languages".
concepts:
  save: [simpan, simpan berkas, simpan file]
  save as: [simpan sebagai, simpan salinan, simpan semua]
  open: [buka, buka berkas, buka file, buka terbaru]
  new: [baru, berkas baru, file baru, dokumen baru]
  print: [cetak, pratinjau cetak]
  reload: [muat ulang, segarkan, pulihkan, perbarui]
  cut: [potong]
  copy: [salin, duplikat, duplikasi]
  paste: [tempel, tempel spesial, tempel khusus]
  undo: [urungkan, tak jadi, tidak jadi]
  redo: [ulangi, jadi lagi]
  delete: [hapus, hapus baris, bersihkan]
  select all: [pilih semua, pilih]
  find: [cari, temukan]
  find next: [cari berikutnya, temukan berikutnya, cari sebelumnya, temukan sebelumnya, cari selanjutnya]
  replace: [cari dan ganti, temukan dan ganti, ganti semua, timpa]
  go to: [pergi ke, ke baris, pergi ke baris]
  fullscreen: [layar penuh, maksimalkan]
  minimize: [minimalkan]
  hide: [sembunyikan, sembunyikan lainnya]
  window: [jendela baru]
  zoom in: [perbesar, perbesar tampilan]
  zoom out: [perkecil, perkecil tampilan]
  zoom reset: [ukuran sebenarnya, ukuran normal, reset zum]
  up: [ke atas, gulir ke atas, pindah ke atas]
  down: [ke bawah, gulir ke bawah, pindah ke bawah]
  left: [kembali, sebelumnya, mundur]
  right: [maju, berikutnya, selanjutnya]
  indent: [tambah inden, tambah indentasi, naikkan indentasi]
  outdent: [kurangi inden, kurangi indentasi, turunkan indentasi]
  settings: [pengaturan, preferensi, opsi, konfigurasi, properti]
  help: [bantuan, tentang, pintasan papan ketik, pintasan keyboard, pintasan papan tik, tombol pintas]
  close: [tutup, tutup tab, tutup jendela, tutup dokumen, batal]
  wrap text: [potong baris]
  quit: [keluar]
  bookmark: [markah, markah halaman, favorit]
  lock: [kunci, hanya baca]
  comment: [komentar, beri komentar, tambah komentar]
  change case: [ubah huruf besar kecil, ubah besar kecil huruf]
  paragraph: [paragraf]
  alignment: [perataan, ratakan]
  styles: [gaya, gaya sel]
  share: [bagikan, tautan, salin tautan]
  insert: [sisipkan, tambahkan, sisipkan baris, sisipkan kolom]
  bold: [tebal]
  italic: [miring]
  underline: [garis bawah]
  superscript: [superskrip]
  subscript: [subskrip]
  paint: [pewarna format]
