# Korean. Menu labels that mean each concept, as applications show them in Korean.
# Format and matching rules: polyhost/services/shortcut_icons.py,
# "Labels in other languages".
concepts:
  save: [저장, 저장하기]
  save as: [다른 이름으로 저장, 모두 저장, 사본 저장]
  open: [열기, 파일 열기, 최근 파일 열기]
  new: [새로 만들기, 새 파일, 새 문서]
  print: [인쇄, 인쇄 미리 보기]
  reload: [새로 고침, 새로고침, 다시 로드, 다시 불러오기]
  cut: [잘라내기]
  copy: [복사, 복제]
  paste: [붙여넣기, 선택하여 붙여넣기]
  undo: [실행 취소]
  redo: [다시 실행, 반복]
  delete: [삭제, 지우기, 줄 삭제]
  select all: [모두 선택, 전체 선택]
  find: [찾기, 검색]
  find next: [다음 찾기, 이전 찾기, 다시 찾기]
  replace: [바꾸기, 찾기 및 바꾸기, 찾아 바꾸기]
  go to: [줄로 이동, 행으로 이동, 줄 이동]
  fullscreen: [전체 화면, 전체 화면 모드, 최대화]
  minimize: [최소화]
  hide: [숨기기, 가리기, 기타 가리기]
  window: [새 창, 새 윈도우]
  zoom in: [확대]
  zoom out: [축소]
  zoom reset: [실제 크기, 원래 크기, 기본 크기, 확대/축소 초기화, 확대/축소 재설정]
  up: [위로 이동, 위로 스크롤]
  down: [아래로 이동, 아래로 스크롤]
  left: [뒤로, 뒤로 가기, 이전]
  right: [앞으로, 앞으로 가기, 다음]
  indent: [들여쓰기, 들여쓰기 늘리기]
  outdent: [내어쓰기, 들여쓰기 줄이기]
  settings: [설정, 환경설정, 환경 설정, 기본 설정, 옵션, 속성]
  help: [도움말, 키보드 단축키, 바로 가기 키]
  close: [닫기, 탭 닫기, 창 닫기, 취소]
  wrap text: [자동 줄 바꿈, 줄 바꿈, 텍스트 줄 바꿈]
  quit: [종료, 끝내기]
  bookmark: [북마크, 북마크 추가, 책갈피, 즐겨찾기]
  lock: [잠금, 읽기 전용]
  comment: [주석, 주석 처리, 주석 토글]
  change case: [대/소문자 바꾸기, 대/소문자 변경, 대문자로, 소문자로]
  paragraph: [단락, 문단]
  alignment: [텍스트 맞춤, 왼쪽 맞춤, 가운데 맞춤, 오른쪽 맞춤, 양쪽 맞춤]
  styles: [스타일, 셀 스타일]
  share: [공유, 링크 복사]
  insert: [삽입, 추가, 행 삽입]
  bold: [굵게]
  italic: [기울임꼴]
  underline: [밑줄]
  superscript: [위 첨자]
  subscript: [아래 첨자]
  paint: [서식 복사]
