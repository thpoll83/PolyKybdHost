# Russian. Menu labels that mean each concept, as applications show them in Russian.
# Format and matching rules: polyhost/services/shortcut_icons.py,
# "Labels in other languages".
concepts:
  save: [сохранить]
  save as: [сохранить как, сохранить копию, сохранить все, сохранить всё]
  open: [открыть, открыть файл, недавние, недавние файлы, загрузить]
  new: [создать, новый, новый документ, новый файл, новая вкладка, создать документ]
  print: [печать, печатать, напечатать, предварительный просмотр печати, предпросмотр печати]
  reload: [обновить, перезагрузить, обновить страницу]
  cut: [вырезать]
  copy: [копировать, дублировать, дублировать строку, скопировать]
  paste: [вставить, специальная вставка]
  undo: [отменить, отменить действие]
  redo: [вернуть, повторить]
  delete: [удалить, очистить, стереть, удалить строку]
  select all: [выделить все, выделить всё, выбрать все, выбрать всё, выделить]
  find: [найти, поиск, искать, найти на странице, подсветить все]
  find next: [найти далее, найти следующее, найти предыдущее, найти ещё, найти снова]
  replace: [заменить, найти и заменить]
  go to: [перейти, перейти к, перейти к строке]
  fullscreen: [полноэкранный режим, полноэкранного режима, во весь экран, на весь экран]
  minimize: [свернуть окно]
  hide: [скрыть, скрыть остальные]
  window: [новое окно, создать окно]
  zoom in: [увеличить, приблизить, увеличить масштаб, увеличить шрифт]
  zoom out: [уменьшить, отдалить, уменьшить масштаб, уменьшить шрифт]
  zoom reset: [сбросить масштаб, фактический размер, реальный размер, исходный размер, обычный размер, масштаб по умолчанию]
  up: [вверх, переместить вверх]
  down: [вниз, переместить вниз]
  left: [назад, предыдущий, предыдущая]
  right: [вперёд, вперед, следующий, следующая, далее]
  indent: [увеличить отступ]
  outdent: [уменьшить отступ]
  settings: [настройки, параметры, свойства, настроить]
  help: [справка, помощь, о программе, содержание, документация, сочетания клавиш, горячие клавиши, комбинации клавиш]
  close: [закрыть, закрыть вкладку, закрыть окно, закрыть документ, отмена]
  wrap text: [перенос по словам, перенос слов, переносить по словам, перенос строк, перенос текста]
  quit: [выход, выйти, завершить]
  bookmark: [закладка, добавить закладку, добавить в закладки, избранное, добавить в избранное]
  lock: [только для чтения, заблокировать, только чтение]
  comment: [комментарий, примечание, закомментировать, раскомментировать]
  change case: [регистр, изменить регистр, верхний регистр, нижний регистр]
  paragraph: [абзац]
  alignment: [выровнять, выравнивание]
  styles: [стили, стиль]
  share: [поделиться, копировать ссылку]
  insert: [добавить, вставить строку, вставить столбец]
  bold: [полужирный, жирный]
  italic: [курсив]
  underline: [подчеркнутый, подчёркнутый, подчеркивание, подчёркивание]
  superscript: [надстрочный, верхний индекс, надстрочный индекс]
  subscript: [подстрочный, нижний индекс, подстрочный индекс]
  paint: [формат по образцу, копировать формат]
