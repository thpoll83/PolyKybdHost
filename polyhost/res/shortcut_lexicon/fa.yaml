# Persian. Menu labels that mean each concept, as applications show them in Persian.
# Format and matching rules: polyhost/services/shortcut_icons.py,
# "Labels in other languages".
# A zero-width non-joiner (ZWNJ) splits a word in two when normalized, on the label
# and on these phrases alike.
concepts:
  save: [ذخیره, ذخیره کردن]
  save as: [ذخیره با نام, ذخیره به عنوان, ذخیره همه, ذخیره به شکل, ذخیره به نام, ذخیره یک رونوشت]
  open: [باز کردن, بازکردن, باز کردن پرونده, گشودن, گشودن پرونده]
  new: [جدید, پرونده جدید, سند جدید]
  print: [چاپ, پیش‌نمایش چاپ]
  reload: [بارگذاری مجدد, تازه‌سازی, بازیابی, نوسازی, بازخوانی, بار کردن مجدد]
  cut: [برش, بریدن]
  copy: [رونوشت, کپی]
  paste: [چسباندن, جای گذاری]
  undo: [واگرد, خنثی‌سازی]
  redo: [ازنو, انجام دوباره]
  delete: [حذف, پاک کردن]
  select all: [انتخاب همه, گزینش همه, انتخاب]
  find: [جستجو, یافتن, پیدا کردن, جست وجو]
  find next: [یافتن بعدی, یافتن قبلی, جستجوی بعدی, یافتن پیشین]
  replace: [جایگزینی, جایگزین کردن, جای گزینی, جست وجو و جایگزینی]
  go to: [برو به, رفتن به, رفتن به خط]
  fullscreen: [تمام صفحه, بیشینه, حداکثر کردن]
  minimize: [کمینه, حداقل کردن]
  hide: [پنهان کردن, پنهان, مخفی کردن, نهفتن]
  window: [پنجره جدید]
  zoom in: [بزرگ‌نمایی, زوم به داخل, بزرگ نمایی به داخل, بزرگنمایی]
  zoom out: [کوچک‌نمایی, بزرگ نمایی به خارج, زوم به خارج]
  zoom reset: [اندازه واقعی, اندازه عادی, بازنشانی بزرگ نمایی]
  up: [بالا]
  down: [پایین]
  left: [بازگشت, عقب, قبلی]
  right: [جلو, بعدی]
  indent: [افزایش تورفتگی, تورفتگی]
  outdent: [کاهش تورفتگی]
  settings: [تنظیمات, ترجیحات, گزینه‌ها, پیکربندی, ویژگی‌ها]
  help: [راهنما, درباره, میان‌برهای صفحه‌کلید, کمک, راه نما, میانبرهای صفحه کلید]
  close: [بستن, بستن زبانه, بستن پنجره, لغو]
  quit: [خروج, ترک]
  bookmark: [نشانک, نشانک‌ها, علاقه‌مندی‌ها]
  lock: [قفل, فقط خواندنی]
  paragraph: [پاراگراف]
  alignment: [تراز, ترازبندی]
  styles: [سبک‌ها]
  share: [هم‌رسانی, اشتراک‌گذاری, پیوند]
  insert: [درج, افزودن]
  bold: [پررنگ]
  italic: [کج, ایتالیک]
  underline: [زیرخط, زیرخط دار]
  superscript: [بالانویس, بالانویسه]
  subscript: [زیرنویسه]
