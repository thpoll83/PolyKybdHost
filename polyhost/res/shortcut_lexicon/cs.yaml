# Czech. Menu labels that mean each concept, as applications show them in Czech.
# Format and matching rules: polyhost/services/shortcut_icons.py,
# "Labels in other languages".
concepts:
  save: [uložit]
  save as: [uložit jako, uložit kopii, uložit vše]
  open: [otevřít, otevřít soubor, otevřít nedávné, nedávno otevřené, otevřít znovu, znovu otevřít, načíst]
  new: [nový, nová, nové, nový dokument, nový soubor, nová karta, nový panel]
  print: [tisk, tisknout, vytisknout, náhled tisku]
  reload: [obnovit, znovu načíst, aktualizovat]
  cut: [vyjmout]
  copy: [kopírovat, duplikovat, duplikovat řádek]
  paste: [vložit, vložit jinak]
  undo: [vrátit zpět]
  redo: [znovu, opakovat]
  delete: [odstranit, smazat, vymazat, odstranit řádek, smazat řádek]
  select all: [vybrat vše, označit vše, vybrat]
  find: [najít, hledat, vyhledat, zvýraznit vše]
  find next: [najít další, najít předchozí, najít znovu, hledat další, hledat předchozí]
  replace: [nahradit, najít a nahradit]
  go to: [přejít na, přejít na řádek, jít na]
  fullscreen: [celá obrazovka, na celou obrazovku, celou obrazovku, režim celé obrazovky, maximalizovat]
  minimize: [minimalizovat]
  hide: [skrýt, skrýt ostatní]
  window: [nové okno]
  zoom in: [přiblížit, zvětšit, zvětšit písmo]
  zoom out: [oddálit, zmenšit, zmenšit písmo]
  zoom reset: [skutečná velikost, původní velikost, normální velikost, výchozí velikost, obnovit přiblížení, obnovit velikost]
  up: [nahoru, posunout nahoru, přesunout nahoru]
  down: [dolů, posunout dolů, přesunout dolů]
  left: [předchozí, dozadu]
  right: [další, vpřed, dopředu]
  indent: [zvětšit odsazení]
  outdent: [zmenšit odsazení]
  settings: [nastavení, předvolby, možnosti, vlastnosti, konfigurovat]
  help: [nápověda, o aplikaci, o programu, obsah, dokumentace, klávesové zkratky, co je to]
  close: [zavřít, zavřít panel, zavřít kartu, zavřít okno, zavřít dokument, zrušit]
  wrap text: [zalamovat text, zalamování řádků, zalamovat řádky, zalomit text, zalamování textu]
  quit: [ukončit]
  bookmark: [přidat záložku, přidat do záložek, oblíbené, přidat do oblíbených]
  lock: [jen pro čtení, pouze pro čtení, zamknout]
  comment: [komentář, nový komentář, vložit komentář, zakomentovat, odkomentovat]
  change case: [změnit velikost písmen, velikost písmen, velká písmena, malá písmena]
  paragraph: [odstavec]
  alignment: [zarovnat, zarovnání]
  styles: [styly, styl, styly buněk]
  share: [sdílet, kopírovat odkaz]
  insert: [přidat, vložit řádek, vložit sloupec]
  bold: [tučné, tučně, tučný]
  italic: [kurzíva]
  underline: [podtržení, podtržené, podtrhnout]
  superscript: [horní index]
  subscript: [dolní index]
  paint: [kopírovat formát]
