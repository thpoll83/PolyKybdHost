# Vietnamese. Menu labels that mean each concept, as applications show them in
# Vietnamese.
# Format and matching rules: polyhost/services/shortcut_icons.py,
# "Labels in other languages".
# Both tone-mark placements are listed where both are in use (xóa / xoá).
concepts:
  save: [lưu, lưu tệp, lưu tập tin]
  save as: [lưu thành, lưu dưới dạng, lưu bản sao, lưu tất cả, lưu như]
  open: [mở, mở tệp, mở tập tin, mở gần đây, mở tệp gần đây]
  new: [mới, tạo mới, tệp mới, tập tin mới, tài liệu mới]
  print: [xem trước khi in, xem trước bản in]
  reload: [tải lại, làm mới, hoàn nguyên, khôi phục]
  cut: [cắt]
  copy: [sao chép, nhân bản]
  paste: [dán, dán đặc biệt]
  undo: [hoàn tác]
  redo: [làm lại, lặp lại]
  delete: [xóa, xoá, xóa dòng, xoá dòng]
  select all: [chọn tất cả, chọn toàn bộ, chọn]
  find: [tìm, tìm kiếm]
  find next: [tìm tiếp, tìm tiếp theo, tìm kế tiếp]
  replace: [thay thế, tìm và thay thế]
  go to: [đi tới, đi đến, chuyển đến, đi tới dòng]
  fullscreen: [toàn màn hình]
  hide: [ẩn, ẩn cửa sổ, ẩn các mục khác]
  window: [cửa sổ mới]
  zoom reset: [kích thước thực, kích thước thật, đặt lại thu phóng]
  up: [lên, cuộn lên, di chuyển lên]
  down: [xuống, cuộn xuống, di chuyển xuống]
  left: [quay lại, trở lại, lùi, trước]
  right: [tiến, chuyển tiếp, tiếp theo]
  indent: [tăng thụt lề, thụt lề]
  outdent: [giảm thụt lề]
  settings: [cài đặt, tùy chọn, tuỳ chọn, thuộc tính, thiết lập]
  help: [trợ giúp, giới thiệu, phím tắt]
  close: [đóng, đóng tab, đóng thẻ, đóng cửa sổ, hủy, huỷ]
  quit: [thoát, thoát khỏi]
  bookmark: [dấu trang, đánh dấu, yêu thích]
  lock: [khóa, khoá, chỉ đọc]
  comment: [chú thích, bình luận, nhận xét, bỏ chú thích]
  change case: [thay đổi chữ hoa chữ thường, đổi kiểu chữ]
  paragraph: [đoạn văn]
  alignment: [căn chỉnh, căn lề]
  styles: [kiểu]
  share: [chia sẻ, liên kết, sao chép liên kết]
  insert: [chèn, thêm]
  bold: [đậm, in đậm]
  italic: [nghiêng, in nghiêng]
  underline: [gạch chân, gạch dưới]
  superscript: [chỉ số trên]
  subscript: [chỉ số dưới]
  paint: [bút định dạng, sao chép định dạng]
