# Turkish. Menu labels that mean each concept, as applications show them in Turkish.
# Format and matching rules: polyhost/services/shortcut_icons.py,
# "Labels in other languages".
concepts:
  save: [kaydet, dosyayı kaydet]
  save as: [farklı kaydet, bir kopya kaydet, kopyasını kaydet, tümünü kaydet]
  open: [aç, dosya aç, dosyayı aç, son kullanılanı aç]
  new: [yeni, yeni dosya, yeni belge]
  print: [yazdır, baskı önizleme, yazdırma önizlemesi]
  reload: [yenile, yeniden yükle, geri yükle]
  cut: [kes]
  copy: [kopyala, çoğalt, satırı çoğalt]
  paste: [yapıştır, özel yapıştır]
  undo: [geri al]
  redo: [yinele, yeniden yap]
  delete: [sil, satırı sil, temizle]
  select all: [tümünü seç, seç]
  find: [bul, ara]
  find next: [sonrakini bul, öncekini bul, sonraki bul, önceki bul]
  replace: [bul ve değiştir, tümünü değiştir]
  go to: [satıra git, şuraya git]
  fullscreen: [tam ekran, ekranı kapla]
  minimize: [simge durumuna küçült]
  hide: [gizle, diğerlerini gizle]
  window: [yeni pencere]
  zoom in: [yakınlaştır]
  zoom out: [uzaklaştır]
  zoom reset: [gerçek boyut, yakınlaştırmayı sıfırla]
  up: [yukarı, yukarı kaydır, yukarı taşı]
  down: [aşağı, aşağı kaydır, aşağı taşı]
  left: [geri, önceki]
  right: [ileri, sonraki]
  indent: [girintiyi artır, girinti]
  outdent: [girintiyi azalt]
  settings: [ayarlar, tercihler, seçenekler, özellikler, yapılandır]
  help: [yardım, hakkında, klavye kısayolları, içindekiler]
  close: [kapat, sekmeyi kapat, pencereyi kapat, iptal]
  quit: [çık, çıkış]
  bookmark: [yer imi, yer imlerine ekle, favori, sık kullanılanlar]
  lock: [kilitle, salt okunur]
  comment: [yorum, yorum ekle]
  change case: [büyük küçük harf değiştir, büyük harfe çevir, küçük harfe çevir]
  paragraph: [paragraf]
  alignment: [hizala, hizalama]
  styles: [stiller, stil]
  share: [paylaş, bağlantıyı kopyala]
  insert: [ekle, satır ekle, sütun ekle]
  bold: [kalın]
  italic: [italik]
  underline: [altı çizili]
  superscript: [üst simge]
  subscript: [alt simge]
  paint: [biçim boyacısı]
