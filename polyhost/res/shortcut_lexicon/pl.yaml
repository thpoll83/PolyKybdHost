# Polish. Menu labels that mean each concept, as applications show them in Polish.
# Format and matching rules: polyhost/services/shortcut_icons.py,
# "Labels in other languages".
concepts:
  save: [zapisz]
  save as: [zapisz jako, zapisz kopię, zapisz wszystko]
  open: [otwórz, otwórz plik, otwórz ostatnie, ostatnio otwierane, wczytaj]
  new: [nowy, nowa, nowe, nowy dokument, nowy plik, nowa karta]
  print: [drukuj, podgląd wydruku]
  reload: [odśwież, przeładuj, wczytaj ponownie, załaduj ponownie, przywróć]
  cut: [wytnij]
  copy: [kopiuj, duplikuj, duplikuj wiersz]
  paste: [wklej, wklej specjalnie]
  undo: [cofnij]
  redo: [ponów, powtórz]
  delete: [usuń, wyczyść, usuń wiersz]
  select all: [zaznacz wszystko, wybierz wszystko, zaznacz]
  find: [znajdź, szukaj, wyszukaj, podświetl wszystkie]
  find next: [znajdź następny, znajdź następne, znajdź poprzedni, znajdź poprzednie, znajdź ponownie, szukaj dalej]
  replace: [zamień, znajdź i zamień]
  go to: [przejdź do, przejdź do wiersza, idź do]
  fullscreen: [pełny ekran, tryb pełnoekranowy, maksymalizuj]
  minimize: [minimalizuj]
  hide: [ukryj, ukryj pozostałe, ukryj inne]
  window: [nowe okno]
  zoom in: [powiększ, przybliż, zwiększ czcionkę, zwiększ rozmiar czcionki]
  zoom out: [pomniejsz, oddal, zmniejsz czcionkę, zmniejsz rozmiar czcionki]
  zoom reset: [rzeczywisty rozmiar, oryginalny rozmiar, normalny rozmiar, domyślny rozmiar, resetuj powiększenie, przywróć powiększenie, rozmiar rzeczywisty]
  up: [w górę, przenieś w górę, przesuń w górę]
  down: [w dół, przenieś w dół, przesuń w dół]
  left: [wstecz, poprzedni, poprzednia]
  right: [dalej, naprzód, następny, następna]
  indent: [zwiększ wcięcie]
  outdent: [zmniejsz wcięcie]
  settings: [ustawienia, preferencje, opcje, właściwości, konfiguruj]
  help: [pomoc, o programie, zawartość, dokumentacja, skróty klawiszowe, co to jest]
  close: [zamknij, zamknij kartę, zamknij okno, zamknij dokument, anuluj]
  wrap text: [zawijanie wierszy, zawijaj wiersze, zawijaj tekst, zawijanie tekstu, zawiń tekst]
  quit: [zakończ, wyjdź, zakończ program]
  bookmark: [dodaj zakładkę, dodaj do zakładek, ulubione, dodaj do ulubionych]
  lock: [tylko do odczytu, zablokuj]
  comment: [komentarz, skomentuj, wstaw komentarz, nowy komentarz, odkomentuj]
  change case: [zmień wielkość liter, wielkość liter, wielkie litery, małe litery]
  paragraph: [akapit]
  alignment: [wyrównaj, wyrównanie]
  styles: [styl, style komórki, style komórek]
  share: [udostępnij, kopiuj link, kopiuj łącze]
  insert: [wstaw, dodaj, wstaw wiersz, wstaw kolumnę]
  bold: [pogrubienie, pogrubiony, pogrubiona]
  italic: [kursywa]
  underline: [podkreślenie, podkreślony, podkreśl]
  superscript: [indeks górny]
  subscript: [indeks dolny]
  paint: [malarz formatów, kopiuj formatowanie]
