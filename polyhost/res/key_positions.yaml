# Key names for the split72, for the MCP server's key tools
# (docs/mcp-server-plan.md -> Identifying a key). Read by services/key_names.py.
#
# FROZEN. Written once on 2026-11-27 from the KiCad boards
# (PolyKybd/poly_kybd/poly_kybd_split72_left.kicad_pcb and _right, footprints
# SW_K_<n>) and checked against the KLE file res/polykybd-split72.json. Never
# rename a key, also not after a board revision: an assistant or a user may have
# written a name down. tests/services/key_names_test.py compares this file with
# the KLE file's row,col labels.
#
# A name is <half>:<X>.<Y>. L is the left half, R the right half. X counts the
# columns from the outer edge towards the middle, Y the rows from the top of that
# column, both from 1. Column 8 starts at row 3 (the key over the expansion port).
# The value is the matrix [row, col] that the control socket's keymap methods use.
split72:
  keys:
    "L:1.1": [0, 0]
    "L:2.1": [0, 1]
    "L:3.1": [0, 2]
    "L:4.1": [0, 3]
