[build-system]
requires = ["hatchling>=1.5.0", "jupyterlab>=4.0.0,<5", "hatch-nodejs-version>=0.3.2", "hatch-jupyter-builder>=0.5"]
build-backend = "hatchling.build"

[project]
name = "polykybd_jupyterlab"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
]
dependencies = ["jupyter_server>=2.0.1,<3"]
dynamic = ["version", "description", "authors", "urls", "keywords"]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls", "keywords"]

[tool.hatch.build.targets.sdist]
artifacts = ["polykybd_jupyterlab/labextension"]
exclude = [".github", "node_modules"]

[tool.hatch.build.targets.wheel.shared-data]
"polykybd_jupyterlab/labextension" = "share/jupyter/labextensions/polykybd-jupyterlab-context-reporter"
"install.json" = "share/jupyter/labextensions/polykybd-jupyterlab-context-reporter/install.json"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"

# The prebuilt labextension is committed, so `pip install .` needs no Node.js:
# the build step is skipped while its output exists.
[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = ["polykybd_jupyterlab/labextension/package.json"]
skip-if-exists = ["polykybd_jupyterlab/labextension/package.json"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build"
npm = ["npm"]
source_dir = "src"
build_dir = "polykybd_jupyterlab/labextension"
