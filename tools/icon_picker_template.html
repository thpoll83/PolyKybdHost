<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>/*TITLE*/</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --line:#30343c; --text:#e6e6e6; --dim:#9aa0a8; --accent:#e8a23a; --pick:#3ab0e8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  button, select, input[type=text], input[type=number] { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:5px 9px; font:inherit; }
  button { cursor:pointer; }
  button.on { border-color:var(--accent); color:var(--accent); }
  .wrap { display:grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 52px); }
  nav { border-right:1px solid var(--line); overflow-y:auto; max-height: calc(100vh - 52px); position:sticky; top:52px; }
  nav .k { display:flex; gap:8px; align-items:center; padding:5px 10px; cursor:pointer; border-bottom:1px solid #1b1e23; }
  nav .k:hover { background:#1a1d22; }
  nav .k.sel { background:#222832; }
  nav .k canvas { flex:none; image-rendering:pixelated; border:1px solid var(--line); }
  nav .k .t { font-size:12px; }
  nav .k .t b { display:block; font-weight:600; }
  nav .k .t span { color:var(--dim); }
  nav .k.done .t b::after { content:" ✓"; color:var(--pick); }
  main { padding:14px 18px; }
  .cards { display:flex; flex-wrap:wrap; gap:12px; }
  .card { background:var(--panel); border:2px solid var(--line); border-radius:6px; padding:6px; cursor:pointer; }
  .card.pick { border-color:var(--pick); }
  .card.edit { box-shadow: 0 0 0 2px var(--accent) inset; }
  .card canvas { display:block; image-rendering:pixelated; }
  .card .cap { font-size:12px; color:var(--dim); margin-top:4px; max-width:288px; }
  .card.pick .cap { color:var(--pick); }
  .params { margin-top:16px; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; max-width:900px; }
  .params h3 { margin:0 0 8px; font-size:14px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap:8px 18px; }
  .row { display:grid; grid-template-columns: 90px 1fr 46px; gap:8px; align-items:center; font-size:13px; }
  .row input[type=range] { width:100%; }
  .row .v { color:var(--accent); font-variant-numeric: tabular-nums; text-align:right; }
  .stages { display:flex; flex-wrap:wrap; gap:16px; margin:4px 0 14px; align-items:flex-end; }
  .stages figure { margin:0; }
  .stages canvas { display:block; image-rendering:pixelated; border:1px solid var(--line); background:#000; }
  .stages figcaption { font-size:12px; color:var(--dim); margin-top:4px; max-width:240px; }
  .hint { color:var(--dim); font-size:12px; margin:6px 0 12px; }
  .overview { display:grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap:10px; }
  .overview div { font-size:11px; color:var(--dim); }
  .overview canvas { display:block; image-rendering:pixelated; border:1px solid var(--line); cursor:pointer; }
  textarea { width:100%; height:300px; background:#0e1013; color:#cfe; border:1px solid var(--line); border-radius:4px; font:12px/1.35 ui-monospace, monospace; padding:8px; }
  .actions { display:flex; gap:8px; margin:8px 0 16px; flex-wrap:wrap; }
  @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } nav { position:static; max-height:260px; } }
</style>
</head>
<body>
<header>
  <h1>/*TITLE*/</h1>
  <span id="tabs"></span>
  <button id="btnOverview">Overview</button>
  <button id="btnExport">Export picks</button>
</header>
<div class="wrap">
  <nav id="keys"></nav>
  <main id="main"></main>
</div>
<script>
const DATA = /*DATA*/null;
// ---------------------------------------------------------------- decoding

const PAL = b64(DATA.palette);
const PICS = {}; for (const [id, p] of Object.entries(DATA.pics)) PICS[id] = { w: p.w, h: p.h, idx: b64(p.idx) };

// ---------------------------------------------------------------- state
const STORE = DATA.store;
let state = { overlay: DATA.overlays[0].id, key: 0, view: "key", picks: {} };

const save = () => { try { localStorage.setItem(STORE, JSON.stringify({ picks: state.picks })); } catch (e) {} };

function entry(ov, k) {               // {pick: index (-1 = shipped), params: [per candidate]}
  const id = ov + "/" + keyId(k);
  if (!state.picks[id]) state.picks[id] = { pick: null, params: {} };
  const e = state.picks[id];
  k.candidates.forEach((c, i) => { if (!e.params[i]) e.params[i] = JSON.parse(JSON.stringify(c.params)); });

// ---------------------------------------------------------------- image helpers

}

let STAGE = null;                    // what the last render saw, for the editor's stage view

function ditherCore(g, cov, p, region) {   // fit, sharpen, stretch, dither inside a lit outline (dither.keycap)

function regionOf(k, p) { return [p.rw ?? k.region[0], p.rh ?? k.region[1]]; }

  const out = new Uint8Array(W * H); let bw, bh, bx, by;
  if (word) { bw = W; bh = H; bx = 0; by = 0; }
  else { const r = regionOf(k, p); bw = Math.min(r[0], W); bh = Math.min(r[1], H); const a = k.anchor.toLowerCase(), mg = k.margin;
    bx = a.includes("right") ? W - bw - mg : a.includes("left") ? mg : Math.floor((W - bw) / 2);
    by = a.includes("bottom") ? H - bh - mg : a.includes("top") ? mg : Math.floor((H - bh) / 2); bx = Math.max(0, bx); by = Math.max(0, by); }
  const w = Math.min(m.w, bw), h = Math.min(m.h, bh), va = p.valign || "top";
  const oy = by + (va === "bottom" ? bh - h - (word ? 1 : 0) : va === "centre" ? Math.floor((bh - h) / 2) : 0), ox = bx + bw - w;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (m.a[y * m.w + (m.w - w) + x] > 0.5) out[(oy + y) * W + ox + x] = 1;
  return out;
}
function courtyard(mask) {           // port of tools/courtyard_preview.py courtyard_current
  const cl = new Uint8Array(W * H);
  const line = (fr, to, row) => { if (row >= 0 && row < H) for (let x = Math.max(0, fr); x < Math.min(W, to); x++) cl[row * W + x] = 1; };
  let first = 127, last = 0, numEmpty = 0, prevEmpty = true, top = 0;
  for (let by = 0; by < H; by++) {
    numEmpty++;
    for (let bx = 0; bx < W; bx++) if (mask[by * W + bx]) { first = Math.min(bx - 3, first); last = Math.max(bx + 3, last); numEmpty = 0; }
    if (first !== 127) {
      if (numEmpty === 0) {
        top = prevEmpty ? 0 : (top < 3 ? top + 1 : 3);
        if (top === 0) { line(first + 16, last - 16, by - 2); line(first + 12, last - 12, by - 1); }
        const inset = [8, 4, 2, 0][top]; line(first + inset, last - inset, by); prevEmpty = false;
      } else { numEmpty = Math.min(numEmpty, 6); line(first, last, by); prevEmpty = true; }
      const d = 2 ** (numEmpty + 1); first += d; last -= d;
      if (first >= last) { first = 127; last = 0; numEmpty = 0; }
    }
  }
  return cl;
}
function iconFor(k, ci, p) {
  if (ci < 0) return k.shippedM;
  const c = k.candidates[ci];
  if (c.kind === "word") return place(k, renderWord(p), p, true);
  if (c.kind === "vector") return place(k, renderVector(VECS[c.src], p, regionOf(k, p)), p, false);
  const pic = PICS[c.src], r = regionOf(k, p);
  return place(k, p.engine === "dither" ? renderDither(pic, p, r) : renderPixel(pic, p, r), p, false);
}
function keycap(k, icon) { const cy = courtyard(icon), o = new Uint8Array(W * H); for (let i = 0; i < W * H; i++) o[i] = icon[i] || (k.legendM[i] && !cy[i]) ? 1 : 0; return o; }
function draw(canvas, m, sc) {
  canvas.width = W * sc; canvas.height = H * sc; const c = canvas.getContext("2d"); c.fillStyle = "#000"; c.fillRect(0, 0, W * sc, H * sc); c.fillStyle = "#fff";
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (m[y * W + x]) c.fillRect(x * sc, y * sc, sc, sc);
}

function fitScale(w, h, bw, bh) { return Math.max(1, Math.min(Math.floor(bw / w), Math.floor(bh / h))); }
function drawOriginal(canvas, st) {      // the game's picture, background that is cut away dimmed
  const sc = fitScale(st.w, st.h, 240, 150); canvas.width = st.w * sc; canvas.height = st.h * sc;
  const c = canvas.getContext("2d"); c.fillStyle = "#000"; c.fillRect(0, 0, canvas.width, canvas.height);
  const WORD = ["#000", "#fff", "#888", "#4a8cff"];
  for (let y = 0; y < st.h; y++) for (let x = 0; x < st.w; x++) { const i = y * st.w + x;
    if (st.word) c.fillStyle = WORD[st.word[i]] || "#000";
    else if (st.shaded) { const q = st.cover[i] ? Math.round(st.shaded[i] * 255) : 0; c.fillStyle = st.cover[i] ? `rgb(${q},${q},${q})` : "#1b2a3a"; }
    else { const v = st.I[i]; c.fillStyle = `rgb(${PAL[3 * v]},${PAL[3 * v + 1]},${PAL[3 * v + 2]})`; }
    c.fillRect(x * sc, y * sc, sc, sc);
    if (st.cover && !st.cover[i] && !st.shaded) { c.fillStyle = "rgba(0,0,0,0.7)"; c.fillRect(x * sc, y * sc, sc, sc); } }
}
function drawGrey(canvas, g) {            // after the filters, before the dither
  const sc = fitScale(g.w, g.h, 240, 150); canvas.width = g.w * sc; canvas.height = g.h * sc;
  const c = canvas.getContext("2d");
  for (let y = 0; y < g.h; y++) for (let x = 0; x < g.w; x++) { const i = y * g.w + x;
    if (!g.a[i]) c.fillStyle = "#3a1010";
    else if (g.out[i]) c.fillStyle = "#ffd24a";
    else { const q = Math.round(Math.min(1, Math.max(0, g.v[i])) * 255); c.fillStyle = `rgb(${q},${q},${q})`; }
    c.fillRect(x * sc, y * sc, sc, sc); }
}

// ---------------------------------------------------------------- parameter editor
const FIELDS = {
  dither: [["mode", "select", ["levels", "fs", "bayer", "threshold"], "Dither"], ["lo", "range", [0, 45, 1], "Black at %"], ["hi", "range", [55, 100, 1], "White at %"],
           ["gamma", "range", [0.3, 2.5, 0.05], "Gamma"], ["curve", "range", [0, 1.5, 0.05], "S-curve"], ["sharpen", "range", [0, 3, 0.1], "Sharpen"],
           ["floor", "range", [0, 0.5, 0.01], "Floor"], ["thr", "range", [0.1, 0.9, 0.02], "Threshold"], ["outline", "check", null, "Outline"],
           ["cut", "check", null, "Cut background"], ["frame", "range", [0, 3, 1], "Frame crop"], ["mirror", "check", null, "Mirror"],
           ["rw", "range", [16, 72, 1], "Width"], ["rh", "range", [10, 40, 1], "Height"], ["valign", "select", ["top", "centre", "bottom"], "Align"]],
  vector: [["relief", "check", null, "Relief"], ["depth", "range", [0.02, 0.25, 0.01], "Edge slope"], ["azimuth", "range", [0, 345, 15], "Light from °"],
           ["elevation", "range", [10, 80, 2], "Light height °"], ["ambient", "range", [0, 0.8, 0.05], "Ambient"], ["falloff", "range", [0, 1, 0.05], "Falloff"],
           ["grain", "range", [0, 3, 0.1], "Grain"], ["seed", "range", [1, 20, 1], "Grain seed"], ["flat", "range", [0, 1, 0.05], "Flat grey"],
           ["mode", "select", ["levels", "fs", "bayer", "threshold"], "Dither"], ["lo", "range", [0, 45, 1], "Black at %"], ["hi", "range", [55, 100, 1], "White at %"],
           ["gamma", "range", [0.3, 2.5, 0.05], "Gamma"], ["curve", "range", [0, 1.5, 0.05], "S-curve"], ["sharpen", "range", [0, 3, 0.1], "Sharpen"],
           ["floor", "range", [0, 0.5, 0.01], "Floor"], ["thr", "range", [0.1, 0.9, 0.02], "Threshold"], ["outline", "check", null, "Outline"],
           ["mirror", "check", null, "Mirror"], ["rw", "range", [16, 72, 1], "Width"], ["rh", "range", [10, 40, 1], "Height"],
           ["valign", "select", ["top", "centre", "bottom"], "Align"]],
  pixel: [["lit", "select", ["edge+bright", "nonzero", "centre", "darker", "brighter"], "Lit pixels"], ["pct", "range", [5, 95, 1], "Percentile"],
          ["scale", "range", [0, 5, 1], "Scale (0 auto)"], ["mirror", "check", null, "Mirror"], ["rw", "range", [16, 72, 1], "Width"],
          ["rh", "range", [10, 40, 1], "Height"], ["valign", "select", ["top", "centre", "bottom"], "Align"]],
  word: [["text", "text", null, "Text"], ["font", "select", ["8p", "6p"], "Font"], ["body", "check", null, "Body"], ["shade", "check", null, "Shade"],
         ["outline", "check", null, "Outline"], ["gap", "range", [0, 3, 1], "Letter gap"], ["scale", "range", [1, 3, 1], "Scale"],
         ["valign", "select", ["top", "centre", "bottom"], "Align"]],
};
function editor(k, ci, e, onChange) {
  const box = document.createElement("div"); box.className = "params";
  const c = k.candidates[ci], p = e.params[ci], kind = c.kind === "pic" ? p.engine : c.kind;
  box.innerHTML = `<h3>${c.label}</h3><div class="hint">Changes apply to this candidate on this key. Double-click a setting's name to reset only that setting.</div>`;
  const top = document.createElement("div"); top.className = "actions";
  const reset = document.createElement("button"); reset.textContent = "Reset to suggested values";
  reset.onclick = () => { e.params[ci] = JSON.parse(JSON.stringify(c.params)); onChange(true); };
  top.appendChild(reset); box.appendChild(top);
  const stages = document.createElement("div"); stages.className = "stages";
  const fig = (title) => { const f = document.createElement("figure"), cv = document.createElement("canvas"), cap = document.createElement("figcaption");
    cap.textContent = title; f.append(cv, cap); stages.appendChild(f); return cv; };
  const cvOrig = fig(c.kind === "word" ? "Font glyphs: body white, shade grey, outline blue"
    : c.kind === "vector" ? "SVG silhouette, shaded (relief or flat grey)" : "Original picture (dimmed: background that is cut away)");
  const cvGrey = fig(c.kind === "word" ? "Lit pixels" : (c.kind === "vector" || p.engine === "dither") ? "After the filters, before the dither (yellow: outline, red: not drawn)" : "Lit pixels, before scaling");
  const cvCap = fig("On the keycap");
  box.appendChild(stages);
  const refresh = () => { const icon = iconFor(k, ci, p); const st = STAGE;
    if (st) { drawOriginal(cvOrig, st); if (st.grey) drawGrey(cvGrey, st.grey); }
    draw(cvCap, keycap(k, icon), 3); };
  const change = full => { onChange(full); if (!full) refresh(); };
  const grid = document.createElement("div"); grid.className = "grid"; box.appendChild(grid);
  if (c.kind === "pic") {
    const row = document.createElement("label"); row.className = "row";
    row.innerHTML = `<span>Engine</span><select><option>dither</option><option>pixel</option></select><span></span>`;
    const s = row.querySelector("select"); s.value = p.engine;
    s.onchange = () => { p.engine = s.value; const d = { dither: { mode: "levels", lo: 5, hi: 95, gamma: 1, curve: 0.3, sharpen: 1, floor: 0.15, outline: true, cut: true, frame: 1 }, pixel: { lit: "edge+bright", scale: 0 } }[s.value];
      for (const [kk, vv] of Object.entries(d)) if (p[kk] === undefined) p[kk] = vv; change(true); };
    grid.appendChild(row);
  }
  for (const [f, type, opt, lab] of FIELDS[kind]) {
    const row = document.createElement("label"); row.className = "row";
    let val = p[f]; if (f === "rw") val = val ?? k.region[0]; if (f === "rh") val = val ?? k.region[1];
    if (f === "valign") val = val ?? "top"; if (f === "thr") val = val ?? 0.5; if (f === "pct") val = val ?? 50; if (f === "gap") val = val ?? 1;
    if (type === "range") {
      row.innerHTML = `<span>${lab}</span><input type="range" min="${opt[0]}" max="${opt[1]}" step="${opt[2]}"><span class="v"></span>`;
      const i = row.querySelector("input"), v = row.querySelector(".v"); i.value = val; v.textContent = val;
      i.oninput = () => { p[f] = parseFloat(i.value); v.textContent = i.value; change(false); };
    } else if (type === "select") {
      row.innerHTML = `<span>${lab}</span><select>${opt.map(o => `<option>${o}</option>`).join("")}</select><span></span>`;
      const s = row.querySelector("select"); s.value = val; s.onchange = () => { p[f] = s.value; change(false); };
    } else if (type === "check") {
      row.innerHTML = `<span>${lab}</span><input type="checkbox"><span></span>`;
      const i = row.querySelector("input"); i.checked = !!val; i.onchange = () => { p[f] = i.checked; change(false); };
    } else {
      row.innerHTML = `<span>${lab}</span><input type="text"><span></span>`;
      const i = row.querySelector("input"); i.value = val; i.oninput = () => { p[f] = i.value; change(false); };
    }
    const name = row.querySelector("span"); name.title = "Double-click: reset to the suggested value"; name.style.cursor = "help";
    name.ondblclick = ev => { ev.preventDefault(); if (c.params[f] === undefined) delete p[f]; else p[f] = JSON.parse(JSON.stringify(c.params[f])); change(true); };
    grid.appendChild(row);
  }
  const acts = document.createElement("div"); acts.className = "actions";
  if (c.kind !== "word") {
    const all = document.createElement("button");
    all.textContent = c.kind === "vector" ? "Use these settings for every re-rasterized icon on this overlay" : "Use these settings for every picture on this overlay";
    all.onclick = () => { const ov = DATA.overlays.find(o => o.id === state.overlay);
      for (const kk of ov.keys) { const ee = entry(ov.id, kk); kk.candidates.forEach((cc, j) => { if (cc.kind === c.kind && (c.kind === "vector" || ee.params[j].engine === p.engine)) {
        const keep = { mirror: ee.params[j].mirror, rw: ee.params[j].rw, rh: ee.params[j].rh, crop: ee.params[j].crop, smooth_w: ee.params[j].smooth_w, lit: ee.params[j].lit };
        ee.params[j] = Object.assign(JSON.parse(JSON.stringify(p)), Object.fromEntries(Object.entries(keep).filter(([, v]) => v !== undefined))); } }); }
      change(true); };
    acts.appendChild(all);
  }
  box.appendChild(acts);
  refresh();
  return box;
}

// ---------------------------------------------------------------- views
let editIdx = null;
function render() {
  const ov = DATA.overlays.find(o => o.id === state.overlay);
  document.getElementById("tabs").innerHTML = "";
  for (const o of DATA.overlays) { const b = document.createElement("button"); b.textContent = o.title; b.className = o.id === state.overlay && state.view !== "export" ? "on" : "";
    b.onclick = () => { state.overlay = o.id; state.key = 0; state.view = "key"; editIdx = null; render(); }; document.getElementById("tabs").appendChild(b); }
  const nav = document.getElementById("keys"); nav.innerHTML = "";
  ov.keys.forEach((k, i) => { const e = entry(ov.id, k), d = document.createElement("div");
    d.className = "k" + (i === state.key && state.view === "key" ? " sel" : "") + (e.pick !== null ? " done" : "");
    const cv = document.createElement("canvas"); const ci = e.pick ?? -1; draw(cv, keycap(k, iconFor(k, ci, e.params[ci])), 1);
    const t = document.createElement("div"); t.className = "t"; t.innerHTML = `<b>${keyId(k).replace(/ \(.*/, "")}</b><span>${k.label}</span>`;
    d.append(cv, t); d.onclick = () => { state.key = i; state.view = "key"; editIdx = null; render(); }; nav.appendChild(d); });
  const main = document.getElementById("main"); main.innerHTML = "";
  if (state.view === "overview") return overview(main, ov);
  if (state.view === "export") return exportView(main);
  const k = ov.keys[state.key], e = entry(ov.id, k);
  main.insertAdjacentHTML("beforeend", `<h2 style="margin:0 0 4px;font-size:18px">${keyId(k)}: ${k.label}</h2>
    <div class="hint">Click a keycap to pick it (blue). The picked one opens its settings below; click another to compare. Lit pixels are white, as on the keycap; the legend is cleared around the icon the way the firmware does it.</div>`);
  const cards = document.createElement("div"); cards.className = "cards"; main.appendChild(cards);
  const list = [[-1, "shipped icon (no game file)"], ...k.candidates.map((c, i) => [i, c.label])];
  const canv = {};
  for (const [ci, lab] of list) {
    const card = document.createElement("div"); card.className = "card" + ((e.pick ?? -1) === ci && e.pick !== null ? " pick" : "") + (editIdx === ci ? " edit" : "");
    const cv = document.createElement("canvas"); draw(cv, keycap(k, iconFor(k, ci, e.params[ci])), 4); canv[ci] = cv;
    const cap = document.createElement("div"); cap.className = "cap"; cap.textContent = lab;
    card.append(cv, cap); card.onclick = () => { e.pick = ci; editIdx = ci >= 0 ? ci : null; save(); render(); }; cards.appendChild(card);
  }
  if (editIdx !== null && editIdx >= 0) main.appendChild(editor(k, editIdx, e, full => { save();
    if (full) return render(); draw(canv[editIdx], keycap(k, iconFor(k, editIdx, e.params[editIdx])), 4); }));
}
function overview(main, ov) {
  main.insertAdjacentHTML("beforeend", `<h2 style="margin:0 0 8px;font-size:18px">${ov.title}: every key as picked</h2><div class="hint">Keys without a pick show the shipped icon. Click a key to edit it.</div>`);
  const g = document.createElement("div"); g.className = "overview"; main.appendChild(g);
  ov.keys.forEach((k, i) => { const e = entry(ov.id, k), ci = e.pick ?? -1, d = document.createElement("div"), cv = document.createElement("canvas");
    draw(cv, keycap(k, iconFor(k, ci, e.params[ci])), 2); d.append(cv, document.createTextNode(`${keyId(k)} ${ci < 0 ? "(shipped)" : k.candidates[ci].label}`));
    cv.onclick = () => { state.key = i; state.view = "key"; editIdx = e.pick ?? null; render(); }; g.appendChild(d); });
}
function exportView(main) {
  const out = {};
  for (const ov of DATA.overlays) { out[ov.id] = {};
    for (const k of ov.keys) { const e = entry(ov.id, k); if (e.pick === null) continue; const id = keyId(k);
      if (e.pick < 0) { out[ov.id][id] = { pick: "shipped" }; continue; }
      const c = k.candidates[e.pick]; out[ov.id][id] = { pick: c.label, src: c.src || null, params: e.params[e.pick] }; } }
  const n = Object.values(out).reduce((s, o) => s + Object.keys(o).length, 0);
  main.insertAdjacentHTML("beforeend", `<h2 style="margin:0 0 4px;font-size:18px">Export</h2><div class="hint">${n} keys picked. Copy this and paste it into the chat.</div>`);
  const ta = document.createElement("textarea"); ta.value = JSON.stringify(out, null, 1); main.appendChild(ta);
  const acts = document.createElement("div"); acts.className = "actions";
  const copy = document.createElement("button"); copy.textContent = "Copy"; copy.onclick = async () => { try { await navigator.clipboard.writeText(ta.value); copy.textContent = "Copied"; } catch (err) { ta.select(); document.execCommand("copy"); copy.textContent = "Copied"; } };
  const clear = document.createElement("button"); clear.textContent = "Clear all picks"; clear.onclick = () => { if (confirm("Clear every pick and setting?")) { state.picks = {}; save(); render(); } };
  acts.append(copy, clear); main.appendChild(acts);
}
document.getElementById("btnOverview").onclick = () => { state.view = "overview"; render(); };
document.getElementById("btnExport").onclick = () => { state.view = "export"; render(); };
render();
</script>
